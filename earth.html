<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Little Earth</title>
  <style>
    :root {
      --sky: #070b1a;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      background: var(--sky);
      color: #fff;
      touch-action: manipulation;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .home {
      position: fixed; top: 14px; left: 14px; z-index: 5;
      color: #fff; text-decoration: none; font-weight: 800; font-size: 18px;
      background: rgba(255,255,255,.16); padding: 8px 14px; border-radius: 999px;
    }
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(2px 2px at 20% 30%, #fff, transparent),
        radial-gradient(2px 2px at 80% 20%, #fff, transparent),
        radial-gradient(1px 1px at 50% 80%, #fff, transparent),
        radial-gradient(2px 2px at 10% 70%, #cde, transparent),
        radial-gradient(1px 1px at 70% 50%, #fff, transparent),
        radial-gradient(2px 2px at 40% 10%, #fff, transparent);
      opacity: .55;
      animation: twinkle 4s ease-in-out infinite;
    }
    @keyframes twinkle { 50% { opacity: .25; } }

    .screen {
      position: relative;
      z-index: 1;
      width: min(520px, 100vw);
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 28px;
      text-align: center;
      gap: 14px;
    }
    .screen.on { display: flex; }

    h1 {
      font-size: clamp(42px, 10vw, 64px);
      letter-spacing: -1px;
      text-shadow: 0 6px 0 #3b1d8f;
    }
    .sub { font-size: 22px; opacity: .9; }
    .btn {
      border: 0;
      background: #ffd166;
      color: #3b2100;
      font: inherit;
      font-weight: 800;
      font-size: 32px;
      padding: 16px 36px;
      border-radius: 999px;
      box-shadow: 0 8px 0 #e09f1f;
      cursor: pointer;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #e09f1f; }
    .btn.ghost {
      background: #7bed9f;
      box-shadow: 0 8px 0 #2ed573;
      color: #063;
    }

    #hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 800;
    }
    #era-title { font-size: clamp(26px, 6vw, 34px); text-shadow: 0 3px 0 rgba(0,0,0,.35); }
    #era-line { font-size: 20px; min-height: 2.4em; }

    .stage {
      position: relative;
      width: min(360px, 86vw);
      height: min(360px, 86vw);
      margin: 6px 0 8px;
    }
    #earth {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      overflow: hidden;
      background: #1d4ed8;
      box-shadow:
        0 0 0 12px rgba(125, 211, 252, .12),
        0 20px 40px rgba(0,0,0,.45),
        inset -18px -10px 30px rgba(0,0,0,.28);
      transition: box-shadow 1.1s ease, transform .35s ease;
    }
    #earth.pop { animation: pop .35s ease; }
    @keyframes pop { 50% { transform: scale(1.07); } }
    #earth.morph { animation: morph 1.1s ease; }
    @keyframes morph {
      0% { transform: scale(.92) rotate(-8deg); filter: brightness(1.2); }
      55% { transform: scale(1.06) rotate(6deg); }
      100% { transform: scale(1) rotate(0); filter: none; }
    }
    #earth > i {
      position: absolute; inset: 0; border-radius: 50%;
      pointer-events: none;
      transition: opacity 1.15s ease, transform 1.15s ease, filter 1.15s ease;
    }
    .lava {
      background:
        radial-gradient(circle at 32% 28%, #ffe08a, #ff6a00 38%, #b91c1c 68%, #450a0a);
      opacity: 1;
    }
    .ocean {
      background: radial-gradient(circle at 30% 28%, #7dd3fc, #2563eb 48%, #1e3a8a);
      opacity: 0;
    }
    .land {
      background:
        radial-gradient(ellipse 28% 34% at 28% 42%, #4d7c0f 0 70%, transparent 71%),
        radial-gradient(ellipse 18% 22% at 22% 28%, #65a30d 0 60%, transparent 61%),
        radial-gradient(ellipse 32% 24% at 72% 38%, #3f6212 0 65%, transparent 66%),
        radial-gradient(ellipse 20% 28% at 78% 62%, #4d7c0f 0 60%, transparent 61%),
        radial-gradient(ellipse 16% 14% at 48% 72%, #854d0e 0 55%, transparent 56%),
        radial-gradient(ellipse 14% 18% at 58% 22%, #166534 0 55%, transparent 56%);
      opacity: 0;
      transform: scale(.35);
    }
    .clouds {
      background:
        radial-gradient(ellipse 40% 12% at 40% 30%, rgba(255,255,255,.7) 0 40%, transparent 41%),
        radial-gradient(ellipse 30% 10% at 70% 58%, rgba(255,255,255,.55) 0 40%, transparent 41%),
        radial-gradient(ellipse 24% 8% at 30% 70%, rgba(255,255,255,.45) 0 40%, transparent 41%);
      opacity: 0;
    }
    .ash {
      background: radial-gradient(circle at 40% 40%, #e2e8f0, #64748b 40%, #0f172a);
      opacity: 0;
    }
    .shine {
      background: radial-gradient(circle at 30% 24%, rgba(255,255,255,.4), transparent 42%);
      opacity: .9;
    }

    /* 0 hot rock */
    #earth[data-era="0"] { box-shadow: 0 0 0 14px rgba(255,100,40,.28), 0 20px 40px rgba(0,0,0,.45); }
    #earth[data-era="0"] .lava { opacity: 1; }
    #earth[data-era="0"] .ocean, #earth[data-era="0"] .land, #earth[data-era="0"] .clouds, #earth[data-era="0"] .ash { opacity: 0; }

    /* 1 water floods */
    #earth[data-era="1"] .lava { opacity: .15; }
    #earth[data-era="1"] .ocean { opacity: 1; }
    #earth[data-era="1"] .land, #earth[data-era="1"] .clouds, #earth[data-era="1"] .ash { opacity: 0; }

    /* 2 tiny life — blue, faint specks */
    #earth[data-era="2"] .lava { opacity: 0; }
    #earth[data-era="2"] .ocean { opacity: 1; }
    #earth[data-era="2"] .land { opacity: .18; transform: scale(.2); filter: hue-rotate(40deg); }
    #earth[data-era="2"] .clouds, #earth[data-era="2"] .ash { opacity: 0; }

    /* 3 fish — deep ocean */
    #earth[data-era="3"] .ocean { opacity: 1; }
    #earth[data-era="3"] .land { opacity: .12; transform: scale(.22); }
    #earth[data-era="3"] .lava, #earth[data-era="3"] .clouds, #earth[data-era="3"] .ash { opacity: 0; }

    /* 4 bugs — first islands */
    #earth[data-era="4"] .ocean { opacity: 1; }
    #earth[data-era="4"] .land { opacity: .45; transform: scale(.45); }
    #earth[data-era="4"] .lava, #earth[data-era="4"] .clouds, #earth[data-era="4"] .ash { opacity: 0; }

    /* 5 frogs — more land */
    #earth[data-era="5"] .ocean { opacity: 1; }
    #earth[data-era="5"] .land { opacity: .6; transform: scale(.62); }
    #earth[data-era="5"] .lava, #earth[data-era="5"] .clouds, #earth[data-era="5"] .ash { opacity: 0; }

    /* 6 trees — continents grow */
    #earth[data-era="6"] .ocean { opacity: 1; }
    #earth[data-era="6"] .land { opacity: .85; transform: scale(.82); }
    #earth[data-era="6"] .clouds { opacity: .15; }
    #earth[data-era="6"] .lava, #earth[data-era="6"] .ash { opacity: 0; }

    /* 7 dinos — lush */
    #earth[data-era="7"] .ocean { opacity: 1; }
    #earth[data-era="7"] .land { opacity: 1; transform: scale(.95); }
    #earth[data-era="7"] .clouds { opacity: .25; }
    #earth[data-era="7"] .lava, #earth[data-era="7"] .ash { opacity: 0; }

    /* 8 meteor dust */
    #earth[data-era="8"] .ocean { opacity: .55; }
    #earth[data-era="8"] .land { opacity: .4; transform: scale(.95); filter: grayscale(.6); }
    #earth[data-era="8"] .ash { opacity: .75; }
    #earth[data-era="8"] .clouds { opacity: .5; }
    #earth[data-era="8"] .lava { opacity: 0; }

    /* 9 birds — recovering */
    #earth[data-era="9"] .ocean { opacity: 1; }
    #earth[data-era="9"] .land { opacity: .95; transform: scale(1); }
    #earth[data-era="9"] .clouds { opacity: .45; }
    #earth[data-era="9"] .ash { opacity: .08; }
    #earth[data-era="9"] .lava { opacity: 0; }

    /* 10 animals — almost today */
    #earth[data-era="10"] .ocean { opacity: 1; }
    #earth[data-era="10"] .land { opacity: 1; transform: scale(1); }
    #earth[data-era="10"] .clouds { opacity: .55; }
    #earth[data-era="10"] .ash, #earth[data-era="10"] .lava { opacity: 0; }
    #earth[data-era="10"] { box-shadow: 0 0 0 14px rgba(125,211,252,.22), 0 20px 40px rgba(0,0,0,.45); }

    /* 11 people — Earth now */
    #earth[data-era="11"] .ocean { opacity: 1; }
    #earth[data-era="11"] .land { opacity: 1; transform: scale(1); }
    #earth[data-era="11"] .clouds { opacity: .7; }
    #earth[data-era="11"] .ash, #earth[data-era="11"] .lava { opacity: 0; }
    #earth[data-era="11"] { box-shadow: 0 0 0 16px rgba(186,230,253,.28), 0 20px 40px rgba(0,0,0,.45); }

    #bits { position: absolute; inset: 0; }
    .bit {
      position: absolute;
      font-size: 46px;
      line-height: 1;
      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      box-shadow: none;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,.25));
      animation: floaty 2.4s ease-in-out infinite;
      transition: transform .12s;
    }
    .bit:active { transform: scale(1.25); }
    .bit.gone { animation: burst .28s forwards; pointer-events: none; }
    @keyframes floaty {
      0%,100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-10px) rotate(6deg); }
    }
    @keyframes burst {
      to { transform: scale(1.6); opacity: 0; }
    }

    #bar-wrap {
      width: min(360px, 86vw);
      height: 22px;
      background: rgba(255,255,255,.18);
      border-radius: 999px;
      overflow: hidden;
    }
    #bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffd166, #7bed9f);
      border-radius: inherit;
      transition: width .25s;
    }
    #hint { font-size: 18px; opacity: .85; min-height: 1.4em; }

    #win h1 { text-shadow: 0 6px 0 #0b6; }
    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .confetti i {
      position: absolute;
      top: -20px;
      font-size: 22px;
      animation: fall 3.2s linear infinite;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <a class="home" href="index.html">← Home</a>
  <div id="stars"></div>

  <section id="start" class="screen on">
    <div style="font-size:72px">🌍</div>
    <h1>Little Earth</h1>
    <p class="sub">Tap the sparkles.<br>Help the world grow!</p>
    <button class="btn" id="play">Play!</button>
  </section>

  <section id="game" class="screen">
    <div id="hud">
      <span id="step">1 / 12</span>
      <span id="score">⭐ 0</span>
    </div>
    <div id="era-title">Hot rock</div>
    <div id="era-line">Earth is a big glowing ball.</div>
    <div class="stage">
      <div id="earth" data-era="0">
        <i class="lava"></i>
        <i class="ocean"></i>
        <i class="land"></i>
        <i class="clouds"></i>
        <i class="ash"></i>
        <i class="shine"></i>
      </div>
      <div id="bits"></div>
    </div>
    <div id="bar-wrap"><div id="bar"></div></div>
    <div id="hint">Tap the ⭐</div>
  </section>

  <section id="win" class="screen">
    <div class="confetti" id="confetti"></div>
    <div style="font-size:72px">🌏✨</div>
    <h1>You made the world!</h1>
    <p class="sub">From a hot rock to fish, frogs, dinos, and us.<br>That took a looooong time.</p>
    <button class="btn ghost" id="again">Play again</button>
  </section>

  <script>
    const eras = [
      { title: "Hot rock", line: "Earth starts red-hot.", hint: "Tap the ⭐", skin: "e-rock", emojis: ["⭐"], need: 4, say: "Sparkle!" },
      { title: "Water!", line: "Rain fills the oceans.", hint: "Tap the 💧", skin: "e-water", emojis: ["💧"], need: 4, say: "Splash!" },
      { title: "Tiny life", line: "Teeny tiny bugs wake up.", hint: "Tap the ✨", skin: "e-life", emojis: ["✨"], need: 4, say: "Glow!" },
      { title: "Fish!", line: "The sea is full of swimmers.", hint: "Tap the fish", skin: "e-fish", emojis: ["🐟","🐠","🐡"], need: 5, say: "Swim!" },
      { title: "Bugs!", line: "Little crawlers take the land.", hint: "Tap the bugs", skin: "e-life", emojis: ["🐛","🦋","🐞"], need: 5, say: "Buzz!" },
      { title: "Frogs!", line: "Hop from water to land.", hint: "Tap the 🐸", skin: "e-water", emojis: ["🐸"], need: 5, say: "Hop!" },
      { title: "Trees!", line: "Green things climb onto land.", hint: "Tap the 🌱", skin: "e-trees", emojis: ["🌱","🌳"], need: 5, say: "Grow!" },
      { title: "Dinos!", line: "Giant friends stomp around.", hint: "Tap the dinos", skin: "e-dino", emojis: ["🦕","🦖"], need: 5, say: "Stomp!" },
      { title: "Whoosh rock", line: "A space rock zooms by. Dinos wave bye!", hint: "Tap the ☄️", skin: "e-boom", emojis: ["☄️"], need: 4, say: "Whoosh!" },
      { title: "Birds!", line: "Wings in the sky.", hint: "Tap the birds", skin: "e-animals", emojis: ["🐦","🐧","🦅"], need: 5, say: "Flap!" },
      { title: "Animals!", line: "So many friends now.", hint: "Tap the animals", skin: "e-animals", emojis: ["🦊","🐻","🐰","🐘","🦒","🐱","🐶","🐷"], need: 8, say: "Boop!" },
      { title: "People!", line: "This is Earth now. That's us!", hint: "Tap the 🏠", skin: "e-people", emojis: ["🏠"], need: 5, say: "Home!" }
    ];

    const $ = (id) => document.getElementById(id);
    const earth = $("earth");
    const bits = $("bits");
    let i = 0, got = 0, stars = 0, spawnTimer;

    function beep(freq, t) {
      try {
        const ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.12, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t);
        o.connect(g); g.connect(ac.destination);
        o.start(); o.stop(ac.currentTime + t);
      } catch (e) {}
    }

    function show(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.remove("on"));
      $(id).classList.add("on");
    }

    function startGame() {
      i = 0; got = 0; stars = 0;
      $("score").textContent = "⭐ 0";
      show("game");
      loadEra();
      beep(440, 0.12);
    }

    function loadEra() {
      const e = eras[i];
      got = 0;
      $("step").textContent = (i + 1) + " / " + eras.length;
      $("era-title").textContent = e.title;
      $("era-line").textContent = e.line;
      $("hint").textContent = e.hint;
      $("bar").style.width = "0%";
      earth.dataset.era = String(i);
      earth.classList.remove("morph");
      void earth.offsetWidth;
      earth.classList.add("morph");
      setTimeout(() => earth.classList.remove("morph"), 1100);
      bits.innerHTML = "";
      clearInterval(spawnTimer);
      spawn();
      spawnTimer = setInterval(spawn, 700);
    }

    function spawn() {
      const e = eras[i];
      if (!e) return;
      if (bits.children.length > 7) return;
      const el = document.createElement("button");
      el.className = "bit";
      el.type = "button";
      el.textContent = (e.emojis || [e.emoji])[Math.floor(Math.random() * (e.emojis || [e.emoji]).length)];
      el.style.left = (8 + Math.random() * 72) + "%";
      el.style.top = (8 + Math.random() * 72) + "%";
      el.addEventListener("pointerdown", (ev) => {
        ev.preventDefault();
        catchBit(el);
      });
      bits.appendChild(el);
      setTimeout(() => { if (el.parentNode && !el.classList.contains("gone")) el.remove(); }, 3200);
    }

    function catchBit(el) {
      if (el.classList.contains("gone")) return;
      el.classList.add("gone");
      setTimeout(() => el.remove(), 260);
      got++;
      stars++;
      $("score").textContent = "⭐ " + stars;
      $("bar").style.width = Math.min(100, (got / eras[i].need) * 100) + "%";
      $("hint").textContent = eras[i].say;
      earth.classList.add("pop");
      setTimeout(() => earth.classList.remove("pop"), 280);
      beep(520 + got * 40, 0.1);
      if (got >= eras[i].need) nextEra();
    }

    function nextEra() {
      clearInterval(spawnTimer);
      bits.innerHTML = "";
      beep(660, 0.15);
      setTimeout(() => beep(880, 0.18), 120);
      i++;
      if (i >= eras.length) {
        win();
      } else {
        setTimeout(loadEra, 450);
      }
    }

    function win() {
      show("win");
      const box = $("confetti");
      box.innerHTML = "";
      const bitsEmoji = ["⭐", "🌍", "🐟", "🌱", "🦕", "🦊", "🏠", "✨"];
      for (let n = 0; n < 24; n++) {
        const iel = document.createElement("i");
        iel.textContent = bitsEmoji[n % bitsEmoji.length];
        iel.style.left = (Math.random() * 100) + "%";
        iel.style.animationDelay = (Math.random() * 2) + "s";
        iel.style.animationDuration = (2.4 + Math.random() * 1.6) + "s";
        box.appendChild(iel);
      }
      beep(523, 0.15); setTimeout(() => beep(659, 0.15), 140); setTimeout(() => beep(784, 0.25), 280);
    }

    $("play").onclick = startGame;
    $("again").onclick = startGame;
  </script>
</body>
</html>
