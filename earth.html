<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Little Earth</title>
  <link rel="stylesheet" href="kid.css" />
  <style>
    html, body { background: #020617; }
    #tools button { background: #fff; }
    #tSun { background: #fde047; color: #78350f; }
    #tRain { background: #38bdf8; color: #082f49; }
    #tPlant { background: #86efac; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="eraN">🔥 Hot rock</b><b id="stars">⭐ 0</b></div>
  <div id="say">Tap Play to grow Earth</div>
  <div class="dock" id="tools">
    <button id="tSun"><span>☀️</span>Sun</button>
    <button id="tRain"><span>🌧️</span>Rain</button>
    <button id="tPlant"><span>🌱</span>Plant</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🌍</div>
    <h1>Little Earth</h1>
    <p>Warm the rock. Then fill the sea!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="cut">
    <div class="hero" id="cutE">🌊</div>
    <h1 id="cutT">Seas!</h1>
    <p id="cutP">Blue water wins.</p>
    <button class="play g" id="cutGo">Next</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🎉</div>
    <h1>Our Earth!</h1>
    <p id="winP">You grew the globe.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, era = 0, stars = 0, got = 0, tool = "sun", t = 0, last = 0;
    var rot = 0, drag = 0, lastX = 0, moved = 0;
    var life = [], flashes = [], rains = [];
    var CUT = [
      { e: "🌋", t: "Warm!", p: "The rock glows." },
      { e: "🌊", t: "Seas!", p: "Blue water wins." },
      { e: "🪷", t: "Plants!", p: "Lilies sit on waves." },
      { e: "🐟", t: "Fish!", p: "Friends in water." },
      { e: "🌿", t: "Kelp!", p: "Tall kelp in the sea." },
      { e: "🦕", t: "Dinos!", p: "Big pals swim." },
      { e: "🐦", t: "Birds!", p: "Wings over water." },
      { e: "🦊", t: "Pals!", p: "Friends on waves." },
      { e: "🧒", t: "Home!", p: "Kids come home." }
    ];
    var ERAS = [
      { n: "🔥 Hot rock", say: "Tap the rock with ☀️", need: 4, want: "sun" },
      { n: "🌊 Seas", say: "Rain on the sea!", need: 4, want: "rain" },
      { n: "🌱 Plants", say: "Plant little seeds!", need: 5, want: "plant" },
      { n: "🐟 Fish", say: "Tap the fish!", need: 5, want: "sun" },
      { n: "🌿 Kelp", say: "Grow tall kelp!", need: 5, want: "plant" },
      { n: "🦕 Dinos", say: "Boop big pals!", need: 5, want: "sun" },
      { n: "🐦 Birds", say: "Sun for wings!", need: 5, want: "sun" },
      { n: "🦊 Animals", say: "Tap swimming pals!", need: 5, want: "sun" },
      { n: "🧒 People", say: "Friends on waves!", need: 5, want: "sun" }
    ];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-earth") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = Math.floor(W * d); cv.height = Math.floor(H * d);
      cv.style.width = W + "px"; cv.style.height = H + "px";
      x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function save() { try { localStorage.setItem("alabryuu-earth", JSON.stringify({ stars: stars, era: era })); } catch (e) {} }
    function hud() {
      document.getElementById("eraN").textContent = ERAS[era] ? ERAS[era].n : "🌍 Home";
      document.getElementById("stars").textContent = "⭐ " + stars;
      document.getElementById("say").textContent = ERAS[era] ? ERAS[era].say : "Home!";
    }
    function cx() { return W * 0.5; }
    function cy() { return H * 0.44; }
    function R() { return Math.min(W, H) * 0.30; }
    function spawnEraLife() {
      life = [];
      var kinds = { 2: ["🪷", 4], 3: ["🐟", 5], 4: ["🌿", 5], 5: ["🦕", 3], 6: ["🐦", 4], 7: ["🦊", 4], 8: ["🧒", 3] };
      var spec = kinds[era];
      if (!spec) return;
      for (var i = 0; i < spec[1]; i++) life.push({ kind: spec[0], a: i * (Math.PI * 2 / spec[1]), bob: i });
    }
    function progress(n) {
      if (!play || !ERAS[era]) return;
      got += n; stars += n; save(); hud();
      if (got >= ERAS[era].need) {
        play = false;
        document.getElementById("cutE").textContent = CUT[era].e;
        document.getElementById("cutT").textContent = CUT[era].t;
        document.getElementById("cutP").textContent = CUT[era].p;
        document.getElementById("cut").classList.remove("off");
      }
    }
    function applyTool(px, py) {
      var dx = px - cx(), dy = py - cy(), hitR = R() * 1.4;
      if (dx * dx + dy * dy > hitR * hitR) {
        document.getElementById("say").textContent = "Tap the big globe!";
        return;
      }
      var want = ERAS[era].want;
      if (tool !== want) {
        document.getElementById("say").textContent = "Try the " + (want === "sun" ? "☀️ Sun" : want === "rain" ? "🌧️ Rain" : "🌱 Plant") + " button!";
        return;
      }
      if (tool === "sun") flashes.push({ x: px, y: py, life: 0.5 });
      else if (tool === "rain") rains.push({ x: px, y: py - 40, life: 0.8 });
      else life.push({ kind: era < 4 ? "🌱" : "🌿", a: rot + Math.atan2(dx, -dy), bob: t });
      progress(1);
    }
    function setTool(name) {
      tool = name;
      document.getElementById("tSun").classList.toggle("on", name === "sun");
      document.getElementById("tRain").classList.toggle("on", name === "rain");
      document.getElementById("tPlant").classList.toggle("on", name === "plant");
    }
    function start() {
      play = true; era = 0; got = 0; setTool("sun"); life = []; flashes = []; rains = [];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("cut").classList.add("off");
      document.getElementById("tools").classList.add("on");
      hud();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("cutGo").onclick = function () {
      document.getElementById("cut").classList.add("off");
      era++;
      if (era >= ERAS.length) {
        document.getElementById("winP").textContent = "⭐ " + stars + "  The globe is home.";
        document.getElementById("win").classList.remove("off");
        document.getElementById("tools").classList.remove("on");
        play = false;
      } else {
        got = 0; play = true; spawnEraLife();
        setTool(ERAS[era].want);
        hud(); save();
      }
    };
    document.getElementById("tSun").onclick = function () { setTool("sun"); };
    document.getElementById("tRain").onclick = function () { setTool("rain"); };
    document.getElementById("tPlant").onclick = function () { setTool("plant"); };
    cv.addEventListener("pointerdown", function (e) { drag = 1; lastX = e.clientX; moved = 0; });
    addEventListener("pointermove", function (e) {
      if (!drag) return;
      var dx = e.clientX - lastX;
      if (Math.abs(dx) > 14) { rot += dx * 0.012; lastX = e.clientX; moved = 1; }
    });
    addEventListener("pointerup", function (e) { if (!drag) return; drag = 0; if (play && !moved) applyTool(e.clientX, e.clientY); });
    addEventListener("pointercancel", function () { drag = 0; });
    function drawGlobe() {
      var gx = cx(), gy = cy(), r = R();
      x.save();
      x.beginPath(); x.arc(gx, gy, r, 0, Math.PI * 2); x.clip();
      if (era === 0) {
        x.fillStyle = "#7c2d12"; x.fillRect(gx - r, gy - r, r * 2, r * 2);
        for (var i = 0; i < 10; i++) {
          var ang = rot + i * 0.7;
          em(i % 2 ? "🔥" : "🪨", gx + Math.sin(ang) * r * 0.5, gy + Math.cos(ang * 1.1) * r * 0.45, 48);
        }
        em("🌋", gx, gy, 84);
      } else {
        x.fillStyle = "#0369a1"; x.fillRect(gx - r, gy - r, r * 2, r * 2);
        for (var j = 0; j < 12; j++) {
          var a2 = rot + j * 0.55;
          em("🌊", gx + Math.sin(a2) * r * 0.58, gy + Math.cos(a2 * 0.9) * r * 0.46, 52);
        }
      }
      x.restore();
      x.beginPath(); x.arc(gx, gy, r, 0, Math.PI * 2);
      x.strokeStyle = era === 0 ? "#ea580c" : "#7dd3fc"; x.lineWidth = 8; x.stroke();
    }
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      if (!drag) rot += dt * 0.15;
      x.fillStyle = "#020617"; x.fillRect(0, 0, W, H);
      var i;
      for (i = 0; i < 14; i++) em("✨", (i * 73 + rot * 20) % W, (i * 41) % (H * 0.88), 18);
      em("☀️", W * 0.14, 90, 56);
      em("🌙", W * 0.88, 100, 48);
      if (era >= 1) {
        em("☁️", W * 0.22 + Math.sin(t) * 8, 140, 56);
        em("☁️", W * 0.78, 160, 48);
      }
      drawGlobe();
      for (i = 0; i < life.length; i++) {
        var L = life[i], a = L.a + rot;
        em(L.kind, cx() + Math.sin(a) * R() * 0.72, cy() + Math.cos(a) * R() * 0.40 + Math.sin(t * 2 + L.bob) * 4, 56);
      }
      for (i = flashes.length - 1; i >= 0; i--) {
        flashes[i].life -= dt;
        x.globalAlpha = Math.max(0, flashes[i].life * 2);
        em("☀️", flashes[i].x, flashes[i].y, 64);
        if (flashes[i].life <= 0) flashes.splice(i, 1);
      }
      for (i = rains.length - 1; i >= 0; i--) {
        rains[i].life -= dt; rains[i].y += 70 * dt;
        x.globalAlpha = Math.max(0, rains[i].life);
        em("💧", rains[i].x, rains[i].y, 40);
        if (rains[i].life <= 0) rains.splice(i, 1);
      }
      x.globalAlpha = 1;
      requestAnimationFrame(loop);
    }
    hud();
    requestAnimationFrame(loop);
    if (/shot=ocean/.test(location.search)) { start(); era = 1; spawnEraLife(); setTool("rain"); hud(); }
  })();
  </script>
</body>
</html>
