<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Little Earth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      background: #050714; color: #fff; touch-action: none; user-select: none;
    }
    button {
      background: transparent; border: 0; appearance: none; -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer;
    }
    .home {
      position: fixed; top: 12px; left: 12px; z-index: 8;
      color: #fff; text-decoration: none; font-weight: 800; font-size: 17px;
      background: rgba(255,255,255,.14); padding: 8px 14px; border-radius: 999px;
      touch-action: manipulation;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #tools {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      z-index: 7; display: none; gap: 10px; align-items: center;
    }
    #tools.on { display: flex; }
    #tools button {
      width: 78px; height: 78px; border-radius: 22px; font-weight: 800; font-size: 13px;
      box-shadow: 0 6px 0 rgba(0,0,0,.35);
    }
    #tools button span { display: block; font-size: 30px; line-height: 1; }
    #tools button.on { outline: 4px solid #ffd166; transform: translateY(-4px); }
    #tSun { background: #fde047; color: #78350f; }
    #tRain { background: #38bdf8; color: #082f49; }
    #tPlant { background: #86efac; color: #14532d; }
    #hud {
      position: fixed; top: 12px; right: 12px; z-index: 7; text-align: right;
      font-weight: 800; pointer-events: none;
    }
    #hud b {
      display: inline-block; background: rgba(0,0,0,.4); padding: 6px 12px;
      border-radius: 999px; margin: 0 0 6px 6px; font-size: 15px;
    }
    #say {
      position: fixed; left: 50%; top: 58px; transform: translateX(-50%);
      z-index: 7; font-weight: 800; font-size: 20px; text-align: center;
      text-shadow: 0 3px 0 #000; pointer-events: none; min-height: 1.4em;
    }
    .cover {
      position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: 12px;
      padding: 24px 16px; background: radial-gradient(circle at 50% 30%, #312e81, #050714 70%);
    }
    .cover.off { display: none; }
    .cover h1 { font-size: clamp(40px, 10vw, 64px); text-shadow: 0 6px 0 #1e1b4b; }
    .cover p { font-size: 20px; opacity: .92; max-width: 320px; }
    .btn {
      background: #ffd166; color: #3b2100; font-weight: 800; font-size: 28px;
      padding: 14px 32px; border-radius: 999px; box-shadow: 0 8px 0 #e09f1f;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #e09f1f; }
    .btn.g { background: #86efac; box-shadow: 0 8px 0 #16a34a; color: #14532d; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <a class="home" href="index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="eraN">Era 1</b><b id="stars">⭐ 0</b><b id="combo"></b></div>
  <div id="say">Tap the hot rock!</div>
  <div id="tools">
    <button id="tSun"><span>☀️</span>Sun</button>
    <button id="tRain"><span>🌧️</span>Rain</button>
    <button id="tPlant"><span>🌱</span>Plant</button>
  </div>
  <div class="cover" id="title">
    <div style="font-size:84px">🌍</div>
    <h1>Little Earth</h1>
    <p>Grow a living world. Sun, rain, and seeds!</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="cut">
    <div id="cutArt" style="font-size:84px">💧</div>
    <h1 id="cutT">Water!</h1>
    <p id="cutP">Rain fills the seas.</p>
    <button class="btn g" id="cutGo">Next era</button>
  </div>
  <div class="cover off" id="win">
    <div style="font-size:84px">🌏</div>
    <h1>Our Earth!</h1>
    <p id="winP">You grew the whole world.</p>
    <div class="row">
      <button class="btn g" id="again">Play again</button>
    </div>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, playing = false;
    var tool = "sun", stars = 0, combo = 0, lastTap = 0, era = 0;
    var rot = 0, day = 0.15, weather = 0, shake = 0;
    var bits = [], walkers = [], rain = [], sparks = [], clouds = [], seeds = [];
    var lands = [], ocean = 0, lava = 1, trees = 0, houses = 0;
    var need = 0, got = 0, helper = { a: 0.2, kind: "☀️" };

    var ERAS = [
      { n: "Hot rock", say: "Tap sparks. Warm the rock!", need: 6, art: "🌋", next: "Rain is coming…" },
      { n: "Ocean", say: "Rain tool! Fill the sea.", need: 8, art: "🌊", next: "Tiny life wakes." },
      { n: "Tiny life", say: "Plant seeds in the wet.", need: 8, art: "✨", next: "Fish want a home." },
      { n: "Fish age", say: "Tap fish. Keep raining.", need: 10, art: "🐟", next: "Bugs crawl ashore." },
      { n: "Land life", say: "Grow trees. Tap frogs.", need: 10, art: "🐸", next: "Big steps…" },
      { n: "Dinos", say: "Boop dinos. Plant forests.", need: 10, art: "🦕", next: "A rock zooms by!" },
      { n: "Whoosh", say: "Tap the kind comet.", need: 6, art: "☄️", next: "Wings in the sky." },
      { n: "Birds", say: "Sun for the birds!", need: 10, art: "🐦", next: "So many pals." },
      { n: "Animals", say: "Tap pals. Grow homes.", need: 12, art: "🦊", next: "That's us!" },
      { n: "People", say: "Plant towns. Wave hello.", need: 10, art: "🏠", next: "Earth today." }
    ];

    function beep(f, d, typ) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = typ || "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.1, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.connect(g); g.connect(ac.destination);
        o.start(); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function resize() {
      W = cv.width = innerWidth; H = cv.height = innerHeight;
    }
    addEventListener("resize", resize); resize();

    function R() { return Math.min(W, H) * 0.28; }
    function CX() { return W * 0.5; }
    function CY() { return H * 0.48; }

    function spawnCloud() {
      clouds.push({
        a: Math.random() * Math.PI * 2,
        r: R() + 18 + Math.random() * 40,
        s: 0.12 + Math.random() * 0.2,
        w: 28 + Math.random() * 30
      });
    }
    function addLand() {
      lands.push({
        a: Math.random() * Math.PI * 2,
        w: 0.25 + Math.random() * 0.4,
        h: 0.18 + Math.random() * 0.22,
        grow: 0.05
      });
    }
    function addWalker(kind) {
      walkers.push({
        kind: kind,
        a: Math.random() * Math.PI * 2,
        v: (Math.random() < 0.5 ? -1 : 1) * (0.35 + Math.random() * 0.5),
        bob: Math.random() * 6,
        life: 1
      });
    }

    function loadEra() {
      var e = ERAS[era];
      need = e.need; got = 0;
      document.getElementById("eraN").textContent = "Era " + (era + 1);
      document.getElementById("say").textContent = e.say;
      if (era >= 1) ocean = Math.min(1, 0.35 + era * 0.08);
      if (era === 0) { lava = 1; ocean = 0; }
      else lava = Math.max(0, 0.85 - era * 0.12);
      if (era >= 4) while (lands.length < 3 + era) addLand();
      if (era >= 2 && walkers.length < 4) {
        var kinds = [["✨"], ["✨"], ["🐟", "🐠"], ["🐟", "🐠", "🐡"], ["🐸", "🐛"], ["🦕", "🦖"], ["☄️"], ["🐦", "🐧"], ["🦊", "🐻", "🐰"], ["🧒", "🏠"]];
        var k = kinds[Math.min(era, kinds.length - 1)];
        for (var i = 0; i < 3; i++) addWalker(k[i % k.length]);
      }
      while (clouds.length < 4 + era) spawnCloud();
    }

    function startGame() {
      playing = true; era = 0; stars = 0; combo = 0; rot = 0; day = 0.2;
      bits = []; walkers = []; rain = []; sparks = []; clouds = []; seeds = [];
      lands = []; ocean = 0; lava = 1; trees = 0; houses = 0; weather = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("cut").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("tools").classList.add("on");
      document.getElementById("stars").textContent = "⭐ 0";
      setTool("sun");
      loadEra();
      beep(440, 0.12);
    }

    function setTool(n) {
      tool = n;
      ["tSun", "tRain", "tPlant"].forEach(function (id) {
        document.getElementById(id).classList.toggle("on", id.toLowerCase().indexOf(n === "sun" ? "sun" : n === "rain" ? "rain" : "plant") >= 0);
      });
    }
    document.getElementById("tSun").onclick = function () { setTool("sun"); beep(660, 0.06); };
    document.getElementById("tRain").onclick = function () { setTool("rain"); beep(400, 0.06); };
    document.getElementById("tPlant").onclick = function () { setTool("plant"); beep(520, 0.06); };

    function bumpCombo() {
      var now = performance.now();
      combo = now - lastTap < 700 ? combo + 1 : 1;
      lastTap = now;
      document.getElementById("combo").textContent = combo >= 3 ? "Combo x" + combo : "";
      return combo >= 3 ? 2 : 1;
    }

    function progress(n) {
      got += n;
      stars += bumpCombo();
      document.getElementById("stars").textContent = "⭐ " + stars;
      shake = 8;
      if (got >= need) nextEra();
    }

    function nextEra() {
      playing = false;
      var e = ERAS[era];
      document.getElementById("cutArt").textContent = e.art;
      document.getElementById("cutT").textContent = e.n + "!";
      document.getElementById("cutP").textContent = e.next;
      document.getElementById("cut").classList.remove("off");
      beep(660, 0.12); setTimeout(function () { beep(880, 0.16); }, 120);
    }

    document.getElementById("cutGo").onclick = function () {
      era++;
      document.getElementById("cut").classList.add("off");
      if (era >= ERAS.length) {
        document.getElementById("winP").textContent = "⭐ " + stars + "  From hot rock to us.";
        document.getElementById("win").classList.remove("off");
        document.getElementById("tools").classList.remove("on");
        beep(523, 0.14); setTimeout(function () { beep(659, 0.14); }, 140);
        return;
      }
      playing = true;
      loadEra();
    };

    function tapAt(px, py) {
      if (!playing) return;
      var dx = px - CX(), dy = py - CY(), d = Math.hypot(dx, dy);
      var hitW = false;
      walkers.forEach(function (w) {
        var p = rim(w.a, 10);
        if (Math.hypot(px - p.x, py - p.y) < 36) {
          w.life = 0; hitW = true;
          sparks.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 80, vy: -80, life: 1, e: "⭐" });
          progress(1);
          beep(700, 0.08);
        }
      });
      if (hitW) return;
      if (d < R() + 40) {
        if (tool === "sun") {
          day = Math.min(1, day + 0.08);
          weather = Math.max(0, weather - 0.2);
          for (var i = 0; i < 8; i++) sparks.push({ x: px, y: py, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, life: 1, e: "✨" });
          if (era === 0 || era === 7 || era === 8) progress(1);
          else { stars += 1; document.getElementById("stars").textContent = "⭐ " + stars; }
          beep(820, 0.07);
        } else if (tool === "rain") {
          weather = Math.min(1, weather + 0.25);
          ocean = Math.min(1, ocean + 0.04);
          for (var r = 0; r < 16; r++) rain.push({ x: px + (Math.random() - 0.5) * 80, y: py - 40, vy: 180 + Math.random() * 80, life: 1 });
          if (era === 1 || era === 3) progress(1);
          else { stars += 1; document.getElementById("stars").textContent = "⭐ " + stars; }
          beep(320, 0.08, "triangle");
        } else {
          seeds.push({ x: px, y: py, a: Math.atan2(dy, dx), grow: 0 });
          trees++;
          if (era === 2 || era === 4 || era === 5 || era === 9) progress(1);
          else { stars += 1; document.getElementById("stars").textContent = "⭐ " + stars; }
          beep(500, 0.08);
          if (era >= 8 && Math.random() < 0.4) { houses++; addWalker("🏠"); }
        }
      } else {
        bits.push({ x: px, y: py, vx: (Math.random() - 0.5) * 20, vy: -30, e: "⭐", life: 1 });
        stars += bumpCombo();
        document.getElementById("stars").textContent = "⭐ " + stars;
        beep(600, 0.05);
      }
    }

    cv.addEventListener("pointerdown", function (e) {
      if (e.target.closest && e.target.closest("a,button")) return;
      tapAt(e.clientX, e.clientY);
    });

    function rim(a, extra) {
      extra = extra || 0;
      return { x: CX() + Math.cos(a + rot) * (R() + extra), y: CY() + Math.sin(a + rot) * (R() + extra) };
    }

    function update(dt) {
      t += dt;
      rot += dt * 0.12;
      day = (day + dt * 0.04) % 1;
      helper.a += dt * 0.35;
      if (shake > 0) shake *= 0.86;
      if (playing && Math.random() < dt * 1.2) {
        bits.push({
          x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 20,
          vy: 30 + Math.random() * 40, e: era === 0 ? "⭐" : (era === 6 ? "☄️" : "✨"), life: 1
        });
      }
      bits.forEach(function (b) {
        b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt * 0.25;
      });
      bits = bits.filter(function (b) { return b.life > 0 && b.y < H + 20; });
      walkers.forEach(function (w) {
        w.a += w.v * dt * 0.4; w.bob += dt * 6; w.life -= w.life < 1 ? dt * 3 : 0;
      });
      walkers = walkers.filter(function (w) { return w.life > 0; });
      if (playing && walkers.length < 3 + Math.min(era, 5) && Math.random() < dt * 0.8) {
        var pool = ["✨", "🐟", "🐸", "🦕", "🐦", "🦊", "🧒"];
        addWalker(pool[Math.min(era, pool.length - 1)]);
      }
      rain.forEach(function (r) { r.y += r.vy * dt; r.life -= dt; });
      rain = rain.filter(function (r) { return r.life > 0 && r.y < H; });
      sparks.forEach(function (s) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 80 * dt; s.life -= dt * 1.4; });
      sparks = sparks.filter(function (s) { return s.life > 0; });
      clouds.forEach(function (c) { c.a += c.s * dt * 0.3; });
      seeds.forEach(function (s) { s.grow = Math.min(1, s.grow + dt * 0.8); });
      lands.forEach(function (L) { L.grow = Math.min(1, L.grow + dt * 0.15); });
      if (weather > 0.4 && Math.random() < dt * 14) {
        rain.push({ x: CX() + (Math.random() - 0.5) * R() * 2.2, y: CY() - R() - 30, vy: 220, life: 0.8 });
      }
    }

    function skyColor() {
      var d = Math.sin(day * Math.PI * 2);
      if (d > 0.35) return ["#7dd3fc", "#38bdf8"];
      if (d > 0) return ["#fb923c", "#7c2d12"];
      if (d > -0.4) return ["#1e1b4b", "#0f172a"];
      return ["#020617", "#0b1026"];
    }

    function drawPlanet() {
      var cx = CX() + (Math.random() - 0.5) * shake * 0.2;
      var cy = CY() + (Math.random() - 0.5) * shake * 0.2;
      var r = R();
      x.save();
      x.translate(cx, cy);
      x.rotate(rot);
      var g = x.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      if (lava > 0.5) { g.addColorStop(0, "#ffe08a"); g.addColorStop(0.5, "#ea580c"); g.addColorStop(1, "#450a0a"); }
      else { g.addColorStop(0, "#7dd3fc"); g.addColorStop(0.45, "#2563eb"); g.addColorStop(1, "#1e3a8a"); }
      x.fillStyle = g;
      x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.fill();
      if (ocean > 0 && lava > 0.1) {
        x.globalAlpha = 1 - lava;
        x.fillStyle = "#1d4ed8";
        x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.fill();
        x.globalAlpha = 1;
      }
      lands.forEach(function (L) {
        x.save();
        x.rotate(L.a);
        x.fillStyle = era >= 8 ? "#3f6212" : "#65a30d";
        x.beginPath();
        x.ellipse(r * 0.35, 0, r * L.w * L.grow, r * L.h * L.grow, 0, 0, Math.PI * 2);
        x.fill();
        x.restore();
      });
      seeds.forEach(function (s) {
        x.save();
        x.rotate(s.a);
        x.font = (18 + s.grow * 16) + "px serif";
        x.fillText(s.grow > 0.6 ? "🌳" : "🌱", r * 0.72, 8);
        x.restore();
      });
      x.fillStyle = "rgba(255,255,255,0.25)";
      x.beginPath(); x.ellipse(-r * 0.35, -r * 0.4, r * 0.28, r * 0.14, -0.4, 0, Math.PI * 2); x.fill();
      x.restore();
      x.strokeStyle = "rgba(125,211,252,0.25)";
      x.lineWidth = 10;
      x.beginPath(); x.arc(cx, cy, r + 8, 0, Math.PI * 2); x.stroke();
      x.strokeStyle = "rgba(186,230,253,0.12)";
      x.lineWidth = 18;
      x.beginPath(); x.arc(cx, cy, r + 22, 0, Math.PI * 2); x.stroke();
      if (era >= 9) {
        x.fillStyle = "#fde68a";
        for (var li = 0; li < 8; li++) {
          var la = li * 0.7 + rot;
          x.globalAlpha = 0.35 + 0.35 * Math.abs(Math.sin(t * 3 + li));
          x.beginPath();
          x.arc(cx + Math.cos(la) * r * 0.55, cy + Math.sin(la) * r * 0.45, 2, 0, Math.PI * 2);
          x.fill();
        }
        x.globalAlpha = 1;
      }
    }

    function draw() {
      var sky = skyColor();
      var grd = x.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, sky[0]); grd.addColorStop(1, sky[1]);
      x.fillStyle = grd; x.fillRect(0, 0, W, H);
      for (var i = 0; i < 40; i++) {
        var sx = (i * 97 + t * 8) % W, sy = (i * 53) % (H * 0.7);
        x.globalAlpha = 0.25 + 0.5 * Math.abs(Math.sin(t + i));
        x.fillStyle = "#fff";
        x.fillRect(sx, sy, 2, 2);
      }
      x.globalAlpha = 1;
      var sunA = day * Math.PI * 2;
      x.font = "40px serif";
      x.fillText("☀️", CX() + Math.cos(sunA) * (R() + 90) - 16, CY() + Math.sin(sunA) * (R() + 70));
      x.fillText("🌙", CX() + Math.cos(sunA + Math.PI) * (R() + 90) - 16, CY() + Math.sin(sunA + Math.PI) * (R() + 70));
      clouds.forEach(function (c) {
        var p = { x: CX() + Math.cos(c.a) * c.r, y: CY() + Math.sin(c.a) * c.r * 0.7 };
        x.globalAlpha = 0.75;
        x.font = c.w + "px serif";
        x.fillText("☁️", p.x, p.y);
      });
      x.globalAlpha = 1;
      drawPlanet();
      walkers.forEach(function (w) {
        var p = rim(w.a, 16 + Math.sin(w.bob) * 4);
        x.save();
        x.globalAlpha = Math.max(0, w.life);
        x.translate(p.x, p.y);
        x.rotate(w.a + rot + Math.PI / 2);
        x.font = "32px serif";
        x.fillText(w.kind, -16, 0);
        x.restore();
      });
      rain.forEach(function (r) {
        x.strokeStyle = "rgba(180,220,255,0.7)";
        x.beginPath(); x.moveTo(r.x, r.y); x.lineTo(r.x - 2, r.y + 10); x.stroke();
      });
      sparks.forEach(function (s) {
        x.globalAlpha = s.life;
        x.font = "20px serif";
        x.fillText(s.e, s.x, s.y);
      });
      bits.forEach(function (b) {
        x.globalAlpha = Math.max(0, b.life);
        x.font = "26px serif";
        x.fillText(b.e, b.x, b.y);
      });
      seeds.forEach(function () {});
      x.globalAlpha = 1;
      var hp = { x: CX() + Math.cos(helper.a) * (R() + 54), y: CY() + Math.sin(helper.a) * (R() + 36) };
      x.font = "36px serif";
      x.fillText(day > 0.5 ? "☀️" : "🌙", hp.x, hp.y);
      if (era === 6) {
        var cxm = (t * 90) % (W + 80) - 40;
        x.font = "40px serif";
        x.fillText("☄️", cxm, 80 + Math.sin(t * 4) * 8);
        for (var tl = 0; tl < 6; tl++) {
          x.globalAlpha = 0.15;
          x.fillText("✨", cxm - 16 - tl * 14, 80 + tl * 4);
        }
        x.globalAlpha = 1;
      }
      var astroA = t * 0.25;
      x.font = "28px serif";
      x.fillText("🧑‍🚀", 24, 100 + Math.sin(astroA) * 8);
      x.fillStyle = "rgba(255,255,255,.85)";
      x.font = "bold 14px Trebuchet MS";
      x.fillText(ERAS[era] ? ERAS[era].say : "Grow!", 58, 104 + Math.sin(astroA) * 8);
      var found = ["🌋", "💧", "✨", "🐟", "🐸", "🦕", "☄️", "🐦", "🦊", "🏠"];
      for (var fi = 0; fi < found.length; fi++) {
        x.globalAlpha = fi <= era ? 1 : 0.2;
        x.font = "22px serif";
        x.fillText(found[fi], 16 + fi * 28, H - 96);
      }
      x.globalAlpha = 1;
      x.fillStyle = "rgba(255,255,255,.16)";
      x.fillRect(16, H - 78, Math.min(W - 32, (got / Math.max(1, need)) * (W - 32)), 8);
    }

    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    document.getElementById("go").onclick = startGame;
    document.getElementById("again").onclick = function () {
      document.getElementById("win").classList.add("off");
      startGame();
    };
  })();
  </script>
</body>
</html>
