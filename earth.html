<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Little Earth</title>
  <script src="vendor/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background: #020617; color: #fff; touch-action: none; user-select: none; }
    button { background: transparent; border: 0; appearance: none; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .home { position: fixed; top: 12px; left: 12px; z-index: 8; color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; background: rgba(255,255,255,.14); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    #hud { position: fixed; top: 12px; right: 12px; z-index: 8; text-align: right; font-weight: 800; pointer-events: none; }
    #hud b { display: inline-block; background: rgba(0,0,0,.45); padding: 6px 12px; border-radius: 999px; margin-left: 6px; }
    #bubble { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); z-index: 8; background: #fff; color: #1e1b4b; font-weight: 800; font-size: 22px; padding: 10px 16px; border-radius: 20px; max-width: 86vw; text-align: center; pointer-events: none; }
    #tools { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 8; display: none; gap: 10px; }
    #tools.on { display: flex; }
    #tools button { width: 80px; height: 80px; border-radius: 22px; font-weight: 800; font-size: 13px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
    #tools button span { display: block; font-size: 28px; }
    #tools button.on { outline: 4px solid #ffd166; }
    #tSun { background: #fde047; color: #78350f; }
    #tRain { background: #38bdf8; color: #082f49; }
    #tPlant { background: #86efac; color: #14532d; }
    .cover { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 24px; background: radial-gradient(circle at 50% 20%, #312e81, #020617 70%); }
    .cover.off { display: none; }
    h1 { font-size: clamp(40px, 10vw, 64px); text-shadow: 0 6px 0 #1e1b4b; }
    .btn { background: #ffd166; color: #3b2100; font-weight: 800; font-size: 28px; padding: 14px 32px; border-radius: 999px; box-shadow: 0 8px 0 #e09f1f; }
    .btn.g { background: #86efac; box-shadow: 0 8px 0 #16a34a; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="index.html">← Home</a>
  <div id="hud"><b id="eraN">Era 1</b><b id="stars">⭐ 0</b></div>
  <div id="bubble">Tap Play to grow Earth</div>
  <div id="tools">
    <button id="tSun"><span></span>Sun</button>
    <button id="tRain"><span></span>Rain</button>
    <button id="tPlant"><span></span>Plant</button>
  </div>
  <div class="cover" id="title">
    <h1>Little Earth</h1>
    <p>A real spinning world.<br>Sun. Rain. Seeds.</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="cut">
    <h1 id="cutT">Water!</h1>
    <p id="cutP">Rain fills the seas.</p>
    <button class="btn g" id="cutGo">Next</button>
  </div>
  <div class="cover off" id="win">
    <h1>Our Earth!</h1>
    <p id="winP">You grew the globe.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    if (!window.THREE) { document.getElementById("bubble").textContent = "Need Three.js"; return; }
    var T = THREE, play = false, era = 0, stars = 0, got = 0, tool = "sun", t = 0;
    var ERAS = [
      { n: "Hot rock", say: "Warm the rock!", need: 5, col: 0xc2410c, land: 0x7c2d12 },
      { n: "Ocean", say: "Rain on the sea!", need: 6, col: 0x1d4ed8, land: 0x1e3a8a },
      { n: "Tiny life", say: "Plant little seeds!", need: 6, col: 0x2563eb, land: 0x4d7c0f },
      { n: "Fish age", say: "Tap the swimmers!", need: 7, col: 0x1d4ed8, land: 0x365314 },
      { n: "Trees", say: "Grow a forest!", need: 7, col: 0x2563eb, land: 0x3f6212 },
      { n: "Dinos", say: "Boop big pals!", need: 7, col: 0x1d4ed8, land: 0x166534 },
      { n: "Birds", say: "Sun for wings!", need: 6, col: 0x38bdf8, land: 0x4d7c0f },
      { n: "Animals", say: "Tap walking pals!", need: 8, col: 0x2563eb, land: 0x3f6212 },
      { n: "People", say: "Plant towns!", need: 7, col: 0x3b82f6, land: 0x365314 }
    ];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-earth") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}

    var scene = new T.Scene();
    scene.background = new T.Color(0x020617);
    var cam = new T.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 80);
    cam.position.set(0, 1.2, 6.2);
    var renderer = new T.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    document.body.appendChild(renderer.domElement);
    renderer.domElement.style.display = "block";

    var starsG = new T.BufferGeometry();
    var starPos = [];
    for (var i = 0; i < 400; i++) {
      var a = Math.random() * Math.PI * 2, b = Math.acos(2 * Math.random() - 1), r = 18 + Math.random() * 20;
      starPos.push(Math.sin(b) * Math.cos(a) * r, Math.sin(b) * Math.sin(a) * r, Math.cos(b) * r);
    }
    starsG.setAttribute("position", new T.Float32BufferAttribute(starPos, 3));
    scene.add(new T.Points(starsG, new T.PointsMaterial({ color: 0xffffff, size: 0.06 })));

    var amb = new T.AmbientLight(0x6688aa, 0.55); scene.add(amb);
    var sunL = new T.DirectionalLight(0xfff1c1, 1.15); scene.add(sunL);
    var sunMesh = new T.Mesh(new T.SphereGeometry(0.28, 16, 16), new T.MeshBasicMaterial({ color: 0xfde047 }));
    scene.add(sunMesh);
    var moonMesh = new T.Mesh(new T.SphereGeometry(0.16, 12, 12), new T.MeshLambertMaterial({ color: 0xe2e8f0 }));
    scene.add(moonMesh);

    function makeGlobe(ocean, land) {
      var geo = new T.SphereGeometry(1.6, 48, 36);
      var pos = geo.attributes.position;
      var cols = [];
      for (var i = 0; i < pos.count; i++) {
        var y = pos.getY(i), x0 = pos.getX(i), z0 = pos.getZ(i);
        var n = Math.sin(x0 * 3.1) * Math.cos(z0 * 2.4) + Math.sin(y * 4);
        var c = n > 0.25 ? new T.Color(land) : new T.Color(ocean);
        cols.push(c.r, c.g, c.b);
      }
      geo.setAttribute("color", new T.Float32BufferAttribute(cols, 3));
      return new T.Mesh(geo, new T.MeshLambertMaterial({ vertexColors: true }));
    }
    var globe = makeGlobe(0x1d4ed8, 0x7c2d12);
    scene.add(globe);
    var clouds = new T.Mesh(new T.SphereGeometry(1.72, 24, 18), new T.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.18 }));
    scene.add(clouds);

    var walkers = [];
    var plants = [];
    var rainDrops = [];

    function makeCritter(kind) {
      var g = new T.Group();
      var legs = [];
      var head, tail, body;
      if (kind === "fish") {
        body = new T.Mesh(new T.SphereGeometry(0.075, 8, 6), new T.MeshLambertMaterial({ color: 0x38bdf8 }));
        body.scale.set(1.7, 0.65, 0.7); g.add(body);
        head = new T.Mesh(new T.SphereGeometry(0.045, 8, 6), new T.MeshLambertMaterial({ color: 0x7dd3fc }));
        head.position.set(0.1, 0.01, 0); g.add(head);
        var eye = new T.Mesh(new T.SphereGeometry(0.012, 6, 5), new T.MeshLambertMaterial({ color: 0x0f172a }));
        eye.position.set(0.03, 0.015, 0.03); head.add(eye);
        tail = new T.Mesh(new T.ConeGeometry(0.05, 0.12, 5), new T.MeshLambertMaterial({ color: 0x0284c7 }));
        tail.rotation.z = Math.PI / 2; tail.position.set(-0.13, 0, 0); g.add(tail);
        var fin = new T.Mesh(new T.ConeGeometry(0.025, 0.06, 4), new T.MeshLambertMaterial({ color: 0x7dd3fc }));
        fin.position.set(0, 0.06, 0); g.add(fin);
      } else if (kind === "bird") {
        body = new T.Mesh(new T.SphereGeometry(0.065, 8, 6), new T.MeshLambertMaterial({ color: 0xf97316 }));
        body.scale.set(1.15, 0.85, 0.8); g.add(body);
        head = new T.Mesh(new T.SphereGeometry(0.04, 8, 6), new T.MeshLambertMaterial({ color: 0xfb923c }));
        head.position.set(0.07, 0.05, 0); g.add(head);
        var beak = new T.Mesh(new T.ConeGeometry(0.012, 0.055, 5), new T.MeshLambertMaterial({ color: 0xfacc15 }));
        beak.rotation.z = -Math.PI / 2; beak.position.set(0.045, 0, 0); head.add(beak);
        tail = new T.Mesh(new T.ConeGeometry(0.028, 0.08, 4), new T.MeshLambertMaterial({ color: 0xea580c }));
        tail.rotation.z = Math.PI / 2; tail.position.set(-0.08, 0.02, 0); g.add(tail);
        for (var s = -1; s <= 1; s += 2) {
          var wing = new T.Mesh(new T.SphereGeometry(0.045, 6, 5), new T.MeshLambertMaterial({ color: 0xfdba74 }));
          wing.scale.set(0.35, 0.14, 1.15); wing.position.set(0, 0.03, s * 0.065); g.add(wing);
          legs.push(wing);
        }
        for (s = -1; s <= 1; s += 2) {
          var lg = new T.Mesh(new T.CylinderGeometry(0.007, 0.01, 0.045, 4), new T.MeshLambertMaterial({ color: 0xfacc15 }));
          lg.position.set(s * 0.02, -0.065, 0); g.add(lg);
        }
      } else if (kind === "dino") {
        body = new T.Mesh(new T.SphereGeometry(0.09, 8, 7), new T.MeshLambertMaterial({ color: 0x4d7c0f }));
        body.scale.set(1.55, 0.75, 0.85); g.add(body);
        head = new T.Group(); head.position.set(0.14, 0.06, 0); g.add(head);
        var skull = new T.Mesh(new T.SphereGeometry(0.045, 8, 6), new T.MeshLambertMaterial({ color: 0x4d7c0f }));
        head.add(skull);
        var snout = new T.Mesh(new T.ConeGeometry(0.022, 0.07, 6), new T.MeshLambertMaterial({ color: 0x365314 }));
        snout.rotation.z = -Math.PI / 2; snout.position.set(0.05, -0.005, 0); head.add(snout);
        tail = new T.Mesh(new T.ConeGeometry(0.035, 0.16, 5), new T.MeshLambertMaterial({ color: 0x3f6212 }));
        tail.rotation.z = Math.PI / 2; tail.position.set(-0.14, 0.02, 0); g.add(tail);
        for (var i = 0; i < 4; i++) {
          var hip = new T.Group(); hip.position.set(i < 2 ? 0.05 : -0.05, -0.05, i % 2 ? 0.04 : -0.04);
          var thigh = new T.Mesh(new T.CylinderGeometry(0.012, 0.016, 0.07, 5), new T.MeshLambertMaterial({ color: 0x365314 }));
          thigh.position.y = -0.03; hip.add(thigh);
          g.add(hip); legs.push(hip);
        }
      } else if (kind === "fox") {
        body = new T.Mesh(new T.SphereGeometry(0.075, 8, 7), new T.MeshLambertMaterial({ color: 0xea580c }));
        body.scale.set(1.35, 0.75, 0.8); g.add(body);
        head = new T.Group(); head.position.set(0.09, 0.05, 0); g.add(head);
        var foxH = new T.Mesh(new T.SphereGeometry(0.04, 8, 6), new T.MeshLambertMaterial({ color: 0xea580c }));
        head.add(foxH);
        for (s = -1; s <= 1; s += 2) {
          var ear = new T.Mesh(new T.ConeGeometry(0.016, 0.045, 5), new T.MeshLambertMaterial({ color: 0x9a3412 }));
          ear.position.set(0.01, 0.04, s * 0.022); head.add(ear);
        }
        var nose = new T.Mesh(new T.ConeGeometry(0.012, 0.04, 5), new T.MeshLambertMaterial({ color: 0xfed7aa }));
        nose.rotation.z = -Math.PI / 2; nose.position.set(0.04, -0.005, 0); head.add(nose);
        tail = new T.Mesh(new T.SphereGeometry(0.035, 6, 5), new T.MeshLambertMaterial({ color: 0xf97316 }));
        tail.scale.set(1.8, 0.55, 0.55); tail.position.set(-0.12, 0.02, 0); g.add(tail);
        for (i = 0; i < 4; i++) {
          var fl = new T.Mesh(new T.CylinderGeometry(0.01, 0.012, 0.06, 5), new T.MeshLambertMaterial({ color: 0x9a3412 }));
          fl.position.set(i < 2 ? 0.04 : -0.04, -0.07, i % 2 ? 0.03 : -0.03);
          g.add(fl); legs.push(fl);
        }
      } else if (kind === "frog") {
        body = new T.Mesh(new T.SphereGeometry(0.08, 8, 6), new T.MeshLambertMaterial({ color: 0x22c55e }));
        body.scale.set(1.2, 0.7, 1.05); g.add(body);
        head = new T.Group(); head.position.set(0.07, 0.04, 0); g.add(head);
        var frogH = new T.Mesh(new T.SphereGeometry(0.045, 8, 6), new T.MeshLambertMaterial({ color: 0x4ade80 }));
        head.add(frogH);
        for (s = -1; s <= 1; s += 2) {
          var bulb = new T.Mesh(new T.SphereGeometry(0.02, 6, 5), new T.MeshLambertMaterial({ color: 0x86efac }));
          bulb.position.set(0.01, 0.03, s * 0.028); head.add(bulb);
          var pupil = new T.Mesh(new T.SphereGeometry(0.008, 5, 4), new T.MeshLambertMaterial({ color: 0x14532d }));
          pupil.position.set(0.012, 0, 0); bulb.add(pupil);
        }
        tail = new T.Group(); g.add(tail);
        for (i = 0; i < 4; i++) {
          var hopLeg = new T.Group(); hopLeg.position.set(i < 2 ? 0.04 : -0.05, -0.04, i % 2 ? 0.045 : -0.045);
          var thick = new T.Mesh(new T.SphereGeometry(0.022, 6, 5), new T.MeshLambertMaterial({ color: 0x16a34a }));
          thick.scale.set(0.7, 1.2, 0.7); hopLeg.add(thick);
          g.add(hopLeg); legs.push(hopLeg);
        }
      } else if (kind === "kid") {
        body = new T.Mesh(new T.SphereGeometry(0.055, 8, 6), new T.MeshLambertMaterial({ color: 0x38bdf8 }));
        body.scale.set(1, 1.25, 0.75); body.position.y = 0.02; g.add(body);
        head = new T.Group(); head.position.set(0, 0.1, 0); g.add(head);
        var face = new T.Mesh(new T.SphereGeometry(0.04, 8, 6), new T.MeshLambertMaterial({ color: 0xffe0b0 }));
        head.add(face);
        var hair = new T.Mesh(new T.SphereGeometry(0.042, 6, 5), new T.MeshLambertMaterial({ color: 0x5a3a22 }));
        hair.position.y = 0.015; head.add(hair);
        tail = new T.Group(); g.add(tail);
        for (s = -1; s <= 1; s += 2) {
          var kidLeg = new T.Group(); kidLeg.position.set(s * 0.025, -0.04, 0);
          var shin = new T.Mesh(new T.CylinderGeometry(0.01, 0.012, 0.055, 5), new T.MeshLambertMaterial({ color: 0x1d4ed8 }));
          shin.position.y = -0.02; kidLeg.add(shin);
          g.add(kidLeg); legs.push(kidLeg);
        }
      } else {
        body = new T.Mesh(new T.IcosahedronGeometry(0.08, 0), new T.MeshLambertMaterial({ color: 0x78716c }));
        body.scale.set(1.2, 0.7, 1); g.add(body);
        head = new T.Mesh(new T.SphereGeometry(0.035, 6, 5), new T.MeshLambertMaterial({ color: 0xa8a29e }));
        head.position.set(0.05, 0.03, 0.02); g.add(head);
        tail = new T.Group(); g.add(tail);
      }
      g.userData = { legs: legs, tail: tail, head: head, kind: kind, u: Math.random(), v: 0.35 + Math.random() * 0.3, phase: Math.random() * 6 };
      return g;
    }
    function placeOnGlobe(obj, u, v, lift) {
      var phi = v * Math.PI, th = u * Math.PI * 2;
      var r = 1.6 + (lift || 0.12);
      obj.position.set(r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th));
      obj.lookAt(0, 0, 0);
      obj.rotateX(-Math.PI / 2);
    }

    function spawnWalkers(kind, n) {
      walkers.forEach(function (w) { globe.remove(w); });
      walkers = [];
      for (var i = 0; i < n; i++) {
        var c = makeCritter(kind);
        globe.add(c);
        walkers.push(c);
      }
    }

    function setEraLook() {
      var e = ERAS[era];
      globe.material.dispose();
      var ng = makeGlobe(e.col, e.land);
      ng.rotation.copy(globe.rotation);
      scene.remove(globe);
      plants.forEach(function (p) { if (p.parent) p.parent.remove(p); });
      plants = [];
      globe = ng; scene.add(globe);
      globe.add(clouds);
      var kinds = ["rock", "fish", "fish", "fish", "frog", "dino", "bird", "fox", "kid"];
      spawnWalkers(kinds[era] || "fox", 4 + Math.min(era, 4));
      document.getElementById("eraN").textContent = e.n;
      document.getElementById("bubble").textContent = e.say;
    }

    function save() {
      try { localStorage.setItem("alabryuu-earth", JSON.stringify({ stars: stars, era: era })); } catch (e) {}
    }
    function progress(n) {
      got += n; stars += n;
      document.getElementById("stars").textContent = "⭐ " + stars;
      save();
      if (got >= ERAS[era].need) {
        play = false;
        document.getElementById("cutT").textContent = ERAS[era].n + "!";
        document.getElementById("cutP").textContent = era < ERAS.length - 1 ? "A new age starts." : "Home.";
        document.getElementById("cut").classList.remove("off");
      }
    }

    var ray = new T.Raycaster(), mouse = new T.Vector2();
    renderer.domElement.addEventListener("pointerdown", function (ev) {
      if (!play) return;
      mouse.x = (ev.clientX / innerWidth) * 2 - 1;
      mouse.y = -(ev.clientY / innerHeight) * 2 + 1;
      ray.setFromCamera(mouse, cam);
      var hits = ray.intersectObject(globe, false);
      if (!hits.length) return;
      var p = hits[0].point.clone();
      if (tool === "sun") {
        sunL.intensity = Math.min(2, sunL.intensity + 0.15);
        progress(1);
      } else if (tool === "rain") {
        for (var i = 0; i < 10; i++) {
          var d = new T.Mesh(new T.SphereGeometry(0.03, 6, 6), new T.MeshBasicMaterial({ color: 0x7dd3fc }));
          d.position.copy(p).multiplyScalar(1.2);
          scene.add(d);
          rainDrops.push({ m: d, v: p.clone().normalize().multiplyScalar(-0.04) });
        }
        progress(1);
      } else {
        var tree = new T.Group();
        var trunk = new T.Mesh(new T.CylinderGeometry(0.02, 0.03, 0.12, 6), new T.MeshLambertMaterial({ color: 0x92400e }));
        var leaf = new T.Mesh(new T.SphereGeometry(0.08, 8, 8), new T.MeshLambertMaterial({ color: 0x22c55e }));
        leaf.position.y = 0.1; tree.add(trunk); tree.add(leaf);
        var u = Math.atan2(p.z, p.x) / (Math.PI * 2) + 0.5;
        var v = Math.acos(Math.max(-1, Math.min(1, p.y / 1.6))) / Math.PI;
        placeOnGlobe(tree, u, v, 0.18);
        globe.add(tree); plants.push(tree);
        progress(1);
      }
      beep(640, 0.07);
    });

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f; g.gain.value = 0.1; o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function setTool(n) {
      tool = n;
      document.getElementById("tSun").classList.toggle("on", n === "sun");
      document.getElementById("tRain").classList.toggle("on", n === "rain");
      document.getElementById("tPlant").classList.toggle("on", n === "plant");
    }
    document.getElementById("tSun").onclick = function () { setTool("sun"); beep(700, 0.05); };
    document.getElementById("tRain").onclick = function () { setTool("rain"); beep(400, 0.05); };
    document.getElementById("tPlant").onclick = function () { setTool("plant"); beep(520, 0.05); };

    function start() {
      play = true; era = 0; got = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("cut").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("tools").classList.add("on");
      document.getElementById("stars").textContent = "⭐ " + stars;
      setTool("sun"); setEraLook(); beep(480, 0.1);
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("cutGo").onclick = function () {
      document.getElementById("cut").classList.add("off");
      era++;
      if (era >= ERAS.length) {
        document.getElementById("winP").textContent = "⭐ " + stars + "  The globe is home.";
        document.getElementById("win").classList.remove("off");
        document.getElementById("tools").classList.remove("on");
        return;
      }
      got = 0; play = true; setEraLook();
    };

    addEventListener("resize", function () {
      cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    var clock = new T.Clock();
    function tick() {
      var dt = Math.min(0.033, clock.getDelta());
      t += dt;
      globe.rotation.y += dt * 0.12;
      clouds.rotation.y -= dt * 0.04;
      var sa = t * 0.35;
      sunMesh.position.set(Math.cos(sa) * 4.2, 1.2, Math.sin(sa) * 4.2);
      sunL.position.copy(sunMesh.position);
      moonMesh.position.set(Math.cos(sa + Math.PI) * 3.6, 0.6, Math.sin(sa + Math.PI) * 3.6);
      walkers.forEach(function (w) {
        var u = w.userData;
        u.u = (u.u + dt * 0.04) % 1;
        placeOnGlobe(w, u.u, u.v, 0.14);
        var step = Math.sin(t * 10 + u.phase);
        if (u.kind === "fish") {
          u.tail.rotation.y = Math.sin(t * 8 + u.phase) * 0.7;
          u.head.rotation.y = Math.sin(t * 6) * 0.2;
        } else if (u.kind === "bird") {
          u.legs.forEach(function (wing, i) {
            wing.rotation.x = Math.sin(t * 14 + u.phase) * 0.8 * (i ? -1 : 1);
          });
          u.head.rotation.x = Math.sin(t * 6) * 0.2;
        } else if (u.kind === "rock") {
          w.rotation.z = Math.sin(t * 2 + u.phase) * 0.08;
        } else {
          u.legs.forEach(function (leg, i) {
            leg.rotation.x = step * (i % 2 ? 0.7 : -0.7);
          });
          u.tail.rotation.y = Math.sin(t * 6 + u.phase) * 0.4;
          u.head.rotation.x = Math.sin(t * 5) * 0.15;
        }
      });
      plants.forEach(function (p, i) { p.rotation.z = Math.sin(t * 2 + i) * 0.08; });
      rainDrops.forEach(function (r) { r.m.position.add(r.v); r.v.y -= 0.002; });
      if (rainDrops.length > 40) {
        var old = rainDrops.shift();
        scene.remove(old.m);
      }
      cam.position.x = Math.sin(t * 0.15) * 0.4;
      cam.lookAt(0, 0.1, 0);
      renderer.render(scene, cam);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    document.getElementById("stars").textContent = "⭐ " + stars;
  })();
  </script>
</body>
</html>
