<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Seesaw</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#bae6fd}</style>
</head>
<body>
<script>
kidChrome({
  title: "Seesaw",
  hero: "⚖️",
  blurb: "Tap the pal with the same number!",
  say: "Match the number!",
  hud: "⚖️ 0/4",
  winHero: "😄",
  winTitle: "Balanced!",
  winText: "Four even seesaws.",
  again: "Balance again",
  bg: "#bae6fd"
});
(function () {
  var S = kidStage();
  var ROUNDS = [
    { L: ["🐻", 2], R: [["🐭", 1], ["🐶", 2], ["🐰", 1]] },
    { L: ["🐘", 3], R: [["🐤", 1], ["🦁", 3], ["🐸", 1]] },
    { L: ["🐧", 1], R: [["🦊", 2], ["🐤", 1], ["🐮", 3]] },
    { L: ["🐯", 2], R: [["🐭", 1], ["🐱", 2], ["🐘", 3]] }
  ];
  var play = false, round = 0, tip = -0.4, goal = -0.4, lock = false;
  function dots(x, y, w) {
    S.ctx.fillStyle = "#0f172a";
    S.ctx.font = "800 44px Trebuchet MS,sans-serif";
    S.ctx.textAlign = "center";
    S.ctx.textBaseline = "middle";
    S.ctx.fillText(String(w), x, y);
  }
  function mix(list) {
    var a = list.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function start() {
    play = true; round = 0; tip = -0.4; goal = -0.4; lock = false;
    var r;
    for (r = 0; r < ROUNDS.length; r++) ROUNDS[r].R = mix(ROUNDS[r].R);
    kidBegin("Match the number!", "⚖️ 0/4");
  }
  kidBind(start);
  S.cv.addEventListener("pointerdown", function (e) {
    if (!play || lock) return;
    var p = kidPt(e, S.cv);
    var opts = ROUNDS[round].R;
    var i = kidNearest(p.x, p.y, opts, 520, function (_, k) {
      return { x: S.W * (0.22 + k * 0.28), y: S.H * 0.78 };
    });
    if (i < 0) { kidMiss("⚖️", "Tap a pal!", p.x, p.y); return; }
    if (opts[i][1] === ROUNDS[round].L[1]) {
      lock = true; goal = 0;
      kidTap(opts[i][0], "Even!", S.W * 0.66, S.H * 0.42, 560);
      setTimeout(function () {
        round++;
        if (kidMark(round, 4, "⚖️")) { play = false; kidFinish("Four even seesaws."); return; }
        tip = -0.4; goal = -0.4; lock = false;
        kidSay("Match the number!");
      }, 650);
    } else kidMiss(opts[i][0], "Find " + ROUNDS[round].L[1] + "!", S.W * (0.22 + i * 0.28), S.H * 0.78);
  });
  kidTick(function (dt) {
    tip += (goal - tip) * Math.min(1, dt * 6);
    S.bg("#e0f2fe");
    var cy = S.H * 0.46, left = cy + tip * 90, right = cy - tip * 90;
    S.ctx.fillStyle = "#92400e";
    S.ctx.fillRect(S.W * 0.18, (left + right) / 2 - 10, S.W * 0.64, 18);
    S.em("🪵", S.W * 0.5, (left + right) / 2 + 8, 36);
    var L = ROUNDS[Math.min(round, 3)].L;
    S.em(L[0], S.W * 0.28, left - 54, 88);
    dots(S.W * 0.28, left + 28, L[1]);
    var opts = ROUNDS[Math.min(round, 3)].R, i;
    for (i = 0; i < opts.length; i++) {
      var x = S.W * (0.22 + i * 0.28);
      S.em(opts[i][0], x, S.H * 0.78, 86);
      dots(x, S.H * 0.78 + 58, opts[i][1]);
    }
  });
})();
</script>
</body>
</html>
