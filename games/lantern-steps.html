<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var open = false;
      try { open = localStorage.getItem("alabryuu-open") === "1"; } catch (e) {}
      if (open) return;
      document.documentElement.classList.add("kid-locked");
      var path = location.pathname || "";
      document.documentElement.style.background = path.indexOf("/alonzorui") === 0 ? "#fff7ed" : "#1e1b4b";
    })();
  </script>
  <style id="kid-lock-hide">
    html.kid-locked, html.kid-locked body { overflow: hidden !important; height: 100% !important; }
    html.kid-locked body { visibility: hidden !important; }
    #kid-lock, #kid-lock * { visibility: visible !important; }
  </style>
  <script src="/kid-lock.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Lantern Steps</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../mix.js"></script>
  <style>
    html, body { background: #1e1b4b; }
    .home { z-index: 60; }
    .dock button { font-size: 22px; }
    .dock button i { display: block; width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px; border: 3px solid #1e1b4b; background: var(--c, #fff); }
    .hero svg { width: 96px; height: 96px; display: block; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fl">0 / 5</b></div>
  <div id="say">Tap the glowing stone</div>
  
  <div class="cover" id="title">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><circle cx="24" cy="68" r="10" fill="#fde68a" stroke="#1e1b4b" stroke-width="3"/><circle cx="68" cy="58" r="10" fill="#cbd5e1" stroke="#1e1b4b" stroke-width="3"/><circle cx="30" cy="40" r="12" fill="#fbbf24" stroke="#1e1b4b" stroke-width="3"/><circle cx="62" cy="24" r="10" fill="#94a3b8" stroke="#1e1b4b" stroke-width="3"/></svg></div>
    <h1>Lantern Steps</h1>
    <p>Light the path from the first glow.</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><circle cx="24" cy="68" r="10" fill="#fde68a" stroke="#1e1b4b" stroke-width="3"/><circle cx="68" cy="58" r="10" fill="#cbd5e1" stroke="#1e1b4b" stroke-width="3"/><circle cx="30" cy="40" r="12" fill="#fbbf24" stroke="#1e1b4b" stroke-width="3"/><circle cx="62" cy="24" r="10" fill="#94a3b8" stroke="#1e1b4b" stroke-width="3"/></svg></div>
    <h1>The path is lit!</h1>
    <p>All five stones glow.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
(function () {
  var cv = document.getElementById("c");
  var ui = Mix.boot(cv);
  var ctx, W = 0, H = 0, raf = 0;
  function layout(force) {
    var r = cv.getBoundingClientRect();
    var rw = Math.round(r.width || 0), rh = Math.round(r.height || 0);
    if (!force && ctx && Math.round(W) === rw && Math.round(H) === rh && rw > 0) return;
    var f = ui.fit();
    ctx = f.ctx; W = f.W; H = f.H;
  }
  function loop() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  function frame() {
    if (!ui.on()) return;
    layout(false);
    if (W < 2 || H < 2) { raf = requestAnimationFrame(frame); return; }
    if (step() === "stop") return;
    draw();
    raf = requestAnimationFrame(frame);
  }
  function begin() { layout(true); reset(); loop(); }
  function hud(t) {
    var el = document.getElementById("fl");
    if (el) el.textContent = t;
    var m = String(t).match(/\d+/);
    if (m) cv.dataset.score = m[0];
  }
  function sky(a, b) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ui.begin(begin);
  ui.replay(begin);
  
  var next, pulse;
  function spots() {
    var pts = [[0.22, 0.74], [0.72, 0.64], [0.28, 0.5], [0.7, 0.38], [0.4, 0.24]];
    return pts.map(function (p) { return { x: p[0] * W, y: p[1] * H }; });
  }
  function reset() { next = 0; pulse = 0; hud("0 / 5"); }
  cv.addEventListener("pointerdown", function (e) {
    if (!ui.on()) return;
    var p = kidPt(e, cv), ps = spots(), i;
    for (i = 0; i < ps.length; i++) {
      var dx = p.x - ps[i].x, dy = p.y - ps[i].y;
      if (dx * dx + dy * dy < 62 * 62) {
        if (i === next) {
          next++;
          kidNote(460 + next * 46);
          hud(next + " / 5");
          if (next >= 5) { draw(); ui.finish(); }
        } else {
          kidNote(196);
          kidPing("Follow the glow");
        }
        return;
      }
    }
  });
  function step() {
    pulse += 0.1;
    var ps = spots();
    var s = ps[Math.min(next, 4)];
    cv.dataset.nx = String(Math.round(s.x));
    cv.dataset.ny = String(Math.round(s.y));
    cv.dataset.left = String(Math.max(0, 5 - next));
  }
  function draw() {
    sky("#1e1b4b", "#312e81");
    var ps = spots(), i;
    ctx.strokeStyle = "#6366f1"; ctx.lineWidth = 6;
    ctx.beginPath();
    for (i = 0; i < ps.length; i++) {
      if (i === 0) ctx.moveTo(ps[i].x, ps[i].y); else ctx.lineTo(ps[i].x, ps[i].y);
    }
    ctx.stroke();
    for (i = 0; i < ps.length; i++) {
      var on = i < next, hot = i === next && next < 5;
      ctx.fillStyle = on || hot ? "#fbbf24" : "#475569";
      if (hot) { ctx.shadowColor = "#fde68a"; ctx.shadowBlur = 16 + Math.sin(pulse) * 8; }
      ctx.beginPath(); ctx.arc(ps[i].x, ps[i].y, hot ? 34 : 28, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; Mix.ink(ctx);
      if (on || hot) {
        ctx.fillStyle = "#fff7ed";
        ctx.beginPath(); ctx.ellipse(ps[i].x, ps[i].y - 8, 6, 10, 0, 0, 7); ctx.fill();
      }
    }
  }

  layout(true);
  if (W > 2) { reset(); draw(); }
  addEventListener("resize", function () { layout(true); if (W > 2) draw(); });
})();
  </script>
</body>
</html>
