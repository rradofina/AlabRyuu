<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Dress the Day</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>html,body{background:#7c3aed}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="wx">☀️</b><b id="rd">1/3</b></div>
  <div id="say">What do we wear in sun?</div>
  <div class="dock" id="dock">
    <button id="a"><span>😎</span>Sunny</button>
    <button id="b"><span>🧥</span>Rain</button>
    <button id="c"><span>🧤</span>Snow</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">👗</div>
    <h1>Dress the Day</h1>
    <p>Pick clothes for the weather!</p>
    <button class="play" id="go">Dress</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🌟</div>
    <h1>Ready for anything!</h1>
    <p>Sun, rain, and snow.</p>
    <button class="play g" id="again">Dress again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, round = 0, stars = 0, flags = {};
    var DAYS = [
      { w: "☀️", q: "Sunny day. What do we wear?", ok: "a", wear: "😎" },
      { w: "🌧️", q: "Rain! What keeps us dry?", ok: "b", wear: "🧥" },
      { w: "❄️", q: "Snow! What keeps hands warm?", ok: "c", wear: "🧤" }
    ];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-dress") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function show() {
      var d = DAYS[round];
      document.getElementById("wx").textContent = d.w;
      document.getElementById("rd").textContent = (round + 1) + "/3";
      document.getElementById("say").textContent = d.q;
    }
    function start() {
      play = true; round = 0; flags = {};
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      show();
    }
    function pick(k) {
      if (!play) return;
      var d = DAYS[round];
      if (k === d.ok) {
        flags[k] = 1; stars++;
        try { localStorage.setItem("alabryuu-dress", JSON.stringify({ stars: stars, flags: flags })); } catch (e) {}
        round++;
        if (round >= 3) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("win").classList.remove("off");
        } else show();
      } else document.getElementById("say").textContent = "Not for this weather. " + d.q;
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("a").onclick = function () { pick("a"); };
    document.getElementById("b").onclick = function () { pick("b"); };
    document.getElementById("c").onclick = function () { pick("c"); };
    function loop() {
      var d = DAYS[Math.min(round, 2)];
      x.fillStyle = d.w === "☀️" ? "#7dd3fc" : (d.w === "🌧️" ? "#64748b" : "#e0f2fe");
      x.fillRect(0, 0, W, H);
      em(d.w, W * 0.8, 90, 72);
      em("🧒", W * 0.5, H * 0.42, 110);
      if (play) em(d.wear, W * 0.5, H * 0.28, 48);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
