<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Snowman</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", Georgia, sans-serif; background: #e0f2fe; color: #0c4a6e; touch-action: none; user-select: none; -webkit-user-select: none; }
    button { background: transparent; border: 0; appearance: none; -webkit-appearance: none; -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer; }
    canvas { display: block; width: 100%; height: 100%; }
    .home { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; z-index: 8; color: #0c4a6e; text-decoration: none; font-weight: 800; font-size: 17px; background: #fff; padding: 8px 14px; border-radius: 999px; box-shadow: 0 3px 0 #7dd3fc; touch-action: manipulation; }
    #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 7; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; pointer-events: none; }
    #hud b { font-weight: 800; font-size: 13px; background: #fff; color: #0c4a6e; padding: 6px 10px; border-radius: 999px; }
    #say { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 7; font-weight: 800; font-size: 16px; color: #0c4a6e; pointer-events: none; text-align: center; width: 92%; }
    #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: none; gap: 6px; padding: 8px 8px max(10px, env(safe-area-inset-bottom)); background: rgba(255,255,255,.75); justify-content: center; flex-wrap: wrap; }
    #dock.on { display: flex; }
    #dock button { min-width: 64px; height: 52px; border-radius: 14px; background: #e0f2fe; font-weight: 800; font-size: 14px; box-shadow: 0 4px 0 #7dd3fc; }
    #dock button.on { background: #fde047; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px; background: linear-gradient(#7dd3fc, #f8fafc); }
    .cover.off { display: none; }
    h1 { font-size: clamp(32px, 9vw, 50px); color: #0c4a6e; text-shadow: 0 3px 0 #fff; }
    .cover p { font-weight: 800; font-size: 18px; max-width: 340px; }
    .btn { background: #38bdf8; color: #fff; font-weight: 800; font-size: 22px; padding: 14px 24px; border-radius: 999px; box-shadow: 0 7px 0 #0369a1; }
    .btn.g { background: #86efac; box-shadow: 0 7px 0 #16a34a; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fr">Pal 1</b><b id="wn">Wind</b><b id="ac">Hats</b></div>
  <div id="say">Roll the snow. It grows!</div>
  <div id="dock">
    <button id="a0" type="button">🎩 Hat</button>
    <button id="a1" type="button">🧣 Scarf</button>
    <button id="a2" type="button">🥕 Nose</button>
    <button id="a3" type="button">🔘 Buttons</button>
    <button id="a4" type="button">🌲 Arms</button>
  </div>
  <div class="cover" id="title">
    <div style="font-size:76px">⛄</div>
    <h1>Snowman</h1>
    <p>Roll snowballs so they grow. Wind knocks the hat — tap to restack. Sparkles always.</p>
    <button class="btn" id="go">Roll</button>
  </div>
  <div class="cover off" id="win">
    <div style="font-size:76px">❄️</div>
    <h1>Snow pals!</h1>
    <p id="winP">Five friends. Soft flakes.</p>
    <button class="btn g" id="again">Roll again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    function em(ch,px,py,s){ x.font=s+"px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(ch,px,py); }
    var W, H, last = 0, t = 0, play = false, friend = 0;
    var balls = [], flakes = [], spark = [], gusts = [];
    var drag = null, wind = 0, windT = 0, hatOff = 0, hat = { x: 0, y: 0, vx: 0, vy: 0 };
    var acc = { hat: 1, scarf: 0, nose: 1, btn: 0, arms: 0 };
    var stackY = 0, done = 0, ground = 0;
    var FRIENDS = [
      { n: "Classic", need: ["hat"], scarf: "#ef4444", hint: "Roll 3 balls. Stack big to small. Add a hat." },
      { n: "Scarf pal", need: ["hat", "scarf"], scarf: "#3b82f6", hint: "This pal wants a warm scarf." },
      { n: "Carrot grin", need: ["hat", "nose", "btn"], scarf: "#f97316", hint: "Nose and buttons, please!" },
      { n: "Windy hat", need: ["hat", "arms"], scarf: "#a855f7", hint: "Wind is coming. Restack the hat." },
      { n: "Family", need: ["hat", "scarf", "arms", "btn"], scarf: "#22c55e", hint: "Dress the last friend fancy." }
    ];

    function beep(f, d, typ) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        if (ac.state === "suspended") ac.resume();
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = typ || "sine"; o.frequency.value = f; g.gain.value = 0.08;
        o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function say(s) { document.getElementById("say").textContent = s; }
    function hud() {
      document.getElementById("fr").textContent = FRIENDS[friend] ? FRIENDS[friend].n : "Done";
      document.getElementById("wn").textContent = wind > 0.3 ? "Wind!" : "Calm";
      document.getElementById("ac").textContent = (acc.hat ? "🎩" : "") + (acc.scarf ? "🧣" : "") + (acc.nose ? "🥕" : "");
    }
    function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; ground = H * 0.78; }
    addEventListener("resize", resize); resize();

    function makeFriend() {
      var baseX = W * 0.5;
      balls = [
        { x: baseX - 90, y: ground - 28, r: 28, vx: 0, stacked: 0, id: 0 },
        { x: baseX + 10, y: ground - 22, r: 22, vx: 0, stacked: 0, id: 1 },
        { x: baseX + 100, y: ground - 16, r: 16, vx: 0, stacked: 0, id: 2 }
      ];
      acc = { hat: 0, scarf: 0, nose: 0, btn: 0, arms: 0 };
      hatOff = 0; wind = 0; windT = 2 + friend; done = 0;
      document.getElementById("a0").classList.remove("on");
      document.getElementById("a1").classList.remove("on");
      document.getElementById("a2").classList.remove("on");
      document.getElementById("a3").classList.remove("on");
      document.getElementById("a4").classList.remove("on");
      say(FRIENDS[friend].hint);
      hud();
    }

    function start() {
      play = true; friend = 0;
      flakes = []; spark = []; gusts = [];
      var i;
      for (i = 0; i < 70; i++) flakes.push({ x: Math.random() * W, y: Math.random() * H, s: 1 + Math.random() * 2, v: 30 + Math.random() * 40, ph: i });
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      makeFriend(); beep(520, 0.1);
    }

    function ballAt(mx, my) {
      var i, b, best = null, bd = 80;
      for (i = 0; i < balls.length; i++) {
        b = balls[i];
        var d = Math.hypot(mx - b.x, my - b.y);
        if (d < b.r + 16 && d < bd) { bd = d; best = b; }
      }
      return best;
    }

    addEventListener("pointerdown", function (e) {
      if (e.target.closest && e.target.closest("a,button")) return;
      if (!play) return;
      if (hatOff && Math.hypot(e.clientX - hat.x, e.clientY - hat.y) < 40) {
        hatOff = 0; acc.hat = 1; document.getElementById("a0").classList.add("on");
        say("Hat restacked. Nice catch!");
        beep(720, 0.08); checkDone(); return;
      }
      drag = ballAt(e.clientX, e.clientY);
    });
    addEventListener("pointermove", function (e) {
      if (!drag || !play) return;
      var nx = Math.max(40, Math.min(W - 40, e.clientX));
      drag.vx = nx - drag.x;
      drag.x = nx;
      if (!drag.stacked) {
        drag.r = Math.min(52 - drag.id * 8, drag.r + Math.abs(drag.vx) * 0.04);
        drag.y = ground - drag.r;
        if (Math.random() < 0.4) spark.push({ x: drag.x, y: drag.y + drag.r * 0.4, life: 0.5 });
      }
    });
    addEventListener("pointerup", function () {
      if (drag && play) tryStack(drag);
      drag = null;
    });

    function tryStack(b) {
      var sorted = balls.slice().sort(function (a, c) { return c.r - a.r; });
      if (b === sorted[0]) {
        b.stacked = 1; b.x = W * 0.5; b.y = ground - b.r;
        beep(400, 0.06); return;
      }
      var under = null, i;
      for (i = 0; i < balls.length; i++) {
        if (balls[i] !== b && balls[i].stacked && Math.abs(balls[i].x - b.x) < balls[i].r * 0.7) {
          if (!under || balls[i].y < under.y) under = balls[i];
        }
      }
      if (under && b.r < under.r + 2) {
        b.stacked = 1; b.x = under.x; b.y = under.y - under.r - b.r + 6;
        beep(560, 0.07);
        checkDone();
      }
    }

    function allStacked() {
      return balls.length >= 3 && balls.every(function (b) { return b.stacked; });
    }

    function checkDone() {
      if (!allStacked()) return;
      var need = FRIENDS[friend].need, ok = true, i;
      for (i = 0; i < need.length; i++) {
        if (need[i] === "hat" && (!acc.hat || hatOff)) ok = false;
        if (need[i] === "scarf" && !acc.scarf) ok = false;
        if (need[i] === "nose" && !acc.nose) ok = false;
        if (need[i] === "btn" && !acc.btn) ok = false;
        if (need[i] === "arms" && !acc.arms) ok = false;
      }
      if (ok && !done) {
        done = 1; beep(880, 0.14);
        friend++;
        if (friend >= FRIENDS.length) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("winP").textContent = "Five snow friends. Hats came home.";
          document.getElementById("win").classList.remove("off");
        } else {
          say("Pal complete! Next friend...");
          setTimeout(makeFriend, 700);
        }
      }
    }

    document.getElementById("a0").onclick = function () { if (allStacked()) { acc.hat = 1; hatOff = 0; this.classList.add("on"); beep(600, 0.06); checkDone(); } else say("Stack the balls first."); };
    document.getElementById("a1").onclick = function () { if (allStacked()) { acc.scarf = 1; this.classList.add("on"); beep(620, 0.06); checkDone(); } else say("Stack first."); };
    document.getElementById("a2").onclick = function () { if (allStacked()) { acc.nose = 1; this.classList.add("on"); beep(640, 0.06); checkDone(); } else say("Stack first."); };
    document.getElementById("a3").onclick = function () { if (allStacked()) { acc.btn = 1; this.classList.add("on"); beep(660, 0.06); checkDone(); } else say("Stack first."); };
    document.getElementById("a4").onclick = function () { if (allStacked()) { acc.arms = 1; this.classList.add("on"); beep(680, 0.06); checkDone(); } else say("Stack first."); };

    function update(dt) {
      t += dt;
      var i, f;
      for (i = 0; i < flakes.length; i++) {
        f = flakes[i];
        f.y += f.v * dt; f.x += Math.sin(t + f.ph) * 18 * dt + wind * 40 * dt;
        if (f.y > H) { f.y = -6; f.x = Math.random() * W; }
        if (f.x < -8) f.x = W + 4;
        if (f.x > W + 8) f.x = -4;
      }
      for (i = spark.length - 1; i >= 0; i--) {
        spark[i].life -= dt * 2;
        if (spark[i].life <= 0) spark.splice(i, 1);
      }
      if (!play) return;
      windT -= dt;
      if (friend >= 3 && windT < 0 && allStacked() && acc.hat && !hatOff) {
        wind = 1; hatOff = 1;
        var top = balls.slice().sort(function (a, b) { return a.y - b.y; })[0];
        hat.x = top.x; hat.y = top.y - top.r - 10; hat.vx = 80 + friend * 10; hat.vy = -40;
        windT = 6; say("Whoosh! Tap the hat to restack.");
        beep(220, 0.12, "sawtooth");
      }
      if (wind > 0) wind -= dt * 0.5;
      if (hatOff) {
        hat.x += hat.vx * dt; hat.y += hat.vy * dt; hat.vy += 180 * dt;
        if (hat.y > ground - 10) { hat.y = ground - 10; hat.vy *= -0.3; hat.vx *= 0.7; }
        if (hat.x < 20 || hat.x > W - 20) hat.vx *= -1;
      }
      for (i = 0; i < balls.length; i++) {
        if (!balls[i].stacked && balls[i] !== drag) {
          balls[i].vx *= 0.9;
          balls[i].x += balls[i].vx * dt * 8;
          balls[i].x = Math.max(balls[i].r, Math.min(W - balls[i].r, balls[i].x));
        }
      }
      hud();
    }

    function drawSky() {
      var g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#7dd3fc"); g.addColorStop(1, "#f8fafc");
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      em("☀️", W * 0.16, 70, 40);
      x.fillStyle = "#fff";
      x.fillRect(0, ground, W, H - ground);
      x.fillStyle = "#e0f2fe";
      var i;
      for (i = 0; i < 6; i++) {
        x.beginPath(); x.ellipse(i * (W / 5), ground + 10, 50, 16, 0, 0, Math.PI * 2); x.fill();
      }
    }

    function drawBall(b) {
      em("⚪", b.x, b.y, b.r * 2.15);
    }

    function drawFace(top) {
      if (!allStacked()) return;
      em("😄", top.x, top.y, Math.max(22, top.r * 1.4));
      if (acc.nose) em("🥕", top.x + 12, top.y + 4, 18);
    }

    function drawHatAt(px, py, r) {
      em("🎩", px, py - 10, Math.max(28, r * 1.6));
    }

    function draw() {
      drawSky();
      var i, f;
      for (i = 0; i < flakes.length; i++) {
        f = flakes[i];
        x.globalAlpha = 0.85;
        em("❄️", f.x, f.y, Math.max(10, f.s * 3));
      }
      x.globalAlpha = 1;
      var sorted = balls.slice().sort(function (a, b) { return a.y - b.y; });
      var base = balls.slice().sort(function (a, b) { return b.r - a.r; })[0];
      var mid, top;
      if (allStacked()) {
        mid = sorted[1]; top = sorted[0];
        if (acc.arms) {
          em("🪵", base.x - base.r - 16, base.y - 16 + Math.sin(t * 2) * 4, 22);
          em("🪵", base.x + base.r + 16, base.y - 14 + Math.cos(t * 2) * 4, 22);
        }
      }
      for (i = 0; i < balls.length; i++) drawBall(balls[i]);
      if (allStacked()) {
        top = sorted[0]; mid = sorted[1];
        drawFace(top);
        if (acc.scarf) em("🧣", top.x, top.y + top.r + 4, 28);
        if (acc.btn && mid) em("🔘", mid.x, mid.y, 18);
        if (acc.hat && acc.scarf && acc.nose && acc.btn && acc.arms) em("⛄", base.x, mid.y, Math.max(64, base.r * 2.6));
        if (acc.hat && !hatOff) drawHatAt(top.x, top.y - top.r, top.r);
      }
      if (hatOff) drawHatAt(hat.x, hat.y, 16);
      for (i = 0; i < spark.length; i++) {
        x.globalAlpha = Math.max(0, spark[i].life);
        x.fillStyle = "#fff";
        x.fillRect(spark[i].x, spark[i].y, 3, 3);
      }
      x.globalAlpha = 1;
      if (wind > 0.2) {
        x.strokeStyle = "rgba(14,165,233,.35)"; x.lineWidth = 2;
        for (i = 0; i < 6; i++) {
          x.beginPath(); x.moveTo(20, 80 + i * 30); x.lineTo(80 + Math.sin(t * 8 + i) * 20, 80 + i * 30); x.stroke();
        }
      }
      x.fillStyle = "rgba(12,74,110,.2)";
      x.fillRect(16, 8, W - 32, 6);
      x.fillStyle = "#38bdf8";
      x.fillRect(16, 8, Math.min(W - 32, (friend / 5) * (W - 32)), 6);
    }

    
    var tracks=[], chickadee=[], icicles=[], puffWind=[];
    function flavorUpdate(dt){
      if(!chickadee.length){ var i; for(i=0;i<4;i++) chickadee.push({x:Math.random(),y:0.12+Math.random()*0.1,vx:0.04,ph:i}); }
      var i;
      for(i=0;i<chickadee.length;i++){ chickadee[i].x+=chickadee[i].vx*dt; chickadee[i].ph+=dt*5; if(chickadee[i].x>1.1) chickadee[i].x=-0.1; }
      if(typeof drag!=="undefined" && drag && Math.random()<dt*10) tracks.push({x:drag.x,y:drag.y+drag.r,life:1});
      for(i=tracks.length-1;i>=0;i--){ tracks[i].life-=dt*0.4; if(tracks[i].life<=0) tracks.splice(i,1); }
      if(typeof wind!=="undefined" && wind>0.3 && Math.random()<dt*8) puffWind.push({x:20,y:80+Math.random()*120,life:0.6});
      for(i=puffWind.length-1;i>=0;i--){ puffWind[i].life-=dt; puffWind[i].x+=80*dt; if(puffWind[i].life<=0) puffWind.splice(i,1); }
    }
    function flavorDraw(){
      var i;
      for(i=0;i<tracks.length;i++){
        x.globalAlpha=Math.max(0,tracks[i].life*0.4);
        x.fillStyle="#cbd5e1"; x.beginPath(); x.ellipse(tracks[i].x,tracks[i].y,8,3,0,0,Math.PI*2); x.fill();
      }
      x.globalAlpha=1;
      for(i=0;i<chickadee.length;i++){
        x.font="14px serif";
        x.fillText("🐦", chickadee[i].x*W, chickadee[i].y*H+Math.sin(chickadee[i].ph)*4);
      }
      for(i=0;i<puffWind.length;i++){
        x.globalAlpha=Math.max(0,puffWind[i].life);
        x.strokeStyle="#e0f2fe"; x.beginPath(); x.moveTo(puffWind[i].x,puffWind[i].y); x.lineTo(puffWind[i].x+20,puffWind[i].y); x.stroke();
      }
      x.globalAlpha=1;
      if(typeof friend!=="undefined"){
        x.fillStyle="#0c4a6e"; x.font="bold 12px Trebuchet MS"; x.textAlign="left";
        x.fillText("friend "+(friend+1)+" / 5  roll to grow", 14, H-64);
      }
    }

    function extraWorld(){
      var _i,_a;
      _a=0.08+0.04*Math.sin(t+0); x.fillStyle='#e0f2fe'; x.globalAlpha=_a;
      x.fillRect((0+t*8)%W, 20, 4, 3); /* drift 0 */
      _a=0.08+0.04*Math.sin(t+1); x.fillStyle='#fff'; x.globalAlpha=_a;
      x.fillRect((47+t*8)%W, 51, 5, 4); /* flake 1 */
      _a=0.08+0.04*Math.sin(t+2); x.fillStyle='#1e293b'; x.globalAlpha=_a;
      x.fillRect((94+t*8)%W, 82, 6, 5); /* hat brim 2 */
      _a=0.08+0.04*Math.sin(t+3); x.fillStyle='#f97316'; x.globalAlpha=_a;
      x.fillRect((44+t*8)%W, 30, 7, 6); /* carrot 3 */
      _a=0.08+0.04*Math.sin(t+4); x.fillStyle='#7dd3fc'; x.globalAlpha=_a;
      x.fillRect((91+t*8)%W, 61, 8, 3); /* ice 4 */
      _a=0.08+0.04*Math.sin(t+5); x.fillStyle='#e0f2fe'; x.globalAlpha=_a;
      x.fillRect((41+t*8)%W, 92, 4, 4); /* drift 5 */
      _a=0.08+0.04*Math.sin(t+6); x.fillStyle='#fff'; x.globalAlpha=_a;
      x.fillRect((88+t*8)%W, 40, 5, 5); /* flake 6 */
      _a=0.08+0.04*Math.sin(t+7); x.fillStyle='#1e293b'; x.globalAlpha=_a;
      x.fillRect((38+t*8)%W, 71, 6, 6); /* hat brim 7 */
      _a=0.08+0.04*Math.sin(t+8); x.fillStyle='#f97316'; x.globalAlpha=_a;
      x.fillRect((85+t*8)%W, 102, 7, 3); /* carrot 8 */
      _a=0.08+0.04*Math.sin(t+9); x.fillStyle='#7dd3fc'; x.globalAlpha=_a;
      x.fillRect((35+t*8)%W, 50, 8, 4); /* ice 9 */
      _a=0.08+0.04*Math.sin(t+10); x.fillStyle='#e0f2fe'; x.globalAlpha=_a;
      x.fillRect((82+t*8)%W, 81, 4, 5); /* drift 10 */
      _a=0.08+0.04*Math.sin(t+11); x.fillStyle='#fff'; x.globalAlpha=_a;
      x.fillRect((32+t*8)%W, 29, 5, 6); /* flake 11 */
      _a=0.08+0.04*Math.sin(t+12); x.fillStyle='#1e293b'; x.globalAlpha=_a;
      x.fillRect((79+t*8)%W, 60, 6, 3); /* hat brim 12 */
      _a=0.08+0.04*Math.sin(t+13); x.fillStyle='#f97316'; x.globalAlpha=_a;
      x.fillRect((29+t*8)%W, 91, 7, 4); /* carrot 13 */
      _a=0.08+0.04*Math.sin(t+14); x.fillStyle='#7dd3fc'; x.globalAlpha=_a;
      x.fillRect((76+t*8)%W, 39, 8, 5); /* ice 14 */
      _a=0.08+0.04*Math.sin(t+15); x.fillStyle='#e0f2fe'; x.globalAlpha=_a;
      x.fillRect((26+t*8)%W, 70, 4, 6); /* drift 15 */
      _a=0.08+0.04*Math.sin(t+16); x.fillStyle='#fff'; x.globalAlpha=_a;
      x.fillRect((73+t*8)%W, 101, 5, 3); /* flake 16 */
      _a=0.08+0.04*Math.sin(t+17); x.fillStyle='#1e293b'; x.globalAlpha=_a;
      x.fillRect((23+t*8)%W, 49, 6, 4); /* hat brim 17 */
