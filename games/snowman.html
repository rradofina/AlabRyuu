<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Snowman Build</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#e0f2fe}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="st">Stack</b></div>
  <div id="say">Tap Big, then Mid, then Little!</div>
  <div class="dock" id="dock">
    <button id="big"><span>⚪</span>Big</button>
    <button id="mid"><span>⚪</span>Mid</button>
    <button id="lit"><span>⚪</span>Little</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">⛄</div>
    <h1>Snowman Build</h1>
    <p>Stack 3 snowballs. Then decorate!</p>
    <button class="play" id="go">Build</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">⛄</div>
    <h1>Hello snowman!</h1>
    <p>Carrot nose and all.</p>
    <button class="play g" id="again">Build again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, step = 0;
    var ORDER = ["big", "mid", "lit"];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; step = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      document.getElementById("say").textContent = "Tap Big first!";
      document.getElementById("st").textContent = "Stack";
    }
    function add(name) {
      if (!play) return;
      if (name === ORDER[step]) {
        step++;
        if (step === 1) document.getElementById("say").textContent = "Now Mid!";
        if (step === 2) document.getElementById("say").textContent = "Now Little!";
        if (step === 3) {
          document.getElementById("say").textContent = "Yay! Face time.";
          document.getElementById("dock").innerHTML = '<button id="face"><span>🥕</span>Face</button>';
          document.getElementById("face").onclick = function () {
            play = false;
            document.getElementById("dock").classList.remove("on");
            document.getElementById("win").classList.remove("off");
          };
        }
      } else document.getElementById("say").textContent = "Stack in order: Big, Mid, Little.";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = function () {
      document.getElementById("dock").innerHTML = '<button id="big"><span>⚪</span>Big</button><button id="mid"><span>⚪</span>Mid</button><button id="lit"><span>⚪</span>Little</button>';
      document.getElementById("big").onclick = function () { add("big"); };
      document.getElementById("mid").onclick = function () { add("mid"); };
      document.getElementById("lit").onclick = function () { add("lit"); };
      start();
    };
    document.getElementById("big").onclick = function () { add("big"); };
    document.getElementById("mid").onclick = function () { add("mid"); };
    document.getElementById("lit").onclick = function () { add("lit"); };
    function loop() {
      x.fillStyle = "#e0f2fe"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#fff"; x.fillRect(0, H * 0.72, W, H);
      em("❄️", 40, 90, 40); em("❄️", W - 40, 110, 36);
      if (step >= 1) em("⚪", W * 0.5, H * 0.64, 96);
      if (step >= 2) em("⚪", W * 0.5, H * 0.50, 72);
      if (step >= 3) em("⚪", W * 0.5, H * 0.38, 56);
      if (!play && step >= 3) em("⛄", W * 0.5, H * 0.48, 120);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
