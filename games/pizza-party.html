<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pizza Party</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:#1c0808;color:#fff;touch-action:none;user-select:none}
    .home{position:fixed;top:12px;left:12px;z-index:8;color:#fff;text-decoration:none;font-weight:800;font-size:17px;background:rgba(0,0,0,.4);padding:8px 14px;border-radius:999px;touch-action:manipulation}
    canvas{display:block;width:100%;height:100%}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <script>
  (function(){
    var cv=document.getElementById("c"),x=cv.getContext("2d");
    function em(ch,px,py,s){ x.font=s+"px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(ch,px,py); }
    var W,H,T=0,last=0,stage="title",order=0,stars=0,mx=0,my=0,down=0,drag=null;
    var bits=[],hits=[],say="Tap Play!",door=0,slide=0,bake=0,glow=0,bounce=0,combo=0,extra=0;
    var toppings=[],placed=[],wait=1,custX=0,neon=0,spark=[],peel=0,served=0,shake=0;
    var TOPS=[{id:"pep",col:"#b91c1c",dot:"#fecaca",n:"Pep"},{id:"msh",col:"#d6d3d1",dot:"#78716c",n:"Shroom"},{id:"olv",col:"#365314",dot:"#a3e635",n:"Olive"},{id:"pnp",col:"#fde047",dot:"#f59e0b",n:"Pine"},{id:"bas",col:"#166534",dot:"#86efac",n:"Basil"}];
    var ORDERS=[
      {who:"🦊",want:["pep","pep"],bonus:"bas",name:"Fox",col:"#fb923c"},
      {who:"🐧",want:["msh","olv"],bonus:"pep",name:"Peng",col:"#38bdf8"},
      {who:"🐱",want:["pnp","pep"],bonus:"bas",name:"Cat",col:"#f472b6"},
      {who:"🧒",want:["bas","olv","msh"],bonus:"pnp",name:"Kid",col:"#a78bfa"},
      {who:"🦄",want:["pep","pnp","bas","olv"],bonus:"msh",name:"Uni",col:"#c084fc"}
    ];
    function beep(f,d,tp){try{var ac=beep.ac||(beep.ac=new(window.AudioContext||window.webkitAudioContext)());var o=ac.createOscillator(),g=ac.createGain();o.type=tp||"square";o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d);}catch(e){}}
    function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
    addEventListener("resize",resize);resize();
    function rnd(a,b){return a+Math.random()*(b-a);}
    function round(a,b,w,h,r,col){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();if(col){x.fillStyle=col;x.fill();}}
    function ellipse(cx,cy,rx,ry,col){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,6.28);if(col){x.fillStyle=col;x.fill();}}
    function hitAt(px,py){for(var i=hits.length-1;i>=0;i--){var h=hits[i];if(px>=h.x&&px<=h.x+h.w&&py>=h.y&&py<=h.y+h.h)return h;}return null;}
    function btn(id,bx,by,bw,bh,label,col,tc){
      hits.push({id:id,x:bx,y:by,w:bw,h:bh});
      round(bx,by+6,bw,bh,18,"rgba(0,0,0,.25)");round(bx,by,bw,bh-4,18,col||"#ffd166");
      x.fillStyle=tc||"#3b2100";x.font="800 "+Math.floor(bh*0.34)+"px Trebuchet MS";x.textAlign="center";x.textBaseline="middle";
      x.fillText(label,bx+bw/2,by+bh/2-3);
    }
    function drawTop(id,cx,cy,s){
      var ch=id==="pep"?"🥓":id==="msh"?"🍄":id==="olv"?"🫒":id==="pnp"?"🍍":"🌿";
      em(ch,cx,cy,Math.max(16,s*2.4));
    }
    function drawPizza(cx,cy,r,baked,list){
      ellipse(cx,cy+8,r*1.02,r*0.28,"rgba(0,0,0,.2)");
      em(baked?"🍕":"🫓",cx,cy,r*2.15);
      for(var i=0;i<(list||placed).length;i++){
        var p=(list||placed)[i];
        drawTop(p.id,cx+p.ox*r*0.55,cy+p.oy*r*0.55,r*0.16);
      }
    }
    function drawWho(who,cx,cy,s){
      em(who||"🧒",cx,cy,Math.max(22,s*2.5));
    }
    function drawCustomer(cx,cy,o,kind){
      var by=cy+Math.sin(T*4+o)*6*(kind==="wait"?1:1.6);
      ellipse(cx,cy+48,22,8,"rgba(0,0,0,.2)");
      x.fillStyle=o.col;round(cx-16,by+8,32,28,8,o.col);
      drawWho(o.who,cx,by-8,16);
      if(kind==="wait"){
        x.fillStyle="#fffbeb";round(cx+22,by-36,56,28,8,"#fffbeb");
        x.fillStyle="#7c2d12";x.font="800 11px Trebuchet MS";x.fillText("yum?",cx+50,by-22);
      }
    }
    function drawShop(){
      var g=x.createLinearGradient(0,0,0,H);
      g.addColorStop(0,"#7f1d1d");g.addColorStop(.35,"#9a3412");g.addColorStop(1,"#1c1917");
      x.fillStyle=g;x.fillRect(0,0,W,H);
      for(var i=0;i<12;i++)for(var j=0;j<4;j++){
        x.fillStyle=(i+j)%2?"#fff7ed":"#dc2626";
        x.fillRect(i*(W/11),H*0.72+j*18,W/11,18);
      }
      x.fillStyle="#292524";x.fillRect(0,0,W,H*0.16);
      x.fillStyle="#a8a29e";x.fillRect(10,18,W-20,6);
      for(i=0;i<5;i++){
        var tx=30+i*((W-60)/4.2),on=i===order;
        x.save();x.translate(tx,70);x.rotate(on?0:-0.12+Math.sin(T+i)*0.03);
        x.fillStyle=on?"#fde68a":"#fffbeb";
        x.beginPath();x.moveTo(-22,-28);x.lineTo(22,-28);x.lineTo(22,22);x.lineTo(12,30);x.lineTo(0,22);x.lineTo(-12,30);x.lineTo(-22,22);x.closePath();x.fill();
        if(on){x.strokeStyle="#ea580c";x.lineWidth=3;x.stroke();}
        x.fillStyle="#7c2d12";x.font="800 10px Trebuchet MS";x.textAlign="center";
        x.fillText(ORDERS[i].name,0,-8);
        for(var k=0;k<ORDERS[i].want.length;k++)drawTop(ORDERS[i].want[k],-12+k*12,8,7);
        x.restore();
      }
      neon=0.6+0.4*Math.sin(T*6);
      x.save();x.shadowColor="#fb7185";x.shadowBlur=12+neon*16;
      x.fillStyle="#fb7185";x.font="800 22px Trebuchet MS";x.textAlign="center";
      x.fillText("PIZZA  •  PARTY",W/2,H*0.20);
      x.restore();
      x.fillStyle="#b45309";round(16,H*0.58,W*0.52,H*0.16,20,"#b45309");
    }
    function drawOven(ox,oy,ow,oh){
      x.fillStyle="#7c2d12";round(ox-8,oy+oh-16,ow+16,28,8,"#7c2d12");
      for(var i=0;i<6;i++)for(var j=0;j<5;j++){
        x.fillStyle=(i+j)%2?"#9a3412":"#7c2d12";
        x.fillRect(ox+i*(ow/6),oy+j*(oh/5),ow/6-2,oh/5-2);
      }
      var ax=ox+ow*0.12,ay=oy+oh*0.18,aw=ow*0.76,ah=oh*0.62;
      x.beginPath();x.moveTo(ax,ay+ah);x.lineTo(ax,ay+ah*0.35);x.quadraticCurveTo(ax+aw/2,ay-10,ax+aw,ay+ah*0.35);x.lineTo(ax+aw,ay+ah);x.closePath();
      var heat=x.createRadialGradient(ax+aw/2,ay+ah*0.7,8,ax+aw/2,ay+ah*0.5,aw);
      heat.addColorStop(0,"rgba(251,191,36,"+(0.2+glow*0.8)+")");heat.addColorStop(1,"#1c1917");
      x.fillStyle=glow>0.1?heat:"#1c1917";x.fill();
      x.save();x.translate(ax,ay+ah);x.rotate(-door*1.4);
      x.fillStyle="#292524";x.fillRect(0,-ah,aw*0.55,ah);x.fillStyle="#a8a29e";x.fillRect(aw*0.42,-ah*0.55,8,16);
      x.restore();
      hits.push({id:"oven",x:ox,y:oy,w:ow,h:oh});
    }
    function drawWell(){
      x.fillStyle="#1c1917";round(12,H-118,W-24,104,18,"#1c1917");
      for(var i=0;i<TOPS.length;i++){
        var bx=28+i*((W-50)/5),by=H-68;
        hits.push({id:"top-"+TOPS[i].id,x:bx-28,y:by-28,w:56,h:56,tid:TOPS[i].id});
        round(bx-28,by-28,56,56,14,"#fff7ed");
        drawTop(TOPS[i].id,bx,by,14);
        x.fillStyle="#7c2d12";x.font="800 11px Trebuchet MS";x.textAlign="center";x.fillText(TOPS[i].n,bx,by+22);
      }
    }
    function drawHud(){
      round(W-160,10,148,34,16,"rgba(255,247,237,.92)");
      x.fillStyle="#7c2d12";x.font="800 14px Trebuchet MS";x.textAlign="left";x.textBaseline="middle";
      x.fillText("Pie "+(order+1)+"/5  ⭐ "+stars,W-146,27);
      round(20,H*0.22,Math.min(W-40,420),36,12,"rgba(255,247,237,.9)");
      x.fillStyle="#7c2d12";x.font="800 15px Trebuchet MS";x.textAlign="left";
      x.fillText(say,32,H*0.22+18);
    }
    function resetOrder(){
      placed=[];door=0;slide=0;bake=0;glow=0;combo=0;extra=0;wait=1;served=0;peel=0;shake=0;
      say="Drag toppings onto the dough.";
    }
    function start(){stage="build";order=0;stars=0;resetOrder();beep(440,.1);}
    function pointer(e,kind){
      var r=cv.getBoundingClientRect();
      mx=(e.clientX||(e.touches&&e.touches[0].clientX)||0)-r.left;
      my=(e.clientY||(e.touches&&e.touches[0].clientY)||0)-r.top;
      if(kind==="down"){down=1;onDown();}
      if(kind==="move"&&down)onMove();
      if(kind==="up"){onUp();down=0;drag=null;}
    }
    function onDown(){
      var h=hitAt(mx,my);if(!h)return;
      if(h.id==="play"){start();return;}
      if(h.id==="again"){stage="title";say="Tap Play!";return;}
      if(stage==="build"&&h.id.indexOf("top-")===0){drag={id:h.tid,x:mx,y:my};beep(320,.05);}
      if(stage==="oven"&&h.id==="oven"){if(door<0.2){door=0.05;say="Door opens...";beep(260,.1);}else if(slide>=1&&bake<1){bake=0.01;say="Bake glow!";beep(500,.1);}}
      if(stage==="serve"&&h.id==="serve"){doServe();}
      if(stage==="combo"&&h.id==="yes"){extra=1;combo=1;placed.push({id:ORDERS[order].bonus,ox:rnd(-.4,.4),oy:rnd(-.4,.4)});stage="oven";say="Bonus on! Bake it.";beep(880,.12);}
      if(stage==="combo"&&h.id==="no"){stage="oven";say="Into the brick oven!";beep(400,.08);}
    }
    function onMove(){if(drag){drag.x=mx;drag.y=my;}}
    function onUp(){
      if(drag&&stage==="build"){
        var dx=drag.x-W*0.32,dy=drag.y-H*0.48,rr=Math.min(90,W*0.18);
        if(dx*dx+dy*dy<rr*rr){
          placed.push({id:drag.id,ox:dx/rr,oy:dy/rr});
          beep(620,.08);
          if(hasAll()){stage="combo";say="Extra "+nameOf(ORDERS[order].bonus)+"? Combo!";beep(760,.12);}
        }
      }
    }
    function nameOf(id){for(var i=0;i<TOPS.length;i++)if(TOPS[i].id===id)return TOPS[i].n;return id;}
    function hasAll(){
      var need=ORDERS[order].want.slice(),ok=0;
      for(var i=0;i<placed.length;i++){
        var k=need.indexOf(placed[i].id);if(k>=0){need.splice(k,1);ok++;}
      }
      return need.length===0;
    }
    function doServe(){
      served=1;stars+=2+(combo?1:0)+(wait>0.35?1:0);
      beep(980,.16);say=ORDERS[order].name+" is happy!";
    }
    function step(dt){
      if(stage==="oven"){
        if(door>0&&door<1)door=Math.min(1,door+dt*1.2);
        if(door>=1&&slide<1){slide=Math.min(1,slide+dt*0.8);if(slide>=1)say="Tap oven to bake.";}
        if(bake>0&&bake<1){bake=Math.min(1,bake+dt*0.55);glow=bake;if(Math.random()<0.3)spark.push({x:W*0.74+rnd(-30,30),y:H*0.48+rnd(-20,20),life:0.4});}
        if(bake>=1){stage="serve";say="Serve the bouncing guest!";}
      }
      if(stage==="serve"||stage==="build"||stage==="combo")wait=Math.max(0.25,wait-dt*0.03);
      if(served){bounce+=dt;if(bounce>1.1){if(order>=4){stage="win";say="Party fed!";}else{order++;resetOrder();stage="build";bounce=0;served=0;}}}
      for(var i=spark.length-1;i>=0;i--){spark[i].life-=dt;if(spark[i].life<=0)spark.splice(i,1);}
      if(stage==="title"&&Math.random()<0.1)spark.push({x:rnd(20,W-20),y:rnd(H*0.3,H*0.6),life:0.6});
    }
    function drawBuild(){
      drawShop();
      drawCustomer(W*0.82,H*0.42,ORDERS[order],"wait");
      x.fillStyle="#fffbeb";round(W*0.68,H*0.22,W*0.28,64,12,"#fffbeb");
      x.fillStyle="#7c2d12";x.font="800 13px Trebuchet MS";x.textAlign="center";
      x.fillText(ORDERS[order].name+" wants",W*0.82,H*0.25+12);
      for(var i=0;i<ORDERS[order].want.length;i++)drawTop(ORDERS[order].want[i],W*0.74+i*28,H*0.25+38,11);
      x.fillStyle="#b45309";round(W*0.08,H*0.36,W*0.48,H*0.28,30,"#b45309");
      drawPizza(W*0.32,H*0.48,Math.min(90,W*0.18),0,placed);
      drawWell();
      if(drag)drawTop(drag.id,drag.x,drag.y,16);
      x.fillStyle="#7c2d12";round(W*0.1,H*0.66,W*0.4,10,5,"#fed7aa");
      x.fillStyle="#ea580c";round(W*0.1,H*0.66,W*0.4*wait,10,5,"#ea580c");
    }
    function drawCombo(){
      drawShop();
      drawPizza(W*0.35,H*0.46,80,0,placed);
      x.fillStyle="#fffbeb";round(W*0.58,H*0.32,W*0.36,160,16,"#fffbeb");
      x.fillStyle="#7c2d12";x.font="800 16px Trebuchet MS";x.textAlign="center";
      x.fillText("Combo extra?",W*0.76,H*0.38);
      drawTop(ORDERS[order].bonus,W*0.76,H*0.46,18);
      btn("yes",W*0.62,H*0.56,70,40,"Yes!","#86efac","#14532d");
      btn("no",W*0.78,H*0.56,70,40,"Skip","#fecaca","#7f1d1d");
    }
    function drawOvenSt(){
      drawShop();
      drawOven(W*0.52,H*0.28,W*0.42,H*0.4);
      var px=W*0.28+slide*W*0.36,py=H*0.48;
      x.save();x.translate(px-70,py);x.fillStyle="#92400e";round(0,-12,90,24,12,"#92400e");x.restore();
      drawPizza(px,py,56,bake>0.5,placed);
      for(var i=0;i<spark.length;i++){x.globalAlpha=spark[i].life;ellipse(spark[i].x,spark[i].y,4,4,"#fde047");}
      x.globalAlpha=1;
    }
    function drawServe(){
      drawShop();
      drawCustomer(W*0.72,H*0.44,ORDERS[order],served?"joy":"wait");
      drawPizza(W*0.32,H*0.48,70,1,placed);
      btn("serve",W/2-70,H*0.78,140,50,"Serve!","#ffd166","#3b2100");
    }
    function drawTitle(){
      drawShop();
      for(var i=0;i<3;i++)drawCustomer(W*0.2+i*W*0.22,H*0.42,ORDERS[i],"wait");
      drawPizza(W*0.5,H*0.62,50,0,[{id:"pep",ox:-.2,oy:.1},{id:"bas",ox:.3,oy:-.2},{id:"pnp",ox:.1,oy:.3}]);
      x.fillStyle="#fff7ed";x.font="800 "+Math.floor(Math.min(48,W/8))+"px Trebuchet MS";x.textAlign="center";
      x.fillText("Pizza Party",W/2,H*0.28);
      btn("play",W/2-80,H*0.78,160,54,"Play!","#ffd166","#3b2100");
      say="Tickets. Drag. Bake. Bounce.";
    }
    function drawWin(){
      drawShop();
      x.fillStyle="rgba(28,8,8,.6)";x.fillRect(0,0,W,H);
      x.fillStyle="#fff7ed";x.font="800 42px Trebuchet MS";x.textAlign="center";
      x.fillText("Party pizzas!",W/2,H*0.28);
      x.font="800 20px Trebuchet MS";x.fillText("⭐ "+stars+"  •  5 happy guests",W/2,H*0.38);
      for(var i=0;i<5;i++)drawCustomer(W*0.16+i*W*0.16,H*0.52,ORDERS[i],"joy");
      btn("again",W/2-80,H*0.74,160,52,"Again","#86efac","#14532d");
    }
    function drawAwning(){
      for(var i=0;i<12;i++){x.fillStyle=i%2?"#dc2626":"#fff7ed";x.beginPath();x.moveTo(i*W/11,H*0.16);x.lineTo((i+1)*W/11,H*0.16);x.lineTo((i+0.5)*W/11,H*0.22);x.closePath();x.fill();}
    }
    function drawCans(){
      var cols=["#b91c1c","#166534","#fde047"];
      for(var i=0;i<3;i++){round(18+i*28,H*0.5,22,34,4,cols[i]);x.fillStyle="#fff";x.font="800 8px Trebuchet MS";x.textAlign="center";x.fillText(["TOM","HERB","OIL"][i],29+i*28,H*0.52+16);}
    }
    function drawClockP(){
      ellipse(W*0.9,H*0.28,16,16,"#fffbeb");x.strokeStyle="#7c2d12";x.lineWidth=2;x.beginPath();x.arc(W*0.9,H*0.28,16,0,6.28);x.stroke();
      x.save();x.translate(W*0.9,H*0.28);x.rotate(T*0.2);x.beginPath();x.moveTo(0,0);x.lineTo(0,-10);x.stroke();x.restore();
    }
    function drawPlant(){
      x.fillStyle="#166534";x.fillRect(W*0.06,H*0.42,6,40);
      for(var i=0;i<5;i++){ellipse(W*0.07+Math.sin(T+i)*4,H*0.4-i*8,8,5,"#22c55e");}
    }
    function drawCheese(cx,cy){
      if(placed.length<2)return;
      x.strokeStyle="rgba(253,230,138,.8)";x.lineWidth=3;
      x.beginPath();x.moveTo(cx-20,cy);x.quadraticCurveTo(cx,cy+20+Math.sin(T*6)*8,cx+24,cy+8);x.stroke();
    }
    function drawWaitKind(){
      x.fillStyle="#fff7ed";x.font="800 11px Trebuchet MS";x.textAlign="center";
      x.fillText(wait>0.4?"Guest waits kindly":"Still smiling!",W*0.82,H*0.7);
    }
    function extrasShop(){drawAwning();drawCans();drawClockP();drawPlant();}
    function draw(){
      hits=[];
      if(stage==="title")drawTitle();
      else if(stage==="build")drawBuild();
      else if(stage==="combo")drawCombo();
      else if(stage==="oven")drawOvenSt();
      else if(stage==="serve")drawServe();
      else drawWin();
      if(stage!=="win")extrasShop();
      if(stage==="build"){drawCheese(W*0.32,H*0.48);drawWaitKind();}
      try{pizzaLayer();}catch(e){}try{pz2Layer();}catch(e){}
      if(stage!=="title"&&stage!=="win")drawHud();
    }
    cv.addEventListener("pointerdown",function(e){pointer(e,"down");});
    cv.addEventListener("pointermove",function(e){pointer(e,"move");});
    cv.addEventListener("pointerup",function(e){pointer(e,"up");});

    var seats=[],sauce=[],neonFlick=0,peelDust=[];
    function drawBooth(){
      x.fillStyle="#7f1d1d";round(W*0.62,H*0.58,W*0.34,H*0.14,12,"#7f1d1d");
      x.fillStyle="#fca5a5";round(W*0.64,H*0.56,W*0.3,18,8,"#fca5a5");
      for(var i=0;i<2;i++){
        ellipse(W*0.7+i*60,H*0.66,16,6,"rgba(0,0,0,.15)");
        x.fillStyle=["#93c5fd","#fde68a"][i];round(W*0.7+i*60-12,H*0.58,24,20,6,x.fillStyle);
        x.font="22px serif";x.textAlign="center";x.fillText(["🧒","🐱"][i],W*0.7+i*60,H*0.56);
      }
    }
    function drawMenuBoard(){
      round(W*0.08,H*0.24,110,70,8,"#1c1917");
      x.fillStyle="#fde68a";x.font="800 10px Trebuchet MS";x.textAlign="left";
      x.fillText("MENU",W*0.1,H*0.27);
      x.fillText("Pep pie",W*0.1,H*0.33);
      x.fillText("Shroom",W*0.1,H*0.39);
      x.fillText("Party",W*0.1,H*0.45);
    }
    function drawNeonSign(){
      neonFlick=Math.sin(T*8)> -0.7?1:0.25;
      x.save();x.shadowColor="#fb7185";x.shadowBlur=10*neonFlick;
      x.strokeStyle="rgba(251,113,133,"+neonFlick+")";x.lineWidth=3;

        x.globalAlpha=1;x.shadowBlur=0;return; }
      if(kind==="matWelcome"){ var bob=0;
        round(px-11,py-9,22,18,5,"#7c2d12");x.fillStyle="#1c1917";x.font="800 8px Trebuchet MS";x.textAlign="center";x.fillText("mat",px,py+2);
        x.globalAlpha=1;x.shadowBlur=0;return; }
      if(kind==="clockRound"){ var bob=0;
        x.save();x.translate(px,py);x.rotate(t*0.3);px=0;py=0;
        ellipse(px,py,11,11,"#fffbeb");x.strokeStyle="#1c1917";x.beginPath();x.arc(px,py,11,0,6.28);x.stroke();x.beginPath();x.moveTo(px,py);x.lineTo(px,py-8);x.stroke();
        x.restore();
        x.globalAlpha=1;x.shadowBlur=0;return; }
      if(kind==="candle"){ var bob=0;
        x.globalAlpha=0.55+0.45*Math.sin(t*4);
        ellipse(px,py,8,8,"#fde047");x.globalAlpha=0.2;ellipse(px,py,18,14,"#fde047");
        x.globalAlpha=1;x.shadowBlur=0;return; }
      if(kind==="photoFrame"){ var bob=0;
        round(px-16,py-10,32,20,4,"#fef3c7");x.fillStyle="#1c1917";x.font="800 8px Trebuchet MS";x.textAlign="center";x.fillText("phot",px,py);
        x.globalAlpha=1;x.shadowBlur=0;return; }
      if(kind==="jarTips"){ var bob=0;
        round(px-10,py-12,20,24,5,"#86efac");pz2Dot(px,py-16,"#a8a29e",4);
        x.globalAlpha=1;x.shadowBlur=0;return; }
      if(kind==="scooter"){ var bob=0;
        ellipse(px,py,9,7,"#ef4444");pz2Dot(px+4,py-2,"#1c1917",1.5);x.beginPath();x.moveTo(px-8,py);x.quadraticCurveTo(px-14,py-8,px-6,py+2);x.fillStyle="#ef4444";x.fill();
        x.globalAlpha=1;x.shadowBlur=0;return; }
      if(kind==="flagItaly"){ var bob=0;
        px+=Math.sin(t*2)*3;
        round(px-11,py-9,22,18,5,"#22c55e");x.fillStyle="#1c1917";x.font="800 8px Trebuchet MS";x.textAlign="center";x.fillText("flag",px,py+2);
        x.globalAlpha=1;x.shadowBlur=0;return; }
    }
    var pz2Lay=[
      {k:"brick",x:0.07,y:0.18},
      {k:"neonEat",x:0.22,y:0.18},
      {k:"ticketSpike",x:0.37,y:0.18},
      {k:"oregano",x:0.52,y:0.18},

      {k:"redPepper",x:0.82,y:0.18},
      {k:"pizzaBox",x:0.07,y:0.27},
      {k:"sodaFountain",x:0.22,y:0.27},
      {k:"boothCush",x:0.37,y:0.27},
      {k:"checkCloth",x:0.52,y:0.27},
      {k:"garlicBraid",x:0.67,y:0.27},
      {k:"onion",x:0.82,y:0.27},
      {k:"bellPep",x:0.07,y:0.36},
      {k:"anchovy",x:0.22,y:0.36},
      {k:"doughBall",x:0.37,y:0.36},
      {k:"saucePan",x:0.52,y:0.36},
      {k:"woodPeel",x:0.67,y:0.36},

      {k:"sparkle",x:0.07,y:0.45},
      {k:"fanBlade",x:0.22,y:0.45},
      {k:"radio",x:0.37,y:0.45},
      {k:"plantHanging",x:0.52,y:0.45},
      {k:"mosaic",x:0.67,y:0.45},
      {k:"matWelcome",x:0.82,y:0.45},
      {k:"clockRound",x:0.07,y:0.54},
      {k:"candle",x:0.22,y:0.54},
      {k:"photoFrame",x:0.37,y:0.54},
      {k:"jarTips",x:0.52,y:0.54},
      {k:"scooter",x:0.67,y:0.54},
      {k:"flagItaly",x:0.82,y:0.54},
    ];

    function pz2Layer(){
      pz2Tick=T;
      for(var i=0;i<pz2Lay.length;i++){
        var it=pz2Lay[i];
        pz2Item(it.k, it.x*W, it.y*H, T+i);
      }
      if(Math.random()<0.1) pz2Bits.push({x:Math.random()*W,y:H*0.2,vy:18,life:1,c:pz2Say[i%8]? "#fff7ed":"#fde68a"});
      for(var j=pz2Bits.length-1;j>=0;j--){
        var b=pz2Bits[j];b.life-=0.02;b.y+=b.vy*0.016;
        x.globalAlpha=Math.max(0,b.life);x.fillStyle=b.c;x.fillRect(b.x,b.y,3,3);
        if(b.life<=0)pz2Bits.splice(j,1);
      }
      x.globalAlpha=1;
      x.fillStyle="rgba(0,0,0,.0)";
      var q=pz2Say[Math.floor(T)%pz2Say.length];
      if(false) x.fillText(q,20,20);
    }

    function loop(now){var dt=Math.min(.033,(now-last)/1000)||.016;last=now;T=now/1000;step(dt);draw();requestAnimationFrame(loop);}
    requestAnimationFrame(loop);
  })();
