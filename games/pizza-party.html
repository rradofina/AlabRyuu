<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pizza Party</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>html,body{background:#7c2d12}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="od">Order</b></div>
  <div id="say">Add cheese, tomato, mush!</div>
  <div class="dock" id="dock">
    <button id="ch"><span>🧀</span>Cheese</button>
    <button id="tm"><span>🍅</span>Tomato</button>
    <button id="ms"><span>🍄</span>Mush</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🍕</div>
    <h1>Pizza Party</h1>
    <p>Tap toppings. Then the pizza is done!</p>
    <button class="play" id="go">Cook</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🍕</div>
    <h1>Pizza ready!</h1>
    <p>Hot and yummy.</p>
    <button class="play g" id="again">Cook again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, have = { ch: 0, tm: 0, ms: 0 };
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; have = { ch: 0, tm: 0, ms: 0 };
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      document.getElementById("say").textContent = "Add cheese, tomato, mush!";
      document.getElementById("od").textContent = "🧀🍅🍄";
    }
    function add(k, name) {
      if (!play) return;
      have[k] = 1;
      document.getElementById("say").textContent = name + " on!";
      if (have.ch && have.tm && have.ms) {
        play = false;
        document.getElementById("dock").classList.remove("on");
        document.getElementById("win").classList.remove("off");
      }
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("ch").onclick = function () { add("ch", "Cheese"); };
    document.getElementById("tm").onclick = function () { add("tm", "Tomato"); };
    document.getElementById("ms").onclick = function () { add("ms", "Mushroom"); };
    function loop() {
      x.fillStyle = "#fed7aa"; x.fillRect(0, 0, W, H);
      em("👨‍🍳", 60, 110, 56);
      em("🫓", W * 0.5, H * 0.42, 140);
      if (have.ch) em("🧀", W * 0.42, H * 0.40, 48);
      if (have.tm) em("🍅", W * 0.56, H * 0.38, 48);
      if (have.ms) em("🍄", W * 0.50, H * 0.48, 48);
      if (have.ch && have.tm && have.ms) em("🍕", W * 0.5, H * 0.42, 120);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
