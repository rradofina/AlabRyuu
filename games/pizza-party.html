<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pizza Party</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#7c2d12;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;background:linear-gradient(#fed7aa,#fb7185);padding:56px 14px 24px;text-align:center}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    h1{font-size:clamp(28px,8vw,42px)}
    .order{display:inline-block;background:#fff;padding:8px 16px;border-radius:999px;font-weight:800;margin:8px;box-shadow:0 5px 0 #ea580c}
    .pie{width:min(240px,70vw);height:240px;margin:12px auto;border-radius:50%;background:#f59e0b;box-shadow:inset 0 0 0 18px #fbbf24,0 10px 0 #b45309;position:relative}
    .top{position:absolute;font-size:36px;transform:translate(-50%,-50%)}
    .tops{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px}
    .tops button{width:72px;height:72px;border-radius:20px;background:#fff7ed;font-size:34px;box-shadow:0 6px 0 #c2410c}
    .tops button:active{transform:translateY(3px)}
    .serve{margin-top:8px;background:#ffd166;color:#3b2100;font-weight:800;font-size:22px;padding:12px 24px;border-radius:999px;box-shadow:0 6px 0 #e09f1f}
    .msg{font-weight:800;min-height:1.6em;margin-top:8px}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(60,10,20,.84);z-index:8;gap:12px;color:#fff}
    .win.on{display:flex}
    .play{background:#ffd166;color:#3b2100;font-weight:800;font-size:26px;padding:14px 28px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <h1>Pizza Party</h1>
  <div class="order" id="order"></div>
  <div class="pie" id="pie"></div>
  <div class="tops" id="tops"></div>
  <button class="serve" id="serve">Serve!</button>
  <p class="msg" id="msg">Tap toppings. Make the order.</p>
  <div class="win" id="win">
    <div style="font-size:72px">🍕</div>
    <h2>Party pizzas!</h2>
    <button class="play" id="again">Bake again</button>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var menu=[{e:"🍅",n:"tomato"},{e:"🧀",n:"cheese"},{e:"🍄",n:"mushroom"},{e:"🫒",n:"olive"},{e:"🍍",n:"pineapple"}];
    var need=[],have=[],score=0,pie=document.getElementById("pie");
    function round(){
      have=[];pie.innerHTML="";
      need=menu.slice().sort(function(){return Math.random()-.5;}).slice(0,2+Math.floor(Math.random()*2));
      document.getElementById("order").textContent="Order: "+need.map(function(t){return t.e;}).join(" ");
      document.getElementById("msg").textContent="Pizza "+(score+1)+" / 4";
    }
    menu.forEach(function(t){
      var b=document.createElement("button");b.textContent=t.e;
      b.onclick=function(){
        if(have.length>=6)return;
        have.push(t.e);
        var el=document.createElement("div");el.className="top";el.textContent=t.e;
        el.style.left=(30+Math.random()*40)+"%";el.style.top=(30+Math.random()*40)+"%";
        pie.appendChild(el);beep(500,.07);
      };
      document.getElementById("tops").appendChild(b);
    });
    document.getElementById("serve").onclick=function(){
      var ok=need.every(function(t){return have.indexOf(t.e)>=0;});
      if(!ok||!have.length){document.getElementById("msg").textContent="Hmm, that is not the order.";beep(180,.1);return;}
      score++;beep(820,.12);
      if(score>=4){document.getElementById("win").classList.add("on");beep(960,.2);} else round();
    };
    document.getElementById("again").onclick=function(){location.reload();};
    round();
  </script>
</body>
</html>
