<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Star Catch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      background: #07061a; color: #fff; touch-action: none; user-select: none;
    }
    button {
      background: transparent; border: 0; appearance: none;
      -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer;
    }
    .home {
      position: fixed; top: 12px; left: 12px; z-index: 12;
      color: #fff; text-decoration: none; font-weight: 800; font-size: 18px;
      background: rgba(255,255,255,.16); padding: 8px 14px; border-radius: 999px;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 12px; right: 12px; z-index: 12;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
      pointer-events: none;
    }
    #hud span {
      font-weight: 800; background: rgba(20,16,48,.72);
      padding: 6px 12px; border-radius: 16px; font-size: 15px;
      border: 2px solid rgba(253,230,138,.35);
    }
    #say {
      position: fixed; left: 50%; top: 72px; transform: translateX(-50%);
      z-index: 8; font-weight: 800; font-size: 20px; text-align: center;
      text-shadow: 0 3px 0 #1e1b4b; pointer-events: none; width: 90%;
    }
    #combo {
      position: fixed; left: 50%; top: 28%; transform: translate(-50%, -20px);
      font-weight: 800; font-size: 36px; color: #fde68a;
      text-shadow: 0 4px 0 #7c2d12, 0 0 18px #fbbf24;
      opacity: 0; pointer-events: none; z-index: 8; transition: opacity .15s;
    }
    #combo.on { opacity: 1; }
    .cover {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 12px; padding: 24px;
      background: linear-gradient(180deg, rgba(7,6,26,.42), rgba(15,10,40,.55));
    }
    .cover.off { display: none; }
    h1 { font-size: clamp(36px, 10vw, 56px); text-shadow: 0 5px 0 #312e81, 0 0 24px #818cf8; }
    .cover p { font-weight: 800; font-size: 18px; max-width: 320px; opacity: .95; }
    .btn {
      background: #fde68a; color: #422006; font-weight: 800; font-size: 26px;
      padding: 16px 36px; border-radius: 22px; box-shadow: 0 8px 0 #ca8a04;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #ca8a04; }
    .btn.g { background: #86efac; box-shadow: 0 8px 0 #16a34a; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud">
    <span id="night">Night 1</span>
    <span id="got">⭐ 0</span>
    <span id="lives">💛💛💛💛💛</span>
  </div>
  <div id="say">Catch stars!</div>
  <div id="combo"></div>
  <div class="cover" id="title">
    <h1>Star Catch</h1>
    <p>Drag the basket. Catch falling stars. Tap the moon to slow time. Connect the sky!</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <h1>Wish done!</h1>
    <p id="winP">Five nights. Big sky hugs.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), g = cv.getContext("2d");
    var W, H, t = 0, last = 0, mode = "title", night = 0, score = 0, lives = 5;
    var combo = 0, comboT = 0, moonSlow = 0, moonCool = 0, wish = 0;
    var basket = { x: 0, w: 118, h: 42, bob: 0 };
    var drag = false, pointerX = 0;
    var far = [], mid = [], near = [], hills = [], sparks = [], trails = [];
    var falling = [], shots = [], constel = [], lines = [];
    var meteors = [], wishes = [], fire = [], clouds = [];
    var shake = 0, flash = 0, sayT = 0;
    var NIGHTS = [
      { n: "Calm night", wind: 0, fall: 0.55, shot: 0.002, moon: 1, need: 8, shape: "cup", say: "Soft stars. Catch!" },
      { n: "Windy night", wind: 55, fall: 0.7, shot: 0.004, moon: 1, need: 10, shape: "kite", say: "Wind blows. Slide!" },
      { n: "Meteor night", wind: 12, fall: 0.85, shot: 0.028, moon: 1, need: 12, shape: "fish", say: "Catch the streaks!" },
      { n: "Moon close", wind: 8, fall: 0.5, shot: 0.006, moon: 1.7, need: 10, shape: "house", say: "Tap the big moon!" },
      { n: "Wish night", wind: 18, fall: 0.62, shot: 0.012, moon: 1.2, need: 14, shape: "heart", say: "Catch gold wishes!" }
    ];

    function beep(f, d, typ, vol) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), a = ac.createGain();
        o.type = typ || "sine"; o.frequency.value = f;
        a.gain.value = vol || 0.08;
        o.connect(a); a.connect(ac.destination);
        o.start();
        a.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function chord(notes, d) {
      for (var i = 0; i < notes.length; i++) beep(notes[i], d, "triangle", 0.05);
    }
    function say(s) {
      document.getElementById("say").textContent = s;
      sayT = 2.4;
    }
    function hud() {
      document.getElementById("night").textContent = NIGHTS[Math.min(night, 4)].n;
      document.getElementById("got").textContent = "⭐ " + score;
      var h = "";
      for (var i = 0; i < lives; i++) h += "💛";
      document.getElementById("lives").textContent = h || "…";
    }
    function showCombo() {
      var el = document.getElementById("combo");
      if (combo >= 3) {
        el.textContent = "Wow x" + combo + "!";
        el.classList.add("on");
        comboT = 0.9;
      }
    }
    function resize() {
      W = cv.width = innerWidth;
      H = cv.height = innerHeight;
      basket.x = W * 0.5;
      if (!far.length) seedSky();
    }
    function seedSky() {
      far = []; mid = []; near = []; hills = []; clouds = [];
      var i;
      for (i = 0; i < 70; i++) far.push({ x: Math.random() * 1400, y: Math.random() * 900, s: 0.6 + Math.random() * 1.1, tw: Math.random() * 6, c: Math.random() > 0.85 ? "#fde68a" : "#e0e7ff" });
      for (i = 0; i < 46; i++) mid.push({ x: Math.random() * 1400, y: Math.random() * 900, s: 1.1 + Math.random() * 1.6, tw: Math.random() * 6, c: Math.random() > 0.7 ? "#fbcfe8" : "#fff" });
      for (i = 0; i < 22; i++) near.push({ x: Math.random() * 1400, y: Math.random() * 800, s: 1.8 + Math.random() * 2.2, tw: Math.random() * 6, c: "#fff" });
      for (i = 0; i < 5; i++) hills.push({ x: i * 0.28 - 0.1, h: 0.16 + (i % 3) * 0.04, c: i % 2 ? "#0b1228" : "#111827" });
      for (i = 0; i < 4; i++) clouds.push({ x: Math.random(), y: 0.12 + Math.random() * 0.22, w: 80 + Math.random() * 90, a: 0.08 + Math.random() * 0.08, s: 4 + Math.random() * 8 });
    }
    function shapes(name, cx, cy, sc) {
      var pts;
      if (name === "cup") pts = [[-40, -10], [0, -36], [40, -10], [22, 18], [-22, 18]];
      else if (name === "kite") pts = [[0, -44], [28, 0], [0, 36], [-28, 0], [0, -10]];
      else if (name === "fish") pts = [[-48, 0], [-16, -22], [24, -10], [48, 0], [24, 16], [-10, 20]];
      else if (name === "house") pts = [[0, -42], [36, -8], [36, 28], [0, 28], [-36, 28], [-36, -8]];
      else pts = [[0, -40], [18, -8], [40, -8], [22, 12], [28, 38], [0, 22], [-28, 38], [-22, 12], [-40, -8], [-18, -8]];
      var out = [];
      for (var i = 0; i < pts.length; i++) out.push({ x: cx + pts[i][0] * sc, y: cy + pts[i][1] * sc, lit: false, pulse: i * 0.4 });
      return out;
    }
    function resetNight() {
      var n = NIGHTS[night];
      falling = []; shots = []; sparks = []; trails = []; meteors = []; wishes = [];
      constel = shapes(n.shape, W * 0.5, H * 0.28, night === 4 ? 1.15 : 1);
      lines = [];
      for (var i = 0; i < constel.length - 1; i++) lines.push({ a: i, b: i + 1, on: false });
      if (n.shape === "heart" || n.shape === "house") lines.push({ a: constel.length - 1, b: 0, on: false });
      moonSlow = 0; moonCool = 0; combo = 0;
      say(n.say);
      hud();
    }
    function startGame() {
      mode = "play"; night = 0; score = 0; lives = 5; wish = 0; combo = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      resetNight();
      chord([392, 523, 659], 0.18);
    }
    function winGame() {
      mode = "win";
      document.getElementById("winP").textContent = "You caught " + score + " stars on five nights!";
      document.getElementById("win").classList.remove("off");
      for (var i = 0; i < 40; i++) burst(W * 0.5, H * 0.4, "#fde68a");
      chord([523, 659, 784, 988], 0.35);
    }
    function nextNight() {
      night++;
      if (night >= 5) { winGame(); return; }
      flash = 0.5;
      resetNight();
      beep(660, 0.12, "triangle", 0.1);
    }
    function burst(x, y, col) {
      for (var i = 0; i < 14; i++) {
        sparks.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.5) * 220 - 40,
          life: 0.5 + Math.random() * 0.5, max: 1, c: col || "#fff", s: 2 + Math.random() * 3
        });
      }
    }
    function spawnFall() {
      var n = NIGHTS[night];
      var gold = night === 4 && Math.random() < 0.28;
      falling.push({
        x: 40 + Math.random() * (W - 80),
        y: -20,
        vy: 70 + Math.random() * 50 + night * 12,
        vx: (Math.random() - 0.5) * 20,
        rot: Math.random() * 6, spin: (Math.random() - 0.5) * 3,
        r: gold ? 16 : 10 + Math.random() * 5,
        gold: gold, blink: Math.random() * 4, caught: false
      });
    }
    function spawnShot() {
      shots.push({
        x: Math.random() * W, y: -10,
        vx: 180 + Math.random() * 160, vy: 220 + Math.random() * 120,
        life: 1.4, tail: []
      });
    }
    function drawStar(x, y, r, rot, col, glow) {
      g.save();
      g.translate(x, y); g.rotate(rot);
      if (glow) {
        g.fillStyle = glow;
        g.globalAlpha = 0.35;
        g.beginPath(); g.arc(0, 0, r * 2.2, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
      }
      g.fillStyle = col;
      g.beginPath();
      for (var i = 0; i < 5; i++) {
        var a = -Math.PI / 2 + i * Math.PI * 2 / 5;
        var b = a + Math.PI / 5;
        g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        g.lineTo(Math.cos(b) * r * 0.42, Math.sin(b) * r * 0.42);
      }
      g.closePath(); g.fill();
      g.fillStyle = "rgba(255,255,255,.7)";
      g.beginPath(); g.arc(-r * 0.18, -r * 0.18, r * 0.18, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    function drawMoon(mx, my, r) {
      var pulse = 1 + Math.sin(t * 1.4) * 0.03;
      g.save();
      g.translate(mx, my);
      var grd = g.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.8);
      grd.addColorStop(0, "rgba(254,243,199,.35)");
      grd.addColorStop(1, "rgba(254,243,199,0)");
      g.fillStyle = grd;
      g.beginPath(); g.arc(0, 0, r * 1.8 * pulse, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#fef3c7";
      g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#fde68a";
      g.beginPath(); g.arc(-r * 0.25, -r * 0.1, r * 0.22, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(r * 0.28, r * 0.18, r * 0.14, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(r * 0.05, -r * 0.35, r * 0.1, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#1e1b4b";
      var blink = (Math.sin(t * 3) > 0.92) ? 1 : 3;
      g.beginPath(); g.ellipse(-r * 0.22, -r * 0.08, 3, blink, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(r * 0.2, -r * 0.08, 3, blink, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "#b45309"; g.lineWidth = 2;
      g.beginPath(); g.arc(0, r * 0.18, r * 0.28, 0.15, Math.PI - 0.15); g.stroke();
      if (moonSlow > 0) {
        g.strokeStyle = "rgba(253,230,138,.7)"; g.lineWidth = 3;
        g.beginPath(); g.arc(0, 0, r + 10 + Math.sin(t * 8) * 3, 0, Math.PI * 2); g.stroke();
      }
      g.restore();
    }
    function drawBasket(x, y) {
      var bob = Math.sin(t * 3 + basket.bob) * 4;
      g.save(); g.translate(x, y + bob);
      g.fillStyle = "#92400e";
      g.beginPath();
      g.moveTo(-basket.w * 0.5, -8);
      g.lineTo(-basket.w * 0.38, basket.h);
      g.lineTo(basket.w * 0.38, basket.h);
      g.lineTo(basket.w * 0.5, -8);
      g.closePath(); g.fill();
      g.strokeStyle = "#78350f"; g.lineWidth = 3;
      for (var i = -2; i <= 2; i++) {
        g.beginPath(); g.moveTo(i * 16, -6); g.lineTo(i * 12, basket.h - 2); g.stroke();
      }
      g.strokeStyle = "#fbbf24"; g.lineWidth = 5;
      g.beginPath(); g.arc(0, -8, basket.w * 0.42, Math.PI, 0); g.stroke();
      g.fillStyle = "#fde68a";
      g.beginPath(); g.ellipse(0, -6, basket.w * 0.36, 8, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    function drawOwl(ox, oy) {
      var blink = Math.sin(t * 2.4 + ox) > 0.88;
      g.save(); g.translate(ox, oy + Math.sin(t * 2 + ox) * 2);
      g.fillStyle = "#1e1b4b";
      g.beginPath(); g.ellipse(0, 0, 11, 13, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#fde68a";
      if (blink) {
        g.fillRect(-7, -2, 5, 1.5); g.fillRect(2, -2, 5, 1.5);
      } else {
        g.beginPath(); g.arc(-4.5, -1, 3.2, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(4.5, -1, 3.2, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#1e1b4b";
        g.beginPath(); g.arc(-4.5, -1, 1.3, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(4.5, -1, 1.3, 0, Math.PI * 2); g.fill();
      }
      g.fillStyle = "#fbbf24";
      g.beginPath(); g.moveTo(0, 2); g.lineTo(-3, 6); g.lineTo(3, 6); g.fill();
      g.restore();
    }
    function drawCabin() {
      var cx = W * 0.18, cy = H * 0.86;
      g.fillStyle = "#1e293b";
      g.fillRect(cx - 28, cy - 22, 56, 28);
      g.beginPath(); g.moveTo(cx - 34, cy - 22); g.lineTo(cx, cy - 46); g.lineTo(cx + 34, cy - 22); g.fill();
      var glow = 0.35 + 0.25 * Math.sin(t * 3);
      g.fillStyle = "rgba(253,224,71," + glow + ")";
      g.fillRect(cx - 8, cy - 10, 12, 10);
      g.fillStyle = "#0f172a";
      g.fillRect(cx + 16, cy - 50, 7, 16);
    }
    function drawHills() {
      for (var i = 0; i < hills.length; i++) {
        var h = hills[i];
        g.fillStyle = h.c;
        g.beginPath();
        g.ellipse(W * h.x + W * 0.18, H + 20, W * 0.42, H * h.h + Math.sin(t * 0.3 + i) * 6, 0, Math.PI, 0, true);
        g.fill();
      }
      g.fillStyle = "#020617";
      g.fillRect(0, H * 0.92, W, H * 0.08);
      for (var k = 0; k < 8; k++) {
        var tx = (k * 160 + t * 6) % (W + 80) - 40;
        g.fillStyle = "#0f172a";
        g.beginPath();
        g.moveTo(tx, H * 0.92);
        g.lineTo(tx + 10, H * 0.78 + Math.sin(t + k) * 3);
        g.lineTo(tx + 20, H * 0.92);
        g.fill();
      }
      drawCabin();
      drawOwl(W * 0.22, H * 0.8);
      drawOwl(W * 0.86, H * 0.83);
    }
    function drawParallax(arr, speed, scale) {
      for (var i = 0; i < arr.length; i++) {
        var s = arr[i];
        var x = ((s.x + t * speed) % (W + 40)) - 20;
        var y = (s.y / 900) * H * 0.78;
        var tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.2 + s.tw));
        g.globalAlpha = tw;
        g.fillStyle = s.c;
        g.beginPath(); g.arc(x, y, s.s * scale, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
      }
    }
    function drawConst() {
      var i, a, b;
      g.lineWidth = 2;
      for (i = 0; i < lines.length; i++) {
        a = constel[lines[i].a]; b = constel[lines[i].b];
        g.strokeStyle = lines[i].on ? "rgba(253,230,138,.85)" : "rgba(255,255,255,.18)";
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      }
      for (i = 0; i < constel.length; i++) {
        a = constel[i];
        var pulse = 1 + Math.sin(t * 3 + a.pulse) * 0.12;
        if (a.lit) drawStar(a.x, a.y, 11 * pulse, t * 0.4, "#fde68a", "rgba(251,191,36,.5)");
        else {
          g.strokeStyle = "rgba(253,230,138,.55)"; g.lineWidth = 2;
          g.beginPath(); g.arc(a.x, a.y, 10 * pulse, 0, Math.PI * 2); g.stroke();
        }
      }
    }
    function lightNext() {
      for (var i = 0; i < constel.length; i++) {
        if (!constel[i].lit) {
          constel[i].lit = true;
          burst(constel[i].x, constel[i].y, "#fde68a");
          for (var k = 0; k < lines.length; k++) {
            if (constel[lines[k].a].lit && constel[lines[k].b].lit) lines[k].on = true;
          }
          beep(520 + i * 40, 0.1, "sine", 0.09);
          var all = true;
          for (var j = 0; j < constel.length; j++) if (!constel[j].lit) all = false;
          if (all) {
            say("Picture done!");
            chord([523, 659, 784], 0.22);
            for (j = 0; j < constel.length; j++) burst(constel[j].x, constel[j].y, "#fbcfe8");
          }
          return;
        }
      }
    }
    function moonPos() {
      var n = NIGHTS[Math.min(night, 4)];
      var r = (night === 3 ? 58 : 36) * n.moon;
      return { x: W * 0.78 + Math.sin(t * 0.25) * 12, y: H * 0.16 + Math.cos(t * 0.3) * 8, r: r };
    }
    function tapMoon(px, py) {
      var m = moonPos();
      var dx = px - m.x, dy = py - m.y;
      if (dx * dx + dy * dy < (m.r + 24) * (m.r + 24) && moonCool <= 0) {
        moonSlow = night === 3 ? 3.2 : 1.8;
        moonCool = 4.5;
        say("Moon hug! Slow…");
        beep(280, 0.25, "sine", 0.1);
        burst(m.x, m.y, "#fef3c7");
        return true;
      }
      return false;
    }
    function catchStar(s) {
      s.caught = true;
      score += s.gold ? 3 : 1;
      combo++;
      showCombo();
      burst(s.x, basket.y - 10, s.gold ? "#fbbf24" : "#e0e7ff");
      if (s.gold) {
        wish++;
        say("A wish!");
        chord([698, 880], 0.16);
        lightNext();
      } else {
        beep(640 + combo * 20, 0.07, "triangle", 0.07);
        if (combo % 2 === 0) lightNext();
      }
      hud();
      var n = NIGHTS[night];
      var lit = 0;
      for (var i = 0; i < constel.length; i++) if (constel[i].lit) lit++;
      if (score >= n.need && lit >= constel.length) nextNight();
      else if (score >= n.need + 4) nextNight();
    }
    function miss() {
      combo = 0;
      lives = Math.max(0, lives - 1);
      hud();
      beep(180, 0.08, "sine", 0.05);
      if (lives <= 0) {
        lives = 5;
        say("New hearts. Keep going!");
        hud();
      }
    }
    function update(dt) {
      var n = NIGHTS[Math.min(night, 4)];
      var slow = moonSlow > 0 ? 0.38 : 1;
      var wind = n.wind;
      t += dt;
      if (comboT > 0) { comboT -= dt; if (comboT <= 0) document.getElementById("combo").classList.remove("on"); }
      if (moonSlow > 0) moonSlow -= dt;
      if (moonCool > 0) moonCool -= dt;
      if (shake > 0) shake -= dt;
      if (flash > 0) flash -= dt;
      if (sayT > 0) sayT -= dt;
      var i, s, p;
      if (mode === "play") {
        var target = pointerX || basket.x;
        basket.x += (target - basket.x) * Math.min(1, dt * 10);
        basket.x = Math.max(basket.w * 0.5, Math.min(W - basket.w * 0.5, basket.x));
        basket.y = H * 0.82;
        if (Math.random() < n.fall * dt * 1.6) spawnFall();
        if (Math.random() < n.shot) spawnShot();
        if (night === 2 && Math.random() < 0.015) {
          meteors.push({ x: Math.random() * W, y: -20, vx: 90 + Math.random() * 80, vy: 260, r: 7, life: 2 });
        }
        for (i = falling.length - 1; i >= 0; i--) {
          s = falling[i];
          s.vx += wind * dt * 0.15 * (Math.sin(t + s.x) * 0.4 + 0.6);
          s.x += s.vx * dt * slow;
          s.y += s.vy * dt * slow;
          s.rot += s.spin * dt;
          if (s.x < 16) { s.x = 16; s.vx *= -0.4; }
          if (s.x > W - 16) { s.x = W - 16; s.vx *= -0.4; }
          if (!s.caught && s.y > basket.y - 18 && s.y < basket.y + 28 && Math.abs(s.x - basket.x) < basket.w * 0.48) {
            catchStar(s);
            falling.splice(i, 1);
            continue;
          }
          if (s.y > H + 20) { falling.splice(i, 1); miss(); }
        }
        for (i = shots.length - 1; i >= 0; i--) {
          s = shots[i];
          s.x += s.vx * dt * slow; s.y += s.vy * dt * slow; s.life -= dt;
          s.tail.push({ x: s.x, y: s.y, a: 1 });
          if (s.tail.length > 12) s.tail.shift();
          if (s.y > basket.y - 10 && Math.abs(s.x - basket.x) < basket.w * 0.5) {
            score += 2; combo += 2; showCombo(); burst(s.x, s.y, "#fbcfe8"); lightNext(); hud();
            beep(880, 0.1, "sine", 0.09); shots.splice(i, 1); continue;
          }
          if (s.life <= 0 || s.y > H + 40) shots.splice(i, 1);
        }
        for (i = meteors.length - 1; i >= 0; i--) {
          s = meteors[i];
          s.x += s.vx * dt * slow; s.y += s.vy * dt * slow; s.life -= dt;
          if (s.y > basket.y - 8 && Math.abs(s.x - basket.x) < basket.w * 0.5) {
            score += 2; burst(s.x, s.y, "#c4b5fd"); hud(); chord([784, 988], 0.12);
            meteors.splice(i, 1); continue;
          }
          if (s.y > H) meteors.splice(i, 1);
        }
        if (night === 4 && Math.random() < 0.01) {
          wishes.push({ x: Math.random() * W, y: -10, vy: 80, r: 18, spin: 0 });
        }
        for (i = wishes.length - 1; i >= 0; i--) {
          s = wishes[i]; s.y += s.vy * dt * slow; s.spin += dt * 2;
          if (s.y > basket.y - 12 && Math.abs(s.x - basket.x) < basket.w * 0.5) {
            score += 5; lightNext(); lightNext(); burst(s.x, s.y, "#f472b6"); hud();
            say("Big wish!"); wishes.splice(i, 1); continue;
          }
          if (s.y > H) wishes.splice(i, 1);
        }
        var litN = 0;
        for (i = 0; i < constel.length; i++) if (constel[i].lit) litN++;
        if (mode === "play" && score >= n.need && litN >= constel.length) nextNight();
      } else {
        if (Math.random() < 0.03) spawnFall();
        for (i = falling.length - 1; i >= 0; i--) {
          s = falling[i]; s.y += 40 * dt; s.rot += dt;
          if (s.y > H * 0.7) falling.splice(i, 1);
        }
        if (mode === "win" && Math.random() < 0.08) burst(Math.random() * W, Math.random() * H * 0.5, "#fde68a");
      }
      for (i = sparks.length - 1; i >= 0; i--) {
        p = sparks[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 180 * dt; p.life -= dt;
        if (p.life <= 0) sparks.splice(i, 1);
      }
      for (i = clouds.length - 1; i >= 0; i--) clouds[i].x += clouds[i].s * dt * 0.004;
    }
    function drawBg() {
      var n = NIGHTS[Math.min(night, 4)];
      var top = night === 3 ? "#2e1065" : night === 4 ? "#1e1b4b" : "#0b0828";
      var bot = night === 2 ? "#1e1b4b" : "#020617";
      var grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, top); grd.addColorStop(1, bot);
      g.fillStyle = grd; g.fillRect(0, 0, W, H);
      var blush = g.createRadialGradient(W * 0.75, H * 0.12, 10, W * 0.75, H * 0.12, W * 0.45);
      blush.addColorStop(0, "rgba(88,28,135,.35)"); blush.addColorStop(1, "rgba(88,28,135,0)");
      g.fillStyle = blush; g.fillRect(0, 0, W, H);
      drawParallax(far, 6, 1);
      drawParallax(mid, 14, 1);
      drawParallax(near, 28, 1);
      var i;
      for (i = 0; i < clouds.length; i++) {
        var c = clouds[i];
        var cx = ((c.x % 1.4) * W);
        g.fillStyle = "rgba(255,255,255," + c.a + ")";
        g.beginPath(); g.ellipse(cx, c.y * H, c.w, 18, 0, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.ellipse(cx + 30, c.y * H - 8, c.w * 0.55, 16, 0, 0, Math.PI * 2); g.fill();
      }
      if (night === 1 || (mode !== "play" && Math.sin(t) > 0)) {
        g.strokeStyle = "rgba(226,232,240,.12)"; g.lineWidth = 1;
        for (i = 0; i < 6; i++) {
          var lx = (t * n.wind * 3 + i * 90) % (W + 40) - 20;
          g.beginPath(); g.moveTo(lx, 40 + i * 70); g.lineTo(lx + 50, 20 + i * 70); g.stroke();
        }
      }
    }
    function drawWorld() {
      var m = moonPos();
      drawMoon(m.x, m.y, m.r);
      if (mode === "play") drawConst();
      var i, s, k;
      for (i = 0; i < falling.length; i++) {
        s = falling[i];
        drawStar(s.x, s.y, s.r, s.rot, s.gold ? "#fbbf24" : "#fff7ed", s.gold ? "rgba(251,191,36,.45)" : "rgba(255,255,255,.25)");
      }
      for (i = 0; i < shots.length; i++) {
        s = shots[i];
        for (k = 0; k < s.tail.length; k++) {
          g.globalAlpha = k / s.tail.length * 0.7;
          g.fillStyle = "#fde68a";
          g.beginPath(); g.arc(s.tail[k].x, s.tail[k].y, 2 + k * 0.25, 0, Math.PI * 2); g.fill();
        }
        g.globalAlpha = 1;
        drawStar(s.x, s.y, 8, t * 4, "#fff", "rgba(253,230,138,.5)");
      }
      for (i = 0; i < meteors.length; i++) {
        s = meteors[i];
        g.strokeStyle = "rgba(196,181,253,.7)"; g.lineWidth = 3;
        g.beginPath(); g.moveTo(s.x - 30, s.y - 40); g.lineTo(s.x, s.y); g.stroke();
        drawStar(s.x, s.y, s.r, t, "#ddd6fe", "rgba(167,139,250,.4)");
      }
      for (i = 0; i < wishes.length; i++) {
        s = wishes[i];
        drawStar(s.x, s.y, s.r, s.spin, "#f472b6", "rgba(244,114,182,.5)");
        g.fillStyle = "#fff"; g.font = "bold 12px Trebuchet MS"; g.textAlign = "center";
        g.fillText("wish", s.x, s.y + 28);
      }
      drawHills();
      if (mode === "play" || mode === "title") drawBasket(basket.x, mode === "title" ? H * 0.84 : basket.y);
      for (i = 0; i < sparks.length; i++) {
        s = sparks[i];
        g.globalAlpha = Math.max(0, s.life / (s.max || 1));
        g.fillStyle = s.c;
        g.beginPath(); g.arc(s.x, s.y, s.s, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
      }
      if (flash > 0) {
        g.fillStyle = "rgba(253,230,138," + (flash * 0.35) + ")";
        g.fillRect(0, 0, W, H);
      }
      if (mode === "play" && moonCool <= 0) {
        g.fillStyle = "rgba(254,243,199,.85)";
        g.font = "bold 14px Trebuchet MS"; g.textAlign = "center";
        g.fillText("tap moon", m.x, m.y + m.r + 18);
      }
    }
    function loop(now) {
      requestAnimationFrame(loop);
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      g.save();
      if (shake > 0) g.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
      drawBg();
      drawWorld();
      g.restore();
    }
    function ptr(e) {
      var p = e.touches ? e.touches[0] : e;
      return { x: p.clientX, y: p.clientY };
    }
    cv.addEventListener("pointerdown", function (e) {
      var p = ptr(e);
      pointerX = p.x; drag = true;
      if (mode === "play") tapMoon(p.x, p.y);
    });
    cv.addEventListener("pointermove", function (e) {
      if (!drag && !e.buttons) return;
      pointerX = ptr(e).x;
    });
    addEventListener("pointerup", function () { drag = false; });
    cv.addEventListener("touchmove", function (e) {
      e.preventDefault();
      pointerX = e.touches[0].clientX;
    }, { passive: false });
    document.getElementById("go").onclick = startGame;
    document.getElementById("again").onclick = function () {
      document.getElementById("win").classList.add("off");
      startGame();
    };
    addEventListener("resize", resize);
    resize();
    basket.y = H * 0.84;
    pointerX = W * 0.5;
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
