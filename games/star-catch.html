<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Star Catch</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#0f172a}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="got">⭐ 0/6</b></div>
  <div id="say">Tap the falling stars!</div>
  <div class="cover" id="title">
    <div class="hero">⭐</div>
    <h1>Star Catch</h1>
    <p>Tap 6 falling stars.</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🌟</div>
    <h1>Sky full!</h1>
    <p>You caught them all.</p>
    <button class="play g" id="again">Catch again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, n = 0, stars = [];
    function em(ch, px, py, s) { kidEm(x, ch, px, py, s); }
    function resize() { var b = kidFit(cv, x); W = b.W; H = b.H; }
    addEventListener("resize", resize); resize();
    function spawn() { stars.push({ x: 50 + Math.random() * (W - 100), y: -20, s: 42 + Math.random() * 22 }); }
    function start() {
      play = true; n = 0; stars = [];
      stars.push({ x: W * 0.3, y: H * 0.28, s: 70 });
      stars.push({ x: W * 0.7, y: H * 0.42, s: 80 });
      stars.push({ x: W * 0.5, y: H * 0.18, s: 60 });
      kidBegin();
      document.getElementById("got").textContent = "⭐ 0/6";
      document.getElementById("say").textContent = "Tap the falling stars!";
    }
    kidBind(start);
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var p = kidPt(e, cv), i, best = -1, bestD = 120 * 120;
      for (i = stars.length - 1; i >= 0; i--) {
        var dx = p.x - stars[i].x, dy = p.y - stars[i].y, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best < 0) { kidMiss("⭐", "Tap a star!", p.x, p.y); return; }
      var hit = stars.splice(best, 1)[0]; n++;
      document.getElementById("got").textContent = "⭐ " + n + "/6";
      kidTap("✨", "Got one!  " + n + "/6", hit.x, hit.y, 500);
      if (n >= 6) { play = false; kidFinish(); }
    });
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      x.fillStyle = "#0f172a"; x.fillRect(0, 0, W, H);
      em("🌙", W * 0.82, 90, 64);
      if (play) {
        if (stars.length < 3) spawn();
        stars.forEach(function (s) { s.y += s.s * dt; });
        for (var i = stars.length - 1; i >= 0; i--) {
          if (stars[i].y > H + 20) {
            stars.splice(i, 1);
            document.getElementById("say").textContent = "Try the next one!";
          }
        }
      }
      stars.forEach(function (s) { em("⭐", s.x, s.y, 104); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
