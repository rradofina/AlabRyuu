<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Star Catch</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#0f172a}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="got">⭐ 0/10</b></div>
  <div id="say">Tap the falling stars!</div>
  <div class="cover" id="title">
    <div class="hero">⭐</div>
    <h1>Star Catch</h1>
    <p>Tap 10 falling stars.</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🌟</div>
    <h1>Sky full!</h1>
    <p>You caught them all.</p>
    <button class="play g" id="again">Catch again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, n = 0, stars = [];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function spawn() { stars.push({ x: 40 + Math.random() * (W - 80), y: -40, s: 90 + Math.random() * 50 }); }
    function start() {
      play = true; n = 0; stars = [];
      stars.push({ x: W * 0.3, y: H * 0.28, s: 70 });
      stars.push({ x: W * 0.7, y: H * 0.42, s: 80 });
      stars.push({ x: W * 0.5, y: H * 0.18, s: 60 });
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("got").textContent = "⭐ 0/10";
      document.getElementById("say").textContent = "Tap the falling stars!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      for (var i = stars.length - 1; i >= 0; i--) {
        var dx = kidPt(e, cv).x - stars[i].x, dy = kidPt(e, cv).y - stars[i].y;
        if (dx * dx + dy * dy < 72 * 72) {
          stars.splice(i, 1); n++;
          document.getElementById("got").textContent = "⭐ " + n + "/10";
          document.getElementById("say").textContent = "Got one!";
          if (n >= 10) {
            play = false;
            document.getElementById("win").classList.remove("off");
          }
          return;
        }
      }
    });
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      x.fillStyle = "#0f172a"; x.fillRect(0, 0, W, H);
      em("🌙", W * 0.82, 90, 64);
      if (play) {
        if (stars.length < 3 && Math.random() < 0.03) spawn();
        stars.forEach(function (s) { s.y += s.s * dt; });
        for (var i = stars.length - 1; i >= 0; i--) {
          if (stars[i].y > H + 20) {
            stars.splice(i, 1);
            document.getElementById("say").textContent = "Try the next one!";
          }
        }
      }
      stars.forEach(function (s) { em("⭐", s.x, s.y, 64); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
