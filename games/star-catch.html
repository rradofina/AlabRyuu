<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Star Catch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      background: #07061a; color: #fff; touch-action: none; user-select: none;
    }
    button {
      background: transparent; border: 0; appearance: none;
      -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer;
    }
    .home {
      position: fixed; top: 12px; left: 12px; z-index: 12;
      color: #fff; text-decoration: none; font-weight: 800; font-size: 18px;
      background: rgba(255,255,255,.16); padding: 8px 14px; border-radius: 999px;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #dock {
      position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 12;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(30,27,75,.55), rgba(15,10,40,.82));
      border: 2px solid rgba(253,230,138,.45);
      border-radius: 28px;
      padding: 8px 12px 10px;
      box-shadow: 0 8px 0 rgba(0,0,0,.28);
    }
    #dock .night {
      font-weight: 800; font-size: 13px; letter-spacing: .02em;
      color: #fde68a; text-align: left;
    }
    #dock .pips { display: flex; gap: 7px; justify-content: center; align-items: center; }
    #dock .pip {
      width: 12px; height: 12px; transform: rotate(18deg);
      background: rgba(255,255,255,.2); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
    #dock .pip.on { background: #fde68a; box-shadow: 0 0 10px #fbbf24; }
    #dock .tally {
      font-weight: 800; font-size: 13px; text-align: right; color: #e0e7ff;
    }
    #say {
      position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
      z-index: 8; font-weight: 800; font-size: 20px; text-align: center;
      text-shadow: 0 3px 0 #1e1b4b; pointer-events: none; width: 72%;
    }
    #wow {
      position: fixed; left: 50%; top: 26%; transform: translate(-50%, -20px);
      font-weight: 800; font-size: 34px; color: #fde68a;
      text-shadow: 0 4px 0 #312e81, 0 0 18px #fbbf24;
      opacity: 0; pointer-events: none; z-index: 8; transition: opacity .15s;
    }
    #wow.on { opacity: 1; }
    .cover {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 12px; padding: 24px;
      background: linear-gradient(180deg, rgba(7,6,26,.46), rgba(15,10,40,.62));
    }
    .cover.off { display: none; }
    h1 { font-size: clamp(36px, 10vw, 56px); text-shadow: 0 5px 0 #312e81, 0 0 24px #818cf8; }
    .cover p { font-weight: 800; font-size: 18px; max-width: 320px; opacity: .95; }
    .btn {
      background: #fde68a; color: #422006; font-weight: 800; font-size: 26px;
      padding: 16px 36px; border-radius: 22px; box-shadow: 0 8px 0 #ca8a04;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #ca8a04; }
    .btn.g { background: #86efac; box-shadow: 0 8px 0 #16a34a; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="say">Tap the twinkles!</div>
  <div id="wow"></div>
  <div id="dock">
    <div class="night" id="night">Calm night</div>
    <div class="pips" id="pips"></div>
    <div class="tally" id="tally">0 caught · 8 moons</div>
  </div>
  <div class="cover" id="title">
    <h1>Star Catch</h1>
    <p>Tap stars so they fly into the picture. The moon can slow the sky. Five soft nights.</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <h1>Wish done!</h1>
    <p id="winP">Five nights. Big sky hugs.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), g = cv.getContext("2d");
    var W, H, t = 0, last = 0, mode = "title", night = 0, score = 0, lives = 8;
    var combo = 0, comboT = 0, moonSlow = 0, moonCool = 0, swing = 0;
    var far = [], mid = [], near = [], hills = [], sparks = [], clouds = [];
    var floaters = [], flyers = [], constel = [], lines = [], meteors = [];
    var flash = 0, sayT = 0, kidX = 0;
    var NIGHTS = [
      { n: "Calm night", wind: 8, spawn: 0.9, need: 7, shape: "cup", say: "Tap a star. Watch it fly!" },
      { n: "Windy wink", wind: 42, spawn: 1.05, need: 8, shape: "kite", say: "Stars scoot. Tap them!" },
      { n: "Meteor hush", wind: 14, spawn: 1.15, need: 9, shape: "fish", say: "Streaks too. Soft taps." },
      { n: "Close moon", wind: 10, spawn: 0.85, need: 8, shape: "house", say: "Tap the big moon to slow." },
      { n: "Wish night", wind: 16, spawn: 1.0, need: 10, shape: "heart", say: "Gold wishes love taps!" }
    ];

    function beep(f, d, typ, vol) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), a = ac.createGain();
        o.type = typ || "sine"; o.frequency.value = f;
        a.gain.value = vol || 0.08;
        o.connect(a); a.connect(ac.destination);
        o.start();
        a.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function chord(notes, d) {
      for (var i = 0; i < notes.length; i++) beep(notes[i], d, "triangle", 0.05);
    }
    function say(s) {
      document.getElementById("say").textContent = s;
      sayT = 2.6;
    }
    function hud() {
      var n = NIGHTS[Math.min(night, 4)];
      document.getElementById("night").textContent = n.n;
      document.getElementById("tally").textContent = score + " caught · " + lives + " moons";
      var box = document.getElementById("pips");
      var html = "", i, lit = 0;
      for (i = 0; i < constel.length; i++) if (constel[i].lit) lit++;
      for (i = 0; i < constel.length; i++) {
        html += "<div class=\"pip" + (i < lit ? " on" : "") + "\"></div>";
      }
      box.innerHTML = html;
    }
    function showWow() {
      var el = document.getElementById("wow");
      if (combo >= 3) {
        el.textContent = "Twinkle x" + combo + "!";
        el.classList.add("on");
        comboT = 0.9;
      }
    }
    function resize() {
      W = cv.width = innerWidth;
      H = cv.height = innerHeight;
      kidX = W * 0.5;
      if (!far.length) seedSky();
    }
    function seedSky() {
      far = []; mid = []; near = []; hills = []; clouds = [];
      var i;
      for (i = 0; i < 80; i++) far.push({ x: Math.random() * 1400, y: Math.random() * 900, s: 0.5 + Math.random() * 1.1, tw: Math.random() * 6, c: Math.random() > 0.85 ? "#fde68a" : "#c7d2fe" });
      for (i = 0; i < 50; i++) mid.push({ x: Math.random() * 1400, y: Math.random() * 900, s: 1.0 + Math.random() * 1.5, tw: Math.random() * 6, c: Math.random() > 0.7 ? "#fbcfe8" : "#fff" });
      for (i = 0; i < 24; i++) near.push({ x: Math.random() * 1400, y: Math.random() * 800, s: 1.6 + Math.random() * 2.2, tw: Math.random() * 6, c: "#fff" });
      for (i = 0; i < 5; i++) hills.push({ x: i * 0.28 - 0.08, h: 0.17 + (i % 3) * 0.04, c: i % 2 ? "#0b1228" : "#111827" });
      for (i = 0; i < 4; i++) clouds.push({ x: Math.random(), y: 0.1 + Math.random() * 0.18, w: 70 + Math.random() * 90, a: 0.07 + Math.random() * 0.08, s: 3 + Math.random() * 7 });
    }
    function shapes(name, cx, cy, sc) {
      var pts;
      if (name === "cup") pts = [[-40, -10], [0, -36], [40, -10], [22, 18], [-22, 18]];
      else if (name === "kite") pts = [[0, -44], [28, 0], [0, 36], [-28, 0], [0, -10]];
      else if (name === "fish") pts = [[-48, 0], [-16, -22], [24, -10], [48, 0], [24, 16], [-10, 20]];
      else if (name === "house") pts = [[0, -42], [36, -8], [36, 28], [0, 28], [-36, 28], [-36, -8]];
      else pts = [[0, -40], [18, -8], [40, -8], [22, 12], [28, 38], [0, 22], [-28, 38], [-22, 12], [-40, -8], [-18, -8]];
      var out = [];
      for (var i = 0; i < pts.length; i++) out.push({ x: cx + pts[i][0] * sc, y: cy + pts[i][1] * sc, lit: false, pulse: i * 0.4 });
      return out;
    }
    function resetNight() {
      var n = NIGHTS[night];
      floaters = []; flyers = []; sparks = []; meteors = [];
      constel = shapes(n.shape, W * 0.5, H * 0.26, night === 4 ? 1.12 : 1);
      lines = [];
      for (var i = 0; i < constel.length - 1; i++) lines.push({ a: i, b: i + 1, on: false });
      if (n.shape === "heart" || n.shape === "house") lines.push({ a: constel.length - 1, b: 0, on: false });
      moonSlow = 0; moonCool = 0; combo = 0;
      for (i = 0; i < 4; i++) spawnFloater();
      say(n.say);
      hud();
    }
    function startGame() {
      mode = "play"; night = 0; score = 0; lives = 8; combo = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      resetNight();
      chord([392, 523, 659], 0.18);
    }
    function winGame() {
      mode = "win";
      document.getElementById("winP").textContent = "You tapped " + score + " stars onto five night pictures!";
      document.getElementById("win").classList.remove("off");
      for (var i = 0; i < 40; i++) burst(W * 0.5, H * 0.36, "#fde68a");
      chord([523, 659, 784, 988], 0.35);
    }
    function nextNight() {
      night++;
      if (night >= 5) { winGame(); return; }
      flash = 0.5;
      resetNight();
      beep(660, 0.12, "triangle", 0.1);
    }
    function burst(x, y, col) {
      for (var i = 0; i < 14; i++) {
        sparks.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.5) * 220 - 40,
          life: 0.5 + Math.random() * 0.5, max: 1, c: col || "#fff", s: 2 + Math.random() * 3
        });
      }
    }
    function spawnFloater() {
      var gold = night === 4 && Math.random() < 0.3;
      floaters.push({
        x: 36 + Math.random() * (W - 72),
        y: 70 + Math.random() * (H * 0.52),
        vx: (Math.random() - 0.5) * 18,
        vy: (Math.random() - 0.5) * 12,
        rot: Math.random() * 6, spin: (Math.random() - 0.5) * 1.6,
        r: gold ? 18 : 13 + Math.random() * 6,
        gold: gold, blink: Math.random() * 4, life: 9 + Math.random() * 4
      });
    }
    function nextEmpty() {
      for (var i = 0; i < constel.length; i++) if (!constel[i].lit) return constel[i];
      return constel[constel.length - 1];
    }
    function lightNode(node) {
      if (!node || node.lit) return;
      node.lit = true;
      burst(node.x, node.y, "#fde68a");
      var k;
      for (k = 0; k < lines.length; k++) {
        if (constel[lines[k].a].lit && constel[lines[k].b].lit) lines[k].on = true;
      }
      beep(520 + score * 8, 0.1, "sine", 0.09);
      var all = true;
      for (k = 0; k < constel.length; k++) if (!constel[k].lit) all = false;
      if (all) {
        say("Picture done!");
        chord([523, 659, 784], 0.22);
        for (k = 0; k < constel.length; k++) burst(constel[k].x, constel[k].y, "#fbcfe8");
      }
    }
    function catchStar(s, i) {
      var dest = nextEmpty();
      flyers.push({
        x: s.x, y: s.y, tx: dest.x, ty: dest.y, dest: dest,
        r: s.r, rot: s.rot, gold: s.gold, p: 0
      });
      floaters.splice(i, 1);
      score += s.gold ? 3 : 1;
      combo++;
      showWow();
      swing = 1;
      kidX += (s.x - kidX) * 0.35;
      burst(s.x, s.y, s.gold ? "#fbbf24" : "#e0e7ff");
      if (s.gold) { say("A wish!"); chord([698, 880], 0.16); }
      else beep(640 + combo * 20, 0.07, "triangle", 0.07);
      hud();
    }
    function miss() {
      combo = 0;
      lives = Math.max(0, lives - 1);
      hud();
      beep(180, 0.08, "sine", 0.05);
      if (lives <= 0) {
        lives = 8;
        say("New moons. Keep tapping!");
        hud();
      }
    }
    function moonPos() {
      var n = NIGHTS[Math.min(night, 4)];
      var r = (night === 3 ? 56 : 34) * (night === 3 ? 1.15 : 1);
      return { x: W * 0.8 + Math.sin(t * 0.25) * 10, y: H * 0.15 + Math.cos(t * 0.3) * 7, r: r };
    }
    function tapMoon(px, py) {
      var m = moonPos();
      var dx = px - m.x, dy = py - m.y;
      if (dx * dx + dy * dy < (m.r + 22) * (m.r + 22) && moonCool <= 0) {
        moonSlow = night === 3 ? 3.2 : 1.8;
        moonCool = 4.5;
        say("Moon hug! Slow…");
        beep(280, 0.25, "sine", 0.1);
        burst(m.x, m.y, "#fef3c7");
        return true;
      }
      return false;
    }
    function tryTap(px, py) {
      if (mode !== "play") return;
      if (tapMoon(px, py)) return;
      var best = -1, bestD = 1e9, i, s, d;
      for (i = 0; i < floaters.length; i++) {
        s = floaters[i];
        d = Math.hypot(px - s.x, py - s.y);
        if (d < s.r + 36 && d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0) { catchStar(floaters[best], best); return; }
      for (i = meteors.length - 1; i >= 0; i--) {
        s = meteors[i];
        if (Math.hypot(px - s.x, py - s.y) < 40) {
          score += 2; combo += 2; showWow();
          lightNode(nextEmpty());
          burst(s.x, s.y, "#c4b5fd");
          hud();
          chord([784, 988], 0.12);
          meteors.splice(i, 1);
          swing = 1;
          return;
        }
      }
    }
    function maybeAdvance() {
      if (mode !== "play") return;
      var n = NIGHTS[night], lit = 0, i;
      for (i = 0; i < constel.length; i++) if (constel[i].lit) lit++;
      if ((score >= n.need && lit >= constel.length) || score >= n.need + 6) nextNight();
    }
    function em(ch,px,py,s){ g.font=s+"px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif"; g.textAlign="center"; g.textBaseline="middle"; g.fillText(ch,px,py); }
    function drawStar(x, y, r, rot, col, glow) {
      em("⭐", x, y, Math.max(18, r * 2.4));
    }
    function drawMoon(mx, my, r) {
      em("🌙", mx, my, Math.max(36, r * 2.2));
      if (moonSlow > 0) {
        g.strokeStyle = "rgba(253,230,138,.7)"; g.lineWidth = 3;
        g.beginPath(); g.arc(mx, my, r + 10 + Math.sin(t * 8) * 3, 0, Math.PI * 2); g.stroke();
      }
    }
    function drawKid(kx, ky) {
      var bob = Math.sin(t * 3) * 3;
      em("🧒", kx, ky + bob, 56);
      em("⭐", kx + 28, ky - 18 + bob, 20);
    }
    function drawCabin() {
      var cx = W * 0.16, cy = H * 0.8;
      g.fillStyle = "#1e293b";
      g.fillRect(cx - 28, cy - 22, 56, 28);
      g.beginPath(); g.moveTo(cx - 34, cy - 22); g.lineTo(cx, cy - 46); g.lineTo(cx + 34, cy - 22); g.fill();
      var glow = 0.35 + 0.25 * Math.sin(t * 3);
      g.fillStyle = "rgba(253,224,71," + glow + ")";
      g.fillRect(cx - 8, cy - 10, 12, 10);
      g.fillStyle = "#0f172a";
      g.fillRect(cx + 16, cy - 50, 7, 16);
    }
    function drawOwl(ox, oy) { em("🦉", ox, oy + Math.sin(t * 2 + ox) * 2, 28); }
    function drawHills() {
      var i;
      for (i = 0; i < hills.length; i++) {
        var h = hills[i];
        g.fillStyle = h.c;
        g.beginPath();
        g.ellipse(W * h.x + W * 0.18, H + 20, W * 0.42, H * h.h + Math.sin(t * 0.3 + i) * 6, 0, Math.PI, 0, true);
        g.fill();
      }
      g.fillStyle = "#020617";
      g.fillRect(0, H * 0.88, W, H * 0.12);
      for (i = 0; i < 8; i++) {
        var tx = (i * 160 + t * 6) % (W + 80) - 40;
        g.fillStyle = "#0f172a";
        g.beginPath();
        g.moveTo(tx, H * 0.88);
        g.lineTo(tx + 10, H * 0.74 + Math.sin(t + i) * 3);
        g.lineTo(tx + 20, H * 0.88);
        g.fill();
      }
      drawCabin();
      drawOwl(W * 0.22, H * 0.76);
      drawOwl(W * 0.88, H * 0.79);
    }
    function drawParallax(arr, speed, scale) {
      for (var i = 0; i < arr.length; i++) {
        var s = arr[i];
        var x = ((s.x + t * speed) % (W + 40)) - 20;
        var y = (s.y / 900) * H * 0.72;
        var tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.2 + s.tw));
        g.globalAlpha = tw;
        g.fillStyle = s.c;
        g.beginPath(); g.arc(x, y, s.s * scale, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
      }
    }
    function drawConst() {
      var i, a, b;
      g.lineWidth = 2;
      for (i = 0; i < lines.length; i++) {
        a = constel[lines[i].a]; b = constel[lines[i].b];
        g.strokeStyle = lines[i].on ? "rgba(253,230,138,.85)" : "rgba(255,255,255,.18)";
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      }
      for (i = 0; i < constel.length; i++) {
        a = constel[i];
        var pulse = 1 + Math.sin(t * 3 + a.pulse) * 0.12;
        if (a.lit) drawStar(a.x, a.y, 11 * pulse, t * 0.4, "#fde68a", "rgba(251,191,36,.5)");
        else {
          g.strokeStyle = "rgba(253,230,138,.55)"; g.lineWidth = 2;
          g.beginPath(); g.arc(a.x, a.y, 10 * pulse, 0, Math.PI * 2); g.stroke();
        }
      }
    }
    function update(dt) {
      var n = NIGHTS[Math.min(night, 4)];
      var slow = moonSlow > 0 ? 0.38 : 1;
      t += dt;
      if (comboT > 0) { comboT -= dt; if (comboT <= 0) document.getElementById("wow").classList.remove("on"); }
      if (moonSlow > 0) moonSlow -= dt;
      if (moonCool > 0) moonCool -= dt;
      if (flash > 0) flash -= dt;
      if (sayT > 0) sayT -= dt;
      if (swing > 0) swing = Math.max(0, swing - dt * 2.4);
      kidX += (W * 0.52 - kidX) * dt * 1.2;
      var i, s, p;
      if (mode === "play") {
        if (floaters.length < 7 && Math.random() < n.spawn * dt * 1.8) spawnFloater();
        if (night === 2 && Math.random() < 0.018) {
          meteors.push({ x: Math.random() * W, y: -16, vx: 90 + Math.random() * 80, vy: 220, r: 8, life: 2.2 });
        }
        for (i = floaters.length - 1; i >= 0; i--) {
          s = floaters[i];
          s.vx += Math.sin(t * 1.4 + s.blink) * n.wind * dt * 0.08;
          s.x += s.vx * dt * slow;
          s.y += s.vy * dt * slow + Math.sin(t * 2 + s.blink) * 8 * dt;
          s.rot += s.spin * dt;
          s.life -= dt * slow;
          if (s.x < 18) { s.x = 18; s.vx *= -0.5; }
          if (s.x > W - 18) { s.x = W - 18; s.vx *= -0.5; }
          if (s.y < 56) { s.y = 56; s.vy *= -0.4; }
          if (s.y > H * 0.7) { s.y = H * 0.7; s.vy *= -0.4; }
          if (s.life <= 0) { floaters.splice(i, 1); miss(); }
        }
        for (i = flyers.length - 1; i >= 0; i--) {
          s = flyers[i];
          s.p = Math.min(1, s.p + dt * 1.8);
          var e = 1 - Math.pow(1 - s.p, 3);
          s.x = s.x + (s.tx - s.x) * (0.18 + e * 0.4);
          s.y = s.y + (s.ty - s.y) * (0.18 + e * 0.4);
          s.rot += dt * 6;
          if (s.p >= 1 || Math.hypot(s.x - s.tx, s.y - s.ty) < 8) {
            lightNode(s.dest);
            flyers.splice(i, 1);
            maybeAdvance();
          }
        }
        for (i = meteors.length - 1; i >= 0; i--) {
          s = meteors[i];
          s.x += s.vx * dt * slow; s.y += s.vy * dt * slow; s.life -= dt;
          if (s.y > H || s.life <= 0) meteors.splice(i, 1);
        }
        maybeAdvance();
      } else {
        if (Math.random() < 0.04) spawnFloater();
        for (i = floaters.length - 1; i >= 0; i--) {
          s = floaters[i]; s.y += 18 * dt; s.rot += dt;
          if (s.y > H * 0.72) floaters.splice(i, 1);
        }
        if (mode === "win" && Math.random() < 0.08) burst(Math.random() * W, Math.random() * H * 0.5, "#fde68a");
      }
      for (i = sparks.length - 1; i >= 0; i--) {
        p = sparks[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 180 * dt; p.life -= dt;
        if (p.life <= 0) sparks.splice(i, 1);
      }
      for (i = 0; i < clouds.length; i++) clouds[i].x += clouds[i].s * dt * 0.004;
    }
    function drawBg() {
      var top = night === 3 ? "#2e1065" : night === 4 ? "#1e1b4b" : "#0b0828";
      var bot = night === 2 ? "#1e1b4b" : "#020617";
      var grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, top); grd.addColorStop(1, bot);
      g.fillStyle = grd; g.fillRect(0, 0, W, H);
      var blush = g.createRadialGradient(W * 0.78, H * 0.12, 10, W * 0.78, H * 0.12, W * 0.45);
      blush.addColorStop(0, "rgba(88,28,135,.35)"); blush.addColorStop(1, "rgba(88,28,135,0)");
      g.fillStyle = blush; g.fillRect(0, 0, W, H);
      drawParallax(far, 6, 1);
      drawParallax(mid, 14, 1);
      drawParallax(near, 28, 1);
      var i;
      for (i = 0; i < clouds.length; i++) {
        var c = clouds[i];
        var cx = ((c.x % 1.4) * W);
        g.fillStyle = "rgba(255,255,255," + c.a + ")";
        g.beginPath(); g.ellipse(cx, c.y * H, c.w, 18, 0, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.ellipse(cx + 30, c.y * H - 8, c.w * 0.55, 16, 0, 0, Math.PI * 2); g.fill();
      }
    }
    function drawWorld() {
      var m = moonPos();
      drawMoon(m.x, m.y, m.r);
      if (mode === "play") drawConst();
      var i, s, k;
      for (i = 0; i < floaters.length; i++) {
        s = floaters[i];
        var tw = 0.75 + 0.25 * Math.sin(t * 6 + s.blink);
        drawStar(s.x, s.y, s.r * tw, s.rot, s.gold ? "#fbbf24" : "#fff7ed", s.gold ? "rgba(251,191,36,.5)" : "rgba(255,255,255,.28)");
      }
      for (i = 0; i < flyers.length; i++) {
        s = flyers[i];
        drawStar(s.x, s.y, s.r, s.rot, s.gold ? "#fbbf24" : "#fff", "rgba(253,230,138,.45)");
        g.strokeStyle = "rgba(253,230,138,.35)"; g.lineWidth = 2;
        g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.tx, s.ty); g.stroke();
      }
      for (i = 0; i < meteors.length; i++) {
        s = meteors[i];
        g.strokeStyle = "rgba(196,181,253,.7)"; g.lineWidth = 3;
        g.beginPath(); g.moveTo(s.x - 30, s.y - 40); g.lineTo(s.x, s.y); g.stroke();
        drawStar(s.x, s.y, s.r, t, "#ddd6fe", "rgba(167,139,250,.4)");
      }
      drawHills();
      drawKid(Math.max(70, Math.min(W - 70, kidX)), H * 0.78);
      for (i = 0; i < sparks.length; i++) {
        s = sparks[i];
        g.globalAlpha = Math.max(0, s.life / (s.max || 1));
        g.fillStyle = s.c;
        g.beginPath(); g.arc(s.x, s.y, s.s, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
      }
      if (flash > 0) {
        g.fillStyle = "rgba(253,230,138," + (flash * 0.35) + ")";
        g.fillRect(0, 0, W, H);
      }
      if (mode === "play" && moonCool <= 0) {
        g.fillStyle = "rgba(254,243,199,.85)";
        g.font = "bold 13px Trebuchet MS"; g.textAlign = "center";
        g.fillText("tap moon", m.x, m.y + m.r + 16);
      }
    }
    function loop(now) {
      requestAnimationFrame(loop);
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      drawBg();
      drawWorld();
    }
    cv.addEventListener("pointerdown", function (e) {
      tryTap(e.clientX, e.clientY);
    });
    document.getElementById("go").onclick = startGame;
    document.getElementById("again").onclick = function () {
      document.getElementById("win").classList.add("off");
      startGame();
    };
    addEventListener("resize", resize);
    resize();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
