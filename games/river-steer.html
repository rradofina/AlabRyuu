<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var open = false;
      try { open = localStorage.getItem("alabryuu-open") === "1"; } catch (e) {}
      if (open) return;
      document.documentElement.classList.add("kid-locked");
      var path = location.pathname || "";
      document.documentElement.style.background = path.indexOf("/alonzorui") === 0 ? "#fff7ed" : "#1e1b4b";
    })();
  </script>
  <style id="kid-lock-hide">
    html.kid-locked, html.kid-locked body { overflow: hidden !important; height: 100% !important; }
    html.kid-locked body { visibility: hidden !important; }
    #kid-lock, #kid-lock * { visibility: visible !important; }
  </style>
  <script src="/kid-lock.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>River Steer</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../mix.js"></script>
  <style>
    html, body { background: #0284c7; }
    .home { z-index: 60; }
    .dock button { font-size: 22px; }
    .dock button i { display: block; width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px; border: 3px solid #1e1b4b; background: var(--c, #fff); }
    .hero svg { width: 96px; height: 96px; display: block; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fl">0</b></div>
  <div id="say">Steer the boat to the dock</div>
  <div class="dock" id="dock">
    <button id="L"><i style="--c:#38bdf8"></i>Left</button><button id="R"><i style="--c:#fb923c"></i>Right</button>
  </div>
  <div class="cover" id="title">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><path d="M14 58 H78 L68 74 H24 Z" fill="#f8fafc" stroke="#1e1b4b" stroke-width="4"/><path d="M46 54 V22 L70 50 H46" fill="#38bdf8" stroke="#1e1b4b" stroke-width="4"/></svg></div>
    <h1>River Steer</h1>
    <p>Rocks bounce you back. Keep going.</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><path d="M14 58 H78 L68 74 H24 Z" fill="#f8fafc" stroke="#1e1b4b" stroke-width="4"/><path d="M46 54 V22 L70 50 H46" fill="#38bdf8" stroke="#1e1b4b" stroke-width="4"/></svg></div>
    <h1>The boat made it!</h1>
    <p>You reached the dock.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
(function () {
  var cv = document.getElementById("c");
  var ui = Mix.boot(cv);
  var ctx, W = 0, H = 0, raf = 0;
  function layout(force) {
    var r = cv.getBoundingClientRect();
    var rw = Math.round(r.width || 0), rh = Math.round(r.height || 0);
    if (!force && ctx && Math.round(W) === rw && Math.round(H) === rh && rw > 0) return;
    var f = ui.fit();
    ctx = f.ctx; W = f.W; H = f.H;
  }
  function loop() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  function frame() {
    if (!ui.on()) return;
    layout(false);
    if (W < 2 || H < 2) { raf = requestAnimationFrame(frame); return; }
    if (step() === "stop") return;
    draw();
    raf = requestAnimationFrame(frame);
  }
  function begin() { layout(true); reset(); loop(); }
  function hud(t) {
    var el = document.getElementById("fl");
    if (el) el.textContent = t;
    var m = String(t).match(/\d+/);
    if (m) cv.dataset.score = m[0];
  }
  function sky(a, b) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ui.begin(begin);
  ui.replay(begin);
  
  var boatX, scroll, rocks;
  function build() {
    rocks = [];
    var i;
    for (i = 0; i < 8; i++) {
      var side = i % 2 === 0 ? -1 : 1;
      rocks.push({ s: 320 + i * 240, x: 0.5 + side * 0.3, r: 30 });
    }
  }
  function reset() { boatX = W * 0.5; scroll = 0; build(); hud("0"); }
  Mix.hold("L", -1, function () { boatX -= 36; });
  Mix.hold("R", 1, function () { boatX += 36; });
  function step() {
    scroll += 4.2;
    if (Mix.dir()) boatX += Mix.dir() * 6;
    boatX = Math.max(W * 0.18, Math.min(W * 0.82, boatX));
    var by = H * 0.58, i;
    for (i = 0; i < rocks.length; i++) {
      var rk = rocks[i];
      var ry = H * 0.2 + rk.s - scroll;
      var rx = rk.x * W;
      var dx = boatX - rx, dy = by - ry;
      var hit = (rk.r + 26) * (rk.r + 26);
      if (dx * dx + dy * dy < hit) {
        boatX += dx < 0 ? -14 : 14;
        kidNote(170);
      }
    }
    var pct = Math.max(0, Math.min(100, Math.round(scroll / 19)));
    hud(String(pct));
    cv.dataset.scroll = String(Math.round(scroll));
    cv.dataset.bx = String(Math.round(boatX));
    if (scroll > 2000) { draw(); ui.finish(); return "stop"; }
  }
  function draw() {
    sky("#7dd3fc", "#38bdf8");
    ctx.fillStyle = "#166534";
    ctx.fillRect(0, 0, W * 0.12, H);
    ctx.fillRect(W * 0.88, 0, W * 0.12, H);
    ctx.fillStyle = "#0ea5e9";
    ctx.fillRect(W * 0.12, 0, W * 0.76, H);
    var i;
    for (i = 0; i < rocks.length; i++) {
      var rk = rocks[i];
      var ry = H * 0.2 + rk.s - scroll;
      if (ry < -40 || ry > H + 40) continue;
      ctx.fillStyle = "#64748b";
      ctx.beginPath(); ctx.arc(rk.x * W, ry, rk.r, 0, Math.PI * 2); ctx.fill(); Mix.ink(ctx);
      ctx.fillStyle = "#86efac";
      ctx.beginPath(); ctx.arc(rk.x * W - 6, ry - 8, 8, 0, Math.PI * 2); ctx.fill();
    }
    var dockY = H * 0.2 + 2050 - scroll;
    if (dockY < H + 40) {
      ctx.fillStyle = "#92400e";
      Mix.box(ctx, W * 0.28, dockY, W * 0.44, 28, 6); ctx.fill(); Mix.ink(ctx);
    }
    var by = H * 0.58;
    ctx.fillStyle = "#f8fafc";
    ctx.beginPath();
    ctx.moveTo(boatX - 28, by);
    ctx.lineTo(boatX + 28, by);
    ctx.lineTo(boatX + 18, by + 22);
    ctx.lineTo(boatX - 18, by + 22);
    ctx.closePath(); ctx.fill(); Mix.ink(ctx);
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.moveTo(boatX, by - 4);
    ctx.lineTo(boatX, by - 36);
    ctx.lineTo(boatX + 22, by - 8);
    ctx.closePath(); ctx.fill(); Mix.ink(ctx);
  }

  layout(true);
  if (W > 2) { reset(); draw(); }
  addEventListener("resize", function () { layout(true); if (W > 2) draw(); });
})();
  </script>
</body>
</html>
