<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ocean Clean</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#0369a1}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="tr">🗑️ 0/5</b></div>
  <div id="say">TAP the trash! Not the fish.</div>
  <div class="cover" id="title">
    <div class="hero">🌊</div>
    <h1>Ocean Clean</h1>
    <p>Tap 5 bits of trash. Save the fish!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🐠</div>
    <h1>Sparkly sea!</h1>
    <p>The fish are happy.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, n = 0, stars = 0, bits = [], pals = [];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-ocean") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function em(ch, px, py, s) { kidEm(x, ch, px, py, s); }
    function resize() { var b = kidFit(cv, x); W = b.W; H = b.H; }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; n = 0;
      bits = [
        { e: "🧴", x: 0.22, y: 0.32 },
        { e: "🥤", x: 0.55, y: 0.30 },
        { e: "🛍️", x: 0.80, y: 0.38 },
        { e: "👟", x: 0.30, y: 0.50 },
        { e: "🧴", x: 0.68, y: 0.52 },
        { e: "🥤", x: 0.18, y: 0.66 },
        { e: "🛍️", x: 0.48, y: 0.68 },
        { e: "👟", x: 0.78, y: 0.64 }
      ];
      pals = [
        { e: "🐟", x: 0.42, y: 0.42 },
        { e: "🐠", x: 0.62, y: 0.72 }
      ];
      kidBegin();
      document.getElementById("tr").textContent = "🗑️ 0/5";
      kidPing("TAP the trash!");
    }
    kidBind(start);
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var p = kidPt(e, cv), i, best = -1, bestD = 130 * 130;
      for (i = 0; i < bits.length; i++) {
        var dx = p.x - bits[i].x * W, dy = p.y - bits[i].y * H, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      var fishHit = -1, fishD = 110 * 110;
      for (i = 0; i < pals.length; i++) {
        var fx = p.x - pals[i].x * W, fy = p.y - pals[i].y * H, fd = fx * fx + fy * fy;
        if (fd < fishD) { fishD = fd; fishHit = i; }
      }
      if (best < 0 && fishHit >= 0) {
        kidTap(pals[fishHit].e, "Hi fishy! TAP trash.", pals[fishHit].x * innerWidth, pals[fishHit].y * innerHeight, 620);
        return;
      }
      if (best < 0) {
        for (i = 0; i < bits.length; i++) { best = i; break; }
      }
      if (best < 0) return;
      var b = bits[best];
      bits.splice(best, 1); n++; stars++;
      try { localStorage.setItem("alabryuu-ocean", JSON.stringify({ stars: stars })); } catch (err) {}
      document.getElementById("tr").textContent = "🗑️ " + n + "/5";
      kidTap("💦", "Got it!  " + n + "/5", b.x * innerWidth, b.y * innerHeight, 440);
      kidBoom("🗑️", b.x * innerWidth, b.y * innerHeight);
      if (n === 4) pals.push({ e: "🐡", x: 0.35, y: 0.58 });
      if (n >= 5) {
        play = false;
        pals.push({ e: "🐬", x: 0.5, y: 0.48 });
        kidFinish();
      }
    });
    function loop() {
      t += 0.016;
      var g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#38bdf8"); g.addColorStop(1, "#0369a1");
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      em("🪸", 48, H * 0.84, 72); em("🪸", W - 48, H * 0.8, 80);
      em("🌊", W * 0.2, 90, 48); em("🌊", W * 0.7, 80, 56);
      bits.forEach(function (b, i) {
        em(b.e, b.x * W, b.y * H + Math.sin(t * 2 + i) * 8, 88);
      });
      pals.forEach(function (f, i) {
        em(f.e, f.x * W + Math.sin(t + i) * 10, f.y * H + Math.sin(t * 2 + i) * 6, 80);
      });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
