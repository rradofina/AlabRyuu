<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Monster Smile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      background: #2e1065; color: #ede9fe;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    button {
      background: transparent; border: 0; appearance: none; -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer;
    }
    canvas#c { display: block; width: 100%; height: 100%; }
    .home {
      position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; z-index: 8;
      color: #fff; text-decoration: none; font-weight: 800; font-size: 17px;
      background: #1e1b4b; padding: 8px 14px; border-radius: 8px 16px 8px 16px;
      touch-action: manipulation; box-shadow: 0 4px 0 #0f172a;
    }
    #clap {
      position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 8;
      background: #111827; color: #fde047; padding: 7px 12px 8px;
      border-radius: 6px; font-weight: 800; pointer-events: none;
      box-shadow: 0 4px 0 #fde047; min-width: 88px; text-align: center;
    }
    #clap small { display: block; font-size: 10px; letter-spacing: 1px; color: #c4b5fd; }
    #clap b { font-size: 16px; }
    #cardWrap {
      position: fixed; left: 50%; top: 52px; transform: translateX(-50%); z-index: 7;
      display: none; flex-direction: column; align-items: center; pointer-events: none;
    }
    #cardWrap.on { display: flex; }
    #cardWrap canvas { width: 92px; height: 104px; background: #fff; border-radius: 4px 4px 8px 8px; box-shadow: 0 6px 0 #1e1b4b; }
    #cardWrap em {
      font-style: normal; font-weight: 800; font-size: 12px; color: #fde68a;
      margin-top: 4px; text-shadow: 0 2px 0 #1e1b4b;
    }
    #say {
      position: fixed; left: 50%; top: 166px; transform: translateX(-50%); z-index: 7;
      font-weight: 800; font-size: 17px; color: #fde68a; pointer-events: none;
      text-align: center; width: 92%; text-shadow: 0 2px 0 #1e1b4b;
    }
    @media (max-height: 640px) {
      #tabs button { width: 56px; min-height: 64px; }
      #opts button { width: 62px; min-height: 68px; }
      #cardWrap canvas { width: 72px; height: 82px; }
      #say { top: 148px; font-size: 15px; }
    }
    #dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
      display: none; flex-direction: column; gap: 8px;
      padding: 10px 8px max(12px, env(safe-area-inset-bottom));
      background: #1e1b4b;
      border-top: 8px dashed #fde047;
    }
    #dock.on { display: flex; }
    #tabs, #opts, #acts { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    #tabs button {
      width: 64px; min-height: 78px; border-radius: 14px; background: #5b21b6; color: #ede9fe;
      font-weight: 800; font-size: 11px; box-shadow: 0 4px 0 #3b0764;
      display: flex; flex-direction: column; align-items: center; padding: 4px 2px 6px;
    }
    #tabs button.on { background: #c4b5fd; color: #4c1d95; outline: 3px solid #fde047; }
    #tabs canvas, #opts canvas { width: 48px; height: 40px; pointer-events: none; }
    #opts button {
      width: 72px; min-height: 80px; border-radius: 16px; background: #ddd6fe; color: #4c1d95;
      font-weight: 800; font-size: 12px; box-shadow: 0 4px 0 #5b21b6;
      display: flex; flex-direction: column; align-items: center; padding: 4px 2px 6px;
    }
    #opts button.on { outline: 4px solid #fde047; background: #fff; }
    #acts button { flex: 1; height: 56px; border-radius: 16px; font-weight: 800; font-size: 18px; max-width: 200px; }
    #like { background: #fb7185; color: #fff; box-shadow: 0 5px 0 #9d174d; }
    #shot { background: #fde047; color: #422006; box-shadow: 0 5px 0 #ca8a04; }
    .cover {
      position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: 10px;
      padding: 20px; background: linear-gradient(#5b21b6, #1e1b4b);
    }
    .cover.off { display: none; }
    .cover canvas { width: 160px; height: 170px; }
    h1 { font-size: clamp(32px, 9vw, 48px); color: #fff; text-shadow: 0 4px 0 #3b0764; }
    .cover p { font-weight: 800; font-size: 18px; max-width: 340px; color: #fde68a; }
    .btn {
      background: #fde047; color: #422006; font-weight: 800; font-size: 22px;
      padding: 14px 24px; border-radius: 999px; box-shadow: 0 7px 0 #ca8a04;
    }
    .btn.g { background: #86efac; box-shadow: 0 7px 0 #16a34a; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="clap"><small>CARD</small><b id="ms">1 / 5</b></div>
  <div id="cardWrap"><canvas id="card" width="92" height="104"></canvas><em>Copy this pal</em></div>
  <div id="say">Match the card. Tap Photo.</div>
  <div id="dock">
    <div id="tabs"></div>
    <div id="opts"></div>
    <div id="acts">
      <button id="like" type="button">I like it</button>
      <button id="shot" type="button">Photo</button>
    </div>
  </div>
  <div class="cover" id="title">
    <canvas id="titleArt" width="160" height="170"></canvas>
    <h1>Monster Smile</h1>
    <p>Soft pal. Match the photo. Dance!</p>
    <button class="btn" id="go">Make a pal</button>
  </div>
  <div class="cover off" id="win">
    <canvas id="winArt" width="160" height="170"></canvas>
    <h1>Smile studio!</h1>
    <p id="winP">Five photos.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    function em(ch,px,py,s){ x.font=s+"px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(ch,px,py); }
    function emC(ctx,ch,px,py,s){ ctx.font=s+"px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(ch,px,py); }
    var W = 0, H = 0, last = 0, t = 0, play = false, cardI = 0, stars = 0;
    var dance = 0, flash = 0, tab = "eyes";
    var m = { eyes: 0, mouth: 0, horn: 0, col: 0, ear: 0 };
    var conf = [], hearts = [], pops = [];
    var COLS = ["#86efac", "#67e8f9", "#fde047", "#f9a8d4", "#c4b5fd", "#fdba74"];
    var COL_NAME = ["Mint", "Aqua", "Gold", "Pink", "Lilac", "Peach"];
    var EYES = ["dots", "big", "happy", "sleepy"];
    var MOUTH = ["smile", "grin", "o", "cat"];
    var HORNS = ["bow", "nubs", "flower", "hat"];
    var EARS = ["round", "flop", "tiny", "side"];
    var TABS = [
      { k: "eyes", n: "Eyes" },
      { k: "mouth", n: "Mouth" },
      { k: "horn", n: "Top" },
      { k: "col", n: "Color" },
      { k: "ear", n: "Ears" }
    ];
    var CARDS = [
      { eyes: 0, mouth: 0, horn: 0, col: 0, ear: 0 },
      { eyes: 1, mouth: 1, horn: 1, col: 2, ear: 1 },
      { eyes: 2, mouth: 3, horn: 2, col: 3, ear: 2 },
      { eyes: 0, mouth: 2, horn: 3, col: 1, ear: 3 },
      { eyes: 1, mouth: 0, horn: 0, col: 4, ear: 0 }
    ];
    try {
      var sv = JSON.parse(localStorage.getItem("alabryuu-monster") || "null");
      if (sv && typeof sv.stars === "number") stars = sv.stars;
    } catch (e) {}

    function beep(f, d, typ) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        if (ac.state === "suspended") ac.resume();
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = typ || "sine"; o.frequency.value = f; g.gain.value = 0.08;
        o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function say(s) { document.getElementById("say").textContent = s; }
    function saveStars() {
      try { localStorage.setItem("alabryuu-monster", JSON.stringify({ stars: stars })); } catch (e) {}
    }
    function hud() {
      document.getElementById("ms").textContent = Math.min(cardI + 1, 5) + " / 5";
    }
    function resize() {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = W + "px"; cv.style.height = H + "px";
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", resize); resize();

    function oval(ctx, cx, cy, rx, ry, col) {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    }
    function disc(ctx, cx, cy, r, col) {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
    function rr(ctx, a, b, w, h, r) {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(a, b, w, h, r);
      else ctx.rect(a, b, w, h);
      ctx.fill();
    }
    function drawHeart(ctx, hx, hy, s, col) {
      emC(ctx, "❤️", hx, hy, Math.max(16, s * 1.6));
    }
    function drawStar(ctx, cx, cy, r, col) {
      emC(ctx, "⭐", cx, cy, Math.max(14, r * 1.8));
    }

    function drawEyes(ctx, kind, y) {
      var eyes = ["👀", "😍", "😴", "😉"];
      emC(ctx, eyes[kind] || "👀", 0, y, 38);
    }

    function drawMouth(ctx, kind, y) {
      var mouths = ["😄", "😁", "😗", "😛"];
      emC(ctx, mouths[kind] || "😄", 0, y, 34);
    }

    function drawHorn(ctx, kind, y) {
      var horns = ["🎀", "🌸", "🌼", "🎩"];
      emC(ctx, horns[kind] || "🎀", 0, y, 30);
      return;
      if (kind === 0) {
        ctx.fillStyle = "#fb7185";
        ctx.beginPath(); ctx.ellipse(-14, y, 12, 9, -0.35, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(14, y, 12, 9, 0.35, 0, Math.PI * 2); ctx.fill();
        disc(ctx, 0, y, 6, "#be185d");
        ctx.strokeStyle = "#fb7185"; ctx.lineWidth = 3; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(-4, y + 5); ctx.lineTo(-10, y + 16); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(4, y + 5); ctx.lineTo(10, y + 16); ctx.stroke();
      } else if (kind === 1) {
        oval(ctx, -22, y, 9, 13, "#f9a8d4");
        oval(ctx, 22, y, 9, 13, "#f9a8d4");
        disc(ctx, -22, y - 4, 3, "#fff");
        disc(ctx, 22, y - 4, 3, "#fff");
      } else if (kind === 2) {
        var i;
        for (i = 0; i < 6; i++) {
          var a = i * Math.PI / 3;
          disc(ctx, Math.cos(a) * 11, y + Math.sin(a) * 11, 7, "#f9a8d4");
        }
        disc(ctx, 0, y, 7, "#fde047");
      } else {
        ctx.fillStyle = "#7c3aed";
        ctx.beginPath();
        ctx.moveTo(-16, y + 10);
        ctx.lineTo(-14, y - 6);
        ctx.quadraticCurveTo(0, y - 12, 14, y - 6);
        ctx.lineTo(16, y + 10);
        ctx.closePath();
        ctx.fill();
        oval(ctx, 0, y + 10, 20, 6, "#5b21b6");
        disc(ctx, 0, y, 4, "#fde047");
      }
    }

    function drawEars(ctx, kind, col) {
      var ears = ["🐰", "🦊", "🐻", "🐶"];
      emC(ctx, ears[kind] || "🐰", -58, -6, 28);
      emC(ctx, ears[kind] || "🐰", 58, -6, 28);
      return;
      if (kind === 0) {
        oval(ctx, -62, -8, 20, 18, col);
        oval(ctx, 62, -8, 20, 18, col);
        oval(ctx, -62, -8, 10, 9, "#fbcfe8");
        oval(ctx, 62, -8, 10, 9, "#fbcfe8");
      } else if (kind === 1) {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.ellipse(-58, 6, 14, 26, -0.55, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(58, 6, 14, 26, 0.55, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fbcfe8";
        ctx.beginPath(); ctx.ellipse(-58, 8, 7, 14, -0.55, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(58, 8, 7, 14, 0.55, 0, Math.PI * 2); ctx.fill();
      } else if (kind === 2) {
        disc(ctx, -54, -26, 9, col);
        disc(ctx, 54, -26, 9, col);
        disc(ctx, -54, -26, 4, "#fbcfe8");
        disc(ctx, 54, -26, 4, "#fbcfe8");
      } else {
        oval(ctx, -70, 12, 16, 11, col);
        oval(ctx, 70, 12, 16, 11, col);
        oval(ctx, -70, 12, 8, 5, "#fbcfe8");
        oval(ctx, 70, 12, 8, 5, "#fbcfe8");
      }
    }

    function drawPal(ctx, look, px, py, sc, time, dancing, still) {
      var col = COLS[look.col];
      var hop = dancing ? Math.abs(Math.sin(time * 10)) * 10 : (still ? 0 : Math.sin(time * 3) * 4);
      var sqx = dancing ? 1 + Math.sin(time * 12) * 0.1 : 1;
      var sqy = dancing ? 1 - Math.sin(time * 12) * 0.1 : 1;
      ctx.save();
      ctx.translate(px, py + hop);
      ctx.scale(sc * sqx, sc * sqy);

      drawEars(ctx, look.ear, col);
      drawHorn(ctx, look.horn, -78);
      oval(ctx, 0, 8, 70, 62, col);
      oval(ctx, -16, -14, 20, 11, "rgba(255,255,255,.28)");
      disc(ctx, -28, 18, 8, "rgba(251,113,133,.35)");
      disc(ctx, 28, 18, 8, "rgba(251,113,133,.35)");

      var lPhase = dancing ? Math.sin(time * 10) : Math.sin(time * 3) * 0.25;
      var rPhase = dancing ? -Math.sin(time * 10) : -Math.sin(time * 3) * 0.25;
      ctx.strokeStyle = col;
      ctx.lineWidth = 14;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-16, 58); ctx.lineTo(-20 + lPhase * 8, 92 + Math.max(0, -lPhase) * 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(16, 58); ctx.lineTo(20 + rPhase * 8, 92 + Math.max(0, -rPhase) * 8); ctx.stroke();
      disc(ctx, -20 + lPhase * 8, 96 + Math.max(0, -lPhase) * 8, 10, "#fde68a");
      disc(ctx, 20 + rPhase * 8, 96 + Math.max(0, -rPhase) * 8, 10, "#fde68a");

      var lArm = dancing ? -2.2 + Math.sin(time * 10) * 0.7 : -1.15 + Math.sin(time * 3) * 0.2;
      var rArm = dancing ? 2.2 - Math.cos(time * 10) * 0.7 : 1.15 + Math.cos(time * 3) * 0.2;
      ctx.save(); ctx.translate(-60, 6); ctx.rotate(lArm);
      ctx.strokeStyle = col; ctx.lineWidth = 13; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.stroke();
      disc(ctx, 0, 38, 9, col);
      disc(ctx, -3, 36, 3, "rgba(255,255,255,.4)");
      ctx.restore();
      ctx.save(); ctx.translate(60, 6); ctx.rotate(rArm);
      ctx.strokeStyle = col; ctx.lineWidth = 13; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.stroke();
      disc(ctx, 0, 38, 9, col);
      disc(ctx, 3, 36, 3, "rgba(255,255,255,.4)");
      ctx.restore();

      drawEyes(ctx, look.eyes, -6);
      drawMouth(ctx, look.mouth, 32);
      ctx.restore();
    }

    function drawStudio() {
      var g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#4c1d95"); g.addColorStop(0.55, "#5b21b6"); g.addColorStop(1, "#1e1b4b");
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      var i;
      x.fillStyle = "#3b0764";
      for (i = 0; i < 8; i++) {
        x.beginPath();
        x.moveTo(i * 18, 0);
        x.quadraticCurveTo(i * 18 + 10, H * 0.25, i * 18, H * 0.5);
        x.lineTo(i * 18 + 16, H * 0.5);
        x.quadraticCurveTo(i * 18 + 26, H * 0.25, i * 18 + 16, 0);
        x.fill();
      }
      for (i = 0; i < 8; i++) {
        var rx = W - i * 18;
        x.beginPath();
        x.moveTo(rx, 0);
        x.quadraticCurveTo(rx - 10, H * 0.25, rx, H * 0.5);
        x.lineTo(rx - 16, H * 0.5);
        x.quadraticCurveTo(rx - 26, H * 0.25, rx - 16, 0);
        x.fill();
      }
      x.fillStyle = "rgba(253,224,71,.12)";
      x.beginPath();
      x.moveTo(W * 0.5, 40);
      x.lineTo(W * 0.18, H * 0.72);
      x.lineTo(W * 0.82, H * 0.72);
      x.closePath();
      x.fill();
      disc(x, W * 0.5, 36, 16, "#fde047");
      disc(x, W * 0.5, 36, 8, "#fff");
      x.fillStyle = "#312e81";
      x.fillRect(0, H * 0.7, W, H * 0.3);
      x.fillStyle = "#4c1d95";
      for (i = 0; i < 8; i++) {
        for (var j = 0; j < 3; j++) {
          if ((i + j) % 2 === 0) x.fillRect(i * (W / 8), H * 0.7 + j * 28, W / 8, 28);
        }
      }
      x.fillStyle = "#111827";
      rr(x, W - 78, H * 0.52, 36, 22, 4);
      x.fillStyle = "#fde047";
      disc(x, W - 60, H * 0.545, 7, "#fde047");
      x.strokeStyle = "#111827"; x.lineWidth = 4;
      x.beginPath(); x.moveTo(W - 60, H * 0.57); x.lineTo(W - 60, H * 0.7); x.stroke();
      x.beginPath(); x.moveTo(W - 60, H * 0.7); x.lineTo(W - 74, H * 0.76); x.stroke();
      x.beginPath(); x.moveTo(W - 60, H * 0.7); x.lineTo(W - 46, H * 0.76); x.stroke();
    }

    function colorClose(a, b) {
      if (a === b) return true;
      return Math.abs(a - b) === 1;
    }
    function matches() {
      var c = CARDS[cardI];
      if (!c) return false;
      return m.eyes === c.eyes && m.mouth === c.mouth && m.horn === c.horn &&
        colorClose(m.col, c.col) && m.ear === c.ear;
    }

    function iconCanvas(w, h, drawFn) {
      var c = document.createElement("canvas");
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      c.width = w * dpr; c.height = h * dpr;
      c.style.width = w + "px"; c.style.height = h + "px";
      var ctx = c.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawFn(ctx, w, h);
      return c;
    }

    function paintCard() {
      var c = document.getElementById("card");
      var ctx = c.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      var look = CARDS[cardI] || m;
      drawPal(ctx, look, 46, 48, 0.42, 0.2, false, true);
      ctx.fillStyle = "#4c1d95";
      ctx.font = "bold 10px Trebuchet MS";
      ctx.textAlign = "center";
      ctx.fillText("card " + (cardI + 1), 46, 98);
    }

    function fillTabs() {
      var box = document.getElementById("tabs");
      box.innerHTML = "";
      TABS.forEach(function (tb) {
        var b = document.createElement("button");
        b.type = "button";
        if (tb.k === tab) b.className = "on";
        b.appendChild(iconCanvas(48, 40, function (ctx, w, h) {
          ctx.translate(w / 2, h / 2 + 4);
          if (tb.k === "ear") ctx.scale(0.26, 0.26);
          else ctx.scale(0.38, 0.38);
          if (tb.k === "eyes") drawEyes(ctx, m.eyes, 0);
          else if (tb.k === "mouth") drawMouth(ctx, m.mouth, 0);
          else if (tb.k === "horn") drawHorn(ctx, m.horn, 0);
          else if (tb.k === "col") disc(ctx, 0, 0, 28, COLS[m.col]);
          else drawEars(ctx, m.ear, COLS[m.col]);
        }));
        var lab = document.createElement("span");
        lab.textContent = tb.n;
        b.appendChild(lab);
        b.onclick = function () { tab = tb.k; fillTabs(); fillOpts(); beep(480, 0.05); };
        box.appendChild(b);
      });
    }

    function fillOpts() {
      var box = document.getElementById("opts");
      box.innerHTML = "";
      var list, key = tab;
      if (key === "eyes") list = EYES;
      else if (key === "mouth") list = MOUTH;
      else if (key === "horn") list = HORNS;
      else if (key === "col") list = COL_NAME;
      else list = EARS;
      list.forEach(function (name, i) {
        var b = document.createElement("button");
        b.type = "button";
        if (m[key] === i) b.className = "on";
        b.appendChild(iconCanvas(48, 40, function (ctx, w, h) {
          ctx.translate(w / 2, h / 2 + 2);
          if (key === "ear") ctx.scale(0.26, 0.26);
          else ctx.scale(0.42, 0.42);
          if (key === "eyes") drawEyes(ctx, i, 0);
          else if (key === "mouth") drawMouth(ctx, i, 0);
          else if (key === "horn") drawHorn(ctx, i, 0);
          else if (key === "col") disc(ctx, 0, 0, 26, COLS[i]);
          else drawEars(ctx, i, COLS[m.col]);
        }));
        var lab = document.createElement("span");
        lab.textContent = name[0].toUpperCase() + name.slice(1);
        b.appendChild(lab);
        b.onclick = function () {
          m[key] = i;
          fillTabs(); fillOpts();
          beep(520 + i * 30, 0.06);
        };
        box.appendChild(b);
      });
    }

    function start() {
      play = true; cardI = 0; dance = 0; flash = 0; tab = "eyes";
      m = { eyes: 0, mouth: 0, horn: 0, col: 0, ear: 0 };
      conf = []; hearts = []; pops = [];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      document.getElementById("cardWrap").classList.add("on");
      say("Match the card. Tap Photo.");
      fillTabs(); fillOpts(); paintCard(); hud(); beep(520, 0.1);
    }

    document.getElementById("like").onclick = function () {
      dance = 2;
      var i;
      for (i = 0; i < 10; i++) {
        hearts.push({
          x: W * 0.5 + (Math.random() - 0.5) * 90,
          y: H * 0.38, vy: -50 - Math.random() * 40, life: 1
        });
      }
      say("Dance!");
      beep(880, 0.1);
    };
    document.getElementById("shot").onclick = function () {
      flash = 0.4;
      var i;
      for (i = 0; i < 16; i++) {
        conf.push({
          x: W * 0.5, y: H * 0.36,
          vx: (Math.random() - 0.5) * 220, vy: -80 - Math.random() * 80,
          life: 1, r: 4 + Math.random() * 4,
          col: COLS[i % COLS.length]
        });
      }
      if (!play) return;
      if (matches()) {
        stars++;
        saveStars();
        pops.push({ x: W * 0.5, y: H * 0.3, life: 0.8 });
        cardI++;
        beep(990, 0.12);
        if (cardI >= 5) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("cardWrap").classList.remove("on");
          document.getElementById("winP").textContent = "Stars " + stars + ". Five photos!";
          document.getElementById("win").classList.remove("off");
          paintPreview(document.getElementById("winArt"), true);
        } else {
          m = { eyes: 0, mouth: 0, horn: 0, col: 0, ear: 0 };
          say("Yes! Card " + (cardI + 1) + ".");
          fillTabs(); fillOpts(); paintCard(); hud();
        }
      } else {
        say("Almost! Look at the card.");
        beep(240, 0.08);
      }
    };

    function update(dt) {
      t += dt;
      if (dance > 0) dance -= dt;
      if (flash > 0) flash -= dt;
      var i;
      for (i = hearts.length - 1; i >= 0; i--) {
        hearts[i].life -= dt;
        hearts[i].y += hearts[i].vy * dt;
        if (hearts[i].life <= 0) hearts.splice(i, 1);
      }
      for (i = conf.length - 1; i >= 0; i--) {
        conf[i].life -= dt;
        conf[i].x += conf[i].vx * dt;
        conf[i].y += conf[i].vy * dt;
        conf[i].vy += 160 * dt;
        if (conf[i].life <= 0) conf.splice(i, 1);
      }
      for (i = pops.length - 1; i >= 0; i--) {
        pops[i].life -= dt;
        if (pops[i].life <= 0) pops.splice(i, 1);
      }
    }

    function draw() {
      drawStudio();
      drawPal(x, m, W * 0.5, Math.min(H * 0.42, H - 268), 1.05, t, dance > 0, false);
      var i;
      for (i = 0; i < hearts.length; i++) {
        x.globalAlpha = Math.max(0, hearts[i].life);
        drawHeart(x, hearts[i].x, hearts[i].y, 10, "#fb7185");
      }
      for (i = 0; i < conf.length; i++) {
        x.globalAlpha = Math.max(0, conf[i].life);
        disc(x, conf[i].x, conf[i].y, conf[i].r, conf[i].col);
      }
      for (i = 0; i < pops.length; i++) {
        x.globalAlpha = Math.max(0, pops[i].life);
        drawStar(x, pops[i].x, pops[i].y, 16, "#fde047");
      }
      x.globalAlpha = 1;
      if (flash > 0) {
        x.fillStyle = "rgba(255,255,255," + (flash * 0.85) + ")";
        x.fillRect(0, 0, W, H);
      }
    }

    function paintPreview(c, dancing) {
      var ctx = c.getContext("2d");
      ctx.clearRect(0, 0, c.width, c.height);
      var g = ctx.createLinearGradient(0, 0, 0, c.height);
      g.addColorStop(0, "#5b21b6"); g.addColorStop(1, "#1e1b4b");
      ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
      drawPal(ctx, m, 80, 78, 0.7, 0.4, !!dancing, !dancing);
    }

    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    paintPreview(document.getElementById("titleArt"), true);
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
  })();
  </script>
</body>
