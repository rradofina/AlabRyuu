<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Monster Smile</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#581c87}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="bits">0/3</b></div>
  <div id="say">Give eyes, mouth, and horns!</div>
  <div class="dock" id="dock">
    <button id="eyes"><span>👀</span>Eyes</button>
    <button id="mouth"><span>😊</span>Smile</button>
    <button id="horn"><span>🦄</span>Horns</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">😄</div>
    <h1>Monster Smile</h1>
    <p>Make a silly friendly face!</p>
    <button class="play" id="go">Make</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🥰</div>
    <h1>So silly!</h1>
    <p>Your monster is smiling.</p>
    <button class="play g" id="again">Make again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, have = { eyes: 0, mouth: 0, horn: 0 }, stars = 0;
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-monster") || "null"); if (sv && sv.stars) stars = sv.stars; } catch (e) {}
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function count() { return have.eyes + have.mouth + have.horn; }
    function start() {
      play = true; have = { eyes: 0, mouth: 0, horn: 0 };
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      document.getElementById("bits").textContent = "0/3";
      document.getElementById("say").textContent = "Give eyes, mouth, and horns!";
    }
    function add(k, word) {
      if (!play) return;
      have[k] = 1;
      document.getElementById("bits").textContent = count() + "/3";
      document.getElementById("say").textContent = word + "!";
      if (count() >= 3) {
        play = false; stars++;
        try { localStorage.setItem("alabryuu-monster", JSON.stringify({ stars: stars })); } catch (e) {}
        document.getElementById("dock").classList.remove("on");
        document.getElementById("win").classList.remove("off");
      }
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("eyes").onclick = function () { add("eyes", "Googly eyes"); };
    document.getElementById("mouth").onclick = function () { add("mouth", "Big smile"); };
    document.getElementById("horn").onclick = function () { add("horn", "Fancy horns"); };
    function loop() {
      x.fillStyle = "#6b21a8"; x.fillRect(0, 0, W, H);
      em("🟣", W * 0.5, H * 0.42, 140);
      if (have.horn) em("🦄", W * 0.5, H * 0.26, 56);
      if (have.eyes) em("👀", W * 0.5, H * 0.40, 48);
      if (have.mouth) em("😊", W * 0.5, H * 0.52, 48);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
