<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Monster Smile</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#3b0764;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;background:#1c1917;padding:54px 10px 24px;text-align:center}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    h1{font-size:clamp(24px,7vw,36px);color:#fde68a}
    .hud{display:flex;justify-content:center;gap:8px;margin:6px}
    .chip{background:#fff;color:#3b0764;font-weight:800;padding:6px 12px;border-radius:999px;box-shadow:0 4px 0 #a78bfa;font-size:15px}
    .booth{max-width:380px;margin:8px auto;background:#7f1d1d;border-radius:28px 28px 12px 12px;padding:12px 12px 16px;box-shadow:0 12px 0 #450a0a,inset 0 0 0 6px #b45309}
    .curtain{height:36px;background:repeating-linear-gradient(90deg,#991b1b 0 18px,#7f1d1d 18px 28px);border-radius:20px 20px 0 0;margin:-12px -12px 10px;position:relative}
    .curtain:after,.curtain:before{content:"🎀";position:absolute;top:4px;font-size:20px}
    .curtain:before{left:10px}.curtain:after{right:10px}
    .stage{background:#111827;border-radius:18px;padding:14px 10px 10px;position:relative;overflow:hidden;min-height:250px}
    .stickers{position:absolute;inset:0;pointer-events:none;font-size:22px}
    .stickers span{position:absolute}
    .face{width:min(200px,70vw);height:200px;margin:8px auto;border-radius:46%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 0 rgba(0,0,0,.25);position:relative;transition:background .2s}
    .horns{font-size:28px;min-height:28px}
    .eyes{font-size:52px;line-height:1}
    .mouth{font-size:48px;line-height:1}
    .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
    .flash.on{animation:flash .35s}
    @keyframes flash{0%{opacity:.95}100%{opacity:0}}
    .clip{max-width:380px;margin:10px auto;background:#fffbeb;color:#3b2100;border-radius:16px;padding:10px;box-shadow:0 6px 0 #d97706;text-align:left}
    .clip h3{font-size:14px;margin-bottom:6px}
    .clip li{list-style:none;font-weight:800;padding:4px 0;font-size:16px}
    .clip li.done{opacity:.4;text-decoration:line-through}
    .clip li.now{background:#fde68a;border-radius:8px;padding:6px 8px}
    .row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}
    .row button{min-width:76px;padding:12px 10px;border-radius:16px;background:#fff;font-weight:800;box-shadow:0 6px 0 #a78bfa;color:#3b0764;font-size:15px}
    .row button:active,.go:active{transform:translateY(3px)}
    .go{margin-top:6px;background:#ffd166;color:#3b2100;font-weight:800;font-size:22px;padding:12px 24px;border-radius:999px;box-shadow:0 6px 0 #e09f1f}
    .msg{font-weight:800;min-height:2em;margin-top:8px;color:#fde68a;font-size:18px}
    .strip{display:none;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px auto;max-width:380px}
    .strip.on{display:flex}
    .polaroid{background:#fff;padding:8px 8px 22px;border-radius:8px;box-shadow:0 6px 0 #444;width:88px}
    .polaroid .mini{height:64px;border-radius:40%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px}
    .polaroid b{font-size:11px;color:#3b0764}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(20,10,30,.88);z-index:10;gap:10px;color:#fff;padding:20px}
    .win.on{display:flex}
    .win h2{font-size:32px}
    .stars{font-size:28px;letter-spacing:4px}
    .collage{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:340px}
    .winbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .play,.next{font-weight:800;font-size:22px;padding:14px 22px;border-radius:999px}
    .play{background:#ffd166;color:#3b2100;box-shadow:0 7px 0 #e09f1f}
    .next{background:#86efac;color:#14532d;box-shadow:0 7px 0 #16a34a}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <h1>Monster Smile</h1>
  <div class="hud">
    <div class="chip" id="lvl">Pose 1 / 4</div>
    <div class="chip" id="stars">⭐ 0</div>
  </div>
  <div class="booth">
    <div class="curtain"></div>
    <div class="stage">
      <div class="stickers"><span style="left:8px;top:8px">⭐</span><span style="right:10px;top:16px">💖</span><span style="left:12px;bottom:10px">🌈</span><span style="right:8px;bottom:14px">✨</span></div>
      <div class="face" id="face">
        <div class="horns" id="horns">🎀</div>
        <div class="eyes" id="eyes">👀</div>
        <div class="mouth" id="mouth">🙂</div>
      </div>
      <div class="flash" id="flash"></div>
    </div>
  </div>
  <div class="clip">
    <h3>📷 Mission list</h3>
    <ul id="missions"></ul>
  </div>
  <div class="row">
    <button id="eye">Eyes</button>
    <button id="mo">Mouth</button>
    <button id="col">Color</button>
    <button id="hn">Horns</button>
  </div>
  <button class="go" id="go">Snap!</button>
  <p class="msg" id="msg">Make a sleepy face, then snap!</p>
  <div class="strip" id="strip"></div>
  <div class="win" id="win">
    <div style="font-size:64px">📸</div>
    <h2 id="wintitle">Silly smile!</h2>
    <p class="stars" id="winstars">⭐⭐⭐⭐</p>
    <div class="collage" id="collage"></div>
    <p id="winline">Four friendly faces!</p>
    <div class="winbtns">
      <button class="play" id="again">Play again</button>
      <button class="next" id="next">Next</button>
    </div>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var EYES=[{id:"open",e:"👀"},{id:"happy",e:"😊"},{id:"wink",e:"😉"},{id:"closed",e:"😌"},{id:"wide",e:"😯"}];
    var MOUTHS=[{id:"flat",e:"😐"},{id:"smile",e:"😄"},{id:"O",e:"😮"},{id:"tongue",e:"😜"},{id:"small",e:"🙂"}];
    var COLS=["#86efac","#f9a8d4","#93c5fd","#fde047","#fda4af","#ddd6fe"];
    var HORNS=["","🎀","🦄","🌸"];
    var JOBS=[
      {n:"sleepy",eyes:"closed",mouth:"small",txt:"Make sleepy"},
      {n:"silly",eyes:"wink",mouth:"tongue",txt:"Make silly"},
      {n:"surprised",eyes:"wide",mouth:"O",txt:"Make surprised"},
      {n:"happy",eyes:"happy",mouth:"smile",txt:"Make happy"}
    ];
    var ei=0,mi=1,ci=0,hi=1,job=0,shots=[],stars=0,usedHorns=0;
    function draw(){
      document.getElementById("eyes").textContent=EYES[ei].e;
      document.getElementById("mouth").textContent=MOUTHS[mi].e;
      document.getElementById("horns").textContent=HORNS[hi]||"　";
      document.getElementById("face").style.background=COLS[ci];
    }
    function list(){
      var ul=document.getElementById("missions");ul.innerHTML="";
      JOBS.forEach(function(j,i){
        var li=document.createElement("li");
        li.textContent=(i<job?"✅ ":"○ ")+j.txt;
        if(i<job)li.className="done";if(i===job)li.className="now";
        ul.appendChild(li);
      });
    }
    function snapCard(){
      return {eyes:EYES[ei].e,mouth:MOUTHS[mi].e,horns:HORNS[hi],col:COLS[ci],n:JOBS[job].n};
    }
    function cardHtml(s){
      return "<div class='polaroid'><div class='mini' style='background:"+s.col+"'><div>"+(s.horns||"")+"</div><div>"+s.eyes+"</div><div>"+s.mouth+"</div></div><b>"+s.n+"</b></div>";
    }
    function strip(){
      var box=document.getElementById("strip");
      box.classList.toggle("on",shots.length>0);
      box.innerHTML=shots.map(cardHtml).join("");
    }
    document.getElementById("eye").onclick=function(){ei=(ei+1)%EYES.length;draw();beep(480,.06);};
    document.getElementById("mo").onclick=function(){mi=(mi+1)%MOUTHS.length;draw();beep(540,.06);};
    document.getElementById("col").onclick=function(){ci=(ci+1)%COLS.length;draw();beep(400,.06);};
    document.getElementById("hn").onclick=function(){hi=(hi+1)%HORNS.length;if(HORNS[hi])usedHorns=1;draw();beep(360,.06);};
    document.getElementById("go").onclick=function(){
      var j=JOBS[job];
      if(EYES[ei].id!==j.eyes){document.getElementById("msg").textContent="Try "+j.txt+" eyes!";beep(180,.1);return;}
      if(MOUTHS[mi].id!==j.mouth){document.getElementById("msg").textContent="Try a "+j.n+" mouth!";beep(180,.1);return;}
      var fl=document.getElementById("flash");fl.classList.remove("on");void fl.offsetWidth;fl.classList.add("on");
      shots.push(snapCard());strip();beep(880,.12);
      var got=1;stars+=got;document.getElementById("stars").textContent="⭐ "+stars;
      job++;list();
      if(job>=JOBS.length){
        if(usedHorns)stars+=1;
        document.getElementById("stars").textContent="⭐ "+stars;
        setTimeout(function(){showWin();},400);
      }else{
        document.getElementById("lvl").textContent="Pose "+(job+1)+" / 4";
        document.getElementById("msg").textContent=JOBS[job].txt+", then snap!";
      }
    };
    function showWin(){
      document.getElementById("wintitle").textContent="Silly smile!";
      document.getElementById("winstars").textContent="⭐".repeat(Math.min(4,stars));
      document.getElementById("collage").innerHTML=shots.map(cardHtml).join("");
      document.getElementById("winline").textContent="Four friendly faces!";
      document.getElementById("win").classList.add("on");
    }
    function reset(){
      ei=0;mi=1;ci=0;hi=1;job=0;shots=[];stars=0;usedHorns=0;
      document.getElementById("stars").textContent="⭐ 0";
      document.getElementById("lvl").textContent="Pose 1 / 4";
      document.getElementById("msg").textContent="Make a sleepy face, then snap!";
      document.getElementById("strip").innerHTML="";document.getElementById("strip").classList.remove("on");
      list();draw();
    }
    document.getElementById("again").onclick=function(){document.getElementById("win").classList.remove("on");reset();};
    document.getElementById("next").onclick=function(){document.getElementById("win").classList.remove("on");reset();};
    list();draw();
  </script>
</body>
</html>
