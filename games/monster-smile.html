<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Monster Smile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background: #5b21b6; color: #ede9fe; touch-action: none; user-select: none; -webkit-user-select: none; }
    button { background: transparent; border: 0; appearance: none; -webkit-appearance: none; -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer; }
    canvas { display: block; width: 100%; height: 100%; }
    .home { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; z-index: 8; color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; background: rgba(0,0,0,.3); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 7; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; pointer-events: none; }
    #hud b { font-weight: 800; font-size: 13px; background: #ddd6fe; color: #5b21b6; padding: 6px 10px; border-radius: 999px; }
    #say { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 7; font-weight: 800; font-size: 16px; color: #fde68a; pointer-events: none; text-align: center; width: 92%; }
    #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: none; flex-direction: column; gap: 8px; padding: 8px 10px max(10px, env(safe-area-inset-bottom)); background: #4c1d95; }
    #dock.on { display: flex; }
    #row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    #row button { min-width: 70px; height: 52px; border-radius: 14px; background: #c4b5fd; color: #4c1d95; font-weight: 800; font-size: 14px; box-shadow: 0 4px 0 #2e1065; }
    #acts { display: flex; gap: 8px; justify-content: center; }
    #acts button { flex: 1; height: 56px; border-radius: 16px; font-weight: 800; font-size: 16px; }
    #like { background: #fb7185; color: #fff; box-shadow: 0 5px 0 #9d174d; }
    #shot { background: #fde047; color: #422006; box-shadow: 0 5px 0 #ca8a04; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px; background: linear-gradient(#7c3aed, #86efac); }
    .cover.off { display: none; }
    h1 { font-size: clamp(32px, 9vw, 48px); color: #fff; text-shadow: 0 4px 0 #5b21b6; }
    .cover p { font-weight: 800; font-size: 18px; max-width: 340px; color: #fff; }
    .btn { background: #fde047; color: #422006; font-weight: 800; font-size: 22px; padding: 14px 24px; border-radius: 999px; box-shadow: 0 7px 0 #ca8a04; }
    .btn.g { background: #86efac; box-shadow: 0 7px 0 #16a34a; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="ms">Happy face</b><b id="lk">♡ 0</b></div>
  <div id="say">Tap parts. Mix a silly pal. Never scary.</div>
  <div id="dock">
    <div id="row">
      <button id="p0" type="button">👀 Eyes</button>
      <button id="p1" type="button">👄 Mouth</button>
      <button id="p2" type="button">🎀 Horns</button>
      <button id="p3" type="button">🎨 Color</button>
      <button id="p4" type="button">👂 Ears</button>
    </div>
    <div id="acts">
      <button id="like" type="button">♡ I like it</button>
      <button id="shot" type="button">📸 Photo</button>
    </div>
  </div>
  <div class="cover" id="title">
    <div style="font-size:76px">👾</div>
    <h1>Monster Smile</h1>
    <p>Bounce the parts. Mix-match. Dance when you like it. Photo flash. Five soft poses.</p>
    <button class="btn" id="go">Make a pal</button>
  </div>
  <div class="cover off" id="win">
    <div style="font-size:76px">📸</div>
    <h1>Smile studio!</h1>
    <p id="winP">Five poses. Soft giggles.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, last = 0, t = 0, play = false, miss = 0, likes = 0;
    var dance = 0, flash = 0, bounce = [0, 0, 0, 0, 0];
    var m = { eyes: 0, mouth: 0, horn: 0, col: 0, ear: 0 };
    var conf = [], hearts = [];
    var COLS = ["#86efac", "#67e8f9", "#fde047", "#f9a8d4", "#c4b5fd", "#fdba74"];
    var EYES = ["uu", "oo", "^^", "--", "><"];
    var MOUTH = ["smile", "grin", "o", "cat", "tiny"];
    var HORNS = ["none", "bow", "nubs", "flower", "hat"];
    var EARS = ["round", "flop", "tiny", "side"];
    var MISSIONS = [
      { n: "Happy face", hint: "Tap mouth until it smiles big.", ok: function () { return m.mouth === 0 || m.mouth === 1; } },
      { n: "Soft horns", hint: "Add a bow or flower on top.", ok: function () { return m.horn === 1 || m.horn === 3; } },
      { n: "Silly eyes", hint: "Find the winky or happy eyes.", ok: function () { return m.eyes === 2 || m.eyes === 4; } },
      { n: "Dance party", hint: "Tap I like it so the pal dances.", ok: function () { return dance > 0.2; } },
      { n: "Photo booth", hint: "Take a photo flash!", ok: function () { return flash > 0; } }
    ];

    function beep(f, d, typ) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        if (ac.state === "suspended") ac.resume();
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = typ || "sine"; o.frequency.value = f; g.gain.value = 0.08;
        o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function say(s) { document.getElementById("say").textContent = s; }
    function hud() {
      document.getElementById("ms").textContent = MISSIONS[miss] ? MISSIONS[miss].n : "Done";
      document.getElementById("lk").textContent = "♡ " + likes;
    }
    function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
    addEventListener("resize", resize); resize();

    function start() {
      play = true; miss = 0; likes = 0; dance = 0; flash = 0;
      m = { eyes: 0, mouth: 0, horn: 0, col: 0, ear: 0 };
      conf = []; hearts = [];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      say(MISSIONS[0].hint); hud(); beep(520, 0.1);
    }

    function cycle(key, arr, idx) {
      m[key] = (m[key] + 1) % arr.length;
      bounce[idx] = 1;
      beep(500 + idx * 40, 0.06);
      maybe();
    }
    document.getElementById("p0").onclick = function () { cycle("eyes", EYES, 0); };
    document.getElementById("p1").onclick = function () { cycle("mouth", MOUTH, 1); };
    document.getElementById("p2").onclick = function () { cycle("horn", HORNS, 2); };
    document.getElementById("p3").onclick = function () { cycle("col", COLS, 3); };
    document.getElementById("p4").onclick = function () { cycle("ear", EARS, 4); };

    document.getElementById("like").onclick = function () {
      dance = 1.8; likes++;
      var i;
      for (i = 0; i < 10; i++) hearts.push({ x: W * 0.5 + (Math.random() - 0.5) * 80, y: H * 0.4, vy: -40 - Math.random() * 40, life: 1 });
      say("Dance! SQUISH squash.");
      beep(880, 0.1); hud(); maybe();
    };
    document.getElementById("shot").onclick = function () {
      flash = 0.45;
      var i;
      for (i = 0; i < 18; i++) conf.push({ x: W * 0.5, y: H * 0.35, vx: (Math.random() - 0.5) * 220, vy: -80 - Math.random() * 80, life: 1, col: COLS[i % COLS.length] });
      say("Flash! What a pal.");
      beep(990, 0.08); maybe();
    };

    function maybe() {
      if (!MISSIONS[miss]) return;
      if (MISSIONS[miss].ok()) {
        miss++;
        beep(760, 0.1);
        if (miss >= MISSIONS.length) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("winP").textContent = "♡ " + likes + "  Five soft poses.";
          document.getElementById("win").classList.remove("off");
        } else {
          say("Cute! Next: " + MISSIONS[miss].hint);
          hud();
        }
      }
    }

    function update(dt) {
      t += dt;
      if (dance > 0) dance -= dt;
      if (flash > 0) flash -= dt;
      var i;
      for (i = 0; i < 5; i++) bounce[i] = Math.max(0, bounce[i] - dt * 2.2);
      for (i = hearts.length - 1; i >= 0; i--) {
        hearts[i].life -= dt; hearts[i].y += hearts[i].vy * dt;
        if (hearts[i].life <= 0) hearts.splice(i, 1);
      }
      for (i = conf.length - 1; i >= 0; i--) {
        conf[i].life -= dt; conf[i].x += conf[i].vx * dt; conf[i].y += conf[i].vy * dt; conf[i].vy += 160 * dt;
        if (conf[i].life <= 0) conf.splice(i, 1);
      }
    }

    function drawRoom() {
      var g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#6d28d9"); g.addColorStop(1, "#86efac");
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      x.fillStyle = "rgba(255,255,255,.12)";
      var i;
      for (i = 0; i < 8; i++) {
        x.beginPath(); x.arc((i * 90 + t * 10) % W, 40 + (i % 3) * 20, 16, 0, Math.PI * 2); x.fill();
      }
      x.fillStyle = "#fde68a";
      for (i = 0; i < 6; i++) {
        x.beginPath(); x.arc(20 + i * (W - 40) / 5, 18, 5, 0, Math.PI * 2); x.fill();
      }
    }

    function drawMonster() {
      var cx = W * 0.5, cy = H * 0.42;
      var sq = dance > 0 ? 1 + Math.sin(t * 10) * 0.08 : 1;
      var sy = dance > 0 ? 1 - Math.sin(t * 10) * 0.08 : 1;
      var bob = Math.sin(t * 3) * 6;
      x.save();
      x.translate(cx, cy + bob);
      x.scale(sq, sy);
      var col = COLS[m.col];
      if (m.ear === 0 || m.ear === 1) {
        x.fillStyle = col;
        x.beginPath(); x.ellipse(-70, -10, m.ear === 1 ? 16 : 22, m.ear === 1 ? 28 : 20, -0.4, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.ellipse(70, -10, m.ear === 1 ? 16 : 22, m.ear === 1 ? 28 : 20, 0.4, 0, Math.PI * 2); x.fill();
        x.fillStyle = "#fbcfe8";
        x.beginPath(); x.ellipse(-70, -10, 10, 10, 0, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.ellipse(70, -10, 10, 10, 0, 0, Math.PI * 2); x.fill();
      } else if (m.ear === 2) {
        x.fillStyle = col;
        x.beginPath(); x.arc(-62, -28, 10, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.arc(62, -28, 10, 0, Math.PI * 2); x.fill();
      } else {
        x.fillStyle = col;
        x.beginPath(); x.ellipse(-78, 10, 18, 12, 0, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.ellipse(78, 10, 18, 12, 0, 0, Math.PI * 2); x.fill();
      }
      if (m.horn === 1) {
        x.font = "40px serif"; x.textAlign = "center";
        x.fillText("🎀", 0, -78 + bounce[2] * -8);
      } else if (m.horn === 2) {
        x.fillStyle = "#f9a8d4";
        x.beginPath(); x.ellipse(-28, -78, 10, 16, -0.2, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.ellipse(28, -78, 10, 16, 0.2, 0, Math.PI * 2); x.fill();
      } else if (m.horn === 3) {
        x.font = "36px serif"; x.textAlign = "center";
        x.fillText("🌸", 0, -78 + bounce[2] * -8);
      } else if (m.horn === 4) {
        x.font = "36px serif"; x.textAlign = "center";
        x.fillText("🎩", 0, -78);
      }
      x.fillStyle = col;
      x.beginPath(); x.ellipse(0, 8, 78, 70, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = "rgba(255,255,255,.25)";
      x.beginPath(); x.ellipse(-18, -16, 22, 12, -0.3, 0, Math.PI * 2); x.fill();
      var ey = -8 + bounce[0] * -10;
      x.fillStyle = "#fff";
      x.beginPath(); x.ellipse(-22, ey, 16, 18, 0, 0, Math.PI * 2); x.fill();
      x.beginPath(); x.ellipse(22, ey, 16, 18, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = "#1e1b4b";
      if (m.eyes === 0) {
        x.beginPath(); x.arc(-22, ey, 6, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.arc(22, ey, 6, 0, Math.PI * 2); x.fill();
      } else if (m.eyes === 1) {
        x.beginPath(); x.arc(-22, ey + 2, 8, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.arc(22, ey + 2, 8, 0, Math.PI * 2); x.fill();
        x.fillStyle = "#fff";
        x.beginPath(); x.arc(-19, ey - 1, 3, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.arc(25, ey - 1, 3, 0, Math.PI * 2); x.fill();
      } else if (m.eyes === 2) {
        x.strokeStyle = "#1e1b4b"; x.lineWidth = 4;
        x.beginPath(); x.arc(-22, ey + 4, 8, Math.PI, 0); x.stroke();
        x.beginPath(); x.arc(22, ey + 4, 8, Math.PI, 0); x.stroke();
      } else if (m.eyes === 3) {
        x.fillRect(-30, ey, 16, 4); x.fillRect(14, ey, 16, 4);
      } else {
        x.strokeStyle = "#1e1b4b"; x.lineWidth = 4;
        x.beginPath(); x.moveTo(-30, ey - 6); x.lineTo(-14, ey + 6); x.moveTo(-30, ey + 6); x.lineTo(-14, ey - 6); x.stroke();
        x.beginPath(); x.arc(22, ey, 6, 0, Math.PI * 2); x.stroke();
      }
      var my = 36 + bounce[1] * -8;
      x.strokeStyle = "#9d174d"; x.fillStyle = "#fb7185"; x.lineWidth = 5; x.lineCap = "round";
      if (m.mouth === 0) {
        x.beginPath(); x.arc(0, my, 22, 0.15, Math.PI - 0.15); x.stroke();
      } else if (m.mouth === 1) {
        x.beginPath(); x.ellipse(0, my + 4, 24, 14, 0, 0, Math.PI); x.fill();
        x.fillStyle = "#fff";
        x.fillRect(-10, my - 2, 6, 8); x.fillRect(4, my - 2, 6, 8);
      } else if (m.mouth === 2) {
        x.beginPath(); x.arc(0, my, 10, 0, Math.PI * 2); x.stroke();
      } else if (m.mouth === 3) {
        x.beginPath(); x.moveTo(-16, my); x.quadraticCurveTo(0, my + 16, 16, my); x.stroke();
        x.fillStyle = "#1e1b4b";
        x.fillRect(-3, my + 2, 6, 5);
      } else {
        x.beginPath(); x.arc(0, my, 6, 0.2, Math.PI - 0.2); x.stroke();
      }
      x.restore();
      x.fillStyle = "#4c1d95"; x.font = "bold 18px Trebuchet MS"; x.textAlign = "center";
      x.fillText("soft pal", cx, cy + 110 + Math.sin(t * 2) * 2);
    }

    function draw() {
      drawRoom();
      drawMonster();
      var i;
      for (i = 0; i < hearts.length; i++) {
        x.globalAlpha = Math.max(0, hearts[i].life);
        x.font = "22px serif"; x.fillText("💗", hearts[i].x, hearts[i].y);
      }
      for (i = 0; i < conf.length; i++) {
        x.globalAlpha = Math.max(0, conf[i].life);
        x.fillStyle = conf[i].col;
        x.fillRect(conf[i].x, conf[i].y, 7, 5);
      }
      x.globalAlpha = 1;
      if (flash > 0) {
        x.fillStyle = "rgba(255,255,255," + (flash * 0.85) + ")";
        x.fillRect(0, 0, W, H);
      }
      x.fillStyle = "rgba(255,255,255,.2)";
      x.fillRect(16, 8, W - 32, 6);
      x.fillStyle = "#fde047";
      x.fillRect(16, 8, Math.min(W - 32, (miss / 5) * (W - 32)), 6);
    }

    
    var studio=[], stickers=[], giggle=[];
    var STICK=["⭐","🌈","🎵","🌼","💜","✨"];
    function flavorUpdate(dt){
      if(!studio.length){ var i; for(i=0;i<8;i++) studio.push({x:0.08+i*0.11,e:STICK[i%STICK.length],ph:i}); }
      var i; for(i=0;i<studio.length;i++) studio[i].ph+=dt;
      if(typeof dance!=="undefined" && dance>0 && Math.random()<dt*10) giggle.push({x:W*0.5+(Math.random()-0.5)*100,y:H*0.3,life:0.6,e:"ha"});
      for(i=giggle.length-1;i>=0;i--){ giggle[i].life-=dt; giggle[i].y-=20*dt; if(giggle[i].life<=0) giggle.splice(i,1); }
      if(typeof bounce!=="undefined"){ /* parts already bounce */ }
    }
    function flavorDraw(){
      var i;
      x.fillStyle="rgba(255,255,255,.12)";
      x.fillRect(10, H*0.62, W-20, 28);
      for(i=0;i<studio.length;i++){
        x.font="18px serif";
        x.fillText(studio[i].e, studio[i].x*W, H*0.64+Math.sin(studio[i].ph*3)*3);
      }
      for(i=0;i<giggle.length;i++){
        x.globalAlpha=Math.max(0,giggle[i].life);
        x.fillStyle="#fde68a"; x.font="bold 16px Trebuchet MS"; x.textAlign="center";
        x.fillText(giggle[i].e, giggle[i].x, giggle[i].y);
      }
      x.globalAlpha=1;
      if(typeof m!=="undefined"){
        x.fillStyle="#ddd6fe"; x.font="11px Trebuchet MS"; x.textAlign="left";
        x.fillText("eyes "+EYES[m.eyes]+"  mouth "+MOUTH[m.mouth]+"  horn "+HORNS[m.horn], 14, H-92);
      }
    }

    function extraWorld(){
      var _i,_a;
      _a=0.08+0.04*Math.sin(t+0); x.fillStyle='#86efac'; x.globalAlpha=_a;
      x.fillRect((0+t*8)%W, 20, 4, 3); /* cheek 0 */
      _a=0.08+0.04*Math.sin(t+1); x.fillStyle='#c4b5fd'; x.globalAlpha=_a;
      x.fillRect((47+t*8)%W, 51, 5, 4); /* studio 1 */
      _a=0.08+0.04*Math.sin(t+2); x.fillStyle='#fde68a'; x.globalAlpha=_a;
      x.fillRect((94+t*8)%W, 82, 6, 5); /* bulb 2 */
      _a=0.08+0.04*Math.sin(t+3); x.fillStyle='#fb7185'; x.globalAlpha=_a;
      x.fillRect((44+t*8)%W, 30, 7, 6); /* heart 3 */
      _a=0.08+0.04*Math.sin(t+4); x.fillStyle='#7c3aed'; x.globalAlpha=_a;
      x.fillRect((91+t*8)%W, 61, 8, 3); /* curtain 4 */
      _a=0.08+0.04*Math.sin(t+5); x.fillStyle='#86efac'; x.globalAlpha=_a;
      x.fillRect((41+t*8)%W, 92, 4, 4); /* cheek 5 */
      _a=0.08+0.04*Math.sin(t+6); x.fillStyle='#c4b5fd'; x.globalAlpha=_a;
      x.fillRect((88+t*8)%W, 40, 5, 5); /* studio 6 */
      _a=0.08+0.04*Math.sin(t+7); x.fillStyle='#fde68a'; x.globalAlpha=_a;
      x.fillRect((38+t*8)%W, 71, 6, 6); /* bulb 7 */
      _a=0.08+0.04*Math.sin(t+8); x.fillStyle='#fb7185'; x.globalAlpha=_a;
      x.fillRect((85+t*8)%W, 102, 7, 3); /* heart 8 */
      _a=0.08+0.04*Math.sin(t+9); x.fillStyle='#7c3aed'; x.globalAlpha=_a;
      x.fillRect((35+t*8)%W, 50, 8, 4); /* curtain 9 */
      _a=0.08+0.04*Math.sin(t+10); x.fillStyle='#86efac'; x.globalAlpha=_a;
      x.fillRect((82+t*8)%W, 81, 4, 5); /* cheek 10 */
      _a=0.08+0.04*Math.sin(t+11); x.fillStyle='#c4b5fd'; x.globalAlpha=_a;
      x.fillRect((32+t*8)%W, 29, 5, 6); /* studio 11 */
      _a=0.08+0.04*Math.sin(t+12); x.fillStyle='#fde68a'; x.globalAlpha=_a;
      x.fillRect((79+t*8)%W, 60, 6, 3); /* bulb 12 */
      _a=0.08+0.04*Math.sin(t+13); x.fillStyle='#fb7185'; x.globalAlpha=_a;
      x.fillRect((29+t*8)%W, 91, 7, 4); /* heart 13 */
      _a=0.08+0.04*Math.sin(t+14); x.fillStyle='#7c3aed'; x.globalAlpha=_a;
      x.fillRect((76+t*8)%W, 39, 8, 5); /* curtain 14 */
      _a=0.08+0.04*Math.sin(t+15); x.fillStyle='#86efac'; x.globalAlpha=_a;
      x.fillRect((26+t*8)%W, 70, 4, 6); /* cheek 15 */
      _a=0.08+0.04*Math.sin(t+16); x.fillStyle='#c4b5fd'; x.globalAlpha=_a;
      x.fillRect((73+t*8)%W, 101, 5, 3); /* studio 16 */
      _a=0.08+0.04*Math.sin(t+17); x.fillStyle='#fde68a'; x.globalAlpha=_a;
      x.fillRect((23+t*8)%W, 49, 6, 4); /* bulb 17 */
      _a=0.08+0.04*Math.sin(t+18); x.fillStyle='#fb7185'; x.globalAlpha=_a;
      x.fillRect((70+t*8)%W, 80, 7, 5); /* heart 18 */
      _a=0.08+0.04*Math.sin(t+19); x.fillStyle='#7c3aed'; x.globalAlpha=_a;
      x.fillRect((20+t*8)%W, 28, 8, 6); /* curtain 19 */
      _a=0.08+0.04*Math.sin(t+20); x.fillStyle='#86efac'; x.globalAlpha=_a;
