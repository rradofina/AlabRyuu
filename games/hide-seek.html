<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Hide and Seek</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#14532d}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fd">0/3</b></div>
  <div id="say">Find 3 hiding pals!</div>
  <div class="cover" id="title">
    <div class="hero">🔎</div>
    <h1>Hide and Seek</h1>
    <p>Tap bushes and trees. Find friends!</p>
    <button class="play" id="go">Seek</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🤗</div>
    <h1>Found you!</h1>
    <p>Three pals giggled.</p>
    <button class="play g" id="again">Seek again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, found = 0, stars = 0, spots = [];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-hide") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; found = 0;
      spots = [
        { e: "🌳", x: 0.22, y: 0.38, pal: "🦊", got: 0 },
        { e: "bush", x: 0.72, y: 0.42, pal: "🐰", got: 0 },
        { e: "🪨", x: 0.28, y: 0.64, pal: "", got: 0 },
        { e: "⛺", x: 0.70, y: 0.66, pal: "🦉", got: 0 }
      ];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("fd").textContent = "0/3";
      document.getElementById("say").textContent = "Find 3 hiding pals!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      spots.forEach(function (s) {
        var dx = kidPt(e, cv).x - s.x * W, dy = kidPt(e, cv).y - s.y * H;
        if (dx * dx + dy * dy < 60 * 60) {
          if (s.got) return;
          if (s.pal) {
            s.got = 1; found++; stars++;
            try { localStorage.setItem("alabryuu-hide", JSON.stringify({ stars: stars })); } catch (err) {}
            document.getElementById("fd").textContent = found + "/3";
            document.getElementById("say").textContent = "Hi " + s.pal + "!";
            if (found >= 3) { play = false; document.getElementById("win").classList.remove("off"); }
          } else document.getElementById("say").textContent = "Nobody here. Keep looking!";
        }
      });
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#4ade80"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#86efac"; x.fillRect(0, 0, W, H * 0.28);
      em("☀️", W * 0.84, 80, 56);
      spots.forEach(function (s) {
        var px = s.x * W, py = s.y * H;
        if (s.got) em(s.pal, px, py - 10, 72);
        else em(s.e === "bush" ? "🌿" : s.e, px, py, 80);
      });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
