<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Busy Bees</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#713f12;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;padding:54px 8px 20px;text-align:center;background:linear-gradient(#7dd3fc 0 28%,#86efac 28% 70%,#65a30d 70%)}
    body.wind{background:linear-gradient(#93c5fd 0 28%,#a3e635 28% 70%,#4d7c0f 70%)}
    body.storm{background:linear-gradient(#64748b 0 28%,#84cc16 28% 70%,#365314 70%)}
    .home{position:fixed;top:12px;left:12px;z-index:12;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.32);padding:8px 14px;border-radius:999px}
    h1{font-size:clamp(26px,7vw,40px);color:#854d0e;text-shadow:0 2px 0 #fde047}
    .hud{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px}
    .chip{background:rgba(255,255,255,.88);padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px}
    .meadow{
      width:min(380px,96vw);margin:8px auto;display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:stretch;
    }
    .field{
      position:relative;min-height:280px;border-radius:24px;
      background:
        radial-gradient(circle at 20% 80%,#bbf7d0 0 20%,transparent 21%),
        linear-gradient(#86efac,#4ade80);
      box-shadow:0 8px 0 #365314;overflow:hidden;
    }
    .flower{
      position:absolute;left:50%;top:28%;transform:translateX(-50%);
      font-size:88px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12));
    }
    .pollen{position:absolute;width:10px;height:10px;border-radius:50%;background:#fde047;pointer-events:none;opacity:.9;animation:dot .7s ease forwards}
    @keyframes dot{to{opacity:0;transform:scale(.3)}}
    .flyer{
      position:absolute;font-size:36px;left:12px;bottom:16px;transition:left .7s ease,top .7s ease;
      pointer-events:none;z-index:3;
    }
    .hive{
      background:linear-gradient(#f59e0b,#b45309);border-radius:18px;padding:8px 6px;
      box-shadow:0 8px 0 #78350f;
    }
    .hive h3{color:#fff;font-size:13px;margin-bottom:6px}
    .comb{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
    .cell{
      aspect-ratio:1;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
      background:#fde68a;opacity:.35;
    }
    .cell.full{opacity:1;background:#fbbf24;box-shadow:0 0 6px #fde047}
    .branch{
      display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px auto 0;max-width:380px;
    }
    .bee{
      width:76px;height:76px;border-radius:50%;font-size:36px;box-shadow:0 6px 0 #ca8a04;
    }
    .bee:active{transform:translateY(3px)}
    body.wind .bee,body.storm .bee{animation:wobble 1.1s ease-in-out infinite}
    body.storm .bee{animation-duration:.7s}
    @keyframes wobble{25%{transform:rotate(-10deg) translateX(-3px)}75%{transform:rotate(10deg) translateX(3px)}}
    .msg{font-weight:800;margin-top:8px;min-height:1.3em;font-size:20px}
    .banner{
      display:none;width:min(340px,92vw);margin:12px auto 0;padding:16px;
      background:#fef3c7;border-radius:20px;box-shadow:0 0 0 6px #f59e0b,0 10px 0 #b45309;color:#78350f;
    }
    .banner.on{display:block}
    .acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
    .play{background:#ffd166;color:#3b2100;font-weight:800;font-size:22px;padding:12px 20px;border-radius:999px;box-shadow:0 6px 0 #e09f1f}
    .play.next{background:#86efac;color:#14532d;box-shadow:0 6px 0 #16a34a}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <h1>Busy Bees</h1>
  <div class="hud">
    <span class="chip" id="mchip">Meadow 1</span>
    <span class="chip" id="wx">☀️ Calm</span>
    <span class="chip" id="stars">⭐ 0</span>
  </div>
  <div class="meadow">
    <div class="field" id="field">
      <div class="flower" id="flower">🌸</div>
      <div class="flyer" id="flyer" hidden>🐝</div>
    </div>
    <div class="hive">
      <h3>🍯 Hive</h3>
      <div class="comb" id="comb"></div>
    </div>
  </div>
  <div class="branch" id="branch"></div>
  <p class="msg" id="msg">Send the matching bee!</p>
  <div class="banner" id="banner">
    <div style="font-size:42px">🍯</div>
    <h2 id="btitle">Honey time!</h2>
    <p id="bsub"></p>
    <div class="acts">
      <button class="play next" id="nextBtn">Next</button>
      <button class="play" id="againBtn">Play again</button>
    </div>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var colors=[
      {e:"🌸",n:"pink",c:"#f9a8d4"},{e:"🌻",n:"yellow",c:"#fde047"},
      {e:"🌼",n:"white",c:"#f8fafc"},{e:"🌺",n:"red",c:"#f87171"},{e:"🪻",n:"purple",c:"#c4b5fd"}
    ];
    var meadows=[
      {name:"Sunny meadow",wx:"☀️ Calm",cls:"",need:4,bees:3},
      {name:"Windy hill",wx:"💨 Wind",cls:"wind",need:6,bees:4},
      {name:"Storm garden",wx:"🌬️ Gusts",cls:"storm",need:8,bees:5}
    ];
    var lv=0,honey=0,got=0,need=null,stars=0,busy=false,cells=12;
    function mkComb(){
      var c=document.getElementById("comb");c.innerHTML="";
      for(var i=0;i<cells;i++){var d=document.createElement("div");d.className="cell"+(i<honey?" full":"");c.appendChild(d);}
    }
    function mkBees(){
      var M=meadows[lv],box=document.getElementById("branch");box.innerHTML="";
      colors.slice(0,M.bees).forEach(function(col){
        var b=document.createElement("button");b.className="bee";b.textContent="🐝";b.style.background=col.c;
        b.onclick=function(){send(col,b);};
        box.appendChild(b);
      });
    }
    function nextFlower(){
      var M=meadows[lv];
      need=colors[Math.floor(Math.random()*M.bees)];
      document.getElementById("flower").textContent=need.e;
      document.getElementById("msg").textContent="The "+need.n+" flower!";
    }
    function load(){
      var M=meadows[lv];
      document.body.className=M.cls;
      document.getElementById("mchip").textContent=M.name;
      document.getElementById("wx").textContent=M.wx;
      document.getElementById("banner").classList.remove("on");
      document.getElementById("nextBtn").style.display=lv<2?"":"none";
      got=0;busy=false;if(lv===0)honey=0;
      mkBees();mkComb();nextFlower();
    }
    function send(col,btn){
      if(busy)return;
      if(col.n!==need.n){
        document.getElementById("msg").textContent="This flower wants "+need.n+".";
        beep(180,.1);return;
      }
      busy=true;
      var field=document.getElementById("field"),fl=document.getElementById("flyer");
      var br=btn.getBoundingClientRect(),fr=field.getBoundingClientRect();
      var x0=br.left-fr.left,y0=br.top-fr.top;
      fl.hidden=false;fl.textContent="🐝";
      fl.style.left=x0+"px";fl.style.top=y0+"px";fl.style.bottom="auto";
      for(var i=1;i<=4;i++){
        (function(k){
          setTimeout(function(){
            var d=document.createElement("div");d.className="pollen";
            d.style.left=(x0+(field.clientWidth*0.42-x0)*k/4)+"px";
            d.style.top=(y0+(field.clientHeight*0.30-y0)*k/4)+"px";
            field.appendChild(d);
            setTimeout(function(){d.remove();},720);
          },k*90);
        })(i);
      }
      beep(620,.08);
      requestAnimationFrame(function(){fl.style.left="42%";fl.style.top="30%";});
      setTimeout(function(){
        fl.hidden=true;fl.style.left="12px";fl.style.top="";fl.style.bottom="16px";
        honey++;got++;stars++;mkComb();beep(760,.1);
        document.getElementById("stars").textContent="⭐ "+stars;
        if(got>=meadows[lv].need){
          document.getElementById("btitle").textContent=lv<2?"Comb growing!":"Honey time!";
          document.getElementById("bsub").textContent="The hive is happy · ⭐ "+stars;
          document.getElementById("banner").classList.add("on");beep(940,.2);busy=false;
        }else{busy=false;nextFlower();}
      },720);
    }
    document.getElementById("nextBtn").onclick=function(){if(lv<2){lv++;load();}};
    document.getElementById("againBtn").onclick=function(){lv=0;stars=0;honey=0;got=0;document.getElementById("stars").textContent="⭐ 0";load();};
    load();
  </script>
</body>
</html>
