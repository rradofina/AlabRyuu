<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Busy Bees</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>html,body{background:#fde047}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="nv">🍯 0/6</b></div>
  <div id="say">Tap the matching flower. Then the hive!</div>
  <div class="cover" id="title">
    <div class="hero">🐝</div>
    <h1>Busy Bees</h1>
    <p>Match the flower color. Take nectar home!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🍯</div>
    <h1>Honey time!</h1>
    <p>Six trips to the hive.</p>
    <button class="play g" id="again">Fly again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, n = 0, want = "🌸", holding = 0;
    var FLOW = ["🌸", "🌼", "🌺"];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function spots() {
      return [
        { e: FLOW[0], x: 0.22, y: 0.62 },
        { e: FLOW[1], x: 0.50, y: 0.68 },
        { e: FLOW[2], x: 0.78, y: 0.60 }
      ];
    }
    function start() {
      play = true; n = 0; holding = 0; want = FLOW[(Math.random() * 3) | 0];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("nv").textContent = "🍯 0/6";
      document.getElementById("say").textContent = "Tap " + want + " then the hive!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var hiveX = W * 0.78, hiveY = H * 0.28;
      var hx = e.clientX - hiveX, hy = e.clientY - hiveY;
      if (hx * hx + hy * hy < 55 * 55) {
        if (holding) {
          holding = 0; n++;
          document.getElementById("nv").textContent = "🍯 " + n + "/6";
          if (n >= 6) { play = false; document.getElementById("win").classList.remove("off"); }
          else {
            want = FLOW[(Math.random() * 3) | 0];
            document.getElementById("say").textContent = "Now " + want + "!";
          }
        } else document.getElementById("say").textContent = "Get nectar first. Tap " + want;
        return;
      }
      spots().forEach(function (s) {
        var dx = e.clientX - s.x * W, dy = e.clientY - s.y * H;
        if (dx * dx + dy * dy < 50 * 50) {
          if (s.e === want) { holding = 1; document.getElementById("say").textContent = "Home to the hive!"; }
          else document.getElementById("say").textContent = "Wrong flower. Want " + want;
        }
      });
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#86efac"; x.fillRect(0, 0, W, H);
      em("☀️", 50, 80, 48);
      em("🍯", W * 0.78, H * 0.28, 80);
      spots().forEach(function (s) { em(s.e, s.x * W, s.y * H, 72); });
      em("🐝", W * (holding ? 0.55 : 0.28), H * 0.40 + Math.sin(t * 4) * 8, 64);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
