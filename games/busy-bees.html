<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Busy Bees</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#fde047}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="nv">🍯 0/4</b></div>
  <div id="say">Tap the matching flower. Then the hive!</div>
  <div class="cover" id="title">
    <div class="hero">🐝</div>
    <h1>Busy Bees</h1>
    <p>Match the flower color. Take nectar home!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🍯</div>
    <h1>Honey time!</h1>
    <p>Four trips to the hive.</p>
    <button class="play g" id="again">Fly again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, n = 0, want = "🌸", holding = 0;
    var FLOW = ["🌸", "🌼", "🌺"];
    function em(ch, px, py, s) { kidEm(x, ch, px, py, s); }
    function resize() { var b = kidFit(cv, x); W = b.W; H = b.H; }
    addEventListener("resize", resize); resize();
    function spots() {
      return [
        { e: FLOW[0], x: 0.22, y: 0.62 },
        { e: FLOW[1], x: 0.50, y: 0.68 },
        { e: FLOW[2], x: 0.78, y: 0.60 }
      ];
    }
    function start() {
      play = true; n = 0; holding = 0; want = FLOW[(Math.random() * 3) | 0];
      kidBegin();
      document.getElementById("nv").textContent = "🍯 0/4";
      document.getElementById("say").textContent = "Tap " + want + " then the hive!";
    }
    kidBind(start);
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var hiveX = W * 0.78, hiveY = H * 0.28;
      var hx = kidPt(e, cv).x - hiveX, hy = kidPt(e, cv).y - hiveY;
      if (hx * hx + hy * hy < 130 * 130) {
        if (holding) {
          holding = 0; n++;
          document.getElementById("nv").textContent = "🍯 " + n + "/4";
          kidTap("🍯", n >= 4 ? "Honey time!" : "Now " + want + "!", hiveX, hiveY, 560);
          if (n >= 4) { play = false; kidFinish(); }
          else {
            want = FLOW[(Math.random() * 3) | 0];
            kidPing("Now " + want + "!");
          }
        } else kidTap("🍯", "Get nectar first. Tap " + want, hiveX, hiveY, 240);
        return;
      }
      var p = kidPt(e, cv), hit = null, best = 130 * 130, i, list = spots();
      for (i = 0; i < list.length; i++) {
        var dx = p.x - list[i].x * W, dy = p.y - list[i].y * H, d = dx * dx + dy * dy;
        if (d < best) { best = d; hit = list[i]; }
      }
      if (!hit) { kidMiss(want, "Tap " + want + "!", p.x, p.y); return; }
      if (hit.e !== want) { kidMiss(want, "Not that flower. Tap " + want + "!", p.x, p.y); return; }
      holding = 1; kidTap(hit.e, "Home to the hive!", hit.x * innerWidth, hit.y * innerHeight, 500);
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#86efac"; x.fillRect(0, 0, W, H);
      em("☀️", 50, 80, 48);
      em("🍯", W * 0.78, H * 0.28, 96);
      spots().forEach(function (s) { em(s.e, s.x * W, s.y * H, 92); });
      em("🐝", W * (holding ? 0.55 : 0.28), H * 0.40 + Math.sin(t * 4) * 8, 80);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
