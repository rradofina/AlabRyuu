<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Fish Friends</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>html,body{background:#0369a1}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fd">🍞 0/6</b></div>
  <div id="say">Tap the water. Drop food!</div>
  <div class="cover" id="title">
    <div class="hero">🐟</div>
    <h1>Fish Friends</h1>
    <p>Tap to drop food. Feed 6 fish!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🐠</div>
    <h1>Full tummies!</h1>
    <p>All the fish said yum.</p>
    <button class="play g" id="again">Feed again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, fed = 0;
    var fish = [], crumbs = [];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; fed = 0; crumbs = [];
      fish = [
        { e: "🐟", x: 0.2, y: 0.4, ate: 0 },
        { e: "🐠", x: 0.5, y: 0.55, ate: 0 },
        { e: "🐡", x: 0.75, y: 0.38, ate: 0 },
        { e: "🐟", x: 0.35, y: 0.7, ate: 0 }
      ];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("fd").textContent = "🍞 0/6";
      document.getElementById("say").textContent = "Tap the water. Drop food!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      crumbs.push({ x: e.clientX, y: e.clientY, life: 4 });
    });
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      x.fillStyle = "#0ea5e9"; x.fillRect(0, 0, W, H);
      em("🪸", 50, H * 0.8, 56); em("🪸", W - 40, H * 0.75, 64);
      if (play) {
        crumbs.forEach(function (c) { c.y += 30 * dt; c.life -= dt; });
        crumbs = crumbs.filter(function (c) { return c.life > 0 && c.y < H; });
        fish.forEach(function (f, i) {
          f.x += Math.sin(t + i) * 0.0015;
          crumbs.forEach(function (c) {
            if (f.ate) return;
            var dx = c.x - f.x * W, dy = c.y - f.y * H;
            if (dx * dx + dy * dy < 70 * 70) {
              f.x = c.x / W; f.y = c.y / H;
              c.life = 0; f.ate = 1; fed++;
              document.getElementById("fd").textContent = "🍞 " + fed + "/6";
              document.getElementById("say").textContent = "Yum " + f.e + "!";
              if (fed >= 6) {
                play = false;
                document.getElementById("win").classList.remove("off");
              } else {
                setTimeout(function () { f.ate = 0; }, 400);
              }
            }
          });
        });
      }
      crumbs.forEach(function (c) { em("🍞", c.x, c.y, 40); });
      fish.forEach(function (f) { em(f.e, f.x * W, f.y * H + Math.sin(t * 2) * 6, 72); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
