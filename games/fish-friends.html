<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Fish Friends</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#0369a1}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fd">🍞 0/4</b></div>
  <div id="say">Tap a fish to feed it!</div>
  <div class="cover" id="title">
    <div class="hero">🐟</div>
    <h1>Fish Friends</h1>
    <p>Tap a fish. Feed 4 friends!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🐠</div>
    <h1>Full tummies!</h1>
    <p>All the fish said yum.</p>
    <button class="play g" id="again">Feed again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, fed = 0;
    var fish = [], crumbs = [];
    function em(ch, px, py, s) { kidEm(x, ch, px, py, s); }
    function resize() { var b = kidFit(cv, x); W = b.W; H = b.H; }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; fed = 0; crumbs = [];
      fish = [
        { e: "🐟", x: 0.2, y: 0.4, ate: 0 },
        { e: "🐠", x: 0.5, y: 0.55, ate: 0 },
        { e: "🐡", x: 0.75, y: 0.38, ate: 0 },
        { e: "🐟", x: 0.35, y: 0.7, ate: 0 }
      ];
      kidBegin();
      document.getElementById("fd").textContent = "🍞 0/4";
      document.getElementById("say").textContent = "Tap a fish!";
    }
    kidBind(start);
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var p = kidPt(e, cv), best = null, bestD = 1e15, i;
      for (i = 0; i < fish.length; i++) {
        if (fish[i].ate) continue;
        var dx = p.x - fish[i].x * W, dy = p.y - fish[i].y * H, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = fish[i]; }
      }
      if (!best) return;
      best.ate = 1; fed++;
      document.getElementById("fd").textContent = "🍞 " + fed + "/4";
      document.getElementById("say").textContent = "Yum " + best.e + "!";
      kidTap("🍞", "Yum!  " + fed + "/4", best.x * W, best.y * H, 480);
      kidBoom(best.e, best.x * W, best.y * H);
      if (fed >= 4) { play = false; kidFinish(); }
      else setTimeout(function () { best.ate = 0; }, 280);
    });
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      x.fillStyle = "#0ea5e9"; x.fillRect(0, 0, W, H);
      em("🪸", 50, H * 0.8, 56); em("🪸", W - 40, H * 0.75, 64);
      if (play) {
        crumbs.forEach(function (c) { c.y += 30 * dt; c.life -= dt; });
        crumbs = crumbs.filter(function (c) { return c.life > 0 && c.y < H; });
        fish.forEach(function (f, i) {
          f.x += Math.sin(t + i) * 0.0015;
          crumbs.forEach(function (c) {
            if (f.ate) return;
            var dx = c.x - f.x * W, dy = c.y - f.y * H;
            if (dx * dx + dy * dy < 70 * 70) {
              f.x = c.x / W; f.y = c.y / H;
              c.life = 0; f.ate = 1; fed++;
              document.getElementById("fd").textContent = "🍞 " + fed + "/6";
              document.getElementById("say").textContent = "Yum " + f.e + "!";
              kidBoom(f.e, f.x * W, f.y * H);
              if (fed >= 6) {
                play = false;
                kidFinish();
              } else {
                setTimeout(function () { f.ate = 0; }, 400);
              }
            }
          });
        });
      }
      crumbs.forEach(function (c) { em("🍞", c.x, c.y, 52); });
      fish.forEach(function (f) { em(f.e, f.x * W, f.y * H + Math.sin(t * 2) * 6, 88); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
