<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Fish Friends</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      background: #1c1917; color: #ecfeff;
      touch-action: manipulation; user-select: none;
    }
    button {
      background: transparent; border: 0; appearance: none; -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer;
    }
    .home {
      position: fixed; top: 12px; left: 12px; z-index: 12;
      color: #fff; text-decoration: none; font-weight: 800; font-size: 18px;
      background: rgba(0,0,0,.4); padding: 8px 14px; border-radius: 999px;
    }
    #hud {
      position: fixed; top: 12px; right: 12px; z-index: 12;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    }
    #hud span {
      font-weight: 800; background: rgba(255,255,255,.18);
      padding: 6px 12px; border-radius: 16px; font-size: 15px;
    }
    #room {
      position: fixed; inset: 0;
      background: linear-gradient(#44403c 0 48px, #292524 48px);
    }
    #lamp {
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      z-index: 4; font-size: 28px; font-weight: 800;
      background: #fde68a; color: #3b2100; padding: 6px 16px; border-radius: 999px;
    }
    #frame {
      position: absolute; left: 4%; right: 4%; top: 56px; bottom: 118px;
      border: 14px solid #a8a29e;
      border-radius: 18px;
      box-shadow:
        inset 0 0 0 6px #e7e5e4,
        inset 0 0 0 10px rgba(125,211,252,.35),
        0 12px 0 #44403c;
      overflow: hidden;
      background: linear-gradient(#7dd3fc, #0e7490 62%, #155e75);
    }
    #frame.night {
      background: linear-gradient(#164e63, #0f172a 70%, #082f49);
    }
    #frame.night::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 0%, rgba(253,230,138,.22), transparent 55%);
    }
    #shine {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(115deg, rgba(255,255,255,.22) 0 12%, transparent 18% 100%);
    }
    #gravel {
      position: absolute; left: 0; right: 0; bottom: 0; height: 52px;
      background:
        radial-gradient(circle at 10% 60%, #d6d3d1 8px, transparent 9px),
        radial-gradient(circle at 28% 80%, #a8a29e 7px, transparent 8px),
        radial-gradient(circle at 46% 50%, #e7e5e4 9px, transparent 10px),
        radial-gradient(circle at 64% 75%, #78716c 8px, transparent 9px),
        radial-gradient(circle at 82% 55%, #d6d3d1 8px, transparent 9px),
        linear-gradient(#ca8a04, #a16207);
    }
    #plants { position: absolute; inset: 0; pointer-events: none; }
    .plant {
      position: absolute; bottom: 40px; font-size: 42px;
    }
    #decoLayer { position: absolute; inset: 0; pointer-events: none; }
    .deco {
      position: absolute; font-size: 40px; pointer-events: none;
    }
    .fish {
      position: absolute; width: 76px; height: 76px; font-size: 52px;
      display: grid; place-items: center;
    }
    .fish.hungry::after {
      content: "Yum?"; position: absolute; left: 50%; top: -8px;
      transform: translateX(-50%); font-size: 13px; font-weight: 800;
      background: #fff; color: #0e7490; padding: 3px 8px; border-radius: 10px;
      white-space: nowrap; box-shadow: 0 3px 0 #0f766e;
    }
    .fish.gold { filter: drop-shadow(0 0 10px #facc15); }
    .fish.gold.hungry::after { content: "Gold!"; color: #a16207; }
    .pop { position: absolute; font-size: 24px; pointer-events: none; }
    #tray {
      position: fixed; left: 0; right: 0; bottom: 0; height: 110px; z-index: 5;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: #44403c; border-top: 6px solid #78716c;
    }
    #tray p { font-weight: 800; font-size: 14px; color: #e7e5e4; width: 70px; }
    #tray button {
      width: 72px; height: 72px; border-radius: 18px; background: #292524;
      font-size: 36px; box-shadow: 0 6px 0 #1c1917;
    }
    #tray button:active { transform: translateY(3px); box-shadow: 0 3px 0 #1c1917; }
    .cover {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; z-index: 20; gap: 10px; text-align: center; padding: 24px;
      background: linear-gradient(#155e75, #0e7490 40%, #fde047);
    }
    .cover.off { display: none; }
    .cover h1 { font-size: clamp(34px, 9vw, 52px); }
    .cover p { font-weight: 800; font-size: 18px; max-width: 320px; color: #082f49; }
    .play {
      background: #ffd166; color: #3b2100; font-weight: 800; font-size: 28px;
      padding: 14px 32px; border-radius: 999px; box-shadow: 0 7px 0 #e09f1f;
    }
    .play:active { transform: translateY(4px); box-shadow: 0 3px 0 #e09f1f; }
    .starrow { font-size: 36px; letter-spacing: 4px; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud">
    <span id="score">Feeds 0 / 5</span>
    <span id="tankHud">Tank 1 / 3</span>
  </div>
  <div id="room">
    <button id="lamp" type="button">☀️ Day</button>
    <div id="frame">
      <div id="shine"></div>
      <div id="plants">
        <div class="plant" style="left:8%">🌿</div>
        <div class="plant" style="left:22%;font-size:34px">🌱</div>
        <div class="plant" style="right:10%">🌿</div>
      </div>
      <div id="gravel"></div>
      <div id="decoLayer"></div>
    </div>
  </div>
  <div id="tray">
    <p>Tap to place</p>
    <button type="button" data-e="🌿">🌿</button>
    <button type="button" data-e="🏰">🏰</button>
    <button type="button" data-e="🪨">🪨</button>
  </div>
  <div class="cover" id="start">
    <div style="font-size:72px">🐠</div>
    <h1>Fish Friends</h1>
    <p>Tap the hungry fish. Decorate the tank. Night light too!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="mid">
    <div style="font-size:64px">🫧</div>
    <h1 id="midTitle">Full tank!</h1>
    <p id="midLine"></p>
    <div class="starrow" id="midStars"></div>
    <button class="play" id="next">Next tank</button>
  </div>
  <div class="cover off" id="win">
    <div style="font-size:72px">🐠</div>
    <h1>Full tummies!</h1>
    <p>Every fish is happy.</p>
    <div class="starrow" id="winStars">⭐⭐⭐</div>
    <button class="play" id="again">Play again</button>
  </div>
  <script>
    function beep(f, d) {
      try {
        var c = window._ac || (window._ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = c.createOscillator(), g = c.createGain();
        o.frequency.value = f; g.gain.value = 0.1;
        o.connect(g); g.connect(c.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
        o.stop(c.currentTime + d);
      } catch (e) {}
    }
    var TANKS = [
      { n: 3, need: 5, gold: false },
      { n: 5, need: 8, gold: true },
      { n: 6, need: 10, gold: true }
    ];
    var KINDS = ["🐟", "🐠", "🐡", "🐬", "🦈", "🐙"];
    var tank = 0, feeds = 0, need = 5, hungryI = 0, fish = [], play = false;
    var night = false, goldFeeds = 0, placed = 0;
    var frame = document.getElementById("frame");
    var decoLayer = document.getElementById("decoLayer");

    function hud() {
      document.getElementById("score").textContent = "Feeds " + feeds + " / " + need;
      document.getElementById("tankHud").textContent = "Tank " + (tank + 1) + " / 3";
    }
    function rect() {
      return frame.getBoundingClientRect();
    }
    function clearFish() {
      fish.forEach(function (f) { f.el.remove(); });
      fish = [];
    }
    function makeFish(i, gold) {
      var el = document.createElement("button");
      el.className = "fish" + (gold ? " gold" : "");
      el.innerHTML = '<span class="face">' + (gold ? "🌟🐠" : KINDS[i % KINDS.length]) + "</span>";
      frame.appendChild(el);
      var r = rect();
      var f = {
        el: el, gold: gold,
        x: 20 + Math.random() * Math.max(40, r.width - 100),
        y: 40 + Math.random() * Math.max(40, r.height - 140),
        vx: (Math.random() < 0.5 ? -1 : 1) * (0.7 + Math.random() * 1.1),
        vy: (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.6)
      };
      el.onclick = function () {
        if (!play) return;
        if (fish[hungryI] !== f) {
          el.style.transform = "scale(.88)";
          setTimeout(function () { el.style.transform = ""; }, 140);
          beep(200, 0.08);
          return;
        }
        var add = f.gold ? 2 : 1;
        feeds += add;
        if (f.gold) goldFeeds++;
        var b = document.createElement("div");
        b.className = "pop"; b.textContent = f.gold ? "✨+2" : "🫧";
        b.style.left = f.x + "px"; b.style.top = f.y + "px";
        frame.appendChild(b);
        setTimeout(function () { b.remove(); }, 500);
        beep(f.gold ? 880 : 700, 0.09);
        hud();
        pickHungry();
        if (feeds >= need) endTank();
      };
      fish.push(f);
    }
    function startTank() {
      clearFish();
      var t = TANKS[tank];
      need = t.need; feeds = 0;
      var goldAt = t.gold ? Math.floor(Math.random() * t.n) : -1;
      for (var i = 0; i < t.n; i++) makeFish(i, i === goldAt);
      pickHungry();
      hud();
      play = true;
    }
    function pickHungry() {
      if (!fish.length) return;
      var opts = [];
      for (var i = 0; i < fish.length; i++) if (i !== hungryI) opts.push(i);
      if (!opts.length) opts = [0];
      hungryI = opts[Math.floor(Math.random() * opts.length)];
      fish.forEach(function (f, i) { f.el.classList.toggle("hungry", i === hungryI); });
    }
    function endTank() {
      play = false;
      var stars = 1 + (placed >= 2 ? 1 : 0) + (goldFeeds > 0 || tank === 0 ? 1 : 0);
      if (stars > 3) stars = 3;
      var row = "⭐".repeat(stars) + "☆".repeat(3 - stars);
      if (tank >= 2) {
        document.getElementById("winStars").textContent = row;
        document.getElementById("win").classList.remove("off");
        beep(900, 0.2);
      } else {
        document.getElementById("midTitle").textContent = "Tank " + (tank + 1) + " full!";
        document.getElementById("midLine").textContent = "More friends next.";
        document.getElementById("midStars").textContent = row;
        document.getElementById("mid").classList.remove("off");
        beep(820, 0.16);
      }
    }
    document.getElementById("lamp").onclick = function () {
      night = !night;
      frame.classList.toggle("night", night);
      this.textContent = night ? "🌙 Night" : "☀️ Day";
      beep(night ? 300 : 520, 0.1);
    };
    document.querySelectorAll("#tray button").forEach(function (b) {
      b.onclick = function () {
        var r = rect();
        var d = document.createElement("div");
        d.className = "deco";
        d.textContent = b.dataset.e;
        d.style.left = (12 + Math.random() * Math.max(20, r.width - 80)) + "px";
        d.style.bottom = (36 + Math.random() * 40) + "px";
        decoLayer.appendChild(d);
        placed++;
        beep(640, 0.08);
      };
    });
    function loop() {
      var r = rect();
      var maxX = Math.max(30, r.width - 90), maxY = Math.max(40, r.height - 110);
      fish.forEach(function (f) {
        f.x += f.vx; f.y += f.vy;
        if (f.x < 8 || f.x > maxX) f.vx *= -1;
        if (f.y < 28 || f.y > maxY) f.vy *= -1;
        f.el.style.left = f.x + "px"; f.el.style.top = f.y + "px";
        var face = f.el.querySelector(".face");
        if (face) face.style.transform = f.vx < 0 ? "scaleX(-1)" : "";
      });
      requestAnimationFrame(loop);
    }
    document.getElementById("go").onclick = function () {
      document.getElementById("start").classList.add("off");
      tank = 0; goldFeeds = 0; placed = 0;
      decoLayer.innerHTML = "";
      startTank(); beep(520, 0.1);
    };
    document.getElementById("next").onclick = function () {
      document.getElementById("mid").classList.add("off");
      tank++; startTank(); beep(600, 0.1);
    };
    document.getElementById("again").onclick = function () {
      document.getElementById("win").classList.add("off");
      document.getElementById("start").classList.remove("off");
    };
    loop();
  </script>
</body>
</html>
