<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Rhythm Band</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      background: #1a0a18; color: #fff8e7;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    button {
      background: transparent; border: 0; appearance: none; -webkit-appearance: none;
      font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .home {
      position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; z-index: 12;
      color: #fff; text-decoration: none; font-weight: 800; font-size: 17px;
      background: rgba(60, 10, 20, .65); padding: 8px 14px; border-radius: 999px;
      border: 2px solid #f4c77a; touch-action: manipulation;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 8;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
      pointer-events: none;
    }
    #hud b {
      display: block; font-weight: 800; font-size: 14px;
      background: linear-gradient(#6b1230, #3b0a1a);
      color: #ffe8a3; padding: 7px 14px; border-radius: 8px 18px 8px 18px;
      border: 2px solid #f4c77a; box-shadow: 0 3px 0 #7a4a12;
      min-width: 108px; text-align: center;
    }
    #hud #st { background: linear-gradient(#7a4a12, #4a2c08); color: #fff3c4; }
    #say {
      position: fixed; left: 50%; top: 62px; transform: translateX(-50%);
      z-index: 8; font-weight: 800; font-size: 18px; color: #ffe8a3;
      text-shadow: 0 3px 0 #3b0a1a; pointer-events: none; text-align: center; width: 92%;
    }
    #replay {
      position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%); z-index: 8; display: none;
      background: #fde68a; color: #3b2100; font-weight: 800; font-size: 18px;
      padding: 12px 22px; border-radius: 999px; box-shadow: 0 6px 0 #b45309;
    }
    #replay.on { display: block; }
    .cover {
      position: fixed; inset: 0; z-index: 9;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      text-align: center; gap: 8px; padding: 20px 20px 56px; pointer-events: none;
    }
    .cover.off { display: none; }
    .cover h1 { font-size: clamp(32px, 8vw, 48px); color: #fff; text-shadow: 0 4px 0 #4a0518; }
    .cover p { font-weight: 800; color: #fde68a; }
    .btn {
      pointer-events: auto; background: #ffd166; color: #3b2100;
      font-weight: 800; font-size: 24px; padding: 14px 28px; border-radius: 999px;
      box-shadow: 0 7px 0 #e09f1f;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 4px 0 #e09f1f; }
    .btn.g { background: #f9a8d4; color: #4a044e; box-shadow: 0 7px 0 #9d174d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="sg">Sunny clap</b><b id="st">Stars 0</b></div>
  <div id="say">Watch. Then tap!</div>
  <button id="replay" type="button">Hear it again</button>
  <div class="cover" id="title">
    <h1>Rhythm Band</h1>
    <p>Watch the band.<br>Tap the same pads!</p>
    <button class="btn" id="go" type="button">Play</button>
  </div>
  <div class="cover off" id="win">
    <h1>Encore!</h1>
    <p id="winP">Five songs played.</p>
    <button class="btn g" id="again" type="button">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), g = cv.getContext("2d");
    var W, H, last = 0, t = 0, mode = "title", stars = 0, song = 0, cheer = 0.4;
    var pads = [], seq = [], input = [], phase = "show", showI = 0, showT = 0;
    var notes = [], crowd = [], pops = [];
    var SONGS = [
      { n: "Sunny clap", pads: 3, start: 2, grow: 3, freq: [196, 523, 330] },
      { n: "Bongo walk", pads: 3, start: 3, grow: 4, freq: [165, 392, 247] },
      { n: "Bell parade", pads: 4, start: 3, grow: 4, freq: [523, 587, 392, 659] },
      { n: "Drum castle", pads: 4, start: 4, grow: 5, freq: [147, 330, 220, 392] },
      { n: "Star finale", pads: 4, start: 4, grow: 6, freq: [196, 523, 330, 784] }
    ];
    var KINDS = ["drum", "xylo", "guitar", "horn"];
    var COLS = ["#f472b6", "#60a5fa", "#facc15", "#4ade80"];
    var SHIRTS = ["#db2777", "#2563eb", "#ca8a04", "#16a34a"];
    var SKIN = ["#ffd7b0", "#e8b88a", "#c68642", "#8d5524"];
    var HAIR = ["#3b2100", "#1a1a1a", "#7c2d12", "#431407"];
    var WAVES = ["triangle", "sine", "sawtooth", "square"];
    var TAGS = ["Drum", "Xylo", "Guitar", "Horn"];

    function hexA(h, a) {
      var r = parseInt(h.slice(1, 3), 16), gv = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
      return "rgba(" + r + "," + gv + "," + b + "," + a + ")";
    }
    function lerp(a, b, p) { return a + (b - a) * p; }
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function say(s) { document.getElementById("say").textContent = s; }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    function beep(f, d, typ) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        if (ac.state === "suspended") ac.resume();
        var o = ac.createOscillator(), gn = ac.createGain();
        o.type = typ || "square";
        o.frequency.value = f;
        gn.gain.value = 0.09;
        o.connect(gn); gn.connect(ac.destination);
        o.start();
        gn.gain.setValueAtTime(0.09, ac.currentTime);
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.stop(ac.currentTime + d);
      } catch (e) {}
    }

    function resize() {
      var dpr = Math.min(2, devicePixelRatio || 1);
      cv.width = innerWidth * dpr;
      cv.height = innerHeight * dpr;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = innerWidth; H = innerHeight;
      layoutPads();
      if (!crowd.length) crowd = makeCrowd();
    }
    addEventListener("resize", resize);

    function layoutPads() {
      var n = pads.length || 3, i, gap = 14;
      var w = Math.min(118, (W - 28) / n - 4);
      for (i = 0; i < pads.length; i++) {
        pads[i].x = W / 2 - ((n - 1) * (w + gap)) / 2 + i * (w + gap);
        pads[i].y = H * 0.58;
        pads[i].s = w;
        pads[i].mx = pads[i].x;
        pads[i].my = H * 0.38;
      }
    }

    function makeCrowd() {
      var list = [], i, n = 14;
      for (i = 0; i < n; i++) {
        list.push({
          x: (i + 0.5) / n * (W || 360),
          y: (H || 640) * 0.80 + (i % 2) * 8,
          ph: rnd(0, 6.28),
          skin: SKIN[i % SKIN.length],
          shirt: ["#f472b6", "#60a5fa", "#facc15", "#fb7185", "#a78bfa", "#34d399"][i % 6],
          hair: HAIR[i % HAIR.length],
          sc: 0.85 + (i % 3) * 0.12
        });
      }
      return list;
    }

    function bootStage(n) {
      var i;
      pads = [];
      for (i = 0; i < n; i++) {
        pads.push({
          i: i, kind: KINDS[i], c: COLS[i],
          squash: 0, glow: 0, play: 0,
          x: 0, y: 0, s: 90, mx: 0, my: 0
        });
      }
      layoutPads();
      crowd = makeCrowd();
      notes = [];
      pops = [];
    }

    function loadSong() {
      var S = SONGS[song], i;
      bootStage(S.pads);
      seq = []; input = []; phase = "show"; showI = 0; showT = 0.45;
      for (i = 0; i < S.start; i++) seq.push(Math.floor(Math.random() * S.pads));
      document.getElementById("sg").textContent = S.n;
      document.getElementById("replay").className = "on";
      say("Listen...");
    }

    function spawnNotes(p) {
      var i, k;
      for (i = 0; i < 3; i++) {
        k = i === 0 ? "note" : "orb";
        notes.push({
          x: p.x + rnd(-12, 12), y: p.y - p.s * 0.35,
          vx: rnd(-28, 28), vy: rnd(-90, -50),
          life: 1, col: p.c, kind: k, spin: rnd(-0.8, 0.8)
        });
      }
      pops.push({ x: p.x, y: p.my - 20, life: 0.7, col: p.c });
    }

    function playPad(i, fromUser) {
      var S = SONGS[song] || SONGS[0];
      var p = pads[i];
      if (!p) return;
      p.squash = 1; p.glow = 1; p.play = 1;
      cheer = Math.min(1.4, cheer + 0.35);
      beep(S.freq[i] || 440, p.kind === "drum" ? 0.16 : 0.18, WAVES[i]);
      spawnNotes(p);
      if (!fromUser) return;
      if (phase !== "in") return;
      input.push(i);
      if (input[input.length - 1] !== seq[input.length - 1]) {
        say("Try again!");
        input = [];
        phase = "show";
        showI = 0;
        showT = 0.75;
        beep(180, 0.08, "sine");
        return;
      }
      if (input.length === seq.length) {
        stars += seq.length;
        document.getElementById("st").textContent = "Stars " + stars;
        burstStars(p.x, p.y - 30);
        if (seq.length >= S.start + S.grow - 1) finishSong();
        else {
          seq.push(Math.floor(Math.random() * S.pads));
          input = []; phase = "show"; showI = 0; showT = 0.55;
          say("Longer! " + seq.length + " notes.");
        }
      }
    }

    function burstStars(x, y) {
      var i;
      for (i = 0; i < 5; i++) {
        pops.push({
          x: x + rnd(-20, 20), y: y + rnd(-10, 10),
          life: 0.9, col: "#fde68a", star: 1, spin: rnd(0, 6)
        });
      }
    }

    function finishSong() {
      beep(660, 0.12, "sine");
      setTimeout(function () { beep(880, 0.16, "sine"); }, 90);
      cheer = 1.5;
      if (song < SONGS.length - 1) {
        song++;
        say("Next song!");
        setTimeout(loadSong, 700);
      } else {
        mode = "win";
        document.getElementById("replay").classList.remove("on");
        document.getElementById("win").classList.remove("off");
        document.getElementById("winP").textContent = "Five songs. " + stars + " stars.";
      }
    }

    function helper() {
      if (mode !== "play") return;
      phase = "show"; showI = 0; showT = 0.28; input = [];
      say("Here it is!");
    }

    function updateShow(dt) {
      if (phase !== "show") return;
      showT -= dt;
      if (showT <= 0) {
        if (showI < seq.length) {
          playPad(seq[showI], 0);
          showI++; showT = 0.55;
        } else {
          phase = "in";
          say("Your turn!");
        }
      }
    }

    function hitPad(px, py) {
      var i, p, dx, dy, hit = -1, best = 1e9, d;
      for (i = 0; i < pads.length; i++) {
        p = pads[i];
        dx = px - p.x; dy = py - p.y;
        d = dx * dx + dy * dy;
        if (d < (p.s * 0.58) * (p.s * 0.58) && d < best) { best = d; hit = i; }
      }
      return hit;
    }

    function drawStar(x, y, r, col) {
      var i, a;
      g.fillStyle = col;
      g.beginPath();
      for (i = 0; i < 5; i++) {
        a = -Math.PI / 2 + i * Math.PI * 0.8;
        if (i === 0) g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        else g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        a += Math.PI * 0.4;
        g.lineTo(x + Math.cos(a) * r * 0.42, y + Math.sin(a) * r * 0.42);
      }
      g.closePath();
      g.fill();
    }

    function drawNote(n) {
      g.save();
      g.translate(n.x, n.y);
      g.rotate(n.spin * (1 - n.life));
      g.globalAlpha = clamp(n.life, 0, 1);
      if (n.kind === "orb") {
        var grd = g.createRadialGradient(0, 0, 1, 0, 0, 10);
        grd.addColorStop(0, "#fff");
        grd.addColorStop(0.4, n.col);
        grd.addColorStop(1, hexA(n.col, 0));
        g.fillStyle = grd;
        g.beginPath(); g.arc(0, 0, 10, 0, 6.28); g.fill();
      } else {
        g.fillStyle = n.col;
        g.beginPath(); g.ellipse(0, 6, 7, 5, -0.4, 0, 6.28); g.fill();
        g.strokeStyle = n.col;
        g.lineWidth = 2.4;
        g.beginPath(); g.moveTo(6, 6); g.lineTo(6, -12); g.stroke();
        g.beginPath();
        g.moveTo(6, -12);
        g.quadraticCurveTo(16, -10, 14, -2);
        g.quadraticCurveTo(10, -6, 6, -6);
        g.fill();
      }
      g.restore();
      g.globalAlpha = 1;
    }

    function curtainFold(x0, x1, y0, y1, flip) {
      var i, x, w = x1 - x0;
      g.fillStyle = "#8b1028";
      g.fillRect(x0, y0, w, y1 - y0);
      for (i = 0; i < 6; i++) {
        x = x0 + (flip ? w - (i + 0.5) * (w / 6) : (i + 0.5) * (w / 6));
        g.fillStyle = i % 2 ? "#9f1a34" : "#6d0e22";
        g.beginPath();
        g.moveTo(x - w / 14, y0);
        g.quadraticCurveTo(x + (flip ? -8 : 8), (y0 + y1) / 2, x - w / 16, y1);
        g.quadraticCurveTo(x + (flip ? 10 : -10), (y0 + y1) / 2, x + w / 14, y0);
        g.fill();
      }
      g.fillStyle = "#e8b84a";
      g.fillRect(flip ? x1 - 6 : x0, y0, 6, y1 - y0);
    }

    function drawValance() {
      var i, x, w = W / 7;
      g.fillStyle = "#7f1026";
      g.fillRect(0, 0, W, 52);
      for (i = 0; i < 8; i++) {
        x = i * w;
        g.fillStyle = i % 2 ? "#a31632" : "#6d0e22";
        g.beginPath();
        g.moveTo(x, 18);
        g.lineTo(x + w, 18);
        g.quadraticCurveTo(x + w * 0.5, 78, x, 18);
        g.fill();
        g.fillStyle = "#e8b84a";
        g.beginPath(); g.arc(x + w * 0.5, 64, 5, 0, 6.28); g.fill();
      }
      g.fillStyle = "#e8b84a";
      g.fillRect(0, 16, W, 6);
    }

    function drawStageWood() {
      var i, y0 = H * 0.33, y1 = H * 0.72, p, y;
      g.fillStyle = "#6b3a18";
      g.beginPath();
      g.moveTo(W * 0.07, y0);
      g.lineTo(W * 0.93, y0);
      g.lineTo(W * 0.99, y1);
      g.lineTo(W * 0.01, y1);
      g.closePath();
      g.fill();
      g.fillStyle = "#8a4f22";
      g.beginPath();
      g.moveTo(W * 0.10, y0 + 8);
      g.lineTo(W * 0.90, y0 + 8);
      g.lineTo(W * 0.96, y1 - 10);
      g.lineTo(W * 0.04, y1 - 10);
      g.closePath();
      g.fill();
      for (i = 0; i < 9; i++) {
        p = i / 8;
        y = lerp(y0 + 8, y1 - 10, p);
        g.strokeStyle = "rgba(50, 22, 8, 0.28)";
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(lerp(W * 0.10, W * 0.04, p), y);
        g.lineTo(lerp(W * 0.90, W * 0.96, p), y);
        g.stroke();
      }
      g.fillStyle = "#4a240c";
      g.fillRect(0, y1 - 8, W, 14);
      for (i = 0; i < 11; i++) {
        g.fillStyle = (Math.floor(t * 4) + i) % 2 ? "#fde68a" : "#fbbf24";
        g.beginPath();
        g.arc(18 + i * ((W - 36) / 10), y1 + 4, 5, 0, 6.28);
        g.fill();
      }
    }

    function drawSpots() {
      var cols = ["#f472b6", "#facc15", "#60a5fa", "#4ade80"];
      var i, lx, ly, r, grd, topX;
      for (i = 0; i < 4; i++) {
        lx = W * (0.18 + i * 0.21) + Math.sin(t * 0.75 + i * 1.7) * W * 0.09;
        ly = H * 0.46 + Math.cos(t * 0.55 + i) * 18;
        r = 70 + Math.sin(t * 1.2 + i) * 8;
        topX = W * (0.2 + i * 0.2);
        g.fillStyle = hexA(cols[i], 0.12);
        g.beginPath();
        g.moveTo(topX - 10, 44);
        g.lineTo(topX + 10, 44);
        g.lineTo(lx + r * 0.9, ly);
        g.lineTo(lx - r * 0.9, ly);
        g.closePath();
        g.fill();
        grd = g.createRadialGradient(lx, ly, 4, lx, ly, r);
        grd.addColorStop(0, hexA(cols[i], 0.55));
        grd.addColorStop(0.45, hexA(cols[i], 0.22));
        grd.addColorStop(1, hexA(cols[i], 0));
        g.fillStyle = grd;
        g.beginPath(); g.arc(lx, ly, r, 0, 6.28); g.fill();
        g.strokeStyle = hexA(cols[i], 0.35);
        g.lineWidth = 3;
        g.beginPath(); g.arc(lx, ly, r * 0.55, 0, 6.28); g.stroke();
      }
    }

    function drawHouse() {
      var grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, "#14060f");
      grd.addColorStop(0.35, "#2a0b1c");
      grd.addColorStop(1, "#12080c");
      g.fillStyle = grd;
      g.fillRect(0, 0, W, H);
      drawValance();
      curtainFold(0, W * 0.13, 50, H * 0.74, 0);
      curtainFold(W * 0.87, W, 50, H * 0.74, 1);
      drawStageWood();
      drawSpots();
    }

    function kidBase(play) {
      var bob = Math.sin(t * 3.2 + play) * 1.5;
      g.translate(0, bob);
      g.fillStyle = "#1e3a5f";
      g.fillRect(-11, 20, 8, 16);
      g.fillRect(3, 20, 8, 16);
      g.fillStyle = "#3b2100";
      g.beginPath(); g.ellipse(-7, 37, 7, 3.2, 0, 0, 6.28); g.fill();
      g.beginPath(); g.ellipse(7, 37, 7, 3.2, 0, 0, 6.28); g.fill();
    }

    function kidBody(skin, hair, shirt) {
      g.fillStyle = shirt;
      g.beginPath();
      g.moveTo(-15, 0);
      g.lineTo(15, 0);
      g.lineTo(12, 22);
      g.lineTo(-12, 22);
      g.closePath();
      g.fill();
      g.fillStyle = skin;
      g.beginPath(); g.arc(0, -16, 13, 0, 6.28); g.fill();
      g.fillStyle = hair;
      g.beginPath();
      g.arc(-2, -22, 11, Math.PI, 0.15);
      g.arc(8, -20, 7, -0.4, Math.PI * 0.7);
      g.fill();
      g.fillStyle = "#1a1a1a";
      g.beginPath(); g.arc(-4.5, -16, 1.7, 0, 6.28); g.fill();
      g.beginPath(); g.arc(4.5, -16, 1.7, 0, 6.28); g.fill();
      g.fillStyle = "#fff";
      g.beginPath(); g.arc(-3.8, -16.7, 0.6, 0, 6.28); g.fill();
      g.beginPath(); g.arc(5.2, -16.7, 0.6, 0, 6.28); g.fill();
      g.strokeStyle = "#9a3412";
      g.lineWidth = 1.5;
      g.beginPath(); g.arc(0, -12.5, 4.5, 0.15, Math.PI - 0.15); g.stroke();
    }

    function stick(len) {
      g.strokeStyle = "#7c4a1a";
      g.lineWidth = 3.2;
      g.lineCap = "round";
      g.beginPath(); g.moveTo(0, 0); g.lineTo(len, 0); g.stroke();
      g.fillStyle = "#d6b07a";
      g.beginPath(); g.arc(len, 0, 2.6, 0, 6.28); g.fill();
    }

    function drawDrummer(p) {
      var play = p.play, sc = p.s * 0.0155;
      g.save();
      g.translate(p.mx, p.my);
      g.scale(sc, sc);
      kidBase(play * 4);
      var bounce = 1 + play * 0.22;
      g.save();
      g.translate(0, 28);
      g.scale(1, bounce);
      g.fillStyle = "#9f1239";
      g.fillRect(-16, -8, 32, 14);
      g.fillStyle = "#f9a8d4";
      g.beginPath(); g.ellipse(0, -8, 16, 6, 0, 0, 6.28); g.fill();
      g.strokeStyle = "#e8b84a";
      g.lineWidth = 2;
      g.beginPath(); g.ellipse(0, -8, 16, 6, 0, 0, 6.28); g.stroke();
      g.restore();
      kidBody(SKIN[0], HAIR[0], SHIRTS[0]);
      g.save();
      g.translate(-12, 2);
      g.rotate(-1.15 + play * 1.7);
      g.strokeStyle = SKIN[0]; g.lineWidth = 6; g.lineCap = "round";
      g.beginPath(); g.moveTo(0, 0); g.lineTo(16, 0); g.stroke();
      g.translate(16, 0); stick(18);
      g.restore();
      g.save();
      g.translate(12, 2);
      g.rotate(-0.05 - play * 1.45);
      g.strokeStyle = SKIN[0]; g.lineWidth = 6; g.lineCap = "round";
      g.beginPath(); g.moveTo(0, 0); g.lineTo(16, 0); g.stroke();
      g.translate(16, 0); stick(18);
      g.restore();
      g.restore();
    }

    function drawXyloKid(p) {
      var play = p.play, sc = p.s * 0.0155;
      g.save();
      g.translate(p.mx, p.my);
      g.scale(sc, sc);
      kidBase(play * 3);
      g.fillStyle = "#92400e";
      g.fillRect(-22, 26, 44, 5);
      g.fillRect(-20, 18, 4, 10);
      g.fillRect(16, 18, 4, 10);
      var i, w;
      for (i = 0; i < 4; i++) {
        w = 10 - i;
        g.fillStyle = i % 2 ? "#38bdf8" : "#1d4ed8";
        g.fillRect(-18 + i * 10, 16 - i, w, 6);
      }
      kidBody(SKIN[1], HAIR[1], SHIRTS[1]);
      g.save();
      g.translate(10, 0);
      g.rotate(-1.25 + play * 1.75);
      g.strokeStyle = SKIN[1]; g.lineWidth = 6; g.lineCap = "round";
      g.beginPath(); g.moveTo(0, 0); g.lineTo(15, 0); g.stroke();
      g.strokeStyle = "#b45309";
      g.lineWidth = 3;
      g.beginPath(); g.moveTo(15, 0); g.lineTo(32, 4); g.stroke();
      g.fillStyle = "#60a5fa";
      g.beginPath(); g.arc(32, 4, 3.4, 0, 6.28); g.fill();
      g.restore();
      g.save();
      g.translate(-12, 4);
      g.rotate(0.5);
      g.strokeStyle = SKIN[1]; g.lineWidth = 6; g.lineCap = "round";
      g.beginPath(); g.moveTo(0, 0); g.lineTo(12, 8); g.stroke();
      g.restore();
      g.restore();
    }

    function drawGuitarKid(p) {
      var play = p.play, sc = p.s * 0.0155;
      g.save();
      g.translate(p.mx, p.my);
      g.scale(sc, sc);
      kidBase(play * 3);
      kidBody(SKIN[2], HAIR[2], SHIRTS[2]);
      g.save();
      g.translate(2, 10);
      g.rotate(-0.55);
      g.fillStyle = "#eab308";
      g.beginPath(); g.ellipse(2, 10, 13, 11, 0, 0, 6.28); g.fill();
      g.beginPath(); g.ellipse(2, -2, 10, 8, 0, 0, 6.28); g.fill();
      g.fillStyle = "#3b2100";
      g.beginPath(); g.arc(2, 8, 4, 0, 6.28); g.fill();
      g.fillStyle = "#a16207";
      g.fillRect(8, -22, 5, 22);
      g.fillStyle = "#ca8a04";
      g.fillRect(6, -28, 9, 7);
      g.strokeStyle = "rgba(255,255,255,.55)";
      g.lineWidth = 0.8;
      g.beginPath(); g.moveTo(0, 16); g.lineTo(9, -20); g.stroke();
      g.beginPath(); g.moveTo(4, 16); g.lineTo(11, -20); g.stroke();
      g.restore();
      g.save();
      g.translate(-6, 4);
      g.rotate(0.2 + play * 1.45);
      g.strokeStyle = SKIN[2]; g.lineWidth = 6; g.lineCap = "round";
      g.beginPath(); g.moveTo(0, 0); g.lineTo(18, 6); g.stroke();
      g.restore();
      g.save();
      g.translate(12, 2);
      g.rotate(-0.9);
      g.strokeStyle = SKIN[2]; g.lineWidth = 6; g.lineCap = "round";
      g.beginPath(); g.moveTo(0, 0); g.lineTo(14, -8); g.stroke();
      g.restore();
      g.restore();
    }

    function drawHornKid(p) {
      var play = p.play, sc = p.s * 0.0155;
      g.save();
      g.translate(p.mx, p.my);
      g.scale(sc, sc);
      kidBase(play * 2);
      kidBody(SKIN[3], HAIR[3], SHIRTS[3]);
      g.fillStyle = SKIN[3];
      g.beginPath(); g.arc(-8, -14, 3.2 + play * 5.5, 0, 6.28); g.fill();
      g.beginPath(); g.arc(8, -14, 3.2 + play * 5.5, 0, 6.28); g.fill();
      g.fillStyle = "#1a1a1a";
      g.beginPath(); g.arc(-4.5, -16, 1.7, 0, 6.28); g.fill();
      g.beginPath(); g.arc(4.5, -16, 1.7, 0, 6.28); g.fill();
      g.save();
      g.translate(8, -6);
      g.rotate(-0.18 + play * 0.48);
      g.fillStyle = "#4ade80";
      g.fillRect(0, -3, 22, 6);
      g.beginPath();
      g.moveTo(20, -3);
      g.lineTo(38, -12);
      g.lineTo(38, 12);
      g.lineTo(20, 3);
      g.closePath();
      g.fill();
      g.fillStyle = "#166534";
      g.fillRect(8, -8, 3.2, 8);
      g.fillRect(13, -8, 3.2, 8);
      g.fillRect(18, -8, 3.2, 8);
      g.strokeStyle = "#86efac";
      g.lineWidth = 2;
      g.beginPath(); g.arc(10, 8, 6, 0.2, Math.PI - 0.2); g.stroke();
      g.fillStyle = "#bbf7d0";
      g.beginPath(); g.arc(-2, 0, 3, 0, 6.28); g.fill();
      g.restore();
      g.save();
      g.translate(-10, 4);
      g.rotate(0.4);
      g.strokeStyle = SKIN[3]; g.lineWidth = 6; g.lineCap = "round";
      g.beginPath(); g.moveTo(0, 0); g.lineTo(12, 4); g.stroke();
      g.restore();
      g.save();
      g.translate(10, 4);
      g.rotate(-0.2);
      g.strokeStyle = SKIN[3]; g.lineWidth = 6; g.lineCap = "round";
      g.beginPath(); g.moveTo(0, 0); g.lineTo(14, -2); g.stroke();
      g.restore();
      g.restore();
    }

    function drawMusician(p) {
      if (p.kind === "drum") drawDrummer(p);
      else if (p.kind === "xylo") drawXyloKid(p);
      else if (p.kind === "guitar") drawGuitarKid(p);
      else drawHornKid(p);
    }

    function drawDrumPad(p) {
      var r = p.s * 0.42, sq = 1 - p.squash * 0.12;
      g.save();
      g.translate(p.x, p.y);
      g.scale(1 + p.squash * 0.06, sq);
      g.fillStyle = "rgba(0,0,0,.25)";
      g.beginPath(); g.ellipse(0, r * 0.55, r * 0.7, r * 0.18, 0, 0, 6.28); g.fill();
      g.strokeStyle = "#4a2c0a"; g.lineWidth = 5;
      g.beginPath(); g.moveTo(-r * 0.35, r * 0.2); g.lineTo(-r * 0.55, r * 0.7); g.stroke();
      g.beginPath(); g.moveTo(r * 0.35, r * 0.2); g.lineTo(r * 0.55, r * 0.7); g.stroke();
      g.fillStyle = "#9f1239";
      g.beginPath();
      g.ellipse(0, 8, r, r * 0.42, 0, 0, Math.PI);
      g.ellipse(0, -6, r, r * 0.38, 0, Math.PI, 0, true);
      g.fill();
      g.fillStyle = "#fb7185";
      g.beginPath(); g.ellipse(0, -8, r, r * 0.4, 0, 0, 6.28); g.fill();
      g.strokeStyle = "#e8b84a"; g.lineWidth = 5;
      g.beginPath(); g.ellipse(0, -8, r, r * 0.4, 0, 0, 6.28); g.stroke();
      g.fillStyle = "#fff1f2";
      g.beginPath(); g.ellipse(-r * 0.25, -14, r * 0.28, r * 0.12, -0.4, 0, 6.28); g.fill();
      var i, a;
      for (i = 0; i < 8; i++) {
        a = i / 8 * 6.28;
        g.fillStyle = "#fde68a";
        g.beginPath();
        g.arc(Math.cos(a) * r * 0.92, -8 + Math.sin(a) * r * 0.36, 3.2, 0, 6.28);
        g.fill();
      }
      if (p.glow > 0) {
        g.strokeStyle = hexA("#ffffff", p.glow);
        g.lineWidth = 7;
        g.beginPath(); g.ellipse(0, -8, r + 4, r * 0.4 + 4, 0, 0, 6.28); g.stroke();
      }
      g.restore();
    }

    function drawXyloPad(p) {
      var s = p.s, sq = 1 - p.squash * 0.1;
      g.save();
      g.translate(p.x, p.y);
      g.scale(1, sq);
      g.fillStyle = "rgba(0,0,0,.22)";
      g.beginPath(); g.ellipse(0, s * 0.32, s * 0.4, 8, 0, 0, 6.28); g.fill();
      g.fillStyle = "#92400e";
      g.beginPath();
      g.moveTo(-s * 0.46, s * 0.18);
      g.lineTo(s * 0.46, s * 0.18);
      g.lineTo(s * 0.34, -s * 0.22);
      g.lineTo(-s * 0.34, -s * 0.22);
      g.closePath();
      g.fill();
      g.fillStyle = "#b45309";
      g.fillRect(-s * 0.32, -s * 0.08, s * 0.64, 6);
      var i, h, y, w, cols = ["#1d4ed8", "#2563eb", "#3b82f6", "#60a5fa", "#93c5fd"];
      for (i = 0; i < 5; i++) {
        h = s * (0.12 + (4 - i) * 0.03);
        w = s * 0.11;
        y = -s * 0.18 + i * 2;
        g.fillStyle = cols[i];
        g.fillRect(-s * 0.28 + i * (s * 0.12), y, w, h);
        g.fillStyle = hexA("#ffffff", 0.25);
        g.fillRect(-s * 0.28 + i * (s * 0.12), y, w, 3);
      }
      g.fillStyle = "#78350f";
      g.fillRect(-s * 0.4, s * 0.14, 7, s * 0.16);
      g.fillRect(s * 0.34, s * 0.14, 7, s * 0.16);
      if (p.glow > 0) {
        g.strokeStyle = hexA("#ffffff", p.glow);
        g.lineWidth = 6;
        g.strokeRect(-s * 0.48, -s * 0.28, s * 0.96, s * 0.52);
      }
      g.restore();
    }

    function drawGuitarPad(p) {
      var s = p.s, sq = 1 - p.squash * 0.1;
      g.save();
      g.translate(p.x, p.y + 4);
      g.scale(1 + p.squash * 0.05, sq);
      g.rotate(-0.35);
      g.fillStyle = "rgba(0,0,0,.22)";
      g.beginPath(); g.ellipse(2, s * 0.28, s * 0.28, 8, 0, 0, 6.28); g.fill();
      g.fillStyle = "#eab308";
      g.beginPath(); g.ellipse(0, s * 0.08, s * 0.28, s * 0.24, 0, 0, 6.28); g.fill();
      g.beginPath(); g.ellipse(0, -s * 0.12, s * 0.2, s * 0.17, 0, 0, 6.28); g.fill();
      g.fillStyle = "#ca8a04";
      g.beginPath(); g.ellipse(-s * 0.06, s * 0.02, s * 0.08, s * 0.1, 0, 0, 6.28); g.fill();
      g.fillStyle = "#3b2100";
      g.beginPath(); g.arc(0, s * 0.06, s * 0.08, 0, 6.28); g.fill();
      g.strokeStyle = "#fde68a"; g.lineWidth = 2;
      g.beginPath(); g.arc(0, s * 0.06, s * 0.08, 0, 6.28); g.stroke();
      g.fillStyle = "#a16207";
      g.fillRect(s * 0.1, -s * 0.42, s * 0.08, s * 0.32);
      g.fillStyle = "#ca8a04";
      g.beginPath();
      g.moveTo(s * 0.06, -s * 0.42);
      g.lineTo(s * 0.22, -s * 0.42);
      g.lineTo(s * 0.24, -s * 0.52);
      g.lineTo(s * 0.04, -s * 0.52);
      g.closePath();
      g.fill();
      g.fillStyle = "#fde68a";
      g.fillRect(s * 0.08, -s * 0.54, 3, 3);
      g.fillRect(s * 0.16, -s * 0.54, 3, 3);
      g.strokeStyle = "rgba(255,255,255,.5)";
      g.lineWidth = 1;
      g.beginPath(); g.moveTo(-4, s * 0.2); g.lineTo(s * 0.16, -s * 0.4); g.stroke();
      g.beginPath(); g.moveTo(4, s * 0.2); g.lineTo(s * 0.2, -s * 0.4); g.stroke();
      if (p.glow > 0) {
        g.strokeStyle = hexA("#ffffff", p.glow);
        g.lineWidth = 6;
        g.beginPath(); g.ellipse(0, s * 0.02, s * 0.34, s * 0.32, 0, 0, 6.28); g.stroke();
      }
      g.restore();
    }

    function drawHornPad(p) {
      var s = p.s, sq = 1 - p.squash * 0.08;
      g.save();
      g.translate(p.x, p.y);
      g.scale(1, sq);
      g.fillStyle = "rgba(0,0,0,.22)";
      g.beginPath(); g.ellipse(0, s * 0.28, s * 0.38, 7, 0, 0, 6.28); g.fill();
      g.fillStyle = "#22c55e";
      g.beginPath();
      g.moveTo(-s * 0.38, -4);
      g.lineTo(s * 0.08, -6);
      g.lineTo(s * 0.08, 6);
      g.lineTo(-s * 0.38, 4);
      g.closePath();
      g.fill();
      g.fillStyle = "#4ade80";
      g.beginPath();
      g.moveTo(s * 0.04, -7);
      g.lineTo(s * 0.42, -s * 0.22);
      g.quadraticCurveTo(s * 0.5, 0, s * 0.42, s * 0.22);
      g.lineTo(s * 0.04, 7);
      g.closePath();
      g.fill();
      g.fillStyle = "#bbf7d0";
      g.beginPath();
      g.moveTo(s * 0.18, -10);
      g.lineTo(s * 0.36, -s * 0.16);
      g.lineTo(s * 0.28, -2);
      g.closePath();
      g.fill();
      g.fillStyle = "#166534";
      g.fillRect(-s * 0.12, -14, 6, 12);
      g.fillRect(-s * 0.02, -14, 6, 12);
      g.fillRect(s * 0.08, -14, 6, 12);
      g.fillStyle = "#86efac";
      g.beginPath(); g.arc(-s * 0.04, -16, 3, 0, 6.28); g.fill();
      g.beginPath(); g.arc(s * 0.06, -16, 3, 0, 6.28); g.fill();
      g.beginPath(); g.arc(s * 0.16, -16, 3, 0, 6.28); g.fill();
      g.strokeStyle = "#86efac";
      g.lineWidth = 3;
      g.beginPath(); g.arc(-s * 0.08, 12, s * 0.14, 0.15, Math.PI - 0.15); g.stroke();
      g.fillStyle = "#bbf7d0";
      g.beginPath(); g.arc(-s * 0.4, 0, 5, 0, 6.28); g.fill();
      if (p.glow > 0) {
        g.strokeStyle = hexA("#ffffff", p.glow);
        g.lineWidth = 6;
        g.beginPath(); g.ellipse(0, 0, s * 0.48, s * 0.3, 0, 0, 6.28); g.stroke();
      }
      g.restore();
    }

    function drawPad(p) {
      if (p.kind === "drum") drawDrumPad(p);
      else if (p.kind === "xylo") drawXyloPad(p);
      else if (p.kind === "guitar") drawGuitarPad(p);
      else drawHornPad(p);
      var ly = p.y + p.s * 0.44, tx = p.x - 28, tw = 56, th = 18;
      g.fillStyle = "rgba(40, 10, 16, 0.72)";
      g.beginPath();
      g.moveTo(tx + 9, ly - 2);
      g.arcTo(tx + tw, ly - 2, tx + tw, ly - 2 + th, 9);
      g.arcTo(tx + tw, ly - 2 + th, tx, ly - 2 + th, 9);
      g.arcTo(tx, ly - 2 + th, tx, ly - 2, 9);
      g.arcTo(tx, ly - 2, tx + tw, ly - 2, 9);
      g.closePath();
      g.fill();
      g.fillStyle = "#fff3c4";
      g.font = "800 13px Trebuchet MS";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText(TAGS[p.i], p.x, ly + 7);
    }

    function drawCrowd() {
      crowd.forEach(function (c) {
        var bob = Math.sin(t * 5 + c.ph) * (5 + cheer * 6);
        var arms = 0.4 + cheer * 0.7;
        g.save();
        g.translate(c.x, c.y + bob);
        g.scale(c.sc, c.sc);
        g.strokeStyle = c.skin;
        g.lineWidth = 3.2;
        g.lineCap = "round";
        g.beginPath(); g.moveTo(-6, 2); g.lineTo(-12, -10 * arms); g.stroke();
        g.beginPath(); g.moveTo(6, 2); g.lineTo(12, -10 * arms); g.stroke();
        g.fillStyle = c.shirt;
        g.beginPath();
        g.moveTo(-9, 0); g.lineTo(9, 0); g.lineTo(7, 16); g.lineTo(-7, 16);
        g.closePath();
        g.fill();
        g.fillStyle = c.skin;
        g.beginPath(); g.arc(0, -8, 7, 0, 6.28); g.fill();
        g.fillStyle = c.hair;
        g.beginPath(); g.arc(0, -12, 6.5, Math.PI, 0); g.fill();
        g.fillStyle = "#1a1a1a";
        g.beginPath(); g.arc(-2.2, -8, 1.1, 0, 6.28); g.fill();
        g.beginPath(); g.arc(2.2, -8, 1.1, 0, 6.28); g.fill();
        g.restore();
      });
    }

    function drawPops() {
      pops.forEach(function (p) {
        g.globalAlpha = clamp(p.life, 0, 1);
        if (p.star) drawStar(p.x, p.y - (1 - p.life) * 20, 8, p.col);
        else {
          g.strokeStyle = p.col;
          g.lineWidth = 3;
          g.beginPath(); g.arc(p.x, p.y, 16 * (1 - p.life), 0, 6.28); g.stroke();
        }
        g.globalAlpha = 1;
      });
    }

    function idleBand(dt) {
      var i;
      if (mode === "title") {
        for (i = 0; i < pads.length; i++) {
          if (Math.sin(t * 2.2 + i * 1.6) > 0.92 && pads[i].play < 0.2) pads[i].play = 0.85;
        }
      }
      if (mode === "win") {
        for (i = 0; i < pads.length; i++) {
          if (Math.sin(t * 7 + i) > 0.4) { pads[i].play = 1; pads[i].glow = 1; }
        }
      }
    }

    function update(dt) {
      t += dt;
      cheer = Math.max(0.35, cheer - dt * 0.35);
      pads.forEach(function (p) {
        p.squash = Math.max(0, p.squash - dt * 4);
        p.glow = Math.max(0, p.glow - dt * 2.2);
        p.play = Math.max(0, p.play - dt * 1.8);
      });
      notes.forEach(function (n) {
        n.x += n.vx * dt; n.y += n.vy * dt; n.vy += 30 * dt; n.life -= dt * 0.85;
      });
      notes = notes.filter(function (n) { return n.life > 0; });
      pops.forEach(function (p) { p.life -= dt; p.y -= 18 * dt; });
      pops = pops.filter(function (p) { return p.life > 0; });
      idleBand(dt);
      if (mode === "play") updateShow(dt);
    }

    function draw() {
      drawHouse();
      pads.forEach(drawMusician);
      pads.forEach(drawPad);
      notes.forEach(drawNote);
      drawPops();
      drawCrowd();
    }

    function loop(now) {
      var dt = Math.min(0.033, (now - last) / 1000 || 0.016);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function start() {
      mode = "play"; song = 0; stars = 0; cheer = 0.6;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("st").textContent = "Stars 0";
      loadSong();
      beep(392, 0.1, "triangle");
    }

    document.getElementById("go").onclick = function () {
      try { if (beep.ac && beep.ac.state === "suspended") beep.ac.resume(); } catch (e) {}
      start();
    };
    document.getElementById("again").onclick = function () {
      document.getElementById("win").classList.add("off");
      start();
    };
    document.getElementById("replay").onclick = helper;
    cv.addEventListener("pointerdown", function (e) {
      if (mode !== "play" || phase !== "in") return;
      var i = hitPad(e.clientX, e.clientY);
      if (i >= 0) playPad(i, 1);
    });

    bootStage(4);
    resize();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
