<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Rhythm Band</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background: #1a0b2e; color: #fff8e7; touch-action: none; user-select: none; }
    button { background: transparent; border: 0; appearance: none; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .home { position: fixed; top: 12px; left: 12px; z-index: 12; color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; background: rgba(0,0,0,.4); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 12px; right: 12px; z-index: 8; font-weight: 800; text-align: right; pointer-events: none; }
    #hud b { display: inline-block; background: rgba(255,209,102,.18); border: 2px solid #ffd166; color: #ffe8a3; padding: 6px 12px; border-radius: 999px; margin-left: 6px; font-size: 14px; }
    #say { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 8; font-weight: 800; color: #ffe8a3; pointer-events: none; text-align: center; width: 92%; }
    #replay { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 8; display: none; background: #fde68a; color: #3b2100; font-weight: 800; font-size: 18px; padding: 12px 20px; border-radius: 999px; box-shadow: 0 6px 0 #b45309; }
    #replay.on { display: block; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; gap: 8px; padding: 20px 20px 48px; pointer-events: none; }
    .cover.off { display: none; }
    .cover h1 { font-size: clamp(30px, 8vw, 46px); color: #fff; text-shadow: 0 4px 0 #3b0764; }
    .cover p { font-weight: 800; color: #fbcfe8; }
    .btn { pointer-events: auto; background: #ffd166; color: #3b2100; font-weight: 800; font-size: 24px; padding: 14px 28px; border-radius: 999px; box-shadow: 0 7px 0 #e09f1f; }
    .btn.g { background: #f472b6; color: #fff; box-shadow: 0 7px 0 #9d174d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="sg">Sunny clap</b><b id="st">⭐ 0</b></div>
  <div id="say">Watch. Then tap the pads!</div>
  <button id="replay">Hear it again</button>
  <div class="cover" id="title">
    <h1>Rhythm Band</h1>
    <p>Lights sweep. Notes bounce.<br>Simon grows. Helper replay!</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <h1>Encore!</h1>
    <p id="winP">Five songs played.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), g = cv.getContext("2d");
    var W, H, last = 0, t = 0, mode = "title", stars = 0, song = 0;
    var pads = [], seq = [], input = [], phase = "show", showI = 0, showT = 0;
    var notes = [], crowd = [], lights = [{ x: 0.3, c: "#f472b6" }, { x: 0.7, c: "#60a5fa" }];
    var helperUsed = 0;

    var SONGS = [
      { n: "Sunny clap", pads: 3, start: 2, grow: 3, freq: [440, 554, 659] },
      { n: "Bongo walk", pads: 3, start: 3, grow: 4, freq: [330, 392, 523] },
      { n: "Bell parade", pads: 4, start: 3, grow: 4, freq: [523, 587, 659, 784] },
      { n: "Drum castle", pads: 4, start: 4, grow: 5, freq: [196, 247, 330, 392] },
      { n: "Star finale", pads: 4, start: 4, grow: 6, freq: [523, 659, 784, 988] }
    ];
    var ICONS = ["🥁", "🎹", "🎸", "🎺"];
    var COLS = ["#f472b6", "#60a5fa", "#facc15", "#4ade80"];

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), gn = ac.createGain();
        o.type = "square"; o.frequency.value = f; gn.gain.value = 0.08;
        o.connect(gn); gn.connect(ac.destination); o.start();
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function lerp(a, b, p) { return a + (b - a) * p; }
    function rnd(a, b) { return a + Math.random() * (b - a); }

    function resize() {
      cv.width = innerWidth * (devicePixelRatio || 1);
      cv.height = innerHeight * (devicePixelRatio || 1);
      g.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0);
      W = innerWidth; H = innerHeight;
      layoutPads();
    }
    addEventListener("resize", resize); resize();

    function layoutPads() {
      var n = pads.length || 3, i, w = Math.min(88, (W - 40) / n);
      for (i = 0; i < pads.length; i++) {
        pads[i].x = W / 2 - ((n - 1) * (w + 14)) / 2 + i * (w + 14);
        pads[i].y = H * 0.62; pads[i].s = w;
      }
    }

    function loadSong() {
      var S = SONGS[song], i;
      pads = [];
      for (i = 0; i < S.pads; i++) pads.push({ i: i, squash: 0, glow: 0, e: ICONS[i], c: COLS[i] });
      layoutPads();
      seq = []; input = []; phase = "show"; showI = 0; showT = 0.4; helperUsed = 0;
      for (i = 0; i < S.start; i++) seq.push(Math.floor(Math.random() * S.pads));
      crowd = [];
      for (i = 0; i < 12; i++) crowd.push({ x: rnd(20, W - 20), y: H * 0.86 + rnd(0, 20), e: ["🧒", "👩", "🧔", "👧"][i % 4], ph: rnd(0, 6) });
      notes = [];
      document.getElementById("sg").textContent = S.n;
      document.getElementById("replay").className = "on";
      document.getElementById("say").textContent = "Listen...";
    }

    function playPad(i, fromUser) {
      var S = SONGS[song];
      pads[i].squash = 1; pads[i].glow = 1;
      beep(S.freq[i], 0.14);
      notes.push({ x: pads[i].x, y: pads[i].y - 40, e: "♪", life: 1, vx: rnd(-20, 20) });
      if (!fromUser) return;
      if (phase !== "in") return;
      input.push(i);
      if (input[input.length - 1] !== seq[input.length - 1]) {
        document.getElementById("say").textContent = "Soft miss. Helper can replay!";
        input = []; phase = "wait"; beep(160, 0.1);
        return;
      }
      if (input.length === seq.length) {
        stars += seq.length; document.getElementById("st").textContent = "⭐ " + stars;
        if (seq.length >= S.start + S.grow - 1) finishSong();
        else {
          seq.push(Math.floor(Math.random() * S.pads));
          input = []; phase = "show"; showI = 0; showT = 0.55;
          document.getElementById("say").textContent = "Longer! " + seq.length + " notes.";
        }
      }
    }

    function finishSong() {
      beep(660, 0.12); setTimeout(function () { beep(880, 0.16); }, 90);
      if (song < SONGS.length - 1) {
        song++;
        document.getElementById("say").textContent = "Next song!";
        setTimeout(loadSong, 700);
      } else {
        mode = "win";
        document.getElementById("replay").classList.remove("on");
        document.getElementById("win").classList.remove("off");
        document.getElementById("winP").textContent = "Five songs. " + stars + " stars.";
      }
    }

    function helper() {
      if (mode !== "play") return;
      helperUsed = 1; phase = "show"; showI = 0; showT = 0.3; input = [];
      document.getElementById("say").textContent = "Here it is again!";
    }

    function updateShow(dt) {
      if (phase !== "show") return;
      showT -= dt;
      if (showT <= 0) {
        if (showI < seq.length) {
          playPad(seq[showI], 0);
          showI++; showT = 0.55;
        } else { phase = "in"; document.getElementById("say").textContent = "Your turn!"; }
      }
    }

    function drawStage() {
      var grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, "#2d0a3a"); grd.addColorStop(0.5, "#1a0b2e"); grd.addColorStop(1, "#111");
      g.fillStyle = grd; g.fillRect(0, 0, W, H);
      g.fillStyle = "#4a0e2a";
      g.fillRect(20, 80, W - 40, H * 0.62);
      g.fillStyle = "#6b4423";
      g.fillRect(36, 110, W - 72, H * 0.48);
      var i;
      for (i = 0; i < 14; i++) {
        g.fillStyle = (Math.floor(t * 3) + i) % 2 ? "#fde68a" : "#fbbf24";
        g.beginPath(); g.arc(40 + i * ((W - 80) / 13), 92, 5, 0, 6.28); g.fill();
      }
      lights.forEach(function (L, i) {
        var lx = W * (L.x + Math.sin(t * 0.8 + i) * 0.12);
        var grd2 = g.createRadialGradient(lx, 130, 10, lx, 220, 140);
        grd2.addColorStop(0, L.c.replace(")", ",0.35)").replace("rgb", "rgba").indexOf("rgba") >= 0 ? L.c : hexA(L.c, 0.35));
        grd2.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = grd2; g.fillRect(lx - 140, 110, 280, 260);
      });
    }
    function hexA(h, a) {
      var r = parseInt(h.slice(1, 3), 16), gv = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
      return "rgba(" + r + "," + gv + "," + b + "," + a + ")";
    }

    function drawPads() {
      pads.forEach(function (p) {
        var sq = 1 - p.squash * 0.25;
        g.save();
        g.translate(p.x, p.y);
        g.scale(1 + p.squash * 0.08, sq);
        g.fillStyle = p.c;
        g.beginPath(); g.arc(0, 0, p.s / 2, 0, 6.28); g.fill();
        if (p.glow > 0) { g.strokeStyle = "#fff"; g.lineWidth = 6; g.stroke(); }
        g.font = (p.s * 0.45) + "px serif"; g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(p.e, 0, 0);
        g.restore();
      });
    }

    function drawCrowd() {
      crowd.forEach(function (c) {
        g.save();
        g.translate(c.x, c.y + Math.sin(t * 4 + c.ph) * 6);
        g.font = "22px serif"; g.textAlign = "center"; g.fillText(c.e, 0, 0);
        g.restore();
      });
    }

    function drawTitleBand() {
      drawStage();
      var i;
      for (i = 0; i < 4; i++) {
        g.save();
        g.translate(W * (0.2 + i * 0.2), H * 0.5 + Math.sin(t * 4 + i) * 10);
        g.scale(1, 1 - Math.abs(Math.sin(t * 4 + i)) * 0.2);
        g.font = "48px serif"; g.textAlign = "center"; g.fillText(ICONS[i], 0, 0);
        g.restore();
      }
      crowd.forEach(function (c) {
        g.font = "20px serif"; g.fillText(c.e, c.x, H * 0.78 + Math.sin(t * 5 + c.ph) * 6);
      });
      if (!crowd.length) for (i = 0; i < 10; i++) crowd.push({ x: rnd(20, 400), y: 0, e: "🧒", ph: i });
    }

    
    var rbAmb = { t: 0, bits: [], ok: 0, motes: [], walk: 0, sayI: 0 };
    var rbAmbE = ["🎵", "🎤", "🎧", "🌟", "🥁", "🎸", "🎺", "💜"];
    var rbAmbC = ["#f472b6", "#4c1d95", "#fde68a", "#60a5fa", "#fbcfe8"];
    var rbAmbL = ["Simon grows one note.", "Pads squash like marshmallows.", "Crowd bobs on the title.", "Helper replay never scolds.", "Lights sweep like ice cream.", "A miss just waits kindly.", "Finale uses sparkly bells.", "Encore means five songs."];
    function rbAmbBoot() {
      var i;
      rbAmb.bits = [];
      rbAmb.motes = [];
      rbAmb.ok = 1;
      for (i = 0; i < 28; i++) {
        rbAmb.bits.push({
          e: rbAmbE[i % rbAmbE.length],
          x: Math.random() * (W || 360),
          y: 70 + Math.random() * ((H || 640) * 0.22),
          vx: -12 + Math.random() * 24,
          ph: Math.random() * 6.28,
          s: 0.7 + Math.random() * 0.7
        });
      }
      for (i = 0; i < 40; i++) {
        rbAmb.motes.push({
          x: Math.random() * (W || 360),
          y: Math.random() * (H || 640),
          r: 1 + Math.random() * 2,
          ph: Math.random() * 6,
          c: rbAmbC[i % rbAmbC.length]
        });
      }
    }
    function rbAmbStep(dt) {
      if (!rbAmb.ok) rbAmbBoot();
      rbAmb.t += dt;
      rbAmb.walk += dt;
      rbAmb.bits.forEach(function (b) {
        b.x += b.vx * dt;
        b.ph += dt;
        if (b.x < -20) b.x = (W || 360) + 20;
        if (b.x > (W || 360) + 20) b.x = -20;
      });
      rbAmb.motes.forEach(function (m) { m.ph += dt * 1.4; });
      if (Math.floor(rbAmb.t * 0.35) !== rbAmb.sayI) rbAmb.sayI = Math.floor(rbAmb.t * 0.35);
    }
    function rbAmbFrame() {
      g.strokeStyle = rbAmbC[2];
      g.lineWidth = 7;
      g.strokeRect(3, 3, (W || 360) - 6, (H || 640) - 6);
      g.strokeStyle = "rgba(255,255,255,.18)";
      g.lineWidth = 2;
      g.strokeRect(9, 9, (W || 360) - 18, (H || 640) - 18);
    }
    function rbAmbMotes() {
      rbAmb.motes.forEach(function (m) {
        g.globalAlpha = 0.12 + 0.1 * Math.sin(m.ph);
        g.fillStyle = m.c;
        g.beginPath();
        g.arc(m.x, m.y, m.r, 0, 6.28);
        g.fill();
        g.globalAlpha = 1;
      });
    }
    function rbAmbFloaters() {
      rbAmb.bits.forEach(function (b) {
        g.save();
        g.globalAlpha = 0.55;
        g.translate(b.x, b.y + Math.sin(b.ph * 2) * 4);
        g.rotate(Math.sin(b.ph) * 0.2);
        g.font = (15 * b.s) + "px serif";
        g.textAlign = "center";
        g.fillText(b.e, 0, 0);
        g.restore();
        g.globalAlpha = 1;
      });
    }
    function rbAmbLanterns() {
      var i, x, y;
      for (i = 0; i < 7; i++) {
        x = 18 + i * (((W || 360) - 36) / 6);
        y = 22 + Math.sin(rbAmb.t * 3 + i) * 3;
        g.fillStyle = rbAmbC[i % rbAmbC.length];
        g.beginPath();
        g.arc(x, y, 4.5, 0, 6.28);
        g.fill();
        g.strokeStyle = "rgba(255,255,255,.35)";
        g.beginPath();
        g.moveTo(x, y + 4);
        g.lineTo(x, y + 12);
        g.stroke();
      }
    }
    function rbAmbWalkers() {
      var i, x;
      for (i = 0; i < 3; i++) {
        x = ((rbAmb.walk * 28 + i * 150) % ((W || 360) + 50)) - 25;
        g.save();
        g.translate(x, (H || 640) * 0.92);
        g.scale(1, 1 + Math.sin(rbAmb.walk * 8 + i) * 0.07);
        g.font = "18px serif";
        g.textAlign = "center";
        g.fillText(rbAmbE[i % rbAmbE.length], 0, 0);
        g.restore();
      }
    }
    function rbAmbCaption() {
      var msg = rbAmbL[rbAmb.sayI % rbAmbL.length];
      g.globalAlpha = 0.55;
      g.fillStyle = "#fff";
      g.font = "bold 11px Trebuchet MS";
      g.textAlign = "left";
      g.fillText(msg, 14, (H || 640) - 8);
      g.globalAlpha = 1;
    }
    function rbAmbRibbon() {
      g.save();
      g.translate((W || 360) / 2, 34);
      g.rotate(Math.sin(rbAmb.t * 2) * 0.03);
      g.fillStyle = rbAmbC[2];
      g.beginPath();
      g.moveTo(-74, -7);
      g.lineTo(74, -7);
      g.lineTo(82, 11);
      g.lineTo(-82, 11);
      g.closePath();
      g.fill();
      g.fillStyle = "#fff";
      g.font = "bold 11px Trebuchet MS";
      g.textAlign = "center";
      g.fillText(rbAmbL[(rbAmb.sayI + 1) % rbAmbL.length], 0, 6);
      g.restore();
    }
    function rbAmbHorizon() {
      var x;
      g.strokeStyle = rbAmbC[1];
      g.lineWidth = 2;
      g.globalAlpha = 0.2;
      g.beginPath();
      g.moveTo(0, (H || 640) * 0.8);
      for (x = 0; x <= (W || 360); x += 8) {
        g.lineTo(x, (H || 640) * 0.8 + Math.sin(x * 0.05 + rbAmb.t) * 4);
      }
      g.stroke();
      g.globalAlpha = 1;
    }
    function rbAmbVignette() {
      var grd = g.createRadialGradient((W||360)/2, (H||640)/2, (W||360)*0.35, (W||360)/2, (H||640)/2, (W||360)*0.75);
      grd.addColorStop(0, "rgba(0,0,0,0)");
      grd.addColorStop(1, "rgba(0,0,0,0.12)");
      g.fillStyle = grd;
      g.fillRect(0, 0, W || 360, H || 640);
    }
    function rbAmbPaint() {
      if (!rbAmb.ok) rbAmbBoot();
      rbAmbMotes();
      rbAmbFloaters();
      rbAmbLanterns();
      rbAmbHorizon();
      rbAmbWalkers();
      rbAmbRibbon();
      rbAmbCaption();
      rbAmbFrame();
      rbAmbVignette();
    }

    function rbAmbExtra1() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + rbAmb.t * 0.3 + 1;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 4);
        y = 46 + Math.sin(a * 2) * (6 + 1);
        g.globalAlpha = 0.22;
        g.fillStyle = rbAmbC[i % rbAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = rbAmbC[1 % rbAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 1) + Math.sin(i * 0.5 + rbAmb.t + 1) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function rbAmbExtra2() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + rbAmb.t * 0.4 + 2;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 8);
        y = 46 + Math.sin(a * 2) * (6 + 2);
        g.globalAlpha = 0.22;
        g.fillStyle = rbAmbC[i % rbAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = rbAmbC[2 % rbAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 2) + Math.sin(i * 0.5 + rbAmb.t + 2) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function rbAmbExtra3() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + rbAmb.t * 0.5 + 3;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 12);
        y = 46 + Math.sin(a * 2) * (6 + 3);
        g.globalAlpha = 0.22;
        g.fillStyle = rbAmbC[i % rbAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = rbAmbC[3 % rbAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 3) + Math.sin(i * 0.5 + rbAmb.t + 3) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function rbAmbExtra4() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + rbAmb.t * 0.6 + 4;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 16);
        y = 46 + Math.sin(a * 2) * (6 + 4);
        g.globalAlpha = 0.22;
        g.fillStyle = rbAmbC[i % rbAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = rbAmbC[4 % rbAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 4) + Math.sin(i * 0.5 + rbAmb.t + 4) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function rbAmbExtra5() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + rbAmb.t * 0.7 + 5;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 20);
        y = 46 + Math.sin(a * 2) * (6 + 5);
        g.globalAlpha = 0.22;
        g.fillStyle = rbAmbC[i % rbAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = rbAmbC[5 % rbAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 5) + Math.sin(i * 0.5 + rbAmb.t + 5) * 8;

    function update(dt) {
      rbAmbStep(typeof dt === 'number' ? dt : 0.016);
      t += dt;
      lights.forEach(function (L, i) { L.x = 0.3 + i * 0.4 + Math.sin(t * 0.7 + i) * 0.08; });
      pads.forEach(function (p) { p.squash = Math.max(0, p.squash - dt * 4); p.glow = Math.max(0, p.glow - dt * 2); });
      notes.forEach(function (n) { n.y -= 50 * dt; n.x += n.vx * dt; n.life -= dt; });
      notes = notes.filter(function (n) { return n.life > 0; });
      if (mode === "play") updateShow(dt);
    }

    function draw() {
      if (mode === "title" || mode === "win") { drawTitleBand(); return; }
      drawStage(); drawPads();
      notes.forEach(function (n) {
        g.globalAlpha = n.life; g.fillStyle = "#fde68a"; g.font = "22px serif";
        g.textAlign = "center"; g.fillText(n.e, n.x, n.y); g.globalAlpha = 1;
      });
      drawCrowd();
      rbAmbPaint();
      rbAmbExtra1();
      rbAmbExtra2();
      rbAmbExtra3();
      rbAmbExtra4();
      rbAmbExtra5();
      rbAmbExtra6();
      rbAmbExtra7();
      rbAmbExtra8();

    }

    function loop(now) {
      var dt = Math.min(0.033, (now - last) / 1000 || 0.016);
      last = now; update(dt); draw(); requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function start() {
      mode = "play"; song = 0; stars = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("st").textContent = "⭐ 0";
      loadSong(); beep(500, 0.1);
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = function () { document.getElementById("win").classList.add("off"); start(); };
    document.getElementById("replay").onclick = helper;
    cv.addEventListener("pointerdown", function (e) {
      if (mode !== "play" || phase !== "in") return;
      pads.forEach(function (p) {
        if (Math.hypot(e.clientX - p.x, e.clientY - p.y) < p.s / 2 + 8) playPad(p.i, 1);
      });
    });
