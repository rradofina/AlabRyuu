<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Rhythm Band</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../kid-sprites.js"></script>
  <style>
    html,body{background:#4c1d95}
    .pads{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:none;gap:12px;z-index:40;width:min(100% - 16px,320px);max-width:calc(100% - 16px);justify-content:center}
    .pads.on{display:flex}
    .pads button{flex:1 1 0;min-width:0;width:auto;height:110px;border-radius:24px;background:#fff;font-weight:900;box-shadow:0 8px 0 #2e1065}
    .pads button span{display:block;font-size:52px}
    .pads button.lit{outline:6px solid #fde047;background:#fde047}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="rd">1/5</b></div>
  <div id="say">Watch. Then copy!</div>
  <div style="position:fixed;inset:0;display:grid;place-items:center;font-size:120px;pointer-events:none" id="face">🥁</div>
  <div class="pads" id="pads">
    <button data-i="0"><span>🥁</span>Drum</button>
    <button data-i="1"><span>🎺</span>Horn</button>
    <button data-i="2"><span>🎸</span>Strum</button>
    <button data-i="3"><span>🎹</span>Keys</button>
  </div>
  <div class="cover" id="title">
    <div class="hero"><img src="../assets/sprites/rhythm-band/hero.png" alt="" width="96" height="96" /></div>
    <h1>Rhythm Band</h1>
    <p>Watch the glow. Tap the same!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🎉</div>
    <h1>Band star!</h1>
    <p>You copied every beat.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var SPR = {
      "🥁": kidSprite("rhythm-band/hero.png"),
      "🎺": kidSprite("rhythm-band/char1.png"),
      "🎸": kidSprite("rhythm-band/char2.png"),
      "🎹": kidSprite("rhythm-band/prop1.png"),
    };
    [].forEach.call(document.querySelectorAll("#pads button"), function (b) {
      var sp = b.querySelector("span");
      if (sp && SPR[sp.textContent]) kidFace(sp, sp.textContent, 52, SPR);
    });

    var seq = [], listen = false, step = 0, gen = 0, ICONS = ["🥁", "🎺", "🎸", "🎹"];
    var btns = [].slice.call(document.querySelectorAll("#pads button"));
    function light(i) {
      btns[i].classList.add("lit");
      kidFace(document.getElementById("face"), ICONS[i], 120, SPR);
      setTimeout(function () { btns[i].classList.remove("lit"); }, 700);
    }
    function playSeq() {
      var my = ++gen;
      listen = false; step = 0;
      document.getElementById("say").textContent = "Watch the glow...";
      var i = 0;
      function tick() {
        if (my !== gen) return;
        if (i >= seq.length) { listen = true; document.getElementById("say").textContent = "Your turn! Tap " + ICONS[seq[0]]; return; }
        light(seq[i]);
        document.getElementById("say").textContent = "Watch " + ICONS[seq[i]] + "  (" + (i + 1) + "/" + seq.length + ")";
        i++; setTimeout(tick, 1100);
      }
      setTimeout(tick, 700);
    }
    function nextRound() {
      seq.push((Math.random() * 4) | 0);
      document.getElementById("rd").textContent = seq.length + "/5";
      playSeq();
    }
    function start() {
      seq = []; round = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("pads").classList.add("on");
      nextRound();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    btns.forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute("data-i");
        kidNote(320 + i * 80);
        kidBoom(ICONS[i], innerWidth * 0.5, innerHeight * 0.42);
        if (!listen) { kidPing("Watch first!"); return; }
        light(i);
        if (i === seq[step]) {
          step++;
          kidPing(step < seq.length ? "Yes! Next " + ICONS[seq[step]] : "Yes!");
          if (step >= seq.length) {
            if (seq.length >= 5) {
              listen = false;
              kidYay();
              document.getElementById("pads").classList.remove("on");
              document.getElementById("win").classList.remove("off");
            } else {
              kidPing("Yes! Next song.");
              setTimeout(nextRound, 500);
            }
          }
        } else {
          kidPing("Oops. Watch again!");
          playSeq();
        }
      };
    });
  })();
  </script>
</body>
</html>
