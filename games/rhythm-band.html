<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Rhythm Band</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>
    html,body{background:#4c1d95}
    .pads{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:none;gap:12px;z-index:40}
    .pads.on{display:flex}
    .pads button{width:92px;height:110px;border-radius:24px;background:#fff;font-weight:900;box-shadow:0 8px 0 #2e1065}
    .pads button span{display:block;font-size:52px}
    .pads button.lit{outline:6px solid #fde047;background:#fde047}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="rd">1/3</b></div>
  <div id="say">Tap the yellow one!</div>
  <div style="position:fixed;inset:0;display:grid;place-items:center;font-size:120px;pointer-events:none" id="face">🥁</div>
  <div class="pads" id="pads">
    <button data-i="0"><span>🥁</span>Drum</button>
    <button data-i="1"><span>🎺</span>Horn</button>
    <button data-i="2"><span>🎸</span>Strum</button>
    <button data-i="3"><span>🎹</span>Keys</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🥁</div>
    <h1>Rhythm Band</h1>
    <p>Tap the yellow instrument!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🎉</div>
    <h1>Band star!</h1>
    <p>You copied every beat.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var seq = [], listen = false, step = 0, gen = 0, ICONS = ["🥁", "🎺", "🎸", "🎹"];
    var btns = [].slice.call(document.querySelectorAll("#pads button"));
    function showStep() {
      listen = true;
      btns.forEach(function (b) { b.classList.remove("lit"); });
      btns[seq[step]].classList.add("lit");
      document.getElementById("face").textContent = ICONS[seq[step]];
      document.getElementById("say").textContent = "Tap " + ICONS[seq[step]] + "!";
      document.getElementById("rd").textContent = seq.length + "/3";
    }
    function start() {
      seq = [(Math.random() * 4) | 0]; step = 0;
      kidBegin();
      document.getElementById("pads").classList.add("on");
      showStep();
    }
    kidBind(start);
    btns.forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute("data-i");
        kidNote(320 + i * 80);
        if (!listen) return;
        kidBoom(ICONS[i], innerWidth * 0.5, innerHeight * 0.42);
        if (i === seq[step]) {
          step++;
          if (step >= seq.length) {
            if (seq.length >= 3) {
              listen = false;
              document.getElementById("pads").classList.remove("on");
              kidFinish();
            } else {
              seq.push((Math.random() * 4) | 0);
              step = 0;
              showStep();
            }
          } else showStep();
        } else kidPing("Tap the yellow one!");
      };
    });
  })();
  </script>
</body>
</html>
