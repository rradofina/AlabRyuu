<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>My Avatar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background: #fce7f3; color: #831843; touch-action: none; user-select: none; -webkit-user-select: none; }
    button { background: transparent; border: 0; appearance: none; -webkit-appearance: none; -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer; }
    canvas { display: block; width: 100%; height: 100%; }
    .home { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; z-index: 8; color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; background: rgba(88,28,135,.45); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 7; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; pointer-events: none; }
    #hud b { font-weight: 800; font-size: 13px; background: #fff; color: #9d174d; padding: 6px 10px; border-radius: 999px; box-shadow: 0 3px 0 #f9a8d4; }
    #say { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 7; font-weight: 800; font-size: 16px; color: #9d174d; pointer-events: none; text-align: center; width: 92%; }
    #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: none; flex-direction: column; gap: 8px; padding: 8px 10px max(10px, env(safe-area-inset-bottom)); background: #fbcfe8; }
    #dock.on { display: flex; }
    #picks { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    #picks button { width: 52px; height: 52px; border-radius: 16px; background: #fff; font-size: 26px; box-shadow: 0 4px 0 #db2777; }
    #picks button.on { outline: 3px solid #831843; background: #fce7f3; }
    #nav { display: flex; gap: 8px; justify-content: center; }
    #nav button, #nameIn { font-weight: 800; }
    #nav button { background: #f472b6; color: #fff; padding: 12px 16px; border-radius: 999px; box-shadow: 0 5px 0 #9d174d; font-size: 16px; }
    #nameIn { width: min(220px, 70vw); font: inherit; font-size: 20px; text-align: center; padding: 10px; border-radius: 16px; border: 0; background: #fff; color: #831843; box-shadow: 0 4px 0 #f9a8d4; display: none; margin: 0 auto; }
    #nameIn.on { display: block; }
    #smile { display: none; height: 16px; border-radius: 999px; background: #fff; overflow: hidden; box-shadow: inset 0 0 0 2px #db2777; }
    #smile.on { display: block; }
    #smile i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f9a8d4, #db2777); }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px; background: linear-gradient(#f9a8d4, #c084fc); }
    .cover.off { display: none; }
    h1 { font-size: clamp(32px, 9vw, 48px); color: #fff; text-shadow: 0 4px 0 #9d174d; }
    .cover p { font-weight: 800; font-size: 18px; color: #fff; max-width: 320px; }
    .btn { background: #ffd166; color: #3b2100; font-weight: 800; font-size: 22px; padding: 14px 24px; border-radius: 999px; box-shadow: 0 7px 0 #e09f1f; }
    .btn.g { background: #86efac; box-shadow: 0 7px 0 #16a34a; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="st">Name</b><b id="sv">💾</b></div>
  <div id="say">Type a name. Then dress up!</div>
  <div id="dock">
    <input id="nameIn" maxlength="12" placeholder="Your name" />
    <div id="smile"><i id="smileF"></i></div>
    <div id="picks"></div>
    <div id="nav">
      <button id="back" type="button">Back</button>
      <button id="pose" type="button">Wave</button>
      <button id="next" type="button">Next</button>
    </div>
  </div>
  <div class="cover" id="title">
    <div style="font-size:76px">🧒</div>
    <h1>My Avatar</h1>
    <p>Pink dressing room. Wave. Hold a smile to unlock a hat. Then parade!</p>
    <button class="btn" id="go">Dress up</button>
  </div>
  <div class="cover off" id="win">
    <div style="font-size:76px">🎉</div>
    <h1>Parade star!</h1>
    <p id="winP">Saved your kid.</p>
    <button class="btn g" id="again">Dress again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, last = 0, t = 0, play = false, stage = 0, parade = 0;
    var holdSmile = false, smile = 0, hatOn = 0, waveT = 0, walk = 0;
    var conf = [], bulbs = [], pets = [], floats = [];
    var av = { name: "Alab", hair: "🧒", shirt: "#60a5fa", pet: "🐶", hat: "", pose: "wave" };
    try {
      var raw = JSON.parse(localStorage.getItem("alabryuu-avatar") || "null");
      if (raw && raw.hair) {
        av.name = raw.name || av.name;
        av.hair = raw.hair; av.shirt = raw.shirt || av.shirt;
        av.pet = raw.pet || av.pet; av.hat = raw.hat || ""; av.pose = raw.pose || "wave";
        if (av.hat) hatOn = 1;
      }
    } catch (e) {}

    var STAGES = [
      { n: "Name", kind: "name", hint: "Type your name. Tap Next." },
      { n: "Hair", kind: "pick", key: "hair", hint: "Pick a face. Watch the wave!", opts: ["🧒", "👧", "👦", "😃", "😄", "😊", "😎", "🤗"] },
      { n: "Shirt", kind: "color", key: "shirt", hint: "Tap a color. The shirt wiggles.", opts: ["#60a5fa", "#f472b6", "#4ade80", "#facc15", "#a78bfa", "#fb7185", "#22d3ee", "#fb923c"] },
      { n: "Pet", kind: "pick", key: "pet", hint: "Choose a pal. It bounces.", opts: ["🐶", "🐱", "🐰", "🦊", "🐼", "🐥", "🐸", "🦄"] },
      { n: "Smile hat", kind: "smile", hint: "Hold SMILE to unlock a hat!", opts: ["🎩", "👑", "🎀", "🧢", "🌸"] },
      { n: "Parade", kind: "parade", hint: "Walk the pink parade!" }
    ];

    function beep(f, d, typ) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        if (ac.state === "suspended") ac.resume();
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = typ || "sine"; o.frequency.value = f; g.gain.value = 0.08;
        o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function say(s) { document.getElementById("say").textContent = s; }
    function hud() {
      document.getElementById("st").textContent = STAGES[Math.min(stage, STAGES.length - 1)].n;
      document.getElementById("sv").textContent = "💾 " + av.name;
    }
    function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
    addEventListener("resize", resize); resize();

    function saveAv() {
      try { localStorage.setItem("alabryuu-avatar", JSON.stringify(av)); } catch (e) {}
    }

    function fillPicks() {
      var box = document.getElementById("picks");
      box.innerHTML = "";
      var st = STAGES[stage];
      document.getElementById("nameIn").classList.toggle("on", st.kind === "name");
      document.getElementById("smile").classList.toggle("on", st.kind === "smile");
      if (st.kind === "name") {
        document.getElementById("nameIn").value = av.name;
        return;
      }
      if (st.kind === "parade") return;
      if (!st.opts) return;
      st.opts.forEach(function (o, i) {
        var b = document.createElement("button");
        b.type = "button";
        if (st.kind === "color") { b.style.background = o; b.textContent = ""; }
        else b.textContent = o;
        var cur = av[st.key];
        if (st.kind === "smile") { if (av.hat === o) b.className = "on"; }
        else if (cur === o) b.className = "on";
        b.onclick = function () {
          if (st.kind === "smile") {
            if (!hatOn) { say("Hold the smile bar first!"); beep(200, 0.08); return; }
            av.hat = o; av.pose = "wave"; saveAv();
          } else {
            av[st.key] = o; saveAv();
          }
          waveT = 0.6; beep(640 + i * 20, 0.07); fillPicks(); hud();
        };
        box.appendChild(b);
      });
    }

    function start() {
      play = true; stage = 0; parade = 0; smile = 0; holdSmile = false;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      bulbs = []; floats = []; conf = [];
      var i;
      for (i = 0; i < 12; i++) bulbs.push({ a: i / 12, ph: i });
      for (i = 0; i < 8; i++) floats.push({ x: Math.random(), y: 0.1 + Math.random() * 0.2, e: ["💗", "✨", "🎀", "💜"][i % 4], ph: i });
      say(STAGES[0].hint); fillPicks(); hud(); beep(520, 0.1);
    }

    document.getElementById("nameIn").addEventListener("input", function () {
      av.name = this.value.slice(0, 12) || "Alab";
      saveAv(); hud();
    });
    document.getElementById("back").onclick = function () {
      if (stage > 0 && stage < 5) { stage--; fillPicks(); say(STAGES[stage].hint); hud(); beep(400, 0.06); }
    };
    document.getElementById("next").onclick = function () {
      if (stage === 4 && !hatOn) { say("Hold smile to unlock a hat!"); return; }
      if (stage < 5) {
        stage++;
        if (stage === 5) {
          parade = 1; walk = 0; av.pose = "walk"; saveAv();
          document.getElementById("picks").innerHTML = "";
          document.getElementById("nameIn").classList.remove("on");
          document.getElementById("smile").classList.remove("on");
          say("Parade time! Tap to toss confetti.");
        } else {
          fillPicks(); say(STAGES[stage].hint);
        }
        hud(); beep(700, 0.08);
      }
    };
    document.getElementById("pose").onclick = function () {
      if (av.pose === "wave") av.pose = "walk";
      else if (av.pose === "walk") av.pose = "sit";
      else av.pose = "wave";
      waveT = 0.5; saveAv(); beep(560, 0.06);
      say("Pose: " + av.pose);
    };
    document.getElementById("pose").addEventListener("pointerdown", function (e) {
      if (STAGES[stage].kind === "smile") { holdSmile = true; e.preventDefault(); }
    });
    addEventListener("pointerup", function () { holdSmile = false; });
    addEventListener("pointerdown", function (e) {
      if (e.target.closest && e.target.closest("a,button,input")) return;
      if (parade) {
        for (var i = 0; i < 12; i++) conf.push({ x: e.clientX, y: e.clientY, vx: (Math.random() - 0.5) * 160, vy: -80 - Math.random() * 80, life: 1, col: ["#f472b6", "#a78bfa", "#fde047", "#fff"][i % 4] });
        beep(800, 0.06);
      }
    });

    function update(dt) {
      t += dt;
      if (waveT > 0) waveT -= dt;
      var i;
      for (i = 0; i < floats.length; i++) floats[i].ph += dt;
      for (i = 0; i < bulbs.length; i++) bulbs[i].ph += dt * 3;
      for (i = conf.length - 1; i >= 0; i--) {
        conf[i].life -= dt; conf[i].x += conf[i].vx * dt; conf[i].y += conf[i].vy * dt; conf[i].vy += 180 * dt;
        if (conf[i].life <= 0) conf.splice(i, 1);
      }
      if (!play) return;
      if (STAGES[stage].kind === "smile" && holdSmile) {
        smile = Math.min(1, smile + dt * 0.45);
        document.getElementById("smileF").style.width = Math.round(smile * 100) + "%";
        if (smile >= 1 && !hatOn) {
          hatOn = 1; av.hat = av.hat || "👑"; av.pose = "wave"; saveAv();
          say("Hat unlocked! Pick one.");
          fillPicks(); beep(920, 0.14);
        }
      } else if (STAGES[stage].kind === "smile" && smile < 1) {
        smile = Math.max(0, smile - dt * 0.2);
        document.getElementById("smileF").style.width = Math.round(smile * 100) + "%";
      }
      if (parade) {
        walk += dt * 0.12;
        if (walk > 1.2) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("winP").textContent = av.name + " saved · " + av.hair + " " + (av.hat || "") + " " + av.pet;
          document.getElementById("win").classList.remove("off");
          saveAv(); beep(990, 0.2);
        }
      }
    }

    function drawKid(px, py, sc, pose) {
      var bob = pose === "sit" ? 8 : Math.sin(t * (pose === "walk" || parade ? 10 : 3)) * 4;
      var leg = pose === "walk" || parade ? Math.sin(t * 10) * 10 : 0;
      var arm = pose === "wave" || waveT > 0 ? Math.sin(t * 8) * 22 : (pose === "walk" || parade ? Math.sin(t * 10) * 14 : 6);
      x.save();
      x.translate(px, py + bob);
      x.scale(sc, sc);
      if (pose === "sit") x.scale(1, 0.88);
      x.strokeStyle = av.shirt; x.lineWidth = 7; x.lineCap = "round";
      x.beginPath(); x.moveTo(-12, 38); x.lineTo(-12 + leg, 68); x.stroke();
      x.beginPath(); x.moveTo(12, 38); x.lineTo(12 - leg, 68); x.stroke();
      x.fillStyle = av.shirt;
      x.beginPath(); if (x.roundRect) x.roundRect(-22, 8, 44, 36, 12); else x.rect(-22, 8, 44, 36); x.fill();
      x.beginPath(); x.moveTo(-22, 16); x.lineTo(-34, 8 - arm); x.stroke();
      x.beginPath(); x.moveTo(22, 16); x.lineTo(36, -4 - arm); x.stroke();
      x.fillStyle = "#fde68a";
      x.beginPath(); x.arc(0, -8, 22, 0, Math.PI * 2); x.fill();
      x.font = "36px serif"; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(av.hair, 0, -6);
      if (av.hat) {
        x.font = "28px serif";
        x.fillText(av.hat, 0, -34 + Math.sin(t * 3) * 2);
      }
      if (av.pet) {
        var pxp = 48 + Math.sin(t * 4) * 6, pyp = 40 + Math.abs(Math.sin(t * 6)) * 8;
        x.font = "28px serif";
        x.fillText(av.pet, pxp, pyp);
      }
      x.restore();
    }

    function drawRoom() {
      var g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#fce7f3"); g.addColorStop(0.5, "#fbcfe8"); g.addColorStop(1, "#e9d5ff");
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      var i, f;
      for (i = 0; i < floats.length; i++) {
        f = floats[i];
        x.font = "20px serif";
        x.fillText(f.e, f.x * W + Math.sin(f.ph) * 12, 70 + f.y * H + Math.cos(f.ph * 0.7) * 8);
      }
      var mx = W * 0.5, my = H * 0.38, mw = Math.min(240, W * 0.7), mh = mw * 1.05;
      x.fillStyle = "#db2777";
      x.beginPath(); x.ellipse(mx, my, mw * 0.52, mh * 0.52, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = "#fff";
      x.beginPath(); x.ellipse(mx, my, mw * 0.46, mh * 0.46, 0, 0, Math.PI * 2); x.fill();
      var grd = x.createRadialGradient(mx - 20, my - 30, 10, mx, my, mw * 0.46);
      grd.addColorStop(0, "#fff"); grd.addColorStop(1, "#fce7f3");
      x.fillStyle = grd;
      x.beginPath(); x.ellipse(mx, my, mw * 0.46, mh * 0.46, 0, 0, Math.PI * 2); x.fill();
      for (i = 0; i < bulbs.length; i++) {
        var a = bulbs[i].a * Math.PI * 2 - Math.PI / 2;
        var bx = mx + Math.cos(a) * mw * 0.54;
        var by = my + Math.sin(a) * mh * 0.54;
        x.fillStyle = Math.sin(bulbs[i].ph) > 0 ? "#fde047" : "#facc15";
        x.beginPath(); x.arc(bx, by, 6, 0, Math.PI * 2); x.fill();
        x.fillStyle = "rgba(253,224,71,.25)";
        x.beginPath(); x.arc(bx, by, 10, 0, Math.PI * 2); x.fill();
      }
      x.fillStyle = "#f9a8d4";
      x.fillRect(0, H * 0.72, W, H * 0.28);
      x.fillStyle = "#f472b6";
      for (i = 0; i < 8; i++) x.fillRect(i * (W / 8), H * 0.72, 4, H * 0.28);
    }

    function drawParade() {
      var g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#c084fc"); g.addColorStop(1, "#f9a8d4");
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      x.fillStyle = "#fde047";
      x.fillRect(0, H * 0.62, W, 18);
      var i;
      for (i = 0; i < 16; i++) {
        x.fillStyle = i % 2 ? "#fff" : "#111";
        x.fillRect(((i * 40 - walk * 200) % (W + 40)), H * 0.62, 20, 18);
      }
      x.fillStyle = "#f472b6";
      x.fillRect(0, H * 0.7, W, H * 0.3);
      for (i = 0; i < 10; i++) {
        x.font = "22px serif";
        x.fillText(["😃", "🥳", "👏", "🎉"][i % 4], (i * 70 - walk * 80) % (W + 40), H * 0.58 + Math.sin(t * 4 + i) * 6);
      }
      var px = W * (walk * 0.7 + 0.1);
      drawKid(px, H * 0.55, 1.1, "walk");
      x.fillStyle = "#831843"; x.font = "bold 22px Trebuchet MS"; x.textAlign = "center";
      x.fillText(av.name + "!", px, H * 0.48);
    }

    function draw() {
      if (parade) drawParade();
      else {
        drawRoom();
        drawKid(W * 0.5, H * 0.42, 1.25, av.pose);
        x.fillStyle = "#9d174d"; x.font = "bold 26px Trebuchet MS"; x.textAlign = "center";
        x.fillText(av.name, W * 0.5, H * 0.22);
      }
      var i;
      for (i = 0; i < conf.length; i++) {
        x.globalAlpha = Math.max(0, conf[i].life);
        x.fillStyle = conf[i].col;
        x.fillRect(conf[i].x, conf[i].y, 6, 6);
      }
      x.globalAlpha = 1;
      x.fillStyle = "#db2777";
      x.fillRect(16, 8, W - 32, 6);
      x.fillStyle = "#fde047";
      x.fillRect(16, 8, Math.min(W - 32, ((stage + (hatOn ? 0.3 : 0)) / 5) * (W - 32)), 6);
    }

    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt); draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
  })();
  </script>
</body>
</html>
