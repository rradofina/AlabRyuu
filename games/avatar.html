<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>My Avatar</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>
    html,body{background:#312e81;overflow:auto;touch-action:manipulation}
    .wrap{min-height:100%;padding:70px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .me{font-size:110px;line-height:1;width:160px;height:160px;border-radius:40px;display:grid;place-items:center;box-shadow:0 10px 0 rgba(0,0,0,.25)}
    h1{color:#fff;font-size:36px}
    .row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:420px}
    .row button{min-width:84px;min-height:84px;border-radius:22px;background:#fff;font-size:44px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
    .row button.on{outline:5px solid #ffd166}
    label{color:#fff;font-weight:800;font-size:20px}
    input{font:800 22px Trebuchet MS,sans-serif;padding:12px 16px;border-radius:16px;border:0;width:220px;text-align:center}
    .save{margin-top:8px}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div class="wrap">
    <div class="me" id="me" style="background:#ffd166">🧒</div>
    <h1 id="who">Alab</h1>
    <label>Name</label>
    <input id="name" maxlength="12" value="Alab" />
    <label>Hair</label>
    <div class="row" id="hairs">
      <button data-v="🧒">🧒</button>
      <button data-v="👧">👧</button>
      <button data-v="👦">👦</button>
      <button data-v="👶">👶</button>
    </div>
    <label>Shirt</label>
    <div class="row" id="shirts">
      <button data-v="#ffd166" style="background:#ffd166">👕</button>
      <button data-v="#86efac" style="background:#86efac">👕</button>
      <button data-v="#93c5fd" style="background:#93c5fd">👕</button>
      <button data-v="#f9a8d4" style="background:#f9a8d4">👕</button>
    </div>
    <label>Pet</label>
    <div class="row" id="pets">
      <button data-v="🐶">🐶</button>
      <button data-v="🐱">🐱</button>
      <button data-v="🦊">🦊</button>
      <button data-v="🐼">🐼</button>
    </div>
    <button class="play save" id="save">That's me!</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero" id="winE">🧒</div>
    <h1 id="winT">That's you!</h1>
    <p>Saved for the hub.</p>
    <button class="play g" id="again">Change more</button>
  </div>
  <script>
  (function () {
    var av = { name: "Alab", hair: "🧒", shirt: "#ffd166", pet: "🐶" };
    try {
      var raw = JSON.parse(localStorage.getItem("alabryuu-avatar") || "null");
      if (raw && raw.name) { av.name = raw.name; av.hair = raw.hair || av.hair; av.shirt = raw.shirt || av.shirt; av.pet = raw.pet || av.pet; }
    } catch (e) {}
    function paint() {
      document.getElementById("me").textContent = av.hair;
      document.getElementById("me").style.background = av.shirt;
      document.getElementById("who").textContent = av.name + " " + av.pet;
      document.getElementById("name").value = av.name;
      mark("hairs", av.hair); mark("shirts", av.shirt); mark("pets", av.pet);
    }
    function mark(id, val) {
      [].forEach.call(document.getElementById(id).children, function (b) {
        b.classList.toggle("on", b.getAttribute("data-v") === val);
      });
    }
    function bind(id, key) {
      document.getElementById(id).addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        av[key] = b.getAttribute("data-v");
        paint();
      });
    }
    bind("hairs", "hair"); bind("shirts", "shirt"); bind("pets", "pet");
    document.getElementById("name").oninput = function () { av.name = this.value || "Alab"; paint(); };
    document.getElementById("save").onclick = function () {
      try { localStorage.setItem("alabryuu-avatar", JSON.stringify(av)); } catch (e) {}
      document.getElementById("winE").textContent = av.hair;
      document.getElementById("winT").textContent = av.name + "!";
      document.getElementById("win").classList.remove("off");
    };
    document.getElementById("again").onclick = function () { document.getElementById("win").classList.add("off"); };
    paint();
  })();
  </script>
</body>
</html>
