<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pancake Flip</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#fdba74}</style>
</head>
<body>
<script>
kidChrome({
  title: "Pancake Flip",
  hero: "🥞",
  blurb: "Tap when the pancake turns gold!",
  say: "Wait for gold, then tap!",
  hud: "🥞 0/5",
  winHero: "😋",
  winTitle: "Yum!",
  winText: "Five gold flips.",
  again: "Flip again",
  bg: "#fdba74",
  extra: '<div class="dock" id="tools"><button id="flip"><span>🥞</span>Flip</button></div>'
});
(function () {
  var S = kidStage();
  var play = false, n = 0, heat = 0, mood = "";
  function stage() { return heat < 0.5 ? "raw" : (heat < 1.55 ? "gold" : "dark"); }
  function face() { var s = stage(); return s === "gold" ? "🥞" : (s === "raw" ? "🟡" : "🟤"); }
  function note(key, msg) { if (mood === key) return; mood = key; kidSay(msg); }
  function flip() {
    if (!play) return;
    var s = stage();
    if (s === "gold") {
      n++; heat = 0; mood = "";
      kidTap("🥞", n >= 5 ? "Breakfast!" : "Gold!  " + n + "/5", S.W * 0.5, S.H * 0.4, 560);
      if (kidMark(n, 5, "🥞")) { play = false; kidFinish("Five gold flips."); }
      else note("raw", "Wait for gold...");
    } else if (s === "raw") kidMiss("🟡", "Not yet. Wait for gold!", S.W * 0.5, S.H * 0.4);
    else { heat = 0; mood = ""; kidMiss("🟤", "A little dark. Try again!", S.W * 0.5, S.H * 0.4); }
  }
  function start() { play = true; n = 0; heat = 0; mood = ""; kidBegin("Wait for gold!", "🥞 0/5"); kidDock(true); }
  kidBind(start);
  document.getElementById("flip").onclick = flip;
  S.cv.addEventListener("pointerdown", function (e) {
    if (kidPt(e, S.cv).y > S.H - 140) return;
    flip();
  });
  kidTick(function (dt) {
    if (play) {
      heat += dt;
      if (heat > 2.1) { heat = 0; mood = ""; note("late", "Too dark. Watch again!"); }
      else if (stage() === "gold") note("gold", "FLIP!");
      else if (heat < 0.12) note("raw", "Wait for gold...");
    }
    S.bg("#ffedd5");
    S.em("🍳", S.W * 0.5, S.H * 0.58, 160);
    var bob = Math.sin(heat * 9) * (stage() === "gold" ? 12 : 2);
    S.em(face(), S.W * 0.5, S.H * 0.44 + bob, stage() === "gold" ? 128 : 104);
  });
})();
</script>
</body>
</html>
