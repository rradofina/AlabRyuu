<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Yo-yo</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#ddd6fe}</style>
</head>
<body>
<script>
kidChrome({
  title: "Yo-yo",
  hero: "🪀",
  blurb: "Tap when the yo-yo is at the bottom!",
  say: "Wait for the bottom!",
  hud: "🪀 0/8",
  winHero: "🎉",
  winTitle: "Nice loops!",
  winText: "Eight bottom taps.",
  again: "Spin again",
  bg: "#ddd6fe"
});
(function () {
  var S = kidStage();
  var play = false, n = 0, t = 0, cool = 0, said = "";
  function phase() { return (Math.sin(t * 3.1) + 1) / 2; }
  function yoyoY() { return S.H * 0.16 + phase() * S.H * 0.58; }
  function note(key, msg) { if (said === key) return; said = key; kidSay(msg); }
  function tap() {
    if (!play || cool > 0) return;
    if (phase() > 0.82) {
      n++; cool = 0.45; said = "";
      kidTap("🪀", "Loop!  " + n + "/8", S.W * 0.5, yoyoY(), 620);
      if (kidMark(n, 8, "🪀")) { play = false; kidFinish("Eight bottom taps."); }
    } else kidMiss("👆", "Wait for the bottom!", S.W * 0.5, yoyoY());
  }
  function start() { play = true; n = 0; t = 0; cool = 0; said = ""; kidBegin("Wait for the bottom!", "🪀 0/8"); }
  kidBind(start);
  S.cv.addEventListener("pointerdown", tap);
  kidTick(function (dt) {
    t += dt; if (cool > 0) cool -= dt;
    if (play) note(phase() > 0.82 ? "go" : "wait", phase() > 0.82 ? "TAP!" : "Wait...");
    S.bg("#ede9fe");
    var y = yoyoY();
    S.ctx.strokeStyle = "#6d28d9"; S.ctx.lineWidth = 6;
    S.ctx.beginPath(); S.ctx.moveTo(S.W * 0.5, 70); S.ctx.lineTo(S.W * 0.5, y - 20); S.ctx.stroke();
    S.em("✋", S.W * 0.5, 78, 72);
    S.em("🪀", S.W * 0.5, y, phase() > 0.82 ? 120 : 96);
  });
})();
</script>
</body>
</html>
