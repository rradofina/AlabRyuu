<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Balloon Pop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      background: #7dd3fc; color: #0f172a;
      touch-action: manipulation; user-select: none;
    }
    button {
      background: transparent; border: 0; appearance: none; -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer;
    }
    .home {
      position: fixed; top: 12px; left: 12px; z-index: 12;
      color: #fff; text-decoration: none; font-weight: 800; font-size: 18px;
      background: rgba(0,0,0,.28); padding: 8px 14px; border-radius: 999px;
    }
    #hud {
      position: fixed; top: 12px; right: 12px; z-index: 12;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    }
    #hud span {
      font-weight: 800; background: rgba(255,255,255,.55);
      padding: 6px 12px; border-radius: 16px; font-size: 15px;
    }
    #sky {
      position: fixed; inset: 0;
      background: linear-gradient(#7dd3fc 0 55%, #86efac 55% 78%, #fde68a 78%);
    }
    #bunting {
      position: absolute; top: 52px; left: 0; right: 0; height: 54px;
      display: flex; justify-content: center; pointer-events: none;
    }
    #bunting i {
      width: 0; height: 0; display: block;
      border-left: 16px solid transparent; border-right: 16px solid transparent;
      border-top: 28px solid #ef4444; margin: 0 1px;
    }
    #bunting i:nth-child(2n) { border-top-color: #3b82f6; }
    #bunting i:nth-child(3n) { border-top-color: #facc15; }
    #bunting i:nth-child(4n) { border-top-color: #22c55e; }
    #bunting i:nth-child(5n) { border-top-color: #a855f7; }
    #tents {
      position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
      pointer-events: none;
      background:
        linear-gradient(120deg, transparent 40%, #ef4444 40% 60%, transparent 60%) 8% 100% / 90px 90px no-repeat,
        linear-gradient(120deg, transparent 40%, #3b82f6 40% 60%, transparent 60%) 78% 100% / 80px 80px no-repeat,
        linear-gradient(#fde68a, #fbbf24);
    }
    #banner {
      position: fixed; top: 108px; left: 50%; transform: translateX(-50%);
      z-index: 4; min-width: 200px; text-align: center;
      background: #fff; border-radius: 18px; padding: 8px 18px 10px;
      box-shadow: 0 6px 0 rgba(0,0,0,.15); font-weight: 800; font-size: 22px;
    }
    #banner .swatch {
      display: inline-block; width: 28px; height: 28px; border-radius: 50%;
      vertical-align: middle; margin-right: 8px; border: 3px solid #0f172a;
    }
    #combo {
      position: fixed; top: 168px; left: 0; right: 0; text-align: center;
      font-weight: 800; font-size: 26px; color: #be123c;
      opacity: 0; pointer-events: none; z-index: 5;
    }
    #combo.on { opacity: 1; }
    .bal {
      position: absolute; width: 72px; height: 92px;
    }
    .bal i {
      display: block; width: 64px; height: 74px; margin: 0 auto;
      border-radius: 50% 50% 50% 50% / 42% 42% 58% 58%;
      box-shadow: inset -8px -6px 0 rgba(0,0,0,.12), 0 4px 0 rgba(0,0,0,.12);
    }
    .bal::after {
      content: ""; position: absolute; left: 50%; bottom: 2px;
      width: 2px; height: 16px; background: #57534e;
    }
    .bal.rain i {
      background: linear-gradient(180deg,#ef4444,#f97316,#facc15,#22c55e,#3b82f6,#a855f7);
    }
    .bal.wig { animation: wig .35s; }
    @keyframes wig { 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
    .popbit {
      position: absolute; font-size: 28px; pointer-events: none; font-weight: 800;
    }
    .cover {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; z-index: 20; gap: 10px; text-align: center; padding: 24px;
      background: linear-gradient(#7dd3fc, #f9a8d4 50%, #fde047); color: #0f172a;
    }
    .cover.off { display: none; }
    .cover h1 { font-size: clamp(34px, 9vw, 52px); }
    .cover p { font-weight: 800; font-size: 18px; max-width: 320px; }
    .play {
      background: #ffd166; color: #3b2100; font-weight: 800; font-size: 28px;
      padding: 14px 32px; border-radius: 999px; box-shadow: 0 7px 0 #e09f1f;
    }
    .play:active { transform: translateY(4px); box-shadow: 0 3px 0 #e09f1f; }
    .starrow { font-size: 36px; letter-spacing: 4px; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud">
    <span id="score">Pops 0 / 8</span>
    <span id="comboHud">Combo 0</span>
    <span id="waveHud">Wave 1 / 3</span>
  </div>
  <div id="sky">
    <div id="bunting"></div>
    <div id="tents"></div>
  </div>
  <div id="banner"><i class="swatch" id="swatch"></i><span id="ask">Pop RED</span></div>
  <div id="combo"></div>
  <div class="cover" id="start">
    <div style="font-size:72px">🎈</div>
    <h1>Balloon Pop</h1>
    <p>Pop the color on the banner. Rainbow counts as any!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="mid">
    <div style="font-size:64px">🎉</div>
    <h1 id="midTitle">Wave done!</h1>
    <p id="midLine"></p>
    <div class="starrow" id="midStars"></div>
    <button class="play" id="next">Next wave</button>
  </div>
  <div class="cover off" id="win">
    <div style="font-size:72px">🎊</div>
    <h1>Pop party!</h1>
    <p>What a festival!</p>
    <div class="starrow" id="winStars">⭐⭐⭐</div>
    <button class="play" id="again">Play again</button>
  </div>
  <script>
    function beep(f, d) {
      try {
        var c = window._ac || (window._ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = c.createOscillator(), g = c.createGain();
        o.frequency.value = f; g.gain.value = 0.11;
        o.connect(g); g.connect(c.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
        o.stop(c.currentTime + d);
      } catch (e) {}
    }
    var ALL = [
      { n: "RED", c: "#ef4444" },
      { n: "BLUE", c: "#3b82f6" },
      { n: "YELLOW", c: "#facc15" },
      { n: "GREEN", c: "#22c55e" },
      { n: "PURPLE", c: "#a855f7" }
    ];
    var WAVES = [
      { colors: 3, need: 8 },
      { colors: 4, need: 10 },
      { colors: 5, need: 12 }
    ];
    var wave = 0, score = 0, need = 8, combo = 0, comboMax = 0, needCol = ALL[0];
    var play = false, items = [], acc = 0, rainbows = 0, palette = ALL.slice(0, 3);
    var sky = document.getElementById("sky");

    (function bunting() {
      var b = document.getElementById("bunting");
      for (var i = 0; i < 16; i++) b.appendChild(document.createElement("i"));
    })();

    function hud() {
      document.getElementById("score").textContent = "Pops " + score + " / " + need;
      document.getElementById("comboHud").textContent = "Combo " + combo;
      document.getElementById("waveHud").textContent = "Wave " + (wave + 1) + " / 3";
    }
    function setNeed() {
      needCol = palette[Math.floor(Math.random() * palette.length)];
      document.getElementById("ask").textContent = "Pop " + needCol.n;
      document.getElementById("swatch").style.background = needCol.c;
      document.getElementById("banner").style.border = "6px solid " + needCol.c;
    }
    function toast(t) {
      var el = document.getElementById("combo");
      el.textContent = t; el.classList.add("on");
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { el.classList.remove("on"); }, 800);
    }
    function spawn() {
      if (!play) return;
      var rain = Math.random() < 0.12;
      var col = palette[Math.floor(Math.random() * palette.length)];
      var b = document.createElement("button");
      b.className = "bal" + (rain ? " rain" : "");
      b.innerHTML = "<i></i>";
      if (!rain) b.querySelector("i").style.background = col.c;
      var x = 16 + Math.random() * (innerWidth - 90);
      var y = innerHeight + 10;
      var sp = 1.3 + Math.random() * 1.5;
      b.style.left = x + "px"; b.style.top = y + "px";
      sky.appendChild(b);
      var it = { el: b, x: x, y: y, sp: sp, col: col, rain: rain, dead: false };
      b.onclick = function () {
        if (!play || it.dead) return;
        var ok = rain || col.n === needCol.n;
        if (!ok) {
          b.classList.remove("wig"); void b.offsetWidth; b.classList.add("wig");
          combo = 0; hud(); beep(180, 0.1);
          return;
        }
        it.dead = true; b.remove();
        score++;
        if (rain) rainbows++;
        if (col.n === needCol.n || rain) {
          combo++;
          if (combo > comboMax) comboMax = combo;
          if (combo >= 2) toast((rain ? "Rainbow! " : "") + "Combo x" + combo);
        }
        var bit = document.createElement("div");
        bit.className = "popbit"; bit.textContent = rain ? "🌈" : "💥";
        bit.style.left = x + "px"; bit.style.top = it.y + "px";
        sky.appendChild(bit);
        setTimeout(function () { bit.remove(); }, 400);
        beep(rain ? 860 : 720, 0.08);
        hud();
        if (score >= need) endWave();
        else if (combo === 0 || combo % 2 === 0) setNeed();
      };
      items.push(it);
    }
    function endWave() {
      play = false;
      items.forEach(function (it) { if (!it.dead) it.el.remove(); });
      items = [];
      var stars = 1 + (comboMax >= 3 ? 1 : 0) + (rainbows > 0 ? 1 : 0);
      if (stars > 3) stars = 3;
      var row = "⭐".repeat(stars) + "☆".repeat(3 - stars);
      if (wave >= 2) {
        document.getElementById("winStars").textContent = row;
        document.getElementById("win").classList.remove("off");
        beep(900, 0.2);
      } else {
        document.getElementById("midTitle").textContent = "Wave " + (wave + 1) + " party!";
        document.getElementById("midLine").textContent = "More colors next.";
        document.getElementById("midStars").textContent = row;
        document.getElementById("mid").classList.remove("off");
        beep(820, 0.16);
      }
    }
    function startWave() {
      var w = WAVES[wave];
      palette = ALL.slice(0, w.colors);
      need = w.need; score = 0; combo = 0; items = []; acc = 0;
      setNeed(); hud(); play = true;
    }
    function loop() {
      acc++;
      if (play && acc % 32 === 0) spawn();
      items.forEach(function (it) {
        if (it.dead) return;
        it.y -= it.sp;
        it.el.style.top = it.y + "px";
        if (it.y < -100) { it.dead = true; it.el.remove(); }
      });
      items = items.filter(function (it) { return !it.dead; });
      requestAnimationFrame(loop);
    }
    document.getElementById("go").onclick = function () {
      document.getElementById("start").classList.add("off");
      wave = 0; comboMax = 0; rainbows = 0;
      startWave(); beep(520, 0.1);
    };
    document.getElementById("next").onclick = function () {
      document.getElementById("mid").classList.add("off");
      wave++; startWave(); beep(600, 0.1);
    };
    document.getElementById("again").onclick = function () {
      document.getElementById("win").classList.add("off");
      document.getElementById("start").classList.remove("off");
    };
    loop();
  </script>
</body>
</html>
