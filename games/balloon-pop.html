<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Balloon Pop</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:#e0f2fe;color:#0f172a;overflow:hidden;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    #ask{position:fixed;top:54px;left:0;right:0;text-align:center;font-weight:800;font-size:26px;z-index:2}
    #hud{position:fixed;top:12px;right:12px;font-weight:800;background:#fff3;padding:8px 12px;border-radius:16px}
    #sky{position:fixed;inset:0}
    .bal{position:absolute;width:76px;height:90px;font-size:56px;line-height:90px}
    .bal.wig{animation:wig .35s}
    @keyframes wig{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(20,20,50,.84);z-index:8;gap:12px;color:#fff}
    .win.on{display:flex}
    .play{background:#ffd166;color:#3b2100;font-weight:800;font-size:26px;padding:14px 28px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud">0 / 10</div>
  <div id="ask">Pop RED</div>
  <div id="sky"></div>
  <div class="win" id="win">
    <div style="font-size:72px">🎈</div>
    <h2>Pop party!</h2>
    <button class="play" id="again">Pop again</button>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var cols=[{n:"RED",e:"🔴"},{n:"BLUE",e:"🔵"},{n:"YELLOW",e:"🟡"},{n:"GREEN",e:"🟢"}];
    var need=cols[0],score=0,play=true,items=[],sky=document.getElementById("sky");
    function setNeed(){need=cols[Math.floor(Math.random()*cols.length)];document.getElementById("ask").textContent="Pop "+need.n;}
    function spawn(){
      var c=cols[Math.floor(Math.random()*cols.length)];
      var b=document.createElement("button");b.className="bal";b.textContent=c.e;
      var x=20+Math.random()*(innerWidth-80),y=innerHeight+10,sp=1.4+Math.random()*1.6;
      b.style.left=x+"px";b.style.top=y+"px";sky.appendChild(b);
      var it={el:b,x:x,y:y,sp:sp,c:c,dead:false};
      b.onclick=function(){
        if(!play||it.dead)return;
        if(c.n!==need.n){b.classList.remove("wig");void b.offsetWidth;b.classList.add("wig");beep(180,.1);return;}
        it.dead=true;b.remove();score++;beep(720,.08);document.getElementById("hud").textContent=score+" / 10";
        if(score>=10){play=false;document.getElementById("win").classList.add("on");beep(900,.2);} else setNeed();
      };
      items.push(it);
    }
    var t=0;
    function loop(){
      t++;if(play&&t%36===0)spawn();
      items.forEach(function(it){if(it.dead)return;it.y-=it.sp;it.el.style.top=it.y+"px";if(it.y<-80){it.dead=true;it.el.remove();}});
      items=items.filter(function(it){return !it.dead;});
      requestAnimationFrame(loop);
    }
    setNeed();loop();
    document.getElementById("again").onclick=function(){location.reload();};
  </script>
</body>
</html>
