<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Balloon Pop</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#7dd3fc}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="got">0/8</b></div>
  <div id="say">Pop the red ones! 🔴</div>
  <div class="cover" id="title">
    <div class="hero">🎈</div>
    <h1>Balloon Pop</h1>
    <p>Pop only the color we ask!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🎉</div>
    <h1>Pop party!</h1>
    <p>Eight right pops.</p>
    <button class="play g" id="again">Pop again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, n = 0;
    var want = "🔴", balls = [];
    var SET = [
      { e: "🔴", n: "red" }, { e: "🟡", n: "yellow" }, { e: "🔵", n: "blue" }, { e: "🟢", n: "green" }
    ];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function spawn() {
      var s = SET[(Math.random() * SET.length) | 0];
      balls.push({ e: s.e, x: 50 + Math.random() * (W - 100), y: H + 20, vy: 70 + Math.random() * 40 });
    }
    function start() {
      play = true; n = 0; balls = []; want = "🔴";
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("got").textContent = "0/8";
      document.getElementById("say").textContent = "Pop the red ones! 🔴";
      for (var i = 0; i < 5; i++) {
        var e = i < 2 ? "🔴" : SET[(1 + i) % SET.length].e;
        balls.push({ e: e, x: 50 + i * 70, y: H * 0.35 + (i % 3) * 90, vy: 28 + i * 4 });
      }
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      for (var i = balls.length - 1; i >= 0; i--) {
        var dx = kidPt(e, cv).x - balls[i].x, dy = kidPt(e, cv).y - balls[i].y;
        if (dx * dx + dy * dy < 72 * 72) {
          if (balls[i].e === want) {
            balls.splice(i, 1); n++;
            document.getElementById("got").textContent = n + "/8";
            document.getElementById("say").textContent = "Pop!";
            if (n === 4) { want = "🟡"; document.getElementById("say").textContent = "Now yellow! 🟡"; }
            if (n >= 8) { play = false; document.getElementById("win").classList.remove("off"); }
          } else {
            document.getElementById("say").textContent = "Not that color. " + want;
          }
          return;
        }
      }
    });
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      x.fillStyle = "#7dd3fc"; x.fillRect(0, 0, W, H);
      em("☁️", 60, 90, 56); em("☁️", W - 50, 120, 64);
      if (play) {
        if (balls.length < 5 && Math.random() < 0.04) spawn();
        balls.forEach(function (b) { b.y -= b.vy * dt; });
        balls = balls.filter(function (b) { return b.y > -40; });
      }
      balls.forEach(function (b) { em(b.e, b.x, b.y, 80); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
