<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Balloon Pop</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#7dd3fc}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="got">0/8</b></div>
  <div id="say">Pop the red ones! 🔴</div>
  <div class="cover" id="title">
    <div class="hero">🎈</div>
    <h1>Balloon Pop</h1>
    <p>Pop only the color we ask!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🎉</div>
    <h1>Pop party!</h1>
    <p>Eight right pops.</p>
    <button class="play g" id="again">Pop again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, n = 0;
    var want = "🔴", balls = [];
    var SET = [
      { e: "🔴", n: "red" }, { e: "🟡", n: "yellow" }, { e: "🔵", n: "blue" }, { e: "🟢", n: "green" }
    ];
    function em(ch, px, py, s) { kidEm(x, ch, px, py, s); }
    function resize() { var b = kidFit(cv, x); W = b.W; H = b.H; }
    addEventListener("resize", resize); resize();
    function spawn() {
      var s = SET[(Math.random() * SET.length) | 0];
      balls.push({ e: s.e, x: 50 + Math.random() * (W - 100), y: H + 20, vy: 70 + Math.random() * 40 });
    }
    function start() {
      play = true; n = 0; balls = []; want = "🔴";
      kidBegin();
      document.getElementById("got").textContent = "0/8";
      document.getElementById("say").textContent = "Pop the red ones! 🔴";
      for (var i = 0; i < 5; i++) {
        var e = i < 2 ? "🔴" : SET[(1 + i) % SET.length].e;
        balls.push({ e: e, x: 50 + i * 70, y: H * 0.35 + (i % 3) * 90, vy: 28 + i * 4 });
      }
    }
    kidBind(start);
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var p = kidPt(e, cv), i, best = -1, bestD = 120 * 120;
      for (i = balls.length - 1; i >= 0; i--) {
        var dx = p.x - balls[i].x, dy = p.y - balls[i].y, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best < 0) {
        for (i = 0; i < balls.length; i++) if (balls[i].e === want) { best = i; break; }
      }
      if (best < 0) { kidTap(want, "Pop " + want + "!", innerWidth * 0.5, innerHeight * 0.4, 300); return; }
      if (balls[best].e === want) {
        var hit = balls.splice(best, 1)[0]; n++;
        document.getElementById("got").textContent = n + "/8";
        kidTap("💥", n === 4 ? "Now yellow! 🟡" : "Pop!  " + n + "/8", hit.x, hit.y, 520);
        if (n === 4) want = "🟡";
        if (n >= 8) { play = false; kidFinish(); }
      } else kidTap(balls[best].e, "Not that color. " + want, balls[best].x, balls[best].y, 240);
    });
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      x.fillStyle = "#7dd3fc"; x.fillRect(0, 0, W, H);
      em("☁️", 60, 90, 56); em("☁️", W - 50, 120, 64);
      if (play) {
        if (balls.length < 5 && Math.random() < 0.06) spawn();
        if (!balls.some(function (b) { return b.e === want; })) {
          balls.push({ e: want, x: 60 + Math.random() * (W - 120), y: H * 0.55, vy: 24 });
        }
        balls.forEach(function (b) { b.y -= b.vy * dt; });
        balls = balls.filter(function (b) { return b.y > -40; });
      }
      balls.forEach(function (b) { em(b.e, b.x, b.y, 96); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
