<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Duck Pond</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <style>html,body{background:#0369a1}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="bb">🐥 0/5</b></div>
  <div id="say">Tap reeds. Find baby ducks!</div>
  <div class="cover" id="title">
    <div class="hero">🦆</div>
    <h1>Duck Pond</h1>
    <p>Mama lost 5 babies. Find them!</p>
    <button class="play" id="go" autofocus>Seek</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🐥</div>
    <h1>Family!</h1>
    <p>All the babies came back.</p>
    <button class="play g" id="again">Seek again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, n = 0, reeds = [];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; n = 0;
      reeds = [
        { x: 0.18, y: 0.42, baby: 1, got: 0 },
        { x: 0.42, y: 0.36, baby: 0, got: 0 },
        { x: 0.68, y: 0.44, baby: 1, got: 0 },
        { x: 0.28, y: 0.64, baby: 1, got: 0 },
        { x: 0.55, y: 0.70, baby: 0, got: 0 },
        { x: 0.80, y: 0.62, baby: 1, got: 0 },
        { x: 0.48, y: 0.54, baby: 1, got: 0 }
      ];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("bb").textContent = "🐥 0/5";
      document.getElementById("say").textContent = "Tap the reeds!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var p = kidPt(e, cv), best = null, bestD = 90 * 90, i;
      for (i = 0; i < reeds.length; i++) {
        if (reeds[i].got) continue;
        var dx = p.x - reeds[i].x * W, dy = p.y - reeds[i].y * H, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = reeds[i]; }
      }
      if (!best) {
        for (i = 0; i < reeds.length; i++) if (!reeds[i].got) { best = reeds[i]; break; }
      }
      if (!best) return;
      best.got = 1;
      if (best.baby) {
        n++;
        document.getElementById("bb").textContent = "🐥 " + n + "/5";
        kidTap("🐥", "Peep peep!  " + n + "/5", best.x * innerWidth, best.y * innerHeight, 540);
        if (n >= 5) { play = false; kidYay(); document.getElementById("win").classList.remove("off"); }
      } else kidTap("🌾", "Just reeds. Keep looking!", best.x * innerWidth, best.y * innerHeight, 260);
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#38bdf8"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#4ade80"; x.fillRect(0, 0, W, 90);
      em("🦆", W * 0.5, 130, 80);
      reeds.forEach(function (r) {
        if (r.got && r.baby) em("🐥", r.x * W, r.y * H, 80);
        else em("🌾", r.x * W, r.y * H + Math.sin(t * 2 + r.x) * 3, 88);
      });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
