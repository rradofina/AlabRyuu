<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bubble Bath</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <style>html,body{background:#7dd3fc}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="pp">🫧 0/12</b></div>
  <div id="say">Pop bubbles. Wash the duck!</div>
  <div class="cover" id="title">
    <div class="hero">🛁</div>
    <h1>Bubble Bath</h1>
    <p>Pop 12 bubbles. Duck gets clean!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🦆</div>
    <h1>Squeaky clean!</h1>
    <p>The duck is shiny.</p>
    <button class="play g" id="again">Bath again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, n = 0, bubbles = [];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function spawn() { bubbles.push({ x: 40 + Math.random() * (W - 80), y: H * 0.72, vy: 40 + Math.random() * 50 }); }
    function start() {
      play = true; n = 0; bubbles = [];
      for (var i = 0; i < 5; i++) bubbles.push({ x: 50 + i * 70, y: H * 0.35 + (i % 2) * 80, vy: 45 });
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("pp").textContent = "🫧 0/12";
      document.getElementById("say").textContent = "Pop the bubbles!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var p = kidPt(e, cv), i, best = -1, bestD = 85 * 85;
      for (i = bubbles.length - 1; i >= 0; i--) {
        var dx = p.x - bubbles[i].x, dy = p.y - bubbles[i].y, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best < 0 && bubbles.length) best = 0;
      if (best < 0) { spawn(); kidTap("🫧", "Pop a bubble!", innerWidth * 0.5, innerHeight * 0.45, 400); return; }
      var hit = bubbles.splice(best, 1)[0]; n++;
      document.getElementById("pp").textContent = "🫧 " + n + "/12";
      kidTap("💦", "Pop!  " + n + "/12", hit.x, hit.y, 480);
      if (n >= 12) { play = false; kidYay(); document.getElementById("win").classList.remove("off"); }
    });
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      x.fillStyle = "#bae6fd"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#38bdf8"; x.fillRect(0, H * 0.58, W, H);
      em("🛁", W * 0.5, H * 0.70, 96);
      em(n >= 12 ? "🦆" : "🐥", W * 0.5, H * 0.58, 72);
      if (play) {
        if (bubbles.length < 5) spawn();
        bubbles.forEach(function (b) { b.y -= b.vy * dt; });
        bubbles = bubbles.filter(function (b) { return b.y > 40; });
      }
      bubbles.forEach(function (b) { em("🫧", b.x, b.y, 72); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
