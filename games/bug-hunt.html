<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bug Hunt</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#365314;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;padding:54px 8px 18px;text-align:center;background:linear-gradient(#bbf7d0,#4d7c0f)}
    body.night{background:linear-gradient(#0f172a,#14532d);color:#d9f99d}
    .home{position:fixed;top:12px;left:12px;z-index:12;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.32);padding:8px 14px;border-radius:999px}
    h1{font-size:clamp(26px,7vw,40px);color:#fff}
    .hud{display:flex;justify-content:center;gap:8px;margin:6px;flex-wrap:wrap}
    .chip{background:rgba(255,255,255,.88);padding:6px 12px;border-radius:999px;font-weight:800;font-size:15px;color:#365314}
    body.night .chip{background:rgba(10,20,12,.7);color:#d9f99d}
    .garden{
      position:relative;width:min(360px,94vw);height:340px;margin:8px auto;border-radius:24px;overflow:hidden;
      background:
        radial-gradient(circle at 20% 80%,#86efac 0 18%,transparent 19%),
        radial-gradient(circle at 80% 70%,#4ade80 0 16%,transparent 17%),
        linear-gradient(#86efac,#166534);
      box-shadow:0 10px 0 #365314;
    }
    body.night .garden{background:linear-gradient(#16301f,#052e16);box-shadow:0 10px 0 #022c22}
    .bush{position:absolute;pointer-events:none;font-size:42px}
    .leaf{
      position:absolute;width:64px;height:64px;border-radius:50% 12px 50% 12px;transform:rotate(-18deg);
      background:linear-gradient(140deg,#22c55e,#166534);font-size:30px;color:#fff;
      box-shadow:0 5px 0 #14532d;display:grid;place-items:center;
    }
    .leaf:active{transform:rotate(-18deg) translateY(3px)}
    .leaf.open{background:#fefce8;color:#222;transform:none;border-radius:18px}
    .leaf.bug{background:#ecfccb}
    .leaf.glow{box-shadow:0 0 14px #fde047,0 5px 0 #14532d}
    body.night .leaf{background:linear-gradient(140deg,#166534,#052e16)}
    body.night .leaf.open.bug{background:#1a2e10;filter:drop-shadow(0 0 8px #bef264)}
    .tray{
      width:min(380px,96vw);margin:12px auto 0;padding:10px 8px 12px;
      background:linear-gradient(#92400e,#78350f);border-radius:18px 18px 8px 8px;
      box-shadow:0 8px 0 #451a03;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
    }
    .jar{
      width:52px;display:flex;flex-direction:column;align-items:center;
    }
    .lid{
      width:40px;height:14px;background:#a16207;border-radius:4px 4px 0 0;box-shadow:0 2px 0 #713f12;
    }
    .lid:active{transform:translateY(2px)}
    .lid.shine{background:#fde047;box-shadow:0 0 10px #fde047}
    .glass{
      width:44px;height:48px;background:rgba(186,230,253,.45);border:3px solid #7dd3fc;border-top:0;
      border-radius:0 0 16px 16px;display:grid;place-items:center;font-size:24px;
    }
    body.night .glass{background:rgba(20,40,20,.5);border-color:#365314}
    .msg{font-weight:800;color:#fff;margin-top:8px;min-height:1.3em}
    .banner{
      display:none;width:min(340px,92vw);margin:12px auto 0;padding:16px;
      background:#fffbeb;border-radius:8px;box-shadow:4px 6px 0 #854d0e;color:#365314;
      border:4px dashed #a3e635;transform:rotate(-1deg);
    }
    .banner.on{display:block}
    .acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
    .play{background:#ffd166;color:#3b2100;font-weight:800;font-size:22px;padding:12px 20px;border-radius:999px;box-shadow:0 6px 0 #e09f1f}
    .play.next{background:#86efac;color:#14532d;box-shadow:0 6px 0 #16a34a}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <h1>Bug Hunt</h1>
  <div class="hud">
    <span class="chip" id="gchip">Garden 1</span>
    <span class="chip" id="bugs">Bugs 0 / 3</span>
    <span class="chip" id="stars">⭐ 0</span>
  </div>
  <div class="garden" id="garden"></div>
  <div class="tray" id="tray"></div>
  <p class="msg" id="msg">Flip leaves. Catch bugs!</p>
  <div class="banner" id="banner">
    <div style="font-size:42px">🔬</div>
    <h2 id="btitle">Bug scientist!</h2>
    <p id="bsub"></p>
    <div class="acts">
      <button class="play next" id="nextBtn">Next</button>
      <button class="play" id="againBtn">Play again</button>
    </div>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
    var bugsAll=["🐞","🐛","🐝","🪲","🦗","🦋","🐜","🐌"];
    var junk=["🪨","🌸","🍄","🍂"];
    var gardens=[
      {name:"Sunny path",night:false,leaves:6,bugs:3,spots:[[12,18],[58,14],[28,42],[70,40],[16,68],[62,70]]},
      {name:"Flower bed",night:false,leaves:9,bugs:5,spots:[[8,12],[40,10],[72,14],[18,38],[48,34],[76,42],[10,66],[42,70],[70,68]]},
      {name:"Night glow",night:true,leaves:12,bugs:6,spots:[[6,8],[34,6],[62,10],[84,16],[12,32],[40,28],[68,34],[18,54],[46,50],[74,56],[28,76],[60,74]]}
    ];
    var lv=0,found=0,need=0,stars=0,caught=[],leafData=[];
    function mkJars(n){
      var t=document.getElementById("tray");t.innerHTML="";
      for(var i=0;i<n;i++){
        var j=document.createElement("div");j.className="jar";
        j.innerHTML='<button class="lid" data-i="'+i+'"></button><div class="glass" id="jar'+i+'">'+(caught[i]||"")+"</div>";
        t.appendChild(j);
      }
      t.querySelectorAll(".lid").forEach(function(lid){
        lid.onclick=function(){shine(+lid.dataset.i);};
      });
    }
    function shine(i){
      var lids=document.querySelectorAll(".lid");
      lids.forEach(function(l){l.classList.remove("shine");});
      lids[i]&&lids[i].classList.add("shine");
      beep(600,.08);
      if(!gardens[lv].night){document.getElementById("msg").textContent="Lid shine!";return;}
      var hidden=leafData.filter(function(L){return L.isBug&&!L.open;});
      if(!hidden.length)return;
      var pick=hidden[0];
      pick.el.classList.add("glow");
      document.getElementById("msg").textContent="A glow! Look there.";
      setTimeout(function(){pick.el.classList.remove("glow");},1400);
    }
    function load(){
      var G=gardens[lv];
      document.body.className=G.night?"night":"";
      document.getElementById("gchip").textContent=G.name;
      document.getElementById("banner").classList.remove("on");
      document.getElementById("nextBtn").style.display=lv<2?"":"none";
      document.getElementById("msg").textContent=G.night?"Night bugs glow. Tap a lid!":"Flip leaves. Catch bugs!";
      found=0;need=G.bugs;caught=[];leafData=[];
      var pool=shuffle(bugsAll).slice(0,G.bugs).concat(shuffle(junk).slice(0,G.leaves-G.bugs));
      pool=shuffle(pool);
      var garden=document.getElementById("garden");garden.innerHTML="";
      [["🌳",4,4,40],["🌳",78,2,44],["🌻",48,80,24]].forEach(function(b){
        var d=document.createElement("div");d.className="bush";d.textContent=b[0];
        d.style.left=b[1]+"%";d.style.top=b[2]+"%";d.style.fontSize=b[3]+"px";garden.appendChild(d);
      });
      pool.forEach(function(item,i){
        var isBug=bugsAll.indexOf(item)>=0;
        var b=document.createElement("button");b.className="leaf";b.textContent="🍃";
        var sp=G.spots[i];b.style.left=sp[0]+"%";b.style.top=sp[1]+"%";
        var rec={el:b,item:item,isBug:isBug,open:false};
        leafData.push(rec);
        b.onclick=function(){
          if(rec.open)return;
          rec.open=true;b.classList.add("open");b.textContent=item;
          if(isBug){
            b.classList.add("bug");found++;caught.push(item);stars++;
            document.getElementById("jar"+(found-1)).textContent=item;
            beep(720,.1);
            document.getElementById("msg").textContent="In the jar!";
            paint();
            if(found>=need){
              document.getElementById("btitle").textContent=lv<2?"Nice catch!":"Bug scientist!";
              document.getElementById("bsub").textContent="Jars full · ⭐ "+stars;
              document.getElementById("banner").classList.add("on");beep(960,.2);
            }
          }else{
            beep(200,.08);
            document.getElementById("msg").textContent="Just a "+item+". Try another leaf.";
          }
        };
        garden.appendChild(b);
      });
      mkJars(need);paint();
    }
    function paint(){
      document.getElementById("bugs").textContent="Bugs "+found+" / "+need;
      document.getElementById("stars").textContent="⭐ "+stars;
    }
    document.getElementById("nextBtn").onclick=function(){if(lv<2){lv++;load();}};
    document.getElementById("againBtn").onclick=function(){lv=0;stars=0;load();};
    load();
  </script>
</body>
</html>
