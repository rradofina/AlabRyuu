<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bug Hunt</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#365314;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;background:linear-gradient(#bbf7d0,#65a30d);padding:56px 12px 24px;text-align:center}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    h1{font-size:clamp(28px,8vw,42px);color:#fff}
    .msg{font-weight:800;color:#fff;margin:8px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(340px,92vw);margin:12px auto}
    .leaf{height:78px;border-radius:18px;background:#166534;font-size:36px;box-shadow:0 6px 0 #14532d;color:#fff}
    .leaf:active{transform:translateY(3px)}
    .leaf.open{background:#fefce8;color:#222}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(20,40,10,.84);z-index:8;gap:12px;color:#fff}
    .win.on{display:flex}
    .play{background:#ffd166;color:#3b2100;font-weight:800;font-size:26px;padding:14px 28px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <h1>Bug Hunt</h1>
  <p class="msg" id="msg">Flip leaves. Find 8 bugs!</p>
  <div class="grid" id="grid"></div>
  <div class="win" id="win">
    <div style="font-size:72px">🐞</div>
    <h2>Bug scientist!</h2>
    <button class="play" id="again">Hunt again</button>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var bugs=["🐞","🐛","🐝","🪲","🦗","🦋","🐜","🐌"],found=0;
    var deck=bugs.concat(["🍂","🌸","🍄","🪨"]);
    for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=deck[i];deck[i]=deck[j];deck[j]=t;}
    var grid=document.getElementById("grid");
    deck.forEach(function(item){
      var b=document.createElement("button");b.className="leaf";b.textContent="🍃";
      var isBug=bugs.indexOf(item)>=0;
      b.onclick=function(){
        if(b.classList.contains("open"))return;
        b.classList.add("open");b.textContent=item;
        if(isBug){found++;beep(720,.1);document.getElementById("msg").textContent="Found "+found+" / 8 bugs!";if(found>=8){document.getElementById("win").classList.add("on");beep(960,.2);}}
        else{beep(200,.08);document.getElementById("msg").textContent="Just a "+item+" . Keep looking!";}
      };
      grid.appendChild(b);
    });
    document.getElementById("again").onclick=function(){location.reload();};
  </script>
</body>
</html>
