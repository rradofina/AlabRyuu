<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bug Hunt</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>html,body{background:#166534}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="got">🐞 0/4</b></div>
  <div id="say">Flip the leaves. Find bugs!</div>
  <div class="cover" id="title">
    <div class="hero">🐞</div>
    <h1>Bug Hunt</h1>
    <p>Tap leaves. Find 4 bugs!</p>
    <button class="play" id="go">Hunt</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🦋</div>
    <h1>Bug explorer!</h1>
    <p>Four little bugs waved.</p>
    <button class="play g" id="again">Hunt again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, n = 0, leaves = [];
    var BUGS = ["🐞", "🐛", "🦋", "🐝"];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; n = 0;
      leaves = [
        { x: 0.25, y: 0.36, bug: "🐞", open: 0 },
        { x: 0.70, y: 0.34, bug: "", open: 0 },
        { x: 0.22, y: 0.58, bug: "🐛", open: 0 },
        { x: 0.55, y: 0.52, bug: "🦋", open: 0 },
        { x: 0.78, y: 0.62, bug: "", open: 0 },
        { x: 0.48, y: 0.74, bug: "🐝", open: 0 }
      ];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("got").textContent = "🐞 0/4";
      document.getElementById("say").textContent = "Flip the leaves!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      leaves.forEach(function (L) {
        var dx = e.clientX - L.x * W, dy = e.clientY - L.y * H;
        if (dx * dx + dy * dy < 55 * 55 && !L.open) {
          L.open = 1;
          if (L.bug) {
            n++;
            document.getElementById("got").textContent = "🐞 " + n + "/4";
            document.getElementById("say").textContent = "Hi " + L.bug + "!";
            if (n >= 4) { play = false; document.getElementById("win").classList.remove("off"); }
          } else document.getElementById("say").textContent = "Just a leaf. Keep looking!";
        }
      });
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#4ade80"; x.fillRect(0, 0, W, H);
      em("🌳", 40, 100, 64); em("🌳", W - 36, 110, 72);
      leaves.forEach(function (L) {
        if (L.open && L.bug) em(L.bug, L.x * W, L.y * H, 72);
        else if (L.open) em("🍂", L.x * W, L.y * H, 56);
        else em("🍃", L.x * W, L.y * H + Math.sin(t * 2 + L.x) * 3, 72);
      });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
