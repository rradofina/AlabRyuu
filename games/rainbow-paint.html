<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Rainbow Paint</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>
    html,body{background:#7dd3fc}
    .dock button{min-width:56px;min-height:84px}
    .dock button span{font-size:32px}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="nx">Next 🔴</b></div>
  <div id="say">Paint the sky in rainbow order!</div>
  <div class="dock" id="dock">
    <button data-i="0"><span>🔴</span></button>
    <button data-i="1"><span>🟠</span></button>
    <button data-i="2"><span>🟡</span></button>
    <button data-i="3"><span>🟢</span></button>
    <button data-i="4"><span>🔵</span></button>
    <button data-i="5"><span>🟣</span></button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🌈</div>
    <h1>Rainbow Paint</h1>
    <p>Tap colors in order. Fill the sky!</p>
    <button class="play" id="go" autofocus>Paint</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🌈</div>
    <h1>Rainbow!</h1>
    <p>The whole sky smiled.</p>
    <button class="play g" id="again">Paint again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, next = 0;
    var COLS = [
      { e: "🔴", c: "#ef4444" }, { e: "🟠", c: "#f97316" }, { e: "🟡", c: "#facc15" },
      { e: "🟢", c: "#22c55e" }, { e: "🔵", c: "#3b82f6" }, { e: "🟣", c: "#a855f7" }
    ];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; next = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      document.getElementById("nx").textContent = "Next " + COLS[0].e;
      document.getElementById("say").textContent = "Tap " + COLS[0].e + " first!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    [].forEach.call(document.querySelectorAll("#dock button"), function (b) {
      b.onclick = function () {
        if (!play) return;
        var i = +b.getAttribute("data-i");
        kidTap(COLS[i].e, i === next ? "Yes!" : "Next is " + COLS[next].e, innerWidth * 0.5, innerHeight * 0.42, i === next ? 500 : 220);
        if (i === next) {
          next++;
          if (next >= COLS.length) {
            play = false;
            kidYay();
            document.getElementById("dock").classList.remove("on");
            document.getElementById("win").classList.remove("off");
          } else {
            document.getElementById("nx").textContent = "Next " + COLS[next].e;
            kidPing("Yes! Now " + COLS[next].e);
          }
        }
      };
    });
    function loop() {
      x.fillStyle = "#7dd3fc"; x.fillRect(0, 0, W, H);
      for (var i = 0; i < next; i++) {
        x.beginPath();
        x.arc(W * 0.5, H * 0.72, 40 + i * 28, Math.PI, 0);
        x.strokeStyle = COLS[i].c; x.lineWidth = 26; x.stroke();
      }
      em("☁️", 60, 120, 64); em("☁️", W - 50, 140, 72);
      if (next >= COLS.length) em("🌈", W * 0.5, H * 0.42, 120);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
