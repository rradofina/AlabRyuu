<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Rainbow Paint</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#3b0764;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;background:linear-gradient(#faf5ff,#fef9c3);padding:54px 10px 24px;text-align:center}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    h1{font-size:clamp(24px,7vw,36px)}
    .hud{display:flex;justify-content:center;gap:8px;margin:6px}
    .chip{background:#fff;font-weight:800;padding:6px 12px;border-radius:999px;box-shadow:0 4px 0 #c4b5fd;font-size:15px}
    .wall{max-width:420px;margin:8px auto;background:#e7e5e4;padding:18px 14px 22px;border-radius:8px;box-shadow:inset 0 0 0 8px #d6d3d1}
    .frame{background:#b45309;padding:10px;border-radius:8px;box-shadow:0 10px 0 #78350f,inset 0 0 0 4px #fbbf24}
    svg{width:100%;height:auto;background:#fff;display:block;border-radius:4px}
    svg .reg{cursor:pointer;stroke:#444;stroke-width:1.5}
    svg .reg:active{filter:brightness(1.08)}
    svg text{font-weight:800;font-size:11px;pointer-events:none;fill:#3b0764}
    .pots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
    .pot{width:62px;height:70px;border-radius:16px 16px 22px 22px;box-shadow:0 6px 0 rgba(0,0,0,.16);font-weight:800;font-size:11px;color:#222}
    .pot.on{outline:4px solid #3b0764}
    .pot:active{transform:translateY(3px)}
    .magic{margin:10px auto 0;display:inline-flex;align-items:center;gap:8px;background:#ddd6fe;color:#3b0764;font-weight:800;padding:12px 18px;border-radius:999px;box-shadow:0 6px 0 #7c3aed;font-size:18px}
    .msg{font-weight:800;min-height:2.2em;margin-top:8px;font-size:18px}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(40,10,60,.86);z-index:10;gap:10px;color:#fff;padding:20px}
    .win.on{display:flex}
    .win h2{font-size:32px}
    .stars{font-size:28px;letter-spacing:4px}
    .winbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .play,.next{font-weight:800;font-size:22px;padding:14px 22px;border-radius:999px}
    .play{background:#ffd166;color:#3b2100;box-shadow:0 7px 0 #e09f1f}
    .next{background:#86efac;color:#14532d;box-shadow:0 7px 0 #16a34a}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <h1>Rainbow Paint</h1>
  <div class="hud">
    <div class="chip" id="lvl">Picture 1 / 3</div>
    <div class="chip" id="stars">⭐ 0</div>
  </div>
  <p class="msg" id="msg">Paint red first! 1 then 2 then 3…</p>
  <div class="wall">
    <div class="frame"><div id="art"></div></div>
  </div>
  <div class="pots" id="pots"></div>
  <button class="magic" id="magic">✨ Magic pot</button>
  <div class="win" id="win">
    <div style="font-size:72px">🌈</div>
    <h2 id="wintitle">Full rainbow!</h2>
    <p class="stars" id="winstars">⭐⭐⭐</p>
    <p id="winline">Every number has a color.</p>
    <div class="winbtns">
      <button class="play" id="again">Play again</button>
      <button class="next" id="next">Next</button>
    </div>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var COLS=[
      {n:"red",c:"#ef4444"},{n:"orange",c:"#f97316"},{n:"yellow",c:"#facc15"},
      {n:"green",c:"#22c55e"},{n:"blue",c:"#3b82f6"},{n:"indigo",c:"#4f46e5"},{n:"violet",c:"#a855f7"},
      {n:"sky",c:"#7dd3fc"},{n:"brown",c:"#b45309"},{n:"pink",c:"#f9a8d4"}
    ];
    var PICS=[
      {title:"Rainbow",order:true,svg:function(){
        return '<svg viewBox="0 0 200 150">'+
          '<rect class="reg" data-i="8" x="0" y="0" width="200" height="122" fill="#fff"/>'+
          '<path class="reg" data-i="1" d="M8 122 A92 92 0 0 1 192 122 L178 122 A78 78 0 0 0 22 122 Z" fill="#fff"/>'+
          '<path class="reg" data-i="2" d="M22 122 A78 78 0 0 1 178 122 L164 122 A64 64 0 0 0 36 122 Z" fill="#fff"/>'+
          '<path class="reg" data-i="3" d="M36 122 A64 64 0 0 1 164 122 L150 122 A50 50 0 0 0 50 122 Z" fill="#fff"/>'+
          '<path class="reg" data-i="4" d="M50 122 A50 50 0 0 1 150 122 L136 122 A36 36 0 0 0 64 122 Z" fill="#fff"/>'+
          '<path class="reg" data-i="5" d="M64 122 A36 36 0 0 1 136 122 L122 122 A22 22 0 0 0 78 122 Z" fill="#fff"/>'+
          '<path class="reg" data-i="6" d="M78 122 A22 22 0 0 1 122 122 L112 122 A12 12 0 0 0 88 122 Z" fill="#fff"/>'+
          '<path class="reg" data-i="7" d="M88 122 A12 12 0 0 1 112 122 A12 12 0 0 0 88 122 Z" fill="#fff"/>'+
          '<rect class="reg" data-i="9" x="0" y="122" width="200" height="28" fill="#fff"/>'+
          '<text x="100" y="52" text-anchor="middle">1</text>'+
          '<text x="100" y="66" text-anchor="middle">2</text>'+
          '<text x="100" y="80" text-anchor="middle">3</text>'+
          '<text x="100" y="94" text-anchor="middle">4</text>'+
          '<text x="100" y="106" text-anchor="middle">5</text>'+
          '<text x="100" y="115" text-anchor="middle">6</text>'+
          '<text x="100" y="121" text-anchor="middle">7</text>'+
          '<text x="12" y="16">8</text><text x="100" y="142" text-anchor="middle">9</text></svg>';
      },map:{1:"red",2:"orange",3:"yellow",4:"green",5:"blue",6:"indigo",7:"violet",8:"sky",9:"green"}},
      {title:"Flower",order:false,svg:function(){
        return '<svg viewBox="0 0 200 150">'+
          '<rect class="reg" data-i="9" x="0" y="0" width="200" height="150" fill="#fff"/>'+
          '<circle class="reg" data-i="2" cx="100" cy="48" r="22" fill="#fff"/>'+
          '<circle class="reg" data-i="3" cx="128" cy="62" r="22" fill="#fff"/>'+
          '<circle class="reg" data-i="4" cx="118" cy="90" r="22" fill="#fff"/>'+
          '<circle class="reg" data-i="5" cx="82" cy="90" r="22" fill="#fff"/>'+
          '<circle class="reg" data-i="6" cx="72" cy="62" r="22" fill="#fff"/>'+
          '<circle class="reg" data-i="1" cx="100" cy="70" r="18" fill="#fff"/>'+
          '<rect class="reg" data-i="7" x="94" y="86" width="12" height="36" fill="#fff"/>'+
          '<ellipse class="reg" data-i="8" cx="78" cy="112" rx="16" ry="8" fill="#fff"/>'+
          '<path class="reg" data-i="10" d="M80 122 h40 l8 20 h-56 z" fill="#fff"/>'+
          '<text x="100" y="74" text-anchor="middle">1</text>'+
          '<text x="100" y="44" text-anchor="middle">2</text>'+
          '<text x="132" y="64" text-anchor="middle">3</text>'+
          '<text x="120" y="96" text-anchor="middle">4</text>'+
          '<text x="80" y="96" text-anchor="middle">5</text>'+
          '<text x="68" y="64" text-anchor="middle">6</text>'+
          '<text x="100" y="108" text-anchor="middle">7</text>'+
          '<text x="78" y="116" text-anchor="middle">8</text>'+
          '<text x="14" y="18">9</text>'+
          '<text x="100" y="140" text-anchor="middle">10</text></svg>';
      },map:{1:"yellow",2:"pink",3:"red",4:"orange",5:"violet",6:"pink",7:"green",8:"green",9:"sky",10:"brown"}},
      {title:"Kite",order:false,svg:function(){
        return '<svg viewBox="0 0 200 150">'+
          '<rect class="reg" data-i="8" x="0" y="0" width="200" height="118" fill="#fff"/>'+
          '<polygon class="reg" data-i="1" points="100,18 136,56 100,56" fill="#fff"/>'+
          '<polygon class="reg" data-i="2" points="100,18 64,56 100,56" fill="#fff"/>'+
          '<polygon class="reg" data-i="3" points="100,56 136,56 100,96" fill="#fff"/>'+
          '<polygon class="reg" data-i="4" points="100,56 64,56 100,96" fill="#fff"/>'+
          '<circle class="reg" data-i="5" cx="112" cy="108" r="8" fill="#fff"/>'+
          '<circle class="reg" data-i="6" cx="122" cy="122" r="8" fill="#fff"/>'+
          '<circle class="reg" data-i="7" cx="134" cy="134" r="8" fill="#fff"/>'+
          '<rect class="reg" data-i="9" x="0" y="118" width="200" height="32" fill="#fff"/>'+
          '<circle class="reg" data-i="10" cx="168" cy="28" r="14" fill="#fff"/>'+
          '<text x="114" y="46">1</text><text x="80" y="46">2</text>'+
          '<text x="114" y="78">3</text><text x="80" y="78">4</text>'+
          '<text x="109" y="112">5</text><text x="119" y="126">6</text><text x="131" y="138">7</text>'+
          '<text x="12" y="16">8</text><text x="100" y="140" text-anchor="middle">9</text>'+
          '<text x="164" y="32">10</text></svg>';
      },map:{1:"red",2:"yellow",3:"blue",4:"green",5:"pink",6:"orange",7:"violet",8:"sky",9:"green",10:"yellow"}}
    ];
    var pi=0,sel=null,filled={},need=1,stars=0,magicUsed=0;
    function colByName(n){for(var i=0;i<COLS.length;i++)if(COLS[i].n===n)return COLS[i];return COLS[0];}
    function pots(){
      var box=document.getElementById("pots");box.innerHTML="";
      var used={};
      var map=PICS[pi].map;
      Object.keys(map).forEach(function(k){used[map[k]]=1;});
      COLS.forEach(function(c,i){
        if(!used[c.n])return;
        var b=document.createElement("button");b.className="pot";b.style.background=c.c;b.textContent=c.n;b.dataset.n=c.n;
        b.onclick=function(){sel=c.n;document.querySelectorAll(".pot").forEach(function(x){x.classList.toggle("on",x===b);});beep(420+i*30,.06);};
        box.appendChild(b);
      });
    }
    function bind(){
      document.querySelectorAll(".reg").forEach(function(el){
        el.onclick=function(){
          var i=+el.getAttribute("data-i"),pic=PICS[pi],want=pic.map[i];
          if(filled[i])return;
          if(pic.order&&i!==need){document.getElementById("msg").textContent="Paint "+need+" next! ("+pic.map[need]+")";beep(180,.1);return;}
          if(!sel){document.getElementById("msg").textContent="Pick a pot first!";beep(180,.1);return;}
          if(sel!==want){document.getElementById("msg").textContent="Number "+i+" wants "+want+"!";beep(180,.1);return;}
          paint(i);
        };
      });
    }
    function paint(i){
      var el=document.querySelector('.reg[data-i="'+i+'"]');
      if(!el||filled[i])return;
      filled[i]=1;el.setAttribute("fill",colByName(PICS[pi].map[i]).c);beep(500+i*40,.09);
      var texts=document.querySelectorAll("#art text");
      texts.forEach(function(t){if(t.textContent===""+i)t.style.display="none";});
      if(PICS[pi].order)need=i+1;
      document.getElementById("msg").textContent=PICS[pi].order&&PICS[pi].map[need]?"Now "+need+" — "+PICS[pi].map[need]+"!":"Pretty! Keep going.";
      var total=Object.keys(PICS[pi].map).length;
      if(Object.keys(filled).length>=total){
        var got=magicUsed===0?3:magicUsed===1?2:1;stars+=got;
        document.getElementById("stars").textContent="⭐ "+stars;beep(920,.18);
        setTimeout(function(){showWin(pi>=PICS.length-1,got);},400);
      }
    }
    function draw(){
      filled={};need=1;magicUsed=0;sel=null;
      document.getElementById("art").innerHTML=PICS[pi].svg();
      document.getElementById("lvl").textContent="Picture "+(pi+1)+" / 3 · "+PICS[pi].title;
      document.getElementById("msg").textContent=PICS[pi].order?"Paint red first! 1 then 2 then 3…":"Match each number to a pot.";
      pots();bind();
    }
    document.getElementById("magic").onclick=function(){
      var map=PICS[pi].map,next=null,keys=Object.keys(map).map(Number).sort(function(a,b){return a-b;});
      for(var i=0;i<keys.length;i++)if(!filled[keys[i]]){next=keys[i];break;}
      if(next==null)return;
      magicUsed++;sel=map[next];paint(next);
      document.getElementById("msg").textContent="Magic painted "+next+"!";
    };
    function showWin(last,got){
      document.getElementById("wintitle").textContent=last?"Full rainbow!":"Pretty picture!";
      document.getElementById("winstars").textContent="⭐".repeat(got);
      document.getElementById("winline").textContent=last?"Every number has a color.":"On to the next picture!";
      document.getElementById("win").classList.add("on");
    }
    document.getElementById("again").onclick=function(){document.getElementById("win").classList.remove("on");pi=0;stars=0;document.getElementById("stars").textContent="⭐ 0";draw();};
    document.getElementById("next").onclick=function(){
      document.getElementById("win").classList.remove("on");
      if(pi>=PICS.length-1){pi=0;stars=0;document.getElementById("stars").textContent="⭐ 0";}
      else pi++;
      draw();
    };
    draw();
  </script>
</body>
</html>
