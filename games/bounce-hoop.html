<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var open = false;
      try { open = localStorage.getItem("alabryuu-open") === "1"; } catch (e) {}
      if (open) return;
      document.documentElement.classList.add("kid-locked");
      var path = location.pathname || "";
      document.documentElement.style.background = path.indexOf("/alonzorui") === 0 ? "#fff7ed" : "#1e1b4b";
    })();
  </script>
  <style id="kid-lock-hide">
    html.kid-locked, html.kid-locked body { overflow: hidden !important; height: 100% !important; }
    html.kid-locked body { visibility: hidden !important; }
    #kid-lock, #kid-lock * { visibility: visible !important; }
  </style>
  <script src="/kid-lock.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bounce Hoop</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../mix.js"></script>
  <style>
    html, body { background: #ffedd5; }
    .home { z-index: 60; }
    .dock button { font-size: 22px; }
    .dock button i { display: block; width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px; border: 3px solid #1e1b4b; background: var(--c, #fff); }
    .hero svg { width: 96px; height: 96px; display: block; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fl">0 / 4</b></div>
  <div id="say">Bounce the ball through the hoop</div>
  <div class="dock" id="dock">
    <button id="hop"><i style="--c:#fb7185"></i>Bounce</button>
  </div>
  <div class="cover" id="title">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><ellipse cx="46" cy="40" rx="26" ry="12" fill="none" stroke="#f97316" stroke-width="6"/><circle cx="46" cy="68" r="10" fill="#fb7185" stroke="#1e1b4b" stroke-width="4"/></svg></div>
    <h1>Bounce Hoop</h1>
    <p>The ball always comes back.</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><ellipse cx="46" cy="40" rx="26" ry="12" fill="none" stroke="#f97316" stroke-width="6"/><circle cx="46" cy="68" r="10" fill="#fb7185" stroke="#1e1b4b" stroke-width="4"/></svg></div>
    <h1>Four bounces!</h1>
    <p>Each one went through.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
(function () {
  var cv = document.getElementById("c");
  var ui = Mix.boot(cv);
  var ctx, W = 0, H = 0, raf = 0;
  function layout(force) {
    var r = cv.getBoundingClientRect();
    var rw = Math.round(r.width || 0), rh = Math.round(r.height || 0);
    if (!force && ctx && Math.round(W) === rw && Math.round(H) === rh && rw > 0) return;
    var f = ui.fit();
    ctx = f.ctx; W = f.W; H = f.H;
  }
  function loop() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  function frame() {
    if (!ui.on()) return;
    layout(false);
    if (W < 2 || H < 2) { raf = requestAnimationFrame(frame); return; }
    if (step() === "stop") return;
    draw();
    raf = requestAnimationFrame(frame);
  }
  function begin() { layout(true); reset(); loop(); }
  function hud(t) {
    var el = document.getElementById("fl");
    if (el) el.textContent = t;
    var m = String(t).match(/\d+/);
    if (m) cv.dataset.score = m[0];
  }
  function sky(a, b) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ui.begin(begin);
  ui.replay(begin);
  
  var ballX, ballY, vy, phase, got, aScore, bScore, turn;
  function amp() { return Math.min(W * 0.24, 150); }
  function floorY() { return H - 188; }
  function hoopY() { return floorY() - 200; }
  function hoopX() { return W / 2 + Math.sin(phase) * amp(); }
  function reset() {
    ballX = W / 2; ballY = floorY(); vy = 0; phase = 1.2; got = 0; aScore = 0; bScore = 0; turn = 0;
    hud("0 / 4");
    var say = document.getElementById("say");
    if (say && false) say.textContent = "Alab bounce";
  }
  function bounce() {
    if (!ui.on() || vy !== 0) return;
    vy = -12.4;
    kidNote(440);
  }
  var hop = document.getElementById("hop");
  if (hop) hop.addEventListener("click", bounce);
  cv.addEventListener("pointerdown", function (e) {
    if (!ui.on()) return;
    var p = kidPt(e, cv);
    if (p.y > H * 0.45) bounce();
  });
  function scoreOne() {
    got++;
    
    kidNote(680);
    kidPing(got + " through");
    hud(got + " / 4");
    if (got >= 4) { draw(); ui.finish(); return "stop"; }
    
  }
  function step() {
    phase += 0.007;
    var prevY = ballY;
    var going = vy < 0;
    if (vy !== 0) {
      ballY += vy;
      vy += 0.34;
      var hy = hoopY();
      if (going && prevY > hy && ballY <= hy && Math.abs(ballX - hoopX()) < 64) {
        if (scoreOne() === "stop") return "stop";
      }
    }
    if (ballY >= floorY() && vy > 0) { ballY = floorY(); vy = 0; }
    cv.dataset.ready = vy === 0 ? "1" : "0";
    cv.dataset.hx = String(Math.round(hoopX()));
    cv.dataset.hy = String(Math.round(hoopY()));
    cv.dataset.bx = String(Math.round(ballX));
    cv.dataset.a = String(aScore);
    cv.dataset.b = String(bScore);
  }
  function draw() {
    sky("#fff7ed", "#fee2e2");
    var hx = hoopX(), hy = hoopY();
    ctx.strokeStyle = "#f97316"; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.ellipse(hx, hy, 58, 16, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "#fdba74"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(hx, hy + 10, 58, 12, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#fb7185";
    ctx.beginPath(); ctx.arc(ballX, ballY, 20, 0, Math.PI * 2); ctx.fill(); Mix.ink(ctx);
    if (vy === 0) {
      ctx.strokeStyle = "#fde68a"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(ballX, ballY, 28, 0, Math.PI * 2); ctx.stroke();
    }
    
  }

  layout(true);
  if (W > 2) { reset(); draw(); }
  addEventListener("resize", function () { layout(true); if (W > 2) draw(); });
})();
  </script>
</body>
</html>
