<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Memory Zoo</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>
    html,body{background:#14532d;overflow:auto;touch-action:manipulation}
    .grid{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(92vw,440px);z-index:2}
    .card{min-height:92px;border-radius:20px;background:#166534;font-size:56px;box-shadow:0 6px 0 #052e16}
    .card.on{background:#fff}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="pr">0/4</b></div>
  <div id="say">Find two the same!</div>
  <div class="grid" id="grid"></div>
  <div class="cover" id="title">
    <div class="hero">🦁</div>
    <h1>Memory Zoo</h1>
    <p>Flip cards. Match the animals!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🎉</div>
    <h1>Zoo match!</h1>
    <p>All the pals found friends.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var ANIM = ["🦁", "🐘", "🦒", "🐧"];
    var cards = [], open = [], lock = false, pairs = 0;
    function shuffle(a) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = (Math.random() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function deal() {
      cards = shuffle(ANIM.concat(ANIM).map(function (e, i) { return { e: e, id: i, open: 0, done: 0 }; }));
      open = []; lock = false; pairs = 0;
      var g = document.getElementById("grid");
      g.innerHTML = "";
      cards.forEach(function (c, i) {
        var b = document.createElement("button");
        b.className = "card";
        b.textContent = "❓";
        b.onclick = function () { flip(i, b); };
        c.el = b;
        g.appendChild(b);
      });
      document.getElementById("pr").textContent = "0/4";
      document.getElementById("say").textContent = "Find two the same!";
    }
    function flip(i, b) {
      var c = cards[i];
      if (lock || c.open || c.done) return;
      c.open = 1; b.textContent = c.e; b.classList.add("on");
      open.push(c);
      if (open.length < 2) return;
      lock = true;
      if (open[0].e === open[1].e) {
        open[0].done = open[1].done = 1;
        pairs++;
        document.getElementById("pr").textContent = pairs + "/4";
        document.getElementById("say").textContent = "Match! " + open[0].e;
        open = []; lock = false;
        if (pairs >= 4) document.getElementById("win").classList.remove("off");
      } else {
        document.getElementById("say").textContent = "Try again!";
        setTimeout(function () {
          open.forEach(function (o) { o.open = 0; o.el.textContent = "❓"; o.el.classList.remove("on"); });
          open = []; lock = false;
        }, 700);
      }
    }
    function start() {
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      deal();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
  })();
  </script>
</body>
</html>
