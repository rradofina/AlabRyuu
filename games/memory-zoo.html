<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Memory Zoo</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#3f2a14;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{
      min-height:100vh;padding:54px 10px 28px;text-align:center;
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%,#fff7c2 0%,transparent 55%),
        linear-gradient(#87c8e8 0 28%,#8fce5b 28% 70%,#6b8f3a 70%);
      transition:background .6s;
    }
    body.dusk{
      background:
        radial-gradient(ellipse 70% 36% at 80% 8%,#ffb26b 0%,transparent 50%),
        linear-gradient(#f0a06a 0 28%,#c4a24a 28% 70%,#6b5a28 70%);
    }
    body.night{
      background:
        radial-gradient(circle at 82% 10%,#fff6c2 0 2%,transparent 8%),
        linear-gradient(#0b1433 0 32%,#16301a 32% 72%,#0d1a10 72%);
      color:#e8f0d8;
    }
    .home{position:fixed;top:12px;left:12px;z-index:12;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.32);padding:8px 14px;border-radius:999px}
    h1{font-size:clamp(26px,7vw,40px);color:#fff;text-shadow:0 3px 0 #3d5a1a}
    body.night h1{text-shadow:0 3px 0 #0a1024}
    .gate{
      width:min(380px,94vw);margin:8px auto 0;height:72px;position:relative;
      background:linear-gradient(#6b3e1f,#4a2a12);border-radius:10px 10px 4px 4px;
      box-shadow:0 8px 0 #2d1808;overflow:hidden;
    }
    .gate:before,.gate:after{content:"";position:absolute;top:8px;width:14px;height:64px;background:#3d2412;border-radius:4px}
    .gate:before{left:14px} .gate:after{right:14px}
    .sign{
      position:absolute;left:50%;top:8px;transform:translateX(-50%);
      background:#f4e1b5;color:#4a2a12;font-weight:800;padding:4px 16px;border-radius:8px;
      box-shadow:inset 0 -3px 0 #c9a36a;font-size:15px;white-space:nowrap;
    }
    .skybit{position:absolute;font-size:28px;top:6px}
    .skybit.l{left:36px} .skybit.r{right:36px}
    .hud{
      display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px auto 6px;max-width:400px;
    }
    .chip{
      background:rgba(255,255,255,.88);color:#3f2a14;font-weight:800;padding:6px 12px;border-radius:999px;font-size:15px;
    }
    body.night .chip{background:rgba(20,30,20,.72);color:#e8f0d8}
    .yard{
      width:min(380px,94vw);margin:8px auto;padding:14px 10px 16px;
      background:linear-gradient(#6d8f3c,#4f6d28);
      border:8px solid #5a3a1c;border-radius:18px;
      box-shadow:inset 0 0 0 4px #7a5228,0 10px 0 #3d2410;
      position:relative;
    }
    body.night .yard{background:linear-gradient(#243818,#152410);border-color:#2a1c10}
    .post{position:absolute;width:12px;height:22px;background:#5a3a1c;top:-18px;border-radius:3px}
    .post.a{left:18px}.post.b{right:18px}
    .grid{display:grid;gap:8px;perspective:800px}
    .card{
      height:78px;border-radius:14px;position:relative;transform-style:preserve-3d;
      transition:transform .45s;box-shadow:0 4px 0 rgba(0,0,0,.25);
    }
    .card.sm{height:64px}
    .card:active:not(.on):not(.ok){transform:translateY(2px)}
    .card.on{transform:rotateY(180deg)}
    .card.ok{transform:rotateY(180deg);pointer-events:none}
    .face{
      position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;font-size:36px;
      backface-visibility:hidden;-webkit-backface-visibility:hidden;
    }
    .card.sm .face{font-size:30px}
    .back{background:linear-gradient(160deg,#2d6a32,#14532d);color:#bbf7d0}
    .front{background:#fffbeb;transform:rotateY(180deg);color:#222}
    .card.ok .front{background:#d9f99d}
    body.night .card.on .front,body.night .card.ok .front{
      filter:drop-shadow(0 0 10px #fde68a);
      background:#1a2a14;color:#fff;
    }
    body.night .card.ok .front{background:#365314}
    .peek{
      margin:12px auto 0;display:inline-flex;align-items:center;gap:8px;
      background:#fde68a;color:#3b2100;font-weight:800;font-size:20px;
      padding:12px 22px;border-radius:999px;box-shadow:0 6px 0 #ca8a04;
    }
    .peek:active{transform:translateY(3px);box-shadow:0 3px 0 #ca8a04}
    .peek.off{opacity:.4;pointer-events:none}
    .msg{font-weight:800;margin-top:10px;min-height:1.4em;color:#fff;text-shadow:0 1px 0 #365314}
    .banner{
      display:none;width:min(340px,92vw);margin:14px auto 0;padding:16px 14px;
      background:#fff7ed;border-radius:20px;box-shadow:0 8px 0 #b45309;color:#7c2d12;
    }
    .banner.on{display:block}
    .banner h2{font-size:24px;margin-bottom:6px}
    .acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
    .play{
      background:#ffd166;color:#3b2100;font-weight:800;font-size:22px;
      padding:12px 20px;border-radius:999px;box-shadow:0 6px 0 #e09f1f;
    }
    .play.next{background:#86efac;color:#14532d;box-shadow:0 6px 0 #16a34a}
    .parade{font-size:36px;letter-spacing:4px;margin:4px 0}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <h1>Memory Zoo</h1>
  <div class="gate">
    <span class="skybit l" id="skyL">☀️</span>
    <div class="sign" id="sign">Pond · Day</div>
    <span class="skybit r" id="skyR">🎫</span>
  </div>
  <div class="hud">
    <span class="chip" id="matches">Match 0 / 2</span>
    <span class="chip" id="peekHud">Peek 1</span>
    <span class="chip" id="stars">⭐ 0</span>
  </div>
  <div class="yard">
    <div class="post a"></div><div class="post b"></div>
    <div class="grid" id="grid"></div>
  </div>
  <button class="peek" id="peekBtn">🏮 Peek</button>
  <p class="msg" id="msg">Flip two friends!</p>
  <div class="banner" id="banner">
    <div class="parade" id="parade">🦁🐘</div>
    <h2 id="btitle">All matched!</h2>
    <p id="bsub"></p>
    <div class="acts">
      <button class="play next" id="nextBtn">Next</button>
      <button class="play" id="againBtn">Play again</button>
    </div>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
    var levels=[
      {name:"Pond",sky:"Day",mode:"",cols:2,animals:["🦁","🐘"],icon:"☀️"},
      {name:"Savanna",sky:"Dusk",mode:"dusk",cols:3,animals:["🦁","🐘","🦒"],icon:"🌅"},
      {name:"Jungle",sky:"Night",mode:"night",cols:4,animals:["🦁","🐘","🦒","🐧","🐼","🐸"],icon:"🌙"}
    ];
    var lv=0,open=[],lock=false,matched=0,need=0,peekLeft=1,stars=0,score=0,peekUsed=false;
    var grid=document.getElementById("grid");
    function hud(){
      document.getElementById("matches").textContent="Match "+matched+" / "+need;
      document.getElementById("peekHud").textContent="Peek "+peekLeft;
      document.getElementById("stars").textContent="⭐ "+stars;
    }
    function load(){
      var L=levels[lv];
      document.body.className=L.mode;
      document.getElementById("sign").textContent=L.name+" · "+L.sky;
      document.getElementById("skyL").textContent=L.icon;
      document.getElementById("skyR").textContent=L.mode==="night"?"🏮":"🎫";
      document.getElementById("banner").classList.remove("on");
      document.getElementById("msg").textContent=L.mode==="night"?"Night pals glow!":"Flip two friends!";
      document.getElementById("nextBtn").style.display=lv<2?"":"none";
      peekLeft=1;peekUsed=false;matched=0;need=L.animals.length;open=[];lock=false;
      document.getElementById("peekBtn").className="peek";
      grid.style.gridTemplateColumns="repeat("+L.cols+",1fr)";
      var deck=shuffle(L.animals.concat(L.animals));
      grid.innerHTML="";
      deck.forEach(function(a){
        var b=document.createElement("button");
        b.className="card"+(L.cols===4?" sm":"");
        b.innerHTML='<span class="face back">🌿</span><span class="face front">'+a+"</span>";
        b.onclick=function(){flip(b,a);};
        grid.appendChild(b);
      });
      hud();
    }
    function flip(b,a){
      if(lock||b.classList.contains("on")||b.classList.contains("ok"))return;
      b.classList.add("on");beep(500,.06);open.push({b:b,a:a});
      if(open.length<2)return;
      lock=true;
      if(open[0].a===open[1].a){
        open[0].b.classList.add("ok");open[1].b.classList.add("ok");
        matched++;score++;stars+= (matched===need?1:0);
        beep(840,.12);open=[];lock=false;hud();
        document.getElementById("msg").textContent="A pair!";
        if(matched>=need){
          if(!peekUsed)stars++;
          hud();
          document.getElementById("parade").textContent=levels[lv].animals.join("");
          document.getElementById("btitle").textContent=lv<2?"Enclosure done!":"All matched!";
          document.getElementById("bsub").textContent=peekUsed?"Nice matching.":"Peek saved! Extra star!";
          document.getElementById("banner").classList.add("on");
          beep(990,.2);
        }
      }else{
        document.getElementById("msg").textContent="Try those again.";
        beep(200,.08);
        setTimeout(function(){open.forEach(function(o){o.b.classList.remove("on");});open=[];lock=false;},700);
      }
    }
    document.getElementById("peekBtn").onclick=function(){
      if(peekLeft<=0||lock)return;
      peekLeft=0;peekUsed=true;hud();
      this.classList.add("off");
      var cards=grid.querySelectorAll(".card:not(.ok)");
      cards.forEach(function(c){c.classList.add("on");});
      beep(640,.1);
      document.getElementById("msg").textContent="Peek! Remember…";
      lock=true;
      setTimeout(function(){
        cards.forEach(function(c){if(!c.classList.contains("ok"))c.classList.remove("on");});
        lock=false;open=[];
        document.getElementById("msg").textContent="Now flip two!";
      },1200);
    };
    document.getElementById("nextBtn").onclick=function(){if(lv<2){lv++;load();}};
    document.getElementById("againBtn").onclick=function(){lv=0;stars=0;score=0;load();};
    load();
  </script>
</body>
</html>
