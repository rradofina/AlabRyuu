<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Memory Zoo</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>
    html,body{background:#14532d;overflow:auto;touch-action:manipulation}
    .grid{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(94vw,460px);z-index:2}
    .card{min-height:120px;border-radius:24px;background:#fff;font-size:72px;box-shadow:0 6px 0 #052e16}
    .card.on{outline:6px solid #fde047}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="pr">0/4</b></div>
  <div id="say">Tap the animal we show!</div>
  <div class="grid" id="grid"></div>
  <div class="cover" id="title">
    <div class="hero">🦁</div>
    <h1>Memory Zoo</h1>
    <p>Tap the same animal!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🎉</div>
    <h1>Zoo match!</h1>
    <p>All the pals found friends.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var ANIM = ["🦁", "🐘", "🦒", "🐧"];
    var round = 0, want = "🦁", lock = false;
    function deal() {
      want = ANIM[round % ANIM.length];
      var opts = ANIM.filter(function (e) { return e !== want; });
      opts = [want, opts[round % opts.length], opts[(round + 1) % opts.length]];
      for (var i = opts.length - 1; i > 0; i--) {
        var j = (Math.random() * (i + 1)) | 0, t = opts[i]; opts[i] = opts[j]; opts[j] = t;
      }
      var g = document.getElementById("grid");
      g.innerHTML = "";
      opts.forEach(function (e) {
        var b = document.createElement("button");
        b.className = "card";
        b.textContent = e;
        b.onclick = function () { pick(e, b); };
        g.appendChild(b);
      });
      document.getElementById("pr").textContent = round + "/4";
      document.getElementById("say").textContent = "Tap " + want + "!";
      lock = false;
    }
    function pick(e, b) {
      if (lock) return;
      if (e !== want) { kidMiss(e, "Tap " + want + "!", innerWidth * 0.5, innerHeight * 0.4); return; }
      lock = true;
      b.classList.add("on");
      round++;
      document.getElementById("pr").textContent = round + "/4";
      kidTap(e, "Yes " + e + "!", innerWidth * 0.5, innerHeight * 0.35, 520);
      if (round >= 4) { kidFinish(); }
      else setTimeout(deal, 280);
    }
    function start() {
      round = 0;
      kidBegin();
      deal();
    }
    kidBind(start);
  })();
  </script>
</body>
</html>
