<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tea Party</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#fecdd3}</style>
</head>
<body>
<script>
kidChrome({
  title: "Tea Party",
  hero: "🍵",
  blurb: "Tap to pour a cup for each pal!",
  say: "Tap to pour!",
  hud: "🍵 0/4",
  winHero: "🧸",
  winTitle: "Tea time!",
  winText: "Four happy cups.",
  again: "Pour again",
  bg: "#fecdd3",
  extra: '<div class="dock" id="tools"><button id="pour"><span>🫖</span>Pour</button></div>'
});
(function () {
  var S = kidStage();
  var pals = ["🐻", "🐰", "🐱", "🐶"];
  var play = false, cup = 0, fill = 0, hold = false, done = [0, 0, 0, 0];
  function succeed() {
    if (!play || cup >= 4) return;
    done[cup] = 1; cup++; fill = 0; hold = false;
    kidTap("🍵", cup >= 4 ? "Party!" : "Tea!", S.W * 0.5, S.H * 0.42, 580);
    if (kidMark(cup, 4, "🍵")) { play = false; kidFinish("Four happy cups."); }
    else kidSay("Tap to pour for " + pals[cup] + "!");
  }
  function start() {
    play = true; cup = 0; fill = 0; hold = false; done = [0, 0, 0, 0];
    kidBegin("Tap to pour!", "🍵 0/4");
    kidDock(true);
  }
  kidBind(start);
  document.getElementById("pour").onclick = function () { if (play) succeed(); };
  addEventListener("pointerdown", function (e) {
    if (!play) return;
    if (e.target.closest && e.target.closest("a,button")) return;
    hold = true;
  });
  addEventListener("pointerup", function () { if (!hold) return; hold = false; succeed(); });
  addEventListener("pointercancel", function () { hold = false; });
  kidTick(function (dt) {
    if (play && hold) {
      fill += dt * 1.5;
      if (fill >= 0.8) succeed();
    }
    S.bg("#ffe4e6");
    var i;
    for (i = 0; i < 4; i++) {
      var x = S.W * (0.16 + i * 0.22), y = S.H * 0.62;
      S.em(pals[i], x, y - 78, i === cup && play ? 84 : 64);
      S.em(done[i] ? "🍵" : "🥛", x, y, 72);
      if (i === cup && play) {
        var drops = Math.round(fill * 5);
        var d;
        for (d = 0; d < drops; d++) S.em("💧", x, y - 18 - d * 16, 28);
      }
    }
    if (play) S.em(hold ? "🫖" : "✋", S.W * 0.5, S.H * 0.28, 88);
  });
})();
</script>
</body>
</html>
