<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Paint House</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#fef3c7} .dock button{min-width:72px;min-height:84px}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="pc">🎨 0</b></div>
  <div id="say">Pick a color. Paint the house!</div>
  <div class="dock" id="dock">
    <button data-c="#ef4444" style="background:#ef4444"><span>🟥</span></button>
    <button data-c="#3b82f6" style="background:#3b82f6"><span>🟦</span></button>
    <button data-c="#22c55e" style="background:#22c55e"><span>🟩</span></button>
    <button data-c="#f59e0b" class="on" style="background:#f59e0b"><span>🟨</span></button>
    <button data-c="#a855f7" style="background:#a855f7"><span>🟪</span></button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🏠</div>
    <h1>Paint House</h1>
    <p>Drag a fat brush. Color the walls!</p>
    <button class="play" id="go">Paint</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🏡</div>
    <h1>Pretty house!</h1>
    <p>So colorful.</p>
    <button class="play g" id="again">Paint again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, color = "#f59e0b", drawing = 0, painted = 0, lastX = 0, lastY = 0;
    var AV = { shirt: "#ffd166" };
    try { var a = JSON.parse(localStorage.getItem("alabryuu-avatar") || "null"); if (a && a.shirt) AV.shirt = a.shirt; } catch (e) {}
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
      drawHouse();
    }
    addEventListener("resize", resize);
    function houseBox() { return { x: W * 0.22, y: H * 0.28, w: W * 0.56, h: H * 0.36 }; }
    function drawHouse() {
      x.fillStyle = "#7dd3fc"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#4ade80"; x.fillRect(0, H * 0.64, W, H);
      em("☀️", W * 0.84, 80, 56);
      var b = houseBox();
      x.fillStyle = "#fed7aa"; x.fillRect(b.x, b.y, b.w, b.h);
      x.fillStyle = "#9a3412";
      x.beginPath(); x.moveTo(b.x - 16, b.y); x.lineTo(b.x + b.w / 2, b.y - 70); x.lineTo(b.x + b.w + 16, b.y); x.fill();
      x.fillStyle = "#78350f"; x.fillRect(b.x + b.w * 0.4, b.y + b.h * 0.45, b.w * 0.2, b.h * 0.55);
      em("🪟", b.x + b.w * 0.22, b.y + b.h * 0.35, 40);
      em("🪟", b.x + b.w * 0.78, b.y + b.h * 0.35, 40);
    }
    function start() {
      play = true; painted = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      resize();
      document.getElementById("say").textContent = "Drag on the walls!";
      document.getElementById("pc").textContent = "🎨 0";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    [].forEach.call(document.querySelectorAll("#dock button"), function (b) {
      b.onclick = function () {
        color = b.getAttribute("data-c");
        [].forEach.call(document.querySelectorAll("#dock button"), function (el) { el.classList.toggle("on", el === b); });
      };
    });
    function inHouse(px, py) {
      var b = houseBox();
      return px > b.x && px < b.x + b.w && py > b.y && py < b.y + b.h && py < H - 120;
    }
    function blob(px, py) {
      if (!inHouse(px, py)) return;
      x.fillStyle = color;
      x.beginPath(); x.arc(px, py, 18, 0, Math.PI * 2); x.fill();
      painted++;
      document.getElementById("pc").textContent = "🎨 " + painted;
      if (painted >= 24) {
        play = false; drawing = 0;
        document.getElementById("dock").classList.remove("on");
        document.getElementById("win").classList.remove("off");
      }
    }
    cv.addEventListener("pointerdown", function (e) {
      if (!play || kidPt(e, cv).y > H - 110) return;
      drawing = 1; lastX = kidPt(e, cv).x; lastY = kidPt(e, cv).y;
      blob(kidPt(e, cv).x, kidPt(e, cv).y);
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    });
    cv.addEventListener("pointermove", function (e) {
      if (!drawing || !play) return;
      if (inHouse(kidPt(e, cv).x, kidPt(e, cv).y)) {
        x.strokeStyle = color; x.lineWidth = 28; x.lineCap = "round";
        x.beginPath(); x.moveTo(lastX, lastY); x.lineTo(kidPt(e, cv).x, kidPt(e, cv).y); x.stroke();
        painted++;
        document.getElementById("pc").textContent = "🎨 " + painted;
        if (painted >= 40) {
          play = false; drawing = 0;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("win").classList.remove("off");
        }
      }
      lastX = kidPt(e, cv).x; lastY = kidPt(e, cv).y;
    });
    addEventListener("pointerup", function () { drawing = 0; });
    resize();
  })();
  </script>
</body>
</html>
