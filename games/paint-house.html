<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Paint House</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:#1e1b4b;color:#1e1b4b;touch-action:none;user-select:none}
    .home{position:fixed;top:12px;left:12px;z-index:8;color:#fff;text-decoration:none;font-weight:800;font-size:17px;background:rgba(30,27,75,.45);padding:8px 14px;border-radius:999px;touch-action:manipulation}
    canvas{display:block;width:100%;height:100%}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <script>
  (function(){
    var cv=document.getElementById("c"),x=cv.getContext("2d");
    var W,H,T=0,last=0,stage="title",room=0,stars=0,mx=0,my=0,down=0,brush=null;
    var hits=[],say="Tap Play!",drips=[],walk=0,walkTo=0,painted=[],quest=0,doorGlow=0,stepT=0;
    var AV={name:"Alab",shirt:"#a78bfa",hair:"#422006"};
    try{var a=JSON.parse(localStorage.getItem("alabryuu-avatar")||"null");if(a&&a.name){AV.name=a.name;AV.shirt=a.shirt||AV.shirt;}}catch(e){}
    var ROOMS=[
      {n:"Living",want:"#f9a8d4",label:"Pink",sky:"day",furn:"sofa",card:"Paint the living wall pink!"},
      {n:"Kitchen",want:"#86efac",label:"Mint",sky:"day",furn:"table",card:"Kitchen wants mint!"},
      {n:"Bed",want:"#93c5fd",label:"Sky",sky:"dusk",furn:"bed",card:"Sleepy blue, please."},
      {n:"Bath",want:"#67e8f9",label:"Aqua",sky:"night",furn:"tub",card:"Splash aqua tiles."},
      {n:"Attic",want:"#fde68a",label:"Sun",sky:"night",furn:"box",card:"Sunny attic gold!"}
    ];
    var PAL=["#f9a8d4","#86efac","#93c5fd","#67e8f9","#fde68a","#fdba74"];
    function beep(f,d,tp){try{var ac=beep.ac||(beep.ac=new(window.AudioContext||window.webkitAudioContext)());var o=ac.createOscillator(),g=ac.createGain();o.type=tp||"sine";o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d);}catch(e){}}
    function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
    addEventListener("resize",resize);resize();
    function rnd(a,b){return a+Math.random()*(b-a);}
    function round(a,b,w,h,r,col){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();if(col){x.fillStyle=col;x.fill();}}
    function ellipse(cx,cy,rx,ry,col){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,6.28);x.fillStyle=col;x.fill();}
    function hitAt(px,py){for(var i=hits.length-1;i>=0;i--){var h=hits[i];if(px>=h.x&&px<=h.x+h.w&&py>=h.y&&py<=h.y+h.h)return h;}return null;}
    function btn(id,bx,by,bw,bh,label,col,tc){hits.push({id:id,x:bx,y:by,w:bw,h:bh});round(bx,by+5,bw,bh,16,col||"#ffd166");x.fillStyle=tc||"#3b2100";x.font="800 16px Trebuchet MS";x.textAlign="center";x.textBaseline="middle";x.fillText(label,bx+bw/2,by+bh/2);}
    function skyCol(k){
      if(k==="day")return["#7dd3fc","#fde68a"];
      if(k==="dusk")return["#fb923c","#7c3aed"];
      return["#1e1b4b","#312e81"];
    }
    function drawWindow(wx,wy,ww,wh,k){
      var sc=skyCol(k);
      var g=x.createLinearGradient(wx,wy,wx,wy+wh);
      g.addColorStop(0,sc[0]);g.addColorStop(1,sc[1]);
      x.fillStyle="#fff";round(wx-6,wy-6,ww+12,wh+12,6,"#fff");
      x.fillStyle=g;x.fillRect(wx,wy,ww,wh);
      x.strokeStyle="#c4b5fd";x.lineWidth=4;x.strokeRect(wx,wy,ww,wh);
      x.beginPath();x.moveTo(wx+ww/2,wy);x.lineTo(wx+ww/2,wy+wh);x.moveTo(wx,wy+wh/2);x.lineTo(wx+ww,wy+wh/2);x.stroke();
      if(k==="night"){
        x.fillStyle="#fde68a";x.beginPath();x.arc(wx+ww*0.7,wy+wh*0.28,8,0,6.28);x.fill();
        for(var i=0;i<6;i++){x.fillRect(wx+8+i*10,wy+8+(i%3)*12,2,2);}
      }else if(k==="dusk"){ellipse(wx+ww*0.7,wy+wh*0.35,12,12,"#fb923c");}
      else{ellipse(wx+ww*0.72,wy+wh*0.3,11,11,"#fde047");}
    }
    function drawTeddy(fx,fy){
      ellipse(fx+18,fy+10,10,9,"#d97706");
      ellipse(fx+10,fy+4,5,5,"#d97706");
      ellipse(fx+26,fy+4,5,5,"#d97706");
      ellipse(fx+18,fy+22,9,8,"#b45309");
      x.fillStyle="#422006";
      x.beginPath();x.arc(fx+14,fy+9,1.4,0,6.28);x.fill();
      x.beginPath();x.arc(fx+22,fy+9,1.4,0,6.28);x.fill();
    }
    function drawFurn(kind,fx,fy){
      if(kind==="sofa"){
        round(fx,fy,120,46,12,"#c4b5fd");round(fx+8,fy-16,40,24,8,"#ddd6fe");round(fx+72,fy-16,40,24,8,"#ddd6fe");
        x.fillStyle="#7c3aed";x.fillRect(fx+10,fy+40,16,16);x.fillRect(fx+94,fy+40,16,16);
      }else if(kind==="table"){
        round(fx,fy,100,16,6,"#a8a29e");x.fillStyle="#78716c";x.fillRect(fx+10,fy+16,8,28);x.fillRect(fx+82,fy+16,8,28);
        ellipse(fx+50,fy-6,16,10,"#fb7185");ellipse(fx+30,fy+2,8,6,"#86efac");
      }else if(kind==="bed"){
        round(fx,fy,130,40,10,"#93c5fd");round(fx+8,fy-18,50,24,8,"#fff");round(fx+70,fy-8,50,16,6,"#c4b5fd");
      }else if(kind==="tub"){
        round(fx,fy,120,40,18,"#e0f2fe");x.fillStyle="#67e8f9";round(fx+8,fy+8,104,24,12,"#67e8f9");
        for(var b=0;b<4;b++)ellipse(fx+24+b*22,fy+6,6,4,"rgba(255,255,255,.7)");
      }else{
        round(fx,fy,50,40,6,"#d97706");round(fx+56,fy+8,40,32,6,"#fdba74");
        drawTeddy(fx+6,fy+8);
      }
    }
    function drawKid(px,py,moving){
      var step=moving?Math.sin(stepT*10)*11:Math.sin(T*3)*2;
      var bob=moving?Math.abs(Math.sin(stepT*10))*4:Math.sin(T*2)*2;
      var arm=moving?Math.sin(stepT*10)*10:6;
      ellipse(px,py+40,16,6,"rgba(0,0,0,.16)");
      x.strokeStyle="#1e1b4b";x.lineWidth=6;x.lineCap="round";
      x.beginPath();x.moveTo(px-7,py+16);x.lineTo(px-8+step,py+38);x.stroke();
      x.beginPath();x.moveTo(px+7,py+16);x.lineTo(px+8-step,py+38);x.stroke();
      x.fillStyle="#334155";
      x.beginPath();x.ellipse(px-8+step,py+40,6,3,0,0,6.28);x.fill();
      x.beginPath();x.ellipse(px+8-step,py+40,6,3,0,0,6.28);x.fill();
      x.fillStyle=AV.shirt;
      round(px-14,py-2+bob,28,24,8,AV.shirt);
      x.strokeStyle=AV.shirt;x.lineWidth=5;
      x.beginPath();x.moveTo(px-14,py+8+bob);x.lineTo(px-22,py+16-arm);x.stroke();
      x.beginPath();x.moveTo(px+14,py+8+bob);x.lineTo(px+24,py+4-arm);x.stroke();
      if(brush){
        x.fillStyle="#78716c";round(px+22,py-8+bob,5,22,2,"#78716c");
        x.fillStyle=brush;round(px+16,py-16+bob,18,10,3,brush);
      }
      x.fillStyle="#fde68a";
      x.beginPath();x.arc(px,py-18+bob,13,0,6.28);x.fill();
      x.fillStyle=AV.hair;
      x.beginPath();x.ellipse(px,py-26+bob,13,7,0,Math.PI,0,true);x.fill();
      x.beginPath();x.arc(px-10,py-18+bob,4,0,6.28);x.fill();
      x.beginPath();x.arc(px+10,py-18+bob,4,0,6.28);x.fill();
      x.fillStyle="#1e1b4b";
      x.beginPath();x.arc(px-4,py-19+bob,1.7,0,6.28);x.fill();
      x.beginPath();x.arc(px+4,py-19+bob,1.7,0,6.28);x.fill();
      x.fillStyle="#fb7185";
      x.beginPath();x.arc(px-7,py-14+bob,2,0,6.28);x.fill();
      x.beginPath();x.arc(px+7,py-14+bob,2,0,6.28);x.fill();
      x.strokeStyle="#b45309";x.lineWidth=1.6;
      x.beginPath();x.arc(px,py-15+bob,4,0.2,Math.PI-0.2);x.stroke();
    }
    function drawRug(){
      x.fillStyle="#ddd6fe";x.beginPath();x.ellipse(W*0.5,H*0.66,W*0.28,18,0,0,6.28);x.fill();
      x.strokeStyle="#c4b5fd";x.setLineDash([6,4]);x.beginPath();x.ellipse(W*0.5,H*0.66,W*0.22,12,0,0,6.28);x.stroke();x.setLineDash([]);
    }
    function drawPictures(){
      var pics=["#fde68a","#93c5fd","#86efac"];
      for(var i=0;i<3;i++){
        var px=W*0.14+i*54,py=H*0.2;
        round(px,py,40,32,4,pics[i]);
        x.strokeStyle="#7c3aed";x.lineWidth=3;x.stroke();
        if(i===0){ellipse(px+20,py+16,8,8,"#f59e0b");}
        else if(i===1){ellipse(px+22,py+12,7,7,"#fef3c7");x.fillStyle="#1e1b4b";x.beginPath();x.arc(px+16,py+12,7,0.4,4.8);x.fill();}
        else{x.fillStyle="#166534";x.fillRect(px+18,py+18,4,10);ellipse(px+20,py+14,10,7,"#22c55e");}
      }
    }
    function drawLamp(){
      x.fillStyle="#a8a29e";x.fillRect(W*0.08,H*0.32,6,70);
      ellipse(W*0.11,H*0.32,16,10,ROOMS[room].sky==="night"?"#fde68a":"#fef3c7");
      if(ROOMS[room].sky==="night"){x.globalAlpha=0.15;ellipse(W*0.11,H*0.4,40,50,"#fde68a");x.globalAlpha=1;}
    }
    function drawStairs(){
      for(var i=0;i<4;i++){round(W*0.78,H*0.58-i*10,50,12,2,"#c4b5fd");}
    }
    function drawRoom(){
      var R=ROOMS[room],wall=painted[room]||"#f5f3ff";
      x.fillStyle="#e7e5e4";x.fillRect(0,0,W,H);
      x.fillStyle=wall;x.fillRect(0,0,W,H*0.68);
      x.fillStyle="#d6d3d1";
      x.beginPath();x.moveTo(0,H*0.68);x.lineTo(W*0.08,H*0.58);x.lineTo(W*0.92,H*0.58);x.lineTo(W,H*0.68);x.closePath();x.fill();
      x.fillStyle="#c4b5fd";x.fillRect(0,0,W,H*0.1);
      drawWindow(W*0.62,H*0.16,W*0.22,H*0.22,R.sky);
      drawFurn(R.furn,W*0.12,H*0.48);
      drawRug();drawPictures();drawLamp();drawStairs();
      var lamp=R.sky==="night"?0.28:0.06;
      x.fillStyle="rgba(30,27,75,"+lamp+")";x.fillRect(0,0,W,H);
      var kidX=W*0.42+walk;
      drawKid(kidX,H*0.5,walkTo!==0);
      hits.push({id:"wall",x:W*0.28,y:H*0.14,w:W*0.28,h:H*0.38});
      if(room<4){
        var dx=W*0.86,dy=H*0.36;
        hits.push({id:"door",x:dx-30,y:dy,w:60,h:H*0.28});
        round(dx-28,dy,56,H*0.28,8,painted[room]===R.want?"#86efac":"#a8a29e");
        x.fillStyle="#fde68a";x.beginPath();x.arc(dx+16,dy+H*0.14,5,0,6.28);x.fill();
        x.fillStyle="#1e1b4b";x.font="800 11px Trebuchet MS";x.textAlign="center";x.fillText("GO",dx,dy-8);
      }
      if(room>0){
        hits.push({id:"back",x:16,y:H*0.36,w:50,h:H*0.26});
        round(16,H*0.36,50,H*0.26,8,"#ddd6fe");
        x.fillStyle="#1e1b4b";x.font="800 12px Trebuchet MS";x.textAlign="center";x.fillText("BACK",41,H*0.48);
      }
      round(W*0.08,H*0.12,W*0.44,48,12,"#fffbeb");
      x.fillStyle="#6d28d9";x.font="800 14px Trebuchet MS";x.textAlign="left";
      x.fillText("Quest: "+R.card,W*0.1,H*0.14+18);
      x.fillText(AV.name+" paints "+R.label,W*0.1,H*0.14+36);
    }
    function drawPots(){
      for(var i=0;i<PAL.length;i++){
        var bx=20+i*((W-20)/6),by=H-70;
        hits.push({id:"pot-"+i,x:bx,y:by,w:56,h:56,col:PAL[i]});
        ellipse(bx+28,by+40,18,6,"#78716c");
        x.fillStyle=PAL[i];x.beginPath();x.moveTo(bx+10,by+8);x.lineTo(bx+46,by+8);x.lineTo(bx+40,by+44);x.lineTo(bx+16,by+44);x.closePath();x.fill();
        if(brush===PAL[i]){x.strokeStyle="#111";x.lineWidth=3;x.stroke();}
      }
    }
    function drawTitle(){
      var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#7dd3fc");g.addColorStop(1,"#c4b5fd");
      x.fillStyle=g;x.fillRect(0,0,W,H);
      x.fillStyle="#fde68a";x.beginPath();x.arc(W*0.78,H*0.16,30,0,6.28);x.fill();
      x.fillStyle="#f8fafc";
      for(var i=0;i<4;i++)ellipse(30+i*90,40+Math.sin(T+i)*6,36,14,"#f8fafc");
      x.fillStyle="#7c3aed";round(W*0.22,H*0.38,W*0.56,H*0.36,8,"#7c3aed");
      x.fillStyle="#f5f3ff";x.fillRect(W*0.28,H*0.44,W*0.18,H*0.14);
      x.fillStyle="#86efac";x.fillRect(W*0.5,H*0.48,W*0.2,H*0.26);
      x.fillStyle="#fde68a";
      x.beginPath();x.moveTo(W*0.18,H*0.38);x.lineTo(W*0.5,H*0.22);x.lineTo(W*0.82,H*0.38);x.closePath();x.fill();
      drawKid(W*0.36,H*0.6,true);
      x.fillStyle="#1e1b4b";x.font="800 "+Math.floor(Math.min(44,W/8))+"px Trebuchet MS";x.textAlign="center";
      x.fillText("Paint House",W/2,H*0.16);
      btn("play",W/2-80,H*0.8,160,50,"Play!","#ffd166","#3b2100");
      say="Walk rooms. Paint the quest color.";
    }
    function drawWin(){
      drawRoom();
      x.fillStyle="rgba(30,27,75,.55)";x.fillRect(0,0,W,H);
      x.fillStyle="#fff";x.font="800 40px Trebuchet MS";x.textAlign="center";
      x.fillText("Bright house!",W/2,H*0.28);
      x.font="800 18px Trebuchet MS";x.fillText(AV.name+" painted 5 rooms. Stars "+stars,W/2,H*0.38);
      btn("again",W/2-80,H*0.7,160,50,"Again","#86efac","#14532d");
    }
    function drawHud(){
      round(W-150,10,140,32,14,"rgba(255,255,255,.9)");
      x.fillStyle="#1e1b4b";x.font="800 13px Trebuchet MS";x.textAlign="left";x.textBaseline="middle";
      x.fillText(ROOMS[room].n+"  Stars "+stars,W-136,26);
      round(16,H-118,W-32,36,12,"rgba(255,255,255,.9)");
      x.textAlign="center";x.fillText(say,W/2,H-100);
    }
    function start(){stage="room";room=0;stars=0;painted=["#f5f3ff","#f5f3ff","#f5f3ff","#f5f3ff","#f5f3ff"];walk=0;walkTo=0;brush=ROOMS[0].want;say=ROOMS[0].card;quest=0;doorGlow=0;beep(500,.1);}
    function pointer(e,kind){
      var r=cv.getBoundingClientRect();
      mx=(e.clientX||(e.touches&&e.touches[0].clientX)||0)-r.left;
      my=(e.clientY||(e.touches&&e.touches[0].clientY)||0)-r.top;
      if(kind==="down"){down=1;onDown();}
      if(kind==="move"&&down)onDrag();
      if(kind==="up")down=0;
    }
    function onDown(){
      var h=hitAt(mx,my);if(!h)return;
      if(h.id==="play"){start();return;}
      if(h.id==="again"){stage="title";return;}
      if(h.id.indexOf("pot-")===0){brush=h.col;beep(400,.06);say="Brush is ready.";}
      if(h.id==="door"&&painted[room]===ROOMS[room].want){walkTo=1;beep(600,.1);}
      if(h.id==="back"){walkTo=-1;beep(320,.08);}
      if(h.id==="wall"&&brush){paintAt(mx,my);}
    }
    function onDrag(){if(stage==="room"){var h=hitAt(mx,my);if(h&&h.id==="wall"&&brush)paintAt(mx,my);}}
    function paintAt(px,py){
      drips.push({x:px,y:py,vy:20,c:brush,life:1.4,s:rnd(5,10)});
      if(brush===ROOMS[room].want){
        quest+=0.08;
        if(quest>=1){painted[room]=brush;stars+=2;say="Nice! Tap the door.";quest=0;beep(880,.12);}
        else say="Paint more "+ROOMS[room].label+"!";
      }else say="Quest wants "+ROOMS[room].label+".";
      beep(300+quest*200,.04);
    }
    function step(dt){
      if(walkTo){
        stepT+=dt;
        walk+=walkTo*180*dt;
        if(walk>W*0.4){room=Math.min(4,room+1);walk=-W*0.2;walkTo=0;quest=0;brush=ROOMS[room].want;say=ROOMS[room].card;}
        if(walk<-W*0.25){room=Math.max(0,room-1);walk=W*0.2;walkTo=0;say=ROOMS[room].card;}
      }else{
        stepT+=dt*0.35;
      }
      for(var i=drips.length-1;i>=0;i--){var d=drips[i];d.life-=dt;d.y+=d.vy*dt;d.s+=4*dt;if(d.life<=0)drips.splice(i,1);}
      if(stage==="room"&&room===4&&painted[4]===ROOMS[4].want){doorGlow+=dt;if(doorGlow>0.8)stage="win";}
    }
    function drawDrips(){
      for(var i=0;i<drips.length;i++){x.globalAlpha=Math.min(1,drips[i].life);x.fillStyle=drips[i].c;round(drips[i].x-3,drips[i].y,6,drips[i].s,3,drips[i].c);}
      x.globalAlpha=1;
    }
    function draw(){
      hits=[];
      if(stage==="title")drawTitle();
      else if(stage==="win")drawWin();
      else{drawRoom();drawPots();drawDrips();drawHud();}
      if(stage==="title"){round(16,H-50,W-32,36,12,"rgba(255,255,255,.9)");x.fillStyle="#1e1b4b";x.font="800 15px Trebuchet MS";x.textAlign="center";x.fillText(say,W/2,H-32);}
    }
    cv.addEventListener("pointerdown",function(e){pointer(e,"down");});
    cv.addEventListener("pointermove",function(e){pointer(e,"move");});
    cv.addEventListener("pointerup",function(){down=0;});
    function loop(now){var dt=Math.min(.033,(now-last)/1000)||.016;last=now;T=now/1000;step(dt);draw();requestAnimationFrame(loop);}
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
