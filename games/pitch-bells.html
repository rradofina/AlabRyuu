<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var open = false;
      try { open = localStorage.getItem("alabryuu-open") === "1"; } catch (e) {}
      if (open) return;
      document.documentElement.classList.add("kid-locked");
      var path = location.pathname || "";
      document.documentElement.style.background = path.indexOf("/alonzorui") === 0 ? "#fff7ed" : "#1e1b4b";
    })();
  </script>
  <style id="kid-lock-hide">
    html.kid-locked, html.kid-locked body { overflow: hidden !important; height: 100% !important; }
    html.kid-locked body { visibility: hidden !important; }
    #kid-lock, #kid-lock * { visibility: visible !important; }
  </style>
  <script src="/kid-lock.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pitch Bells</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../mix.js"></script>
  <style>
    html, body { background: #312e81; }
    .home { z-index: 60; }
    .dock button { font-size: 22px; }
    .dock button i { display: block; width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px; border: 3px solid #1e1b4b; background: var(--c, #fff); }
    .hero svg { width: 96px; height: 96px; display: block; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fl">0 / 5</b></div>
  <div id="say">Tap the bell that just rang</div>
  <div class="dock" id="dock">
    <button id="hop"><i style="--c:#fbbf24"></i>Hear</button>
  </div>
  <div class="cover" id="title">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><path d="M20 62 Q20 28 46 16 Q72 28 72 62 Z" fill="#fbbf24" stroke="#1e1b4b" stroke-width="4"/><circle cx="46" cy="68" r="8" fill="#fde68a" stroke="#1e1b4b" stroke-width="4"/></svg></div>
    <h1>Pitch Bells</h1>
    <p>Listen, then tap the same bell.</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><path d="M20 62 Q20 28 46 16 Q72 28 72 62 Z" fill="#fbbf24" stroke="#1e1b4b" stroke-width="4"/><circle cx="46" cy="68" r="8" fill="#fde68a" stroke="#1e1b4b" stroke-width="4"/></svg></div>
    <h1>You matched the bells!</h1>
    <p>Five rings, same each time.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
(function () {
  var cv = document.getElementById("c");
  var ui = Mix.boot(cv);
  var ctx, W = 0, H = 0, raf = 0;
  function layout(force) {
    var r = cv.getBoundingClientRect();
    var rw = Math.round(r.width || 0), rh = Math.round(r.height || 0);
    if (!force && ctx && Math.round(W) === rw && Math.round(H) === rh && rw > 0) return;
    var f = ui.fit();
    ctx = f.ctx; W = f.W; H = f.H;
  }
  function loop() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  function frame() {
    if (!ui.on()) return;
    layout(false);
    if (W < 2 || H < 2) { raf = requestAnimationFrame(frame); return; }
    if (step() === "stop") return;
    draw();
    raf = requestAnimationFrame(frame);
  }
  function begin() { layout(true); reset(); loop(); }
  function hud(t) {
    var el = document.getElementById("fl");
    if (el) el.textContent = t;
    var m = String(t).match(/\d+/);
    if (m) cv.dataset.score = m[0];
  }
  function sky(a, b) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ui.begin(begin);
  ui.replay(begin);
  
  var freqs, colors, target, got, pulse, lock, token;
  freqs = [392, 494, 587];
  colors = ["#f472b6", "#38bdf8", "#fbbf24"];
  function spots() { return [W * 0.22, W * 0.5, W * 0.78]; }
  function ring(i) { kidNote(freqs[i]); pulse = 0; }
  function pick() { target = Math.floor(Math.random() * 3); ring(target); }
  function reset() { got = 0; lock = false; token++; pulse = 0; pick(); hud("0 / 5"); }
  token = 0;
  function tap(i) {
    if (!ui.on() || lock) return;
    if (i === target) {
      got++;
      hud(got + " / 5");
      kidPing("Same bell");
      if (got >= 5) { draw(); ui.finish(); return; }
      lock = true;
      var my = token;
      setTimeout(function () {
        if (my !== token || !ui.on()) return;
        lock = false;
        pick();
      }, 260);
    } else {
      ring(i);
      kidPing("Listen");
    }
  }
  document.getElementById("hop").addEventListener("click", function () {
    if (!ui.on() || lock) return;
    ring(target);
  });
  cv.addEventListener("pointerdown", function (e) {
    if (!ui.on()) return;
    var p = kidPt(e, cv), xs = spots(), i, y = H * 0.46;
    for (i = 0; i < 3; i++) {
      var dx = p.x - xs[i], dy = p.y - y;
      if (dx * dx + dy * dy < 84 * 84) { tap(i); return; }
    }
  });
  function step() {
    pulse += 0.08;
    var xs = spots();
    cv.dataset.who = String(target);
    cv.dataset.y = String(Math.round(H * 0.46));
    cv.dataset.xs = xs.map(function (n) { return Math.round(n); }).join(",");
  }
  function bell(x, y, s, col, hot) {
    ctx.save(); ctx.translate(x, y);
    if (hot) { ctx.shadowColor = col; ctx.shadowBlur = 18 + Math.sin(pulse) * 8; }
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(-s, s * 0.15);
    ctx.quadraticCurveTo(-s * 0.95, -s * 0.85, 0, -s * 1.05);
    ctx.quadraticCurveTo(s * 0.95, -s * 0.85, s, s * 0.15);
    ctx.closePath(); ctx.fill(); Mix.ink(ctx);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fde68a";
    ctx.beginPath(); ctx.arc(0, s * 0.32, s * 0.18, 0, Math.PI * 2); ctx.fill(); Mix.ink(ctx);
    ctx.restore();
  }
  function draw() {
    sky("#1e1b4b", "#4338ca");
    var xs = spots(), i, s = Math.min(70, W * 0.16);
    for (i = 0; i < 3; i++) {
      var hot = i === target;
      var bob = hot ? Math.sin(pulse) * 6 : 0;
      bell(xs[i], H * 0.46 + bob, hot ? s + 6 : s, colors[i], hot);
    }
  }

  layout(true);
  if (W > 2) { reset(); draw(); }
  addEventListener("resize", function () { layout(true); if (W > 2) draw(); });
})();
  </script>
</body>
</html>
