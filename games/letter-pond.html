<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Letter Pond</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:#0369a1;color:#ecfeff;overflow:hidden;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.25);padding:8px 14px;border-radius:999px}
    #hud{position:fixed;top:12px;right:12px;font-weight:800;background:rgba(255,255,255,.16);padding:8px 12px;border-radius:16px}
    #word{position:fixed;top:56px;left:0;right:0;text-align:center;font-size:34px;font-weight:800;letter-spacing:8px}
    #pond{position:fixed;inset:0;background:linear-gradient(#67e8f9,#0369a1 60%,#065f46)}
    .let{position:absolute;width:68px;height:68px;border-radius:50%;background:#fff;color:#0f172a;font-weight:800;font-size:28px;box-shadow:0 5px 0 #0f766e}
    .let.wig{animation:wig .3s}
    @keyframes wig{25%{transform:scale(1.1) rotate(-10deg)}75%{transform:rotate(10deg)}}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(8,40,50,.84);z-index:8;gap:12px}
    .win.on{display:flex}
    .play{background:#ffd166;color:#3b2100;font-weight:800;font-size:26px;padding:14px 28px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud">Word 1 / 3</div>
  <div id="word"></div>
  <div id="pond"></div>
  <div class="win" id="win">
    <div style="font-size:72px">🔤</div>
    <h2>Word wizard!</h2>
    <button class="play" id="again">Play again</button>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var words=["CAT","SUN","BUS"],wi=0,got=0,pond=document.getElementById("pond"),letters=[];
    function showWord(){
      var w=words[wi],s="";
      for(var i=0;i<w.length;i++)s+=i<got?w[i]:"_";
      document.getElementById("word").textContent=s;
      document.getElementById("hud").textContent="Word "+(wi+1)+" / 3";
    }
    function spawnSet(){
      letters.forEach(function(L){L.el.remove();});letters=[];
      var extra="AEIOUBMPR".split("");
      var chars=words[wi].split("").concat(extra.slice(0,5));
      for(var i=chars.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=chars[i];chars[i]=chars[j];chars[j]=t;}
      chars.forEach(function(ch,n){
        var b=document.createElement("button");b.className="let";b.textContent=ch;
        var L={el:b,x:30+Math.random()*(innerWidth-90),y:120+Math.random()*(innerHeight-220),vx:(n%2?1:-1)*(0.6+Math.random()),vy:0.5};
        b.style.left=L.x+"px";b.style.top=L.y+"px";
        b.onclick=function(){
          var need=words[wi][got];
          if(ch!==need){b.classList.remove("wig");void b.offsetWidth;b.classList.add("wig");beep(180,.1);return;}
          got++;beep(640+got*40,.1);b.remove();L.dead=true;showWord();
          if(got>=3){wi++;got=0;if(wi>=3){document.getElementById("win").classList.add("on");beep(900,.2);}else{showWord();spawnSet();}}
        };
        pond.appendChild(b);letters.push(L);
      });
    }
    function loop(){
      letters.forEach(function(L){
        if(L.dead)return;
        L.x+=L.vx;L.y+=L.vy;
        if(L.x<10||L.x>innerWidth-70)L.vx*=-1;
        if(L.y<100||L.y>innerHeight-80)L.vy*=-1;
        L.el.style.left=L.x+"px";L.el.style.top=L.y+"px";
      });
      requestAnimationFrame(loop);
    }
    showWord();spawnSet();loop();
    document.getElementById("again").onclick=function(){location.reload();};
  </script>
</body>
</html>
