<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Letter Pond</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>html,body{background:#0369a1}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="rd">1/8</b></div>
  <div id="say">Tap A</div>
  <div class="cover" id="title">
    <div class="hero">🔤</div>
    <h1>Letter Pond</h1>
    <p>Tap the letter we say!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🐸</div>
    <h1>Letter star!</h1>
    <p>Eight letters caught.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, round = 0, want = "A";
    var ABC = "ABCDEFGH".split("");
    var letters = [];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function deal() {
      want = ABC[round];
      var pool = [want];
      while (pool.length < 4) {
        var L = ABC[(Math.random() * ABC.length) | 0];
        if (pool.indexOf(L) < 0) pool.push(L);
      }
      letters = pool.map(function (L, i) {
        return { L: L, x: 0.2 + (i % 2) * 0.55, y: 0.38 + ((i / 2) | 0) * 0.28 };
      });
      document.getElementById("say").textContent = "Tap " + want;
      document.getElementById("rd").textContent = (round + 1) + "/8";
    }
    function start() {
      play = true; round = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      deal();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      letters.forEach(function (L) {
        var dx = e.clientX - L.x * W, dy = e.clientY - L.y * H;
        if (dx * dx + dy * dy < 60 * 60) {
          if (L.L === want) {
            round++;
            if (round >= 8) { play = false; document.getElementById("win").classList.remove("off"); }
            else deal();
          } else document.getElementById("say").textContent = "Find " + want + "!";
        }
      });
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#38bdf8"; x.fillRect(0, 0, W, H);
      em("🐸", 50, H * 0.22, 64); em("🪷", W - 50, H * 0.28, 56);
      letters.forEach(function (L) {
        var px = L.x * W, py = L.y * H + Math.sin(t * 2 + L.x) * 6;
        em("⭕", px, py, 88);
        x.fillStyle = "#0f172a";
        x.font = "bold 48px Trebuchet MS,sans-serif";
        x.textAlign = "center"; x.textBaseline = "middle";
        x.fillText(L.L, px, py);
      });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
