<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ice Cream Shop</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#831843;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;background:linear-gradient(#fbcfe8,#a5f3fc);padding:56px 14px 24px;text-align:center}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    h1{font-size:clamp(26px,7vw,40px)}
    .order{display:inline-block;background:#fff;padding:8px 16px;border-radius:999px;font-weight:800;margin:8px;box-shadow:0 5px 0 #f472b6}
    .cone{min-height:220px;font-size:52px;line-height:1.05;margin:10px}
    .flavs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
    .flavs button{width:76px;height:76px;border-radius:20px;background:#fff;font-size:36px;box-shadow:0 6px 0 #fb7185}
    .flavs button:active{transform:translateY(3px)}
    .row{display:flex;justify-content:center;gap:10px;margin-top:12px}
    .row button{background:#ffd166;color:#3b2100;font-weight:800;padding:12px 18px;border-radius:999px;box-shadow:0 6px 0 #e09f1f}
    .msg{font-weight:800;margin-top:8px}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(60,10,40,.84);z-index:8;gap:12px;color:#fff}
    .win.on{display:flex}
    .play{background:#ffd166;color:#3b2100;font-weight:800;font-size:26px;padding:14px 28px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <h1>Ice Cream Shop</h1>
  <div class="order" id="order"></div>
  <div class="cone" id="cone">🍦</div>
  <div class="flavs" id="flavs"></div>
  <div class="row">
    <button id="undo">Oops</button>
    <button id="serve">Serve</button>
  </div>
  <p class="msg" id="msg">Stack the scoops from the bottom.</p>
  <div class="win" id="win">
    <div style="font-size:72px">🍨</div>
    <h2>Sweet shop!</h2>
    <button class="play" id="again">Scoop again</button>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var scoops=["🍓","🍫","🍦","🍇","🍋"],need=[],have=[],score=0;
    function draw(){document.getElementById("cone").innerHTML=have.slice().reverse().join("<br>")+"<br>🍦";}
    function round(){
      have=[];need=[];
      var n=2+Math.floor(Math.random()*2);
      for(var i=0;i<n;i++)need.push(scoops[Math.floor(Math.random()*scoops.length)]);
      document.getElementById("order").textContent="Please: "+need.join(" ");
      document.getElementById("msg").textContent="Cone "+(score+1)+" / 4";
      draw();
    }
    scoops.forEach(function(s){
      var b=document.createElement("button");b.textContent=s;
      b.onclick=function(){if(have.length>=4)return;have.push(s);draw();beep(540,.07);};
      document.getElementById("flavs").appendChild(b);
    });
    document.getElementById("undo").onclick=function(){have.pop();draw();beep(240,.06);};
    document.getElementById("serve").onclick=function(){
      if(have.join()!==need.join()){document.getElementById("msg").textContent="Stack them in that order!";beep(180,.1);return;}
      score++;beep(840,.12);
      if(score>=4){document.getElementById("win").classList.add("on");beep(960,.2);} else round();
    };
    document.getElementById("again").onclick=function(){location.reload();};
    round();
  </script>
</body>
</html>
