<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ice Cream Shop</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>html,body{background:#9d174d}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="od">Order</b></div>
  <div id="say">Stack the scoops we ask!</div>
  <div class="dock" id="dock">
    <button id="v"><span>🍦</span>Vanilla</button>
    <button id="c"><span>🍫</span>Choco</button>
    <button id="s"><span>🍓</span>Berry</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🍦</div>
    <h1>Ice Cream Shop</h1>
    <p>Stack scoops in order. Then serve!</p>
    <button class="play" id="go">Scoop</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">😋</div>
    <h1>Yum cone!</h1>
    <p>Perfect stack.</p>
    <button class="play g" id="again">Scoop again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, order = ["🍦", "🍫", "🍓"], stack = [];
    var MAP = { v: "🍦", c: "🍫", s: "🍓" };
    var NAME = { "🍦": "Vanilla", "🍫": "Choco", "🍓": "Berry" };
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; stack = [];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      document.getElementById("od").textContent = order.join(" ");
      document.getElementById("say").textContent = "First " + NAME[order[0]] + "!";
    }
    function add(k) {
      if (!play) return;
      var scoop = MAP[k];
      if (scoop === order[stack.length]) {
        stack.push(scoop);
        document.getElementById("say").textContent = stack.length >= 3 ? "Serve!" : "Now " + NAME[order[stack.length]] + "!";
        if (stack.length >= 3) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("win").classList.remove("off");
        }
      } else {
        stack = [];
        document.getElementById("say").textContent = "Oops. Start with " + NAME[order[0]] + "!";
      }
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("v").onclick = function () { add("v"); };
    document.getElementById("c").onclick = function () { add("c"); };
    document.getElementById("s").onclick = function () { add("s"); };
    function loop() {
      x.fillStyle = "#fda4af"; x.fillRect(0, 0, W, H);
      em("🏪", 50, 110, 56);
      em("🧇", W * 0.5, H * 0.62, 72);
      stack.forEach(function (s, i) { em(s, W * 0.5, H * 0.52 - i * 40, 64); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
