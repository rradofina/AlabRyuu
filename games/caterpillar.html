<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Caterpillar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background: #14532d; color: #ecfccb; touch-action: none; user-select: none; -webkit-user-select: none; }
    button { background: transparent; border: 0; appearance: none; -webkit-appearance: none; -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer; }
    canvas { display: block; width: 100%; height: 100%; }
    .home { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; z-index: 8; color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; background: rgba(20,83,45,.5); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 7; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; pointer-events: none; }
    #hud b { font-weight: 800; font-size: 13px; background: #166534; color: #bbf7d0; padding: 6px 10px; border-radius: 999px; }
    #say { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 7; font-weight: 800; font-size: 17px; color: #fff; text-shadow: 0 2px 0 #14532d; pointer-events: none; text-align: center; width: 92%; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px; background: linear-gradient(#22c55e, #14532d); }
    .cover.off { display: none; }
    h1 { font-size: clamp(32px, 9vw, 50px); color: #fff; text-shadow: 0 4px 0 #14532d; }
    .cover p { font-weight: 800; font-size: 18px; max-width: 340px; }
    .btn { background: #fde047; color: #422006; font-weight: 800; font-size: 22px; padding: 14px 24px; border-radius: 999px; box-shadow: 0 7px 0 #ca8a04; }
    .btn.g { background: #86efac; box-shadow: 0 7px 0 #16a34a; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="gd">Sunny leaf</b><b id="lv">🍃 0</b><b id="sg">3 segs</b></div>
  <div id="say">Drag the head. Eat leaves. Grow!</div>
  <div class="cover" id="title">
    <div style="font-size:76px">🐛</div>
    <h1>Caterpillar</h1>
    <p>Segments follow the head. Eat, grow, spin a cocoon, then fly as a butterfly.</p>
    <button class="btn" id="go">Crawl</button>
  </div>
  <div class="cover off" id="win">
    <div style="font-size:76px">🦋</div>
    <h1>You flew!</h1>
    <p id="winP">Five gardens. Soft wings.</p>
    <button class="btn g" id="again">Crawl again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, last = 0, t = 0, play = false, mode = "crawl";
    var garden = 0, eaten = 0, need = 5, drag = false;
    var head = { x: 0, y: 0 }, segs = [], trail = [];
    var leaves = [], flowers = [], puffs = [], petals = [], trees = [];
    var coco = { s: 0, a: 0 }, fly = { x: 0, y: 0, vx: 0, vy: 0, flap: 0 };
    var target = { x: 0, y: 0 };
    var GARDENS = [
      { n: "Sunny leaf", sky: ["#86efac", "#fde68a"], grass: "#4ade80", need: 5, night: 0 },
      { n: "Rain garden", sky: ["#64748b", "#86efac"], grass: "#166534", need: 6, night: 0 },
      { n: "Flower patch", sky: ["#f9a8d4", "#bbf7d0"], grass: "#22c55e", need: 6, night: 0 },
      { n: "Moon leaf", sky: ["#1e1b4b", "#166534"], grass: "#14532d", need: 7, night: 1 },
      { n: "Cocoon sky", sky: ["#c4b5fd", "#86efac"], grass: "#4ade80", need: 4, night: 0 }
    ];

    function beep(f, d, typ) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        if (ac.state === "suspended") ac.resume();
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = typ || "sine"; o.frequency.value = f; g.gain.value = 0.08;
        o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function say(s) { document.getElementById("say").textContent = s; }
    function hud() {
      document.getElementById("gd").textContent = GARDENS[garden] ? GARDENS[garden].n : "Fly";
      document.getElementById("lv").textContent = "🍃 " + eaten;
      document.getElementById("sg").textContent = segs.length + " segs";
    }
    function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
    addEventListener("resize", resize); resize();

    function spawnGarden() {
      var g = GARDENS[garden];
      need = g.need; eaten = 0; mode = garden === 4 ? "crawl" : "crawl";
      head.x = W * 0.3; head.y = H * 0.55;
      target.x = head.x; target.y = head.y;
      trail = []; segs = [];
      var i;
      for (i = 0; i < 3; i++) segs.push({ x: head.x - (i + 1) * 18, y: head.y, r: 14 - i });
      leaves = []; flowers = []; trees = []; puffs = []; petals = [];
      for (i = 0; i < need + 3; i++) {
        leaves.push({ x: 50 + Math.random() * (W - 100), y: 100 + Math.random() * (H - 180), got: 0, ph: i, s: 0.8 + Math.random() * 0.4 });
      }
      for (i = 0; i < 6; i++) {
        flowers.push({ x: 40 + i * (W / 6), y: H * 0.78 + (i % 2) * 16, bloom: garden >= 2 ? 1 : 0.2, col: ["#f472b6", "#facc15", "#fb7185", "#a78bfa"][i % 4], got: 0 });
      }
      for (i = 0; i < 4; i++) trees.push({ x: 30 + i * (W / 3.5), h: 50 + (i % 3) * 20 });
      coco.s = 0; coco.a = 0;
      hud();
      say(garden === 4 ? "Last leaves. Then a cocoon!" : "Drag the head. Eat the leaves.");
    }

    function start() {
      play = true; garden = 0; mode = "crawl";
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      spawnGarden(); beep(500, 0.1);
    }

    addEventListener("pointerdown", function (e) {
      if (e.target.closest && e.target.closest("a,button")) return;
      if (!play) return;
      drag = true;
      if (mode === "fly") {
        var i, f;
        for (i = 0; i < flowers.length; i++) {
          f = flowers[i];
          if (!f.got && Math.hypot(e.clientX - f.x, e.clientY - f.y) < 36) {
            f.got = 1; f.bloom = 1;
            eaten++;
            for (var k = 0; k < 8; k++) petals.push({ x: f.x, y: f.y, vx: (Math.random() - 0.5) * 80, vy: -40 - Math.random() * 50, life: 0.8, col: f.col });
            beep(780, 0.07);
            if (eaten >= 5) {
              play = false;
              document.getElementById("winP").textContent = "Butterfly taps. Five gardens.";
              document.getElementById("win").classList.remove("off");
              beep(990, 0.2);
            } else say("Sip flowers! " + eaten + " / 5");
          }
        }
        target.x = e.clientX; target.y = e.clientY;
      } else {
        target.x = e.clientX; target.y = e.clientY;
      }
    });
    addEventListener("pointermove", function (e) {
      if (drag && play) { target.x = e.clientX; target.y = e.clientY; }
    });
    addEventListener("pointerup", function () { drag = false; });

    function grow() {
      var lastS = segs[segs.length - 1];
      segs.push({ x: lastS.x, y: lastS.y, r: Math.max(8, 14 - segs.length * 0.4) });
    }

    function beginCocoon() {
      mode = "coco"; coco.s = 1; coco.a = 0;
      say("Cocoon! Spinning...");
      beep(300, 0.2, "triangle");
    }

    function beginFly() {
      mode = "fly"; eaten = 0;
      fly.x = head.x; fly.y = head.y; fly.vx = 0; fly.vy = 0;
      var i;
      for (i = 0; i < flowers.length; i++) { flowers[i].got = 0; flowers[i].bloom = 0.3; }
      say("You are a butterfly! Tap flowers.");
      beep(880, 0.14);
    }

    function update(dt) {
      t += dt;
      var i, L, dx, dy, d;
      if (!play && mode !== "coco") return;
      if (mode === "crawl") {
        dx = target.x - head.x; dy = target.y - head.y;
        d = Math.hypot(dx, dy) || 1;
        var spd = Math.min(220, d * 4);
        head.x += (dx / d) * spd * dt;
        head.y += (dy / d) * spd * dt;
        head.x = Math.max(20, Math.min(W - 20, head.x));
        head.y = Math.max(80, Math.min(H - 40, head.y));
        trail.unshift({ x: head.x, y: head.y });
        if (trail.length > 240) trail.pop();
        var gap = 16, pos = gap;
        for (i = 0; i < segs.length; i++) {
          var p = trail[Math.min(trail.length - 1, Math.floor(pos))];
          if (p) { segs[i].x += (p.x - segs[i].x) * Math.min(1, dt * 14); segs[i].y += (p.y - segs[i].y) * Math.min(1, dt * 14); }
          pos += gap;
        }
        for (i = 0; i < leaves.length; i++) {
          L = leaves[i];
          L.ph += dt * 3;
          if (!L.got && Math.hypot(head.x - L.x, head.y - L.y) < 26) {
            L.got = 1; eaten++; grow();
            for (var k = 0; k < 6; k++) puffs.push({ x: L.x, y: L.y, vx: (Math.random() - 0.5) * 40, vy: -20, life: 0.5 });
            beep(640 + eaten * 30, 0.07);
            hud();
            if (eaten >= need) {
              if (garden === 4) beginCocoon();
              else {
                garden++;
                spawnGarden();
                beep(800, 0.1);
              }
            } else say("Mmm leaf. " + eaten + " / " + need);
          }
        }
      } else if (mode === "coco") {
        coco.a += dt * 4;
        coco.s += dt * 0.35;
        if (coco.s > 2.4) beginFly();
      } else if (mode === "fly") {
        dx = target.x - fly.x; dy = target.y - fly.y;
        fly.vx += dx * dt * 3; fly.vy += dy * dt * 3;
        fly.vx *= 0.92; fly.vy *= 0.92;
        fly.x += fly.vx * dt; fly.y += fly.vy * dt;
        fly.flap += dt * 14;
        var i2;
        for (i2 = 0; i2 < flowers.length; i2++) flowers[i2].bloom += (1 - flowers[i2].bloom) * dt * 0.4;
      }
      for (i = puffs.length - 1; i >= 0; i--) {
        puffs[i].life -= dt * 2; puffs[i].x += puffs[i].vx * dt; puffs[i].y += puffs[i].vy * dt;
        if (puffs[i].life <= 0) puffs.splice(i, 1);
      }
      for (i = petals.length - 1; i >= 0; i--) {
        petals[i].life -= dt; petals[i].x += petals[i].vx * dt; petals[i].y += petals[i].vy * dt;
        if (petals[i].life <= 0) petals.splice(i, 1);
      }
    }

    function drawWorld() {
      var g = GARDENS[garden] || GARDENS[0];
      var gr = x.createLinearGradient(0, 0, 0, H);
      gr.addColorStop(0, g.sky[0]); gr.addColorStop(1, g.sky[1]);
      x.fillStyle = gr; x.fillRect(0, 0, W, H);
      if (g.night) {
        x.fillStyle = "#fff";
        var s;
        for (s = 0; s < 30; s++) {
          x.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + s));
          x.fillRect((s * 71) % W, 10 + (s * 37) % (H * 0.3), 2, 2);
        }
        x.globalAlpha = 1;
        x.fillStyle = "#fde047";
        x.beginPath(); x.arc(W * 0.82, 50, 16, 0, Math.PI * 2); x.fill();
      } else {
        x.fillStyle = "#fde047";
        x.beginPath(); x.arc(W * 0.18, 56, 22, 0, Math.PI * 2); x.fill();
      }
      x.fillStyle = g.grass;
      x.fillRect(0, H * 0.72, W, H * 0.28);
      var i, tr;
      for (i = 0; i < trees.length; i++) {
        tr = trees[i];
        x.fillStyle = "#92400e";
        x.fillRect(tr.x, H * 0.72 - tr.h * 0.3, 10, tr.h * 0.4);
        x.fillStyle = "#166534";
        x.beginPath(); x.arc(tr.x + 5, H * 0.72 - tr.h * 0.4, 22 + (i % 3) * 4, 0, Math.PI * 2); x.fill();
      }
      for (i = 0; i < flowers.length; i++) {
        var f = flowers[i];
        x.fillStyle = "#166534";
        x.fillRect(f.x - 2, f.y, 4, 18);
        x.save(); x.translate(f.x, f.y); x.scale(0.4 + f.bloom * 0.8, 0.4 + f.bloom * 0.8);
        x.fillStyle = f.col;
        var p;
        for (p = 0; p < 5; p++) {
          x.rotate((Math.PI * 2) / 5);
          x.beginPath(); x.ellipse(0, -10, 6, 10, 0, 0, Math.PI * 2); x.fill();
        }
        x.fillStyle = "#fde047";
        x.beginPath(); x.arc(0, 0, 5, 0, Math.PI * 2); x.fill();
        x.restore();
      }
    }

    function drawBug() {
      var i, s;
      for (i = segs.length - 1; i >= 0; i--) {
        s = segs[i];
        x.fillStyle = i % 2 ? "#4ade80" : "#22c55e";
        x.beginPath(); x.arc(s.x, s.y, s.r + Math.sin(t * 6 + i) * 1.2, 0, Math.PI * 2); x.fill();
        x.fillStyle = "#14532d";
        x.beginPath(); x.arc(s.x - 4, s.y - 2, 2, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.arc(s.x + 4, s.y - 2, 2, 0, Math.PI * 2); x.fill();
      }
      x.fillStyle = "#16a34a";
      x.beginPath(); x.arc(head.x, head.y, 16 + Math.sin(t * 8) * 1.5, 0, Math.PI * 2); x.fill();
      x.strokeStyle = "#14532d"; x.lineWidth = 2;
      x.beginPath(); x.moveTo(head.x - 6, head.y - 14); x.lineTo(head.x - 10, head.y - 26 + Math.sin(t * 8) * 3); x.stroke();
      x.beginPath(); x.moveTo(head.x + 6, head.y - 14); x.lineTo(head.x + 10, head.y - 26 + Math.cos(t * 8) * 3); x.stroke();
      x.fillStyle = "#14532d";
      x.beginPath(); x.arc(head.x - 5, head.y - 2, 3, 0, Math.PI * 2); x.fill();
      x.beginPath(); x.arc(head.x + 5, head.y - 2, 3, 0, Math.PI * 2); x.fill();
      x.fillStyle = "#fff";
      x.beginPath(); x.arc(head.x - 4, head.y - 3, 1.2, 0, Math.PI * 2); x.fill();
    }

    function drawCoco() {
      x.save();
      x.translate(head.x, head.y);
      x.rotate(coco.a);
      x.scale(coco.s, coco.s * 1.15);
      x.fillStyle = "#a3e635";
      x.beginPath(); x.ellipse(0, 0, 18, 26, 0, 0, Math.PI * 2); x.fill();
      x.strokeStyle = "#65a30d"; x.lineWidth = 2;
      x.beginPath(); x.ellipse(0, 0, 12, 20, 0.3, 0, Math.PI * 2); x.stroke();
      x.restore();
    }

    function drawButterfly() {
      var flap = Math.sin(fly.flap) * 0.7;
      x.save(); x.translate(fly.x, fly.y);
      x.fillStyle = "#7c3aed";
      x.beginPath(); x.ellipse(-16, -4, 16, 10 + flap * 8, -0.4, 0, Math.PI * 2); x.fill();
      x.beginPath(); x.ellipse(16, -4, 16, 10 + flap * 8, 0.4, 0, Math.PI * 2); x.fill();
      x.fillStyle = "#c4b5fd";
      x.beginPath(); x.ellipse(-12, 10, 10, 7 + flap * 4, 0.2, 0, Math.PI * 2); x.fill();
      x.beginPath(); x.ellipse(12, 10, 10, 7 + flap * 4, -0.2, 0, Math.PI * 2); x.fill();
      x.fillStyle = "#1e1b4b";
      x.beginPath(); x.ellipse(0, 0, 5, 14, 0, 0, Math.PI * 2); x.fill();
      x.restore();
    }

    function draw() {
      drawWorld();
      var i, L;
      for (i = 0; i < leaves.length; i++) {
        L = leaves[i];
        if (L.got) continue;
        x.save(); x.translate(L.x, L.y + Math.sin(t * 2 + L.ph) * 3); x.rotate(Math.sin(L.ph) * 0.2); x.scale(L.s, L.s);
        x.fillStyle = "#65a30d";
        x.beginPath(); x.ellipse(0, 0, 14, 8, 0.4, 0, Math.PI * 2); x.fill();
        x.strokeStyle = "#166534"; x.beginPath(); x.moveTo(-10, 0); x.lineTo(10, 0); x.stroke();
        x.restore();
      }
      for (i = 0; i < puffs.length; i++) {
        x.globalAlpha = Math.max(0, puffs[i].life);
        x.fillStyle = "#bbf7d0";
        x.beginPath(); x.arc(puffs[i].x, puffs[i].y, 5, 0, Math.PI * 2); x.fill();
      }
      for (i = 0; i < petals.length; i++) {
        x.globalAlpha = Math.max(0, petals[i].life);
        x.fillStyle = petals[i].col;
        x.beginPath(); x.ellipse(petals[i].x, petals[i].y, 5, 3, t, 0, Math.PI * 2); x.fill();
      }
      x.globalAlpha = 1;
      if (mode === "crawl") drawBug();
      else if (mode === "coco") { drawBug(); drawCoco(); }
      else drawButterfly();
      x.fillStyle = "rgba(0,0,0,.25)";
      x.fillRect(16, 8, W - 32, 6);
      x.fillStyle = "#fde047";
      var p = (garden + eaten / Math.max(1, need)) / 5;
      x.fillRect(16, 8, Math.min(W - 32, p * (W - 32)), 6);
    }

    
    var dew=[], snails=[], web=[], leafBits=[];
    function flavorUpdate(dt){
      if(!dew.length){ var i; for(i=0;i<16;i++) dew.push({x:Math.random(),y:0.2+Math.random()*0.4,ph:i}); }
      if(!snails.length){ var i; for(i=0;i<3;i++) snails.push({x:0.1+i*0.3,y:0.84,vx:0.02,ph:i}); }
      var i;
      for(i=0;i<dew.length;i++) dew[i].ph+=dt;
      for(i=0;i<snails.length;i++){ snails[i].x+=snails[i].vx*dt; if(snails[i].x>1) snails[i].x=0; snails[i].ph+=dt; }
      if(typeof eaten!=="undefined" && Math.random()<dt*3) leafBits.push({x:Math.random()*W,y:80+Math.random()*40,life:0.8,vy:20});
      for(i=leafBits.length-1;i>=0;i--){ leafBits[i].life-=dt; leafBits[i].y+=leafBits[i].vy*dt; if(leafBits[i].life<=0) leafBits.splice(i,1); }
    }
    function flavorDraw(){
      var i;
      for(i=0;i<dew.length;i++){
        x.fillStyle="rgba(255,255,255,.45)";
        x.beginPath(); x.arc(dew[i].x*W, dew[i].y*H+Math.sin(dew[i].ph)*2, 2.5,0,Math.PI*2); x.fill();
      }
      for(i=0;i<snails.length;i++){
        x.font="16px serif"; x.fillText("🐌", snails[i].x*W, snails[i].y*H+Math.sin(snails[i].ph)*2);
      }
      for(i=0;i<leafBits.length;i++){
        x.globalAlpha=Math.max(0,leafBits[i].life);
        x.fillStyle="#65a30d"; x.beginPath(); x.ellipse(leafBits[i].x,leafBits[i].y,5,3,0.4,0,Math.PI*2); x.fill();
      }
      x.globalAlpha=1;
      if(typeof mode!=="undefined" && mode==="coco"){
        x.fillStyle="#ecfccb"; x.font="bold 16px Trebuchet MS"; x.textAlign="center";
        x.fillText("changing...", W*0.5, 80);
      }
    }

    function extraWorld(){
      var _i,_a;
      _a=0.08+0.04*Math.sin(t+0); x.fillStyle='#22c55e'; x.globalAlpha=_a;
      x.fillRect((0+t*8)%W, 20, 4, 3); /* leaf vein 0 */
      _a=0.08+0.04*Math.sin(t+1); x.fillStyle='#a3e635'; x.globalAlpha=_a;
      x.fillRect((47+t*8)%W, 51, 5, 4); /* cocoon silk 1 */
      _a=0.08+0.04*Math.sin(t+2); x.fillStyle='#166534'; x.globalAlpha=_a;
      x.fillRect((94+t*8)%W, 82, 6, 5); /* stem 2 */
      _a=0.08+0.04*Math.sin(t+3); x.fillStyle='#f472b6'; x.globalAlpha=_a;
      x.fillRect((44+t*8)%W, 30, 7, 6); /* petal 3 */
      _a=0.08+0.04*Math.sin(t+4); x.fillStyle='#1e1b4b'; x.globalAlpha=_a;
      x.fillRect((91+t*8)%W, 61, 8, 3); /* moon 4 */
      _a=0.08+0.04*Math.sin(t+5); x.fillStyle='#22c55e'; x.globalAlpha=_a;
      x.fillRect((41+t*8)%W, 92, 4, 4); /* leaf vein 5 */
      _a=0.08+0.04*Math.sin(t+6); x.fillStyle='#a3e635'; x.globalAlpha=_a;
      x.fillRect((88+t*8)%W, 40, 5, 5); /* cocoon silk 6 */
      _a=0.08+0.04*Math.sin(t+7); x.fillStyle='#166534'; x.globalAlpha=_a;
      x.fillRect((38+t*8)%W, 71, 6, 6); /* stem 7 */
      _a=0.08+0.04*Math.sin(t+8); x.fillStyle='#f472b6'; x.globalAlpha=_a;
      x.fillRect((85+t*8)%W, 102, 7, 3); /* petal 8 */
      _a=0.08+0.04*Math.sin(t+9); x.fillStyle='#1e1b4b'; x.globalAlpha=_a;
      x.fillRect((35+t*8)%W, 50, 8, 4); /* moon 9 */
      _a=0.08+0.04*Math.sin(t+10); x.fillStyle='#22c55e'; x.globalAlpha=_a;
      x.fillRect((82+t*8)%W, 81, 4, 5); /* leaf vein 10 */
