<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Caterpillar</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#14532d;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;background:linear-gradient(#86efac,#22c55e);padding:56px 14px 24px;text-align:center}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    h1{font-size:clamp(26px,7vw,40px);color:#fff}
    .msg{font-weight:800;color:#fff;margin:8px}
    .bug{font-size:42px;letter-spacing:-6px;min-height:70px;margin:16px}
    .leafs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:10px}
    .leafs button{width:88px;height:88px;border-radius:24px;background:#fefce8;font-size:42px;box-shadow:0 7px 0 #166534}
    .leafs button:active{transform:translateY(4px)}
    .leafs button.gone{opacity:.35}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(10,40,20,.84);z-index:8;gap:12px;color:#fff}
    .win.on{display:flex}
    .play{background:#ffd166;color:#3b2100;font-weight:800;font-size:26px;padding:14px 28px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <h1>Caterpillar</h1>
  <p class="msg" id="msg">Tap leaves to grow!</p>
  <div class="bug" id="bug">🐛</div>
  <div class="leafs" id="leafs"></div>
  <div class="win" id="win">
    <div style="font-size:72px">🦋</div>
    <h2>Hello butterfly!</h2>
    <button class="play" id="again">Grow again</button>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var grow=1,stage="eat",box=document.getElementById("leafs");
    function draw(){document.getElementById("bug").textContent=stage==="fly"?"🦋":stage==="sleep"?"🟣":"🐛"+new Array(grow).join("🟢");}
    for(var i=0;i<6;i++){
      var b=document.createElement("button");b.textContent="🍃";
      b.onclick=function(){
        if(stage!=="eat"||this.classList.contains("gone"))return;
        this.classList.add("gone");grow++;draw();beep(500+grow*40,.1);
        document.getElementById("msg").textContent="Munch! "+grow+"/7";
        if(grow>=7){stage="sleep";document.getElementById("msg").textContent="Tap the cocoon!";var c=document.createElement("button");c.textContent="🟣";c.onclick=function(){if(stage!=="sleep")return;stage="fly";draw();document.getElementById("msg").textContent="A butterfly!";document.getElementById("win").classList.add("on");beep(960,.2);};box.appendChild(c);beep(320,.15);}
      };
      box.appendChild(b);
    }
    draw();
    document.getElementById("again").onclick=function(){location.reload();};
  </script>
</body>
</html>
