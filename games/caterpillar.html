<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Caterpillar</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#166534}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="lv">🍃 0/8</b></div>
  <div id="say">Tap leaves. Grow big. Avoid rocks!</div>
  <div class="cover" id="title">
    <div class="hero">🐛</div>
    <h1>Caterpillar</h1>
    <p>Eat 8 leaves. Become a butterfly!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🦋</div>
    <h1>You can fly!</h1>
    <p>A brand new butterfly.</p>
    <button class="play g" id="again">Grow again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, n = 0, bugX = 0.2, bits = [];
    function em(ch, px, py, s) { kidEm(x, ch, px, py, s); }
    function resize() { var b = kidFit(cv, x); W = b.W; H = b.H; }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; n = 0; bugX = 0.18;
      placeBits();
      kidBegin();
      document.getElementById("lv").textContent = "🍃 0/8";
      document.getElementById("say").textContent = "Tap the leaves!";
    }
    kidBind(start);
    function placeBits() {
      bits = [
        { e: "🍃", x: 0.28, y: 0.36 },
        { e: "🍃", x: 0.62, y: 0.34 },
        { e: "🪨", x: 0.45, y: 0.48 },
        { e: "🍃", x: 0.78, y: 0.50 },
        { e: "🍃", x: 0.22, y: 0.58 },
        { e: "🪨", x: 0.70, y: 0.66 },
        { e: "🍃", x: 0.40, y: 0.70 },
        { e: "🍃", x: 0.58, y: 0.58 },
        { e: "🍃", x: 0.85, y: 0.36 },
        { e: "🍃", x: 0.12, y: 0.46 }
      ];
    }
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var p = kidPt(e, cv), i, best = -1, bestD = 120 * 120;
      for (i = bits.length - 1; i >= 0; i--) {
        var dx = p.x - bits[i].x * W, dy = p.y - bits[i].y * H, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best < 0) {
        for (i = 0; i < bits.length; i++) if (bits[i].e === "🍃") { best = i; break; }
      }
      if (best < 0) return;
      var b = bits[best];
      if (b.e === "🍃") {
        bits.splice(best, 1); n++; bugX = Math.min(0.8, bugX + 0.07);
        document.getElementById("lv").textContent = "🍃 " + n + "/8";
        kidTap("🍃", "Yum! Growing.  " + n + "/8", b.x * innerWidth, b.y * innerHeight, 500);
        if (n >= 8) { play = false; kidFinish(); }
      } else kidTap("🪨", "Ouch rock! Eat leaves.", b.x * innerWidth, b.y * innerHeight, 220);
    });
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      x.fillStyle = "#86efac"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#4ade80"; x.fillRect(0, H * 0.78, W, H);
      em("🌳", 40, 100, 64);
      bits.forEach(function (b) { em(b.e, b.x * W, b.y * H, 80); });
      em(n >= 8 ? "🦋" : "🐛", bugX * W, H * 0.70, 64 + n * 6);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
