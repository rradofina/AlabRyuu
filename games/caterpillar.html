<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Caterpillar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      color: #14532d; touch-action: manipulation; user-select: none;
    }
    button {
      background: transparent; border: 0; appearance: none; -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(#7dd3fc 0 22%, #86efac 22% 28%, #4ade80 28%);
      padding: 54px 12px 20px;
    }
    .home {
      position: fixed; top: 12px; left: 12px; z-index: 9;
      color: #fff; text-decoration: none; font-weight: 800; font-size: 18px;
      background: rgba(0,0,0,.28); padding: 8px 14px; border-radius: 999px;
    }
    .hud { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .chip {
      background: #fefce8; font-weight: 800; padding: 6px 12px; border-radius: 999px;
      box-shadow: 0 3px 0 #365314; font-size: 15px;
    }
    h1 { text-align: center; color: #14532d; font-size: clamp(24px, 6vw, 36px); }
    .msg { font-weight: 800; text-align: center; margin: 6px 0 10px; min-height: 1.4em; font-size: 18px; }
    .meter-wrap { max-width: 320px; margin: 0 auto 10px; }
    .meter-lab { font-weight: 800; font-size: 14px; margin-bottom: 4px; text-align: center; }
    .meter {
      height: 18px; background: #166534; border-radius: 999px; overflow: hidden;
      box-shadow: inset 0 3px 0 rgba(0,0,0,.2);
    }
    .meter > i { display: block; height: 100%; width: 0; background: linear-gradient(#fde047, #84cc16); transition: width .25s ease; }
    .path-box {
      position: relative; max-width: 420px; height: 280px; margin: 0 auto;
      background:
        radial-gradient(circle at 80% 20%, rgba(255,255,255,.35), transparent 24%),
        linear-gradient(#4ade80, #16a34a);
      border-radius: 28px; overflow: hidden; box-shadow: 0 10px 0 #14532d;
    }
    .hill { position: absolute; bottom: 70px; width: 140px; height: 70px; border-radius: 70px 70px 0 0; background: #22c55e; }
    .dirt {
      position: absolute; left: 10px; right: 10px; bottom: 36px; height: 28px;
      background: repeating-linear-gradient(90deg, #b45309 0 18px, #a16207 18px 28px);
      border-radius: 20px; box-shadow: 0 8px 0 #78350f;
    }
    .bug {
      position: absolute; bottom: 48px; left: 18px; font-size: 36px;
      letter-spacing: -8px; white-space: nowrap; transition: left .25s ease; z-index: 3;
    }
    .bug.wiggle { animation: wig .25s ease; }
    @keyframes wig { 25% { transform: rotate(-12deg) scale(1.08); } 75% { transform: rotate(12deg); } }
    .node {
      position: absolute; bottom: 52px; width: 56px; height: 56px; border-radius: 50%;
      font-size: 30px; background: #fefce8; box-shadow: 0 5px 0 #166534; z-index: 2;
    }
    .node:active { transform: translateY(3px); }
    .node.gone { opacity: .25; }
    .tree { position: absolute; right: 16px; bottom: 64px; font-size: 64px; z-index: 1; }
    .coco {
      position: absolute; right: 28px; bottom: 118px; width: 72px; height: 88px;
      border-radius: 40px; font-size: 42px; background: #ddd6fe; box-shadow: 0 6px 0 #6d28d9;
      display: none; z-index: 4;
    }
    .coco.on { display: grid; place-items: center; }
    .coco.wiggle { animation: wig .3s ease; }
    .win {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      flex-direction: column; background: rgba(10,40,20,.84); z-index: 8; gap: 12px;
      color: #fff; text-align: center; padding: 20px;
    }
    .win.on { display: flex; }
    .play, .next { font-weight: 800; font-size: 24px; padding: 14px 26px; border-radius: 999px; }
    .play { background: #ffd166; color: #3b2100; box-shadow: 0 7px 0 #e09f1f; }
    .next { background: #bbf7d0; color: #14532d; box-shadow: 0 7px 0 #4ade80; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div class="hud">
    <div class="chip" id="wormChip">Worm 1 / 3</div>
    <div class="chip" id="stageChip">Eat</div>
    <div class="chip" id="starChip">★ 0</div>
  </div>
  <h1>Caterpillar</h1>
  <p class="msg" id="msg">Tap leaves to grow!</p>
  <div class="meter-wrap">
    <div class="meter-lab" id="meterLab">Grow</div>
    <div class="meter"><i id="bar"></i></div>
  </div>
  <div class="path-box" id="box">
    <div class="hill" style="left:20px"></div>
    <div class="hill" style="right:40px;width:110px;background:#16a34a"></div>
    <div class="tree">🌳</div>
    <div class="dirt"></div>
    <div class="bug" id="bug">🐛</div>
    <button class="coco" id="coco" type="button">🟣</button>
  </div>
  <div class="win" id="win">
    <div style="font-size:72px">🦋</div>
    <h2 id="wint">Hello butterfly!</h2>
    <p id="winline"></p>
    <button class="play" id="again" type="button">Play again</button>
    <button class="next" id="nextBtn" type="button">Next worm</button>
  </div>
  <script>
    function beep(f, d) {
      try {
        var c = window._ac || (window._ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = c.createOscillator(), g = c.createGain();
        o.frequency.value = f; g.gain.value = 0.11;
        o.connect(g); g.connect(c.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
        o.stop(c.currentTime + d);
      } catch (e) {}
    }
    var plans = [{ leaves: 4, flowers: 2 }, { leaves: 5, flowers: 3 }, { leaves: 6, flowers: 3 }];
    var worm = 0, stage = "eat", grow = 0, wiggles = 0, visits = 0, stars = 0;
    var nodes = [], box = document.getElementById("box");
    var bug = document.getElementById("bug");
    var coco = document.getElementById("coco");
    function hud() {
      document.getElementById("wormChip").textContent = "Worm " + (worm + 1) + " / 3";
      var label = stage === "eat" ? "Eat" : stage === "sleep" ? "Sleep" : "Fly";
      document.getElementById("stageChip").textContent = label;
      document.getElementById("starChip").textContent = "★ " + stars;
      var need = stage === "eat" ? plans[worm].leaves : stage === "sleep" ? 3 : plans[worm].flowers;
      var have = stage === "eat" ? grow : stage === "sleep" ? wiggles : visits;
      document.getElementById("bar").style.width = Math.min(100, (have / need) * 100) + "%";
      document.getElementById("meterLab").textContent = label + " " + have + " / " + need;
    }
    function clearNodes() { nodes.forEach(function (n) { n.remove(); }); nodes = []; }
    function placeNodes(emoji, count, handler) {
      clearNodes();
      var w = Math.max((box.clientWidth || 320) - 80, 200);
      for (var i = 0; i < count; i++) {
        var b = document.createElement("button");
        b.className = "node";
        b.textContent = emoji;
        b.style.left = (16 + (w / Math.max(count - 1, 1)) * i) + "px";
        b.style.bottom = (52 + (i % 2 ? 18 : 0)) + "px";
        b.onclick = handler;
        box.appendChild(b);
        nodes.push(b);
      }
    }
    function drawBug() {
      if (stage === "fly") { bug.textContent = "🦋"; bug.style.letterSpacing = "0"; }
      else if (stage === "sleep") { bug.textContent = ""; }
      else {
        var segs = "";
        for (var i = 0; i < grow; i++) segs += "🟢";
        bug.textContent = "🐛" + segs;
        bug.style.letterSpacing = "-8px";
      }
    }
    function startEat() {
      stage = "eat"; grow = 0; wiggles = 0; visits = 0;
      coco.classList.remove("on");
      bug.style.left = "18px";
      bug.style.bottom = "48px";
      document.getElementById("msg").textContent = "Tap leaves to grow!";
      placeNodes("🍃", plans[worm].leaves, onLeaf);
      drawBug();
      hud();
    }
    function onLeaf() {
      if (stage !== "eat" || this.classList.contains("gone")) return;
      this.classList.add("gone");
      this.disabled = true;
      grow++; stars++;
      bug.style.left = this.style.left;
      bug.classList.remove("wiggle"); void bug.offsetWidth; bug.classList.add("wiggle");
      beep(500 + grow * 40, 0.1);
      document.getElementById("msg").textContent = "Munch!";
      drawBug(); hud();
      if (grow >= plans[worm].leaves) setTimeout(startSleep, 400);
    }
    function startSleep() {
      stage = "sleep";
      clearNodes();
      coco.classList.add("on");
      coco.textContent = "🟣";
      document.getElementById("msg").textContent = "Tap to wiggle! 3 times.";
      drawBug(); hud();
      beep(320, 0.15);
    }
    coco.onclick = function () {
      if (stage !== "sleep") return;
      wiggles++;
      coco.classList.remove("wiggle"); void coco.offsetWidth; coco.classList.add("wiggle");
      beep(380 + wiggles * 40, 0.1);
      document.getElementById("msg").textContent = "Wiggle " + wiggles + " / 3";
      hud();
      if (wiggles >= 3) { stars++; setTimeout(startFly, 350); }
    };
    function startFly() {
      stage = "fly";
      coco.classList.remove("on");
      visits = 0;
      document.getElementById("msg").textContent = "Fly! Tap flowers.";
      placeNodes("🌸", plans[worm].flowers, onFlower);
      drawBug(); hud();
      beep(720, 0.12);
    }
    function onFlower() {
      if (stage !== "fly" || this.classList.contains("gone")) return;
      this.classList.add("gone");
      this.disabled = true;
      visits++; stars++;
      bug.style.left = this.style.left;
      bug.style.bottom = "90px";
      setTimeout(function () { bug.style.bottom = "48px"; }, 280);
      beep(640 + visits * 50, 0.1);
      document.getElementById("msg").textContent = "Hello flower!";
      hud();
      if (visits >= plans[worm].flowers) setTimeout(wormDone, 400);
    }
    function wormDone() {
      var last = worm >= 2;
      document.getElementById("wint").textContent = last ? "Hello butterfly!" : "A butterfly!";
      document.getElementById("winline").textContent = "★ " + stars;
      document.getElementById("nextBtn").style.display = last ? "none" : "inline-block";
      document.getElementById("win").classList.add("on");
      beep(960, 0.2);
    }
    document.getElementById("again").onclick = function () { location.reload(); };
    document.getElementById("nextBtn").onclick = function () {
      document.getElementById("win").classList.remove("on");
      worm++;
      startEat();
    };
    startEat();
  </script>
</body>
</html>
