<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Caterpillar</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>html,body{background:#166534}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="lv">🍃 0/8</b></div>
  <div id="say">Tap leaves. Grow big. Avoid rocks!</div>
  <div class="cover" id="title">
    <div class="hero">🐛</div>
    <h1>Caterpillar</h1>
    <p>Eat 8 leaves. Become a butterfly!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🦋</div>
    <h1>You can fly!</h1>
    <p>A brand new butterfly.</p>
    <button class="play g" id="again">Grow again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, n = 0, bugX = 0.2, bits = [];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; n = 0; bugX = 0.18;
      placeBits();
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("lv").textContent = "🍃 0/8";
      document.getElementById("say").textContent = "Tap the leaves!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    function placeBits() {
      bits = [
        { e: "🍃", x: 0.28, y: 0.36 },
        { e: "🍃", x: 0.62, y: 0.34 },
        { e: "🪨", x: 0.45, y: 0.48 },
        { e: "🍃", x: 0.78, y: 0.50 },
        { e: "🍃", x: 0.22, y: 0.58 },
        { e: "🪨", x: 0.70, y: 0.66 },
        { e: "🍃", x: 0.40, y: 0.70 },
        { e: "🍃", x: 0.58, y: 0.58 },
        { e: "🍃", x: 0.85, y: 0.36 },
        { e: "🍃", x: 0.12, y: 0.46 }
      ];
    }
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      for (var i = bits.length - 1; i >= 0; i--) {
        var b = bits[i], dx = e.clientX - b.x * W, dy = e.clientY - b.y * H;
        if (dx * dx + dy * dy < 70 * 70) {
          if (b.e === "🍃") {
            bits.splice(i, 1); n++; bugX = Math.min(0.8, bugX + 0.07);
            document.getElementById("lv").textContent = "🍃 " + n + "/8";
            document.getElementById("say").textContent = "Yum! Growing.";
            if (n >= 8) { play = false; document.getElementById("win").classList.remove("off"); }
          } else {
            document.getElementById("say").textContent = "Ouch rock! Eat leaves.";
          }
          return;
        }
      }
    });
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      x.fillStyle = "#86efac"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#4ade80"; x.fillRect(0, H * 0.78, W, H);
      em("🌳", 40, 100, 64);
      bits.forEach(function (b) { em(b.e, b.x * W, b.y * H, 64); });
      em(n >= 8 ? "🦋" : "🐛", bugX * W, H * 0.70, 48 + n * 6);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
