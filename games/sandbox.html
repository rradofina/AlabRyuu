<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sandbox</title>
  <script src="../vendor/three.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:Verdana,system-ui,sans-serif;background:#7c2d12;color:#fff7ed;touch-action:none;user-select:none}
    button{background:transparent;border:0;appearance:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .home{position:fixed;top:12px;left:12px;z-index:8;color:#fff;text-decoration:none;font-weight:800;background:rgba(0,0,0,.4);padding:8px 14px;border-radius:999px}
    #hud{position:fixed;top:12px;right:12px;z-index:8;text-align:right;font-weight:800;pointer-events:none}
    #hud b{display:inline-block;background:#fff7ed;color:#7c2d12;padding:6px 10px;border-radius:999px;margin-left:6px}
    #say{position:fixed;left:10px;right:10px;bottom:118px;text-align:center;font-weight:800;z-index:8;pointer-events:none}
    #dock{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none;gap:6px;padding:10px;background:#431407;flex-wrap:wrap;justify-content:center}
    #dock.on{display:flex}
    #dock button{width:58px;height:58px;border-radius:14px;font-weight:800;box-shadow:0 4px 0 #1c1917}
    #dock button.on{outline:3px solid #fff}
    .cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;background:linear-gradient(#f59e0b,#7c2d12)}
    .cover.off{display:none}
    h1{font-size:clamp(32px,8vw,50px)}
    .btn{background:#ffd166;color:#3b2100;font-weight:800;font-size:24px;padding:14px 26px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="ms">House</b><b id="bl">🧱 0</b><b id="st">⭐ 0</b></div>
  <div id="say">Tap the floor. Stack a world!</div>
  <div id="dock">
    <button data-c="#f59e0b" class="on" style="background:#f59e0b">Wood</button>
    <button data-c="#22c55e" style="background:#22c55e">Grass</button>
    <button data-c="#38bdf8" style="background:#38bdf8">Water</button>
    <button data-c="#a8a29e" style="background:#a8a29e">Stone</button>
    <button data-c="#fde047" style="background:#fde047">Gold</button>
    <button id="sand">Sand</button>
    <button id="cam">Cam</button>
  </div>
  <div class="cover" id="title">
    <h1>Sandbox</h1>
    <p>3D blocks. Tiny camera.<br>Optional gravity sand.</p>
    <button class="btn" id="go">Build</button>
  </div>
  <div class="cover off" id="win">
    <h1>Builder star!</h1>
    <p id="wp">Five builds.</p>
    <button class="btn" id="again">Build again</button>
  </div>
  <script>
  (function () {
    if (!window.THREE) return;
    var T = THREE, play = false, mission = 0, placed = 0, stars = 0, col = 0xf59e0b, t = 0, sandOn = 0, camMode = 0;
    var JOBS = [
      { n: "House", need: 8, verb: "stack" },
      { n: "Garden", need: 8, verb: "plant" },
      { n: "Bridge", need: 10, verb: "span" },
      { n: "Castle", need: 12, verb: "tower" },
      { n: "Home town", need: 10, verb: "home" }
    ];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-sandbox") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}

    var scene = new T.Scene();
    scene.background = new T.Color(0x7dd3fc);
    scene.fog = new T.Fog(0x7dd3fc, 16, 36);
    var cam = new T.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 80);
    cam.position.set(8, 8, 10);
    var renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    document.body.appendChild(renderer.domElement);
    scene.add(new T.HemisphereLight(0xffffff, 0x7c2d12, 0.85));
    var sun = new T.DirectionalLight(0xfff1c1, 0.8); sun.position.set(6, 12, 4); scene.add(sun);

    var floor = new T.Mesh(new T.BoxGeometry(12, 0.4, 12), new T.MeshLambertMaterial({ color: 0xca8a04 }));
    floor.position.y = -0.2; scene.add(floor);
    var blocks = [];
    var sandBits = [];
    var kid = new T.Group();
    var kb = new T.Mesh(new T.SphereGeometry(0.16, 8, 8), new T.MeshLambertMaterial({ color: 0xf97316 }));
    kb.position.y = 0.4; kid.add(kb);
    var kh = new T.Mesh(new T.SphereGeometry(0.12, 8, 8), new T.MeshLambertMaterial({ color: 0xffe0b0 }));
    kh.position.y = 0.62; kid.add(kh);
    var legs = [];
    for (var s = -1; s <= 1; s += 2) {
      var l = new T.Mesh(new T.BoxGeometry(0.06, 0.18, 0.06), new T.MeshLambertMaterial({ color: 0xffe0b0 }));
      l.position.set(s * 0.07, 0.12, 0); kid.add(l); legs.push(l);
    }
    kid.position.set(-4, 0, 3); scene.add(kid);

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f; g.gain.value = 0.08; o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function save() { try { localStorage.setItem("alabryuu-sandbox", JSON.stringify({ stars: stars, mission: mission })); } catch (e) {} }
    function hud() {
      document.getElementById("ms").textContent = JOBS[mission].n;
      document.getElementById("bl").textContent = "🧱 " + placed + "/" + JOBS[mission].need;
      document.getElementById("st").textContent = "⭐ " + stars;
      document.getElementById("say").textContent = ["Stack a house!", "Plant a garden!", "Span a bridge!", "Tower time!", "Home town!"][mission];
    }
    function clearBlocks() {
      blocks.forEach(function (b) { scene.remove(b); });
      blocks = []; placed = 0; hud();
    }

    var ray = new T.Raycaster(), mouse = new T.Vector2();
    renderer.domElement.addEventListener("pointerdown", function (ev) {
      if (!play) return;
      mouse.x = (ev.clientX / innerWidth) * 2 - 1;
      mouse.y = -(ev.clientY / innerHeight) * 2 + 1;
      ray.setFromCamera(mouse, cam);
      var hits = ray.intersectObjects([floor].concat(blocks), false);
      if (!hits.length) return;
      var hit = hits[0];
      var p = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(0.31));
      if (sandOn) {
        for (var i = 0; i < 6; i++) {
          var bit = new T.Mesh(new T.BoxGeometry(0.16, 0.16, 0.16), new T.MeshLambertMaterial({ color: 0xfbbf24 }));
          bit.position.copy(p); bit.position.x += (Math.random() - 0.5) * 0.3;
          bit.userData = { vy: 0 };
          scene.add(bit); sandBits.push(bit);
        }
        beep(400, 0.04);
        return;
      }
      var cube = new T.Mesh(new T.BoxGeometry(0.6, 0.6, 0.6), new T.MeshLambertMaterial({ color: col }));
      cube.position.set(Math.round(p.x / 0.6) * 0.6, Math.max(0.3, Math.round(p.y / 0.6) * 0.6), Math.round(p.z / 0.6) * 0.6);
      scene.add(cube); blocks.push(cube); placed++; stars++;
      hud(); save(); beep(560, 0.05);
      if (placed >= JOBS[mission].need) {
        mission++;
        if (mission >= JOBS.length) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("wp").textContent = "🧱 " + stars + " blocks of joy.";
          document.getElementById("win").classList.remove("off");
        } else { clearBlocks(); }
      }
    });

    [].forEach.call(document.querySelectorAll("#dock button[data-c]"), function (b) {
      b.onclick = function () {
        col = parseInt(b.getAttribute("data-c").slice(1), 16);
        sandOn = 0;
        [].forEach.call(document.querySelectorAll("#dock button"), function (x) { x.classList.remove("on"); });
        b.classList.add("on");
      };
    });
    document.getElementById("sand").onclick = function () {
      sandOn = 1;
      [].forEach.call(document.querySelectorAll("#dock button"), function (x) { x.classList.remove("on"); });
      this.classList.add("on");
    };
    document.getElementById("cam").onclick = function () { camMode = 1 - camMode; beep(300, 0.05); };

    function start() {
      play = true; mission = 0; clearBlocks();
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;

    var clock = new T.Clock();
    function tick() {
      var dt = Math.min(0.033, clock.getDelta());
      t += dt;
      kid.position.x = -4 + Math.sin(t * 0.4) * 2;
      legs.forEach(function (l, i) { l.rotation.x = Math.sin(t * 8 + i * 3) * 0.6; });
      sandBits.forEach(function (b) {
        b.userData.vy -= 12 * dt;
        b.position.y += b.userData.vy * dt;
        if (b.position.y < 0.08) { b.position.y = 0.08; b.userData.vy = 0; }
      });
      if (sandBits.length > 80) { var old = sandBits.shift(); scene.remove(old); }
      if (camMode) cam.position.lerp(new T.Vector3(kid.position.x, 2.2, kid.position.z + 4), 0.06);
      else cam.position.lerp(new T.Vector3(8 + Math.sin(t * 0.15) * 0.4, 8, 10), 0.04);
      cam.lookAt(0, 0.6, 0);
      renderer.render(scene, cam);
      requestAnimationFrame(tick);
    }
    addEventListener("resize", function () {
      cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    hud();
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
