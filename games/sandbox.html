<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sandbox</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../kid-sprites.js"></script>
  <style>
    html,body{background:#fef3c7}
    .dock{flex-wrap:nowrap;width:min(100% - 16px, 520px);gap:8px}
    .dock button{min-width:0;flex:1 1 0;min-height:76px;padding:4px 2px;font-size:14px}
    .dock button span{font-size:34px}
    #clear{background:#86efac;color:#14532d}
    #say{color:#431407}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="ms">House</b><b id="bl">0/5</b><b id="st">⭐ 0</b></div>
  <div id="say">TAP the sand to stamp!</div>
  <div class="dock" id="dock">
    <button data-k="tree" class="on"><span>🌳</span></button>
    <button data-k="house"><span>🏠</span></button>
    <button data-k="flower"><span>🌸</span></button>
    <button data-k="water"><span>💧</span></button>
    <button type="button" id="clear"><span>🧹</span>Clear</button>
  </div>
  <div class="cover" id="title">
    <div class="hero"><img src="../assets/sprites/sandbox/char3.png" alt="" width="96" height="96" /></div>
    <h1>Sandbox</h1>
    <p>Stamp a town. It stays!</p>
    <button class="play" id="go" autofocus>Build</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🌟</div>
    <h1>Builder star!</h1>
    <p id="wp">A real little town.</p>
    <button class="play g" id="again">Start over</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, mission = 0, placed = 0, stars = 0, tool = "tree";
    var bits = [];
    var JOBS = [
      { n: "House", need: 5, say: "TAP the sand! Stamp a house and trees." },
      { n: "Garden", need: 5, say: "TAP flowers and water!" },
      { n: "Town", need: 6, say: "TAP more houses!" }
    ];
    var EMO = { tree: "🌳", house: "🏠", flower: "🌸", water: "💧" };
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-sandbox") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    var SPR = {
      "🌳": kidSprite("sandbox/hero.png"),
      "🏠": kidSprite("sandbox/char1.png"),
      "🌸": kidSprite("sandbox/char2.png"),
      "🧱": kidSprite("sandbox/char3.png"),
    };
    function em(ch, px, py, s) {
      kidStamp(x, ch, px, py, s, SPR);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function hud() {
      document.getElementById("ms").textContent = JOBS[Math.min(mission, JOBS.length - 1)].n;
      document.getElementById("bl").textContent = placed + "/" + JOBS[Math.min(mission, JOBS.length - 1)].need;
      document.getElementById("st").textContent = "⭐ " + stars;
    }
    function freshSand(hello) {
      bits = [];
      play = true;
      mission = 0;
      placed = 0;
      tool = "tree";
      [].forEach.call(document.querySelectorAll("#dock button[data-k]"), function (el) {
        el.classList.toggle("on", el.getAttribute("data-k") === "tree");
      });
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      hud();
      kidPing(hello);
    }
    function start() { freshSand(JOBS[0].say); }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = function () { freshSand("Fresh sand!"); };
    document.getElementById("clear").onclick = function (e) {
      e.preventDefault();
      e.stopPropagation();
      freshSand("Fresh sand!");
    };
    [].forEach.call(document.querySelectorAll("#dock button[data-k]"), function (b) {
      b.onclick = function () {
        tool = b.getAttribute("data-k");
        [].forEach.call(document.querySelectorAll("#dock button"), function (el) { el.classList.toggle("on", el === b); });
        kidNote(400);
        kidPing("Stamp " + EMO[tool] + "!");
      };
    });
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var p = kidPt(e, cv);
      if (p.y > H - 110) return;
      if (p.x < 110 && p.y < 56) return;
      bits.push({ k: tool, x: p.x, y: p.y, s: 72 + Math.random() * 28, pop: 1 });
      placed++; stars++;
      try { localStorage.setItem("alabryuu-sandbox", JSON.stringify({ stars: stars, mission: mission })); } catch (err) {}
      hud();
      kidTap(EMO[tool], JOBS[Math.min(mission, JOBS.length - 1)].say, p.x, p.y, 420);
      if (placed >= JOBS[mission].need) {
        mission++;
        placed = 0;
        if (mission >= JOBS.length) {
          play = false;
          kidYay();
          document.getElementById("dock").classList.remove("on");
          document.getElementById("wp").textContent = "⭐ " + stars + "  Your town stays!";
          document.getElementById("win").classList.remove("off");
        } else {
          hud();
          kidPing("Nice! " + JOBS[mission].say);
        }
      }
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#fde68a"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#ca8a04";
      for (var i = 0; i < 10; i++) x.fillRect(0, H * 0.28 + i * 32, W, 6);
      bits.forEach(function (b) {
        if (b.pop > 0) b.pop -= 0.08;
        em(EMO[b.k] || "🌳", b.x, b.y, b.s * (1 + Math.max(0, b.pop) * 0.35));
      });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
