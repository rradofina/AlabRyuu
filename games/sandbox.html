<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sandbox</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>
    html,body{background:#fef3c7}
    .dock button{min-width:72px;min-height:84px}
    .dock button span{font-size:40px}
    #say{color:#431407}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="ms">House</b><b id="bl">0/5</b><b id="st">⭐ 0</b></div>
  <div id="say">Stamp a house and trees!</div>
  <div class="dock" id="dock">
    <button data-k="tree" class="on"><span>🌳</span></button>
    <button data-k="house"><span>🏠</span></button>
    <button data-k="flower"><span>🌸</span></button>
    <button data-k="water"><span>💧</span></button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🧱</div>
    <h1>Sandbox</h1>
    <p>Stamp big things. Keep your town!</p>
    <button class="play" id="go">Build</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🌟</div>
    <h1>Builder star!</h1>
    <p id="wp">A real little town.</p>
    <button class="play g" id="again">Keep building</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, mission = 0, placed = 0, stars = 0, tool = "tree";
    var bits = [];
    var JOBS = [
      { n: "House", need: 5, say: "Stamp a house and trees!" },
      { n: "Garden", need: 5, say: "Add flowers and water!" },
      { n: "Town", need: 6, say: "More houses and trees!" }
    ];
    var EMO = { tree: "🌳", house: "🏠", flower: "🌸", water: "💧" };
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-sandbox") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function hud() {
      document.getElementById("ms").textContent = JOBS[Math.min(mission, JOBS.length - 1)].n;
      document.getElementById("bl").textContent = placed + "/" + JOBS[Math.min(mission, JOBS.length - 1)].need;
      document.getElementById("st").textContent = "⭐ " + stars;
      document.getElementById("say").textContent = JOBS[Math.min(mission, JOBS.length - 1)].say;
    }
    function start() {
      play = true; mission = 0; placed = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      hud();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = function () {
      document.getElementById("win").classList.add("off");
      play = true; mission = 0; placed = 0; hud();
      document.getElementById("dock").classList.add("on");
    };
    [].forEach.call(document.querySelectorAll("#dock button"), function (b) {
      b.onclick = function () {
        tool = b.getAttribute("data-k");
        [].forEach.call(document.querySelectorAll("#dock button"), function (el) { el.classList.toggle("on", el === b); });
      };
    });
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      if (e.clientY > H - 110) return;
      if (e.clientX < 110 && e.clientY < 56) return;
      bits.push({ k: tool, x: e.clientX, y: e.clientY });
      placed++; stars++;
      try { localStorage.setItem("alabryuu-sandbox", JSON.stringify({ stars: stars, mission: mission })); } catch (err) {}
      hud();
      if (placed >= JOBS[mission].need) {
        mission++;
        placed = 0;
        if (mission >= JOBS.length) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("wp").textContent = "⭐ " + stars + "  Your town stays!";
          document.getElementById("win").classList.remove("off");
        } else {
          document.getElementById("say").textContent = "Nice! " + JOBS[mission].say;
          hud();
        }
      }
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#fde68a"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#ca8a04";
      for (var i = 0; i < 10; i++) x.fillRect(0, H * 0.28 + i * 32, W, 6);
      bits.forEach(function (b) { em(EMO[b.k] || "🌳", b.x, b.y, 64); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
