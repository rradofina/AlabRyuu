<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sandbox</title>
  <script src="../vendor/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: Verdana, system-ui, sans-serif; background: #7dd3fc; color: #fff7ed; touch-action: none; user-select: none; }
    button { background: transparent; border: 0; appearance: none; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .home { position: fixed; top: 12px; left: 12px; z-index: 8; color: #fff; text-decoration: none; font-weight: 800; background: rgba(0,0,0,.4); padding: 8px 14px; border-radius: 999px; }
    #hud { position: fixed; top: 12px; right: 12px; z-index: 8; text-align: right; font-weight: 800; pointer-events: none; }
    #hud b { display: inline-block; background: #fff7ed; color: #7c2d12; padding: 6px 10px; border-radius: 999px; margin-left: 6px; }
    #say { position: fixed; left: 10px; right: 10px; bottom: 132px; text-align: center; font-weight: 800; z-index: 8; pointer-events: none; text-shadow: 0 2px 0 #7c2d12; font-size: 18px; }
    #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: none; gap: 6px; padding: 8px 8px 14px; background: #431407; flex-wrap: wrap; justify-content: center; }
    #dock.on { display: flex; }
    #dock button { width: 68px; min-height: 72px; border-radius: 16px; font-weight: 800; font-size: 11px; color: #431407; background: #fef3c7; box-shadow: 0 5px 0 #1c1917; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    #dock button.on { outline: 3px solid #fff; background: #fde047; }
    #dock .ico { width: 28px; height: 28px; display: block; }
    .cover { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px; background: linear-gradient(#38bdf8, #ca8a04); }
    .cover.off { display: none; }
    h1 { font-size: clamp(32px, 8vw, 50px); text-shadow: 0 4px 0 #7c2d12; }
    .btn { background: #ffd166; color: #3b2100; font-weight: 800; font-size: 24px; padding: 14px 26px; border-radius: 999px; box-shadow: 0 7px 0 #e09f1f; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="ms">House</b><b id="bl">0</b><b id="st">⭐ 0</b></div>
  <div id="say">Tap the dirt. Build a tiny world!</div>
  <div id="dock">
    <button data-k="wood" class="on"><svg class="ico" viewBox="0 0 28 28"><ellipse cx="14" cy="14" rx="11" ry="7" fill="#92400e"/><ellipse cx="14" cy="14" rx="5" ry="3.2" fill="#fde68a"/><ellipse cx="14" cy="14" rx="2" ry="1.3" fill="#b45309"/></svg>Log</button>
    <button data-k="grass"><svg class="ico" viewBox="0 0 28 28"><rect x="4" y="16" width="20" height="8" rx="2" fill="#92400e"/><rect x="4" y="12" width="20" height="6" rx="2" fill="#22c55e"/><path d="M8 14 L7 4 L10 14" fill="#16a34a"/><path d="M14 13 L14 3 L17 13" fill="#4ade80"/><path d="M20 14 L22 5 L23 14" fill="#16a34a"/></svg>Grass</button>
    <button data-k="water"><svg class="ico" viewBox="0 0 28 28"><ellipse cx="14" cy="16" rx="11" ry="6" fill="#38bdf8" opacity=".85"/><ellipse cx="10" cy="15" rx="3" ry="1.4" fill="#e0f2fe"/><path d="M18 10 q2 3 0 6 q-2-3 0-6" fill="#f97316"/></svg>Water</button>
    <button data-k="stone"><svg class="ico" viewBox="0 0 28 28"><ellipse cx="12" cy="16" rx="8" ry="6" fill="#78716c"/><ellipse cx="18" cy="14" rx="6" ry="5" fill="#a8a29e"/><ellipse cx="10" cy="13" rx="4" ry="3" fill="#57534e"/></svg>Rock</button>
    <button data-k="gold"><svg class="ico" viewBox="0 0 28 28"><circle cx="12" cy="16" r="5" fill="#eab308"/><circle cx="18" cy="14" r="4" fill="#fde047"/><circle cx="15" cy="10" r="3" fill="#facc15"/><path d="M7 8 L8 5 L9 8" stroke="#fff" stroke-width="1"/></svg>Gold</button>
    <button data-k="sand"><svg class="ico" viewBox="0 0 28 28"><circle cx="10" cy="18" r="4" fill="#fbbf24"/><circle cx="16" cy="19" r="3.5" fill="#f59e0b"/><circle cx="13" cy="14" r="3" fill="#fde68a"/><circle cx="19" cy="15" r="2.5" fill="#fcd34d"/></svg>Sand</button>
    <button data-k="tree"><svg class="ico" viewBox="0 0 28 28"><rect x="12" y="16" width="4" height="8" fill="#7c2d12"/><circle cx="14" cy="12" r="8" fill="#16a34a"/><circle cx="10" cy="13" r="5" fill="#22c55e"/></svg>Tree</button>
    <button data-k="flower"><svg class="ico" viewBox="0 0 28 28"><rect x="13" y="12" width="2" height="12" fill="#16a34a"/><circle cx="10" cy="10" r="3.2" fill="#fb7185"/><circle cx="18" cy="10" r="3.2" fill="#fb7185"/><circle cx="14" cy="7" r="3.2" fill="#f472b6"/><circle cx="14" cy="11" r="2.2" fill="#fde047"/></svg>Flower</button>
    <button data-k="house"><svg class="ico" viewBox="0 0 28 28"><rect x="6" y="14" width="16" height="10" fill="#fdba74"/><path d="M4 15 L14 6 L24 15" fill="#dc2626"/><rect x="12" y="17" width="4" height="7" fill="#7c2d12"/></svg>House</button>
    <button data-k="fence"><svg class="ico" viewBox="0 0 28 28"><rect x="3" y="14" width="22" height="3" fill="#b45309"/><rect x="5" y="8" width="3" height="14" fill="#92400e"/><rect x="13" y="8" width="3" height="14" fill="#92400e"/><rect x="21" y="8" width="3" height="14" fill="#92400e"/></svg>Fence</button>
  </div>
  <div class="cover" id="title">
    <h1>Sandbox</h1>
    <p>Tap logs, grass, trees, houses.<br>Not cubes — little toys.</p>
    <button class="btn" id="go">Build</button>
  </div>
  <div class="cover off" id="win">
    <h1>Builder star!</h1>
    <p id="wp">Five tiny towns.</p>
    <button class="btn" id="again">Build again</button>
  </div>
  <script>
  (function () {
    if (!window.THREE) return;
    var T = THREE, play = false, mission = 0, placed = 0, stars = 0, tool = "wood", t = 0;
    var CELL = 0.95;
    var JOBS = [
      { n: "House", need: 6, say: "Put a cottage and logs!" },
      { n: "Garden", need: 7, say: "Grass, flowers, a tree!" },
      { n: "Bridge", need: 6, say: "Lay logs like a bridge!" },
      { n: "Castle", need: 8, say: "Rocks, gold, a wall!" },
      { n: "Home town", need: 8, say: "Houses, trees, fences!" }
    ];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-sandbox") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}

    var scene = new T.Scene();
    scene.background = new T.Color(0x7dd3fc);
    scene.fog = new T.Fog(0x7dd3fc, 18, 42);
    var cam = new T.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 80);
    cam.position.set(7.5, 7.2, 9.5);
    var renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    document.body.appendChild(renderer.domElement);
    scene.add(new T.HemisphereLight(0xfff7ed, 0x7c2d12, 0.9));
    var sun = new T.DirectionalLight(0xfff1c1, 0.85); sun.position.set(6, 12, 5); scene.add(sun);

    function dirtGround() {
      var geo = new T.PlaneGeometry(16, 16, 12, 12);
      var pos = geo.attributes.position;
      var cols = [];
      for (var i = 0; i < pos.count; i++) {
        var x0 = pos.getX(i), z0 = pos.getY(i);
        pos.setZ(i, Math.sin(x0 * 0.7) * Math.cos(z0 * 0.55) * 0.08);
        var n = (Math.sin(x0 * 1.3) + Math.cos(z0 * 1.1)) * 0.5;
        var c = n > 0.15 ? new T.Color(0xd6a15a) : (n < -0.2 ? new T.Color(0xb45309) : new T.Color(0xca8a04));
        cols.push(c.r, c.g, c.b);
      }
      geo.setAttribute("color", new T.Float32BufferAttribute(cols, 3));
      geo.computeVertexNormals();
      var mesh = new T.Mesh(geo, new T.MeshLambertMaterial({ vertexColors: true }));
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = 0;
      return mesh;
    }
    var floor = dirtGround();
    scene.add(floor);
    for (var gi = 0; gi < 10; gi++) {
      var tuft = new T.Mesh(new T.ConeGeometry(0.06, 0.18, 5), new T.MeshLambertMaterial({ color: 0x65a30d }));
      tuft.position.set((Math.random() - 0.5) * 14, 0.08, (Math.random() - 0.5) * 14);
      scene.add(tuft);
    }

    var clouds = [];
    for (var ci = 0; ci < 5; ci++) {
      var cg = new T.Group();
      for (var cj = 0; cj < 3; cj++) {
        var puff = new T.Mesh(new T.SphereGeometry(0.45 + Math.random() * 0.25, 8, 6), new T.MeshLambertMaterial({ color: 0xffffff }));
        puff.position.set(cj * 0.5 - 0.4, Math.random() * 0.15, (Math.random() - 0.5) * 0.3);
        puff.scale.set(1.3, 0.55, 0.9);
        cg.add(puff);
      }
      cg.position.set(-8 + ci * 4, 5.2 + (ci % 2) * 0.4, -6 + (ci % 3));
      scene.add(cg); clouds.push(cg);
    }
    var birds = [];
    for (var bi = 0; bi < 3; bi++) {
      var bg = new T.Group();
      var body = new T.Mesh(new T.SphereGeometry(0.07, 6, 5), new T.MeshLambertMaterial({ color: 0x1e293b }));
      bg.add(body);
      var w1 = new T.Mesh(new T.SphereGeometry(0.08, 6, 4), new T.MeshLambertMaterial({ color: 0x334155 }));
      w1.scale.set(1.4, 0.2, 0.5); w1.position.set(0.08, 0.02, 0); bg.add(w1);
      var w2 = w1.clone(); w2.position.x = -0.08; bg.add(w2);
      bg.userData = { wings: [w1, w2], a: bi * 2 };
      scene.add(bg); birds.push(bg);
    }

    function kidModel() {
      var g = new T.Group();
      var shirt = new T.Mesh(new T.SphereGeometry(0.16, 8, 8), new T.MeshLambertMaterial({ color: 0xf97316 }));
      shirt.scale.set(1, 1.15, 0.8); shirt.position.y = 0.42; g.add(shirt);
      var head = new T.Mesh(new T.SphereGeometry(0.12, 8, 8), new T.MeshLambertMaterial({ color: 0xffe0b0 }));
      head.position.y = 0.66; g.add(head);
      var hair = new T.Mesh(new T.SphereGeometry(0.13, 8, 6), new T.MeshLambertMaterial({ color: 0x5a3a22 }));
      hair.position.set(0, 0.74, -0.01); g.add(hair);
      var legs = [];
      for (var s = -1; s <= 1; s += 2) {
        var hip = new T.Group(); hip.position.set(s * 0.07, 0.26, 0);
        var th = new T.Mesh(new T.BoxGeometry(0.07, 0.2, 0.07), new T.MeshLambertMaterial({ color: 0x1d4ed8 }));
        th.position.y = -0.1; hip.add(th);
        var foot = new T.Mesh(new T.BoxGeometry(0.08, 0.05, 0.12), new T.MeshLambertMaterial({ color: 0x111827 }));
        foot.position.set(0, -0.22, 0.02); hip.add(foot);
        g.add(hip); legs.push(hip);
      }
      g.userData = { legs: legs, head: head };
      return g;
    }
    var kid = kidModel();
    kid.position.set(-3.2, 0, 2.4);
    scene.add(kid);
    var kidTarget = kid.position.clone();

    function hitBox(w, h, d, y) {
      var m = new T.Mesh(new T.BoxGeometry(w, h, d), new T.MeshBasicMaterial({ visible: false }));
      m.position.y = y; m.userData.hit = 1; return m;
    }
    function addSway(list, mesh, amp) { list.push({ m: mesh, amp: amp || 0.12, ph: Math.random() * 6 }); }

    function makeWood() {
      var g = new T.Group();
      var bark = new T.Mesh(new T.CylinderGeometry(0.22, 0.24, 0.85, 10), new T.MeshLambertMaterial({ color: 0x7c2d12 }));
      bark.rotation.z = Math.PI / 2; bark.position.y = 0.24; g.add(bark);
      var ringL = new T.Mesh(new T.CircleGeometry(0.22, 10), new T.MeshLambertMaterial({ color: 0xfde68a }));
      ringL.position.set(-0.43, 0.24, 0); ringL.rotation.y = Math.PI / 2; g.add(ringL);
      var ringR = ringL.clone(); ringR.position.x = 0.43; ringR.rotation.y = -Math.PI / 2; g.add(ringR);
      var inner = new T.Mesh(new T.CircleGeometry(0.1, 8), new T.MeshLambertMaterial({ color: 0xb45309 }));
      inner.position.set(-0.431, 0.24, 0); inner.rotation.y = Math.PI / 2; g.add(inner);
      g.add(hitBox(0.9, 0.48, 0.5, 0.24));
      g.userData = { kind: "wood", top: 0.5, sway: [] };
      return g;
    }
    function makeGrass() {
      var g = new T.Group();
      var dirt = new T.Mesh(new T.BoxGeometry(0.78, 0.22, 0.78), new T.MeshLambertMaterial({ color: 0x92400e }));
      dirt.position.y = 0.11; g.add(dirt);
      var cap = new T.Mesh(new T.BoxGeometry(0.8, 0.1, 0.8), new T.MeshLambertMaterial({ color: 0x22c55e }));
      cap.position.y = 0.26; g.add(cap);
      var sway = [];
      for (var i = 0; i < 7; i++) {
        var blade = new T.Mesh(new T.ConeGeometry(0.045, 0.22, 5), new T.MeshLambertMaterial({ color: i % 2 ? 0x16a34a : 0x4ade80 }));
        blade.position.set((i % 3 - 1) * 0.2, 0.4, (Math.floor(i / 3) - 0.7) * 0.18);
        g.add(blade); addSway(sway, blade, 0.18);
      }
      g.add(hitBox(0.8, 0.4, 0.8, 0.2));
      g.userData = { kind: "grass", top: 0.42, sway: sway };
      return g;
    }
    function makeWater() {
      var g = new T.Group();
      var pond = new T.Mesh(new T.CircleGeometry(0.42, 16), new T.MeshLambertMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.72 }));
      pond.rotation.x = -Math.PI / 2; pond.position.y = 0.06; g.add(pond);
      var rim = new T.Mesh(new T.TorusGeometry(0.42, 0.035, 6, 16), new T.MeshLambertMaterial({ color: 0x0369a1 }));
      rim.rotation.x = Math.PI / 2; rim.position.y = 0.06; g.add(rim);
      var fish = new T.Mesh(new T.SphereGeometry(0.06, 6, 5), new T.MeshLambertMaterial({ color: 0xf97316 }));
      fish.scale.set(1.5, 0.55, 0.7); fish.position.set(0.12, 0.08, 0); g.add(fish);
      var tail = new T.Mesh(new T.ConeGeometry(0.035, 0.08, 5), new T.MeshLambertMaterial({ color: 0xf97316 }));
      tail.rotation.z = Math.PI / 2; tail.position.set(-0.06, 0, 0); fish.add(tail);
      g.add(hitBox(0.85, 0.16, 0.85, 0.08));
      g.userData = { kind: "water", top: 0.14, sway: [], water: pond, fish: fish };
      return g;
    }
    function makeStone() {
      var g = new T.Group();
      var a = new T.Mesh(new T.IcosahedronGeometry(0.28, 0), new T.MeshLambertMaterial({ color: 0x78716c }));
      a.position.set(-0.08, 0.22, 0.02); a.scale.set(1.1, 0.85, 1); g.add(a);
      var b = new T.Mesh(new T.SphereGeometry(0.2, 7, 6), new T.MeshLambertMaterial({ color: 0xa8a29e }));
      b.position.set(0.16, 0.18, -0.06); b.scale.set(1, 0.75, 0.9); g.add(b);
      var c = new T.Mesh(new T.IcosahedronGeometry(0.14, 0), new T.MeshLambertMaterial({ color: 0x57534e }));
      c.position.set(0.02, 0.34, 0.1); g.add(c);
      g.add(hitBox(0.7, 0.5, 0.62, 0.24));
      g.userData = { kind: "stone", top: 0.5, sway: [] };
      return g;
    }
    function makeGold() {
      var g = new T.Group();
      var spark = [];
      [[0, 0.16, 0, 0.16, 0xfacc15], [0.14, 0.14, 0.08, 0.12, 0xfde047], [-0.12, 0.12, -0.06, 0.11, 0xeab308]].forEach(function (p) {
        var n = new T.Mesh(new T.OctahedronGeometry(p[3], 0), new T.MeshLambertMaterial({ color: p[4], emissive: 0x665200 }));
        n.position.set(p[0], p[1], p[2]); g.add(n);
      });
      var glint = new T.Mesh(new T.SphereGeometry(0.04, 6, 4), new T.MeshBasicMaterial({ color: 0xffffff }));
      glint.position.set(0.08, 0.32, 0.06); g.add(glint); spark.push(glint);
      g.add(hitBox(0.5, 0.4, 0.45, 0.18));
      g.userData = { kind: "gold", top: 0.38, sway: [], spark: spark };
      return g;
    }
    function makeSand() {
      var g = new T.Group();
      var bits = [];
      for (var i = 0; i < 11; i++) {
        var s = new T.Mesh(new T.SphereGeometry(0.09 + Math.random() * 0.05, 6, 5), new T.MeshLambertMaterial({ color: i % 2 ? 0xfbbf24 : 0xf59e0b }));
        s.position.set((Math.random() - 0.5) * 0.45, 0.1 + (i % 4) * 0.07, (Math.random() - 0.5) * 0.45);
        g.add(s); bits.push(s);
      }
      g.add(hitBox(0.7, 0.36, 0.7, 0.16));
      g.userData = { kind: "sand", top: 0.36, sway: [], sand: bits };
      return g;
    }
    function makeTree() {
      var g = new T.Group();
      var trunk = new T.Mesh(new T.CylinderGeometry(0.08, 0.11, 0.7, 7), new T.MeshLambertMaterial({ color: 0x7c2d12 }));
      trunk.position.y = 0.35; g.add(trunk);
      var sway = [];
      var leafCols = [0x16a34a, 0x22c55e, 0x4ade80];
      for (var i = 0; i < 3; i++) {
        var leaf = new T.Mesh(new T.SphereGeometry(0.28 - i * 0.04, 8, 6), new T.MeshLambertMaterial({ color: leafCols[i] }));
        leaf.position.set((i - 1) * 0.08, 0.78 + i * 0.16, (i % 2) * 0.05);
        g.add(leaf); addSway(sway, leaf, 0.08);
      }
      g.add(hitBox(0.7, 1.15, 0.7, 0.55));
      g.userData = { kind: "tree", top: 1.15, sway: sway };
      return g;
    }
    function makeFlower() {
      var g = new T.Group();
      var stem = new T.Mesh(new T.CylinderGeometry(0.03, 0.035, 0.42, 6), new T.MeshLambertMaterial({ color: 0x16a34a }));
      stem.position.y = 0.21; g.add(stem);
      var sway = []; addSway(sway, stem, 0.1);
      var cols = [0xfb7185, 0xf472b6, 0xfde047, 0xa78bfa];
      var blossom = new T.Group(); blossom.position.y = 0.46; g.add(blossom);
      for (var i = 0; i < 5; i++) {
        var pet = new T.Mesh(new T.SphereGeometry(0.08, 7, 5), new T.MeshLambertMaterial({ color: cols[i % cols.length] }));
        var a = i / 5 * Math.PI * 2;
        pet.position.set(Math.cos(a) * 0.1, 0, Math.sin(a) * 0.1);
        pet.scale.set(1, 0.55, 1); blossom.add(pet);
      }
      var mid = new T.Mesh(new T.SphereGeometry(0.06, 7, 5), new T.MeshLambertMaterial({ color: 0xfacc15 }));
      blossom.add(mid);
      addSway(sway, blossom, 0.16);
      g.add(hitBox(0.35, 0.55, 0.35, 0.26));
      g.userData = { kind: "flower", top: 0.55, sway: sway };
      return g;
    }
    function makeHouse() {
      var g = new T.Group();
      var wall = new T.Mesh(new T.BoxGeometry(0.7, 0.42, 0.58), new T.MeshLambertMaterial({ color: 0xfdba74 }));
      wall.position.y = 0.27; g.add(wall);
      var door = new T.Mesh(new T.BoxGeometry(0.14, 0.22, 0.04), new T.MeshLambertMaterial({ color: 0x7c2d12 }));
      door.position.set(0, 0.2, 0.31); g.add(door);
      var win = new T.Mesh(new T.BoxGeometry(0.14, 0.12, 0.03), new T.MeshLambertMaterial({ color: 0x7dd3fc }));
      win.position.set(-0.2, 0.32, 0.3); g.add(win);
      var roof = new T.Mesh(new T.ConeGeometry(0.55, 0.38, 4), new T.MeshLambertMaterial({ color: 0xdc2626 }));
      roof.position.y = 0.66; roof.rotation.y = Math.PI / 4; g.add(roof);
      var chim = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 0.18, 6), new T.MeshLambertMaterial({ color: 0x78716c }));
      chim.position.set(0.18, 0.78, -0.08); g.add(chim);
      g.add(hitBox(0.75, 0.85, 0.62, 0.42));
      g.userData = { kind: "house", top: 0.86, sway: [] };
      return g;
    }
    function makeFence() {
      var g = new T.Group();
      var rail = new T.Mesh(new T.BoxGeometry(0.86, 0.07, 0.07), new T.MeshLambertMaterial({ color: 0xb45309 }));
      rail.position.y = 0.28; g.add(rail);
      for (var i = -1; i <= 1; i++) {
        var post = new T.Mesh(new T.BoxGeometry(0.08, 0.42, 0.08), new T.MeshLambertMaterial({ color: 0x92400e }));
        post.position.set(i * 0.32, 0.21, 0); g.add(post);
        var cap = new T.Mesh(new T.ConeGeometry(0.055, 0.08, 5), new T.MeshLambertMaterial({ color: 0x7c2d12 }));
        cap.position.set(i * 0.32, 0.46, 0); g.add(cap);
      }
      g.add(hitBox(0.9, 0.48, 0.2, 0.24));
      g.userData = { kind: "fence", top: 0.5, sway: [] };
      return g;
    }

    var MAKERS = { wood: makeWood, grass: makeGrass, water: makeWater, stone: makeStone, gold: makeGold, sand: makeSand, tree: makeTree, flower: makeFlower, house: makeHouse, fence: makeFence };
    var pieces = [];
    var looseSand = [];

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), gain = ac.createGain();
        o.frequency.value = f; gain.gain.value = 0.08; o.connect(gain); gain.connect(ac.destination);
        o.start(); gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function save() { try { localStorage.setItem("alabryuu-sandbox", JSON.stringify({ stars: stars, mission: mission })); } catch (e) {} }
    function hud() {
      document.getElementById("ms").textContent = JOBS[mission].n;
      document.getElementById("bl").textContent = placed + "/" + JOBS[mission].need;
      document.getElementById("st").textContent = "⭐ " + stars;
      document.getElementById("say").textContent = JOBS[mission].say;
    }
    function clearWorld() {
      pieces.forEach(function (p) { scene.remove(p); });
      looseSand.forEach(function (s) { scene.remove(s); });
      pieces = []; looseSand = []; placed = 0; hud();
    }
    function rootOf(obj) {
      var o = obj;
      while (o.parent && o.parent !== scene) o = o.parent;
      return o;
    }

    var ray = new T.Raycaster(), mouse = new T.Vector2();
    renderer.domElement.addEventListener("pointerdown", function (ev) {
      if (!play) return;
      mouse.x = (ev.clientX / innerWidth) * 2 - 1;
      mouse.y = -(ev.clientY / innerHeight) * 2 + 1;
      ray.setFromCamera(mouse, cam);
      var hits = ray.intersectObjects([floor].concat(pieces), true);
      if (!hits.length) return;
      var hit = hits[0];
      var gx = Math.round(hit.point.x / CELL) * CELL;
      var gz = Math.round(hit.point.z / CELL) * CELL;
      var gy = 0;
      if (hit.object !== floor) {
        var root = rootOf(hit.object);
        if (root.userData && root.userData.top) {
          gx = root.position.x; gz = root.position.z;
          gy = root.position.y + root.userData.top;
        }
      }
      if (tool === "sand") {
        for (var i = 0; i < 8; i++) {
          var bit = new T.Mesh(new T.SphereGeometry(0.07, 6, 5), new T.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0xfbbf24 : 0xf59e0b }));
          bit.position.set(gx + (Math.random() - 0.5) * 0.4, gy + 0.55 + Math.random() * 0.3, gz + (Math.random() - 0.5) * 0.4);
          bit.userData = { vy: 0 };
          scene.add(bit); looseSand.push(bit);
        }
        var heap = makeSand();
        heap.position.set(gx, gy, gz);
        scene.add(heap); pieces.push(heap);
      } else {
        var piece = MAKERS[tool]();
        piece.position.set(gx, gy, gz);
        scene.add(piece); pieces.push(piece);
      }
      placed++; stars++;
      kidTarget.set(gx - 0.7, 0, gz + 0.55);
      hud(); save(); beep(540, 0.05);
      if (placed >= JOBS[mission].need) {
        mission++;
        if (mission >= JOBS.length) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("wp").textContent = "⭐ " + stars + "  A real little town.";
          document.getElementById("win").classList.remove("off");
        } else { clearWorld(); }
      }
    });

    [].forEach.call(document.querySelectorAll("#dock button[data-k]"), function (b) {
      b.onclick = function () {
        tool = b.getAttribute("data-k");
        [].forEach.call(document.querySelectorAll("#dock button"), function (x) { x.classList.remove("on"); });
        b.classList.add("on");
        beep(360, 0.04);
      };
    });

    function start() {
      play = true; mission = 0; clearWorld();
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;

    var clock = new T.Clock();
    function tick() {
      var dt = Math.min(0.033, clock.getDelta());
      t += dt;
      clouds.forEach(function (c, i) {
        c.position.x += dt * 0.15;
        if (c.position.x > 12) c.position.x = -12;
        c.position.y += Math.sin(t * 0.6 + i) * 0.002;
      });
      birds.forEach(function (b, i) {
        b.userData.a += dt * 0.7;
        var a = b.userData.a;
        b.position.set(Math.cos(a) * 5.5, 3.4 + Math.sin(a * 2) * 0.3, Math.sin(a) * 5.5);
        b.lookAt(b.position.x - Math.sin(a), b.position.y, b.position.z + Math.cos(a));
        b.userData.wings.forEach(function (w, wi) { w.rotation.z = Math.sin(t * 10 + i) * 0.6 * (wi ? -1 : 1); });
      });
      pieces.forEach(function (p) {
        (p.userData.sway || []).forEach(function (s) { s.m.rotation.z = Math.sin(t * 2.4 + s.ph) * s.amp; });
        if (p.userData.water) {
          p.userData.water.position.y = 0.06 + Math.sin(t * 3) * 0.015;
          p.userData.water.scale.setScalar(1 + Math.sin(t * 2.2) * 0.04);
        }
        if (p.userData.fish) {
          var f = p.userData.fish;
          f.position.x = Math.cos(t * 1.6) * 0.18;
          f.position.z = Math.sin(t * 1.6) * 0.14;
          f.rotation.y = -t * 1.6;
        }
        (p.userData.spark || []).forEach(function (sp) { sp.scale.setScalar(0.6 + Math.abs(Math.sin(t * 6)) * 0.8); });
      });
      looseSand.forEach(function (s) {
        s.userData.vy -= 14 * dt;
        s.position.y += s.userData.vy * dt;
        if (s.position.y < 0.07) { s.position.y = 0.07; s.userData.vy *= -0.15; }
      });
      if (looseSand.length > 90) { var old = looseSand.shift(); scene.remove(old); }
      var dx = kidTarget.x - kid.position.x, dz = kidTarget.z - kid.position.z;
      var dist = Math.sqrt(dx * dx + dz * dz);
      var walking = dist > 0.08;
      if (walking) {
        kid.position.x += dx * 2.4 * dt;
        kid.position.z += dz * 2.4 * dt;
        kid.rotation.y = Math.atan2(dx, dz);
      }
      kid.userData.legs.forEach(function (hip, i) {
        hip.rotation.x = walking ? Math.sin(t * 10) * 0.7 * (i ? -1 : 1) : Math.sin(t * 3 + i) * 0.08;
      });
      kid.userData.head.rotation.y = Math.sin(t * 2) * 0.15;
      cam.position.lerp(new T.Vector3(7.2 + Math.sin(t * 0.12) * 0.35, 6.8, 9.2), 0.04);
      cam.lookAt(0.2, 0.5, 0);
      renderer.render(scene, cam);
      requestAnimationFrame(tick);
    }
    addEventListener("resize", function () {
      cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    hud();
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
