<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Treasure Dig</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>html,body{background:#f59e0b}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="got">💎 0/3</b></div>
  <div id="say">Tap sand piles. Dig treasure!</div>
  <div class="cover" id="title">
    <div class="hero">💎</div>
    <h1>Treasure Dig</h1>
    <p>Dig 3 sparkly treasures.</p>
    <button class="play" id="go">Dig</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">👑</div>
    <h1>Treasure!</h1>
    <p>Three shiny finds.</p>
    <button class="play g" id="again">Dig again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, n = 0, stars = 0, piles = [];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-dig") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; n = 0;
      piles = [
        { x: 0.22, y: 0.40, gem: "💎", dug: 0 },
        { x: 0.50, y: 0.36, gem: "", dug: 0 },
        { x: 0.78, y: 0.42, gem: "👑", dug: 0 },
        { x: 0.30, y: 0.64, gem: "", dug: 0 },
        { x: 0.62, y: 0.68, gem: "⭐", dug: 0 },
        { x: 0.48, y: 0.52, gem: "", dug: 0 }
      ];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("got").textContent = "💎 0/3";
      document.getElementById("say").textContent = "Tap a sand pile!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      piles.forEach(function (p) {
        var dx = e.clientX - p.x * W, dy = e.clientY - p.y * H;
        if (dx * dx + dy * dy < 55 * 55 && !p.dug) {
          p.dug = 1;
          if (p.gem) {
            n++; stars += 2;
            try { localStorage.setItem("alabryuu-dig", JSON.stringify({ stars: stars })); } catch (err) {}
            document.getElementById("got").textContent = "💎 " + n + "/3";
            document.getElementById("say").textContent = "Wow " + p.gem + "!";
            if (n >= 3) { play = false; document.getElementById("win").classList.remove("off"); }
          } else document.getElementById("say").textContent = "Just sand. Dig another!";
        }
      });
    });
    function loop() {
      x.fillStyle = "#fde68a"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#38bdf8"; x.fillRect(0, 0, W, 90);
      em("☀️", W * 0.84, 80, 56);
      piles.forEach(function (p) {
        if (p.dug && p.gem) em(p.gem, p.x * W, p.y * H, 72);
        else if (p.dug) em("🕳️", p.x * W, p.y * H, 56);
        else em("🏜️", p.x * W, p.y * H, 72);
      });
      em("🧒", W * 0.12, H * 0.82, 56);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
