<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Treasure Dig</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../kid-sprites.js"></script>
  <style>html,body{background:#f59e0b}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="got">💎 0/4</b></div>
  <div id="say">TAP a sand pile!</div>
  <div class="cover" id="title">
    <div class="hero"><img src="../assets/sprites/treasure-dig/hero.png" alt="" width="96" height="96" /></div>
    <h1>Treasure Dig</h1>
    <p>Dig 4 piles. Find sparkles!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">👑</div>
    <h1>Treasure!</h1>
    <p>Four shiny finds.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, n = 0, stars = 0, piles = [];
    var GEMS = ["💎", "👑", "⭐", "💍"];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-dig") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    var SPR = {
      "💎": kidSprite("treasure-dig/hero.png"),
      "🧒": kidSprite("treasure-dig/char1.png"),
      "⛏️": kidSprite("treasure-dig/char2.png"),
      "🏜️": kidSprite("treasure-dig/char3.png"),
    };
    function em(ch, px, py, s) {
      kidStamp(x, ch, px, py, s, SPR);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = Math.floor(W * d); cv.height = Math.floor(H * d);
      cv.style.width = W + "px"; cv.style.height = H + "px";
      x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; n = 0;
      piles = [
        { x: 0.25, y: 0.38, gem: GEMS[0], dug: 0, shake: 0 },
        { x: 0.72, y: 0.40, gem: GEMS[1], dug: 0, shake: 0 },
        { x: 0.30, y: 0.66, gem: GEMS[2], dug: 0, shake: 0 },
        { x: 0.70, y: 0.68, gem: GEMS[3], dug: 0, shake: 0 }
      ];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("got").textContent = "💎 0/4";
      kidPing("TAP a sand pile!");
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var p = kidPt(e, cv), best = -1, bestD = 110 * 110, i;
      for (i = 0; i < piles.length; i++) {
        var dx = p.x - piles[i].x * W, dy = p.y - piles[i].y * H, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best < 0) {
        for (i = 0; i < piles.length; i++) if (!piles[i].dug) { best = i; break; }
      }
      if (best < 0) return;
      if (piles[best].dug) {
        kidTap(piles[best].gem, "Shiny!", piles[best].x * innerWidth, piles[best].y * innerHeight, 700);
        return;
      }
      piles[best].dug = 1; piles[best].shake = 1; n++; stars += 2;
      try { localStorage.setItem("alabryuu-dig", JSON.stringify({ stars: stars })); } catch (err) {}
      document.getElementById("got").textContent = "💎 " + n + "/4";
      kidTap(piles[best].gem, "Find! " + piles[best].gem + "  " + n + "/4", piles[best].x * innerWidth, piles[best].y * innerHeight, 480);
      kidBurst(["✨", piles[best].gem, "💛"], piles[best].x * innerWidth, piles[best].y * innerHeight);
      if (n >= 4) {
        play = false;
        kidYay();
        document.getElementById("win").classList.remove("off");
      }
    });
    function loop() {
      x.fillStyle = "#fde68a"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#38bdf8"; x.fillRect(0, 0, W, 100);
      em("☀️", W * 0.84, 78, 64);
      em("🌴", W * 0.1, H * 0.22, 72);
      piles.forEach(function (p) {
        if (p.shake > 0) p.shake -= 0.06;
        var jx = (p.shake > 0 ? Math.sin(p.shake * 40) * 8 : 0);
        if (p.dug) em(p.gem, p.x * W + jx, p.y * H, 104);
        else em("🏜️", p.x * W + jx, p.y * H, 112);
      });
      em("🧒", W * 0.12, H * 0.84, 72);
      em("⛏️", W * 0.22, H * 0.84, 48);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
