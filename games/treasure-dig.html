<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Treasure Dig</title>
  <script src="../vendor/three.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:Verdana,system-ui,sans-serif;background:#1c1917;color:#fef3c7;touch-action:none;user-select:none}
    button{background:transparent;border:0;appearance:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .home{position:fixed;top:12px;left:12px;z-index:8;color:#fff;text-decoration:none;font-weight:800;background:rgba(0,0,0,.45);padding:8px 14px;border-radius:999px}
    #hud{position:fixed;top:12px;right:12px;z-index:8;font-weight:800;text-align:right;pointer-events:none}
    #hud b{display:inline-block;background:#fef3c7;color:#7c2d12;padding:6px 10px;border-radius:999px;margin-left:6px}
    #say{position:fixed;left:10px;right:10px;bottom:110px;text-align:center;font-weight:800;z-index:8;pointer-events:none}
    #dock{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none;gap:8px;padding:10px 12px 16px;background:#431407}
    #dock.on{display:flex}
    #dock button{flex:1;height:76px;border-radius:16px;background:#fde047;color:#422006;font-weight:800;font-size:18px}
    #dock button.on{outline:3px solid #fff}
    .cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;background:linear-gradient(#b45309,#1c1917)}
    .cover.off{display:none}
    h1{font-size:clamp(32px,8vw,50px)}
    .btn{background:#ffd166;color:#3b2100;font-weight:800;font-size:24px;padding:14px 26px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="cv">Beach cave</b><b id="fd">💎 0</b><b id="st">⭐ 0</b></div>
  <div id="say">Tap a mound. Lantern finds gold!</div>
  <div id="dock">
    <button id="dig" class="on">Dig</button>
    <button id="lamp">Lantern</button>
    <button id="brush">Brush</button>
  </div>
  <div class="cover" id="title">
    <h1>Treasure Dig</h1>
    <p>3D cave. Soft lantern.<br>Dig, brush, open the chest.</p>
    <button class="btn" id="go">Dig</button>
  </div>
  <div class="cover off" id="win">
    <h1>Gold hug!</h1>
    <p id="wp">Five caves.</p>
    <button class="btn" id="again">Dig again</button>
  </div>
  <script>
  (function () {
    if (!window.THREE) return;
    var T = THREE, play = false, caveI = 0, found = 0, stars = 0, tool = "dig", t = 0, lampOn = 0;
    var CAVES = [
      { n: "Beach cave", need: 4, verb: "dig" },
      { n: "Crystal hall", need: 5, verb: "glow" },
      { n: "Night dig", need: 5, verb: "lamp", night: 1 },
      { n: "Brush room", need: 6, verb: "brush" },
      { n: "Home vault", need: 4, verb: "chest" }
    ];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-dig") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}

    var scene = new T.Scene();
    var cam = new T.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 60);
    cam.position.set(0, 3.2, 7.2);
    var renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    document.body.appendChild(renderer.domElement);
    var amb = new T.AmbientLight(0x3f2a14, 0.45); scene.add(amb);
    var sun = new T.DirectionalLight(0xffe8b0, 0.55); sun.position.set(3, 8, 4); scene.add(sun);
    var lantern = new T.PointLight(0xfde047, 0.4, 7); lantern.position.set(0, 2, 2); scene.add(lantern);

    var floor = new T.Mesh(new T.PlaneGeometry(16, 16), new T.MeshLambertMaterial({ color: 0xa16207 }));
    floor.rotation.x = -Math.PI / 2; scene.add(floor);
    var walls = new T.Mesh(new T.CylinderGeometry(7, 7, 5, 16, 1, true), new T.MeshLambertMaterial({ color: 0x44403c, side: T.BackSide }));
    walls.position.y = 2.4; scene.add(walls);

    var kid = new T.Group();
    var body = new T.Mesh(new T.SphereGeometry(0.2, 10, 8), new T.MeshLambertMaterial({ color: 0xf97316 }));
    body.position.y = 0.7; kid.add(body);
    var head = new T.Mesh(new T.SphereGeometry(0.14, 8, 8), new T.MeshLambertMaterial({ color: 0xffe0b0 }));
    head.position.y = 1.02; kid.add(head);
    var lampMesh = new T.Mesh(new T.SphereGeometry(0.09, 8, 8), new T.MeshBasicMaterial({ color: 0xfde047 }));
    lampMesh.position.set(0.28, 0.72, 0.1); kid.add(lampMesh);
    var legs = [];
    for (var s = -1; s <= 1; s += 2) {
      var hip = new T.Group(); hip.position.set(s * 0.08, 0.42, 0);
      var th = new T.Mesh(new T.BoxGeometry(0.08, 0.26, 0.08), new T.MeshLambertMaterial({ color: 0x7c2d12 }));
      th.position.y = -0.12; hip.add(th);
      kid.add(hip); legs.push(hip);
    }
    kid.position.set(0, 0, 2.4); scene.add(kid);

    var mounds = [];
    var chest = new T.Group();
    var cbox = new T.Mesh(new T.BoxGeometry(0.8, 0.45, 0.5), new T.MeshLambertMaterial({ color: 0xb45309 }));
    cbox.position.y = 0.25; chest.add(cbox);
    var lid = new T.Mesh(new T.BoxGeometry(0.82, 0.14, 0.52), new T.MeshLambertMaterial({ color: 0xf59e0b }));
    lid.position.set(0, 0.52, 0); chest.add(lid);
    chest.position.set(0, 0, -2.2); chest.visible = false; scene.add(chest);

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f; g.gain.value = 0.09; o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function save() { try { localStorage.setItem("alabryuu-dig", JSON.stringify({ stars: stars })); } catch (e) {} }

    function spawn() {
      mounds.forEach(function (m) { scene.remove(m); });
      mounds = []; found = 0; chest.visible = false; lid.rotation.x = 0;
      var cv = CAVES[caveI];
      scene.background = new T.Color(cv.night ? 0x0b1020 : 0x44403c);
      amb.intensity = cv.night ? 0.15 : 0.5;
      for (var i = 0; i < cv.need + 2; i++) {
        var g = new T.Group();
        var dirt = new T.Mesh(new T.SphereGeometry(0.38, 10, 8), new T.MeshLambertMaterial({ color: 0x92400e }));
        dirt.scale.set(1.2, 0.7, 1.1); dirt.position.y = 0.18; g.add(dirt);
        var gem = new T.Mesh(new T.OctahedronGeometry(0.12, 0), new T.MeshLambertMaterial({ color: [0x38bdf8, 0xf472b6, 0xfde047][i % 3] }));
        gem.position.y = 0.16; gem.visible = false; g.add(gem);
        g.position.set((i % 3 - 1) * 1.8, 0, (Math.floor(i / 3) - 1) * 1.6);
        g.userData = { hits: 0, gem: gem, dirt: dirt, done: 0 };
        scene.add(g); mounds.push(g);
      }
      document.getElementById("cv").textContent = cv.n;
      document.getElementById("fd").textContent = "Gems 0/" + cv.need;
      document.getElementById("say").textContent = ["Tap to dig!", "Crystals wink!", "Hold the lamp!", "Brush the last dirt!", "Open the chest!"][caveI];
    }

    var ray = new T.Raycaster(), mouse = new T.Vector2();
    renderer.domElement.addEventListener("pointerdown", function (ev) {
      if (!play) return;
      mouse.x = (ev.clientX / innerWidth) * 2 - 1;
      mouse.y = -(ev.clientY / innerHeight) * 2 + 1;
      ray.setFromCamera(mouse, cam);
      if (chest.visible && ray.intersectObject(cbox, false).length) {
        lid.rotation.x = -1.1; stars += 2; save(); beep(880, 0.12);
        caveI++;
        if (caveI >= CAVES.length) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("wp").textContent = "⭐ " + stars;
          document.getElementById("win").classList.remove("off");
        } else spawn();
        return;
      }
      var hits = ray.intersectObjects(mounds, true);
      if (!hits.length) return;
      var g = hits[0].object.parent;
      if (!g.userData || g.userData.done) return;
      var needHits = tool === "brush" ? 1 : 2;
      g.userData.hits++;
      g.userData.dirt.scale.y *= 0.75;
      kid.position.x += (g.position.x - kid.position.x) * 0.6;
      kid.position.z += (g.position.z + 1.1 - kid.position.z) * 0.6;
      beep(420, 0.05);
      if (g.userData.hits >= needHits) {
        g.userData.done = 1;
        g.userData.dirt.visible = false;
        g.userData.gem.visible = true;
        found++; stars++; save();
        document.getElementById("fd").textContent = "Gems " + found + "/" + CAVES[caveI].need;
        if (found >= CAVES[caveI].need) {
          chest.visible = true;
          document.getElementById("say").textContent = "Tap the chest!";
        }
      }
    });

    function setTool(n) {
      tool = n;
      document.getElementById("dig").classList.toggle("on", n === "dig");
      document.getElementById("lamp").classList.toggle("on", n === "lamp");
      document.getElementById("brush").classList.toggle("on", n === "brush");
      if (n === "lamp") { lampOn = 1; lantern.intensity = 1.6; }
    }
    document.getElementById("dig").onclick = function () { setTool("dig"); };
    document.getElementById("lamp").onclick = function () { setTool("lamp"); };
    document.getElementById("brush").onclick = function () { setTool("brush"); };

    function start() {
      play = true; caveI = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      setTool("dig"); spawn();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;

    var clock = new T.Clock();
    function tick() {
      var dt = Math.min(0.033, clock.getDelta());
      t += dt;
      legs.forEach(function (hip, i) { hip.rotation.x = Math.sin(t * 7 + i * 3) * 0.55; });
      lampMesh.visible = lampOn || !!CAVES[caveI].night;
      lantern.position.copy(kid.position); lantern.position.y = 1.1;
      lantern.intensity += ((lampOn || CAVES[caveI].night ? 1.4 : 0.35) - lantern.intensity) * 0.08;
      mounds.forEach(function (m) {
        if (m.userData.gem.visible) m.userData.gem.rotation.y += dt * 2;
      });
      cam.position.x = Math.sin(t * 0.2) * 0.4;
      cam.lookAt(0, 0.4, 0);
      renderer.render(scene, cam);
      requestAnimationFrame(tick);
    }
    addEventListener("resize", function () {
      cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    scene.background = new T.Color(0x44403c);
    spawn();
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
