<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Zoom Race</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:Trebuchet MS,sans-serif;background:#1e293b;color:#fff;touch-action:none;user-select:none}
    button{background:transparent;border:0;appearance:none;font:inherit;color:inherit;cursor:pointer}
    canvas{display:block;width:100%;height:100%}
    .home{position:fixed;top:12px;left:12px;z-index:8;color:#7c2d12;text-decoration:none;font-weight:800;background:#fde047;padding:8px 14px;border-radius:999px}
    #hud{position:fixed;top:12px;right:12px;z-index:8;text-align:right;font-weight:800;pointer-events:none}
    #hud b{display:inline-block;background:#fff;color:#9a3412;padding:6px 10px;border-radius:999px;margin-left:6px}
    #say{position:fixed;left:10px;right:10px;top:56px;text-align:center;font-weight:800;z-index:8;pointer-events:none}
    #pads{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none;gap:10px;padding:10px;justify-content:center}
    #pads.on{display:flex}
    #pads button{min-width:96px;height:64px;border-radius:18px;background:#f97316;color:#fff;font-weight:800;font-size:18px;box-shadow:0 6px 0 #9a3412}
    #B.hot{background:#fde047;color:#9a3412}
    .cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;background:linear-gradient(#ea580c,#fde047)}
    .cover.off{display:none}
    h1{font-size:clamp(34px,9vw,52px);color:#fff;text-shadow:0 4px 0 #9a3412}
    .btn{background:#fde047;color:#7c2d12;font-weight:800;font-size:24px;padding:14px 26px;border-radius:999px;box-shadow:0 7px 0 #ca8a04}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="tr">Dawn City</b><b id="co">Coins 0</b><b id="sp">0 mph</b></div>
  <div id="say">Steer with taps!</div>
  <div id="pads">
    <button id="L">◀ Left</button>
    <button id="B">Boost</button>
    <button id="R">Right ▶</button>
  </div>
  <div class="cover" id="title">
    <h1>Zoom Race</h1>
    <p>Three lanes. Tap to steer.<br>Hold Boost!</p>
    <button class="btn" id="go">Drive</button>
  </div>
  <div class="cover off" id="win">
    <h1>Zoom champ!</h1>
    <p id="wp">🪙 0</p>
    <button class="btn" id="again">Race again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, track = 0, coins = 0, stars = 0, lane = 0, boost = 0, spd = 0;
    var bits = [], cars = [];
    var TRACKS = [
      { n: "Dawn City", night: 0, need: 6, spd: 10 },
      { n: "Tunnel Dash", night: 1, need: 7, spd: 12 },
      { n: "Rain Road", night: 0, need: 7, spd: 11 },
      { n: "Night Neon", night: 1, need: 8, spd: 14 },
      { n: "Star Highway", night: 1, need: 6, spd: 13 }
    ];
    var SAYS = ["Steer with taps!", "Tunnel lights!", "Splash the rain!", "Hold BOOST!", "Home lights!"];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-zoom") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function resize() { var d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); }
    addEventListener("resize", resize); resize();
    function laneX(l) { return W * 0.5 + l * Math.min(92, W * 0.22); }
    function loadTrack() {
      coins = 0; bits = []; cars = []; lane = 0;
      var i;
      for (i = 0; i < 8; i++) bits.push({ x: [-1, 0, 1][i % 3], y: -i * 90, got: 0 });
      for (i = 0; i < 4; i++) cars.push({ x: [-1, 0, 1][(i + 1) % 3], y: -160 - i * 140 });
      document.getElementById("tr").textContent = TRACKS[track].n;
      document.getElementById("say").textContent = SAYS[track];
      document.getElementById("co").textContent = "Coins 0";
    }
    function start() {
      play = true; track = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("pads").classList.add("on");
      loadTrack();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("L").onclick = function () { lane = Math.max(-1, lane - 1); };
    document.getElementById("R").onclick = function () { lane = Math.min(1, lane + 1); };
    document.getElementById("B").onpointerdown = function () { boost = 1; this.classList.add("hot"); };
    addEventListener("pointerup", function () { boost = 0; document.getElementById("B").classList.remove("hot"); });

    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      var m = TRACKS[track];
      spd = m.spd + (boost ? 8 : 0);
      document.getElementById("sp").textContent = Math.round(spd * 8) + " mph";
      var scroll = spd * 22 * dt;
      if (play) {
        bits.forEach(function (c) {
          c.y += scroll;
          if (!c.got && c.y > H * 0.68 && c.y < H * 0.82 && c.x === lane) {
            c.got = 1; coins++; stars++; document.getElementById("co").textContent = "Coins " + coins;
            try { localStorage.setItem("alabryuu-zoom", JSON.stringify({ stars: stars, track: track })); } catch (e) {}
          }
          if (c.y > H) { c.y = -40; c.x = [-1, 0, 1][(Math.random() * 3) | 0]; c.got = 0; }
        });
        cars.forEach(function (c) {
          c.y += scroll * 0.7;
          if (c.y > H * 0.7 && c.y < H * 0.86 && c.x === lane) { c.y = -80; }
          if (c.y > H) { c.y = -120; c.x = [-1, 0, 1][(Math.random() * 3) | 0]; }
        });
        if (coins >= m.need) {
          track++;
          if (track >= TRACKS.length) {
            play = false; document.getElementById("pads").classList.remove("on");
            document.getElementById("wp").textContent = "🪙 " + coins + "  ★ " + stars;
            document.getElementById("win").classList.remove("off");
          } else loadTrack();
        }
      }
      x.fillStyle = m.night ? "#0b1020" : "#7dd3fc"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#334155"; x.fillRect(W * 0.18, 0, W * 0.64, H);
      x.strokeStyle = "#f8fafc"; x.setLineDash([16, 18]); x.lineWidth = 4;
      x.beginPath(); x.moveTo(W * 0.5, (t * 80) % 40); x.lineTo(W * 0.5, H); x.stroke();
      x.setLineDash([]);
      bits.forEach(function (c) { if (c.got) return; x.fillStyle = "#fde047"; x.beginPath(); x.arc(laneX(c.x), c.y, 10, 0, 6.3); x.fill(); });
      cars.forEach(function (c) { x.fillStyle = "#ef4444"; x.fillRect(laneX(c.x) - 18, c.y, 36, 50); });
      var cy = H * 0.76;
      x.fillStyle = "#38bdf8"; x.fillRect(laneX(lane) - 20, cy, 40, 54);
      x.fillStyle = "#fde047"; x.fillRect(laneX(lane) - 12, cy + 8, 24, 14);
      if (m.n.indexOf("Rain") >= 0) {
        x.strokeStyle = "#bae6fd";
        for (var i = 0; i < 16; i++) { var rx = (i * 40 + t * 120) % W, ry = (i * 70 + t * 300) % H; x.beginPath(); x.moveTo(rx, ry); x.lineTo(rx - 6, ry + 14); x.stroke(); }
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
