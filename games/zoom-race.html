<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Zoom Race</title>
  <script src="../vendor/three.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:Verdana,system-ui,sans-serif;background:#1c1917;color:#fff7ed;touch-action:none;user-select:none}
    button{background:transparent;border:0;appearance:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .home{position:fixed;top:12px;left:12px;z-index:8;color:#fff;text-decoration:none;font-weight:800;font-size:17px;background:#ea580c;padding:8px 14px;border-radius:8px}
    #hud{position:fixed;top:12px;right:12px;z-index:8;text-align:right;font-weight:800;pointer-events:none}
    #hud b{display:inline-block;background:#292524;color:#fdba74;padding:6px 10px;border-radius:8px;margin-left:6px;border:2px solid #ea580c}
    #say{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:8;font-weight:800;text-shadow:0 2px 0 #9a3412;pointer-events:none;width:90%;text-align:center}
    #pads{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none;gap:8px;padding:10px 12px 16px}
    #pads.on{display:flex}
    #pads button{flex:1;height:88px;border-radius:20px;font-weight:800;font-size:20px}
    #L,#R{background:#44403c;color:#fde68a;box-shadow:0 7px 0 #1c1917}
    #B{background:#ea580c;color:#fff;box-shadow:0 7px 0 #9a3412}
    #B.hot{background:#22d3ee;color:#083344}
    .cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;background:linear-gradient(#ea580c,#1c1917)}
    .cover.off{display:none}
    h1{font-size:clamp(34px,9vw,54px);text-transform:uppercase;text-shadow:3px 4px 0 #9a3412}
    .btn{background:#fde047;color:#422006;font-weight:800;font-size:24px;padding:14px 26px;border-radius:14px;box-shadow:0 7px 0 #ca8a04}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="tr">Dawn City</b><b id="co">0</b><b id="sp">0</b></div>
  <div id="say">Tap a lane. Wheels spin!</div>
  <div id="pads">
    <button id="L">◀ Left</button>
    <button id="B">Boost</button>
    <button id="R">Right ▶</button>
  </div>
  <div class="cover" id="title">
    <h1>Zoom Race</h1>
    <p>3D road. Real wheels.<br>Tap lanes. Night lights.</p>
    <button class="btn" id="go">Drive</button>
  </div>
  <div class="cover off" id="win">
    <h1>Zoom champ!</h1>
    <p id="wp">Five roads.</p>
    <button class="btn" id="again">Race again</button>
  </div>
  <script>
  (function () {
    if (!window.THREE) return;
    var T = THREE, play = false, track = 0, coins = 0, stars = 0, t = 0, boost = 0, lane = 0, targetLane = 0;
    var TRACKS = [
      { n: "Dawn City", night: 0, verb: "steer", need: 6, spd: 10 },
      { n: "Tunnel Dash", night: 1, verb: "lights", need: 7, spd: 12 },
      { n: "Rain Road", night: 0, verb: "splash", need: 7, spd: 11 },
      { n: "Night Neon", night: 1, verb: "boost", need: 8, spd: 14 },
      { n: "Star Highway", night: 1, verb: "home", need: 6, spd: 13 }
    ];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-zoom") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}

    var scene = new T.Scene();
    var cam = new T.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 120);
    var renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    document.body.appendChild(renderer.domElement);

    var hemi = new T.HemisphereLight(0xffe8c8, 0x3f2a14, 0.7); scene.add(hemi);
    var sun = new T.DirectionalLight(0xfff1c1, 0.9); sun.position.set(-6, 10, 4); scene.add(sun);

    var road = new T.Mesh(new T.PlaneGeometry(8, 200), new T.MeshLambertMaterial({ color: 0x292524 }));
    road.rotation.x = -Math.PI / 2; scene.add(road);
    var stripes = [];
    for (var i = 0; i < 30; i++) {
      var s = new T.Mesh(new T.PlaneGeometry(0.18, 1.4), new T.MeshBasicMaterial({ color: 0xfde047 }));
      s.rotation.x = -Math.PI / 2; s.position.set(0, 0.02, -i * 6);
      scene.add(s); stripes.push(s);
    }
    var grassL = new T.Mesh(new T.PlaneGeometry(40, 200), new T.MeshLambertMaterial({ color: 0x3f6212 }));
    grassL.rotation.x = -Math.PI / 2; grassL.position.set(-24, -0.02, 0); scene.add(grassL);
    var grassR = grassL.clone(); grassR.position.x = 24; scene.add(grassR);

    var lamps = [];
    for (var li = 0; li < 16; li++) {
      var pole = new T.Mesh(new T.CylinderGeometry(0.06, 0.08, 2.4, 6), new T.MeshLambertMaterial({ color: 0x44403c }));
      pole.position.set(li % 2 ? 3.6 : -3.6, 1.2, -li * 10);
      var bulb = new T.Mesh(new T.SphereGeometry(0.16, 8, 8), new T.MeshBasicMaterial({ color: 0xfde047 }));
      bulb.position.y = 1.3; pole.add(bulb);
      scene.add(pole); lamps.push(pole);
    }

    function makeCar(col, scale) {
      var g = new T.Group();
      var chassis = new T.Group(); g.add(chassis);
      var belly = new T.Mesh(new T.SphereGeometry(0.36, 10, 8), new T.MeshLambertMaterial({ color: col }));
      belly.scale.set(1.2, 0.52, 2.15); belly.position.y = 0.4; chassis.add(belly);
      var hood = new T.Mesh(new T.SphereGeometry(0.26, 8, 6), new T.MeshLambertMaterial({ color: col }));
      hood.scale.set(1.15, 0.42, 0.95); hood.position.set(0, 0.38, 0.52); chassis.add(hood);
      var cab = new T.Mesh(new T.SphereGeometry(0.3, 10, 8), new T.MeshLambertMaterial({ color: 0x7dd3fc }));
      cab.scale.set(0.98, 0.72, 0.88); cab.position.set(0, 0.62, -0.06); chassis.add(cab);
      var glass = new T.Mesh(new T.BoxGeometry(0.52, 0.16, 0.02), new T.MeshLambertMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.75 }));
      glass.position.set(0, 0.62, 0.2); glass.rotation.x = -0.38; chassis.add(glass);
      for (var s = -1; s <= 1; s += 2) {
        var lite = new T.Mesh(new T.SphereGeometry(0.07, 8, 6), new T.MeshBasicMaterial({ color: 0xfef08a }));
        lite.position.set(s * 0.26, 0.38, 0.78); chassis.add(lite);
        var tail = new T.Mesh(new T.SphereGeometry(0.05, 6, 5), new T.MeshBasicMaterial({ color: 0xf87171 }));
        tail.position.set(s * 0.24, 0.36, -0.78); chassis.add(tail);
        var fender = new T.Mesh(new T.SphereGeometry(0.15, 8, 6), new T.MeshLambertMaterial({ color: col }));
        fender.scale.set(0.7, 0.5, 1); fender.position.set(s * 0.4, 0.22, 0.46); chassis.add(fender);
      }
      var wheels = [];
      [[0.42, 0.48], [0.42, -0.48], [-0.42, 0.48], [-0.42, -0.48]].forEach(function (p) {
        var hub = new T.Group();
        hub.position.set(p[0], 0.18, p[1]);
        var tire = new T.Mesh(new T.TorusGeometry(0.15, 0.055, 8, 12), new T.MeshLambertMaterial({ color: 0x1c1917 }));
        tire.rotation.y = Math.PI / 2; hub.add(tire);
        var cap = new T.Mesh(new T.CylinderGeometry(0.06, 0.06, 0.07, 8), new T.MeshLambertMaterial({ color: 0xfde047 }));
        cap.rotation.z = Math.PI / 2; hub.add(cap);
        for (var i = 0; i < 5; i++) {
          var sp = new T.Mesh(new T.BoxGeometry(0.025, 0.13, 0.02), new T.MeshLambertMaterial({ color: 0xd6d3d1 }));
          sp.rotation.z = i * Math.PI / 5; hub.add(sp);
        }
        g.add(hub); wheels.push(hub);
      });
      var head = new T.Mesh(new T.SphereGeometry(0.09, 8, 8), new T.MeshLambertMaterial({ color: 0xffe0b0 }));
      head.position.set(0, 0.7, 0.02); chassis.add(head);
      g.scale.setScalar(scale || 1);
      g.userData = { wheels: wheels, body: chassis };
      return g;
    }
    var car = makeCar(0xea580c, 1);
    scene.add(car);
    var traffic = [];
    var pickups = [];
    var rain = [];
    for (var r = 0; r < 18; r++) {
      var drop = new T.Mesh(new T.BoxGeometry(0.03, 0.2, 0.03), new T.MeshBasicMaterial({ color: 0x7dd3fc }));
      drop.position.set((Math.random() - 0.5) * 8, 4 + Math.random() * 4, -Math.random() * 40);
      scene.add(drop); rain.push(drop);
    }

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f; g.gain.value = 0.08; o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function save() { try { localStorage.setItem("alabryuu-zoom", JSON.stringify({ stars: stars, track: track })); } catch (e) {} }
    function laneX(n) { return n * 1.7; }

    function loadTrack() {
      traffic.forEach(function (c) { scene.remove(c); });
      pickups.forEach(function (p) { scene.remove(p); });
      traffic = []; pickups = []; coins = 0; lane = 0; targetLane = 0;
      var tr = TRACKS[track];
      scene.background = new T.Color(tr.night ? 0x0b1020 : 0x7dd3fc);
      scene.fog = new T.Fog(tr.night ? 0x0b1020 : 0x7dd3fc, 18, 70);
      hemi.intensity = tr.night ? 0.25 : 0.75;
      sun.intensity = tr.night ? 0.15 : 0.9;
      lamps.forEach(function (p) { p.children[0].material.color.set(tr.night ? 0xffe08a : 0xfde047); });
      for (var i = 0; i < 8; i++) {
        var tc = makeCar([0x38bdf8, 0xf59e0b, 0xa78bfa, 0x86efac][i % 4], 0.95);
        tc.position.set(laneX((i % 3) - 1), 0, -18 - i * 9);
        scene.add(tc); traffic.push(tc);
      }
      for (var j = 0; j < 10; j++) {
        var coin = new T.Mesh(new T.CylinderGeometry(0.18, 0.18, 0.05, 12), new T.MeshLambertMaterial({ color: 0xfacc15 }));
        coin.rotation.x = Math.PI / 2;
        coin.position.set(laneX((j % 3) - 1), 0.5, -12 - j * 7);
        scene.add(coin); pickups.push(coin);
      }
      document.getElementById("tr").textContent = tr.n;
      document.getElementById("say").textContent = ["Steer with taps!", "Tunnel lights!", "Splash the rain!", "Hold BOOST!", "Home lights!"][track];
      document.getElementById("co").textContent = "🪙 " + coins;
    }

    function start() {
      play = true; track = 0; loadTrack();
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("pads").classList.add("on");
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("L").onclick = function () { targetLane = Math.max(-1, targetLane - 1); beep(420, 0.05); };
    document.getElementById("R").onclick = function () { targetLane = Math.min(1, targetLane + 1); beep(520, 0.05); };
    document.getElementById("B").onpointerdown = function () { boost = 1; this.classList.add("hot"); };
    document.getElementById("B").onpointerup = function () { boost = 0; this.classList.remove("hot"); };
    addEventListener("pointerup", function () { boost = 0; document.getElementById("B").classList.remove("hot"); });

    var clock = new T.Clock();
    function tick() {
      var dt = Math.min(0.033, clock.getDelta());
      t += dt;
      var tr = TRACKS[track];
      var spd = (tr.spd + (boost ? 8 : 0));
      lane += (targetLane - lane) * 8 * dt;
      car.position.x = laneX(lane);
      car.rotation.z = (targetLane - lane) * -0.15;
      car.userData.body.position.y = Math.abs(Math.sin(t * spd * 0.55)) * 0.07;
      car.userData.body.rotation.x = Math.sin(t * spd * 0.42) * 0.04;
      car.userData.wheels.forEach(function (w) { w.rotation.x += spd * dt * 1.8; });
      stripes.forEach(function (s) {
        s.position.z += spd * dt;
        if (s.position.z > 8) s.position.z -= 180;
      });
      lamps.forEach(function (p) {
        p.position.z += spd * dt;
        if (p.position.z > 10) p.position.z -= 160;
      });
      if (play) {
        traffic.forEach(function (c, i) {
          c.position.z += (spd - 4) * dt;
          c.userData.wheels.forEach(function (w) { w.rotation.x += 8 * dt; });
          if (c.position.z > 8) {
            c.position.z = -40 - Math.random() * 20;
            c.position.x = laneX((i % 3) - 1);
          }
          if (Math.abs(c.position.z - car.position.z) < 1.2 && Math.abs(c.position.x - car.position.x) < 0.8) {
            c.position.z = -30; beep(160, 0.08);
          }
        });
        pickups.forEach(function (p) {
          p.rotation.z += dt * 4;
          p.position.z += spd * dt;
          if (p.position.z > 8) { p.position.z = -50; p.visible = true; }
          if (p.visible && Math.abs(p.position.z) < 1 && Math.abs(p.position.x - car.position.x) < 0.7) {
            p.visible = false; coins++; stars++; beep(880, 0.06); save();
            document.getElementById("co").textContent = "🪙 " + coins;
            if (coins >= tr.need) {
              track++;
              if (track >= TRACKS.length) {
                play = false;
                document.getElementById("pads").classList.remove("on");
                document.getElementById("wp").textContent = "🪙 " + coins + "  ★ " + stars;
                document.getElementById("win").classList.remove("off");
              } else loadTrack();
            }
          }
        });
      }
      rain.forEach(function (d) {
        d.visible = tr.n.indexOf("Rain") >= 0;
        d.position.y -= 12 * dt; d.position.z += spd * dt;
        if (d.position.y < 0) d.position.y = 5;
      });
      cam.position.lerp(new T.Vector3(car.position.x * 0.35, 2.4, 6.4), 0.08);
      cam.lookAt(car.position.x, 0.6, -4);
      document.getElementById("sp").textContent = Math.round(spd * 8) + " mph";
      renderer.render(scene, cam);
      requestAnimationFrame(tick);
    }
    addEventListener("resize", function () {
      cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    scene.background = new T.Color(0x7dd3fc);
    loadTrack();
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
