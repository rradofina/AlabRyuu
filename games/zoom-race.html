<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Zoom Race</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../kid-sprites.js"></script>
  <style>html,body{background:#1e293b} #B.hot{background:#fde047;color:#9a3412}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="co">🪙 0/8</b><b id="sp">0</b></div>
  <div id="say">Steer. Grab coins. Hold Boost!</div>
  <div class="dock" id="pads">
    <button id="L"><span>◀️</span>Left</button>
    <button id="B"><span>🚀</span>Boost</button>
    <button id="R"><span>▶️</span>Right</button>
  </div>
  <div class="cover" id="title">
    <div class="hero"><img src="../assets/sprites/zoom-race/racer.png" alt="" width="110" height="100" /></div>
    <h1>Zoom Race</h1>
    <p>Three lanes. Grab 8 coins!</p>
    <button class="play" id="go" autofocus>Drive</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero"><img src="../assets/sprites/zoom-race/flag.png" alt="" width="56" height="84" /></div>
    <h1>Zoom champ!</h1>
    <p id="wp">🪙 0</p>
    <button class="play g" id="again">Race again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, coins = 0, stars = 0, lane = 0, boost = 0, laneSmooth = 0;
    var bits = [], cars = [];
    var S = kidSprites([
      "zoom-race/racer.png",
      "zoom-race/racer-opp.png",
      "zoom-race/cone.png",
      "zoom-race/coin.png",
      "zoom-race/flag.png",
      "zoom-race/boost-pad.png",
      "dino-stomp/cloud.png",
      "dino-stomp/sun.png",
      "shared/star.png"
    ]);
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-zoom") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function laneX(l) { return W * 0.5 + l * Math.min(100, W * 0.24); }
    function load() {
      coins = 0; bits = []; cars = []; lane = 0; laneSmooth = 0;
      var i;
      var lanes = [-1, 1, -1, 1, 0, -1, 1, 0];
      for (i = 0; i < 8; i++) bits.push({ x: lanes[i], y: -180 - i * 220, got: 0 });
      for (i = 0; i < 3; i++) cars.push({ x: [0, -1, 1][i % 3], y: -320 - i * 260, cone: i % 2 === 1 });
      document.getElementById("co").textContent = "🪙 0/8";
      document.getElementById("say").textContent = "Steer. Grab coins!";
    }
    function start() {
      play = true;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("pads").classList.add("on");
      load();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("L").onclick = function () { if (play) lane = Math.max(-1, lane - 1); };
    document.getElementById("R").onclick = function () { if (play) lane = Math.min(1, lane + 1); };
    document.getElementById("B").onpointerdown = function () { boost = 1; this.classList.add("hot"); };
    addEventListener("pointerup", function () { boost = 0; document.getElementById("B").classList.remove("hot"); });
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      var spd = 7 + (boost ? 6 : 0);
      document.getElementById("sp").textContent = Math.round(spd * 8) + " mph";
      var scroll = spd * 22 * dt;
      laneSmooth += (lane - laneSmooth) * Math.min(1, dt * 10);
      if (play) {
        bits.forEach(function (c) {
          c.y += scroll;
          if (!c.got && c.y > H * 0.64 && c.y < H * 0.84 && c.x === lane) {
            c.got = 1; coins++; stars++;
            document.getElementById("co").textContent = "🪙 " + coins + "/8";
            document.getElementById("say").textContent = "Coin!";
            try { localStorage.setItem("alabryuu-zoom", JSON.stringify({ stars: stars })); } catch (e) {}
          }
          if (c.y > H) { c.y = -50; c.x = [-1, 0, 1][(Math.random() * 3) | 0]; c.got = 0; }
        });
        cars.forEach(function (c) {
          c.y += scroll * 0.75;
          if (c.y > H * 0.66 && c.y < H * 0.86 && c.x === lane) {
            c.y = -100;
            document.getElementById("say").textContent = "Oops! Swap lanes.";
          }
          if (c.y > H) { c.y = -140; c.x = [-1, 0, 1][(Math.random() * 3) | 0]; c.cone = Math.random() > 0.45; }
        });
        if (coins >= 8) {
          play = false;
          kidYay();
          document.getElementById("pads").classList.remove("on");
          document.getElementById("wp").textContent = "🪙 8 coins!  ⭐ " + stars;
          document.getElementById("win").classList.remove("off");
        }
      }
      var sky = x.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#7dd3fc"); sky.addColorStop(1, "#bbf7d0");
      x.fillStyle = sky; x.fillRect(0, 0, W, H);
      kidDraw(x, S["dino-stomp/sun.png"], W * 0.85, 70, { fit: 64 });
      kidDraw(x, S["dino-stomp/cloud.png"], W * 0.2 + Math.sin(t * 0.4) * 10, 80, { fit: 90, alpha: 0.9 });
      // grass shoulders
      x.fillStyle = "#4ade80";
      x.fillRect(0, 0, W * 0.16, H);
      x.fillRect(W * 0.84, 0, W * 0.16, H);
      // track
      x.fillStyle = "#475569";
      x.fillRect(W * 0.16, 0, W * 0.68, H);
      // red/white curbs
      var curbY = (-(t * 120) % 36);
      for (var cy = curbY; cy < H; cy += 36) {
        x.fillStyle = "#f8fafc"; x.fillRect(W * 0.16, cy, 10, 18);
        x.fillStyle = "#ef4444"; x.fillRect(W * 0.16, cy + 18, 10, 18);
        x.fillStyle = "#f8fafc"; x.fillRect(W * 0.84 - 10, cy, 10, 18);
        x.fillStyle = "#ef4444"; x.fillRect(W * 0.84 - 10, cy + 18, 10, 18);
      }
      x.strokeStyle = "#f8fafc"; x.setLineDash([16, 18]); x.lineWidth = 4;
      x.beginPath(); x.moveTo(W * 0.5, (t * 80) % 40); x.lineTo(W * 0.5, H); x.stroke();
      x.setLineDash([]);
      bits.forEach(function (c) {
        if (c.got) return;
        var bounce = Math.sin(t * 8 + c.y * 0.02) * 4;
        kidDraw(x, S["zoom-race/coin.png"], laneX(c.x), c.y + bounce, {
          fit: 44, rot: t * 2 + c.y * 0.01
        });
      });
      cars.forEach(function (c) {
        if (c.cone) {
          kidDraw(x, S["zoom-race/cone.png"], laneX(c.x), c.y + 10, { fit: 56, squashY: 1 + Math.sin(t * 10 + c.y) * 0.04 });
        } else {
          kidDraw(x, S["zoom-race/racer-opp.png"], laneX(c.x), c.y + 20, { fit: 78, squashX: 1.02 });
        }
      });
      if (boost) {
        kidDraw(x, S["zoom-race/boost-pad.png"], laneX(laneSmooth), H * 0.86, { fit: 70, alpha: 0.85 });
      }
      var tilt = (lane - laneSmooth) * 0.18;
      var sqX = boost ? 0.94 : 1;
      var sqY = boost ? 1.08 : 1 + Math.sin(t * 14) * 0.02;
      kidDraw(x, S["zoom-race/racer.png"], laneX(laneSmooth), H * 0.74, {
        fit: 96, rot: tilt, squashX: sqX, squashY: sqY
      });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
