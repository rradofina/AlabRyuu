<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Space Story</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#e0e7ff;touch-action:manipulation}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;background:radial-gradient(circle at 20% 0%,#7c3aed,transparent 40%),#0b0830;padding:58px 16px 28px;text-align:center}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(255,255,255,.16);padding:8px 14px;border-radius:999px}
    .card{max-width:420px;margin:0 auto;background:#1e1b4b;border-radius:32px;padding:22px 18px 24px;box-shadow:0 12px 0 #312e81}
    .art{font-size:88px;line-height:1;margin:6px 0 10px}
    h1{font-size:28px;margin-bottom:8px;color:#fde68a}
    p{font-size:20px;line-height:1.4;min-height:4.2em}
    .row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
    .row button{background:#c4b5fd;color:#2e1065;font-weight:800;font-size:20px;padding:14px 16px;border-radius:20px;box-shadow:0 6px 0 #6d28d9}
    .row button:active{transform:translateY(3px);box-shadow:0 3px 0 #6d28d9}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div class="card">
    <div class="art" id="art">🚀</div>
    <h1 id="title">Space Story</h1>
    <p id="line"></p>
    <div class="row" id="row"></div>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var pages={
      start:{art:"🚀",t:"Captain Bean",line:"Captain Bean hopped into a cozy rocket with a jam sandwich. The stars blinked hello. “Ready for a kind trip?” asked the rocket.",next:[{l:"Visit the Moon",to:"moon"},{l:"Visit a rainbow planet",to:"rain"}]},
      moon:{art:"🌙",t:"Moon Wave",line:"The Moon waved a dusty hand. “Want a snack, space friend? I packed glow-cheese cubes.” A crater giggled.",next:[{l:"Share the sandwich",to:"share"},{l:"Taste glow-cheese",to:"cheese"}]},
      rain:{art:"🪐",t:"Planet Giggle",line:"Planet Giggle wore rings like hula hoops. Clouds made funny faces. “Help us find the lost giggle?” said a tiny comet.",next:[{l:"Look in a crater",to:"crater"},{l:"Ask the rings",to:"rings"}]},
      share:{art:"🥪",t:"Picnic Crater",line:"Bean split the sandwich. The Moon said, “You made night taste like home.” Fireflies that were really tiny stars danced.",next:[{l:"Dance with stars",to:"endStars"}]},
      cheese:{art:"🧀",t:"Glow Grins",line:"The cheese made Bean’s smile light up. A moon-mouse clapped. “Now we can read bedtime maps!”",next:[{l:"Read a sky map",to:"endStars"}]},
      crater:{art:"😄",t:"Found It",line:"Inside the crater sat the lost giggle, taking a nap on a pillow of dust. It woke up and bounced into Bean’s pocket.",next:[{l:"Bring it home",to:"endParty"}]},
      rings:{art:"⭕",t:"Hula Help",line:"The rings spun and sang, “Giggle went that way!” They pointed to a lemonade comet. Everyone got a sip.",next:[{l:"Ride the comet",to:"endParty"}]},
      endStars:{art:"🌟",t:"Bedtime Sky",line:"Bean tucked the rocket in with a blanket of quiet light. The Moon hummed a slow song. Tomorrow they would fly again. The end.",next:[{l:"Read again",to:"start"}]},
      endParty:{art:"🎊",t:"Comet Party",line:"Planet Giggle threw a soft parade. No loud booms. Just streamers, lemonade, and one very happy giggle. Bean waved all the way home. The end.",next:[{l:"Read again",to:"start"}]}
    };
    function show(id){
      var p=pages[id];document.getElementById("art").textContent=p.art;document.getElementById("title").textContent=p.t;document.getElementById("line").textContent=p.line;
      var row=document.getElementById("row");row.innerHTML="";
      p.next.forEach(function(n){var b=document.createElement("button");b.textContent=n.l;b.onclick=function(){beep(id.indexOf("end")===0?880:600,.1);show(n.to);};row.appendChild(b);});
    }
    show("start");
  </script>
</body>
</html>
