<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Space Story</title>
  <script src="../vendor/three.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:Verdana,system-ui,sans-serif;background:#070b22;color:#fff;touch-action:none;user-select:none}
    button{background:transparent;border:0;appearance:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .home{position:fixed;top:12px;left:12px;z-index:8;color:#fff;text-decoration:none;font-weight:800;background:#ffffff22;padding:8px 14px;border-radius:999px}
    #hud{position:fixed;top:12px;right:12px;z-index:8;font-weight:800}
    #hud b{background:#ffffff22;padding:6px 10px;border-radius:999px}
    .panel{position:fixed;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));z-index:8;background:#0b1438ee;border:3px solid #7ec8ff;border-radius:22px;padding:14px}
    .who{font-size:13px;opacity:.8}
    .say{font-size:24px;font-weight:900;margin:4px 0 10px}
    .chs{display:flex;flex-wrap:wrap;gap:8px}
    .chs button{min-height:54px;flex:1;border-radius:16px;background:#ffd84d;color:#16324a;font-weight:900;font-size:17px}
    .cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;background:#070b22ee}
    .cover.off{display:none}
    h1{font-size:clamp(32px,8vw,52px)}
    .btn{background:#ffd84d;color:#16324a;font-weight:800;font-size:24px;padding:14px 26px;border-radius:999px}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="info">Flight 1</b></div>
  <div class="panel">
    <div class="who" id="who">Pip the Pilot</div>
    <p class="say" id="say">Ready for stars?</p>
    <div class="chs" id="chs"></div>
  </div>
  <div class="cover" id="title">
    <h1>Space Story</h1>
    <p>3D cockpit. Fly world to world.<br>Choices change later beats.</p>
    <button class="btn" id="go">Launch</button>
  </div>
  <div class="cover off" id="win">
    <h1>Home star</h1>
    <p id="wp"></p>
    <button class="btn" id="again">Fly again</button>
  </div>
  <script>
  (function () {
    if (!window.THREE) return;
    var T = THREE, si = 0, camTarget = 0, t = 0;
    var flags = { helpedMoon: false, water: false, song: false, friend: "Pip" };
    try {
      var sv = JSON.parse(localStorage.getItem("alabryuu-space") || "{}");
      if (sv.flags) flags = Object.assign(flags, sv.flags);
      if (sv.scene) si = sv.scene;
    } catch (e) {}

    var scene = new T.Scene();
    var camera = new T.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 0.6, 2.4);
    var renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    renderer.setClearColor(0x050714, 1);
    document.body.appendChild(renderer.domElement);
    scene.add(new T.AmbientLight(0x4466aa, 0.55));
    var sun = new T.DirectionalLight(0xffe8b0, 1); sun.position.set(8, 6, 4); scene.add(sun);

    for (var i = 0; i < 160; i++) {
      var s = new T.Mesh(new T.SphereGeometry(0.03, 6, 4), new T.MeshBasicMaterial({ color: 0xffffff }));
      s.position.set((Math.random() - 0.5) * 80, (Math.random() - 0.5) * 50, -20 - Math.random() * 80);
      scene.add(s);
    }
    var planets = [];
    var pal = [0xff8a5b, 0x7ec8ff, 0x8be38b, 0xffd84d, 0xc9a0ff, 0xff9ad5];
    for (var p = 0; p < 6; p++) {
      var pl = new T.Mesh(new T.SphereGeometry(1.1 + p * 0.12, 16, 12), new T.MeshLambertMaterial({ color: pal[p] }));
      pl.position.set(p * 8 - 4, Math.sin(p) * 1.2, -14 - p * 3);
      scene.add(pl); planets.push(pl);
      var ring = new T.Mesh(new T.TorusGeometry(1.6 + p * 0.08, 0.05, 8, 24), new T.MeshBasicMaterial({ color: 0xffffff }));
      ring.rotation.x = 1.2; pl.add(ring);
    }
    var dash = new T.Group();
    var panel = new T.Mesh(new T.BoxGeometry(3.2, 0.5, 1.2), new T.MeshLambertMaterial({ color: 0x2a3558 }));
    panel.position.set(0, -0.55, 0.4); dash.add(panel);
    for (var k = 0; k < 4; k++) {
      var knob = new T.Mesh(new T.CylinderGeometry(0.08, 0.08, 0.08, 10), new T.MeshLambertMaterial({ color: 0xff6b6b }));
      knob.position.set(-1 + k * 0.6, -0.25, 0.7); dash.add(knob);
    }
    scene.add(dash);
    var buddy = new T.Group();
    buddy.add(new T.Mesh(new T.SphereGeometry(0.18, 10, 8), new T.MeshLambertMaterial({ color: 0x7ec8ff })));
    var bh = new T.Mesh(new T.SphereGeometry(0.12, 10, 8), new T.MeshLambertMaterial({ color: 0xffe0b0 }));
    bh.position.y = 0.22; buddy.add(bh);
    var legs = [];
    for (var side = -1; side <= 1; side += 2) {
      var l = new T.Mesh(new T.BoxGeometry(0.05, 0.14, 0.05), new T.MeshLambertMaterial({ color: 0xffe0b0 }));
      l.position.set(side * 0.07, -0.22, 0); buddy.add(l); legs.push(l);
    }
    buddy.position.set(0.85, -0.05, 0.9); scene.add(buddy);

    var SCENES = [
      { who: "Pip", say: "Stars look shy.", ch: [["Wave hello", { friend: "Pip" }], ["Sing a song", { song: true }]] },
      { who: "Moon Fox", say: "I lost my glow.", ch: [["Share lamp", { helpedMoon: true }], ["Draw a map", {}]] },
      { who: "Pip", say: "Fox waits still.", ch: [["Fly on", {}], ["Leave snack", {}]] },
      { who: "Water Bee", say: "Planet is thirsty.", ch: [["Pour rain", { water: true }], ["Plant first", {}]] },
      { who: "Pip", say: "A twist! Dust storm.", ch: [["Hold tight", {}], ["Sing louder", { song: true }]] },
      { who: "Dust Whale", say: "Who helped Fox?", ch: [["We did!", {}], ["Ask Pip", {}]] },
      { who: "Pip", say: "World waits below.", ch: [["Land soft", {}], ["Circle twice", {}]] },
      { who: "Star Kid", say: "Need a helper.", ch: [["Take Pip", { friend: "Pip" }], ["Take Fox", { friend: "Fox" }]] },
      { who: "Pip", say: "Almost home star.", ch: [["Decorate ship", {}], ["Save a wish", {}]] },
      { who: "Home", say: "Cozy dock. Hug?", ch: [["Hug everyone", {}], ["Wave and rest", {}]] },
      { who: "Pip", say: "The end. Warm.", ch: [["Play again", { end: true }]] }
    ];

    function show() {
      var s = SCENES[Math.min(si, SCENES.length - 1)];
      if (si === 2) s.say = flags.helpedMoon ? "Fox smiles now." : "Fox still hunts.";
      if (si === 6) s.say = flags.water ? "Green world grows." : "Dry world waits.";
      document.getElementById("who").textContent = s.who;
      document.getElementById("say").textContent = s.say;
      document.getElementById("info").textContent = "Beat " + (si + 1) + "/11";
      var box = document.getElementById("chs"); box.innerHTML = "";
      s.ch.forEach(function (pair) {
        var b = document.createElement("button"); b.textContent = pair[0];
        b.onclick = function () {
          Object.assign(flags, pair[1]);
          if (pair[1].end) {
            document.getElementById("wp").textContent = "You flew with " + (flags.friend || "Pip") + (flags.helpedMoon ? " and helped Fox." : ".");
            document.getElementById("win").classList.remove("off");
            si = 0;
          } else si++;
          camTarget = Math.min(si, planets.length - 1);
          try { localStorage.setItem("alabryuu-space", JSON.stringify({ scene: si, flags: flags })); } catch (e) {}
          if (!pair[1].end) show();
        };
        box.appendChild(b);
      });
    }
    document.getElementById("go").onclick = function () { document.getElementById("title").classList.add("off"); };
    document.getElementById("again").onclick = function () { document.getElementById("win").classList.add("off"); si = 0; show(); };
    show();

    var clock = new T.Clock();
    function loop() {
      requestAnimationFrame(loop);
      t = clock.getElapsedTime();
      planets.forEach(function (pl, i) { pl.rotation.y = t * 0.15 + i; });
      legs.forEach(function (l, i) { l.rotation.x = Math.sin(t * 6 + i * 3) * 0.5; });
      buddy.position.y = -0.05 + Math.sin(t * 3) * 0.03;
      var dest = planets[camTarget];
      camera.position.lerp(new T.Vector3(0, 0.55, 2.5), 0.04);
      camera.lookAt(dest.position.x * 0.15, dest.position.y * 0.1, -6);
      dash.rotation.z = Math.sin(t * 0.7) * 0.02;
      renderer.render(scene, camera);
    }
    addEventListener("resize", function () {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    loop();
  })();
  </script>
</body>
</html>
