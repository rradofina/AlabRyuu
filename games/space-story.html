<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Space Story</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#0b1026}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="pl">🪐 0/5</b><b id="st">⭐ 0</b></div>
  <div id="say">Tap to boost. Catch 5 planets!</div>
  <div class="cover" id="title">
    <div class="hero">🚀</div>
    <h1>Space Story</h1>
    <p>Boost the rocket. Catch planets!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🌌</div>
    <h1>Home among stars</h1>
    <p id="wp">Five planet friends!</p>
    <button class="play g" id="again">Fly again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, got = 0, stars = 0;
    var rocket = { y: 0.72, vy: 0 }, planets = [], flags = {};
    var KINDS = ["🪐", "🌕", "🌍", "🟠", "🟣"];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-space") || "{}"); } catch (e) { sv = {}; }
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function hud() {
      document.getElementById("pl").textContent = "🪐 " + got + "/5";
      document.getElementById("st").textContent = "⭐ " + stars;
    }
    function spawn() {
      planets = [];
      for (var i = 0; i < 5; i++) {
        planets.push({ k: KINDS[i], x: 0.18 + i * 0.16, y: -0.15 - i * 0.28, got: 0 });
      }
    }
    function start() {
      play = true; got = 0; rocket.y = 0.72; rocket.vy = 0; flags = {};
      spawn();
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("say").textContent = "Tap to boost!";
      hud();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    function boost() {
      if (!play) return;
      rocket.vy = -0.55;
      document.getElementById("say").textContent = "Zoom!";
    }
    cv.addEventListener("pointerdown", boost);
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      x.fillStyle = "#0b1026"; x.fillRect(0, 0, W, H);
      var i;
      for (i = 0; i < 20; i++) em("✨", (i * 67) % W, (i * 53 + t * 20) % H, 16);
      if (play) {
        rocket.vy += 0.9 * dt;
        rocket.y += rocket.vy * dt;
        if (rocket.y > 0.78) { rocket.y = 0.78; rocket.vy = 0; }
        if (rocket.y < 0.18) { rocket.y = 0.18; rocket.vy = 0.1; }
        planets.forEach(function (p) {
          if (p.got) return;
          p.y += 0.18 * dt;
          var px = p.x * W, py = p.y * H;
          var dx = px - W * 0.5, dy = py - rocket.y * H;
          if (dx * dx + dy * dy < 70 * 70) {
            p.got = 1; got++; stars++; flags[p.k] = 1;
            try { localStorage.setItem("alabryuu-space", JSON.stringify({ scene: got, flags: flags })); } catch (e) {}
            hud();
            document.getElementById("say").textContent = "Hi " + p.k + "!";
            if (got >= 5) {
              play = false;
              document.getElementById("wp").textContent = "⭐ " + stars + "  Five planet friends!";
              document.getElementById("win").classList.remove("off");
            }
          }
          if (p.y > 1.1) p.y = -0.2;
        });
      }
      planets.forEach(function (p) { if (!p.got) em(p.k, p.x * W, p.y * H, 64); });
      em("🚀", W * 0.5, rocket.y * H, 88);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    hud();
  })();
  </script>
</body>
</html>
