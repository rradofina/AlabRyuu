<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Train Tracks</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#7f1d1d;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;background:linear-gradient(#fecaca,#fde047);padding:56px 12px 24px;text-align:center}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    h1{font-size:clamp(26px,7vw,40px)}
    .msg{font-weight:800;margin:8px}
    .board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(340px,92vw);margin:12px auto}
    .cell{aspect-ratio:1;border-radius:12px;background:#fff;font-size:28px;font-weight:800;box-shadow:0 5px 0 #b45309}
    .cell.fix{background:#fde68a}
    .go{background:#ffd166;color:#3b2100;font-weight:800;font-size:22px;padding:12px 24px;border-radius:999px;box-shadow:0 6px 0 #e09f1f}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(50,10,10,.84);z-index:8;gap:12px;color:#fff}
    .win.on{display:flex}
    .play{background:#ffd166;color:#3b2100;font-weight:800;font-size:26px;padding:14px 28px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <h1>Train Tracks</h1>
  <p class="msg" id="msg">Tap pieces to turn them. Then Go!</p>
  <div class="board" id="board"></div>
  <button class="go" id="go">Go train!</button>
  <div class="win" id="win">
    <div style="font-size:72px">🚂</div>
    <h2>All aboard!</h2>
    <button class="play" id="again">Lay again</button>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var pieces=["═","║","╚","╔","╗","╝"];
    var open={
      "═":["L","R"],"║":["U","D"],
      "╚":["U","R"],"╔":["D","R"],"╗":["D","L"],"╝":["U","L"]
    };
    var mid=1,cells=[],board=document.getElementById("board");
    for(var r=0;r<3;r++){
      for(var c=0;c<5;c++){
        (function(r,c){
          var b=document.createElement("button");b.className="cell";
          var fix=(c===0&&r===mid)||(c===4&&r===mid);
          if(c===0&&r===mid){b.textContent="🚂";b.classList.add("fix");}
          else if(c===4&&r===mid){b.textContent="🏠";b.classList.add("fix");}
          else{b.textContent=pieces[Math.floor(Math.random()*pieces.length)];b.onclick=function(){var i=pieces.indexOf(b.textContent);b.textContent=pieces[(i+1)%pieces.length];beep(420,.05);};}
          board.appendChild(b);cells.push({el:b,r:r,c:c,fix:fix});
        })(r,c);
      }
    }
    function pieceAt(r,c){
      if(c===0&&r===mid)return "═";
      if(c===4&&r===mid)return "═";
      var cell=cells[r*5+c];return cell.el.textContent;
    }
    document.getElementById("go").onclick=function(){
      var r=mid,c=0,from="L",seen={};
      for(var step=0;step<20;step++){
        var key=r+","+c;if(seen[key])break;seen[key]=1;
        if(c===4&&r===mid){document.getElementById("win").classList.add("on");beep(920,.2);return;}
        var p=pieceAt(r,c),ways=open[p]||[];
        var next=ways.filter(function(w){return w!==from;})[0];
        if(!next)break;
        if(next==="R"){c++;from="L";}
        else if(next==="L"){c--;from="R";}
        else if(next==="U"){r--;from="D";}
        else if(next==="D"){r++;from="U";}
        if(r<0||r>2||c<0||c>4)break;
        var np=pieceAt(r,c),need=open[np]||[];
        if(need.indexOf(from)<0)break;
      }
      document.getElementById("msg").textContent="The train got stuck. Turn more tracks!";beep(180,.1);
    };
    document.getElementById("again").onclick=function(){location.reload();};
  </script>
</body>
</html>
