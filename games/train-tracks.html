<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Train Tracks</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>html,body{background:#334155}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="pc">🛤️ 0/3</b></div>
  <div id="say">Tap empty spots. Lay 3 tracks!</div>
  <div class="dock" id="dock">
    <button id="goTrain"><span>🚂</span>Go</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🛤️</div>
    <h1>Train Tracks</h1>
    <p>Fill the gaps. Then send the train!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🚂</div>
    <h1>Choo choo!</h1>
    <p>The train made it home.</p>
    <button class="play g" id="again">Build again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, laid = 0, riding = 0, train = 0, stars = 0;
    var slots = [];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-train") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; laid = 0; riding = 0; train = 0;
      slots = [
        { x: 0.22, y: 0.48, on: 1, lock: 1 },
        { x: 0.40, y: 0.48, on: 0, lock: 0 },
        { x: 0.58, y: 0.48, on: 0, lock: 0 },
        { x: 0.76, y: 0.48, on: 0, lock: 0 },
        { x: 0.90, y: 0.48, on: 1, lock: 1 }
      ];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      document.getElementById("pc").textContent = "🛤️ 0/3";
      document.getElementById("say").textContent = "Tap the empty spots!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("goTrain").onclick = function () {
      if (!play) return;
      if (laid < 3) { document.getElementById("say").textContent = "Lay all 3 tracks first!"; return; }
      riding = 1; train = 0;
      document.getElementById("say").textContent = "Choo choo!";
    };
    cv.addEventListener("pointerdown", function (e) {
      if (!play || riding) return;
      slots.forEach(function (s) {
        if (s.lock || s.on) return;
        var dx = e.clientX - s.x * W, dy = e.clientY - s.y * H;
        if (dx * dx + dy * dy < 50 * 50) {
          s.on = 1; laid++;
          document.getElementById("pc").textContent = "🛤️ " + laid + "/3";
          document.getElementById("say").textContent = laid >= 3 ? "Tap Go!" : "Nice track!";
        }
      });
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#64748b"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#4ade80"; x.fillRect(0, H * 0.62, W, H);
      em("🏠", W * 0.90, H * 0.36, 64);
      slots.forEach(function (s) { em(s.on ? "🛤️" : "⬛", s.x * W, s.y * H, 56); });
      if (riding) {
        train += 0.012;
        var i = Math.min(4, Math.floor(train * 5));
        em("🚂", slots[i].x * W, slots[i].y * H - 40, 64);
        if (train >= 1) {
          riding = 0; play = false; stars++;
          try { localStorage.setItem("alabryuu-train", JSON.stringify({ stars: stars })); } catch (e) {}
          document.getElementById("dock").classList.remove("on");
          document.getElementById("win").classList.remove("off");
        }
      } else em("🚂", slots[0].x * W, slots[0].y * H - 40, 64);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
