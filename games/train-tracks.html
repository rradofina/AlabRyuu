<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Train Tracks</title>
  <script src="../vendor/three.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:Georgia,serif;background:#3f2a14;color:#fff7ed;touch-action:none;user-select:none}
    button{background:transparent;border:0;appearance:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .home{position:fixed;top:12px;left:12px;z-index:8;color:#431407;text-decoration:none;font-family:Trebuchet MS,sans-serif;font-weight:800;font-size:16px;background:#fde68a;padding:8px 14px;border-radius:4px;border:3px solid #b45309}
    .ticket{position:fixed;top:10px;right:10px;z-index:8;width:118px;background:#fef3c7;color:#7c2d12;border:4px dashed #b45309;padding:8px 10px;text-align:center;font-family:Trebuchet MS,sans-serif;font-weight:800;box-shadow:0 6px 0 #431407;pointer-events:none}
    .ticket small{display:block;font-size:11px;letter-spacing:1px}
    .ticket b{display:block;font-size:16px;margin-top:4px}
    #say{position:fixed;left:10px;right:10px;top:56px;text-align:center;font-weight:800;text-shadow:0 2px 0 #7c2d12;z-index:8;pointer-events:none}
    #dock{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none;gap:6px;padding:10px;background:#78350f;flex-wrap:wrap;justify-content:center}
    #dock.on{display:flex}
    #dock button{min-width:56px;height:56px;border-radius:14px;background:#fed7aa;color:#431407;font-weight:800;font-size:20px;box-shadow:0 5px 0 #431407}
    #dock button.on{background:#fde047}
    #goBtn{background:#86efac!important;min-width:86px!important}
    .cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;background:linear-gradient(#ca8a04,#7c2d12)}
    .cover.off{display:none}
    h1{font-size:clamp(32px,8vw,50px)}
    .btn{background:#ffd166;color:#3b2100;font-weight:800;font-size:24px;padding:14px 26px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div class="ticket"><small>YARD</small><b id="mp">Short run</b><b id="cg">Cargo 0</b><b id="st">Stars 0</b></div>
  <div id="say">Snap tracks. Then the train runs!</div>
  <div id="dock">
    <button data-p="H" class="on">═</button>
    <button data-p="V">║</button>
    <button data-p="NE">╚</button>
    <button data-p="NW">╝</button>
    <button data-p="SE">╔</button>
    <button data-p="SW">╗</button>
    <button id="goBtn">Choo!</button>
  </div>
  <div class="cover" id="title">
    <h1>Train Tracks</h1>
    <p>3D rails that snap.<br>Wheels turn. Steam puffs.</p>
    <button class="btn" id="play">Build</button>
  </div>
  <div class="cover off" id="win">
    <h1>All aboard!</h1>
    <p id="wp">The train ran your path.</p>
    <button class="btn" id="again">Build again</button>
  </div>
  <script>
  (function () {
    if (!window.THREE) return;
    var T = THREE, play = false, running = false, mapI = 0, stars = 0, cargo = 0, piece = "H", t = 0;
    var MAPS = [
      { n: "Short run", w: 5, h: 4, start: [0, 2], goal: [4, 2], need: 2, verb: "straight" },
      { n: "Hill loop", w: 5, h: 4, start: [0, 1], goal: [4, 3], need: 3, verb: "turn" },
      { n: "River hop", w: 6, h: 4, start: [0, 0], goal: [5, 3], need: 3, verb: "bridge" },
      { n: "Night yard", w: 6, h: 5, start: [0, 2], goal: [5, 2], need: 4, verb: "lights" },
      { n: "Home station", w: 6, h: 5, start: [0, 4], goal: [5, 0], need: 4, verb: "home" }
    ];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-train") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}

    var scene = new T.Scene();
    scene.background = new T.Color(0x86efac);
    scene.fog = new T.Fog(0x86efac, 18, 40);
    var cam = new T.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 80);
    cam.position.set(6, 11, 10);
    var renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    document.body.appendChild(renderer.domElement);
    scene.add(new T.HemisphereLight(0xffffff, 0x7c2d12, 0.85));
    var sun = new T.DirectionalLight(0xfff1c1, 0.8); sun.position.set(6, 12, 4); scene.add(sun);

    var ground = new T.Mesh(new T.PlaneGeometry(40, 40), new T.MeshLambertMaterial({ color: 0x4d7c0f }));
    ground.rotation.x = -Math.PI / 2; scene.add(ground);
    var gridG = new T.Group(); scene.add(gridG);
    var tiles = {};
    var boxes = [];
    var cell = 1.6;

    function key(x, y) { return x + "," + y; }
    function worldPos(x, y) {
      var m = MAPS[mapI];
      return new T.Vector3((x - (m.w - 1) / 2) * cell, 0.05, (y - (m.h - 1) / 2) * cell);
    }

    function makeRail(kind) {
      var g = new T.Group();
      var tieM = new T.MeshLambertMaterial({ color: 0x7c2d12 });
      var railM = new T.MeshLambertMaterial({ color: 0x78716c });
      var curve = kind !== "H" && kind !== "V";
      for (var i = 0; i < 4; i++) {
        var tie = new T.Mesh(new T.BoxGeometry(1.15, 0.08, 0.16), tieM);
        if (curve) {
          var a = (i / 3) * Math.PI / 2;
          tie.position.set(Math.sin(a) * 0.45, 0.04, Math.cos(a) * 0.45 - 0.2);
          tie.rotation.y = a;
        } else tie.position.set(0, 0.04, -0.5 + i * 0.35);
        g.add(tie);
      }
      if (curve) {
        var arc = new T.Mesh(new T.TorusGeometry(0.55, 0.045, 6, 10, Math.PI / 2), railM);
        arc.rotation.x = Math.PI / 2; arc.position.set(0.28, 0.1, -0.28); g.add(arc);
        var arc2 = new T.Mesh(new T.TorusGeometry(0.28, 0.045, 6, 10, Math.PI / 2), railM);
        arc2.rotation.x = Math.PI / 2; arc2.position.set(0.14, 0.1, -0.14); g.add(arc2);
        if (kind === "NE") g.rotation.y = 0;
        if (kind === "NW") g.rotation.y = Math.PI / 2;
        if (kind === "SE") g.rotation.y = -Math.PI / 2;
        if (kind === "SW") g.rotation.y = Math.PI;
      } else {
        var r1 = new T.Mesh(new T.BoxGeometry(0.08, 0.08, 1.5), railM);
        r1.position.set(-0.28, 0.1, 0); g.add(r1);
        var r2 = r1.clone(); r2.position.x = 0.28; g.add(r2);
        if (kind === "V") g.rotation.y = Math.PI / 2;
      }
      return g;
    }
    function makeCargo(kind) {
      var g = new T.Group();
      if (kind === 0) {
        for (var i = 0; i < 5; i++) {
          var n = new T.Mesh(new T.SphereGeometry(0.12, 7, 6), new T.MeshLambertMaterial({ color: i % 2 ? 0x44403c : 0x1c1917 }));
          n.position.set((i % 3 - 1) * 0.1, 0.12 + (i % 2) * 0.08, (Math.floor(i / 3) - 0.3) * 0.1);
          g.add(n);
        }
      } else if (kind === 1) {
        var bar = new T.Mesh(new T.CylinderGeometry(0.14, 0.14, 0.28, 10), new T.MeshLambertMaterial({ color: 0xb45309 }));
        bar.position.y = 0.16; g.add(bar);
        var lid = new T.Mesh(new T.CylinderGeometry(0.15, 0.15, 0.04, 10), new T.MeshLambertMaterial({ color: 0xfde68a }));
        lid.position.y = 0.32; g.add(lid);
      } else {
        var sack = new T.Mesh(new T.SphereGeometry(0.16, 8, 6), new T.MeshLambertMaterial({ color: 0xca8a04 }));
        sack.scale.set(1, 0.85, 1); sack.position.y = 0.16; g.add(sack);
        var top = new T.Mesh(new T.ConeGeometry(0.06, 0.1, 6), new T.MeshLambertMaterial({ color: 0x92400e }));
        top.position.y = 0.32; g.add(top);
      }
      return g;
    }
    function makeStation(gold) {
      var g = new T.Group();
      var house = new T.Mesh(new T.CylinderGeometry(0.28, 0.32, 0.4, 8), new T.MeshLambertMaterial({ color: gold ? 0xf59e0b : 0x22c55e }));
      house.position.y = 0.28; g.add(house);
      var roof = new T.Mesh(new T.ConeGeometry(0.38, 0.28, 8), new T.MeshLambertMaterial({ color: gold ? 0xfde047 : 0x166534 }));
      roof.position.y = 0.58; g.add(roof);
      return g;
    }

    function rebuildGrid() {
      while (gridG.children.length) gridG.remove(gridG.children[0]);
      tiles = {}; boxes = [];
      var m = MAPS[mapI];
      for (var y = 0; y < m.h; y++) {
        for (var x = 0; x < m.w; x++) {
          var pad = new T.Mesh(new T.BoxGeometry(1.45, 0.06, 1.45), new T.MeshLambertMaterial({ color: 0x65a30d }));
          var p = worldPos(x, y); pad.position.copy(p);
          pad.userData = { gx: x, gy: y };
          gridG.add(pad);
        }
      }
      var start = makeStation(false);
      start.position.copy(worldPos(m.start[0], m.start[1])); gridG.add(start);
      var goal = makeStation(true);
      goal.position.copy(worldPos(m.goal[0], m.goal[1])); gridG.add(goal);
      for (var i = 0; i < m.need; i++) {
        var box = makeCargo(i % 3);
        var gx = 1 + (i % (m.w - 2)), gy = (i + 1) % m.h;
        box.position.copy(worldPos(gx, gy)); box.position.y = 0.12;
        box.userData = { gx: gx, gy: gy, got: 0 };
        scene.add(box); boxes.push(box);
      }
      placePiece(m.start[0], m.start[1], "H");
      document.getElementById("mp").textContent = m.n;
      document.getElementById("cg").textContent = "Cargo 0/" + m.need;
      document.getElementById("st").textContent = "Stars " + stars;
      document.getElementById("say").textContent = ["Lay a straight!", "Add a turn!", "Bridge the gap!", "Night lights on!", "Home station!"][mapI];
      cam.position.set(m.w * 0.7, 9 + m.h * 0.3, 8);
      cam.lookAt(0, 0, 0);
    }

    function placePiece(x, y, kind) {
      var k = key(x, y);
      if (tiles[k] && tiles[k].mesh) gridG.remove(tiles[k].mesh);
      var mesh = makeRail(kind);
      var p = worldPos(x, y); mesh.position.copy(p); mesh.position.y = 0.08;
      gridG.add(mesh);
      tiles[k] = { kind: kind, mesh: mesh, x: x, y: y };
    }

    var train = new T.Group();
    var boiler = new T.Mesh(new T.CylinderGeometry(0.22, 0.22, 0.98, 12), new T.MeshLambertMaterial({ color: 0xdc2626 }));
    boiler.rotation.x = Math.PI / 2; boiler.position.set(0, 0.44, 0.14); train.add(boiler);
    var band = new T.Mesh(new T.TorusGeometry(0.23, 0.028, 6, 14), new T.MeshLambertMaterial({ color: 0xfde047 }));
    band.position.set(0, 0.44, 0.14); train.add(band);
    var cab = new T.Mesh(new T.BoxGeometry(0.5, 0.44, 0.42), new T.MeshLambertMaterial({ color: 0x1d4ed8 }));
    cab.position.set(0, 0.54, -0.5); train.add(cab);
    var roof = new T.Mesh(new T.BoxGeometry(0.56, 0.06, 0.48), new T.MeshLambertMaterial({ color: 0x1e3a8a }));
    roof.position.set(0, 0.78, -0.5); train.add(roof);
    for (var s = -1; s <= 1; s += 2) {
      var win = new T.Mesh(new T.BoxGeometry(0.02, 0.16, 0.16), new T.MeshLambertMaterial({ color: 0x7dd3fc }));
      win.position.set(s * 0.26, 0.6, -0.5); train.add(win);
    }
    var winF = new T.Mesh(new T.BoxGeometry(0.22, 0.16, 0.02), new T.MeshLambertMaterial({ color: 0x7dd3fc }));
    winF.position.set(0, 0.6, -0.28); train.add(winF);
    var stack = new T.Mesh(new T.CylinderGeometry(0.07, 0.1, 0.34, 8), new T.MeshLambertMaterial({ color: 0x1c1917 }));
    stack.position.set(0, 0.76, 0.4); train.add(stack);
    var lip = new T.Mesh(new T.CylinderGeometry(0.13, 0.1, 0.07, 8), new T.MeshLambertMaterial({ color: 0x44403c }));
    lip.position.set(0, 0.95, 0.4); train.add(lip);
    var dome = new T.Mesh(new T.SphereGeometry(0.1, 8, 6), new T.MeshLambertMaterial({ color: 0xf59e0b }));
    dome.position.set(0, 0.68, 0.06); train.add(dome);
    var lamp = new T.Mesh(new T.SphereGeometry(0.07, 8, 6), new T.MeshBasicMaterial({ color: 0xfde047 }));
    lamp.position.set(0, 0.44, 0.66); train.add(lamp);
    var cow = new T.Mesh(new T.ConeGeometry(0.26, 0.34, 4), new T.MeshLambertMaterial({ color: 0xa8a29e }));
    cow.rotation.x = Math.PI / 2; cow.position.set(0, 0.16, 0.66); train.add(cow);
    var tender = new T.Mesh(new T.BoxGeometry(0.44, 0.28, 0.4), new T.MeshLambertMaterial({ color: 0x44403c }));
    tender.position.set(0, 0.32, -0.98); train.add(tender);
    var wheels = [];
    [[0.26, 0.34, 0.16], [0.26, -0.08, 0.16], [-0.26, 0.34, 0.16], [-0.26, -0.08, 0.16], [0.26, -0.5, 0.12], [-0.26, -0.5, 0.12]].forEach(function (p) {
      var hub = new T.Group();
      hub.position.set(p[0], p[2], p[1]);
      var tire = new T.Mesh(new T.TorusGeometry(p[2] * 0.92, 0.035, 6, 10), new T.MeshLambertMaterial({ color: 0x1c1917 }));
      tire.rotation.y = Math.PI / 2; hub.add(tire);
      var cap = new T.Mesh(new T.CylinderGeometry(0.04, 0.04, 0.06, 8), new T.MeshLambertMaterial({ color: 0xfde047 }));
      cap.rotation.z = Math.PI / 2; hub.add(cap);
      train.add(hub); wheels.push(hub);
    });
    var steam = [];
    for (var si = 0; si < 8; si++) {
      var puff = new T.Mesh(new T.SphereGeometry(0.08, 6, 6), new T.MeshLambertMaterial({ color: 0xf8fafc, transparent: true, opacity: 0.5 }));
      puff.position.set(0, 0.98, 0.4); train.add(puff); steam.push(puff);
    }
    scene.add(train);
    var path = [];
    var pathI = 0;

    function outs(kind) {
      if (kind === "H") return [[1, 0], [-1, 0]];
      if (kind === "V") return [[0, 1], [0, -1]];
      if (kind === "NE") return [[1, 0], [0, -1]];
      if (kind === "NW") return [[-1, 0], [0, -1]];
      if (kind === "SE") return [[1, 0], [0, 1]];
      return [[-1, 0], [0, 1]];
    }
    function buildPath() {
      var m = MAPS[mapI];
      path = [];
      var x = m.start[0], y = m.start[1], px = -1, py = y;
      for (var step = 0; step < 40; step++) {
        path.push(worldPos(x, y));
        if (x === m.goal[0] && y === m.goal[1] && step > 0) return true;
        var tile = tiles[key(x, y)];
        if (!tile) return false;
        var nexts = outs(tile.kind);
        var nx = x, ny = y, ok = false;
        for (var i = 0; i < nexts.length; i++) {
          var cx = x + nexts[i][0], cy = y + nexts[i][1];
          if (cx === px && cy === py) continue;
          nx = cx; ny = cy; ok = true; break;
        }
        if (!ok) return false;
        px = x; py = y; x = nx; y = ny;
      }
      return false;
    }

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f; g.gain.value = 0.09; o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }

    var ray = new T.Raycaster(), mouse = new T.Vector2();
    renderer.domElement.addEventListener("pointerdown", function (ev) {
      if (!play || running) return;
      mouse.x = (ev.clientX / innerWidth) * 2 - 1;
      mouse.y = -(ev.clientY / innerHeight) * 2 + 1;
      ray.setFromCamera(mouse, cam);
      var hits = ray.intersectObjects(gridG.children, false);
      if (!hits.length) return;
      var u = hits[0].object.userData;
      if (u.gx == null) return;
      placePiece(u.gx, u.gy, piece);
      beep(500, 0.05);
    });

    [].forEach.call(document.querySelectorAll("#dock button[data-p]"), function (b) {
      b.onclick = function () {
        piece = b.getAttribute("data-p");
        [].forEach.call(document.querySelectorAll("#dock button[data-p]"), function (x) { x.classList.toggle("on", x === b); });
      };
    });
    document.getElementById("goBtn").onclick = function () {
      if (!play) return;
      if (buildPath()) { running = true; pathI = 0; cargo = 0; beep(280, 0.15); }
      else { document.getElementById("say").textContent = "Snap to the gold!"; beep(180, 0.1); }
    };

    function start() {
      play = true; running = false; mapI = 0; cargo = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      rebuildGrid();
    }
    document.getElementById("play").onclick = start;
    document.getElementById("again").onclick = start;

    var clock = new T.Clock();
    function tick() {
      var dt = Math.min(0.033, clock.getDelta());
      t += dt;
      wheels.forEach(function (w) { if (running) w.rotation.x += dt * 8; });
      steam.forEach(function (p, i) {
        p.position.y = 0.98 + ((t * 0.6 + i * 0.12) % 0.8);
        p.material.opacity = running ? 0.45 : 0.12;
        p.scale.setScalar(0.6 + ((t + i) % 1));
      });
      if (running && path.length) {
        pathI += dt * 2.2;
        var i0 = Math.min(path.length - 2, Math.floor(pathI));
        var k = pathI - i0;
        var a = path[i0], b = path[i0 + 1];
        train.position.lerpVectors(a, b, k); train.position.y = 0.12;
        train.lookAt(b.x, 0.12, b.z);
        boxes.forEach(function (box) {
          if (!box.userData.got && train.position.distanceTo(box.position) < 0.8) {
            box.userData.got = 1; box.visible = false; cargo++; stars++;
            document.getElementById("cg").textContent = "Cargo " + cargo + "/" + MAPS[mapI].need;
            document.getElementById("st").textContent = "Stars " + stars;
            try { localStorage.setItem("alabryuu-train", JSON.stringify({ stars: stars })); } catch (e) {}
            beep(720, 0.07);
          }
        });
        if (pathI >= path.length - 1) {
          running = false;
          mapI++;
          if (mapI >= MAPS.length) {
            play = false;
            document.getElementById("dock").classList.remove("on");
            document.getElementById("wp").textContent = "⭐ " + stars + "  Wheels never stopped.";
            document.getElementById("win").classList.remove("off");
          } else rebuildGrid();
        }
      } else {
        var m = MAPS[mapI];
        train.position.copy(worldPos(m.start[0], m.start[1])); train.position.y = 0.12;
      }
      cam.position.x = 6 + Math.sin(t * 0.2) * 0.3;
      cam.lookAt(train.position.x, 0, train.position.z);
      renderer.render(scene, cam);
      requestAnimationFrame(tick);
    }
    addEventListener("resize", function () {
      cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    rebuildGrid();
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
