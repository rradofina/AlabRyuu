<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Fishing Bob</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#7dd3fc}</style>
</head>
<body>
<script>
kidChrome({
  title: "Fishing Bob",
  hero: "🎣",
  blurb: "Tap when the bobber is red!",
  say: "Tap the red bobber!",
  hud: "🐟 0/5",
  winHero: "🐠",
  winTitle: "Nice casts!",
  winText: "Five fish said hi.",
  again: "Fish again",
  bg: "#7dd3fc"
});
(function () {
  var S = kidStage();
  var play = false, n = 0, phase = "dip", timer = 0, splash = 0, said = "";
  var FISH = ["🐟", "🐠", "🐡", "🐟", "🐠"];
  function note(k, m) { if (said === k) return; said = k; kidSay(m); }
  function start() {
    play = true; n = 0; phase = "dip"; timer = 0; splash = 0; said = "";
    kidBegin("TAP! It dipped!", "🐟 0/5");
  }
  kidBind(start);
  S.cv.addEventListener("pointerdown", function (e) {
    if (!play) return;
    var p = kidPt(e, S.cv);
    if (phase === "dip") {
      phase = "wait"; timer = 0.45; splash = 0.8; said = "";
      n++;
      kidTap(FISH[(n - 1) % FISH.length], "Hi fish!  " + n + "/5", p.x, S.H * 0.5, 580);
      if (kidMark(n, 5, "🐟")) { play = false; kidFinish("Five fish said hi."); }
    } else kidMiss("🎣", "Wait for the dip!", S.W * 0.5, S.H * 0.48);
  });
  kidTick(function (dt) {
    if (splash > 0) splash -= dt;
    if (play) {
      if (phase === "wait") {
        timer -= dt;
        if (timer <= 0) { phase = "dip"; note("dip", "TAP! It dipped!"); }
        else note("wait", "Watch...");
      } else note("dip", "TAP!");
    }
    S.bg("#bae6fd");
    S.ctx.fillStyle = "#0284c7";
    S.ctx.fillRect(0, S.H * 0.5, S.W, S.H);
    S.em("🎣", S.W * 0.28, S.H * 0.32, 100);
    var bobY = S.H * (phase === "dip" ? 0.62 : 0.52);
    S.ctx.strokeStyle = "#fff"; S.ctx.lineWidth = 3;
    S.ctx.beginPath(); S.ctx.moveTo(S.W * 0.36, S.H * 0.28); S.ctx.lineTo(S.W * 0.55, bobY); S.ctx.stroke();
    S.em(phase === "dip" ? "🔴" : "🟠", S.W * 0.55, bobY, phase === "dip" ? 72 : 56);
    if (splash > 0) S.em(FISH[Math.max(0, n - 1) % FISH.length], S.W * 0.55, S.H * 0.42, 90);
  });
})();
</script>
</body>
</html>
