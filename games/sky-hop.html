<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sky Hop · AlabRyuu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#16324a; --sky:#7ec8ff; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; overflow:hidden; font-family:Nunito,sans-serif; background:#7ec8ff; color:#16324a; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    .hud { position:fixed; inset:0; pointer-events:none; z-index:2; }
    .top { display:flex; justify-content:space-between; padding:max(10px,env(safe-area-inset-top)) 12px 0; }
    a { pointer-events:auto; color:#16324a; font-weight:900; text-decoration:none; background:#fff8; padding:8px 12px; border-radius:999px; }
    .chip { background:#fff; padding:8px 12px; border-radius:999px; font-weight:900; }
    .tools { position:absolute; left:50%; bottom:max(12px,env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:10px; pointer-events:auto; }
    button { min-height:64px; min-width:88px; border:0; border-radius:20px; background:#ffd84d; color:#16324a; font:900 18px Nunito,sans-serif; }
    button.on { outline:4px solid #16324a; }
    .ov { position:fixed; inset:0; background:#7ec8ffee; display:grid; place-items:center; padding:20px; z-index:5; text-align:center; }
    .ov h1 { font-size:clamp(32px,8vw,56px); margin:0; }
    .ov p { font-size:22px; max-width:26ch; }
    .hidden { display:none; }
    .bubble { position:absolute; left:16px; top:22%; background:#fff; border-radius:20px; padding:12px 16px; font-weight:900; font-size:22px; max-width:16ch; box-shadow:0 8px 0 #0002; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="top"><a href="../index.html">← Hub</a><div class="chip" id="info">Cloud 1</div></div>
    <div class="bubble" id="say">Tap a cloud!</div>
    <div class="tools">
      <button id="hop">Hop</button>
      <button id="flutter">Flutter</button>
      <button id="deco">Decorate</button>
    </div>
  </div>
  <div class="ov" id="title"><div><h1>Sky Hop</h1><p>Hop the 3D clouds. Decorate them. Reach the rainbow nest.</p><button id="go">Play</button></div></div>
  <div class="ov hidden" id="win"><div><h1>Nest!</h1><p id="wp"></p><button id="again">Play again</button></div></div>
  <script src="../vendor/three.min.js"></script>
  <script>
(function () {
  const LS = "alabryuu-sky";
  const save = JSON.parse(localStorage.getItem(LS) || "{}");
  const canvas = document.getElementById("c");
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x7ec8ff, 12, 40);
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 80);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.setClearColor(0x7ec8ff, 1);
  const clock = new THREE.Clock();

  scene.add(new THREE.HemisphereLight(0xffffff, 0xffd8a8, 0.9));
  const sun = new THREE.DirectionalLight(0xfff3c8, 0.8);
  sun.position.set(6, 10, 4);
  scene.add(sun);

  const sky = new THREE.Mesh(new THREE.SphereGeometry(50, 16, 12), new THREE.MeshBasicMaterial({ color: 0x4aa8e8, side: THREE.BackSide }));
  scene.add(sky);

  function puff(x, y, z, s, c) {
    const g = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: c });
    for (let i = 0; i < 5; i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(s * (0.5 + Math.random() * 0.5), 10, 8), mat);
      m.position.set((Math.random() - 0.5) * s * 1.6, (Math.random() - 0.4) * s * 0.6, (Math.random() - 0.5) * s * 0.8);
      g.add(m);
    }
    g.position.set(x, y, z);
    scene.add(g);
    return g;
  }

  const worlds = [
    { name: "Puff lane", verb: "hop", n: 6, col: 0xffffff },
    { name: "Wind lane", verb: "flutter", n: 7, col: 0xe8f7ff },
    { name: "Candy lane", verb: "decorate", n: 7, col: 0xffd6f0 },
    { name: "Storm lane", verb: "wait", n: 8, col: 0xc8d8f0 },
    { name: "Rainbow nest", verb: "home", n: 5, col: 0xffe08a },
  ];
  let wi = Math.min(save.world || 0, 4);
  let clouds = [];
  let on = 0;
  let stars = save.stars || 0;
  let mode = "hop";
  let hopping = 0;
  let decorations = 0;

  const kid = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), new THREE.MeshLambertMaterial({ color: 0xff8a5b }));
  body.scale.set(1, 1.15, 0.8);
  kid.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), new THREE.MeshLambertMaterial({ color: 0xffe0b0 }));
  head.position.y = 0.32;
  kid.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), new THREE.MeshLambertMaterial({ color: 0x5a3a22 }));
  hair.position.set(0, 0.4, -0.02);
  kid.add(hair);
  const wings = [];
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), new THREE.MeshLambertMaterial({ color: 0xfff3a8 }));
    w.scale.set(1.4, 0.35, 0.7);
    w.position.set(s * 0.28, 0.08, -0.05);
    kid.add(w);
    wings.push(w);
  }
  const legs = [];
  for (const s of [-1, 1]) {
    const l = new THREE.Mesh(new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.04, 0.14, 4, 6) : new THREE.CylinderGeometry(0.04, 0.04, 0.18, 6), new THREE.MeshLambertMaterial({ color: 0xffe0b0 }));
    l.position.set(s * 0.08, -0.28, 0);
    kid.add(l);
    legs.push(l);
  }
  scene.add(kid);

  function build() {
    clouds.forEach((c) => scene.remove(c.g));
    clouds = [];
    const w = worlds[wi];
    for (let i = 0; i < w.n; i++) {
      const g = puff(i * 3.2, Math.sin(i) * 0.6, (i % 2) * -0.4, 0.85, w.col);
      clouds.push({ g, deco: 0 });
    }
    on = 0;
    decorations = 0;
    kid.position.copy(clouds[0].g.position).add(new THREE.Vector3(0, 0.9, 0));
    document.getElementById("info").textContent = w.name + " · ★" + stars;
    document.getElementById("say").textContent = wi === 0 ? "Tap Hop!" : wi === 1 ? "Flutter more!" : wi === 2 ? "Decorate clouds!" : wi === 3 ? "Wait the rain!" : "Home nest!";
  }
  build();

  document.getElementById("go").onclick = () => document.getElementById("title").classList.add("hidden");
  document.getElementById("again").onclick = () => { document.getElementById("win").classList.add("hidden"); wi = 0; build(); };
  document.getElementById("hop").onclick = () => { mode = "hop"; hop(); };
  document.getElementById("flutter").onclick = () => { mode = "flutter"; hopping = 0.35; };
  document.getElementById("deco").onclick = () => {
    mode = "deco";
    const c = clouds[on];
    if (!c) return;
    const flower = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), new THREE.MeshLambertMaterial({ color: 0xff6b9a }));
    flower.position.set((Math.random() - 0.5) * 0.8, 0.5, 0.2);
    c.g.add(flower);
    c.deco++;
    decorations++;
    stars++;
    persist();
  };

  function hop() {
    if (hopping > 0) return;
    if (on >= clouds.length - 1) {
      stars += 3;
      persist();
      if (wi < worlds.length - 1) { wi++; build(); }
      else {
        document.getElementById("wp").textContent = "You decorated " + decorations + " clouds!";
        document.getElementById("win").classList.remove("hidden");
      }
      return;
    }
    hopping = 0.55;
    on++;
  }
  canvas.addEventListener("pointerdown", hop);

  function persist() {
    localStorage.setItem(LS, JSON.stringify({ world: wi, stars }));
    document.getElementById("info").textContent = worlds[wi].name + " · ★" + stars;
  }

  const rain = [];
  for (let i = 0; i < 20; i++) {
    const d = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.18, 0.03), new THREE.MeshBasicMaterial({ color: 0x8ad4ff }));
    d.position.set(Math.random() * 20 - 4, 8, Math.random() * 4 - 2);
    scene.add(d);
    rain.push(d);
  }

  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    wings.forEach((w, i) => { w.rotation.z = Math.sin(t * 14 + i) * 0.55 * (i ? -1 : 1); });
    legs.forEach((l, i) => { l.rotation.x = hopping > 0 ? -0.8 : Math.sin(t * 8 + i * 3) * 0.4; });
    if (hopping > 0) {
      hopping -= dt;
      const from = clouds[Math.max(0, on - 1)].g.position;
      const to = clouds[on].g.position;
      const k = 1 - hopping / 0.55;
      kid.position.lerpVectors(from, to, k).add(new THREE.Vector3(0, 0.9 + Math.sin(k * Math.PI) * 1.4, 0));
    } else {
      kid.position.y = clouds[on].g.position.y + 0.9 + Math.sin(t * 3) * 0.06;
    }
    clouds.forEach((c, i) => { c.g.position.y += Math.sin(t * 1.4 + i) * 0.002; });
    if (wi === 3) rain.forEach((d) => { d.position.y -= 8 * dt; if (d.position.y < 0) d.position.y = 9; });
    else rain.forEach((d) => { d.position.y = 20; });
    camera.position.lerp(new THREE.Vector3(kid.position.x - 0.2, kid.position.y + 1.6, 6.2), 0.08);
    camera.lookAt(kid.position.x + 1.2, kid.position.y, 0);
    renderer.render(scene, camera);
  }
  addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); });
  loop();
})();
  </script>
</body>
</html>
