<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sky Hop</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../kid-sprites.js"></script>
  <style>html,body{background:#1d4ed8} #hud b{background:#1e3a8a}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="info">High 0 · ★0</b></div>
  <div id="say">Tap Hop!</div>
  <div class="dock" id="tools">
    <button id="hop"><span>⬆️</span>Hop</button>
    <button id="flutter"><span>🪽</span>Flutter</button>
    <button id="deco"><span>🌸</span>Pretty</button>
  </div>
  <div class="cover" id="title">
    <div class="hero"><img src="../assets/sprites/sky-hop/ryuu-hop.png" alt="" width="88" height="110" /></div>
    <h1>Sky Hop</h1>
    <p>Hop the clouds. Climb forever!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <script>
  (function () {
    var LS = "alabryuu-sky";
    var save = {};
    try { save = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) {}
    var cv = document.getElementById("c"), ctx = cv.getContext("2d");
    var W = 390, H = 700, T = 0, playing = false;
    var clouds = [], on = 0, hopCount = 0, best = save.best || 0, stars = save.stars || 0, decorations = save.decos || 0;
    var hopPhase = "idle", hopT = 0, flutterT = 0, stuck = 0;
    var hopFrom = { x: 0, y: 0 }, hopTo = { x: 0, y: 0 };
    var kid = { x: 0, y: 0 };
    var camX = 0, camY = 0;
    var cheers = ["Higher!", "Nice hop!", "Keep going!", "Up up!", "Whee!"];
    var S = kidSprites([
      "sky-hop/ryuu-hop.png",
      "sky-hop/ryuu-front.png",
      "sky-hop/cloud.png",
      "sky-hop/island.png",
      "sky-hop/star.png",
      "sky-hop/boost-rocket.png",
      "shared/star.png",
      "dino-stomp/flower.png"
    ]);
    function resize() {
      W = innerWidth; H = innerHeight;
      var d = Math.min(devicePixelRatio || 1, 2);
      cv.width = Math.floor(W * d); cv.height = Math.floor(H * d);
      cv.style.width = W + "px"; cv.style.height = H + "px";
      ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function sx(wx) { return wx - camX; }
    function sy(wy) { return H * 0.62 - (wy - camY); }
    function hud() { document.getElementById("info").textContent = "Hops " + hopCount + "  Best " + Math.max(best, hopCount); }
    function persist() {
      try { localStorage.setItem(LS, JSON.stringify({ hops: hopCount, best: best, stars: stars, decos: decorations })); } catch (e) {}
      hud();
    }
    function cloudAt(idx) {
      for (var i = 0; i < clouds.length; i++) if (clouds[i].i === idx) return clouds[i];
      return null;
    }
    function spawnCloud(i) {
      clouds.push({
        i: i, x: i * 160, y: i * 40 + Math.sin(i * 0.9) * 30,
        decos: [], star: i > 0 && i % 3 === 0 ? 1 : 0,
        kind: i % 4 === 0 ? "island" : "cloud"
      });
    }
    function ensureAhead() {
      var last = clouds.length ? clouds[clouds.length - 1].i : -1;
      for (var i = last + 1; i <= on + 10; i++) spawnCloud(i);
    }
    function recycleBehind() {
      while (clouds.length && clouds[0].i < on - 3) clouds.shift();
    }
    function snapToCloud(idx) {
      ensureAhead();
      on = Math.max(0, idx);
      hopPhase = "idle"; hopT = 0; flutterT = 0; stuck = 0;
      var c = cloudAt(on) || clouds[0];
      if (!c) return;
      kid.x = c.x; kid.y = c.y + 18;
    }
    function build() {
      clouds = []; on = 0; hopPhase = "idle";
      ensureAhead(); snapToCloud(0);
      camX = kid.x - W * 0.38; camY = kid.y - 20;
      hud();
      document.getElementById("say").textContent = "Tap Hop!";
    }
    function hop() {
      if (!playing) return;
      if (hopPhase !== "idle") {
        if (stuck > 1.6) snapToCloud(on);
        else return;
      }
      ensureAhead();
      var here = cloudAt(on), next = cloudAt(on + 1);
      if (!here || !next) { snapToCloud(on); document.getElementById("say").textContent = "Hop again!"; return; }
      hopPhase = "air"; hopT = 0; stuck = 0;
      hopFrom.x = here.x; hopFrom.y = here.y + 18;
      hopTo.x = next.x; hopTo.y = next.y + 18;
      hopCount++; if (hopCount > best) best = hopCount;
      if (hopCount % 5 === 0) stars += 1;
      persist();
      kidTap("⬆️", cheers[hopCount % cheers.length] + "  Hop " + hopCount, innerWidth * 0.5, innerHeight * 0.42, 480);
      if (hopCount % 5 === 0) kidBurst(["⭐", "✨", "💛"], innerWidth * 0.5, innerHeight * 0.28);
    }
    function collectIfStar() {
      var c = cloudAt(on);
      if (c && c.star) { c.star = 0; stars++; persist(); document.getElementById("say").textContent = "Star!"; }
    }
    document.getElementById("go").onclick = function () {
      hopCount = 0; playing = true; build();
      document.getElementById("title").classList.add("off");
      document.getElementById("tools").classList.add("on");
    };
    document.getElementById("hop").onclick = hop;
    document.getElementById("flutter").onclick = function () {
      if (!playing || hopPhase !== "idle") return;
      flutterT = 0.45;
      kidTap("🚀", "Flutter!  Hop " + hopCount, innerWidth * 0.5, innerHeight * 0.4, 620);
    };
    document.getElementById("deco").onclick = function () {
      if (!playing) return;
      var c = cloudAt(on);
      if (!c) { snapToCloud(on); return; }
      c.decos.push({ ox: (Math.random() - 0.5) * 50, oy: 8 });
      decorations++; stars++; persist();
      kidTap("🌸", "Pretty!  ★" + stars, innerWidth * 0.5, innerHeight * 0.5, 700);
    };
    cv.addEventListener("pointerdown", function () { if (playing) hop(); });
    function lerp(a, b, k) { return a + (b - a) * k; }
    var last = performance.now();
    function loop(now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
      ensureAhead();
      var pad = cloudAt(on);
      if (!pad) snapToCloud(on);
      if (hopPhase !== "idle") stuck += dt;
      if (stuck > 2) snapToCloud(on);
      if (hopPhase === "air") {
        hopT += dt;
        var k = Math.min(1, hopT / 0.55);
        var hang = Math.sin(k * Math.PI);
        kid.x = lerp(hopFrom.x, hopTo.x, k);
        kid.y = lerp(hopFrom.y, hopTo.y, k) + hang * 70;
        if (k >= 1) {
          hopPhase = "idle"; on++; ensureAhead(); recycleBehind();
          snapToCloud(on); collectIfStar();
        }
      } else if (flutterT > 0) {
        flutterT -= dt;
        kid.y = (pad ? pad.y + 18 : kid.y) + Math.sin((1 - flutterT / 0.45) * Math.PI) * 30;
      } else if (pad) {
        kid.x = pad.x;
        kid.y = pad.y + 18 + Math.sin(T * 3) * 4;
      }
      camX += (kid.x - W * 0.38 - camX) * 0.12;
      camY += (kid.y - 24 - camY) * 0.12;
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#1e3a8a"); g.addColorStop(0.45, "#2563eb"); g.addColorStop(1, "#7dd3fc");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // soft parallax stars / far clouds
      var i;
      for (i = 0; i < 8; i++) {
        var px = ((i * 97 + T * 8) % (W + 40)) - 20;
        var py = 40 + (i * 53) % (H * 0.45);
        kidDraw(ctx, S["sky-hop/star.png"], px, py, { fit: 16 + (i % 3) * 4, alpha: 0.35 + (i % 3) * 0.1, rot: T * 0.4 + i });
      }
      for (i = 0; i < clouds.length; i++) {
        var c = clouds[i], cpx = sx(c.x), cpy = sy(c.y + Math.sin(T * 1.4 + c.i) * 6);
        if (cpx < -180 || cpx > W + 180) continue;
        var plat = c.kind === "island" ? S["sky-hop/island.png"] : S["sky-hop/cloud.png"];
        var fit = c.kind === "island" ? 130 : 108;
        kidDraw(ctx, plat, cpx, cpy, { fit: fit, squashY: 1 + Math.sin(T * 2 + c.i) * 0.03 });
        for (var d = 0; d < c.decos.length; d++) {
          kidDraw(ctx, S["dino-stomp/flower.png"], cpx + c.decos[d].ox, cpy + c.decos[d].oy - 8, { fit: 28 });
        }
        if (c.star) {
          kidDraw(ctx, S["shared/star.png"], cpx + 36, cpy - 40 + Math.sin(T * 5 + c.i) * 4, {
            fit: 36, rot: Math.sin(T * 3) * 0.2, squashX: 1 + Math.sin(T * 6) * 0.06
          });
        }
      }
      var hopping = hopPhase === "air" || flutterT > 0;
      var body = hopping ? S["sky-hop/ryuu-hop.png"] : S["sky-hop/ryuu-front.png"];
      var sq = { x: 1, y: 1 };
      if (hopPhase === "air") {
        var hk = Math.min(1, hopT / 0.55);
        sq = { x: 1 - Math.sin(hk * Math.PI) * 0.08, y: 1 + Math.sin(hk * Math.PI) * 0.12 };
      } else if (flutterT > 0) {
        sq = { x: 1.05, y: 0.92 + Math.sin(flutterT * 20) * 0.06 };
      } else {
        var wob = Math.sin(T * 3);
        sq = { x: 1 + wob * 0.04, y: 1 - wob * 0.04 };
      }
      kidDraw(ctx, body, sx(kid.x), sy(kid.y) - 36, { fit: 92, squashX: sq.x, squashY: sq.y });
      if (flutterT > 0) {
        kidDraw(ctx, S["sky-hop/boost-rocket.png"], sx(kid.x) + 42, sy(kid.y) + 10, {
          fit: 40, rot: -0.4, alpha: 0.9
        });
      }
      requestAnimationFrame(loop);
    }
    build();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
