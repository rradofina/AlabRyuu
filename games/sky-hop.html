<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sky Hop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: Georgia, serif; background: #38bdf8; color: #3b1d4a; touch-action: none; user-select: none; }
    button { background: transparent; border: 0; appearance: none; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .home { position: fixed; top: 12px; left: 12px; z-index: 8; color: #fff; text-decoration: none; font-family: Trebuchet MS, sans-serif; font-weight: 800; font-size: 17px; background: rgba(36,16,56,.4); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 12px; right: 12px; z-index: 7; font-family: Trebuchet MS, sans-serif; font-weight: 800; text-align: right; pointer-events: none; }
    #hud b { display: inline-block; background: rgba(255,255,255,.85); padding: 6px 12px; border-radius: 999px; margin-left: 6px; }
    #say { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 7; font-family: Trebuchet MS, sans-serif; font-weight: 800; color: #fff; text-shadow: 0 2px 0 #0369a1; pointer-events: none; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px; background: linear-gradient(#38bdf8,#f9a8d4); }
    .cover.off { display: none; }
    h1 { font-size: clamp(36px, 10vw, 56px); color: #fff; text-shadow: 0 4px 0 #0369a1; }
    .btn { font-family: Trebuchet MS, sans-serif; background: #ffd166; color: #3b2100; font-weight: 800; font-size: 26px; padding: 14px 28px; border-radius: 999px; box-shadow: 0 7px 0 #e09f1f; }
    .btn.g { background: #86efac; box-shadow: 0 7px 0 #16a34a; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="w">Dawn</b><b id="st">⭐ 0</b></div>
  <div id="say">Tap to hop. Hold to flutter!</div>
  <div class="cover" id="title">
    <div style="font-size:80px">☁️</div>
    <h1>Sky Hop</h1>
    <p>Jump the clouds. Hold to flutter.<br>Bounce on birds!</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div style="font-size:80px">🌟</div>
    <h1>Sky hero!</h1>
    <p id="winP">Five skies hopped.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, last = 0, t = 0, play = false, hold = false, world = 0, stars = 0, cam = 0;
    var kid = { x: 80, y: 0, vy: 0, on: false, face: "🧒" };
    try { var av = JSON.parse(localStorage.getItem("alabryuu-avatar") || "null"); if (av && av.hair) kid.face = av.hair; } catch (e) {}
    var plats = [], bits = [], birds = [], gusts = [], puffs = [];
    var WORLDS = [
      { n: "Dawn", sky: ["#fda4af", "#7dd3fc"], need: 6 },
      { n: "Day", sky: ["#38bdf8", "#fde68a"], need: 7 },
      { n: "Sunset", sky: ["#fb923c", "#7c2d12"], need: 7 },
      { n: "Night", sky: ["#1e1b4b", "#312e81"], need: 8 },
      { n: "Storm", sky: ["#334155", "#0f172a"], need: 8 }
    ];
    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = "square"; o.frequency.value = f; g.gain.value = 0.09;
        o.connect(g); g.connect(ac.destination); o.start();
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
    addEventListener("resize", resize); resize();

    function makeWorld() {
      var base = H * 0.72, list = [];
      for (var i = 0; i < 14; i++) {
        list.push({ x: i * 160, y: base - (i % 3) * 70 - Math.sin(i) * 30, w: 100 + (i % 3) * 16, move: i > 6 ? 30 : 0, ph: i });
      }
      plats = list;
      bits = [];
      for (var s = 0; s < WORLDS[world].need; s++) bits.push({ x: 180 + s * 200, y: base - 120 - (s % 4) * 40, got: 0 });
      birds = [];
      for (var b = 0; b < 4; b++) birds.push({ x: 300 + b * 280, y: base - 160, vx: -40, bob: b });
      gusts = []; cam = 0;
      kid.x = 70; kid.y = plats[0].y - 44; kid.vy = 0; kid.on = true;
      document.getElementById("w").textContent = WORLDS[world].n;
    }
    function start() {
      play = true; world = 0; stars = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      makeWorld(); beep(520, 0.1);
    }

    addEventListener("pointerdown", function (e) {
      if (e.target.closest && e.target.closest("a,button")) return;
      hold = true;
      if (play && kid.on) { kid.vy = -640; kid.on = false; beep(620, 0.07); }
    });
    addEventListener("pointerup", function () { hold = false; });

    function update(dt) {
      t += dt;
      if (!play) return;
      kid.vy += (hold && !kid.on ? 420 : 1700) * dt;
      if (hold && !kid.on) { kid.vy = Math.max(kid.vy, -80); puffs.push({ x: kid.x + 10, y: kid.y + 40, life: 1 }); }
      kid.y += kid.vy * dt;
      kid.x += 140 * dt;
      kid.on = false;
      plats.forEach(function (p) {
        var py = p.y + Math.sin(t * 1.4 + p.ph) * p.move;
        if (kid.vy >= 0 && kid.x + 20 > p.x && kid.x < p.x + p.w && kid.y + 44 >= py && kid.y + 44 <= py + 22 + kid.vy * dt + 8) {
          kid.y = py - 44; kid.vy = 0; kid.on = true;
        }
      });
      birds.forEach(function (b) {
        b.x += b.vx * dt; b.bob += dt * 4;
        if (Math.hypot(kid.x - b.x, kid.y - (b.y + Math.sin(b.bob) * 10)) < 36 && kid.vy > 0) {
          kid.vy = -700; beep(800, 0.08); stars++; document.getElementById("st").textContent = "⭐ " + stars;
        }
      });
      bits.forEach(function (s) {
        if (!s.got && Math.hypot(kid.x - s.x, kid.y - s.y) < 32) {
          s.got = 1; stars++; document.getElementById("st").textContent = "⭐ " + stars; beep(900, 0.07);
        }
      });
      puffs.forEach(function (p) { p.life -= dt * 3; p.y += 20 * dt; });
      puffs = puffs.filter(function (p) { return p.life > 0; });
      cam = Math.max(0, kid.x - W * 0.28);
      if (kid.y > H + 40) { kid.x = plats[0].x + 20; kid.y = plats[0].y - 44; kid.vy = 0; }
      var lastP = plats[plats.length - 1];
      if (kid.x > lastP.x + lastP.w) {
        world++;
        if (world >= WORLDS.length) {
          play = false;
          document.getElementById("winP").textContent = "⭐ " + stars + "  Five skies!";
          document.getElementById("win").classList.remove("off");
        } else makeWorld();
      }
      if (world === 4 && Math.random() < dt * 2) gusts.push({ x: cam + W, y: 80 + Math.random() * 200, life: 1 });
      gusts.forEach(function (g) { g.x -= 200 * dt; g.life -= dt * 0.3; });
    }

    function draw() {
      var w = WORLDS[world] || WORLDS[0];
      var g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, w.sky[0]); g.addColorStop(1, w.sky[1]);
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      x.save(); x.translate(-cam * 0.3, 0);
      x.globalAlpha = 0.35; x.font = "70px serif";
      for (var i = 0; i < 10; i++) x.fillText("☁️", i * 180 + Math.sin(t + i) * 10, 80 + (i % 3) * 40);
      x.globalAlpha = 1; x.restore();
      x.save(); x.translate(-cam, 0);
      plats.forEach(function (p) {
        var py = p.y + Math.sin(t * 1.4 + p.ph) * p.move;
        x.fillStyle = "#fff";
        x.beginPath(); x.roundRect ? x.roundRect(p.x, py, p.w, 20, 10) : x.rect(p.x, py, p.w, 20); x.fill();
        x.font = "20px serif"; x.fillText("☁️", p.x + p.w / 2 - 10, py + 6);
      });
      bits.forEach(function (s) { if (!s.got) { x.font = "28px serif"; x.fillText("⭐", s.x, s.y); } });
      birds.forEach(function (b) { x.font = "32px serif"; x.fillText("🐦", b.x, b.y + Math.sin(b.bob) * 10); });
      puffs.forEach(function (p) { x.globalAlpha = p.life; x.fillStyle = "#fff"; x.beginPath(); x.arc(p.x, p.y, 6, 0, Math.PI * 2); x.fill(); });
      x.globalAlpha = 1;
      x.font = "40px serif"; x.fillText(kid.face, kid.x, kid.y + 40);
      x.restore();
      if (world === 3) {
        x.fillStyle = "#fff";
        for (var k = 0; k < 20; k++) x.fillRect((k * 73 + t * 20) % W, (k * 41) % (H * 0.5), 2, 2);
      }
    }
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now;
      update(dt); draw(); requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
  })();
  </script>
</body>
</html>
