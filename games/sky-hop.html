<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sky Hop · AlabRyuu</title>
  <style>
    :root { --ink:#16324a; --sky:#7ec8ff; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; overflow:hidden; font-family:Trebuchet MS,Comic Sans MS,sans-serif; background:#7ec8ff; color:#16324a; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    .hud { position:fixed; inset:0; pointer-events:none; z-index:2; }
    .top { display:flex; justify-content:space-between; padding:max(10px,env(safe-area-inset-top)) 12px 0; }
    a { pointer-events:auto; color:#16324a; font-weight:900; text-decoration:none; background:#fff8; padding:8px 12px; border-radius:999px; }
    .chip { background:#fff; padding:8px 12px; border-radius:999px; font-weight:900; }
    .tools { position:absolute; left:50%; bottom:max(12px,env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:10px; pointer-events:auto; }
    button { min-height:64px; min-width:88px; border:0; border-radius:20px; background:#ffd84d; color:#16324a; font:900 18px Trebuchet MS,sans-serif; }
    button.on { outline:4px solid #16324a; }
    .ov { position:fixed; inset:0; background:#7ec8ffee; display:grid; place-items:center; padding:20px; z-index:5; text-align:center; }
    .ov h1 { font-size:clamp(32px,8vw,56px); margin:0; }
    .ov p { font-size:22px; max-width:26ch; }
    .hidden { display:none; }
    .bubble { position:absolute; left:16px; top:22%; background:#fff; border-radius:20px; padding:12px 16px; font-weight:900; font-size:22px; max-width:16ch; box-shadow:0 8px 0 #0002; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="top"><a href="../index.html">← Hub</a><div class="chip" id="info">High 0</div></div>
    <div class="bubble" id="say">Tap Hop!</div>
    <div class="tools">
      <button id="hop">Hop</button>
      <button id="flutter">Flutter</button>
      <button id="deco">Decorate</button>
    </div>
  </div>
  <div class="ov" id="title"><div><h1>Sky Hop</h1><p>Hop the 3D clouds. Climb forever. Decorate as you go.</p><button id="go">Play</button></div></div>
  <script src="../vendor/three.min.js"></script>
  <script>
(function () {
  const LS = "alabryuu-sky";
  const save = JSON.parse(localStorage.getItem(LS) || "{}");
  const canvas = document.getElementById("c");
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x7ec8ff, 12, 40);
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 80);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.setClearColor(0x7ec8ff, 1);
  const clock = new THREE.Clock();

  scene.add(new THREE.HemisphereLight(0xffffff, 0xffd8a8, 0.9));
  const sun = new THREE.DirectionalLight(0xfff3c8, 0.8);
  sun.position.set(6, 10, 4);
  scene.add(sun);

  const sky = new THREE.Mesh(new THREE.SphereGeometry(50, 16, 12), new THREE.MeshBasicMaterial({ color: 0x4aa8e8, side: THREE.BackSide }));
  scene.add(sky);

  function puff(x, y, z, s, c) {
    const g = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: c });
    for (let i = 0; i < 5; i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(s * (0.5 + Math.random() * 0.5), 10, 8), mat);
      m.position.set((Math.random() - 0.5) * s * 1.6, (Math.random() - 0.4) * s * 0.6, (Math.random() - 0.5) * s * 0.8);
      g.add(m);
    }
    g.position.set(x, y, z);
    scene.add(g);
    return g;
  }

  const TINTS = [0xffffff, 0xe8f7ff, 0xffd6f0, 0xc8d8f0, 0xffe08a, 0xd1fae5];
  let clouds = [];
  let on = 0;
  let hopCount = save.hops || 0;
  let best = save.best || 0;
  let stars = save.stars || 0;
  let mode = "hop";
  let hopping = 0;
  let hopPhase = "idle";
  let hopT = 0;
  const hopFrom = new THREE.Vector3();
  const hopTo = new THREE.Vector3();
  let decorations = save.decos || 0;

  const kid = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), new THREE.MeshLambertMaterial({ color: 0xff8a5b }));
  body.scale.set(1, 1.15, 0.8);
  kid.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), new THREE.MeshLambertMaterial({ color: 0xffe0b0 }));
  head.position.y = 0.32;
  kid.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), new THREE.MeshLambertMaterial({ color: 0x5a3a22 }));
  hair.position.set(0, 0.4, -0.02);
  kid.add(hair);
  const wings = [];
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), new THREE.MeshLambertMaterial({ color: 0xfff3a8 }));
    w.scale.set(1.4, 0.35, 0.7);
    w.position.set(s * 0.28, 0.08, -0.05);
    kid.add(w);
    wings.push(w);
  }
  const hips = [];
  for (const s of [-1, 1]) {
    const hip = new THREE.Group();
    hip.position.set(s * 0.09, -0.18, 0);
    const thigh = new THREE.Mesh(new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.035, 0.12, 4, 6) : new THREE.CylinderGeometry(0.035, 0.04, 0.16, 6), new THREE.MeshLambertMaterial({ color: 0xffe0b0 }));
    thigh.position.y = -0.1;
    hip.add(thigh);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 5), new THREE.MeshLambertMaterial({ color: 0x5a3a22 }));
    foot.scale.set(1.15, 0.45, 1.45);
    foot.position.set(0, -0.2, 0.03);
    hip.add(foot);
    kid.add(hip);
    hips.push(hip);
  }
  scene.add(kid);
  const dust = [];
  function puffCloud(n) {
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 5), new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 }));
      m.position.copy(kid.position);
      m.position.y -= 0.25;
      m.userData = { vx: (Math.random() - 0.5) * 1.4, vy: 0.4 + Math.random(), vz: (Math.random() - 0.5) * 0.8, life: 0.4 };
      scene.add(m);
      dust.push(m);
    }
  }

  function hud() {
    const high = Math.max(best, hopCount);
    document.getElementById("info").textContent = "High " + high + " · ★" + stars;
  }

  function persist() {
    try {
      localStorage.setItem(LS, JSON.stringify({ hops: hopCount, best, stars, decos: decorations }));
    } catch (e) {}
    hud();
  }

  function cloudAt(idx) {
    for (let i = 0; i < clouds.length; i++) {
      if (clouds[i].i === idx) return clouds[i];
    }
    return null;
  }

  function spawnCloud(i) {
    const tint = TINTS[((i * 0.07) | 0) % TINTS.length];
    const y = Math.sin(i * 0.9) * 0.7 + i * 0.08;
    const g = puff(i * 3.2, y, (i % 2) * -0.4, 0.85, tint);
    clouds.push({ g, deco: 0, i, baseY: y });
  }

  function ensureAhead() {
    const last = clouds.length ? clouds[clouds.length - 1].i : -1;
    const need = on + 8;
    for (let i = last + 1; i <= need; i++) spawnCloud(i);
  }

  function recycleBehind() {
    while (clouds.length && clouds[0].i < on - 3) {
      const old = clouds.shift();
      scene.remove(old.g);
      old.g.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
      });
    }
  }

  function snapToCloud(idx) {
    ensureAhead();
    on = Math.max(0, idx);
    hopPhase = "idle";
    hopping = 0;
    const c = cloudAt(on) || clouds[0];
    if (!c) return;
    kid.position.copy(c.g.position).add(new THREE.Vector3(0, 0.9, 0));
    kid.rotation.x = 0;
    kid.rotation.z = 0;
    body.scale.set(1, 1.15, 0.8);
    hips.forEach((h) => { h.rotation.x = 0; h.position.y = -0.18; });
    head.rotation.x = 0;
  }

  function build() {
    clouds.forEach((c) => {
      scene.remove(c.g);
      c.g.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
      });
    });
    clouds = [];
    on = 0;
    hopPhase = "idle";
    hopping = 0;
    ensureAhead();
    snapToCloud(0);
    hud();
    document.getElementById("say").textContent = "Tap Hop!";
  }
  build();

  document.getElementById("go").onclick = () => document.getElementById("title").classList.add("hidden");
  document.getElementById("hop").onclick = () => { mode = "hop"; hop(); };
  document.getElementById("flutter").onclick = () => { mode = "flutter"; hopping = 0.4; };
  document.getElementById("deco").onclick = () => {
    mode = "deco";
    const c = cloudAt(on);
    if (!c) { snapToCloud(on); return; }
    const flower = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), new THREE.MeshLambertMaterial({ color: 0xff6b9a }));
    flower.position.set((Math.random() - 0.5) * 0.8, 0.5, 0.2);
    c.g.add(flower);
    c.deco++;
    decorations++;
    stars++;
    persist();
  };

  const cheers = ["Higher!", "Nice hop!", "Keep going!", "Up up!", "Whee!"];

  function hop() {
    if (hopPhase !== "idle") return;
    ensureAhead();
    const here = cloudAt(on);
    const next = cloudAt(on + 1);
    if (!here || !next) {
      snapToCloud(on);
      document.getElementById("say").textContent = "Hop again!";
      return;
    }
    hopPhase = "crouch";
    hopT = 0;
    hopFrom.copy(here.g.position);
    hopTo.copy(next.g.position);
    hopCount++;
    if (hopCount > best) best = hopCount;
    if (hopCount % 5 === 0) stars += 1;
    persist();
    document.getElementById("say").textContent = cheers[hopCount % cheers.length];
  }
  canvas.addEventListener("pointerdown", hop);

  const rain = [];
  for (let i = 0; i < 20; i++) {
    const d = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.18, 0.03), new THREE.MeshBasicMaterial({ color: 0x8ad4ff }));
    d.position.set(Math.random() * 20 - 4, 20, Math.random() * 4 - 2);
    scene.add(d);
    rain.push(d);
  }

  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    wings.forEach((w, i) => { w.rotation.z = Math.sin(t * (hopPhase === "air" || hopping > 0 ? 18 : 14) + i) * 0.55 * (i ? -1 : 1); });
    if (hopPhase === "crouch") {
      hopT += dt;
      const k = Math.min(1, hopT / 0.34);
      body.scale.set(1.55, 0.45, 1.2);
      kid.position.copy(hopFrom).add(new THREE.Vector3(0, 0.62 - 0.32 * k, 0));
      hips.forEach((h) => { h.rotation.x = 1.35 * k; h.position.y = -0.18 - 0.06 * k; });
      head.rotation.x = 0.55 * k;
      kid.rotation.x = 0.22 * k;
      wings.forEach((w, i) => { w.rotation.z = 0.7 * k * (i ? -1 : 1); });
      if (hopT >= 0.34) { hopPhase = "takeoff"; hopT = 0; puffCloud(8); }
    } else if (hopPhase === "takeoff") {
      hopT += dt;
      const k = Math.min(1, hopT / 0.1);
      body.scale.set(0.78, 1.55, 0.68);
      hips.forEach((h) => { h.rotation.x = -0.55; h.position.y = -0.12; });
      head.rotation.x = -0.4;
      kid.rotation.x = -0.32;
      kid.position.lerpVectors(hopFrom, hopTo, k * 0.16).add(new THREE.Vector3(0, 1.05 + k * 0.7, 0));
      if (hopT >= 0.1) { hopPhase = "air"; hopT = 0; on++; ensureAhead(); recycleBehind(); }
    } else if (hopPhase === "air") {
      hopT += dt;
      const dur = 0.78;
      const k = Math.min(1, hopT / dur);
      const hang = Math.sin(k * Math.PI);
      const loft = hang > 0.58 ? hang * 1.28 : hang;
      kid.position.lerpVectors(hopFrom, hopTo, k).add(new THREE.Vector3(0, 0.95 + loft * 1.75, 0));
      body.scale.set(0.72, 1.42, 0.7);
      hips.forEach((h) => { h.rotation.x = -1.65; h.position.y = -0.02; });
      head.rotation.x = -0.35;
      kid.rotation.x = -0.35 + k * 0.55;
      kid.rotation.z = Math.sin(k * Math.PI) * 0.22;
      if (hopT >= dur) { hopPhase = "land"; hopT = 0; puffCloud(10); }
    } else if (hopPhase === "land") {
      hopT += dt;
      const k = Math.min(1, hopT / 0.22);
      const dip = k < 0.45 ? 0.22 * (1 - k / 0.45) : 0;
      kid.position.copy(hopTo).add(new THREE.Vector3(0, 0.9 - dip, 0));
      body.scale.set(1.4, 0.55 + k * 0.6, 1.05);
      hips.forEach((h) => { h.rotation.x = 0.85 * (1 - k); h.position.y = -0.18; });
      head.rotation.x = k < 0.4 ? 0.55 : 0.55 - (k - 0.4) * 0.9;
      kid.rotation.x = 0;
      kid.rotation.z = 0;
      if (hopT >= 0.22) { hopPhase = "idle"; body.scale.set(1, 1.15, 0.8); }
    } else if (hopping > 0) {
      hopping -= dt;
      const pad = cloudAt(on);
      if (!pad) { snapToCloud(on); }
      else {
        const k = 1 - hopping / 0.4;
        kid.position.y = pad.g.position.y + 0.9 + Math.sin(k * Math.PI) * 0.55;
        hips.forEach((h) => { h.rotation.x = -0.7; });
        body.scale.set(0.95, 1.2, 0.8);
      }
    } else {
      const pad = cloudAt(on);
      if (!pad) { snapToCloud(on); }
      else {
        kid.position.x = pad.g.position.x;
        kid.position.z = pad.g.position.z;
        kid.position.y = pad.g.position.y + 0.9 + Math.sin(t * 3) * 0.06;
        hips.forEach((h, i) => { h.rotation.x = Math.sin(t * 8 + i * 3) * 0.4; h.position.y = -0.18; });
        head.rotation.x = 0;
        body.scale.set(1, 1.15, 0.8);
      }
    }
    dust.forEach((m) => {
      m.userData.life -= dt;
      m.position.x += m.userData.vx * dt;
      m.position.y += m.userData.vy * dt;
      m.position.z += m.userData.vz * dt;
      m.material.opacity = Math.max(0, m.userData.life * 2);
      m.scale.addScalar(dt * 1.6);
    });
    for (let di = dust.length - 1; di >= 0; di--) {
      if (dust[di].userData.life <= 0) { scene.remove(dust[di]); dust.splice(di, 1); }
    }
    clouds.forEach((c) => { c.g.position.y = c.baseY + Math.sin(t * 1.4 + c.i) * 0.08; });
    if (hopCount % 20 > 14) rain.forEach((d) => { d.position.y -= 8 * dt; if (d.position.y < 0) d.position.y = 9; });
    else rain.forEach((d) => { d.position.y = 20; });
    camera.position.lerp(new THREE.Vector3(kid.position.x - 0.2, kid.position.y + 1.6, 6.2), 0.08);
    camera.lookAt(kid.position.x + 1.2, kid.position.y, 0);
    renderer.render(scene, camera);
  }
  addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); });
  loop();
})();
  </script>
</body>
</html>
