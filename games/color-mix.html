<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Color Mix</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#1e1b4b}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="rnd">1/5</b></div>
  <div id="say">Mix to match!</div>
  <div class="dock" id="dock">
    <button id="r" style="background:#ef4444;color:#fff"><span>🔴</span>Red</button>
    <button id="y" style="background:#facc15"><span>🟡</span>Yellow</button>
    <button id="b" style="background:#3b82f6;color:#fff"><span>🔵</span>Blue</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🎨</div>
    <h1>Color Mix</h1>
    <p>Tap paints. Match the color!</p>
    <button class="play" id="go">Mix</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🌈</div>
    <h1>Rainbow mixer!</h1>
    <p>Five matches.</p>
    <button class="play g" id="again">Mix again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, round = 0, mix = { r: 0, y: 0, b: 0 };
    var GOALS = [
      { n: "Orange", r: 1, y: 1, b: 0, c: "#f97316" },
      { n: "Green", r: 0, y: 1, b: 1, c: "#22c55e" },
      { n: "Purple", r: 1, y: 0, b: 1, c: "#a855f7" },
      { n: "Orange", r: 1, y: 1, b: 0, c: "#f97316" },
      { n: "Green", r: 0, y: 1, b: 1, c: "#22c55e" }
    ];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function mixColor() {
      var r = mix.r * 220, g = mix.y * 200 + mix.b * 40, b = mix.b * 220 + mix.r * 40;
      if (!mix.r && !mix.y && !mix.b) return "#e2e8f0";
      return "rgb(" + Math.min(255, r) + "," + Math.min(255, g) + "," + Math.min(255, b) + ")";
    }
    function start() {
      play = true; round = 0; mix = { r: 0, y: 0, b: 0 };
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      document.getElementById("say").textContent = "Make " + GOALS[0].n + "!";
      document.getElementById("rnd").textContent = "1/5";
    }
    function add(k) {
      if (!play) return;
      mix[k] = 1;
      var g = GOALS[round];
      if (mix.r === g.r && mix.y === g.y && mix.b === g.b) {
        document.getElementById("say").textContent = "Yes! " + g.n + "!";
        round++;
        if (round >= GOALS.length) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("win").classList.remove("off");
        } else {
          mix = { r: 0, y: 0, b: 0 };
          document.getElementById("rnd").textContent = (round + 1) + "/5";
          document.getElementById("say").textContent = "Now make " + GOALS[round].n + "!";
        }
      } else if ((mix.r && !g.r) || (mix.y && !g.y) || (mix.b && !g.b)) {
        document.getElementById("say").textContent = "Oops. Try again!";
        mix = { r: 0, y: 0, b: 0 };
      }
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("r").onclick = function () { add("r"); };
    document.getElementById("y").onclick = function () { add("y"); };
    document.getElementById("b").onclick = function () { add("b"); };
    function loop() {
      x.fillStyle = "#1e1b4b"; x.fillRect(0, 0, W, H);
      var g = GOALS[Math.min(round, GOALS.length - 1)];
      x.beginPath(); x.arc(W * 0.32, H * 0.40, 70, 0, Math.PI * 2); x.fillStyle = g.c; x.fill();
      em("🎯", W * 0.32, H * 0.40, 48);
      x.beginPath(); x.arc(W * 0.68, H * 0.40, 80, 0, Math.PI * 2); x.fillStyle = mixColor(); x.fill();
      em("🎨", W * 0.68, H * 0.40, 64);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
