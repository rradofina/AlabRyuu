<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Farm Friends</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#65a30d}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="rd">1/6</b></div>
  <div id="say">Who says moo?</div>
  <div class="cover" id="title">
    <div class="hero">🐄</div>
    <h1>Farm Friends</h1>
    <p>Tap the animal we ask for!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🚜</div>
    <h1>Farm helper!</h1>
    <p>All the pals said hi.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, round = 0;
    var ALL = [
      { e: "🐄", q: "Who says moo?" },
      { e: "🐷", q: "Who says oink?" },
      { e: "🐔", q: "Who says cluck?" },
      { e: "🐑", q: "Who is fluffy?" },
      { e: "🐴", q: "Who can trot?" },
      { e: "🦆", q: "Who says quack?" }
    ];
    var show = [];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function deal() {
      var want = ALL[round];
      var pool = [want];
      while (pool.length < 4) {
        var a = ALL[(Math.random() * ALL.length) | 0];
        if (!pool.some(function (p) { return p.e === a.e; })) pool.push(a);
      }
      pool.sort(function () { return Math.random() - 0.5; });
      show = pool.map(function (p, i) { return { e: p.e, x: 0.25 + (i % 2) * 0.5, y: 0.40 + ((i / 2) | 0) * 0.28, want: p.e === want.e }; });
      document.getElementById("say").textContent = want.q;
      document.getElementById("rd").textContent = (round + 1) + "/6";
    }
    function start() {
      play = true; round = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      deal();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      show.forEach(function (s) {
        var dx = kidPt(e, cv).x - s.x * W, dy = kidPt(e, cv).y - s.y * H;
        if (dx * dx + dy * dy < 60 * 60) {
          if (s.want) {
            round++;
            if (round >= 6) { play = false; document.getElementById("win").classList.remove("off"); }
            else deal();
          } else document.getElementById("say").textContent = "Not that pal. " + ALL[round].q;
        }
      });
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#86efac"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#4ade80"; x.fillRect(0, H * 0.7, W, H);
      em("🏠", 50, 110, 56); em("🌾", W - 40, 130, 48);
      show.forEach(function (s) { em(s.e, s.x * W, s.y * H + Math.sin(t * 2) * 3, 80); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
