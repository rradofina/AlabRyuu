<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Farm Friends</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#365314;touch-action:manipulation;user-select:none}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;background:linear-gradient(#87ceeb 0 32%,#86efac 32% 72%,#ca8a04 72%);padding:56px 12px 24px;text-align:center}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    h1{font-size:clamp(28px,8vw,42px);color:#14532d}
    .msg{font-weight:800;font-size:22px;margin:10px;min-height:2em}
    .yard{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:12px auto}
    .yard button{height:96px;border-radius:24px;background:#fefce8;font-size:52px;box-shadow:0 7px 0 #65a30d}
    .yard button:active{transform:translateY(4px)}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(20,40,10,.84);z-index:8;gap:12px;color:#fff}
    .win.on{display:flex}
    .play{background:#ffd166;color:#3b2100;font-weight:800;font-size:26px;padding:14px 28px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <h1>Farm Friends</h1>
  <p class="msg" id="msg">Tap the cow!</p>
  <div class="yard" id="yard"></div>
  <div class="win" id="win">
    <div style="font-size:72px">🚜</div>
    <h2>Happy farm!</h2>
    <button class="play" id="again">Visit again</button>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.11;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var pals=[{e:"🐄",n:"cow"},{e:"🐷",n:"pig"},{e:"🐔",n:"chicken"},{e:"🐑",n:"sheep"},{e:"🐴",n:"horse"},{e:"🦆",n:"duck"}];
    var need,score=0,yard=document.getElementById("yard");
    function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
    function round(){
      yard.innerHTML="";
      need=pals[Math.floor(Math.random()*pals.length)];
      document.getElementById("msg").textContent="Where is the "+need.n+"?";
      shuffle(pals.slice()).forEach(function(p){
        var b=document.createElement("button");b.textContent=p.e;
        b.onclick=function(){
          if(p.n!==need.n){document.getElementById("msg").textContent="That's the "+p.n+". Find the "+need.n+"!";beep(180,.1);return;}
          score++;beep(760,.1);
          if(score>=8){document.getElementById("win").classList.add("on");beep(940,.2);} else round();
        };
        yard.appendChild(b);
      });
    }
    round();
    document.getElementById("again").onclick=function(){location.reload();};
  </script>
</body>
</html>
