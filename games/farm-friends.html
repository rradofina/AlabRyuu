<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Farm Friends</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background: #65a30d; color: #3f2a14; touch-action: none; user-select: none; }
    button { background: transparent; border: 0; appearance: none; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .home { position: fixed; top: 12px; left: 12px; z-index: 12; color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; background: rgba(0,0,0,.32); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 12px; right: 12px; z-index: 8; font-weight: 800; text-align: right; pointer-events: none; }
    #hud b { display: inline-block; background: rgba(255,255,255,.9); padding: 6px 12px; border-radius: 999px; margin-left: 6px; font-size: 14px; }
    #say { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 8; font-weight: 800; color: #fff; text-shadow: 0 2px 0 #3f2a14; pointer-events: none; text-align: center; width: 92%; }
    #hay { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 8; display: none; background: #fef08a; color: #713f12; font-weight: 800; font-size: 22px; padding: 14px 28px; border-radius: 20px; box-shadow: 0 6px 0 #ca8a04; }
    #hay.on { display: block; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; gap: 8px; padding: 20px 20px 48px; pointer-events: none; }
    .cover.off { display: none; }
    .cover h1 { font-size: clamp(32px, 8vw, 48px); color: #14532d; text-shadow: 0 3px 0 #fff; }
    .cover p { font-weight: 800; color: #14532d; }
    .btn { pointer-events: auto; background: #ffd166; color: #3b2100; font-weight: 800; font-size: 24px; padding: 14px 28px; border-radius: 999px; box-shadow: 0 7px 0 #e09f1f; }
    .btn.g { background: #86efac; color: #14532d; box-shadow: 0 7px 0 #16a34a; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="ch">Chore 1</b><b id="day">Morning</b><b id="st">⭐ 0</b></div>
  <div id="say">Find Bella the cow!</div>
  <button id="hay">🌾 Feed</button>
  <div class="cover" id="title">
    <h1>Farm Friends</h1>
    <p>Find the named pal. Then feed.<br>Day drifts to a kind sunset.</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <h1>Chores done!</h1>
    <p id="winP">Five kind chores.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), g = cv.getContext("2d");
    var W, H, last = 0, t = 0, mode = "title", stars = 0, chore = 0;
    var animals = [], prints = [], snacks = [], day = 0, target = 0, phase = "find";
    var barn = { x: 0, y: 0, w: 0, h: 0 };

    var CHORES = [
      { n: "Morning milk", who: "Bella", e: "🐮", food: "🌾", sky: "morning" },
      { n: "Pig snack", who: "Pip", e: "🐷", food: "🥕", sky: "late morning" },
      { n: "Duck pond", who: "Dottie", e: "🦆", food: "🌽", sky: "noon" },
      { n: "Sheep fluff", who: "Snow", e: "🐑", food: "🌾", sky: "afternoon" },
      { n: "Horse apple", who: "Maple", e: "🐴", food: "🍎", sky: "sunset" }
    ];
    var HERD = [
      { name: "Bella", e: "🐮" }, { name: "Pip", e: "🐷" }, { name: "Dottie", e: "🦆" },
      { name: "Snow", e: "🐑" }, { name: "Maple", e: "🐴" }, { name: "Cluck", e: "🐔" },
      { name: "Nibble", e: "🐐" }
    ];

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), gn = ac.createGain();
        o.type = "sine"; o.frequency.value = f; gn.gain.value = 0.07;
        o.connect(gn); gn.connect(ac.destination); o.start();
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function lerp(a, b, p) { return a + (b - a) * p; }
    function rnd(a, b) { return a + Math.random() * (b - a); }

    function resize() {
      cv.width = innerWidth * (devicePixelRatio || 1);
      cv.height = innerHeight * (devicePixelRatio || 1);
      g.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0);
      W = innerWidth; H = innerHeight;
      barn.x = 16; barn.y = 90; barn.w = Math.min(160, W * 0.34); barn.h = 120;
    }
    addEventListener("resize", resize); resize();

    function spawnHerd() {
      animals = HERD.map(function (h, i) {
        return {
          name: h.name, e: h.e, x: rnd(W * 0.35, W - 40), y: rnd(H * 0.42, H * 0.78),
          vx: rnd(-22, 22), vy: rnd(-16, 16), fed: 0, bob: rnd(0, 6), wait: rnd(0, 2)
        };
      });
      prints = []; snacks = []; phase = "find"; target = chore;
      document.getElementById("hay").classList.remove("on");
      document.getElementById("ch").textContent = CHORES[chore].n;
      document.getElementById("say").textContent = "Find " + CHORES[chore].who + " the " + nameKind(CHORES[chore].e) + "!";
    }
    function nameKind(e) {
      return { "🐮": "cow", "🐷": "pig", "🦆": "duck", "🐑": "sheep", "🐴": "horse" }[e] || "pal";
    }

    function wander(a, dt) {
      a.wait -= dt;
      if (a.wait <= 0) {
        a.vx = rnd(-28, 28); a.vy = rnd(-20, 20); a.wait = rnd(0.8, 2.4);
      }
      a.x += a.vx * dt; a.y += a.vy * dt;
      if (a.x < W * 0.28) { a.x = W * 0.28; a.vx *= -1; }
      if (a.x > W - 30) { a.x = W - 30; a.vx *= -1; }
      if (a.y < H * 0.38) { a.y = H * 0.38; a.vy *= -1; }
      if (a.y > H - 80) { a.y = H - 80; a.vy *= -1; }
      if (Math.random() < 0.08) prints.push({ x: a.x, y: a.y + 14, life: 1, r: 4 });
    }

    function tap(mx, my) {
      if (mode !== "play") return;
      if (phase === "find") {
        animals.forEach(function (a) {
          if (Math.hypot(mx - a.x, my - a.y) < 36) {
            if (a.e === CHORES[chore].e) {
              phase = "feed"; a.vx = a.vy = 0;
              document.getElementById("hay").classList.add("on");
              document.getElementById("hay").textContent = CHORES[chore].food + " Feed " + a.name;
              document.getElementById("say").textContent = "That's " + a.name + "! Feed time.";
              beep(620, 0.1);
            } else {
              document.getElementById("say").textContent = "That's " + a.name + ". Looking for " + CHORES[chore].who + ".";
              beep(240, 0.07);
            }
          }
        });
      }
    }

    function feed() {
      if (phase !== "feed") return;
      var a = animals.filter(function (x) { return x.e === CHORES[chore].e; })[0];
      if (!a) return;
      snacks.push({ x: W / 2, y: H - 40, tx: a.x, ty: a.y, p: 0, e: CHORES[chore].food });
      beep(500, 0.06);
    }

    function nextChore() {
      stars += 4; document.getElementById("st").textContent = "⭐ " + stars;
      beep(660, 0.12); setTimeout(function () { beep(880, 0.14); }, 90);
      if (chore < CHORES.length - 1) {
        chore++; spawnHerd();
      } else {
        mode = "win"; day = 1;
        document.getElementById("hay").classList.remove("on");
        document.getElementById("win").classList.remove("off");
        document.getElementById("winP").textContent = "Sunset chores. " + stars + " stars.";
      }
    }

    function skyColors() {
      var p = day;
      var morn = ["#7dd3fc", "#86efac", "#ca8a04"];
      var set = ["#fb923c", "#fde68a", "#b45309"];
      return [
        lerpC(morn[0], set[0], p),
        lerpC(morn[1], set[1], p),
        lerpC(morn[2], set[2], p)
      ];
    }
    function lerpC(a, b, p) {
      function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
      var A = hex(a), B = hex(b);
      return "rgb(" + Math.round(lerp(A[0], B[0], p)) + "," + Math.round(lerp(A[1], B[1], p)) + "," + Math.round(lerp(A[2], B[2], p)) + ")";
    }

    function drawFarm() {
      var c = skyColors();
      var grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, c[0]); grd.addColorStop(0.38, c[1]); grd.addColorStop(1, c[2]);
      g.fillStyle = grd; g.fillRect(0, 0, W, H);
      var sunX = lerp(W * 0.15, W * 0.85, day), sunY = lerp(70, 160, Math.sin(day * Math.PI));
      g.fillStyle = day < 0.7 ? "#fde047" : "#fb923c";
      g.beginPath(); g.arc(sunX, sunY, 26, 0, 6.28); g.fill();
      g.fillStyle = "#b91c1c";
      g.beginPath(); g.moveTo(barn.x, barn.y + 40); g.lineTo(barn.x + barn.w / 2, barn.y); g.lineTo(barn.x + barn.w, barn.y + 40); g.fill();
      g.fillStyle = "#fef3c7"; g.fillRect(barn.x + 8, barn.y + 40, barn.w - 16, barn.h);
      g.fillStyle = "#7c2d12"; g.fillRect(barn.x + barn.w * 0.35, barn.y + 70, barn.w * 0.3, barn.h - 30);
      g.fillStyle = "#fff"; g.font = "bold 12px Trebuchet MS"; g.textAlign = "center";
      g.fillText("BARN", barn.x + barn.w / 2, barn.y + 58);
      var i;
      g.strokeStyle = "#854d0e"; g.lineWidth = 4;
      g.beginPath(); g.moveTo(barn.x + barn.w, H * 0.4); g.lineTo(W - 10, H * 0.4); g.stroke();
      for (i = 0; i < 8; i++) g.fillRect(barn.x + barn.w + 20 + i * 36, H * 0.38, 6, 26);
      g.fillStyle = "#16a34a";
      g.fillRect(0, H * 0.72, W, 8);
    }

    function drawAnimals() {
      prints.forEach(function (p) {
        g.globalAlpha = p.life * 0.4; g.fillStyle = "#713f12";
        g.beginPath(); g.ellipse(p.x, p.y, p.r, p.r * 0.6, 0, 0, 6.28); g.fill(); g.globalAlpha = 1;
      });
      animals.forEach(function (a) {
        g.save();
        g.translate(a.x, a.y + Math.sin(t * 3 + a.bob) * 3);
        g.scale(a.vx < 0 ? -1 : 1, 1);
        g.font = "40px serif"; g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(a.e, 0, 0);
        g.restore();
        if (phase === "feed" && a.e === CHORES[chore].e) {
          g.font = "bold 13px Trebuchet MS"; g.fillStyle = "#fff"; g.textAlign = "center";
          g.fillText(a.name + "!", a.x, a.y - 28);
        }
        if (a.fed) { g.font = "16px serif"; g.fillText("💕", a.x + 16, a.y - 18); }
      });
      snacks.forEach(function (s) {
        var x = lerp(s.x, s.tx, s.p), y = lerp(s.y, s.ty, s.p) - Math.sin(s.p * Math.PI) * 40;
        g.font = "24px serif"; g.textAlign = "center"; g.fillText(s.e, x, y);
      });
    }

    function drawTitleFarm() {
      drawFarm();
      var i, es = ["🐮", "🐷", "🦆", "🐑", "🐴"];
      for (i = 0; i < 5; i++) {
        g.save();
        g.translate(W * (0.2 + i * 0.15), H * 0.55 + Math.sin(t * 2 + i) * 8);
        g.font = "42px serif"; g.textAlign = "center"; g.fillText(es[i], 0, 0);
        g.restore();
      }
    }

    function update(dt) {
      t += dt;
      if (mode === "title" || mode === "win") { day = mode === "win" ? Math.min(1, day + dt * 0.1) : (Math.sin(t * 0.3) * 0.5 + 0.5) * 0.4; return; }
      if (mode !== "play") return;
      day = Math.min(0.92, (chore / 5) + t * 0.004);
      document.getElementById("day").textContent = day < 0.3 ? "Morning" : day < 0.6 ? "Noon" : day < 0.8 ? "Afternoon" : "Sunset";
      animals.forEach(function (a) { if (!a.fed) wander(a, dt); });
      prints.forEach(function (p) { p.life -= dt * 0.35; });
      prints = prints.filter(function (p) { return p.life > 0; });
      snacks.forEach(function (s) {
        s.p += dt * 1.4;
        if (s.p >= 1 && phase === "feed") {
          var a = animals.filter(function (x) { return x.e === CHORES[chore].e; })[0];
          if (a) a.fed = 1;
          phase = "done";
          document.getElementById("hay").classList.remove("on");
          document.getElementById("say").textContent = CHORES[chore].who + " is happy!";
          setTimeout(nextChore, 700);
        }
      });
      snacks = snacks.filter(function (s) { return s.p < 1; });
    }

    function draw() {
      if (mode === "title" || mode === "win") { drawTitleFarm(); return; }
      drawFarm(); drawAnimals();
    }
    function loop(now) {
      var dt = Math.min(0.033, (now - last) / 1000 || 0.016);
      last = now; update(dt); draw(); requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function start() {
      mode = "play"; chore = 0; stars = 0; day = 0; t = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("st").textContent = "⭐ 0";
      spawnHerd(); beep(480, 0.1);
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = function () { document.getElementById("win").classList.add("off"); start(); };
    document.getElementById("hay").onclick = feed;
    cv.addEventListener("pointerdown", function (e) { tap(e.clientX, e.clientY); });
  })();
  </script>
</body>
</html>
