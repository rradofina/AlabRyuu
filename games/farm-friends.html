<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Farm Friends</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background: #65a30d; color: #3f2a14; touch-action: none; user-select: none; }
    button { background: transparent; border: 0; appearance: none; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .home { position: fixed; top: 12px; left: 12px; z-index: 12; color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; background: rgba(0,0,0,.32); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 12px; right: 12px; z-index: 8; font-weight: 800; text-align: right; pointer-events: none; }
    #hud b { display: inline-block; background: rgba(255,255,255,.9); padding: 6px 12px; border-radius: 999px; margin-left: 6px; font-size: 14px; }
    #say { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 8; font-weight: 800; color: #fff; text-shadow: 0 2px 0 #3f2a14; pointer-events: none; text-align: center; width: 92%; }
    #hay { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 8; display: none; background: #fef08a; color: #713f12; font-weight: 800; font-size: 22px; padding: 14px 28px; border-radius: 20px; box-shadow: 0 6px 0 #ca8a04; }
    #hay.on { display: block; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; gap: 8px; padding: 20px 20px 48px; pointer-events: none; }
    .cover.off { display: none; }
    .cover h1 { font-size: clamp(32px, 8vw, 48px); color: #14532d; text-shadow: 0 3px 0 #fff; }
    .cover p { font-weight: 800; color: #14532d; }
    .btn { pointer-events: auto; background: #ffd166; color: #3b2100; font-weight: 800; font-size: 24px; padding: 14px 28px; border-radius: 999px; box-shadow: 0 7px 0 #e09f1f; }
    .btn.g { background: #86efac; color: #14532d; box-shadow: 0 7px 0 #16a34a; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="ch">Chore 1</b><b id="day">Morning</b><b id="st">⭐ 0</b></div>
  <div id="say">Find Bella the cow!</div>
  <button id="hay">🌾 Feed</button>
  <div class="cover" id="title">
    <h1>Farm Friends</h1>
    <p>Find the named pal. Then feed.<br>Day drifts to a kind sunset.</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <h1>Chores done!</h1>
    <p id="winP">Five kind chores.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), g = cv.getContext("2d");
    var W, H, last = 0, t = 0, mode = "title", stars = 0, chore = 0;
    var animals = [], prints = [], snacks = [], day = 0, target = 0, phase = "find";
    var barn = { x: 0, y: 0, w: 0, h: 0 };
    var motes = [];

    var CHORES = [
      { n: "Morning milk", who: "Bella", kind: "cow", food: "🌾", sky: "morning" },
      { n: "Pig snack", who: "Pip", kind: "pig", food: "🥕", sky: "late morning" },
      { n: "Duck pond", who: "Dottie", kind: "duck", food: "🌽", sky: "noon" },
      { n: "Sheep fluff", who: "Snow", kind: "sheep", food: "🌾", sky: "afternoon" },
      { n: "Horse apple", who: "Maple", kind: "horse", food: "🍎", sky: "sunset" }
    ];
    var HERD = [
      { name: "Bella", kind: "cow" }, { name: "Pip", kind: "pig" }, { name: "Dottie", kind: "duck" },
      { name: "Snow", kind: "sheep" }, { name: "Maple", kind: "horse" }, { name: "Cluck", kind: "chicken" },
      { name: "Nibble", kind: "goat" }
    ];
    var HIT = { cow: 52, pig: 48, duck: 42, sheep: 50, horse: 54, chicken: 40, goat: 48 };

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), gn = ac.createGain();
        o.type = "sine"; o.frequency.value = f; gn.gain.value = 0.07;
        o.connect(gn); gn.connect(ac.destination); o.start();
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function lerp(a, b, p) { return a + (b - a) * p; }
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function oval(cx, cy, rx, ry, col) {
      g.fillStyle = col;
      g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, 6.28); g.fill();
    }
    function dot(cx, cy, r, col) {
      g.fillStyle = col;
      g.beginPath(); g.arc(cx, cy, r, 0, 6.28); g.fill();
    }

    function resize() {
      cv.width = innerWidth * (devicePixelRatio || 1);
      cv.height = innerHeight * (devicePixelRatio || 1);
      g.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0);
      W = innerWidth; H = innerHeight;
      barn.x = 16; barn.y = 90; barn.w = Math.min(160, W * 0.34); barn.h = 120;
      if (!motes.length) {
        var i;
        for (i = 0; i < 18; i++) {
          motes.push({ x: Math.random(), y: Math.random() * 0.35, r: 1 + Math.random() * 2, ph: Math.random() * 6 });
        }
      }
    }
    addEventListener("resize", resize); resize();

    function spawnHerd() {
      animals = HERD.map(function (h, i) {
        var col = i % 3, row = (i / 3) | 0;
        return {
          name: h.name, kind: h.kind,
          x: W * (0.38 + col * 0.2) + rnd(-12, 12),
          y: H * (0.48 + row * 0.16) + rnd(-10, 10),
          vx: rnd(-22, 22), vy: rnd(-16, 16), fed: 0, bob: rnd(0, 6), wait: rnd(0, 2)
        };
      });
      prints = []; snacks = []; phase = "find"; target = chore;
      document.getElementById("hay").classList.remove("on");
      document.getElementById("ch").textContent = CHORES[chore].n;
      document.getElementById("say").textContent = "Find " + CHORES[chore].who + " the " + CHORES[chore].kind + "!";
    }

    function wander(a, dt) {
      a.wait -= dt;
      if (a.wait <= 0) {
        a.vx = rnd(-28, 28); a.vy = rnd(-20, 20); a.wait = rnd(0.8, 2.4);
      }
      a.x += a.vx * dt; a.y += a.vy * dt;
      if (a.x < W * 0.28) { a.x = W * 0.28; a.vx *= -1; }
      if (a.x > W - 40) { a.x = W - 40; a.vx *= -1; }
      if (a.y < H * 0.38) { a.y = H * 0.38; a.vy *= -1; }
      if (a.y > H - 90) { a.y = H - 90; a.vy *= -1; }
      if (Math.random() < 0.08) prints.push({ x: a.x, y: a.y + 22, life: 1, r: 4 });
    }

    function tap(mx, my) {
      if (mode !== "play") return;
      if (phase === "find") {
        animals.forEach(function (a) {
          var r = HIT[a.kind] || 44;
          if (Math.hypot(mx - a.x, my - a.y) < r) {
            if (a.kind === CHORES[chore].kind) {
              phase = "feed"; a.vx = a.vy = 0;
              document.getElementById("hay").classList.add("on");
              document.getElementById("hay").textContent = CHORES[chore].food + " Feed " + a.name;
              document.getElementById("say").textContent = "That's " + a.name + "! Feed time.";
              beep(620, 0.1);
            } else {
              document.getElementById("say").textContent = "That's " + a.name + ". Looking for " + CHORES[chore].who + ".";
              beep(240, 0.07);
            }
          }
        });
      }
    }

    function feed() {
      if (phase !== "feed") return;
      var a = animals.filter(function (x) { return x.kind === CHORES[chore].kind; })[0];
      if (!a) return;
      snacks.push({ x: W / 2, y: H - 40, tx: a.x, ty: a.y, p: 0, food: CHORES[chore].food, kind: CHORES[chore].kind });
      beep(500, 0.06);
    }

    function nextChore() {
      stars += 4; document.getElementById("st").textContent = "⭐ " + stars;
      beep(660, 0.12); setTimeout(function () { beep(880, 0.14); }, 90);
      if (chore < CHORES.length - 1) {
        chore++; spawnHerd();
      } else {
        mode = "win"; day = 1;
        document.getElementById("hay").classList.remove("on");
        document.getElementById("win").classList.remove("off");
        document.getElementById("winP").textContent = "Sunset chores. " + stars + " stars.";
      }
    }

    function skyColors() {
      var p = day;
      var morn = ["#7dd3fc", "#86efac", "#ca8a04"];
      var set = ["#fb923c", "#fde68a", "#b45309"];
      return [
        lerpC(morn[0], set[0], p),
        lerpC(morn[1], set[1], p),
        lerpC(morn[2], set[2], p)
      ];
    }
    function lerpC(a, b, p) {
      function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
      var A = hex(a), B = hex(b);
      return "rgb(" + Math.round(lerp(A[0], B[0], p)) + "," + Math.round(lerp(A[1], B[1], p)) + "," + Math.round(lerp(A[2], B[2], p)) + ")";
    }

    function stepLegs(xs, y0, h, col, walk) {
      g.strokeStyle = col; g.lineWidth = 4; g.lineCap = "round";
      var i;
      for (i = 0; i < xs.length; i++) {
        var w = (i % 2 ? 1 : -1) * walk * 6;
        g.beginPath();
        g.moveTo(xs[i], y0);
        g.lineTo(xs[i] + w, y0 + h);
        g.stroke();
      }
    }

    function eye(ex, ey, shut) {
      if (shut) {
        g.strokeStyle = "#1c1917"; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(ex - 2, ey); g.lineTo(ex + 2, ey); g.stroke();
      } else {
        dot(ex, ey, 2.1, "#1c1917");
        dot(ex + 0.6, ey - 0.6, 0.7, "#fff");
      }
    }

    function drawCow(walk) {
      stepLegs([-16, -6, 6, 16], 10, 16, "#3f2a14", walk);
      oval(0, 2, 24, 14, "#f5f0e6");
      oval(-8, -2, 7, 5, "#7c4a1e");
      oval(6, 6, 6, 4, "#7c4a1e");
      oval(2, 12, 6, 4, "#f9a8d4");
      oval(22, -8, 11, 9, "#f5f0e6");
      oval(30, -6, 6, 4.2, "#fda4af");
      dot(28, -6, 1, "#9f1239");
      dot(32, -6, 1, "#9f1239");
      g.fillStyle = "#f5f0e6";
      g.beginPath(); g.moveTo(16, -16); g.lineTo(20, -24); g.lineTo(24, -15); g.fill();
      g.beginPath(); g.moveTo(22, -16); g.lineTo(28, -24); g.lineTo(30, -14); g.fill();
      g.strokeStyle = "#d6d3d1"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(18, -16); g.lineTo(16, -22);
      g.moveTo(26, -16); g.lineTo(28, -22); g.stroke();
      eye(24, -10, 0);
      g.strokeStyle = "#3f2a14"; g.lineWidth = 3;
      g.beginPath(); g.moveTo(-22, 0); g.quadraticCurveTo(-30, -10 + walk * 4, -24, 6); g.stroke();
    }

    function drawPig(walk) {
      stepLegs([-12, -4, 4, 12], 10, 12, "#e11d48", walk);
      oval(0, 3, 20, 13, "#fb7185");
      oval(18, -2, 12, 10, "#fb7185");
      oval(28, 1, 7, 5, "#f43f5e");
      dot(26, 1, 1.4, "#9f1239");
      dot(30, 1, 1.4, "#9f1239");
      g.fillStyle = "#f43f5e";
      g.beginPath(); g.ellipse(12, -12, 5, 7, -0.4, 0, 6.28); g.fill();
      g.beginPath(); g.ellipse(20, -13, 5, 7, 0.15, 0, 6.28); g.fill();
      oval(12, -10, 2.5, 3, "#fda4af");
      oval(20, -11, 2.5, 3, "#fda4af");
      eye(20, -4, 0);
      g.strokeStyle = "#fb7185"; g.lineWidth = 3;
      g.beginPath();
      g.moveTo(-18, 2);
      g.quadraticCurveTo(-24, -4, -20, 2);
      g.quadraticCurveTo(-26, 6, -18, 6);
      g.stroke();
    }

    function drawDuck(walk) {
      g.strokeStyle = "#ea580c"; g.lineWidth = 3; g.lineCap = "round";
      g.beginPath(); g.moveTo(-4, 10); g.lineTo(-8 + walk * 5, 18);
      g.moveTo(6, 10); g.lineTo(10 - walk * 5, 18); g.stroke();
      oval(0, 2, 18, 11, "#facc15");
      oval(16, -8, 10, 8, "#facc15");
      oval(26, -6, 8, 3.6, "#ea580c");
      oval(16, -14 + Math.sin(t * 6) * 1.5, 5, 6, "#ca8a04");
      eye(18, -10, 0);
      oval(-2, 0, 8, 5, "#eab308");
    }

    function drawSheep(walk) {
      stepLegs([-12, -4, 4, 12], 12, 14, "#1c1917", walk);
      oval(0, 2, 20, 14, "#fff");
      oval(-10, -4, 10, 9, "#f8fafc");
      oval(10, -6, 11, 10, "#fff");
      oval(-6, 8, 9, 7, "#f1f5f9");
      oval(8, 6, 9, 8, "#fff");
      oval(20, -4, 9, 8, "#fde68a");
      g.fillStyle = "#fde68a";
      g.beginPath(); g.ellipse(14, -12, 4, 6, -0.5, 0, 6.28); g.fill();
      g.beginPath(); g.ellipse(22, -12, 4, 6, 0.3, 0, 6.28); g.fill();
      eye(22, -6, 0);
      g.strokeStyle = "#fff"; g.lineWidth = 3;
      g.beginPath(); g.moveTo(-18, 2); g.quadraticCurveTo(-24, 8, -16, 8); g.stroke();
    }

    function drawHorse(walk) {
      stepLegs([-16, -6, 8, 18], 10, 18, "#7c2d12", walk);
      oval(2, 0, 24, 13, "#b45309");
      oval(24, -10, 13, 8, "#b45309");
      oval(34, -8, 7, 4, "#92400e");
      g.fillStyle = "#7c2d12";
      g.beginPath();
      g.moveTo(10, -12); g.lineTo(8, -22); g.lineTo(14, -14);
      g.lineTo(18, -24); g.lineTo(22, -12);
      g.fill();
      g.fillStyle = "#92400e";
      g.beginPath(); g.ellipse(16, -16, 3.5, 6, -0.3, 0, 6.28); g.fill();
      g.beginPath(); g.ellipse(24, -16, 3.5, 6, 0.2, 0, 6.28); g.fill();
      eye(26, -12, 0);
      g.strokeStyle = "#7c2d12"; g.lineWidth = 4;
      g.beginPath(); g.moveTo(-20, -2); g.quadraticCurveTo(-32, -16 + walk * 6, -22, 8); g.stroke();
    }

    function drawChicken(walk) {
      g.strokeStyle = "#f59e0b"; g.lineWidth = 3; g.lineCap = "round";
      g.beginPath(); g.moveTo(-3, 10); g.lineTo(-6 + walk * 4, 18);
      g.moveTo(5, 10); g.lineTo(8 - walk * 4, 18); g.stroke();
      oval(0, 2, 14, 11, "#fff7ed");
      oval(12, -6, 8, 7, "#fff7ed");
      oval(20, -5, 5, 2.6, "#ea580c");
      g.fillStyle = "#dc2626";
      g.beginPath();
      g.moveTo(8, -12); g.lineTo(10, -20); g.lineTo(13, -12);
      g.lineTo(16, -19); g.lineTo(18, -11);
      g.lineTo(20, -17); g.lineTo(21, -10);
      g.fill();
      oval(14, -1, 3, 4, "#dc2626");
      oval(-2, 0, 7, 5, "#fed7aa");
      eye(14, -8, 0);
    }

    function drawGoat(walk) {
      stepLegs([-14, -4, 6, 16], 10, 16, "#78716c", walk);
      oval(0, 2, 20, 12, "#e7e5e4");
      oval(20, -8, 10, 8, "#e7e5e4");
      oval(28, -6, 6, 4, "#d6d3d1");
      g.strokeStyle = "#a8a29e"; g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(16, -14); g.quadraticCurveTo(12, -24, 18, -22);
      g.moveTo(24, -14); g.quadraticCurveTo(28, -24, 24, -22); g.stroke();
      g.fillStyle = "#d6d3d1";
      g.beginPath(); g.ellipse(16, -14, 3, 5, -0.4, 0, 6.28); g.fill();
      g.beginPath(); g.ellipse(24, -14, 3, 5, 0.3, 0, 6.28); g.fill();
      g.fillStyle = "#a8a29e";
      g.beginPath(); g.moveTo(26, -2); g.lineTo(24, 6); g.lineTo(30, 2); g.fill();
      eye(22, -10, 0);
      g.strokeStyle = "#a8a29e"; g.lineWidth = 3;
      g.beginPath(); g.moveTo(-18, 0); g.quadraticCurveTo(-24, -8 + walk * 4, -16, 6); g.stroke();
    }

    function drawPal(kind, walk) {
      if (kind === "cow") drawCow(walk);
      else if (kind === "pig") drawPig(walk);
      else if (kind === "duck") drawDuck(walk);
      else if (kind === "sheep") drawSheep(walk);
      else if (kind === "horse") drawHorse(walk);
      else if (kind === "chicken") drawChicken(walk);
      else if (kind === "goat") drawGoat(walk);
    }

    function drawHeart(hx, hy) {
      g.fillStyle = "#fb7185";
      g.beginPath();
      g.moveTo(hx, hy + 4);
      g.bezierCurveTo(hx - 10, hy - 4, hx - 6, hy - 12, hx, hy - 6);
      g.bezierCurveTo(hx + 6, hy - 12, hx + 10, hy - 4, hx, hy + 4);
      g.fill();
    }

    function drawSnack(kind, x, y) {
      if (kind === "cow" || kind === "sheep") {
        oval(x, y, 10, 5, "#fde047");
        g.strokeStyle = "#ca8a04"; g.lineWidth = 1;
        g.beginPath(); g.moveTo(x - 8, y - 2); g.lineTo(x + 6, y + 2); g.stroke();
      } else if (kind === "pig") {
        g.fillStyle = "#fb923c";
        g.beginPath(); g.moveTo(x, y - 10); g.lineTo(x + 7, y + 8); g.lineTo(x - 7, y + 8); g.fill();
        oval(x, y - 10, 3, 3, "#22c55e");
      } else if (kind === "duck") {
        oval(x, y, 8, 5, "#facc15");
        g.fillStyle = "#65a30d";
        for (var i = -1; i <= 1; i++) {
          g.beginPath(); g.ellipse(x + i * 4, y - 2, 2, 4, 0, 0, 6.28); g.fill();
        }
      } else {
        g.fillStyle = "#ef4444";
        g.beginPath(); g.arc(x, y, 8, 0, 6.28); g.fill();
        g.strokeStyle = "#166534"; g.lineWidth = 2;
        g.beginPath(); g.moveTo(x, y - 8); g.lineTo(x + 4, y - 14); g.stroke();
      }
    }

    function drawFarm() {
      var c = skyColors();
      var grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, c[0]); grd.addColorStop(0.38, c[1]); grd.addColorStop(1, c[2]);
      g.fillStyle = grd; g.fillRect(0, 0, W, H);
      var sunX = lerp(W * 0.15, W * 0.85, day), sunY = lerp(70, 160, Math.sin(day * Math.PI));
      g.fillStyle = day < 0.7 ? "#fde047" : "#fb923c";
      g.beginPath(); g.arc(sunX, sunY, 26, 0, 6.28); g.fill();
      motes.forEach(function (m) {
        g.globalAlpha = 0.18 + 0.1 * Math.sin(t + m.ph);
        oval(m.x * W, m.y * H + Math.sin(t * 0.8 + m.ph) * 4, m.r, m.r, "#fff");
        g.globalAlpha = 1;
      });
      g.fillStyle = "#b91c1c";
      g.beginPath(); g.moveTo(barn.x, barn.y + 40); g.lineTo(barn.x + barn.w / 2, barn.y); g.lineTo(barn.x + barn.w, barn.y + 40); g.fill();
      g.fillStyle = "#fef3c7"; g.fillRect(barn.x + 8, barn.y + 40, barn.w - 16, barn.h);
      g.fillStyle = "#7c2d12"; g.fillRect(barn.x + barn.w * 0.35, barn.y + 70, barn.w * 0.3, barn.h - 30);
      g.fillStyle = "#fff"; g.font = "bold 12px Trebuchet MS"; g.textAlign = "center";
      g.fillText("BARN", barn.x + barn.w / 2, barn.y + 58);
      var i;
      g.strokeStyle = "#854d0e"; g.lineWidth = 4;
      g.beginPath(); g.moveTo(barn.x + barn.w, H * 0.4); g.lineTo(W - 10, H * 0.4); g.stroke();
      g.fillStyle = "#854d0e";
      for (i = 0; i < 8; i++) g.fillRect(barn.x + barn.w + 20 + i * 36, H * 0.38, 6, 26);
      g.fillStyle = "#16a34a";
      g.fillRect(0, H * 0.72, W, 8);
    }

    function drawAnimals() {
      prints.forEach(function (p) {
        g.globalAlpha = p.life * 0.4; g.fillStyle = "#713f12";
        g.beginPath(); g.ellipse(p.x, p.y, p.r, p.r * 0.6, 0, 0, 6.28); g.fill(); g.globalAlpha = 1;
      });
      animals.forEach(function (a) {
        var moving = !a.fed && (Math.abs(a.vx) + Math.abs(a.vy) > 6);
        var walk = moving ? Math.sin(t * 10 + a.bob) : 0;
        g.save();
        g.translate(a.x, a.y + Math.sin(t * 3 + a.bob) * 2);
        g.scale(a.vx < 0 ? -1 : 1, 1);
        drawPal(a.kind, walk);
        g.restore();
        if (phase === "feed" && a.kind === CHORES[chore].kind) {
          g.font = "bold 14px Trebuchet MS"; g.fillStyle = "#fff"; g.textAlign = "center";
          g.fillText(a.name + "!", a.x, a.y - 36);
        }
        if (a.fed) drawHeart(a.x + 22, a.y - 22);
      });
      snacks.forEach(function (s) {
        var x = lerp(s.x, s.tx, s.p), y = lerp(s.y, s.ty, s.p) - Math.sin(s.p * Math.PI) * 40;
        drawSnack(s.kind, x, y);
      });
    }

    function drawTitleFarm() {
      drawFarm();
      var kinds = ["cow", "pig", "duck", "sheep", "horse"];
      var i;
      for (i = 0; i < 5; i++) {
        g.save();
        g.translate(W * (0.16 + i * 0.17), H * 0.56 + Math.sin(t * 2 + i) * 8);
        g.scale(1.15, 1.15);
        drawPal(kinds[i], Math.sin(t * 6 + i));
        g.restore();
      }
    }

    function update(dt) {
      t += dt;
      if (mode === "title" || mode === "win") {
        day = mode === "win" ? Math.min(1, day + dt * 0.1) : (Math.sin(t * 0.3) * 0.5 + 0.5) * 0.4;
        return;
      }
      if (mode !== "play") return;
      day = Math.min(0.92, (chore / 5) + t * 0.004);
      document.getElementById("day").textContent = day < 0.3 ? "Morning" : day < 0.6 ? "Noon" : day < 0.8 ? "Afternoon" : "Sunset";
      animals.forEach(function (a) { if (!a.fed) wander(a, dt); });
      prints.forEach(function (p) { p.life -= dt * 0.35; });
      prints = prints.filter(function (p) { return p.life > 0; });
      snacks.forEach(function (s) {
        s.p += dt * 1.4;
        if (s.p >= 1 && phase === "feed") {
          var a = animals.filter(function (x) { return x.kind === CHORES[chore].kind; })[0];
          if (a) a.fed = 1;
          phase = "done";
          document.getElementById("hay").classList.remove("on");
          document.getElementById("say").textContent = CHORES[chore].who + " is happy!";
          setTimeout(nextChore, 700);
        }
      });
      snacks = snacks.filter(function (s) { return s.p < 1; });
    }

    function draw() {
      if (mode === "title" || mode === "win") { drawTitleFarm(); return; }
      drawFarm();
      drawAnimals();
    }
    function loop(now) {
      var dt = Math.min(0.033, (now - last) / 1000 || 0.016);
      last = now; update(dt); draw(); requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function start() {
      mode = "play"; chore = 0; stars = 0; day = 0; t = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("st").textContent = "⭐ 0";
      spawnHerd(); beep(480, 0.1);
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = function () { document.getElementById("win").classList.add("off"); start(); };
    document.getElementById("hay").onclick = feed;
    cv.addEventListener("pointerdown", function (e) { tap(e.clientX, e.clientY); });
  })();
  </script>
</body>
</html>
