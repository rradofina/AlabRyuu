<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cookie Bakery</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <style>html,body{background:#431407}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="step">Mix</b></div>
  <div id="say">Tap Mix!</div>
  <div class="dock" id="dock">
    <button id="act"><span>🥣</span>Mix</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🍪</div>
    <h1>Cookie Bakery</h1>
    <p>Mix, cut, bake, sprinkle!</p>
    <button class="play" id="go" autofocus>Bake</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🍪</div>
    <h1>Yum cookie!</h1>
    <p>Warm and sweet.</p>
    <button class="play g" id="again">Bake again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, step = 0, taps = 0, bits = [];
    var STEPS = [
      { n: "Mix", e: "🥣", say: "Stir the bowl!", need: 4, btn: "Mix", be: "🥣", pop: "🥣" },
      { n: "Cut", e: "⭐", say: "Cut star cookies!", need: 3, btn: "Cut", be: "⭐", pop: "⭐" },
      { n: "Bake", e: "🍪", say: "Bake them warm!", need: 3, btn: "Bake", be: "🔥", pop: "🔥" },
      { n: "Yum", e: "🍪", say: "Sprinkle sparkles!", need: 3, btn: "Yum", be: "✨", pop: "✨" }
    ];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function showStep() {
      var s = STEPS[step];
      document.getElementById("step").textContent = s.n;
      document.getElementById("act").innerHTML = "<span>" + s.be + "</span>" + s.btn;
      kidPing(s.say);
    }
    function start() {
      play = true; step = 0; taps = 0; bits = [];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      showStep();
    }
    function act() {
      if (!play) return;
      var s = STEPS[step];
      taps++;
      bits.push({ e: s.pop, x: W * 0.5 + (Math.random() - 0.5) * 140, y: H * 0.36 + (Math.random() - 0.5) * 80, life: 1 });
      kidTap(s.pop, s.say + "  " + taps + "/" + s.need, innerWidth * 0.5, innerHeight * 0.4, 360 + taps * 50);
      if (taps >= s.need) {
        step++; taps = 0;
        if (step >= STEPS.length) {
          play = false;
          kidYay();
          document.getElementById("dock").classList.remove("on");
          document.getElementById("win").classList.remove("off");
        } else showStep();
      }
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("act").onclick = act;
    cv.addEventListener("pointerdown", act);
    function loop() {
      t += 0.016;
      x.fillStyle = "#fed7aa"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#b45309"; x.fillRect(0, H * 0.62, W, H);
      em("👨‍🍳", 70, 120, 72);
      em("🔥", W * 0.18, H * 0.72, step >= 2 ? 56 : 36);
      em("🔥", W * 0.82, H * 0.72, step >= 2 ? 56 : 36);
      var show = STEPS[Math.min(step, 3)].e;
      var bounce = 1 + Math.sin(t * 6) * 0.04;
      em(show, W * 0.5, H * 0.42, 120 * bounce);
      bits.forEach(function (b) {
        b.life -= 0.02; b.y -= 0.8;
        if (b.life > 0) { x.globalAlpha = b.life; em(b.e, b.x, b.y, 40); x.globalAlpha = 1; }
      });
      if (step >= 3) {
        em("✨", W * 0.5 - 56, H * 0.32, 44);
        em("✨", W * 0.5 + 60, H * 0.34, 40);
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
