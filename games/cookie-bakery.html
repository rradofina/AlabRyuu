<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cookie Bakery</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#431407}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="step">Mix</b></div>
  <div id="say">Tap Mix!</div>
  <div class="dock" id="dock">
    <button id="act"><span>🥣</span>Mix</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🍪</div>
    <h1>Cookie Bakery</h1>
    <p>Mix, cut, bake, sprinkle!</p>
    <button class="play" id="go">Bake</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🍪</div>
    <h1>Yum cookie!</h1>
    <p>Warm and sweet.</p>
    <button class="play g" id="again">Bake again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, step = 0, taps = 0;
    var STEPS = [
      { n: "Mix", e: "🥣", say: "Tap Mix 4 times!", need: 4, btn: "Mix", be: "🥣" },
      { n: "Cut", e: "⭐", say: "Tap Cut for star cookies!", need: 3, btn: "Cut", be: "⭐" },
      { n: "Bake", e: "🔥", say: "Tap Bake. Watch them cook!", need: 3, btn: "Bake", be: "🔥" },
      { n: "Yum", e: "✨", say: "Tap Sprinkle!", need: 3, btn: "Sprinkle", be: "✨" }
    ];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function showStep() {
      var s = STEPS[step];
      document.getElementById("step").textContent = s.n;
      document.getElementById("say").textContent = s.say;
      document.getElementById("act").innerHTML = "<span>" + s.be + "</span>" + s.btn;
    }
    function start() {
      play = true; step = 0; taps = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      showStep();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("act").onclick = function () {
      if (!play) return;
      taps++;
      document.getElementById("say").textContent = STEPS[step].say + "  " + taps + "/" + STEPS[step].need;
      if (taps >= STEPS[step].need) {
        step++; taps = 0;
        if (step >= STEPS.length) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("win").classList.remove("off");
        } else showStep();
      }
    };
    function loop() {
      t += 0.016;
      x.fillStyle = "#fed7aa"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#b45309"; x.fillRect(0, H * 0.62, W, H);
      em("👨‍🍳", 70, 120, 64);
      var show = "🥣";
      if (step === 1) show = "⭐";
      if (step === 2) show = "🍪";
      if (step >= 3) show = "🍪";
      em(show, W * 0.5, H * 0.42, 110);
      if (step >= 3) {
        em("✨", W * 0.5 - 50, H * 0.34, 40);
        em("✨", W * 0.5 + 56, H * 0.36, 36);
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
