<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var open = false;
      try { open = localStorage.getItem("alabryuu-open") === "1"; } catch (e) {}
      if (open) return;
      document.documentElement.classList.add("kid-locked");
      var path = location.pathname || "";
      document.documentElement.style.background = path.indexOf("/alonzorui") === 0 ? "#fff7ed" : "#1e1b4b";
    })();
  </script>
  <style id="kid-lock-hide">
    html.kid-locked, html.kid-locked body { overflow: hidden !important; height: 100% !important; }
    html.kid-locked body { visibility: hidden !important; }
    #kid-lock, #kid-lock * { visibility: visible !important; }
  </style>
  <script src="/kid-lock.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Color Jars</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../mix.js"></script>
  <style>
    html, body { background: #fce7f3; }
    .home { z-index: 60; }
    .dock button { font-size: 22px; }
    .dock button i { display: block; width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px; border: 3px solid #1e1b4b; background: var(--c, #fff); }
    .hero svg { width: 96px; height: 96px; display: block; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fl">0 / 6</b></div>
  <div id="say">Drag each dot into its jar</div>
  
  <div class="cover" id="title">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><rect x="12" y="28" width="18" height="40" rx="6" fill="#fecaca" stroke="#1e1b4b" stroke-width="3"/><rect x="37" y="28" width="18" height="40" rx="6" fill="#bfdbfe" stroke="#1e1b4b" stroke-width="3"/><rect x="62" y="28" width="18" height="40" rx="6" fill="#fde68a" stroke="#1e1b4b" stroke-width="3"/></svg></div>
    <h1>Color Jars</h1>
    <p>A miss snaps back.</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><rect x="12" y="28" width="18" height="40" rx="6" fill="#fecaca" stroke="#1e1b4b" stroke-width="3"/><rect x="37" y="28" width="18" height="40" rx="6" fill="#bfdbfe" stroke="#1e1b4b" stroke-width="3"/><rect x="62" y="28" width="18" height="40" rx="6" fill="#fde68a" stroke="#1e1b4b" stroke-width="3"/></svg></div>
    <h1>Every jar is full!</h1>
    <p>Red, blue, and yellow sorted.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
(function () {
  var cv = document.getElementById("c");
  var ui = Mix.boot(cv);
  var ctx, W = 0, H = 0, raf = 0;
  function layout(force) {
    var r = cv.getBoundingClientRect();
    var rw = Math.round(r.width || 0), rh = Math.round(r.height || 0);
    if (!force && ctx && Math.round(W) === rw && Math.round(H) === rh && rw > 0) return;
    var f = ui.fit();
    ctx = f.ctx; W = f.W; H = f.H;
  }
  function loop() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  function frame() {
    if (!ui.on()) return;
    layout(false);
    if (W < 2 || H < 2) { raf = requestAnimationFrame(frame); return; }
    if (step() === "stop") return;
    draw();
    raf = requestAnimationFrame(frame);
  }
  function begin() { layout(true); reset(); loop(); }
  function hud(t) {
    var el = document.getElementById("fl");
    if (el) el.textContent = t;
    var m = String(t).match(/\d+/);
    if (m) cv.dataset.score = m[0];
  }
  function sky(a, b) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ui.begin(begin);
  ui.replay(begin);
  
  var cols, chips, drag, got;
  cols = ["#ef4444", "#3b82f6", "#eab308"];
  function jars() {
    return [0, 1, 2].map(function (i) {
      return { x: W * (0.2 + i * 0.3), y: H * 0.36, ci: i };
    });
  }
  function layoutChips() {
    var spec = [0, 0, 1, 1, 2, 2], i, j, t;
    for (i = 5; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = spec[i]; spec[i] = spec[j]; spec[j] = t;
    }
    chips = [];
    for (i = 0; i < 6; i++) {
      var col = i % 3, row = Math.floor(i / 3);
      var hx = W * (0.22 + col * 0.28), hy = H * (0.66 + row * 0.14);
      chips.push({ ci: spec[i], x: hx, y: hy, hx: hx, hy: hy, in: false, back: false });
    }
  }
  function reset() { got = 0; drag = -1; layoutChips(); hud("0 / 6"); }
  function chipAt(p) {
    var i, c, best = -1, bestD = 46 * 46;
    for (i = chips.length - 1; i >= 0; i--) {
      c = chips[i];
      if (c.in) continue;
      var dx = p.x - c.x, dy = p.y - c.y, d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }
  cv.addEventListener("pointerdown", function (e) {
    if (!ui.on()) return;
    var id = chipAt(kidPt(e, cv));
    if (id < 0) return;
    drag = id; chips[id].back = false;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener("pointermove", function (e) {
    if (drag < 0 || !ui.on()) return;
    var p = kidPt(e, cv);
    chips[drag].x = p.x; chips[drag].y = p.y;
  });
  cv.addEventListener("pointerup", function () {
    if (drag < 0) return;
    var c = chips[drag]; drag = -1;
    var list = jars(), i, best = -1, bestD = 64 * 64;
    for (i = 0; i < list.length; i++) {
      var dx = c.x - list[i].x, dy = c.y - list[i].y, d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0 && best === c.ci) {
      c.in = true; c.x = list[best].x; c.y = list[best].y + 16;
      got++;
      kidNote(520 + c.ci * 40);
      hud(got + " / 6");
      kidPing("In it goes");
      if (got >= 6) { draw(); ui.finish(); }
    } else {
      c.back = true;
      kidNote(220);
      kidPing("Back it goes");
    }
  });
  function step() {
    var i;
    for (i = 0; i < chips.length; i++) {
      var c = chips[i];
      if (c.back) {
        c.x += (c.hx - c.x) * 0.2;
        c.y += (c.hy - c.y) * 0.2;
        if (Math.abs(c.x - c.hx) < 2 && Math.abs(c.y - c.hy) < 2) c.back = false;
      }
    }
    var loose = [];
    for (i = 0; i < chips.length; i++) {
      if (!chips[i].in) loose.push(Math.round(chips[i].x) + "," + Math.round(chips[i].y) + "," + chips[i].ci);
    }
    cv.dataset.chips = loose.join(";");
    cv.dataset.jars = jars().map(function (j) { return Math.round(j.x) + "," + Math.round(j.y) + "," + j.ci; }).join(";");
  }
  function draw() {
    sky("#fdf2f8", "#e0f2fe");
    var list = jars(), i;
    for (i = 0; i < list.length; i++) {
      var j = list[i];
      ctx.fillStyle = "#fff";
      Mix.box(ctx, j.x - 36, j.y - 20, 72, 92, 16); ctx.fill(); Mix.ink(ctx);
      ctx.fillStyle = cols[i];
      ctx.globalAlpha = 0.85;
      Mix.box(ctx, j.x - 26, j.y + 16, 52, 46, 10); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = cols[i]; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(j.x, j.y - 8, 16, Math.PI, 0); ctx.stroke();
    }
    for (i = 0; i < chips.length; i++) {
      var c = chips[i];
      ctx.fillStyle = cols[c.ci];
      ctx.beginPath(); ctx.arc(c.x, c.y, 24, 0, Math.PI * 2); ctx.fill(); Mix.ink(ctx);
    }
  }

  layout(true);
  if (W > 2) { reset(); draw(); }
  addEventListener("resize", function () { layout(true); if (W > 2) draw(); });
})();
  </script>
</body>
</html>
