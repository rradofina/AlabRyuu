<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Forest Story</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#14532d;touch-action:manipulation}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;background:linear-gradient(#86efac,#166534);padding:58px 16px 28px;text-align:center}
    .home{position:fixed;top:12px;left:12px;z-index:9;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    .card{max-width:420px;margin:0 auto;background:#fffbeb;border-radius:32px;padding:22px 18px 24px;box-shadow:0 12px 0 #365314}
    .art{font-size:88px;line-height:1;margin:6px 0 10px}
    h1{font-size:28px;margin-bottom:8px}
    p{font-size:20px;line-height:1.4;min-height:4.2em}
    .row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
    .row button{background:#bbf7d0;color:#14532d;font-weight:800;font-size:20px;padding:14px 16px;border-radius:20px;box-shadow:0 6px 0 #15803d}
    .row button:active{transform:translateY(3px);box-shadow:0 3px 0 #15803d}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div class="card">
    <div class="art" id="art">🌲</div>
    <h1 id="title">Forest Story</h1>
    <p id="line"></p>
    <div class="row" id="row"></div>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var pages={
      start:{art:"🦊",t:"Pip the Fox",line:"One sunny morning, a little fox named Pip found a shiny gold leaf. It wiggled. “Follow me to a picnic!” it said.",next:[{l:"Follow the leaf 🍃",to:"leaf"},{l:"Follow a butterfly 🦋",to:"fly"}]},
      leaf:{art:"🍃",t:"The Whisper Path",line:"The leaf bounced down a mossy path. Birds sang, “Pip, Pip, hello!” A squirrel dropped a berry hat on Pip’s head.",next:[{l:"Wear the berry hat",to:"hat"},{l:"Give it back",to:"give"}]},
      fly:{art:"🦋",t:"Blue Wings",line:"The butterfly led Pip to a puddle that looked like a tiny sky. “Want to skip stones or look for frogs?” asked a turtle.",next:[{l:"Skip a stone",to:"stone"},{l:"Look for frogs",to:"frog"}]},
      hat:{art:"🎩",t:"Berry Fancy",line:"Pip looked so fancy that bees danced a circle. “Come to our flower table!” they buzzed. Honey cakes waited on a stump.",next:[{l:"Sit and nibble",to:"endPicnic"}]},
      give:{art:"🐿️",t:"Kind Pip",line:"The squirrel hugged Pip. “You are a good friend.” They shared acorn cookies under a tall oak.",next:[{l:"Share a cookie",to:"endPicnic"}]},
      stone:{art:"🪨",t:"Plip Plop",line:"The stone made silver rings. A frog popped up wearing a leaf bow tie. “Party at the pond!”",next:[{l:"Go to the pond party",to:"endPond"}]},
      frog:{art:"🐸",t:"Hidden Choir",line:"Three frogs sang a silly song about bugs that tickle. Pip laughed so hard the trees waved along.",next:[{l:"Sing with them",to:"endPond"}]},
      endPicnic:{art:"🥡",t:"A Happy Picnic",line:"Friends sat in a circle: fox, squirrel, bees, and a sleepy owl. They ate berries and told jokes until the sun felt warm and sleepy. The end.",next:[{l:"Read again",to:"start"}]},
      endPond:{art:"🎉",t:"Pond Party",line:"The pond sparkled. Frogs drummed lily pads. Pip taught everyone a fox jig. Nobody won. Everybody giggled. The end.",next:[{l:"Read again",to:"start"}]}
    };
    function show(id){
      var p=pages[id];document.getElementById("art").textContent=p.art;document.getElementById("title").textContent=p.t;document.getElementById("line").textContent=p.line;
      var row=document.getElementById("row");row.innerHTML="";
      p.next.forEach(function(n){var b=document.createElement("button");b.textContent=n.l;b.onclick=function(){beep(id.indexOf("end")===0?880:520,.1);show(n.to);};row.appendChild(b);});
    }
    show("start");
  </script>
</body>
</html>
