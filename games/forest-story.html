<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Forest Story</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>
    html,body{background:#14532d}
    .choice{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;display:none;gap:16px}
    .choice.on{display:flex}
    .choice button{min-width:150px;min-height:130px;border-radius:28px;background:#fff;color:#14532d;font-weight:900;font-size:18px;box-shadow:0 8px 0 #166534}
    .choice button span{display:block;font-size:64px;line-height:1}
    #scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px 170px;text-align:center}
    #pic{font-size:110px;line-height:1;margin-bottom:12px}
    #line{font-size:28px;font-weight:900;color:#fff;max-width:16ch;text-shadow:0 3px 0 #052e16}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="st">⭐ 0</b></div>
  <div id="scene">
    <div id="pic">🌲</div>
    <div id="line">A walk in the trees.</div>
  </div>
  <div class="choice" id="choice">
    <button id="a"><span>🦊</span><b id="at">Help fox</b></button>
    <button id="b"><span>🍓</span><b id="bt">Pick berries</b></button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🦊</div>
    <h1>Forest Story</h1>
    <p>Pick a path. Help forest friends!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🌙</div>
    <h1>Home by moonlight</h1>
    <p id="wp">A kind walk.</p>
    <button class="play g" id="again">Walk again</button>
  </div>
  <script>
  (function () {
    var stars = 0, si = 0, flags = {};
    var SCENES = [
      { pic: "🌲", line: "A path in the trees.", a: { e: "🦊", t: "Help fox", next: 1, flag: "fox" }, b: { e: "🍓", t: "Pick berries", next: 2, flag: "berry" } },
      { pic: "🦊", line: "Fox lost a sock!", a: { e: "🧦", t: "Give sock", next: 3, flag: "kind" }, b: { e: "🗺️", t: "Show map", next: 3, flag: "map" } },
      { pic: "🍓", line: "Sweet red berries.", a: { e: "🐦", t: "Share birds", next: 3, flag: "share" }, b: { e: "🧺", t: "Fill basket", next: 3, flag: "basket" } },
      { pic: "🌊", line: "A sparkly creek.", a: { e: "🪵", t: "Make bridge", next: 4, flag: "bridge" }, b: { e: "🐸", t: "Ask frog", next: 4, flag: "frog" } },
      { pic: "🦉", line: "Owl says night comes.", a: { e: "🏡", t: "Walk home", next: 5, flag: "home" }, b: { e: "⭐", t: "Wish star", next: 5, flag: "wish" } },
      { pic: "🌙", line: "The forest says thanks.", a: { e: "💛", t: "Wave bye", next: -1, flag: "bye" }, b: { e: "🎵", t: "Sing song", next: -1, flag: "song" } }
    ];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-forest") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function hud() { document.getElementById("st").textContent = "⭐ " + stars; }
    function show(i) {
      si = i;
      var s = SCENES[i];
      document.getElementById("pic").textContent = s.pic;
      document.getElementById("line").textContent = s.line;
      document.getElementById("a").querySelector("span").textContent = s.a.e;
      document.getElementById("at").textContent = s.a.t;
      document.getElementById("b").querySelector("span").textContent = s.b.e;
      document.getElementById("bt").textContent = s.b.t;
      document.getElementById("choice").classList.add("on");
    }
    function pick(side) {
      var s = SCENES[si], ch = s[side];
      flags[ch.flag] = 1; stars++;
      try { localStorage.setItem("alabryuu-forest", JSON.stringify({ stars: stars, scene: si, flags: flags })); } catch (e) {}
      hud();
      if (ch.next < 0) {
        document.getElementById("choice").classList.remove("on");
        document.getElementById("wp").textContent = "⭐ " + stars + "  Kind forest walk.";
        document.getElementById("win").classList.remove("off");
      } else show(ch.next);
    }
    function start() {
      flags = {}; si = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      show(0); hud();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("a").onclick = function () { pick("a"); };
    document.getElementById("b").onclick = function () { pick("b"); };
    hud();
  })();
  </script>
</body>
</html>
