<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Orbit Dock</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#1e1b4b}</style>
</head>
<body>
<script>
kidChrome({
  title: "Orbit Dock",
  hero: "🌙",
  blurb: "Tap when the moon kisses the sparkle!",
  say: "Watch the moon!",
  hud: "🌙 0/5",
  winHero: "🪐",
  winTitle: "Docked!",
  winText: "Five moons home.",
  again: "Orbit again",
  bg: "#1e1b4b"
});
(function () {
  var S = kidStage();
  var FACES = ["🌙", "🌕", "⭐", "🪐", "✨"];
  var play = false, n = 0, ang = 0, said = "";
  var dock = -Math.PI / 2;
  function diff() {
    var d = Math.atan2(Math.sin(ang - dock), Math.cos(ang - dock));
    return Math.abs(d);
  }
  function note(k, m) { if (said === k) return; said = k; kidSay(m); }
  function pos(a, r) { return { x: S.W * 0.5 + Math.cos(a) * r, y: S.H * 0.48 + Math.sin(a) * r }; }
  function start() { play = true; n = 0; ang = 0; said = ""; kidBegin("Watch the moon!", "🌙 0/5"); }
  kidBind(start);
  S.cv.addEventListener("pointerdown", function () {
    if (!play) return;
    if (diff() < 0.62) {
      n++; said = "";
      kidTap(FACES[(n - 1) % FACES.length], "Docked!  " + n + "/5", S.W * 0.5, S.H * 0.28, 600);
      if (kidMark(n, 5, "🌙")) { play = false; kidFinish("Five moons home."); }
    } else kidMiss("🌙", "Wait till they kiss!", S.W * 0.5, S.H * 0.3);
  });
  kidTick(function (dt) {
    if (play) {
      ang += dt * 1.35;
      note(diff() < 0.62 ? "go" : "wait", diff() < 0.62 ? "TAP!" : "Watch...");
    }
    var r = Math.min(S.W, S.H) * 0.28;
    S.bg("#0f172a");
    S.em("🌍", S.W * 0.5, S.H * 0.48, 110);
    var d = pos(dock, r);
    S.em(diff() < 0.62 ? "✨" : "⭐", d.x, d.y, diff() < 0.62 ? 72 : 48);
    var m = pos(ang, r);
    S.em(FACES[n % FACES.length], m.x, m.y, 80);
  });
})();
</script>
</body>
</html>
