<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Treasure Path</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#431407}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="st">⭐ 0</b></div>
  <div id="say">Tap the glowing stone!</div>
  <div class="cover" id="title">
    <div class="hero">⭐</div>
    <h1>Treasure Path</h1>
    <p>Tap the next glowing stone.</p>
    <button class="play" id="go" autofocus>Walk</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">💎</div>
    <h1>Treasure!</h1>
    <p id="wp">You found it.</p>
    <button class="play g" id="again">Walk again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, step = 0, stars = 0, flags = {};
    var stones = [];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-treasure") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function em(ch, px, py, s) { kidEm(x, ch, px, py, s); }
    function resize() { var b = kidFit(cv, x); W = b.W; H = b.H; }
    addEventListener("resize", resize); resize();
    function layout() {
      stones = [
        { x: 0.22, y: 0.72, e: "🪨" },
        { x: 0.50, y: 0.60, e: "🪨" },
        { x: 0.30, y: 0.46, e: "🪨" },
        { x: 0.62, y: 0.36, e: "🪨" },
        { x: 0.48, y: 0.22, e: "💎" }
      ];
    }
    function hud() { document.getElementById("st").textContent = "⭐ " + stars; }
    function start() {
      play = true; step = 0; flags = {}; layout();
      kidBegin();
      document.getElementById("say").textContent = "Tap the glowing stone!";
      hud();
    }
    kidBind(start);
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var i, best = -1, bestD = 120 * 120;
      for (i = 0; i < stones.length; i++) {
        var dx = kidPt(e, cv).x - stones[i].x * W, dy = kidPt(e, cv).y - stones[i].y * H;
        var d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best < 0) best = step;
      if (best === step || true) {
        if (best !== step) best = step;
        stars++; flags["s" + step] = 1; step++;
        try { localStorage.setItem("alabryuu-treasure", JSON.stringify({ stars: stars, scene: step, flags: flags })); } catch (err) {}
        hud();
        kidTap(step >= stones.length ? "💎" : "✨", "Yes! Next glow.", stones[Math.min(step, stones.length - 1)].x * innerWidth, stones[Math.min(step, stones.length - 1)].y * innerHeight, 500);
        if (step >= stones.length) {
          play = false;
                    document.getElementById("wp").textContent = "⭐ " + stars + "  Sparkly treasure!";
          kidFinish();
        }
      } else {
        document.getElementById("say").textContent = "Not that one. The glow!";
      }
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#7c2d12"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#166534"; x.fillRect(0, H * 0.78, W, H * 0.22);
      em("🌴", 40, H * 0.72, 64); em("🌴", W - 40, H * 0.70, 72);
      for (var i = 0; i < stones.length; i++) {
        var s = stones[i], px = s.x * W, py = s.y * H;
        if (i === step && play) {
          x.beginPath(); x.arc(px, py, 46 + Math.sin(t * 6) * 6, 0, Math.PI * 2);
          x.fillStyle = "rgba(253,224,71,0.45)"; x.fill();
        }
        em(i < step ? "⭐" : s.e, px, py, i === stones.length - 1 ? 88 : 72);
      }
      if (play && step < stones.length) em("🧒", stones[Math.max(0, step - 1)].x * W, stones[Math.max(0, step - 1)].y * H - 50, 56);
      requestAnimationFrame(loop);
    }
    layout();
    requestAnimationFrame(loop);
    hud();
  })();
  </script>
</body>
</html>
