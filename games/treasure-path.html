<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Treasure Path</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#431407;touch-action:manipulation}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 80% 10%,#fde68a,transparent 30%),
        linear-gradient(#fef3c7,#f59e0b 55%,#92400e);
      padding:56px 10px 110px;
    }
    .home{position:fixed;top:12px;left:12px;z-index:12;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    .sheet{
      max-width:440px;margin:0 auto;position:relative;
      background:#f5e6c4;
      background-image:
        repeating-linear-gradient(0deg,transparent 0 31px,rgba(180,83,9,.08) 31px 32px);
      border-radius:8px;
      padding:16px 14px 18px;
      box-shadow:0 0 0 10px #d6b57a,0 16px 0 #92400e;
    }
    .sheet::after{
      content:"";position:absolute;inset:-6px;pointer-events:none;
      background:
        radial-gradient(circle at 0 0,transparent 14px,#d6b57a 15px),
        radial-gradient(circle at 100% 0,transparent 14px,#d6b57a 15px);
      background-size:20px 20px;background-repeat:no-repeat;background-position:left top,right top;
    }
    .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    h1{font-size:26px;color:#7c2d12}
    .compass{
      width:64px;height:64px;border-radius:50%;
      background:conic-gradient(#b45309 0 25%,#fde68a 0 50%,#b45309 0 75%,#fde68a 0);
      display:grid;place-items:center;border:4px solid #78350f;
      box-shadow:0 4px 0 #92400e;
    }
    .compass i{width:40px;height:40px;border-radius:50%;background:#fffbeb;display:grid;place-items:center;font-size:22px;font-weight:800;color:#9a3412}
    .mission{
      background:#fff7ed;border:3px dashed #b45309;border-radius:14px;
      padding:8px 10px;font-weight:800;font-size:16px;margin-bottom:10px;
    }
    .mission li{list-style:none;margin:3px 0}
    .mission .ok{color:#15803d}
    .map{
      position:relative;height:340px;
      background:
        radial-gradient(ellipse at 50% 20%,#86efac 0 28px,transparent 40px),
        radial-gradient(ellipse at 28% 58%,#fde68a 0 36px,transparent 50px),
        radial-gradient(ellipse at 72% 82%,#fdba74 0 40px,transparent 56px),
        #e8d5a3;
      border:4px solid #b45309;border-radius:18px;overflow:hidden;
    }
    .path{
      position:absolute;left:50%;width:6px;background:#b45309;opacity:.35;border-radius:4px;
    }
    .isle{
      position:absolute;width:118px;transform:translateX(-50%);
      text-align:center;
    }
    .isle h3{font-size:14px;font-weight:800;margin-bottom:4px}
    .tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .tile{
      width:52px;height:52px;border-radius:14px;
      background:#78716c;color:#fff;font-size:26px;
      box-shadow:0 4px 0 #44403c;font-weight:800;
    }
    .tile.fog{background:#a8a29e}
    .tile.open{background:#fffbeb;color:#431407;box-shadow:0 4px 0 #d97706}
    .tile.fun{background:#fde68a}
    .tile.here{outline:3px solid #16a34a}
    .tile:active{transform:translateY(2px)}
    .i1{left:50%;top:12px}
    .i2{left:28%;top:118px}
    .i3{left:72%;top:210px}
    .msg{min-height:2.6em;font-weight:800;font-size:20px;text-align:center;margin-top:10px}
    .pack{
      position:fixed;left:0;right:0;bottom:0;z-index:10;
      background:#78350f;color:#fef3c7;
      display:flex;justify-content:center;gap:16px;padding:10px 12px 16px;
      font-weight:800;
    }
    .pack .bit{background:rgba(255,255,255,.1);border-radius:14px;padding:8px 16px;min-width:90px;text-align:center}
    .pack .bit b{display:block;font-size:26px}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(69,26,3,.88);z-index:20;gap:10px;color:#fff;padding:20px;text-align:center}
    .win.on{display:flex}
    .stickers{font-size:42px;letter-spacing:8px}
    .win button{
      background:#ffd166;color:#3b2100;font-weight:800;font-size:22px;
      padding:14px 22px;border-radius:999px;box-shadow:0 6px 0 #e09f1f;margin:4px;
    }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div class="sheet">
    <div class="head">
      <h1>Treasure Path</h1>
      <div class="compass"><i>N</i></div>
    </div>
    <ul class="mission" id="mission"></ul>
    <div class="map" id="map">
      <div class="path" style="top:70px;height:70px"></div>
      <div class="path" style="top:200px;left:50%;height:40px;transform:rotate(28deg);transform-origin:top"></div>
      <div class="isle i1" id="isle-bridge"></div>
      <div class="isle i2" id="isle-cave"></div>
      <div class="isle i3" id="isle-hill"></div>
    </div>
    <p class="msg" id="msg">Tap fog. Find the way!</p>
  </div>
  <div class="pack">
    <div class="bit"><b id="keys">🔑 0</b>Keys</div>
    <div class="bit"><b id="stars">⭐ 0</b>Stars</div>
  </div>
  <div class="win" id="win">
    <div style="font-size:72px">🎁</div>
    <h2>Sticker treasure!</h2>
    <div class="stickers" id="st">⭐🌟⭐</div>
    <p id="winline" style="font-weight:800;font-size:20px"></p>
    <div>
      <button id="again">Play again</button>
      <button id="nexti">Next island</button>
    </div>
  </div>
  <script>
    function beep(f,d){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var layouts=[
      {order:["bridge","cave","hill"],names:{bridge:"Flower Bridge",cave:"Cookie Cave",hill:"Kind Hill"}},
      {order:["cave","hill","bridge"],names:{bridge:"Sunny Bridge",cave:"Glow Cave",hill:"Hat Hill"}}
    ];
    var layout=0,keys=0,stars=0,here="bridge",opened={},done={};
    var tiles={
      bridge:[
        {id:"b1",fog:1,icon:"🌸",ok:1,go:"cave",txt:"Flowers smell sweet.",key:1},
        {id:"b2",fog:1,icon:"🪵",ok:0,txt:"Log is napping. Shhh!",fun:1}
      ],
      cave:[
        {id:"c1",fog:1,icon:"🍪",ok:1,go:"hill",txt:"Cookie path winks.",star:1},
        {id:"c2",fog:1,icon:"🥦",ok:0,txt:"Broccoli high-fives you!",fun:1}
      ],
      hill:[
        {id:"h1",fog:1,icon:"⭐",ok:1,win:1,txt:"The chest hums a song.",key:1},
        {id:"h2",fog:1,icon:"🎩",ok:0,txt:"Silly wizard hat!",fun:1}
      ]
    };
    function resetTiles(){
      ["bridge","cave","hill"].forEach(function(k){
        tiles[k].forEach(function(t){t.fog=1;});
      });
      opened={};done={};here=layouts[layout].order[0];
    }
    function missions(){
      var names=layouts[layout].names;
      var steps=[
        {k:"bridge",l:"Cross "+names.bridge},
        {k:"cave",l:"Peek in "+names.cave},
        {k:"hill",l:"Get the humming chest"}
      ];
      document.getElementById("mission").innerHTML=steps.map(function(s){
        return "<li class='"+(done[s.k]?"ok":"")+"'>"+(done[s.k]?"✅":"☐")+" "+s.l+"</li>";
      }).join("");
    }
    function pack(){
      document.getElementById("keys").textContent="🔑 "+keys;
      document.getElementById("stars").textContent="⭐ "+stars;
    }
    function drawIsle(name){
      var names=layouts[layout].names;
      var el=document.getElementById("isle-"+name);
      var row=tiles[name];
      el.innerHTML="<h3>"+names[name]+"</h3><div class='tiles'></div>";
      var box=el.querySelector(".tiles");
      row.forEach(function(t){
        var b=document.createElement("button");
        b.className="tile"+(t.fog?" fog":" open")+(t.fun&&!t.fog?" fun":"")+(here===name?" here":"");
        b.textContent=t.fog?"🌫️":t.icon;
        b.onclick=function(){tap(name,t);};
        box.appendChild(b);
      });
    }
    function draw(){
      ["bridge","cave","hill"].forEach(drawIsle);
      missions();pack();
    }
    function tap(isle,t){
      if(layouts[layout].order.indexOf(isle)>layouts[layout].order.indexOf(here)&&!done[here]){
        document.getElementById("msg").textContent="This island first →";
        beep(200,.08);return;
      }
      if(t.fog){
        t.fog=0;beep(420,.08);
        document.getElementById("msg").textContent="Fog gone!";
        draw();return;
      }
      if(t.ok){
        if(t.key){keys++;beep(720,.1);}
        if(t.star){stars++;beep(800,.1);}
        done[isle]=1;
        if(t.win){
          if(keys<1){document.getElementById("msg").textContent="Need a key 🔑";beep(220,.1);draw();return;}
          document.getElementById("msg").textContent=t.txt;
          draw();
          setTimeout(win,500);
          return;
        }
        here=t.go;
        document.getElementById("msg").textContent=t.txt;
        beep(600,.1);
        draw();
        return;
      }
      document.getElementById("msg").textContent=t.txt+" Try the other tile.";
      beep(320,.1);
      draw();
    }
    function win(){
      document.getElementById("st").textContent="⭐🌟⭐ 🎁 🔑";
      document.getElementById("winline").textContent=keys+" keys · "+stars+" stars";
      document.getElementById("win").classList.add("on");
      beep(880,.2);
    }
    document.getElementById("again").onclick=function(){
      layout=0;keys=0;stars=0;resetTiles();
      document.getElementById("win").classList.remove("on");
      document.getElementById("msg").textContent="Tap fog. Find the way!";
      draw();
    };
    document.getElementById("nexti").onclick=function(){
      layout=1-layout;keys=0;stars=0;resetTiles();
      document.getElementById("win").classList.remove("on");
      document.getElementById("msg").textContent="New map! Tap fog.";
      draw();
    };
    resetTiles();draw();
  </script>
</body>
</html>
