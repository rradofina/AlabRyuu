<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Treasure Path</title>
  <script src="../vendor/three.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:Verdana,system-ui,sans-serif;background:#431407;color:#fff7ed;touch-action:none;user-select:none}
    button{background:transparent;border:0;appearance:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .home{position:fixed;top:12px;left:12px;z-index:8;color:#fff;text-decoration:none;font-weight:800;background:rgba(0,0,0,.4);padding:8px 14px;border-radius:999px}
    #hud{position:fixed;top:12px;right:12px;z-index:8;font-weight:800;text-align:right;pointer-events:none}
    #hud b{display:inline-block;background:#fef3c7;color:#7c2d12;padding:6px 10px;border-radius:999px;margin-left:6px}
    .panel{position:fixed;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));z-index:8;background:#7c2d12ee;border:3px solid #fde047;border-radius:20px;padding:12px;display:none}
    .panel.on{display:block}
    .who{font-size:13px;opacity:.8}
    .say{font-size:22px;font-weight:900;margin:4px 0 10px}
    .chs{display:flex;flex-wrap:wrap;gap:8px}
    .chs button{min-height:52px;flex:1;border-radius:14px;background:#ffd166;color:#3b2100;font-weight:900;font-size:16px}
    .cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;background:linear-gradient(#f59e0b,#431407)}
    .cover.off{display:none}
    h1{font-size:clamp(32px,8vw,50px)}
    .btn{background:#ffd166;color:#3b2100;font-weight:800;font-size:24px;padding:14px 26px;border-radius:999px;box-shadow:0 7px 0 #e09f1f}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="sc">Start</b><b id="st">⭐ 0</b></div>
  <div class="panel on" id="panel">
    <div class="who" id="who">Pip</div>
    <p class="say" id="say">A map wiggles. Walk?</p>
    <div class="chs" id="chs"></div>
  </div>
  <div class="cover" id="title">
    <h1>Treasure Path</h1>
    <p>3D island. Lantern glow.<br>Choices change the path.</p>
    <button class="btn" id="go">Walk</button>
  </div>
  <div class="cover off" id="win">
    <h1>Cozy chest</h1>
    <p id="wp">The island is home.</p>
    <button class="btn" id="again">Walk again</button>
  </div>
  <script>
  (function () {
    if (!window.THREE) return;
    var T = THREE, play = false, si = 0, stars = 0, t = 0;
    var flags = { friend: "Pip", cave: false, boat: false, kind: 0, lantern: false };
    try {
      var sv = JSON.parse(localStorage.getItem("alabryuu-treasure") || "{}");
      if (sv.stars) stars = sv.stars;
      if (sv.flags) flags = Object.assign(flags, sv.flags);
    } catch (e) {}

    var scene = new T.Scene();
    scene.background = new T.Color(0x7dd3fc);
    scene.fog = new T.Fog(0x7dd3fc, 14, 36);
    var cam = new T.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 80);
    var renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    document.body.appendChild(renderer.domElement);
    scene.add(new T.HemisphereLight(0xfff1c1, 0x7c2d12, 0.75));
    var sun = new T.DirectionalLight(0xfff1c1, 0.85); sun.position.set(6, 10, 4); scene.add(sun);
    var lamp = new T.PointLight(0xfde047, 0.2, 8); scene.add(lamp);

    var island = new T.Mesh(new T.CylinderGeometry(8, 9, 1.2, 20), new T.MeshLambertMaterial({ color: 0xca8a04 }));
    island.position.y = -0.6; scene.add(island);
    var grass = new T.Mesh(new T.CylinderGeometry(7.4, 7.4, 0.2, 20), new T.MeshLambertMaterial({ color: 0x65a30d }));
    grass.position.y = 0.05; scene.add(grass);
    var water = new T.Mesh(new T.PlaneGeometry(40, 40), new T.MeshLambertMaterial({ color: 0x38bdf8 }));
    water.rotation.x = -Math.PI / 2; water.position.y = -0.9; scene.add(water);
    for (var i = 0; i < 10; i++) {
      var tree = new T.Group();
      var tr = new T.Mesh(new T.CylinderGeometry(0.1, 0.14, 1.1, 6), new T.MeshLambertMaterial({ color: 0x7c2d12 }));
      tr.position.y = 0.6; tree.add(tr);
      var lf = new T.Mesh(new T.SphereGeometry(0.55, 8, 6), new T.MeshLambertMaterial({ color: 0x166534 }));
      lf.position.y = 1.3; tree.add(lf);
      var a = i / 10 * Math.PI * 2;
      tree.position.set(Math.cos(a) * 5.4, 0, Math.sin(a) * 5.4);
      scene.add(tree);
    }
    var cave = new T.Mesh(new T.SphereGeometry(1.4, 12, 8), new T.MeshLambertMaterial({ color: 0x44403c }));
    cave.scale.set(1, 0.7, 1.1); cave.position.set(-3.2, 0.5, -2.4); scene.add(cave);
    var chest = new T.Group();
    var box = new T.Mesh(new T.BoxGeometry(0.7, 0.4, 0.45), new T.MeshLambertMaterial({ color: 0xb45309 }));
    box.position.y = 0.25; chest.add(box);
    var lid = new T.Mesh(new T.BoxGeometry(0.72, 0.12, 0.46), new T.MeshLambertMaterial({ color: 0xf59e0b }));
    lid.position.set(0, 0.5, 0); chest.add(lid);
    chest.position.set(2.4, 0, -1.6); scene.add(chest);
    var boat = new T.Mesh(new T.BoxGeometry(1.4, 0.28, 0.5), new T.MeshLambertMaterial({ color: 0x92400e }));
    boat.position.set(6.6, -0.5, 1.2); scene.add(boat);

    function buddy(col) {
      var g = new T.Group();
      var b = new T.Mesh(new T.SphereGeometry(0.18, 10, 8), new T.MeshLambertMaterial({ color: col }));
      b.scale.set(1, 1.15, 0.8); b.position.y = 0.55; g.add(b);
      var h = new T.Mesh(new T.SphereGeometry(0.13, 8, 8), new T.MeshLambertMaterial({ color: 0xffe0b0 }));
      h.position.y = 0.82; g.add(h);
      var legs = [];
      for (var s = -1; s <= 1; s += 2) {
        var hip = new T.Group(); hip.position.set(s * 0.07, 0.36, 0);
        var th = new T.Mesh(new T.BoxGeometry(0.07, 0.22, 0.07), new T.MeshLambertMaterial({ color: 0x7c2d12 }));
        th.position.y = -0.1; hip.add(th);
        g.add(hip); legs.push(hip);
      }
      var lantern = new T.Mesh(new T.SphereGeometry(0.07, 8, 8), new T.MeshBasicMaterial({ color: 0xfde047 }));
      lantern.position.set(0.22, 0.5, 0.1); g.add(lantern);
      g.userData = { legs: legs, lantern: lantern, head: h };
      return g;
    }
    var hero = buddy(0xf97316); scene.add(hero);
    var pal = buddy(0x38bdf8); pal.position.set(0.7, 0, 0.4); scene.add(pal);
    var look = new T.Vector3(0, 0.4, 0);

    var SCENES = [
      { who: "Pip", say: "A map wiggles!", ch: [["Follow map", { path: "map" }], ["Ask the boat", { boat: true }]] },
      { who: "Map", say: "Two soft paths.", ch: [["Cave glow", { cave: true }], ["Beach walk", {}]] },
      { who: "Pip", say: flags.cave ? "Dark but kind." : "Sand tickles.", ch: [["Light lantern", { lantern: true }], ["Hold pal hand", { friend: "Pal" }]] },
      { who: "Crab", say: "I lost a shiny.", ch: [["Help crab", { kind: 1 }], ["Wave and go", {}]] },
      { who: "Pip", say: "A twist! Fog!", ch: [["Sing a song", {}], ["Stay close", {}]] },
      { who: "Owl", say: "Who helped Crab?", ch: [["We did!", {}], ["Ask Pip", {}]] },
      { who: "Pip", say: flags.boat ? "Boat waits." : "Feet can walk.", ch: [["Ride boat", { boat: true }], ["Keep walking", {}]] },
      { who: "Chest", say: "Need a kind key.", ch: [["Share berry", { kind: 1 }], ["Draw a smile", {}]] },
      { who: "Pip", say: "Almost home sand.", ch: [["Open slow", {}], ["Call friends", {}]] },
      { who: "All", say: "Cozy gold. Hug?", ch: [["Hug everyone", {}], ["Sit and rest", {}]] },
      { who: "Pip", say: "The end. Warm.", ch: [["Play again", { end: true }]] }
    ];

    function save() {
      try { localStorage.setItem("alabryuu-treasure", JSON.stringify({ stars: stars, scene: si, flags: flags })); } catch (e) {}
    }
    function show() {
      var s = SCENES[Math.min(si, SCENES.length - 1)];
      if (si === 2) s.say = flags.cave ? "Dark but kind." : "Sand tickles.";
      if (si === 6) s.say = flags.boat ? "Boat waits." : "Feet can walk.";
      document.getElementById("who").textContent = s.who;
      document.getElementById("say").textContent = s.say;
      document.getElementById("sc").textContent = "Beat " + (si + 1) + "/11";
      document.getElementById("st").textContent = "⭐ " + stars;
      var box = document.getElementById("chs");
      box.innerHTML = "";
      s.ch.forEach(function (pair) {
        var b = document.createElement("button");
        b.textContent = pair[0];
        b.onclick = function () {
          Object.assign(flags, pair[1]);
          if (pair[1].kind) stars += 1;
          if (pair[1].end) {
            document.getElementById("wp").textContent = "You walked with " + (flags.friend || "Pip") + (flags.kind ? " and helped Crab." : ".");
            document.getElementById("win").classList.remove("off");
            document.getElementById("panel").classList.remove("on");
            si = 0;
          } else { si++; stars++; }
          save();
          if (!pair[1].end) show();
        };
        box.appendChild(b);
      });
    }

    function start() {
      play = true; si = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("panel").classList.add("on");
      show();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;

    var clock = new T.Clock();
    function tick() {
      var dt = Math.min(0.033, clock.getDelta());
      t += dt;
      var dest = flags.cave ? cave.position : (si > 7 ? chest.position : (flags.boat ? boat.position : new T.Vector3(0, 0, 0)));
      hero.position.x += (dest.x * 0.35 - hero.position.x) * 0.03;
      hero.position.z += (dest.z * 0.35 - hero.position.z) * 0.03;
      pal.position.x = hero.position.x + 0.7;
      pal.position.z = hero.position.z + 0.35;
      [hero, pal].forEach(function (p) {
        p.userData.legs.forEach(function (hip, i) {
          hip.rotation.x = Math.sin(t * 8 + i * 3) * 0.7;
        });
        p.userData.head.rotation.y = Math.sin(t * 2) * 0.15;
        p.userData.lantern.visible = !!flags.lantern;
      });
      lamp.position.copy(hero.position); lamp.position.y = 1;
      lamp.intensity = flags.lantern ? 1.4 : 0.15;
      scene.background.set(flags.lantern && flags.cave ? 0x1c1917 : 0x7dd3fc);
      chest.children[1].rotation.x = si > 8 ? -0.8 : 0;
      boat.position.y = -0.5 + Math.sin(t) * 0.06;
      cam.position.lerp(new T.Vector3(hero.position.x + 3.2, 4.2, hero.position.z + 6), 0.05);
      look.lerp(hero.position, 0.08); look.y = 0.5;
      cam.lookAt(look);
      renderer.render(scene, cam);
      requestAnimationFrame(tick);
    }
    addEventListener("resize", function () {
      cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    show();
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
