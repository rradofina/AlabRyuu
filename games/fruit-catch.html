<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Fruit Catch</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#14532d}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="got">🍉 0/10</b></div>
  <div id="say">Drag the basket. Catch fruit!</div>
  <div class="cover" id="title">
    <div class="hero">🍉</div>
    <h1>Fruit Catch</h1>
    <p>Move the basket. Catch 10 fruits!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🧺</div>
    <h1>Fruit pile!</h1>
    <p>Ten yummy catches.</p>
    <button class="play g" id="again">Catch again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, n = 0, basket = 0.5, fruit = [];
    var KINDS = ["🍎", "🍌", "🍇", "🍊", "🍉"];
    function em(ch, px, py, s) { kidEm(x, ch, px, py, s); }
    function resize() { var b = kidFit(cv, x); W = b.W; H = b.H; }
    addEventListener("resize", resize); resize();
    function spawn() { fruit.push({ e: KINDS[(Math.random() * KINDS.length) | 0], x: 0.15 + Math.random() * 0.7, y: -0.05, vy: 0.16 + Math.random() * 0.08 }); }
    function start() {
      play = true; n = 0; fruit = []; basket = 0.5;
      fruit.push({ e: "🍎", x: 0.3, y: 0.15, vy: 0.32 });
      fruit.push({ e: "🍌", x: 0.7, y: 0.02, vy: 0.28 });
      kidBegin();
      document.getElementById("got").textContent = "🍉 0/10";
      document.getElementById("say").textContent = "Drag the basket!";
    }
    kidBind(start);
    cv.addEventListener("pointermove", function (e) {
      if (!play) return;
      basket = Math.max(0.12, Math.min(0.88, kidPt(e, cv).x / W));
    });
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var p = kidPt(e, cv);
      basket = Math.max(0.12, Math.min(0.88, p.x / W));
      for (var i = fruit.length - 1; i >= 0; i--) {
        var dx = p.x - fruit[i].x * W, dy = p.y - fruit[i].y * H;
        if (dx * dx + dy * dy < 80 * 80) {
          var got = fruit.splice(i, 1)[0]; n++;
          document.getElementById("got").textContent = "🍉 " + n + "/10";
          kidTap(got.e, "Yum!  " + n + "/10", p.x, p.y, 500);
          if (n >= 10) { play = false; kidFinish(); }
          return;
        }
      }
      kidNote(300);
    });
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      x.fillStyle = "#86efac"; x.fillRect(0, 0, W, H);
      em("🌳", 40, 120, 64); em("☀️", W - 50, 80, 56);
      if (play) {
        if (fruit.length < 3 && Math.random() < 0.04) spawn();
        fruit.forEach(function (f) { f.y += f.vy * dt; });
        var by = H * 0.78;
        for (var i = fruit.length - 1; i >= 0; i--) {
          var f = fruit[i], fx = f.x * W, fy = f.y * H;
          if (Math.abs(fx - basket * W) < 120 && fy > by - 70 && fy < by + 56) {
            fruit.splice(i, 1); n++;
            document.getElementById("got").textContent = "🍉 " + n + "/10";
            kidTap(f.e, "Yum!  " + n + "/10", fx, fy, 500);
            if (n >= 10) { play = false; kidFinish(); }
          } else if (fy > H) {
            fruit.splice(i, 1);
            document.getElementById("say").textContent = "Miss. Next one!";
          }
        }
      }
      fruit.forEach(function (f) { em(f.e, f.x * W, f.y * H, 96); });
      em("🧺", basket * W, H * 0.78, 96);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
