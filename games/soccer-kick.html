<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Soccer Kick</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
      background: #16a34a; color: #14532d;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    button {
      background: transparent; border: 0; appearance: none; -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer;
    }
    #field {
      position: fixed; inset: 0;
      background:
        repeating-linear-gradient(90deg, #22c55e 0 48px, #16a34a 48px 96px);
    }
    #field::after {
      content: ""; position: absolute; left: 10%; right: 10%; top: 8%; bottom: 28%;
      border: 4px solid rgba(255,255,255,.55); border-radius: 8px; pointer-events: none;
    }
    .home {
      position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; z-index: 12;
      color: #14532d; text-decoration: none; font-weight: 800; font-size: 17px;
      background: #fde047; padding: 8px 14px; border-radius: 999px;
      box-shadow: 0 3px 0 #ca8a04; touch-action: manipulation;
    }
    #hud {
      position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 12;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
      pointer-events: none;
    }
    #hud span {
      font-weight: 800; font-size: 15px; background: #fff; color: #14532d;
      padding: 6px 12px; border-radius: 999px; box-shadow: 0 3px 0 rgba(20,83,45,.2);
    }
    #crowd {
      position: fixed; top: 0; left: 0; right: 0; height: 46px; z-index: 1;
      display: flex; justify-content: space-around; align-items: flex-end;
      font-size: 22px; pointer-events: none;
      background: linear-gradient(#1e3a5f, #2563eb);
      padding-bottom: 2px;
    }
    #goalBox {
      position: fixed; top: 14%; left: 50%; width: 168px; height: 92px;
      margin-left: -84px; z-index: 3; pointer-events: none;
    }
    #goal { font-size: 78px; line-height: 92px; text-align: center; }
    #keeper {
      position: absolute; left: 50%; bottom: -6px; width: 44px; margin-left: -22px;
      font-size: 40px; text-align: center; display: none;
    }
    #keeper.on { display: block; }
    #starL, #starR {
      position: absolute; top: 8px; font-size: 26px; display: none;
    }
    #starL { left: -6px; } #starR { right: -6px; }
    #starL.on, #starR.on { display: block; }
    #ball {
      position: fixed; bottom: 26%; left: 50%; margin-left: -34px;
      width: 68px; font-size: 64px; text-align: center; z-index: 4; pointer-events: none;
    }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 148px; text-align: center;
      font-weight: 800; font-size: 22px; color: #fff; text-shadow: 0 3px 0 #14532d;
      z-index: 5; pointer-events: none;
    }
    #powerWrap {
      position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 6; pointer-events: none;
    }
    #powerLab {
      font-weight: 800; font-size: 14px; color: #fff; text-shadow: 0 2px 0 #14532d;
      margin-bottom: 6px;
    }
    #powerBar {
      height: 28px; border-radius: 999px; background: rgba(0,0,0,.28);
      overflow: hidden; box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
      position: relative;
    }
    #powerBar::after {
      content: ""; position: absolute; left: 36%; width: 40%; top: 0; bottom: 0;
      background: rgba(253, 224, 71, .28);
    }
    #powerFill {
      height: 100%; width: 0; border-radius: inherit;
      background: linear-gradient(90deg, #86efac, #fde047 50%, #fb7185);
      transition: none;
    }
    .cover {
      position: fixed; inset: 0; z-index: 20; display: flex; align-items: center;
      justify-content: center; flex-direction: column; text-align: center;
      padding: 22px 16px; gap: 10px; color: #fff;
      background: linear-gradient(180deg, #166534, #4ade80);
    }
    .cover.off { display: none; }
    .cover h1, .cover h2 {
      font-size: clamp(36px, 10vw, 54px); text-shadow: 0 5px 0 #14532d;
    }
    .cover p { font-weight: 800; font-size: 18px; max-width: 320px; }
    .play {
      font-weight: 800; font-size: 24px; padding: 14px 26px; border-radius: 999px;
      background: #fde047; color: #422006; box-shadow: 0 7px 0 #ca8a04;
    }
    .play:active { transform: translateY(4px); box-shadow: 0 3px 0 #ca8a04; }
    .play.sky { background: #93c5fd; box-shadow: 0 7px 0 #2563eb; color: #082f49; }
    .winbtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .chips i { font-style: normal; font-weight: 800; font-size: 13px; background: rgba(0,0,0,.22); padding: 6px 10px; border-radius: 999px; }
  </style>
</head>
<body>
  <div id="field"></div>
  <div id="crowd">🎩 🧢 🎀 🧢 🎩 🎀 🧢</div>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud">
    <span id="scoreHud">⚽ 0 / 5</span>
    <span id="halfHud">Half 1</span>
    <span id="starHud">⭐ 0</span>
  </div>
  <div id="goalBox">
    <div id="goal">🥅</div>
    <div id="keeper">🧤</div>
    <div id="starL">⭐</div>
    <div id="starR">⭐</div>
  </div>
  <div id="ball">⚽</div>
  <div id="hint">Hold to charge. Let go to kick!</div>
  <div id="powerWrap">
    <div id="powerLab">Power</div>
    <div id="powerBar"><div id="powerFill"></div></div>
  </div>

  <div class="cover" id="start">
    <div style="font-size:72px">⚽</div>
    <h1>Soccer Kick</h1>
    <p>Hold for power. Kick when the goal is in the middle. Get 5 goals!</p>
    <div class="chips"><i>Half 1</i><i>Half 2 🧤</i><i>Half 3 ⭐</i></div>
    <button class="play" id="go">Play</button>
  </div>

  <div class="cover off" id="mid">
    <div style="font-size:64px">🏅</div>
    <h2 id="midTitle">Half done!</h2>
    <p id="midLine">Nice kicks.</p>
    <div class="winbtns">
      <button class="play" id="midAgain">Play again</button>
      <button class="play sky" id="midNext">Next half</button>
    </div>
  </div>

  <div class="cover off" id="win">
    <div style="font-size:72px">🏆</div>
    <h1>Goal hero!</h1>
    <p id="winLine">Five goals. What a game!</p>
    <div class="winbtns">
      <button class="play" id="again">Play again</button>
      <button class="play sky" id="next">Next half</button>
    </div>
  </div>

  <script>
    function beep(f, d, t) {
      try {
        var ctx = window._ac || (window._ac = new (window.AudioContext || window.webkitAudioContext)());
        if (ctx.state === "suspended") ctx.resume();
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = t || "sine"; o.frequency.value = f; g.gain.value = 0.11;
        o.connect(g); g.connect(ctx.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d);
        o.stop(ctx.currentTime + d);
      } catch (e) {}
    }

    var HALVES = [
      { name: "Half 1", speed: 1.7, aim: 0.24, keeper: false, stars: false },
      { name: "Half 2", speed: 2.3, aim: 0.19, keeper: true, kSpeed: 0.7, stars: true },
      { name: "Half 3", speed: 2.8, aim: 0.16, keeper: true, kSpeed: 1.05, stars: true }
    ];

    var gx = innerWidth / 2, dir = 1, kx = 0, kdir = 1;
    var score = 0, stars = 0, half = 0, kicks = 0, halfGoals = 0;
    var play = false, busy = false, won = false;
    var charging = false, power = 0, starSide = 0, starOn = false, starWait = 2;
    var last = 0;

    var goalBox = document.getElementById("goalBox");
    var keeper = document.getElementById("keeper");
    var ball = document.getElementById("ball");
    var fill = document.getElementById("powerFill");
    var hint = document.getElementById("hint");

    function hud() {
      document.getElementById("scoreHud").textContent = "⚽ " + score + " / 5";
      document.getElementById("halfHud").textContent = HALVES[half].name;
      document.getElementById("starHud").textContent = "⭐ " + stars;
    }

    function setStar(on, side) {
      starOn = on; starSide = side || 0;
      document.getElementById("starL").classList.toggle("on", on && side < 0);
      document.getElementById("starR").classList.toggle("on", on && side > 0);
    }

    function resetHalf(h, keepScore) {
      half = h;
      if (!keepScore) { score = 0; stars = 0; }
      kicks = 0; halfGoals = 0; busy = false; charging = false; power = 0;
      gx = innerWidth / 2; dir = 1; kx = 0; kdir = 1;
      starWait = 1.6; setStar(false);
      keeper.classList.toggle("on", HALVES[half].keeper);
      fill.style.width = "0%";
      document.getElementById("powerLab").textContent = "Power";
      ball.style.transition = "none";
      ball.style.transform = "none";
      hint.textContent = half === 0 ? "Hold to charge" : half === 1 ? "Watch the keeper" : "Stars on the posts!";
      hud();
    }

    function maybeHalfDone() {
      if (won) return;
      if (score >= 5) {
        play = false; won = true;
        document.getElementById("winLine").textContent = "⚽ " + score + " · ⭐ " + stars + " · " + HALVES[half].name;
        document.getElementById("win").classList.remove("off");
        beep(990, 0.22);
        return;
      }
      var done = halfGoals >= 2 || kicks >= 5;
      if (done && half < 2) {
        play = false;
        document.getElementById("midTitle").textContent = HALVES[half].name + " done!";
        document.getElementById("midLine").textContent = "Goals " + score + " / 5. Next half!";
        document.getElementById("mid").classList.remove("off");
        beep(840, 0.14);
      }
    }

    function kick() {
      if (!play || busy || won) return;
      busy = true;
      var h = HALVES[half];
      var p = power;
      power = 0; charging = false;
      fill.style.width = "0%";
      var mid = innerWidth / 2;
      var aimed = Math.abs(gx - mid) < innerWidth * h.aim + 16;
      var keeperHit = false;
      if (h.keeper) {
        var goalLeft = gx - 70;
        var keepX = goalLeft + 84 + kx;
        keeperHit = aimed && Math.abs(keepX - mid) < 36 && p >= 28;
      }
      var short = p < 28;
      var rise = short ? 0.22 : 0.48;
      ball.style.transition = "transform .38s ease";
      ball.style.transform = "translateY(-" + Math.round(innerHeight * rise) + "px)";
      setTimeout(function () {
        if (short) {
          hint.textContent = "Hold a bit more!";
          beep(180, 0.1);
        } else if (keeperHit) {
          hint.textContent = "Nice try, gloves!";
          beep(200, 0.12);
        } else if (aimed) {
          score++; halfGoals++;
          hint.textContent = p > 88 ? "Boom goal!" : "GOAL!";
          beep(880, 0.14);
          if (starOn) {
            var onLeft = gx < mid;
            if ((starSide < 0 && onLeft) || (starSide > 0 && !onLeft) || Math.abs(gx - mid) > 20) {
              stars++; beep(760, 0.08); hint.textContent = "GOAL + star!";
              setStar(false);
            }
          }
          hud();
        } else {
          hint.textContent = "Wait for the middle";
          beep(160, 0.1);
        }
        ball.style.transform = "none";
        kicks++;
        setTimeout(function () {
          busy = false;
          maybeHalfDone();
        }, 220);
      }, 380);
    }

    addEventListener("pointerdown", function (e) {
      if (e.target.closest("a,button,.cover")) return;
      if (!play || busy || won) return;
      charging = true; power = 20;
    });
    addEventListener("pointerup", function (e) {
      if (e.target.closest("a,button,.cover")) return;
      if (charging) kick();
    });
    addEventListener("pointercancel", function () {
      if (charging) kick();
    });

    function loop(ts) {
      if (!last) last = ts;
      var dt = Math.min(0.04, (ts - last) / 1000);
      last = ts;
      var h = HALVES[half];
      if (play && !busy && !won) {
        gx += dir * h.speed * 60 * dt;
        var pad = 70;
        if (gx < pad) { gx = pad; dir = 1; }
        if (gx > innerWidth - pad) { gx = innerWidth - pad; dir = -1; }
        if (h.keeper) {
          kx += kdir * h.kSpeed * 40 * dt;
          if (kx > 46) { kx = 46; kdir = -1; }
          if (kx < -46) { kx = -46; kdir = 1; }
          keeper.style.transform = "translateX(" + kx + "px)";
        }
        if (h.stars) {
          starWait -= dt;
          if (!starOn && starWait <= 0) {
            setStar(true, Math.random() < 0.5 ? -1 : 1);
            starWait = 4;
          } else if (starOn && starWait <= 0) {
            setStar(false); starWait = 2.2;
          }
        }
      }
      if (charging && play && !busy) {
        power = Math.min(100, power + dt * 110);
        fill.style.width = power + "%";
        document.getElementById("powerLab").textContent =
          power < 28 ? "A bit more" : power < 88 ? "Just right" : "Full power";
      }
      goalBox.style.left = gx + "px";
      requestAnimationFrame(loop);
    }

    function hideCovers() {
      document.getElementById("start").classList.add("off");
      document.getElementById("mid").classList.add("off");
      document.getElementById("win").classList.add("off");
    }

    function begin(h, keep) {
      hideCovers();
      won = false; play = true;
      resetHalf(h, keep);
      beep(520, 0.1);
    }

    document.getElementById("go").onclick = function () { begin(0, false); };
    document.getElementById("midAgain").onclick = function () { begin(0, false); };
    document.getElementById("midNext").onclick = function () { begin(half + 1, true); };
    document.getElementById("again").onclick = function () { begin(0, false); };
    document.getElementById("next").onclick = function () {
      if (half < 2) begin(half + 1, true);
      else begin(0, false);
    };

    resetHalf(0, false);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
