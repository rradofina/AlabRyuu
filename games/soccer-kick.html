<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Soccer Kick</title>
  <script src="../vendor/three.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:Verdana,system-ui,sans-serif;background:#166534;color:#ecfccb;touch-action:none;user-select:none}
    button{background:transparent;border:0;appearance:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .home{position:fixed;top:12px;left:12px;z-index:8;color:#14532d;text-decoration:none;font-weight:800;background:#fde047;padding:8px 14px;border-radius:999px}
    #hud{position:fixed;top:12px;right:12px;z-index:8;text-align:right;font-weight:800;pointer-events:none}
    #hud b{display:inline-block;background:#fff;color:#14532d;padding:6px 10px;border-radius:999px;margin-left:6px}
    #say{position:fixed;left:10px;right:10px;bottom:108px;text-align:center;font-weight:800;text-shadow:0 2px 0 #14532d;z-index:8;pointer-events:none}
    #bar{position:fixed;left:16px;right:16px;bottom:18px;z-index:8;height:16px;background:#14532d;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 2px #fff}
    #fill{height:100%;width:0;background:linear-gradient(90deg,#86efac,#fde047,#f97316)}
    .cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;background:linear-gradient(#22c55e,#14532d)}
    .cover.off{display:none}
    h1{font-size:clamp(34px,9vw,52px);color:#fff;text-shadow:0 4px 0 #14532d}
    .btn{background:#fde047;color:#422006;font-weight:800;font-size:24px;padding:14px 26px;border-radius:999px;box-shadow:0 7px 0 #ca8a04}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="hf">Friendly</b><b id="sc">0 – 0</b><b id="gl">⚽ 0</b></div>
  <div id="say">Hold to power. Let go to kick!</div>
  <div id="bar"><div id="fill"></div></div>
  <div class="cover" id="title">
    <h1>Soccer Kick</h1>
    <p>3D pitch. Run-up. Spinning ball.<br>Goalie dives.</p>
    <button class="btn" id="go">Kick off</button>
  </div>
  <div class="cover off" id="win">
    <h1>Goal party!</h1>
    <p id="wp">Five matches.</p>
    <button class="btn" id="again">Play again</button>
  </div>
  <script>
  (function () {
    if (!window.THREE) return;
    var T = THREE, play = false, match = 0, goals = 0, misses = 0, stars = 0, t = 0;
    var holding = 0, power = 0, phase = "ready", kickT = 0;
    var MATCH = [
      { n: "Friendly", verb: "kick", need: 2, dive: 0.6 },
      { n: "Windy", verb: "curve", need: 2, dive: 0.7, wind: 1 },
      { n: "Night lights", verb: "aim", need: 3, dive: 0.8, night: 1 },
      { n: "Rain pitch", verb: "chip", need: 3, dive: 0.75, rain: 1 },
      { n: "Cup final", verb: "home", need: 3, dive: 0.85 }
    ];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-soccer") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}

    var scene = new T.Scene();
    var cam = new T.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 80);
    var renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    document.body.appendChild(renderer.domElement);
    scene.add(new T.HemisphereLight(0xffffff, 0x14532d, 0.8));
    var sun = new T.DirectionalLight(0xfff1c1, 0.9); sun.position.set(-4, 10, 6); scene.add(sun);

    var pitch = new T.Mesh(new T.PlaneGeometry(18, 28), new T.MeshLambertMaterial({ color: 0x22c55e }));
    pitch.rotation.x = -Math.PI / 2; scene.add(pitch);
    var stripe = new T.Mesh(new T.PlaneGeometry(0.08, 28), new T.MeshBasicMaterial({ color: 0xecfccb }));
    stripe.rotation.x = -Math.PI / 2; stripe.position.y = 0.01; scene.add(stripe);
    var box = new T.Mesh(new T.PlaneGeometry(8, 5), new T.MeshBasicMaterial({ color: 0x4ade80 }));
    box.rotation.x = -Math.PI / 2; box.position.set(0, 0.015, -9); scene.add(box);

    var goal = new T.Group();
    var postM = new T.MeshLambertMaterial({ color: 0xf8fafc });
    var pL = new T.Mesh(new T.CylinderGeometry(0.06, 0.06, 2.2, 8), postM); pL.position.set(-2.2, 1.1, -12); goal.add(pL);
    var pR = pL.clone(); pR.position.x = 2.2; goal.add(pR);
    var bar = new T.Mesh(new T.CylinderGeometry(0.06, 0.06, 4.5, 8), postM); bar.rotation.z = Math.PI / 2; bar.position.set(0, 2.2, -12); goal.add(bar);
    var net = new T.Mesh(new T.PlaneGeometry(4.4, 2.1), new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 }));
    net.position.set(0, 1.05, -12.4); goal.add(net);
    scene.add(goal);

    function kid(col) {
      var g = new T.Group();
      var body = new T.Mesh(new T.SphereGeometry(0.22, 10, 8), new T.MeshLambertMaterial({ color: col }));
      body.scale.set(1, 1.2, 0.8); body.position.y = 0.7; g.add(body);
      var head = new T.Mesh(new T.SphereGeometry(0.16, 10, 8), new T.MeshLambertMaterial({ color: 0xffe0b0 }));
      head.position.y = 1.05; g.add(head);
      var hair = new T.Mesh(new T.SphereGeometry(0.17, 8, 6), new T.MeshLambertMaterial({ color: 0x5a3a22 }));
      hair.position.set(0, 1.14, -0.02); g.add(hair);
      var legs = [];
      for (var s = -1; s <= 1; s += 2) {
        var hip = new T.Group(); hip.position.set(s * 0.09, 0.48, 0);
        var thigh = new T.Mesh(new T.BoxGeometry(0.09, 0.28, 0.09), new T.MeshLambertMaterial({ color: 0x1d4ed8 }));
        thigh.position.y = -0.14; hip.add(thigh);
        var foot = new T.Mesh(new T.BoxGeometry(0.1, 0.06, 0.16), new T.MeshLambertMaterial({ color: 0x111827 }));
        foot.position.set(0, -0.3, 0.03); hip.add(foot);
        g.add(hip); legs.push(hip);
      }
      g.userData = { body: body, head: head, legs: legs };
      return g;
    }
    var player = kid(0xf97316); player.position.set(0, 0, 4); scene.add(player);
    var goalie = kid(0xfde047); goalie.position.set(0, 0, -11.2); scene.add(goalie);
    var ball = new T.Mesh(new T.SphereGeometry(0.16, 12, 10), new T.MeshLambertMaterial({ color: 0xf8fafc }));
    var patch = new T.Mesh(new T.SphereGeometry(0.162, 8, 6), new T.MeshLambertMaterial({ color: 0x111827 }));
    patch.scale.set(0.4, 1, 0.4); ball.add(patch);
    ball.position.set(0.15, 0.16, 3.2); scene.add(ball);
    var ballV = new T.Vector3();
    var rain = [];
    for (var i = 0; i < 20; i++) {
      var d = new T.Mesh(new T.BoxGeometry(0.03, 0.18, 0.03), new T.MeshBasicMaterial({ color: 0x7dd3fc }));
      d.position.set((Math.random() - 0.5) * 12, 4, (Math.random() - 0.5) * 16);
      scene.add(d); rain.push(d);
    }

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f; g.gain.value = 0.1; o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function save() { try { localStorage.setItem("alabryuu-soccer", JSON.stringify({ stars: stars })); } catch (e) {} }
    function setMatchLook() {
      var m = MATCH[match];
      scene.background = new T.Color(m.night ? 0x0f172a : 0x7dd3fc);
      scene.fog = new T.Fog(scene.background, 20, 50);
      document.getElementById("hf").textContent = m.n;
      document.getElementById("say").textContent = ["Hold, then kick!", "Wind curves it!", "Aim the tap!", "Chip the rain!", "Cup kick!"][match];
      resetKick();
    }
    function resetKick() {
      phase = "ready"; power = 0; kickT = 0; holding = 0;
      player.position.set(0, 0, 4);
      ball.position.set(0.15, 0.16, 3.2); ballV.set(0, 0, 0);
      goalie.position.x = 0;
      document.getElementById("fill").style.width = "0%";
    }
    function start() {
      play = true; match = 0; goals = 0; misses = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      setMatchLook();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;

    function onDown() { if (play && phase === "ready") { holding = 1; phase = "power"; } }
    function onUp(ev) {
      if (!play || phase !== "power") return;
      holding = 0; phase = "run";
      var nx = (ev.clientX / innerWidth) * 2 - 1;
      ballV.set(nx * 3.2 + (MATCH[match].wind ? Math.sin(t) * 1.2 : 0), 1.2 + power * 2.2, -10 - power * 8);
      beep(240, 0.08);
    }
    renderer.domElement.addEventListener("pointerdown", onDown);
    renderer.domElement.addEventListener("pointerup", onUp);

    var clock = new T.Clock();
    function tick() {
      var dt = Math.min(0.033, clock.getDelta());
      t += dt;
      var m = MATCH[match];
      if (holding) {
        power = (Math.sin(t * 4) * 0.5 + 0.5);
        document.getElementById("fill").style.width = (power * 100) + "%";
      }
      if (phase === "run" || phase === "fly") {
        kickT += dt;
        player.position.z += (3.4 - player.position.z) * 8 * dt;
        player.userData.legs[1].rotation.x = kickT < 0.25 ? -1.2 : -0.2;
        player.userData.legs[0].rotation.x = 0.3;
        if (kickT > 0.18 && phase === "run") phase = "fly";
      } else {
        player.userData.legs.forEach(function (hip, i) {
          hip.rotation.x = Math.sin(t * 5 + i * 3) * 0.15;
        });
      }
      if (phase === "fly") {
        ballV.y -= 9 * dt;
        ball.position.addScaledVector(ballV, dt);
        ball.rotation.x += dt * 10; ball.rotation.y += dt * 6;
        var dive = Math.max(-2, Math.min(2, ball.position.x)) * m.dive;
        goalie.position.x += (dive - goalie.position.x) * 4 * dt;
        goalie.userData.legs[0].rotation.z = dive * 0.4;
        goalie.userData.legs[1].rotation.z = -dive * 0.2;
        goalie.rotation.z = -dive * 0.15;
        if (ball.position.z < -12) {
          var inGoal = Math.abs(ball.position.x) < 2.1 && ball.position.y < 2.2 && Math.abs(ball.position.x - goalie.position.x) > 0.55;
          if (inGoal) { goals++; stars++; beep(880, 0.12); document.getElementById("say").textContent = "GOAL!"; }
          else { misses++; beep(160, 0.1); document.getElementById("say").textContent = "Try again!"; }
          document.getElementById("sc").textContent = goals + " – " + misses;
          document.getElementById("gl").textContent = "⚽ " + goals;
          save();
          if (goals >= m.need) {
            match++;
            if (match >= MATCH.length) {
              play = false;
              document.getElementById("wp").textContent = "⚽ " + goals + "  ★ " + stars;
              document.getElementById("win").classList.remove("off");
            } else setMatchLook();
          } else setTimeout(resetKick, 700);
          phase = "wait";
        }
        if (ball.position.y < 0.16) { ball.position.y = 0.16; ballV.y *= -0.35; }
      }
      rain.forEach(function (d) {
        d.visible = !!m.rain;
        d.position.y -= 9 * dt; if (d.position.y < 0) d.position.y = 5;
      });
      cam.position.lerp(new T.Vector3(player.position.x * 0.2, 2.4, player.position.z + 6), 0.08);
      cam.lookAt(0, 0.8, -8);
      renderer.render(scene, cam);
      requestAnimationFrame(tick);
    }
    addEventListener("resize", function () {
      cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    scene.background = new T.Color(0x7dd3fc);
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
