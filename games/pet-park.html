<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pet Park</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#86efac}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="love">💛 0/3</b></div>
  <div id="say">Tap a pet. Then Feed, Pet, or Play!</div>
  <div class="dock" id="dock">
    <button id="feed"><span>🍖</span>Feed</button>
    <button id="pet"><span>🤗</span>Pet</button>
    <button id="playb"><span>🎾</span>Play</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🐶</div>
    <h1>Pet Park</h1>
    <p>Make three pals happy!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🥳</div>
    <h1>Happy park!</h1>
    <p>Every pet is smiling.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, play = false, sel = 0, AV = { pet: "🐶" };
    try { var a = JSON.parse(localStorage.getItem("alabryuu-avatar") || "null"); if (a && a.pet) AV.pet = a.pet; } catch (e) {}
    var pals = [];
    function em(ch, px, py, s) { kidEm(x, ch, px, py, s); }
    function resize() { var b = kidFit(cv, x); W = b.W; H = b.H; }
    addEventListener("resize", resize); resize();
    function reset() {
      pals = [
        { e: AV.pet || "🐶", x: 0.25, y: 0.48, happy: 0 },
        { e: "🐱", x: 0.50, y: 0.42, happy: 0 },
        { e: "🐰", x: 0.75, y: 0.50, happy: 0 }
      ];
      sel = 0; hud();
    }
    function hud() {
      var n = pals.filter(function (p) { return p.happy >= 2; }).length;
      document.getElementById("love").textContent = "💛 " + n + "/3";
    }
    function start() {
      play = true; reset();
      kidBegin();
      document.getElementById("dock").classList.add("on");
      document.getElementById("say").textContent = "Tap a pet first!";
    }
    kidBind(start);
    function act(kind) {
      if (!play) return;
      var p = pals[sel];
      p.happy = Math.min(3, p.happy + 1);
      kidTap(kind === "Yum" ? "🍖" : (kind === "Soft" ? "🤗" : "🎾"), kind + " " + p.e + "!", p.x * innerWidth, p.y * innerHeight, 500);
      hud();
      if (pals.every(function (q) { return q.happy >= 2; })) {
        play = false;
                document.getElementById("dock").classList.remove("on");
        kidFinish();
      }
    }
    document.getElementById("feed").onclick = function () { act("Yum"); };
    document.getElementById("pet").onclick = function () { act("Soft"); };
    document.getElementById("playb").onclick = function () { act("Play"); };
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      if (kidPt(e, cv).y > H - 120) return;
      var i, best = sel, bestD = 120 * 120;
      for (i = 0; i < pals.length; i++) {
        var dx = kidPt(e, cv).x - pals[i].x * W, dy = kidPt(e, cv).y - pals[i].y * H;
        var d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      sel = best;
      act("Hi");
    });
    function loop() {
      t += 0.016;
      x.fillStyle = "#86efac"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#4ade80"; x.fillRect(0, H * 0.62, W, H);
      em("🌳", 40, H * 0.38, 72); em("🌳", W - 36, H * 0.34, 80); em("☀️", W * 0.82, 80, 56);
      pals.forEach(function (p, i) {
        var px = p.x * W, py = p.y * H + Math.sin(t * 3 + i) * 4;
        if (i === sel && play) {
          x.beginPath(); x.arc(px, py, 58, 0, Math.PI * 2);
          x.fillStyle = "rgba(253,224,71,0.4)"; x.fill();
        }
        em(p.e, px, py, 80);
        var h;
        for (h = 0; h < p.happy; h++) em("💛", px - 24 + h * 24, py - 58, 28);
      });
      requestAnimationFrame(loop);
    }
    reset();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
