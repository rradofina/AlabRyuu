<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pet Park</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#14532d;touch-action:manipulation}
    button{background:transparent;border:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer}
    body{min-height:100vh;padding:56px 12px 120px;transition:background .4s}
    body.morning{background:linear-gradient(#fda4af 0 18%,#7dd3fc 18% 42%,#86efac 42%)}
    body.noon{background:linear-gradient(#38bdf8 0 36%,#4ade80 36% 70%,#22c55e 70%)}
    body.night{background:linear-gradient(#0f172a 0 38%,#14532d 38% 70%,#052e16 70%);color:#ecfccb}
    .home{position:fixed;top:12px;left:12px;z-index:12;color:#fff;text-decoration:none;font-weight:800;font-size:18px;background:rgba(0,0,0,.28);padding:8px 14px;border-radius:999px}
    .daychip{position:fixed;top:12px;right:12px;z-index:12;background:#fffbeb;color:#14532d;font-weight:800;padding:8px 12px;border-radius:999px}
    body.night .daychip{background:#14532d;color:#fde68a}
    h1{text-align:center;font-size:clamp(28px,7vw,42px);text-shadow:0 3px 0 rgba(255,255,255,.35)}
    .who{display:block;width:fit-content;margin:8px auto;padding:6px 14px;border-radius:999px;font-weight:800;color:#222}
    .park{
      position:relative;width:min(360px,94vw);height:300px;margin:8px auto;
      border-radius:28px 28px 40% 40%;
      overflow:hidden;
      box-shadow:0 12px 0 #166534;
      border:6px solid #365314;
    }
    body.morning .park{background:linear-gradient(#fda4af 0 38%,#86efac 38%)}
    body.noon .park{background:linear-gradient(#7dd3fc 0 36%,#4ade80 36%)}
    body.night .park{background:linear-gradient(#1e1b4b 0 40%,#166534 40%);box-shadow:0 12px 0 #022c22}
    .arc{position:absolute;left:10%;right:10%;top:18px;height:70px;border:3px dashed rgba(255,255,255,.45);border-bottom:0;border-radius:80px 80px 0 0}
    .sun{position:absolute;font-size:36px;transition:left .5s,top .5s}
    .sun.morning{left:12%;top:48px}
    .sun.noon{left:42%;top:8px}
    .sun.night{left:72%;top:48px}
    .fence{position:absolute;left:0;right:0;bottom:54px;height:18px;background:repeating-linear-gradient(90deg,#166534 0 10px,#bbf7d0 10px 14px)}
    .pet{position:absolute;left:38%;bottom:28px;font-size:84px;transition:transform .25s}
    .pet.bounce{animation:bo .4s}
    .pet.sleep{transform:rotate(-14deg)}
    .friend{position:absolute;left:62%;bottom:36px;font-size:54px;display:none}
    .friend.on{display:block;animation:hi .6s}
    @keyframes bo{50%{transform:scale(1.12) translateY(-16px)}}
    @keyframes hi{50%{transform:translateY(-10px)}}
    .glow{position:absolute;inset:auto 30% 20px;height:40px;border-radius:50%;background:rgba(253,230,138,.0);pointer-events:none}
    body.night .glow.nap{background:rgba(253,230,138,.45);box-shadow:0 0 30px #fde68a}
    .hearts{text-align:center;font-size:30px;letter-spacing:6px;margin:8px}
    .missions{
      max-width:340px;margin:0 auto;background:rgba(255,255,255,.75);border-radius:16px;
      padding:8px 12px;font-weight:800;font-size:16px;
    }
    body.night .missions{background:rgba(20,83,45,.75);color:#ecfccb}
    .missions li{list-style:none;margin:3px 0}
    .msg{min-height:2.2em;text-align:center;font-weight:800;font-size:20px;margin:8px}
    .acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .acts button{
      width:96px;height:96px;border-radius:26px;background:#fff7ed;color:#7c2d12;
      box-shadow:0 7px 0 #fdba74;font-size:16px;font-weight:800;
    }
    .acts button span{display:block;font-size:34px}
    .acts button:active{transform:translateY(4px)}
    .acts button.used{opacity:.4}
    .acts button.glowbtn{box-shadow:0 0 0 4px #fde68a,0 7px 0 #ca8a04}
    .nextday{
      display:none;margin:12px auto 0;background:#ffd166;color:#3b2100;font-weight:800;
      font-size:22px;padding:14px 22px;border-radius:999px;box-shadow:0 6px 0 #e09f1f;
    }
    .nextday.on{display:block}
    .toys{
      position:fixed;left:0;right:0;bottom:0;z-index:10;
      background:#166534;color:#ecfccb;
      display:flex;justify-content:center;gap:12px;padding:10px 12px 16px;font-weight:800;
    }
    .toys button{background:rgba(255,255,255,.12);border-radius:16px;padding:8px 12px;min-width:86px}
    .toys button.on{outline:3px solid #fde68a}
    .toys button span{display:block;font-size:26px}
    .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(20,40,20,.86);z-index:20;gap:10px;color:#fff;padding:20px;text-align:center}
    .win.on{display:flex}
    .win button{
      background:#ffd166;color:#3b2100;font-weight:800;font-size:22px;
      padding:14px 22px;border-radius:999px;box-shadow:0 6px 0 #e09f1f;margin:4px;
    }
  </style>
</head>
<body class="morning">
  <a class="home" href="../index.html">← Home</a>
  <div class="daychip" id="daychip">Day 1</div>
  <h1>Pet Park</h1>
  <div class="who" id="who"></div>
  <div class="park">
    <div class="arc"></div>
    <div class="sun morning" id="sun">☀️</div>
    <div class="glow" id="glow"></div>
    <div class="fence"></div>
    <div class="pet" id="pet">🐶</div>
    <div class="friend" id="friend">🐰</div>
  </div>
  <div class="hearts" id="hearts">🤍 🤍 🤍</div>
  <ul class="missions" id="missions"></ul>
  <p class="msg" id="msg">Feed, play, then nap!</p>
  <div class="acts">
    <button id="feed"><span>🍎</span>Feed</button>
    <button id="playb"><span>🎾</span>Play</button>
    <button id="nap"><span>😴</span>Nap</button>
  </div>
  <button class="nextday" id="nextday">Next day →</button>
  <div class="toys" id="toys">
    <button data-t="treat"><span>🍪</span>Treat</button>
    <button data-t="ball"><span>🎾</span>Ball</button>
    <button data-t="blanket"><span>🧸</span>Blanket</button>
  </div>
  <div class="win" id="win">
    <div style="font-size:72px">🌞</div>
    <h2>3 happy days!</h2>
    <p id="winline" style="font-weight:800;font-size:20px"></p>
    <div>
      <button id="again">Play again</button>
      <button id="nextd">Next day</button>
    </div>
  </div>
  <script>
    function av(){try{var a=JSON.parse(localStorage.getItem("alabryuu-avatar")||"null");if(a&&a.name)return a;}catch(e){}return{name:"Alab",hair:"🧒",shirt:"#ffd166",pet:"🐶"};}
    function beep(f,d,t){try{var c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}
    var A=av(),day=1,phase="morning",done={feed:0,play:0,nap:0},toy="treat",happy=0;
    var friends=["🐰","🐱","🐥"];
    document.getElementById("who").innerHTML=A.hair+" "+A.name+"'s park";
    document.getElementById("who").style.background=A.shirt;
    document.getElementById("pet").textContent=A.pet||"🐶";
    function sky(){
      document.body.className=phase;
      document.getElementById("sun").className="sun "+phase;
      document.getElementById("sun").textContent=phase==="night"?"🌙":"☀️";
      document.getElementById("daychip").textContent="Day "+day;
      document.getElementById("nap").classList.toggle("glowbtn",phase==="night"&&!done.nap);
      document.getElementById("glow").classList.toggle("nap",phase==="night"&&done.nap);
      document.getElementById("friend").classList.toggle("on",day===2);
      if(day===2)document.getElementById("friend").textContent=friends[1];
    }
    function hearts(){
      var n=done.feed+done.play+done.nap;
      document.getElementById("hearts").textContent=[0,1,2].map(function(i){return n>i?"❤️":"🤍";}).join(" ");
    }
    function missions(){
      var items=[["feed","Feed"],["play","Play"],["nap","Nap"]];
      document.getElementById("missions").innerHTML=items.map(function(x){
        return "<li>"+(done[x[0]]?"✅":"☐")+" "+x[1]+" today</li>";
      }).join("");
    }
    function setToy(t){
      toy=t;
      document.querySelectorAll(".toys button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t);});
    }
    document.querySelectorAll(".toys button").forEach(function(b){
      b.onclick=function(){setToy(b.dataset.t);beep(400,.06);};
    });
    function act(k,txt,fn,need){
      if(done[k])return;
      if(need&&toy!==need){
        document.getElementById("msg").textContent="Pick the "+need+" first!";
        beep(200,.1);return;
      }
      done[k]=1;
      document.getElementById(k==="play"?"playb":k).classList.add("used");
      fn();document.getElementById("msg").textContent=txt;hearts();missions();
      beep(520+(done.feed+done.play+done.nap)*70,.12);
      if(k==="feed")phase="noon";
      if(k==="play")phase="night";
      if(k==="nap"){document.getElementById("glow").classList.add("nap");}
      sky();
      if(done.feed+done.play+done.nap===3){
        happy++;
        document.getElementById("nextday").classList.add("on");
        if(day>=3)setTimeout(win,500);
        else document.getElementById("msg").textContent="Happy day "+day+"!";
      }
    }
    document.getElementById("feed").onclick=function(){
      act("feed",A.name+" gave a treat!",function(){
        document.getElementById("pet").className="pet bounce";
      },"treat");
    };
    document.getElementById("playb").onclick=function(){
      act("play",(A.pet||"Pet")+" chased the ball!",function(){
        document.getElementById("pet").className="pet bounce";
      },"ball");
    };
    document.getElementById("nap").onclick=function(){
      act("nap","Shhh. Sweet dreams.",function(){
        document.getElementById("pet").className="pet sleep";
        beep(320,.2,"triangle");
      },"blanket");
    };
    function newDay(){
      if(day>=3&&done.feed&&done.play&&done.nap){win();return;}
      if(done.feed+done.play+done.nap===3)day++;
      done={feed:0,play:0,nap:0};phase="morning";
      document.querySelectorAll(".acts button").forEach(function(b){b.classList.remove("used");});
      document.getElementById("pet").className="pet";
      document.getElementById("win").classList.remove("on");
      document.getElementById("nextday").classList.remove("on");
      document.getElementById("msg").textContent=day===2?"A friend came to play!":"New morning. Care time!";
      sky();hearts();missions();
    }
    function win(){
      document.getElementById("winline").textContent=A.name+" and "+(A.pet||"pet")+" had "+happy+" happy days!";
      document.getElementById("win").classList.add("on");beep(880,.2);
    }
    document.getElementById("again").onclick=function(){
      day=1;happy=0;done={feed:0,play:0,nap:0};phase="morning";
      document.querySelectorAll(".acts button").forEach(function(b){b.classList.remove("used");});
      document.getElementById("pet").className="pet";
      document.getElementById("win").classList.remove("on");
      document.getElementById("nextday").classList.remove("on");
      document.getElementById("msg").textContent="Feed, play, then nap!";
      sky();hearts();missions();
    };
    document.getElementById("nextday").onclick=function(){newDay();};
    document.getElementById("nextd").onclick=function(){
      if(day>=3){document.getElementById("again").onclick();return;}
      newDay();
    };
    setToy("treat");sky();hearts();missions();
  </script>
</body>
</html>
