<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pet Park</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:#14532d;color:#14532d;touch-action:none;user-select:none}
    .home{position:fixed;top:12px;left:12px;z-index:8;color:#fff;text-decoration:none;font-weight:800;font-size:17px;background:rgba(20,83,45,.5);padding:8px 14px;border-radius:999px;touch-action:manipulation}
    canvas{display:block;width:100%;height:100%}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <script>
  (function(){
    var cv=document.getElementById("c"),x=cv.getContext("2d");
    var W,H,T=0,last=0,stage="title",day=0,stars=0,mx=0,my=0;
    var hits=[],say="Tap Play!",hunger=0.8,play=0.8,sleep=0.8,blink=0,zzz=[],flakes=[],ball=null,sky=0,napT=0;
    var AV={name:"Alab",hair:"🧒",shirt:"#ffd166",pet:"🐶"};
    try{var a=JSON.parse(localStorage.getItem("alabryuu-avatar")||"null");if(a&&a.name){AV.name=a.name;AV.hair=a.hair||AV.hair;AV.shirt=a.shirt||AV.shirt;AV.pet=a.pet||AV.pet;}}catch(e){}
    var DAYS=[
      {n:"Picnic",tip:"Feed flakes. Slow meters."},
      {n:"Friend",tip:"A bunny visits. Fetch!"},
      {n:"Rain",tip:"Soft rain. Still play."},
      {n:"Butterfly",tip:"Tap flutter friends."},
      {n:"Glow",tip:"Night nap. Zzz kind."}
    ];
    function beep(f,d,tp){try{var ac=beep.ac||(beep.ac=new(window.AudioContext||window.webkitAudioContext)());var o=ac.createOscillator(),g=ac.createGain();o.type=tp||"sine";o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d);}catch(e){}}
    function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
    addEventListener("resize",resize);resize();
    function rnd(a,b){return a+Math.random()*(b-a);}
    function round(a,b,w,h,r,col){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();if(col){x.fillStyle=col;x.fill();}}
    function ellipse(cx,cy,rx,ry,col){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,6.28);x.fillStyle=col;x.fill();}
    function hitAt(p,q){for(var i=hits.length-1;i>=0;i--){var h=hits[i];if(p>=h.x&&p<=h.x+h.w&&q>=h.y&&q<=h.y+h.h)return h;}return null;}
    function btn(id,bx,by,bw,bh,label,col,tc){hits.push({id:id,x:bx,y:by,w:bw,h:bh});round(bx,by,bw,bh,16,col||"#ffd166");x.fillStyle=tc||"#3b2100";x.font="800 14px Trebuchet MS";x.textAlign="center";x.textBaseline="middle";x.fillText(label,bx+bw/2,by+bh/2);}

    function petKind(){
      var p=AV.pet||"🐶";
      if(p==="🐱")return "cat";
      if(p==="🐰")return "bunny";
      if(p==="🦊")return "fox";
      if(p==="🐼")return "panda";
      if(p==="🐥")return "chick";
      if(p==="🐸")return "frog";
      if(p==="🦄")return "unicorn";
      return "dog";
    }
    function petWord(){
      return {dog:"dog",cat:"cat",bunny:"bunny",fox:"fox",panda:"panda",chick:"chick",frog:"frog",unicorn:"unicorn"}[petKind()]||"pal";
    }

    function skyG(){
      var t=(sky%1),g=x.createLinearGradient(0,0,0,H);
      if(day===4||t>0.75){g.addColorStop(0,"#0f172a");g.addColorStop(.4,"#1e3a8a");g.addColorStop(1,"#14532d");}
      else if(day===2){g.addColorStop(0,"#64748b");g.addColorStop(1,"#4ade80");}
      else if(t<0.35){g.addColorStop(0,"#fda4af");g.addColorStop(.4,"#7dd3fc");g.addColorStop(1,"#86efac");}
      else{g.addColorStop(0,"#38bdf8");g.addColorStop(1,"#4ade80");}
      x.fillStyle=g;x.fillRect(0,0,W,H);
    }
    function drawBunnyVisit(cx,cy){
      var hop=Math.abs(Math.sin(T*4))*6;
      x.save();x.translate(cx,cy-hop);
      ellipse(0,6,14,10,"#fde68a");
      ellipse(12,-4,8,7,"#fde68a");
      ellipse(6,-18,3,10,"#fde68a");
      ellipse(14,-18,3,10,"#fde68a");
      ellipse(6,-16,1.6,6,"#fda4af");
      ellipse(14,-16,1.6,6,"#fda4af");
      ellipse(16,-3,3,2.4,"#fda4af");
      x.fillStyle="#1c1917";x.beginPath();x.arc(14,-6,1.6,0,6.28);x.fill();
      x.restore();
    }
    function drawFlutter(cx,cy,ph){
      var flap=Math.sin(T*8+ph);
      x.save();x.translate(cx,cy);
      x.fillStyle="#f472b6";
      x.beginPath();x.ellipse(-8,0,8,5+flap*3, -0.3,0,6.28);x.fill();
      x.fillStyle="#a78bfa";
      x.beginPath();x.ellipse(8,0,8,5-flap*3, 0.3,0,6.28);x.fill();
      x.fillStyle="#1c1917";
      x.fillRect(-1,-4,2,8);
      x.restore();
    }
    function drawPark(){
      skyG();
      var sunX=W*(0.15+0.7*((sky%1))),sunY=H*(0.14+0.12*Math.sin((sky%1)*3.14));
      x.fillStyle=day===4?"#fde68a":"#fde047";x.beginPath();x.arc(sunX,sunY,18,0,6.28);x.fill();
      x.fillStyle="#22c55e";x.fillRect(0,H*0.58,W,H*0.42);
      x.fillStyle="#16a34a";
      for(var i=0;i<10;i++){x.beginPath();x.moveTo(i*W/9,H*0.58);x.quadraticCurveTo(i*W/9+10,H*0.54,i*W/9+20,H*0.58);x.fill();}
      x.strokeStyle="#166534";x.lineWidth=4;x.beginPath();x.moveTo(0,H*0.72);x.quadraticCurveTo(W/2,H*0.66,W,H*0.72);x.stroke();
      x.fillStyle="#166534";x.fillRect(W*0.08,H*0.4,10,H*0.22);ellipse(W*0.1,H*0.4,28,20,"#15803d");
      x.fillRect(W*0.84,H*0.42,10,H*0.2);ellipse(W*0.86,H*0.4,26,18,"#22c55e");
      if(day===1) drawBunnyVisit(W*0.72,H*0.56);
      if(day===3){for(i=0;i<4;i++) drawFlutter(W*0.2+i*70,H*0.3+Math.sin(T*3+i)*10,i);}
    }

    function petPose(){
      if(stage==="title"||stage==="win") return "bounce";
      if(napT>0||sleep<0.3) return "sleep";
      if(stage==="feed") return "eat";
      return "bounce";
    }

    function drawPetBody(kind, pose, wag, walk, shut){
      var cols={
        dog:{body:"#d97706",dark:"#92400e",ear:"#78350f",belly:"#fde68a",nose:"#1c1917"},
        cat:{body:"#fdba74",dark:"#fb923c",ear:"#fb7185",belly:"#fed7aa",nose:"#fb7185"},
        bunny:{body:"#fde68a",dark:"#fbbf24",ear:"#fda4af",belly:"#fff7ed",nose:"#fb7185"},
        fox:{body:"#ea580c",dark:"#9a3412",ear:"#1c1917",belly:"#fff7ed",nose:"#1c1917"},
        panda:{body:"#f8fafc",dark:"#1c1917",ear:"#1c1917",belly:"#fff",nose:"#1c1917"},
        chick:{body:"#facc15",dark:"#ca8a04",ear:"#ea580c",belly:"#fde047",nose:"#ea580c"},
        frog:{body:"#4ade80",dark:"#166534",ear:"#86efac",belly:"#bbf7d0",nose:"#14532d"},
        unicorn:{body:"#f5d0fe",dark:"#c084fc",ear:"#f9a8d4",belly:"#fce7f3",nose:"#db2777"}
      };
      var c=cols[kind]||cols.dog;
      var sleeping=pose==="sleep";
      var eating=pose==="eat";
      var headY=eating?-4: sleeping? -8 : -18;
      var headX=eating?22:18;

      function legs(){
        x.strokeStyle=c.dark;x.lineWidth=5;x.lineCap="round";
        if(sleeping){
          x.beginPath();
          x.moveTo(-16,12);x.quadraticCurveTo(-22,20,-10,18);
          x.moveTo(-4,14);x.quadraticCurveTo(-2,22,6,18);
          x.moveTo(8,14);x.quadraticCurveTo(10,20,16,16);
          x.stroke();
          return;
        }
        var a=walk*6,b=-walk*6;
        x.beginPath();
        x.moveTo(-14,10);x.lineTo(-16+a,24);
        x.moveTo(-4,10);x.lineTo(-2+b,24);
        x.moveTo(6,10);x.lineTo(8+a,24);
        x.moveTo(14,10);x.lineTo(16+b,24);
        x.stroke();
      }
      function tail(){
        x.strokeStyle=c.dark;x.lineWidth=5;x.lineCap="round";
        x.beginPath();
        if(sleeping){x.moveTo(-26,2);x.quadraticCurveTo(-34,8,-22,12);}
        else {x.moveTo(-22,0);x.quadraticCurveTo(-34,-16+wag,-20,-8+wag*0.3);}
        x.stroke();
      }
      function face(){
        ellipse(headX,headY,14,12,c.body);
        if(kind==="dog"){
          ellipse(headX-8,headY-12,6,8,c.ear);
          ellipse(headX+6,headY-12,6,8,c.ear);
          ellipse(headX+10,headY+2,8,6,c.dark);
          ellipse(headX+14,headY+3,4,3,c.nose);
        } else if(kind==="cat"){
          x.fillStyle=c.ear;
          x.beginPath();x.moveTo(headX-10,headY-6);x.lineTo(headX-16,headY-22);x.lineTo(headX-2,headY-10);x.fill();
          x.beginPath();x.moveTo(headX+4,headY-8);x.lineTo(headX+14,headY-22);x.lineTo(headX+12,headY-4);x.fill();
          ellipse(headX+10,headY+2,4,3,c.ear);
          x.fillStyle=c.nose;x.beginPath();x.moveTo(headX+10,headY+1);x.lineTo(headX+7,headY+5);x.lineTo(headX+13,headY+5);x.fill();
        } else if(kind==="bunny"){
          ellipse(headX-6,headY-20,4,12,c.body);
          ellipse(headX+4,headY-20,4,12,c.body);
          ellipse(headX-6,headY-18,2,8,c.ear);
          ellipse(headX+4,headY-18,2,8,c.ear);
          ellipse(headX+10,headY+2,4,3,c.ear);
        } else if(kind==="fox"){
          x.fillStyle=c.ear;
          x.beginPath();x.moveTo(headX-10,headY-6);x.lineTo(headX-14,headY-22);x.lineTo(headX-2,headY-8);x.fill();
          x.beginPath();x.moveTo(headX+4,headY-8);x.lineTo(headX+16,headY-22);x.lineTo(headX+12,headY-4);x.fill();
          ellipse(headX+12,headY+2,8,5,c.belly);
          ellipse(headX+16,headY+3,3,2.4,c.nose);
        } else if(kind==="panda"){
          ellipse(headX-8,headY-12,6,6,c.dark);
          ellipse(headX+8,headY-12,6,6,c.dark);
          ellipse(headX-4,headY-2,5,4,c.dark);
          ellipse(headX+8,headY-2,5,4,c.dark);
          ellipse(headX+10,headY+4,4,3,c.nose);
        } else if(kind==="chick"){
          ellipse(headX+12,headY+1,7,3.4,c.nose);
          x.fillStyle="#dc2626";
          x.beginPath();x.moveTo(headX-2,headY-10);x.lineTo(headX+2,headY-18);x.lineTo(headX+6,headY-10);x.fill();
        } else if(kind==="frog"){
          ellipse(headX-6,headY-10,6,6,c.body);
          ellipse(headX+8,headY-10,6,6,c.body);
          ellipse(headX+10,headY+4,6,3,c.dark);
        } else {
          ellipse(headX-8,headY-12,5,8,c.ear);
          ellipse(headX+6,headY-12,5,8,c.ear);
          x.fillStyle="#fbbf24";
          x.beginPath();x.moveTo(headX-2,headY-10);x.lineTo(headX+2,headY-28);x.lineTo(headX+8,headY-10);x.fill();
          ellipse(headX+12,headY+2,6,4,c.ear);
        }
        if(shut||sleeping){
          x.strokeStyle="#1c1917";x.lineWidth=2;
          x.beginPath();x.moveTo(headX+2,headY-2);x.lineTo(headX+8,headY-2);x.stroke();
        } else {
          x.fillStyle="#1c1917";x.beginPath();x.arc(headX+4,headY-3,2.2,0,6.28);x.fill();
          x.fillStyle="#fff";x.beginPath();x.arc(headX+4.7,headY-3.6,0.8,0,6.28);x.fill();
        }
      }

      tail();
      legs();
      ellipse(0,4,26,16,c.body);
      ellipse(4,8,14,8,c.belly);
      if(kind==="dog"){ellipse(-8,0,6,5,c.dark);ellipse(10,2,5,4,c.dark);}
      if(kind==="panda"){ellipse(-10,2,7,6,c.dark);ellipse(12,4,7,6,c.dark);}
      face();
    }

    function drawPet(cx,cy){
      var pose=petPose();
      var bounce=pose==="bounce"?Math.sin(T*4)*6:0;
      var asleep=pose==="sleep";
      var eating=pose==="eat";
      if(asleep) cy+=12;
      ellipse(cx,cy+36,24,8,"rgba(0,0,0,.15)");
      x.save();
      x.translate(cx,cy+bounce);
      if(asleep) x.rotate(-0.2);
      if(eating) x.rotate(0.35);
      var walk=pose==="bounce"?Math.sin(T*8):0;
      var wag=pose==="sleep"?2:Math.sin(T*9)*10;
      var shut=blink>0.85;
      drawPetBody(petKind(),pose,wag,walk,shut);
      x.restore();
      if(eating){
        ellipse(cx+34,cy+22,12,5,"#fecaca");
        ellipse(cx+34,cy+20,8,3,"#fb7185");
      }
      if(asleep){
        if(Math.random()<0.08)zzz.push({x:cx+20,y:cy-20,life:1.4,s:10});
        for(var i=0;i<zzz.length;i++){x.fillStyle="rgba(30,27,75,"+zzz[i].life+")";x.font="800 16px Trebuchet MS";x.fillText("z",zzz[i].x,zzz[i].y);}
      }
    }
    function meter(label,val,mx0,my0,col){
      x.fillStyle="#14532d";x.font="800 12px Trebuchet MS";x.textAlign="left";x.fillText(label,mx0,my0-6);
      round(mx0,my0,100,12,6,"#d9f99d");
      round(mx0,my0,100*Math.max(0.12,val),12,6,col);
    }
    function drawHud(){
      round(W-140,10,130,32,14,"rgba(255,255,255,.9)");
      x.fillStyle="#14532d";x.font="800 13px Trebuchet MS";x.textAlign="left";x.textBaseline="middle";
      x.fillText("Day "+(day+1)+"/5  ⭐ "+stars,W-126,26);
      meter("Yum",hunger,16,H*0.12,"#fb7185");
      meter("Play",play,130,H*0.12,"#38bdf8");
      meter("Nap",sleep,244,H*0.12,"#a78bfa");
      round(16,H-50,W-32,36,12,"rgba(255,255,255,.92)");
      x.textAlign="center";x.fillText(say,W/2,H-32);
    }
    function drawActs(){
      btn("feed",20,H*0.78,90,44,"Feed","#fecaca","#9f1239");
      btn("fetch",120,H*0.78,90,44,"Fetch","#bae6fd","#0c4a6e");
      btn("nap",220,H*0.78,90,44,"Nap","#ddd6fe","#5b21b6");
      btn("nextd",W-120,H*0.78,100,44,"Next day","#ffd166","#3b2100");
    }
    function start(){stage="park";day=0;stars=0;hunger=play=sleep=0.85;say=DAYS[0].tip;flakes=[];ball=null;beep(500,.1);}
    function pointer(e){
      var r=cv.getBoundingClientRect();
      mx=(e.clientX||(e.touches&&e.touches[0].clientX)||0)-r.left;
      my=(e.clientY||(e.touches&&e.touches[0].clientY)||0)-r.top;
      var h=hitAt(mx,my);
      if(h&&h.id==="play"){start();return;}
      if(h&&h.id==="again"){stage="title";return;}
      if(h&&h.id==="back"){stage="park";say=DAYS[day].tip;ball=null;return;}
      if(stage==="feed"){
        for(var i=flakes.length-1;i>=0;i--){
          var f=flakes[i],dx=mx-f.x,dy=my-f.y;
          if(dx*dx+dy*dy<400){flakes.splice(i,1);hunger=Math.min(1,hunger+0.12);stars++;beep(700,.06);say="Yum flake!";}
        }
        return;
      }
      if(stage==="fetch"&&ball){
        var dx=mx-ball.x,dy=my-ball.y;
        if(dx*dx+dy*dy<900){ball.vx=rnd(-80,80);ball.vy=-180;play=Math.min(1,play+0.1);stars++;beep(640,.07);say="Fetch!";}
        return;
      }
      if(!h)return;
      if(h.id==="feed"){stage="feed";for(i=0;i<8;i++)flakes.push({x:rnd(40,W-40),y:rnd(H*0.2,H*0.5),vy:30,life:6});say="Tap falling flakes!";}
      if(h.id==="fetch"){stage="fetch";ball={x:W*0.6,y:H*0.6,vx:40,vy:-20};say="Tap the ball!";}
      if(h.id==="nap"){sleep=Math.min(1,sleep+0.25);napT=2.2;say="Zzz... kind rest.";beep(280,.16);}
      if(h.id==="nextd"){stars+=2;if(day>=4)stage="win";else{day++;hunger=0.7;play=0.7;sleep=0.7;stage="park";say=DAYS[day].tip;beep(560,.1);}}
      if(h.id==="back"){stage="park";say=DAYS[day].tip;}
    }
    function step(dt){
      blink+=dt;if(blink>1.2)blink=0;
      if(napT>0)napT-=dt;
      sky+=dt*0.04;
      hunger=Math.max(0.15,hunger-dt*0.015);
      play=Math.max(0.15,play-dt*0.012);
      sleep=Math.max(0.12,sleep-dt*0.01);
      for(var i=zzz.length-1;i>=0;i--){zzz[i].life-=dt;zzz[i].y-=20*dt;if(zzz[i].life<=0)zzz.splice(i,1);}
      if(stage==="feed"){
        for(i=flakes.length-1;i>=0;i--){flakes[i].y+=flakes[i].vy*dt;flakes[i].life-=dt;if(flakes[i].y>H*0.7||flakes[i].life<=0)flakes.splice(i,1);}
        if(flakes.length<5)flakes.push({x:rnd(30,W-30),y:40,vy:40,life:5});
      }
      if(stage==="fetch"&&ball){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vy+=220*dt;if(ball.y>H*0.68){ball.y=H*0.68;ball.vy*=-0.4;ball.vx*=0.8;}if(ball.x<20||ball.x>W-20)ball.vx*=-1;}
    }
    function drawMini(){
      if(stage==="feed"){
        for(var i=0;i<flakes.length;i++){x.fillStyle="#fb7185";round(flakes[i].x-8,flakes[i].y-6,16,12,4,"#fb7185");}
        btn("back",W-110,H*0.78,90,40,"Done","#fff","#14532d");
      }
      if(stage==="fetch"&&ball){
        x.fillStyle="#38bdf8";x.beginPath();x.arc(ball.x,ball.y,14,0,6.28);x.fill();
        x.fillStyle="#fff";x.beginPath();x.arc(ball.x-4,ball.y-4,4,0,6.28);x.fill();
        btn("back",W-110,H*0.78,90,40,"Done","#fff","#14532d");
      }
    }
    function drawTitle(){
      drawPark();drawYardBits();drawPet(W*0.5,H*0.5);
      x.fillStyle="#14532d";x.font="800 "+Math.floor(Math.min(46,W/8))+"px Trebuchet MS";x.textAlign="center";
      x.fillText("Pet Park",W/2,H*0.16);
      x.font="800 14px Trebuchet MS";x.fillText(AV.name+" and a "+petWord(),W/2,H*0.22);
      hits.push({id:"play",x:W/2-80,y:H*0.78,w:160,h:50});
      round(W/2-80,H*0.78,160,50,18,"#ffd166");
      x.fillStyle="#3b2100";x.font="800 22px Trebuchet MS";x.fillText("Play!",W/2,H*0.8+12);
    }
    function drawWin(){
      drawPark();drawYardBits();drawPet(W*0.5,H*0.48);
      x.fillStyle="#14532d";x.font="800 38px Trebuchet MS";x.textAlign="center";
      x.fillText("Happy week!",W/2,H*0.2);
      x.font="800 16px Trebuchet MS";x.fillText(AV.name+"'s "+petWord()+"  ⭐ "+stars,W/2,H*0.28);
      hits.push({id:"again",x:W/2-80,y:H*0.78,w:160,h:50});
      round(W/2-80,H*0.78,160,50,18,"#86efac");
      x.fillStyle="#14532d";x.fillText("Again",W/2,H*0.8+12);
    }
    function draw(){
      hits=[];
      if(stage==="title")drawTitle();
      else if(stage==="win")drawWin();
      else{drawPark();drawYardBits();drawPet(W*0.46,H*0.54);if(stage==="park")drawActs();drawMini();drawHud();}
    }
    cv.addEventListener("pointerdown",pointer);

    var flowers=[],rain=[],hearts=[];
    function drawPond(){
      ellipse(W*0.72,H*0.66,50,16,"#38bdf8");
      x.strokeStyle="rgba(255,255,255,.45)";x.lineWidth=2;
      x.beginPath();x.ellipse(W*0.72,H*0.66,20+Math.sin(T*3)*6,6,0,0,6.28);x.stroke();
    }
    function drawFlowers(){
      if(!flowers.length){for(var i=0;i<8;i++)flowers.push({x:rnd(0.08,0.9),y:rnd(0.62,0.8),c:["#fb7185","#fde047","#a78bfa","#fff"][i%4]});}
      for(var i=0;i<flowers.length;i++){
        var f=flowers[i];
        x.strokeStyle="#166534";x.beginPath();x.moveTo(f.x*W,f.y*H);x.lineTo(f.x*W,f.y*H+10);x.stroke();
        ellipse(f.x*W,f.y*H,5,5,f.c);
      }
    }
    function drawBench(){
      x.fillStyle="#92400e";round(W*0.18,H*0.56,70,10,3,"#92400e");
      x.fillRect(W*0.2,H*0.66,8,16);x.fillRect(W*0.32,H*0.66,8,16);
    }
    function drawFence(){
      x.strokeStyle="#14532d";x.lineWidth=3;
      x.beginPath();x.moveTo(0,H*0.6);x.lineTo(W,H*0.6);x.stroke();
      for(var i=0;i<12;i++){x.fillStyle="#166534";x.fillRect(i*W/11,H*0.56,6,20);}
    }
    function drawRain(){
      if(day!==2)return;
      if(rain.length<30)rain.push({x:rnd(0,W),y:-10,vy:220});
      x.strokeStyle="rgba(186,230,253,.7)";x.lineWidth=2;
      for(var i=rain.length-1;i>=0;i--){rain[i].y+=rain[i].vy*0.016;x.beginPath();x.moveTo(rain[i].x,rain[i].y);x.lineTo(rain[i].x-3,rain[i].y+10);x.stroke();if(rain[i].y>H)rain.splice(i,1);}
    }
    function drawHearts(){
      if((hunger>0.85||play>0.85)&&Math.random()<0.05)hearts.push({x:W*0.46+rnd(-10,10),y:H*0.46,life:1});
      for(var i=hearts.length-1;i>=0;i--){
        hearts[i].life-=0.02;hearts[i].y-=20*0.016;
        x.globalAlpha=hearts[i].life;x.fillStyle="#fb7185";
        x.beginPath();
        var hx=hearts[i].x,hy=hearts[i].y;
        x.moveTo(hx,hy+4);
        x.bezierCurveTo(hx-8,hy-2,hx-5,hy-10,hx,hy-4);
        x.bezierCurveTo(hx+5,hy-10,hx+8,hy-2,hx,hy+4);
        x.fill();
        if(hearts[i].life<=0)hearts.splice(i,1);
      }
      x.globalAlpha=1;
    }
    function drawKidOwner(){
      x.fillStyle="#fde68a";x.beginPath();x.arc(W*0.28,H*0.5,12,0,6.28);x.fill();
      x.fillStyle=AV.shirt;round(W*0.28-10,H*0.52,20,16,5,AV.shirt);
      x.fillStyle="#3b2100";x.beginPath();x.arc(W*0.275,H*0.497,1.4,0,6.28);x.fill();
      x.beginPath();x.arc(W*0.29,H*0.497,1.4,0,6.28);x.fill();
      x.strokeStyle="#3b2100";x.lineWidth=1.5;
      x.beginPath();x.arc(W*0.282,H*0.505,4,0.15,2.8);x.stroke();
    }
    function drawYardBits(){
      drawFence();drawPond();drawFlowers();drawBench();drawRain();drawHearts();drawKidOwner();
    }

    function loop(now){var dt=Math.min(.033,(now-last)/1000)||.016;last=now;T=now/1000;step(dt);draw();requestAnimationFrame(loop);}
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
