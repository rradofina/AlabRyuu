<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Piano Keys</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: Georgia, "Trebuchet MS", serif; background: #1e1b4b; color: #ede9fe; touch-action: none; user-select: none; -webkit-user-select: none; }
    button { background: transparent; border: 0; appearance: none; -webkit-appearance: none; -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer; }
    canvas { display: block; width: 100%; height: 100%; }
    .home { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; z-index: 8; color: #fff; text-decoration: none; font-family: "Trebuchet MS", sans-serif; font-weight: 800; font-size: 17px; background: rgba(76,29,149,.55); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 7; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; pointer-events: none; font-family: "Trebuchet MS", sans-serif; }
    #hud b { font-weight: 800; font-size: 13px; background: #4c1d95; color: #fde68a; padding: 6px 10px; border-radius: 999px; }
    #say { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 7; font-family: "Trebuchet MS", sans-serif; font-weight: 800; font-size: 16px; color: #fde68a; pointer-events: none; text-align: center; width: 92%; }
    #dock { position: fixed; left: 8px; right: 8px; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 7; display: none; gap: 8px; }
    #dock.on { display: flex; }
    #dock button { flex: 1; height: 52px; border-radius: 16px; font-family: "Trebuchet MS", sans-serif; font-weight: 800; font-size: 15px; background: #c4b5fd; color: #1e1b4b; box-shadow: 0 4px 0 #6d28d9; }
    #dock button.on { background: #fde047; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px; background: linear-gradient(#1e1b4b, #6d28d9); }
    .cover.off { display: none; }
    h1 { font-size: clamp(32px, 9vw, 50px); color: #fff; text-shadow: 0 4px 0 #4c1d95; }
    .cover p { font-family: "Trebuchet MS", sans-serif; font-weight: 800; font-size: 18px; max-width: 340px; }
    .btn { font-family: "Trebuchet MS", sans-serif; background: #fde047; color: #422006; font-weight: 800; font-size: 22px; padding: 14px 24px; border-radius: 999px; box-shadow: 0 7px 0 #ca8a04; }
    .btn.g { background: #86efac; box-shadow: 0 7px 0 #16a34a; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="sn">Twinkle</b><b id="oc">Octave 1</b><b id="fr">Follow</b></div>
  <div id="say">Follow the firefly. Keys go down!</div>
  <div id="dock">
    <button id="free" type="button">Free play</button>
    <button id="hint" type="button">Hear song</button>
  </div>
  <div class="cover" id="title">
    <div style="font-size:76px">🎹</div>
    <h1>Piano Keys</h1>
    <p>Keys depress. Notes fly up. Follow the firefly. Unlock a second octave.</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div style="font-size:76px">🌟</div>
    <h1>Little maestro!</h1>
    <p id="winP">Five songs. Soft keys.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, last = 0, t = 0, play = false, free = false, oct2 = 0;
    var song = 0, step = 0, wait = 0, glow = 0;
    var keys = [], notes = [], sparks = [], dust = [];
    var fly = { i: 0, x: 0, y: 0, tx: 0, ty: 0, bob: 0 };
    var NAMES = ["C", "D", "E", "F", "G", "A", "B", "C2"];
    var FREQ = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
    var COLS = ["#ef4444", "#f97316", "#facc15", "#22c55e", "#14b8a6", "#3b82f6", "#a855f7", "#f472b6"];
    var SONGS = [
      { n: "Twinkle", notes: [0, 0, 4, 4, 5, 5, 4, 3, 3, 2, 2, 1, 1, 0] },
      { n: "Little Lamb", notes: [2, 1, 0, 1, 2, 2, 2, 1, 1, 1, 2, 4, 4] },
      { n: "Hot Cross", notes: [1, 0, 1, 2, 1, 0, 1, 2, 2, 3, 4] },
      { n: "Ode Bit", notes: [2, 2, 3, 4, 4, 3, 2, 1, 0, 0, 1, 2, 2, 1, 1] },
      { n: "Happy High", notes: [0, 0, 1, 0, 3, 2, 0, 0, 1, 0, 4, 3, 7, 5, 3, 2, 1] }
    ];

    function beep(f, d, typ) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        if (ac.state === "suspended") ac.resume();
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = typ || "sine"; o.frequency.value = f; g.gain.value = 0.11;
        o.connect(g); g.connect(ac.destination);
        o.start();
        g.gain.setValueAtTime(0.11, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function chord(fs, d) {
      fs.forEach(function (f, i) { setTimeout(function () { beep(f, d); }, i * 40); });
    }
    function say(s) { document.getElementById("say").textContent = s; }
    function hud() {
      document.getElementById("sn").textContent = SONGS[song] ? SONGS[song].n : "Done";
      document.getElementById("oc").textContent = oct2 ? "Octave 2!" : "Octave 1";
      document.getElementById("fr").textContent = free ? "Free play" : "Follow";
    }
    function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; layoutKeys(); }
    addEventListener("resize", resize);

    function layoutKeys() {
      var n = oct2 ? 8 : 7;
      var pad = 10, kw = (W - pad * 2) / n, kh = Math.min(220, H * 0.32);
      var ky = H - kh - 78;
      keys = [];
      var i;
      for (i = 0; i < n; i++) {
        keys.push({
          i: i, x: pad + i * kw + 3, y: ky, w: kw - 6, h: kh,
          down: 0, press: 0, name: NAMES[i], f: FREQ[i], col: COLS[i]
        });
      }
      hopFly(SONGS[song] ? SONGS[song].notes[step] || 0 : 0, true);
    }

    function hopFly(i, snap) {
      var k = keys[Math.min(i, keys.length - 1)];
      if (!k) return;
      fly.tx = k.x + k.w * 0.5; fly.ty = k.y - 18;
      fly.i = i;
      if (snap) { fly.x = fly.tx; fly.y = fly.ty; }
    }

    function start() {
      play = true; song = 0; step = 0; free = false; oct2 = 0; wait = 0.4;
      notes = []; sparks = []; dust = [];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      document.getElementById("free").classList.remove("on");
      layoutKeys();
      say("Follow the firefly. Tap the glowing key.");
      hud(); beep(520, 0.1);
    }

    function playKey(k, fromUser) {
      if (!k) return;
      k.down = 1; k.press = 0.18;
      var freq = k.f;
      beep(freq, 0.28, "sine");
      notes.push({ x: k.x + k.w * 0.5, y: k.y, col: k.col, life: 1, name: k.name, vy: -80 });
      var i;
      for (i = 0; i < 8; i++) sparks.push({ x: k.x + k.w * 0.5, y: k.y, vx: (Math.random() - 0.5) * 80, vy: -40 - Math.random() * 60, life: 0.6, col: k.col });
      if (free || !fromUser) return;
      var need = SONGS[song].notes[step];
      if (k.i === need || (need === 7 && k.i === 7)) {
        step++;
        glow = 0.3;
        if (step >= SONGS[song].notes.length) {
          chord([523, 659, 784], 0.2);
          if (song === 2 && !oct2) {
            oct2 = 1; layoutKeys();
            say("Second octave unlocked! High C is yours.");
          }
          song++;
          if (song >= SONGS.length) {
            play = false;
            document.getElementById("dock").classList.remove("on");
            document.getElementById("winP").textContent = "Five songs. Keys went down. Notes flew up.";
            document.getElementById("win").classList.remove("off");
            return;
          }
          step = 0; wait = 0.6;
          say("Song done! Next: " + SONGS[song].n);
          hud();
        } else {
          hopFly(SONGS[song].notes[step], false);
          say("Yes! " + (step + 1) + " / " + SONGS[song].notes.length);
        }
      } else {
        beep(180, 0.08, "square");
        say("Almost — the firefly is on " + NAMES[need] + ".");
        hopFly(need, false);
      }
    }

    function keyAt(mx, my) {
      var i, k;
      for (i = 0; i < keys.length; i++) {
        k = keys[i];
        if (mx >= k.x && mx <= k.x + k.w && my >= k.y && my <= k.y + k.h) return k;
      }
      return null;
    }

    addEventListener("pointerdown", function (e) {
      if (e.target.closest && e.target.closest("a,button")) return;
      if (!play) return;
      var k = keyAt(e.clientX, e.clientY);
      if (k) playKey(k, true);
    });
    document.getElementById("free").onclick = function () {
      free = !free;
      this.classList.toggle("on", free);
      hud();
      say(free ? "Free play. Tap any key. Toggle again to follow." : "Follow the firefly again.");
      beep(600, 0.07);
    };
    document.getElementById("hint").onclick = function () {
      if (!SONGS[song]) return;
      var seq = SONGS[song].notes, i = 0;
      function next() {
        if (i >= seq.length || !keys[seq[i]]) return;
        playKey(keys[Math.min(seq[i], keys.length - 1)], false);
        i++;
        if (i < seq.length) setTimeout(next, 280);
      }
      next();
    };

    function update(dt) {
      t += dt;
      fly.bob += dt * 6;
      fly.x += (fly.tx - fly.x) * Math.min(1, dt * 7);
      fly.y += (fly.ty - fly.y) * Math.min(1, dt * 7);
      if (glow > 0) glow -= dt;
      var i, k;
      for (i = 0; i < keys.length; i++) {
        k = keys[i];
        if (k.press > 0) k.press -= dt;
        k.down += ((k.press > 0 ? 1 : 0) - k.down) * Math.min(1, dt * 16);
      }
      for (i = notes.length - 1; i >= 0; i--) {
        notes[i].life -= dt * 0.7; notes[i].y += notes[i].vy * dt; notes[i].vy -= 20 * dt;
        if (notes[i].life <= 0) notes.splice(i, 1);
      }
      for (i = sparks.length - 1; i >= 0; i--) {
        sparks[i].life -= dt * 1.6; sparks[i].x += sparks[i].vx * dt; sparks[i].y += sparks[i].vy * dt;
        if (sparks[i].life <= 0) sparks.splice(i, 1);
      }
      if (play && !free && SONGS[song]) hopFly(SONGS[song].notes[step] || 0, false);
      dust.push({ x: fly.x + (Math.random() - 0.5) * 8, y: fly.y + 6, life: 0.5 });
      for (i = dust.length - 1; i >= 0; i--) {
        dust[i].life -= dt * 2; dust[i].y += 12 * dt;
        if (dust[i].life <= 0) dust.splice(i, 1);
      }
    }

    function drawRoom() {
      var g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#0f0a2e"); g.addColorStop(0.45, "#1e1b4b"); g.addColorStop(1, "#4c1d95");
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      x.fillStyle = "#fff";
      var i;
      for (i = 0; i < 36; i++) {
        x.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 2 + i));
        x.fillRect((i * 67 + t * 4) % W, 10 + (i * 43) % (H * 0.35), 2, 2);
      }
      x.globalAlpha = 1;
      x.fillStyle = "rgba(253,224,71,.15)";
      x.beginPath(); x.arc(W * 0.8, 70, 50, 0, Math.PI * 2); x.fill();
      x.fillStyle = "#2e1065";
      x.fillRect(0, H * 0.55, W, H * 0.45);
      x.fillStyle = "#3b0764";
      x.fillRect(8, H * 0.58, W - 16, 16);
    }

    function drawKeys() {
      var i, k, dip, target, need;
      need = (!free && SONGS[song]) ? SONGS[song].notes[step] : -1;
      for (i = 0; i < keys.length; i++) {
        k = keys[i];
        dip = k.down * 10;
        x.fillStyle = "#111";
        x.fillRect(k.x + 3, k.y + 8, k.w, k.h);
        target = (k.i === need && glow < 0.2 && !free);
        x.fillStyle = k.press > 0 ? k.col : (target ? "#fde68a" : "#f8fafc");
        x.beginPath();
        if (x.roundRect) x.roundRect(k.x, k.y + dip, k.w, k.h - dip, 8);
        else x.rect(k.x, k.y + dip, k.w, k.h - dip);
        x.fill();
        x.fillStyle = k.press > 0 ? "#fff" : "#4c1d95";
        x.font = "bold 18px Trebuchet MS"; x.textAlign = "center";
        x.fillText(k.name, k.x + k.w * 0.5, k.y + dip + 28);
        if (target) {
          x.strokeStyle = "#fde047"; x.lineWidth = 3;
          x.strokeRect(k.x + 2, k.y + dip + 2, k.w - 4, k.h - dip - 4);
        }
        x.fillStyle = "rgba(0,0,0,.08)";
        x.fillRect(k.x + 6, k.y + dip + k.h * 0.55, k.w - 12, 8);
      }
    }

    function drawFly() {
      var fy = fly.y + Math.sin(fly.bob) * 5;
      x.fillStyle = "rgba(253,224,71,.25)";
      x.beginPath(); x.arc(fly.x, fy, 16 + Math.sin(t * 8) * 3, 0, Math.PI * 2); x.fill();
      x.fillStyle = "#fde047";
      x.beginPath(); x.arc(fly.x, fy, 7, 0, Math.PI * 2); x.fill();
      x.fillStyle = "rgba(255,255,255,.7)";
      x.beginPath(); x.ellipse(fly.x - 8, fy - 2, 7, 4, -0.4, 0, Math.PI * 2); x.fill();
      x.beginPath(); x.ellipse(fly.x + 8, fy - 2, 7, 4, 0.4, 0, Math.PI * 2); x.fill();
      var i;
      for (i = 0; i < dust.length; i++) {
        x.globalAlpha = Math.max(0, dust[i].life);
        x.fillStyle = "#fde047";
        x.beginPath(); x.arc(dust[i].x, dust[i].y, 2, 0, Math.PI * 2); x.fill();
      }
      x.globalAlpha = 1;
    }

    function draw() {
      drawRoom();
      var i;
      for (i = 0; i < notes.length; i++) {
        x.globalAlpha = Math.max(0, notes[i].life);
        x.fillStyle = notes[i].col;
        x.beginPath(); x.arc(notes[i].x, notes[i].y, 12, 0, Math.PI * 2); x.fill();
        x.fillStyle = "#fff"; x.font = "bold 12px Trebuchet MS"; x.textAlign = "center";
        x.fillText(notes[i].name, notes[i].x, notes[i].y + 4);
      }
      x.globalAlpha = 1;
      for (i = 0; i < sparks.length; i++) {
        x.globalAlpha = Math.max(0, sparks[i].life);
        x.fillStyle = sparks[i].col;
        x.fillRect(sparks[i].x, sparks[i].y, 3, 3);
      }
      x.globalAlpha = 1;
      drawKeys();
      if (play) drawFly();
      if (SONGS[song] && !free) {
        x.fillStyle = "#c4b5fd"; x.font = "bold 14px Trebuchet MS"; x.textAlign = "left";
        var seq = SONGS[song].notes, s, lab = "";
        for (s = 0; s < seq.length; s++) lab += (s === step ? "[" : "") + NAMES[seq[s]] + (s === step ? "] " : " ");
        x.fillText(lab, 12, 80);
      }
      x.fillStyle = "rgba(255,255,255,.2)";
      x.fillRect(16, 8, W - 32, 6);
      x.fillStyle = "#fde047";
      var prog = song / 5 + (SONGS[song] ? step / (SONGS[song].notes.length * 5) : 0);
      x.fillRect(16, 8, Math.min(W - 32, prog * (W - 32)), 6);
    }

    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt); draw();
      requestAnimationFrame(loop);
    }
    resize();
    requestAnimationFrame(loop);
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
  })();
  </script>
</body>
</html>
