<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Piano Keys</title>
  <link rel="stylesheet" href="../kid.css" />
  <style>
    html,body{background:#111827}
    .keys{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;gap:8px;z-index:40}
    .keys.on{display:flex}
    .keys button{width:64px;height:160px;border-radius:16px;background:#fff;color:#111;font-weight:900;font-size:28px;box-shadow:0 8px 0 #020617}
    .keys button.lit{background:#fde047}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="rd">Song 1</b></div>
  <div id="say">Watch the keys glow. Copy!</div>
  <div style="position:fixed;inset:0 0 190px 0;display:grid;place-items:center;font-size:110px;pointer-events:none" id="face">🎹</div>
  <div class="keys" id="keys">
    <button data-i="0">1</button>
    <button data-i="1">2</button>
    <button data-i="2">3</button>
    <button data-i="3">4</button>
    <button data-i="4">5</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🎹</div>
    <h1>Piano Keys</h1>
    <p>Copy the little song.</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🎵</div>
    <h1>Music star!</h1>
    <p>Three songs played.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var SONGS = [[2], [0, 4], [1, 2, 3]];
    var song = 0, seq = [], step = 0, listen = false, gen = 0;
    var btns = [].slice.call(document.querySelectorAll("#keys button"));
    var AC = null;
    function beep(i) {
      try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        var o = AC.createOscillator(), g = AC.createGain();
        o.frequency.value = [262, 294, 330, 392, 440][i];
        o.type = "sine"; g.gain.value = 0.12;
        o.connect(g); g.connect(AC.destination);
        o.start(); setTimeout(function () { o.stop(); }, 280);
      } catch (e) {}
    }
    function light(i) {
      btns[i].classList.add("lit"); beep(i);
      document.getElementById("face").textContent = String(i + 1);
      document.getElementById("say").textContent = "Watch key " + (i + 1);
      setTimeout(function () { btns[i].classList.remove("lit"); }, 650);
    }
    function playSong() {
      var my = ++gen;
      listen = false; step = 0; seq = SONGS[song];
      document.getElementById("rd").textContent = "Song " + (song + 1);
      document.getElementById("say").textContent = "Watch the yellow key...";
      var i = 0;
      function tick() {
        if (my !== gen) return;
        if (i >= seq.length) { listen = true; document.getElementById("say").textContent = "Your turn! Tap key " + (seq[0] + 1); return; }
        light(seq[i]); i++; setTimeout(tick, 950);
      }
      setTimeout(tick, 700);
    }
    function start() {
      song = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("keys").classList.add("on");
      playSong();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    btns.forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute("data-i");
        light(i);
        if (!listen) return;
        if (i === seq[step]) {
          step++;
          if (step < seq.length) document.getElementById("say").textContent = "Yes! Next key " + (seq[step] + 1);
          if (step >= seq.length) {
            song++;
            if (song >= SONGS.length) {
              listen = false;
              document.getElementById("keys").classList.remove("on");
              document.getElementById("win").classList.remove("off");
            } else {
              document.getElementById("say").textContent = "Nice song!";
              setTimeout(playSong, 500);
            }
          }
        } else {
          document.getElementById("say").textContent = "Oops. Watch again!";
          playSong();
        }
      };
    });
  })();
  </script>
</body>
</html>
