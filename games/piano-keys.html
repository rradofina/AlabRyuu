<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Piano Keys</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>
    html,body{background:#111827}
    .keys{position:fixed;left:8px;right:8px;bottom:12px;display:none;gap:8px;z-index:40;justify-content:center}
    .keys.on{display:flex}
    .keys button{flex:1;max-width:104px;height:158px;border-radius:18px;background:#fff;color:#111;font-weight:900;font-size:36px;box-shadow:0 8px 0 #020617}
    .keys button.lit{background:#fde047}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="rd">Song 1</b></div>
  <div id="say">Tap the yellow key!</div>
  <div style="position:fixed;inset:0 0 190px 0;display:grid;place-items:center;font-size:110px;pointer-events:none" id="face">🎹</div>
  <div class="keys" id="keys">
    <button data-i="0">1</button>
    <button data-i="1">2</button>
    <button data-i="2">3</button>
    <button data-i="3">4</button>
    <button data-i="4">5</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🎹</div>
    <h1>Piano Keys</h1>
    <p>Tap the yellow key!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🎵</div>
    <h1>Music star!</h1>
    <p>Three songs played.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var SONGS = [[2], [0, 4], [1, 2, 3]];
    var song = 0, seq = [], step = 0, listen = false, gen = 0;
    var btns = [].slice.call(document.querySelectorAll("#keys button"));
    var AC = null;
    function beep(i) {
      try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        var o = AC.createOscillator(), g = AC.createGain();
        o.frequency.value = [262, 294, 330, 392, 440][i];
        o.type = "sine"; g.gain.value = 0.12;
        o.connect(g); g.connect(AC.destination);
        o.start(); setTimeout(function () { o.stop(); }, 280);
      } catch (e) {}
    }
    function showTurn() {
      listen = true; step = 0; seq = SONGS[song];
      document.getElementById("rd").textContent = "Song " + (song + 1);
      btns.forEach(function (b) { b.classList.remove("lit"); });
      btns[seq[0]].classList.add("lit");
      document.getElementById("face").textContent = String(seq[0] + 1);
      document.getElementById("say").textContent = "Tap yellow key " + (seq[0] + 1) + "!";
    }
    function start() {
      song = 0;
      kidBegin();
      document.getElementById("keys").classList.add("on");
      showTurn();
    }
    kidBind(start);
    btns.forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute("data-i");
        beep(i);
        if (!listen) return;
        kidBoom("🎵", innerWidth * 0.5, innerHeight * 0.38);
        if (i === seq[step]) {
          step++;
          if (step >= seq.length) {
            song++;
            if (song >= SONGS.length) {
              listen = false;
              document.getElementById("keys").classList.remove("on");
              kidFinish();
            } else showTurn();
          } else {
            btns.forEach(function (k) { k.classList.remove("lit"); });
            btns[seq[step]].classList.add("lit");
            document.getElementById("face").textContent = String(seq[step] + 1);
            kidPing("Yes! Key " + (seq[step] + 1));
          }
        } else kidPing("Tap the yellow key!");
      };
    });
  })();
  </script>
</body>
</html>
