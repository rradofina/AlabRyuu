<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var open = false;
      try { open = localStorage.getItem("alabryuu-open") === "1"; } catch (e) {}
      if (open) return;
      document.documentElement.classList.add("kid-locked");
      var path = location.pathname || "";
      document.documentElement.style.background = path.indexOf("/alonzorui") === 0 ? "#fff7ed" : "#1e1b4b";
    })();
  </script>
  <style id="kid-lock-hide">
    html.kid-locked, html.kid-locked body { overflow: hidden !important; height: 100% !important; }
    html.kid-locked body { visibility: hidden !important; }
    #kid-lock, #kid-lock * { visibility: visible !important; }
  </style>
  <script src="/kid-lock.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Berry Beak</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../mix.js"></script>
  <style>
    html, body { background: #bbf7d0; }
    .home { z-index: 60; }
    .dock button { font-size: 22px; }
    .dock button i { display: block; width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px; border: 3px solid #1e1b4b; background: var(--c, #fff); }
    .hero svg { width: 96px; height: 96px; display: block; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fl">0 / 4</b></div>
  <div id="say">Drag a berry to the beak</div>
  
  <div class="cover" id="title">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><ellipse cx="40" cy="52" rx="22" ry="16" fill="#38bdf8" stroke="#1e1b4b" stroke-width="4"/><circle cx="60" cy="40" r="12" fill="#38bdf8" stroke="#1e1b4b" stroke-width="4"/><path d="M70 40 h14 l-8 6 Z" fill="#f59e0b" stroke="#1e1b4b" stroke-width="3"/><circle cx="24" cy="62" r="8" fill="#ef4444" stroke="#1e1b4b" stroke-width="3"/></svg></div>
    <h1>Berry Beak</h1>
    <p>A miss snaps back to the leaf.</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><ellipse cx="40" cy="52" rx="22" ry="16" fill="#38bdf8" stroke="#1e1b4b" stroke-width="4"/><circle cx="60" cy="40" r="12" fill="#38bdf8" stroke="#1e1b4b" stroke-width="4"/><path d="M70 40 h14 l-8 6 Z" fill="#f59e0b" stroke="#1e1b4b" stroke-width="3"/><circle cx="24" cy="62" r="8" fill="#ef4444" stroke="#1e1b4b" stroke-width="3"/></svg></div>
    <h1>The bird is full!</h1>
    <p>Four berries, happy bird.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
(function () {
  var cv = document.getElementById("c");
  var ui = Mix.boot(cv);
  var ctx, W = 0, H = 0, raf = 0;
  function layout(force) {
    var r = cv.getBoundingClientRect();
    var rw = Math.round(r.width || 0), rh = Math.round(r.height || 0);
    if (!force && ctx && Math.round(W) === rw && Math.round(H) === rh && rw > 0) return;
    var f = ui.fit();
    ctx = f.ctx; W = f.W; H = f.H;
  }
  function loop() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  function frame() {
    if (!ui.on()) return;
    layout(false);
    if (W < 2 || H < 2) { raf = requestAnimationFrame(frame); return; }
    if (step() === "stop") return;
    draw();
    raf = requestAnimationFrame(frame);
  }
  function begin() { layout(true); reset(); loop(); }
  function hud(t) {
    var el = document.getElementById("fl");
    if (el) el.textContent = t;
    var m = String(t).match(/\d+/);
    if (m) cv.dataset.score = m[0];
  }
  function sky(a, b) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ui.begin(begin);
  ui.replay(begin);
  
  var berry, score, drag, homing;
  function home() { return { x: W * 0.28, y: H * 0.72 }; }
  function beak() { return { x: W * 0.66, y: H * 0.44 }; }
  function reset() {
    var h = home();
    berry = { x: h.x, y: h.y }; score = 0; drag = false; homing = false;
    hud("0 / 4");
  }
  cv.addEventListener("pointerdown", function (e) {
    if (!ui.on()) return;
    var p = kidPt(e, cv), dx = p.x - berry.x, dy = p.y - berry.y;
    if (dx * dx + dy * dy < 70 * 70) {
      drag = true; homing = false;
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  cv.addEventListener("pointermove", function (e) {
    if (!drag || !ui.on()) return;
    var p = kidPt(e, cv); berry.x = p.x; berry.y = p.y;
  });
  cv.addEventListener("pointerup", function () {
    if (!drag) return;
    drag = false;
    var b = beak(), dx = berry.x - b.x, dy = berry.y - b.y;
    if (dx * dx + dy * dy < 78 * 78) {
      score++;
      kidNote(640);
      hud(score + " / 4");
      kidPing("Yum");
      if (score >= 4) { draw(); ui.finish(); return; }
      var h = home(); berry.x = h.x; berry.y = h.y;
    } else {
      homing = true;
      kidNote(247);
      kidPing("Back to the leaf");
    }
  });
  function step() {
    if (homing) {
      var h = home();
      berry.x += (h.x - berry.x) * 0.18;
      berry.y += (h.y - berry.y) * 0.18;
      if (Math.abs(berry.x - h.x) < 2 && Math.abs(berry.y - h.y) < 2) homing = false;
    }
    var b = beak();
    cv.dataset.bx = String(Math.round(berry.x));
    cv.dataset.by = String(Math.round(berry.y));
    cv.dataset.kx = String(Math.round(b.x));
    cv.dataset.ky = String(Math.round(b.y));
  }
  function draw() {
    sky("#bbf7d0", "#86efac");
    ctx.strokeStyle = "#166534"; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(W * 0.08, H * 0.5); ctx.lineTo(W * 0.92, H * 0.5); ctx.stroke();
    var b = beak();
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath(); ctx.ellipse(b.x - 36, b.y + 16, 36, 22, 0, 0, Math.PI * 2); ctx.fill(); Mix.ink(ctx);
    ctx.beginPath(); ctx.arc(b.x + 6, b.y - 6, 18, 0, Math.PI * 2); ctx.fill(); Mix.ink(ctx);
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath(); ctx.moveTo(b.x + 18, b.y - 4); ctx.lineTo(b.x + 40, b.y + 2); ctx.lineTo(b.x + 18, b.y + 8); ctx.closePath(); ctx.fill(); Mix.ink(ctx);
    ctx.fillStyle = "#1e1b4b";
    ctx.beginPath(); ctx.arc(b.x + 10, b.y - 10, 3, 0, 7); ctx.fill();
    ctx.fillStyle = "#166534";
    ctx.beginPath(); ctx.ellipse(home().x, home().y + 8, 22, 10, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.arc(berry.x, berry.y, 22, 0, Math.PI * 2); ctx.fill(); Mix.ink(ctx);
    ctx.fillStyle = "#166534";
    ctx.fillRect(berry.x - 2, berry.y - 30, 5, 12);
  }

  layout(true);
  if (W > 2) { reset(); draw(); }
  addEventListener("resize", function () { layout(true); if (W > 2) draw(); });
})();
  </script>
</body>
</html>
