<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Number Train</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background: #38bdf8; color: #1e3a5f; touch-action: none; user-select: none; }
    button { background: transparent; border: 0; appearance: none; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .home { position: fixed; top: 12px; left: 12px; z-index: 12; color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; background: rgba(0,0,0,.28); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 12px; right: 12px; z-index: 8; font-weight: 800; text-align: right; pointer-events: none; }
    #hud b { display: inline-block; background: #fff; padding: 6px 12px; border-radius: 999px; margin-left: 6px; font-size: 14px; box-shadow: 0 3px 0 #1e3a5f; }
    #say { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 8; font-weight: 800; color: #fff; text-shadow: 0 2px 0 #0369a1; pointer-events: none; text-align: center; width: 92%; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; gap: 8px; padding: 20px 20px 48px; pointer-events: none; }
    .cover.off { display: none; }
    .cover h1 { font-size: clamp(30px, 8vw, 46px); color: #fff; text-shadow: 0 4px 0 #1e3a5f; }
    .cover p { font-weight: 800; color: #e0f2fe; }
    .btn { pointer-events: auto; background: #ffd166; color: #3b2100; font-weight: 800; font-size: 24px; padding: 14px 28px; border-radius: 999px; box-shadow: 0 7px 0 #e09f1f; }
    .btn.g { background: #86efac; color: #14532d; box-shadow: 0 7px 0 #16a34a; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="stn">Station 1</b><b id="nx">Next 1</b><b id="st">⭐ 0</b></div>
  <div id="say">Tap cars in order as they couple!</div>
  <div class="cover" id="title">
    <h1>Number Train</h1>
    <p>Cars roll in. Tap 1 then 2...<br>Load cargo. Wave to the conductor!</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <h1>All stations!</h1>
    <p id="winP">Counted to ten.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), g = cv.getContext("2d");
    var W, H, last = 0, t = 0, mode = "title", stars = 0, station = 0;
    var cars = [], nextN = 1, maxN = 4, cargo = [], smoke = [], coupled = 0;
    var av = { name: "Kid", hair: "🧒", hat: "", shirt: "#f472b6" };
    try {
      var s = JSON.parse(localStorage.getItem("alabryuu-avatar") || "null");
      if (s) { av.name = s.name || av.name; av.hair = s.hair || av.hair; av.hat = s.hat || ""; av.shirt = s.shirt || av.shirt; }
    } catch (e) {}

    var STATIONS = [
      { n: "Little Halt", max: 4, cargo: ["📦", "📮"] },
      { n: "Meadow Stop", max: 5, cargo: ["🥕", "📦", "🌼"] },
      { n: "River Depot", max: 7, cargo: ["🐟", "📦", "📮"] },
      { n: "Hill Junction", max: 8, cargo: ["🍎", "📦", "🪵", "📮"] },
      { n: "Grand Central", max: 10, cargo: ["👑", "📦", "🎁", "⭐", "📮"] }
    ];
    var CAR_COLS = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#14b8a6", "#3b82f6", "#8b5cf6", "#ec4899", "#f43f5e", "#84cc16"];

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), gn = ac.createGain();
        o.type = "sine"; o.frequency.value = f; gn.gain.value = 0.07;
        o.connect(gn); gn.connect(ac.destination); o.start();
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function lerp(a, b, p) { return a + (b - a) * p; }
    function rnd(a, b) { return a + Math.random() * (b - a); }

    function resize() {
      cv.width = innerWidth * (devicePixelRatio || 1);
      cv.height = innerHeight * (devicePixelRatio || 1);
      g.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0);
      W = innerWidth; H = innerHeight;
    }
    addEventListener("resize", resize); resize();

    function loadStation() {
      var S = STATIONS[station], i, nums = [];
      maxN = S.max; nextN = 1; coupled = 0; cars = []; cargo = []; smoke = [];
      for (i = 1; i <= maxN; i++) nums.push(i);
      nums.sort(function () { return Math.random() - 0.5; });
      for (i = 0; i < maxN; i++) {
        cars.push({
          n: nums[i], x: W + 80 + i * 90, y: H * 0.58, tx: 0, coupled: 0,
          roll: rnd(0, 6), col: CAR_COLS[(nums[i] - 1) % 10], cargo: "", bounce: 0
        });
      }
      document.getElementById("stn").textContent = S.n;
      document.getElementById("nx").textContent = "Next " + nextN;
      document.getElementById("say").textContent = av.name + " says tap " + nextN + "!";
    }

    function engineX() { return 70; }

    function tapCar(mx, my) {
      if (mode !== "play") return;
      cars.forEach(function (c) {
        if (c.coupled) return;
        if (Math.abs(mx - c.x) < 36 && Math.abs(my - c.y) < 40) {
          if (c.n === nextN) {
            c.coupled = 1; c.bounce = 1;
            c.tx = engineX() + coupled * 62 + 70;
            coupled++; nextN++;
            stars += 1;
            document.getElementById("nx").textContent = nextN <= maxN ? "Next " + nextN : "Cargo!";
            document.getElementById("st").textContent = "⭐ " + stars;
            document.getElementById("say").textContent = c.n === maxN ? "All coupled! Load cargo." : "Yes! Now " + nextN + ".";
            beep(400 + c.n * 40, 0.08);
            if (coupled >= maxN) startCargo();
          } else {
            c.bounce = 1;
            document.getElementById("say").textContent = "That is " + c.n + ". Looking for " + nextN + ".";
            beep(180, 0.07);
          }
        }
      });
      cargo.forEach(function (k) {
        if (k.got) return;
        if (Math.hypot(mx - k.x, my - k.y) < 28) {
          var free = cars.filter(function (c) { return c.coupled && !c.cargo; })[0];
          if (free) {
            k.got = 1; k.tx = free.tx; k.ty = H * 0.58 - 18; free.cargo = k.e;
            stars += 1; document.getElementById("st").textContent = "⭐ " + stars;
            beep(640, 0.08);
            if (cars.every(function (c) { return !c.coupled || c.cargo; })) finishStation();
          }
        }
      });
    }

    function startCargo() {
      var S = STATIONS[station], i;
      cargo = S.cargo.map(function (e, i) {
        return { e: e, x: 80 + i * 50, y: H * 0.78, got: 0, tx: 0, ty: 0, p: 0 };
      });
      while (cargo.length < maxN) cargo.push({ e: "📦", x: 80 + cargo.length * 50, y: H * 0.78, got: 0, tx: 0, ty: 0, p: 0 });
      document.getElementById("say").textContent = "Tap cargo onto the cars!";
    }

    function finishStation() {
      stars += 4; document.getElementById("st").textContent = "⭐ " + stars;
      beep(660, 0.12); setTimeout(function () { beep(880, 0.16); }, 90);
      if (station < STATIONS.length - 1) {
        station++;
        document.getElementById("say").textContent = "Next station!";
        setTimeout(loadStation, 800);
      } else {
        mode = "win";
        document.getElementById("win").classList.remove("off");
        document.getElementById("winP").textContent = av.name + " counted to ten. " + stars + " stars.";
      }
    }

    function drawWorld() {
      var grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, "#7dd3fc"); grd.addColorStop(0.4, "#38bdf8"); grd.addColorStop(0.4, "#94a3b8"); grd.addColorStop(0.46, "#64748b"); grd.addColorStop(1, "#334155");
      g.fillStyle = grd; g.fillRect(0, 0, W, H);
      g.fillStyle = "#b91c1c";
      g.beginPath(); g.moveTo(W * 0.15, 130); g.lineTo(W * 0.5, 70); g.lineTo(W * 0.85, 130); g.fill();
      g.fillStyle = "#fef3c7"; g.fillRect(W * 0.2, 130, W * 0.6, 36);
      g.fillStyle = "#fff"; g.beginPath(); g.arc(W * 0.5, 118, 18, 0, 6.28); g.fill();
      g.strokeStyle = "#1e293b"; g.lineWidth = 3; g.stroke();
      g.fillStyle = "#1e293b"; g.font = "bold 10px Trebuchet MS"; g.textAlign = "center";
      g.fillText("12", W * 0.5, 122);
      g.fillStyle = "#334155";
      g.fillRect(0, H * 0.58 + 28, W, 8);
      g.fillRect(0, H * 0.58 + 42, W, 8);
      var i;
      for (i = 0; i < 20; i++) g.fillRect(i * (W / 20), H * 0.58 + 24, 16, 30);
    }

    function drawConductor() {
      g.save();
      g.translate(36, H * 0.5);
      g.fillStyle = av.shirt; g.fillRect(-14, 8, 28, 18);
      g.font = "32px serif"; g.textAlign = "center";
      g.fillText(av.hat || "", 0, -18);
      g.fillText(av.hair, 0, 6);
      g.font = "bold 11px Trebuchet MS"; g.fillStyle = "#fff";
      g.fillText(av.name, 0, 36);
      g.restore();
    }

    function drawEngine() {
      g.save();
      g.translate(engineX(), H * 0.58);
      g.font = "44px serif"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("🚂", 0, 0);
      g.restore();
      smoke.forEach(function (s) {
        g.globalAlpha = s.life * 0.5; g.fillStyle = "#e7e5e4";
        g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.28); g.fill(); g.globalAlpha = 1;
      });
    }

    function drawCars() {
      cars.forEach(function (c) {
        g.save();
        g.translate(c.x, c.y + Math.sin(c.roll) * 2 + (c.bounce > 0 ? Math.sin(c.bounce * 12) * 6 : 0));
        g.fillStyle = c.col;
        roundFill(-28, -22, 56, 40, 10);
        g.fillStyle = "#1e293b";
        g.beginPath(); g.arc(-16, 20, 7, 0, 6.28); g.arc(16, 20, 7, 0, 6.28); g.fill();
        g.fillStyle = "#fff"; g.font = "bold 20px Trebuchet MS"; g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(c.n, 0, -2);
        if (c.cargo) { g.font = "16px serif"; g.fillText(c.cargo, 0, -28); }
        g.restore();
      });
      cargo.forEach(function (k) {
        if (k.got && k.p >= 1) return;
        var x = k.got ? lerp(k.x, k.tx, k.p) : k.x;
        var y = k.got ? lerp(k.y, k.ty, k.p) - Math.sin(k.p * Math.PI) * 30 : k.y;
        g.font = "24px serif"; g.textAlign = "center"; g.fillText(k.e, x, y);
      });
    }

    function roundFill(x, y, w, h, r) {
      g.beginPath();
      g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.fill();
    }

    function drawTitleTrain() {
      drawWorld();
      drawConductor();
      var x = W - ((t * 80) % (W + 200));
      g.font = "44px serif"; g.textAlign = "center";
      g.fillText("🚂", x, H * 0.56);
      var i;
      for (i = 1; i <= 4; i++) {
        g.fillStyle = CAR_COLS[i - 1];
        roundFill(x + i * 58 - 20, H * 0.56 - 18, 44, 32, 8);
        g.fillStyle = "#fff"; g.font = "bold 18px Trebuchet MS"; g.fillText(i, x + i * 58 + 2, H * 0.56 + 4);
      }
    }

    
    var ntAmb = { t: 0, bits: [], ok: 0, motes: [], walk: 0, sayI: 0 };
    var ntAmbE = ["🎫", "📦", "🐦", "🛎️", "🚂", "🚩", "🕐", "🧒"];
    var ntAmbC = ["#7dd3fc", "#1e3a5f", "#b91c1c", "#fde047", "#38bdf8"];
    var ntAmbL = ["Cars roll in from the right.", "Couple 1 then 2 then 3.", "Conductor is your avatar.", "Cargo hops onto the roof.", "Wheels spin while rolling.", "Grand Central goes to ten.", "Smoke puffs from the stack.", "Stations get longer, never mean."];
    function ntAmbBoot() {
      var i;
      ntAmb.bits = [];
      ntAmb.motes = [];
      ntAmb.ok = 1;
      for (i = 0; i < 28; i++) {
        ntAmb.bits.push({
          e: ntAmbE[i % ntAmbE.length],
          x: Math.random() * (W || 360),
          y: 70 + Math.random() * ((H || 640) * 0.22),
          vx: -12 + Math.random() * 24,
          ph: Math.random() * 6.28,
          s: 0.7 + Math.random() * 0.7
        });
      }
      for (i = 0; i < 40; i++) {
        ntAmb.motes.push({
          x: Math.random() * (W || 360),
          y: Math.random() * (H || 640),
          r: 1 + Math.random() * 2,
          ph: Math.random() * 6,
          c: ntAmbC[i % ntAmbC.length]
        });
      }
    }
    function ntAmbStep(dt) {
      if (!ntAmb.ok) ntAmbBoot();
      ntAmb.t += dt;
      ntAmb.walk += dt;
      ntAmb.bits.forEach(function (b) {
        b.x += b.vx * dt;
        b.ph += dt;
        if (b.x < -20) b.x = (W || 360) + 20;
        if (b.x > (W || 360) + 20) b.x = -20;
      });
      ntAmb.motes.forEach(function (m) { m.ph += dt * 1.4; });
      if (Math.floor(ntAmb.t * 0.35) !== ntAmb.sayI) ntAmb.sayI = Math.floor(ntAmb.t * 0.35);
    }
    function ntAmbFrame() {
      g.strokeStyle = ntAmbC[2];
      g.lineWidth = 7;
      g.strokeRect(3, 3, (W || 360) - 6, (H || 640) - 6);
      g.strokeStyle = "rgba(255,255,255,.18)";
      g.lineWidth = 2;
      g.strokeRect(9, 9, (W || 360) - 18, (H || 640) - 18);
    }
    function ntAmbMotes() {
      ntAmb.motes.forEach(function (m) {
        g.globalAlpha = 0.12 + 0.1 * Math.sin(m.ph);
        g.fillStyle = m.c;
        g.beginPath();
        g.arc(m.x, m.y, m.r, 0, 6.28);
        g.fill();
        g.globalAlpha = 1;
      });
    }
    function ntAmbFloaters() {
      ntAmb.bits.forEach(function (b) {
        g.save();
        g.globalAlpha = 0.55;
        g.translate(b.x, b.y + Math.sin(b.ph * 2) * 4);
        g.rotate(Math.sin(b.ph) * 0.2);
        g.font = (15 * b.s) + "px serif";
        g.textAlign = "center";
        g.fillText(b.e, 0, 0);
        g.restore();
        g.globalAlpha = 1;
      });
    }
    function ntAmbLanterns() {
      var i, x, y;
      for (i = 0; i < 7; i++) {
        x = 18 + i * (((W || 360) - 36) / 6);
        y = 22 + Math.sin(ntAmb.t * 3 + i) * 3;
        g.fillStyle = ntAmbC[i % ntAmbC.length];
        g.beginPath();
        g.arc(x, y, 4.5, 0, 6.28);
        g.fill();
        g.strokeStyle = "rgba(255,255,255,.35)";
        g.beginPath();
        g.moveTo(x, y + 4);
        g.lineTo(x, y + 12);
        g.stroke();
      }
    }
    function ntAmbWalkers() {
      var i, x;
      for (i = 0; i < 3; i++) {
        x = ((ntAmb.walk * 28 + i * 150) % ((W || 360) + 50)) - 25;
        g.save();
        g.translate(x, (H || 640) * 0.92);
        g.scale(1, 1 + Math.sin(ntAmb.walk * 8 + i) * 0.07);
        g.font = "18px serif";
        g.textAlign = "center";
        g.fillText(ntAmbE[i % ntAmbE.length], 0, 0);
        g.restore();
      }
    }
    function ntAmbCaption() {
      var msg = ntAmbL[ntAmb.sayI % ntAmbL.length];
      g.globalAlpha = 0.55;
      g.fillStyle = "#fff";
      g.font = "bold 11px Trebuchet MS";
      g.textAlign = "left";
      g.fillText(msg, 14, (H || 640) - 8);
      g.globalAlpha = 1;
    }
    function ntAmbRibbon() {
      g.save();
      g.translate((W || 360) / 2, 34);
      g.rotate(Math.sin(ntAmb.t * 2) * 0.03);
      g.fillStyle = ntAmbC[2];
      g.beginPath();
      g.moveTo(-74, -7);
      g.lineTo(74, -7);
      g.lineTo(82, 11);
      g.lineTo(-82, 11);
      g.closePath();
      g.fill();
      g.fillStyle = "#fff";
      g.font = "bold 11px Trebuchet MS";
      g.textAlign = "center";
      g.fillText(ntAmbL[(ntAmb.sayI + 1) % ntAmbL.length], 0, 6);
      g.restore();
    }
    function ntAmbHorizon() {
      var x;
      g.strokeStyle = ntAmbC[1];
      g.lineWidth = 2;
      g.globalAlpha = 0.2;
      g.beginPath();
      g.moveTo(0, (H || 640) * 0.8);
      for (x = 0; x <= (W || 360); x += 8) {
        g.lineTo(x, (H || 640) * 0.8 + Math.sin(x * 0.05 + ntAmb.t) * 4);
      }
      g.stroke();
      g.globalAlpha = 1;
    }
    function ntAmbVignette() {
      var grd = g.createRadialGradient((W||360)/2, (H||640)/2, (W||360)*0.35, (W||360)/2, (H||640)/2, (W||360)*0.75);
      grd.addColorStop(0, "rgba(0,0,0,0)");
      grd.addColorStop(1, "rgba(0,0,0,0.12)");
      g.fillStyle = grd;
      g.fillRect(0, 0, W || 360, H || 640);
    }
    function ntAmbPaint() {
      if (!ntAmb.ok) ntAmbBoot();
      ntAmbMotes();
      ntAmbFloaters();
      ntAmbLanterns();
      ntAmbHorizon();
      ntAmbWalkers();
      ntAmbRibbon();
      ntAmbCaption();
      ntAmbFrame();
      ntAmbVignette();
    }

    function ntAmbExtra1() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + ntAmb.t * 0.3 + 1;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 4);
        y = 46 + Math.sin(a * 2) * (6 + 1);
        g.globalAlpha = 0.22;
        g.fillStyle = ntAmbC[i % ntAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = ntAmbC[1 % ntAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 1) + Math.sin(i * 0.5 + ntAmb.t + 1) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function ntAmbExtra2() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + ntAmb.t * 0.4 + 2;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 8);
        y = 46 + Math.sin(a * 2) * (6 + 2);
        g.globalAlpha = 0.22;
        g.fillStyle = ntAmbC[i % ntAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = ntAmbC[2 % ntAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 2) + Math.sin(i * 0.5 + ntAmb.t + 2) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function ntAmbExtra3() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + ntAmb.t * 0.5 + 3;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 12);
        y = 46 + Math.sin(a * 2) * (6 + 3);
        g.globalAlpha = 0.22;
        g.fillStyle = ntAmbC[i % ntAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = ntAmbC[3 % ntAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 3) + Math.sin(i * 0.5 + ntAmb.t + 3) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function ntAmbExtra4() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + ntAmb.t * 0.6 + 4;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 16);
        y = 46 + Math.sin(a * 2) * (6 + 4);
        g.globalAlpha = 0.22;
        g.fillStyle = ntAmbC[i % ntAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = ntAmbC[4 % ntAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);

    function update(dt) {
      ntAmbStep(typeof dt === 'number' ? dt : 0.016);
      t += dt;
      if (mode === "title" || mode === "win") {
        if (Math.random() < 0.3) smoke.push({ x: W - ((t * 80) % (W + 200)), y: H * 0.5, vx: rnd(-8, 8), vy: rnd(-30, -10), life: 1, r: rnd(4, 8) });
        smoke.forEach(function (s) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 0.8; s.r += dt * 4; });
        smoke = smoke.filter(function (s) { return s.life > 0; });
        return;
      }
      cars.forEach(function (c) {
        if (!c.coupled) {
          c.x -= 55 * dt;
          if (c.x < 120) c.x = W + rnd(40, 160);
          c.roll += dt * 8;
        } else {
          c.x = lerp(c.x, c.tx, 1 - Math.pow(0.002, dt));
          c.roll += dt * 10;
        }
        if (c.bounce > 0) c.bounce -= dt;
      });
      cargo.forEach(function (k) { if (k.got) k.p = Math.min(1, k.p + dt * 1.6); });
      if (Math.random() < 0.25) smoke.push({ x: engineX() - 6, y: H * 0.52, vx: rnd(-10, 6), vy: rnd(-36, -14), life: 1, r: rnd(4, 7) });
      smoke.forEach(function (s) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 0.8; s.r += dt * 5; });
      smoke = smoke.filter(function (s) { return s.life > 0; });
    }

    function draw() {
      if (mode === "title" || mode === "win") { drawTitleTrain(); return; }
      drawWorld(); drawConductor(); drawEngine(); drawCars();
      ntAmbPaint();
      ntAmbExtra1();
      ntAmbExtra2();
      ntAmbExtra3();
      ntAmbExtra4();
      ntAmbExtra5();
      ntAmbExtra6();
      ntAmbExtra7();
      ntAmbExtra8();

    }

    function loop(now) {
      var dt = Math.min(0.033, (now - last) / 1000 || 0.016);
      last = now; update(dt); draw(); requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function start() {
      mode = "play"; station = 0; stars = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("st").textContent = "⭐ 0";
      loadStation(); beep(480, 0.1);
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = function () { document.getElementById("win").classList.add("off"); start(); };
    cv.addEventListener("pointerdown", function (e) { tapCar(e.clientX, e.clientY); });
