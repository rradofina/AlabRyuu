<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Number Train</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>
    html,body{background:#0f172a}
    .cars{position:fixed;left:50%;top:54%;transform:translate(-50%,-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:min(94vw,480px);z-index:2}
    .cars button{width:100px;height:110px;border-radius:24px;background:#fff;color:#0f172a;font-weight:900;font-size:42px;box-shadow:0 8px 0 #020617}
    .cars button span{display:block;font-size:36px}
    .cars button.done{opacity:.35}
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div id="hud"><b id="nx">Next 1</b></div>
  <div id="say">Tap 1, then 2, then 3...</div>
  <div style="position:fixed;top:120px;left:0;right:0;text-align:center;font-size:80px;pointer-events:none">🚂</div>
  <div class="cars" id="cars"></div>
  <div class="cover" id="title">
    <div class="hero">🚂</div>
    <h1>Number Train</h1>
    <p>Tap the cars in order.</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🥳</div>
    <h1>Choo choo!</h1>
    <p>1 2 3 4 5 all aboard.</p>
    <button class="play g" id="again">Ride again</button>
  </div>
  <script>
  (function () {
    var next = 1, nums = [1, 2, 3, 4, 5];
    function shuffle(a) {
      for (var i = a.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    }
    function deal() {
      next = 1;
      var box = document.getElementById("cars");
      box.innerHTML = "";
      shuffle(nums.slice()).forEach(function (n) {
        var b = document.createElement("button");
        b.innerHTML = "<span>🚃</span>" + n;
        b.onclick = function () {
          if (n === next) {
            b.classList.add("done");
            next++;
            document.getElementById("nx").textContent = next > 5 ? "Done!" : "Next " + next;
            document.getElementById("say").textContent = n === 5 ? "All aboard!" : "Yes! Now " + next;
            if (next > 5) document.getElementById("win").classList.remove("off");
          } else document.getElementById("say").textContent = "Find " + next + "!";
        };
        box.appendChild(b);
      });
      document.getElementById("nx").textContent = "Next 1";
      document.getElementById("say").textContent = "Tap 1 first!";
    }
    function start() {
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      deal();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
  })();
  </script>
</body>
</html>
