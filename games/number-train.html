<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Number Train</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      color: #1e3a5f; touch-action: manipulation; user-select: none;
    }
    button {
      background: transparent; border: 0; appearance: none; -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(#7dd3fc 0%, #38bdf8 38%, #94a3b8 38%, #94a3b8 42%, #64748b 42%);
      padding: 54px 10px 20px;
    }
    .home {
      position: fixed; top: 12px; left: 12px; z-index: 9;
      color: #fff; text-decoration: none; font-weight: 800; font-size: 18px;
      background: rgba(0,0,0,.28); padding: 8px 14px; border-radius: 999px;
    }
    .sky-deco { text-align: center; font-size: 22px; letter-spacing: 10px; opacity: .8; margin-bottom: 4px; }
    .station { max-width: 440px; margin: 0 auto; }
    .roof {
      background: #b91c1c; clip-path: polygon(4% 100%, 50% 0, 96% 100%);
      height: 52px; box-shadow: 0 8px 0 #7f1d1d;
    }
    .clock {
      width: 44px; height: 44px; margin: -28px auto 0; border-radius: 50%;
      background: #fff; border: 4px solid #1e293b; font-weight: 800; font-size: 11px;
      display: grid; place-items: center; position: relative; z-index: 2;
    }
    .hall {
      background: #fef3c7; border: 6px solid #92400e; border-radius: 0 0 16px 16px;
      padding: 10px 10px 14px; box-shadow: 0 10px 0 rgba(0,0,0,.18);
    }
    .plats { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
    .plat {
      flex: 1; max-width: 120px; padding: 6px 4px; border-radius: 10px;
      background: #cbd5e1; font-weight: 800; font-size: 12px; text-align: center;
    }
    .plat.on { background: #facc15; box-shadow: 0 0 0 3px #eab308; }
    .plat.done { background: #86efac; }
    .cond {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 4px auto 8px; padding: 6px 14px; border-radius: 999px;
      font-weight: 800; color: #222; background: #ffd166;
    }
    .ticket {
      display: flex; justify-content: space-between; gap: 8px;
      background: #fff; border: 3px dashed #64748b; border-radius: 12px;
      padding: 8px 12px; font-weight: 800; font-size: 16px; margin-bottom: 10px;
    }
    .msg { font-weight: 800; text-align: center; margin: 0 0 8px; font-size: 18px; min-height: 1.4em; }
    .rails {
      background: repeating-linear-gradient(#78716c, #78716c 6px, #a8a29e 6px 10px);
      border-radius: 12px; padding: 10px 8px 14px; position: relative;
    }
    .rails::before, .rails::after {
      content: ""; position: absolute; left: 8px; right: 8px; height: 3px; background: #334155;
    }
    .rails::before { top: 8px; }
    .rails::after { bottom: 10px; }
    .train { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; position: relative; z-index: 1; }
    .engine {
      width: 72px; height: 72px; border-radius: 18px 22px 14px 14px;
      background: #111827; color: #fff; font-size: 36px;
      display: grid; place-items: center; box-shadow: 0 6px 0 #020617;
    }
    .car {
      width: 68px; height: 68px; border-radius: 16px; font-size: 20px; font-weight: 800;
      box-shadow: 0 6px 0 rgba(0,0,0,.25); color: #111;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .car:active { transform: translateY(3px); }
    .car.ready { outline: 4px solid #fff; animation: pulse 0.6s ease infinite; }
    .car.loaded { opacity: .55; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    .dock { margin-top: 12px; background: #92400e; border-radius: 14px; padding: 10px; }
    .dock h3 { color: #fde68a; font-size: 16px; margin-bottom: 8px; text-align: center; }
    .crates { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .crate {
      width: 64px; height: 64px; border-radius: 12px; font-size: 32px;
      background: #d97706; box-shadow: 0 5px 0 #78350f;
    }
    .crate:active { transform: translateY(3px); }
    .crate:disabled { opacity: .35; }
    .win {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      flex-direction: column; background: rgba(15,23,42,.86); z-index: 8; gap: 12px;
      color: #fff; text-align: center; padding: 20px;
    }
    .win.on { display: flex; }
    .play, .next { font-weight: 800; font-size: 24px; padding: 14px 26px; border-radius: 999px; }
    .play { background: #ffd166; color: #3b2100; box-shadow: 0 7px 0 #e09f1f; }
    .next { background: #7dd3fc; color: #0c4a6e; box-shadow: 0 7px 0 #38bdf8; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div class="sky-deco">☁️ ☁️ ☁️</div>
  <div class="station">
    <div class="roof"></div>
    <div class="clock">12:00</div>
    <div class="hall">
      <div class="plats">
        <div class="plat on" id="p0">Platform 1<br>1–5</div>
        <div class="plat" id="p1">Platform 2<br>1–8</div>
        <div class="plat" id="p2">Platform 3<br>1–10</div>
      </div>
      <div style="text-align:center"><div class="cond" id="cond"></div></div>
      <div class="ticket">
        <span id="nextNum">Next: 1</span>
        <span id="starChip">Cargo ★ 0</span>
      </div>
      <p class="msg" id="msg">Tap car 1!</p>
      <div class="rails">
        <div class="train" id="track"></div>
      </div>
      <div class="dock">
        <h3>Load cargo</h3>
        <div class="crates" id="crates"></div>
      </div>
    </div>
  </div>
  <div class="win" id="win">
    <div style="font-size:72px">🚂</div>
    <h2 id="wint">Choo choo!</h2>
    <p id="winline"></p>
    <button class="play" id="again" type="button">Play again</button>
    <button class="next" id="nextBtn" type="button">Next platform</button>
  </div>
  <script>
    function av() {
      try {
        var a = JSON.parse(localStorage.getItem("alabryuu-avatar") || "null");
        if (a && a.name) return a;
      } catch (e) {}
      return { name: "Kid", hair: "🧒", shirt: "#ffd166", pet: "🐶" };
    }
    function beep(f, d) {
      try {
        var c = window._ac || (window._ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = c.createOscillator(), g = c.createGain();
        o.frequency.value = f; g.gain.value = 0.12;
        o.connect(g); g.connect(c.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
        o.stop(c.currentTime + d);
      } catch (e) {}
    }
    var A = av();
    var sizes = [5, 8, 10];
    var cols = ["#ef4444","#f97316","#f59e0b","#84cc16","#22c55e","#14b8a6","#3b82f6","#6366f1","#a855f7","#ec4899"];
    var crateArt = ["📦","🎁","🧃","🧸","⭐"];
    var plat = 0, need = 1, stars = 0, waiting = false, carEls = {};
    document.getElementById("cond").innerHTML = A.hair + " Conductor " + A.name + " " + (A.pet || "");
    document.getElementById("cond").style.background = A.shirt || "#ffd166";
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }
    function hud() {
      document.getElementById("nextNum").textContent = waiting ? "Load car " + (need - 1) : "Next: " + need;
      document.getElementById("starChip").textContent = "Cargo ★ " + stars;
      for (var i = 0; i < 3; i++) {
        var el = document.getElementById("p" + i);
        el.classList.toggle("on", i === plat);
        el.classList.toggle("done", i < plat);
      }
    }
    function fillCrates() {
      var box = document.getElementById("crates");
      box.innerHTML = "";
      for (var i = 0; i < 4; i++) {
        var b = document.createElement("button");
        b.className = "crate";
        b.textContent = crateArt[i % crateArt.length];
        b.onclick = onCrate;
        box.appendChild(b);
      }
    }
    function build() {
      need = 1; waiting = false; carEls = {};
      var n = sizes[plat];
      var nums = [];
      for (var i = 1; i <= n; i++) nums.push(i);
      shuffle(nums);
      var track = document.getElementById("track");
      track.innerHTML = "";
      var eng = document.createElement("div");
      eng.className = "engine";
      eng.textContent = "🚂";
      track.appendChild(eng);
      nums.forEach(function (num) {
        var b = document.createElement("button");
        b.className = "car";
        b.style.background = cols[num - 1];
        b.innerHTML = "<span>🚃</span><span>" + num + "</span>";
        b.onclick = function () { onCar(num, b); };
        track.appendChild(b);
        carEls[num] = b;
      });
      fillCrates();
      document.getElementById("msg").textContent = "Tap car 1!";
      hud();
    }
    function onCar(num, el) {
      if (waiting) {
        document.getElementById("msg").textContent = "Put a box on the car!";
        beep(180, 0.08);
        return;
      }
      if (num !== need) {
        beep(180, 0.1);
        document.getElementById("msg").textContent = "Next is " + need + "!";
        el.style.transform = "translateX(-6px)";
        setTimeout(function () { el.style.transform = ""; }, 140);
        return;
      }
      el.classList.add("ready");
      el.disabled = true;
      waiting = true;
      need++;
      beep(400 + num * 30, 0.1);
      document.getElementById("msg").textContent = "Load cargo on car " + num + "!";
      hud();
    }
    function onCrate() {
      if (!waiting) {
        document.getElementById("msg").textContent = "Tap the next car first!";
        beep(180, 0.08);
        return;
      }
      var loaded = need - 1;
      var car = carEls[loaded];
      car.classList.remove("ready");
      car.classList.add("loaded");
      car.innerHTML = "<span>📦</span><span>" + loaded + "</span>";
      waiting = false;
      stars++;
      beep(720, 0.1);
      this.disabled = true;
      this.style.opacity = ".35";
      var max = sizes[plat];
      if (loaded >= max) {
        document.getElementById("msg").textContent = "All aboard this platform!";
        setTimeout(platformDone, 450);
      } else {
        document.getElementById("msg").textContent = "Tap car " + need + "!";
        fillCrates();
      }
      hud();
    }
    function platformDone() {
      var last = plat >= 2;
      document.getElementById("wint").textContent = last ? "Choo choo!" : "Platform done!";
      document.getElementById("winline").textContent = A.name + " loaded ★ " + stars;
      document.getElementById("nextBtn").style.display = last ? "none" : "inline-block";
      document.getElementById("nextBtn").textContent = "Next platform";
      document.getElementById("win").classList.add("on");
      beep(880, 0.18);
    }
    document.getElementById("again").onclick = function () { location.reload(); };
    document.getElementById("nextBtn").onclick = function () {
      document.getElementById("win").classList.remove("on");
      plat++;
      build();
    };
    build();
  </script>
</body>
</html>
