<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var open = false;
      try { open = localStorage.getItem("alabryuu-open") === "1"; } catch (e) {}
      if (open) return;
      document.documentElement.classList.add("kid-locked");
      var path = location.pathname || "";
      document.documentElement.style.background = path.indexOf("/alonzorui") === 0 ? "#fff7ed" : "#1e1b4b";
    })();
  </script>
  <style id="kid-lock-hide">
    html.kid-locked, html.kid-locked body { overflow: hidden !important; height: 100% !important; }
    html.kid-locked body { visibility: hidden !important; }
    #kid-lock, #kid-lock * { visibility: visible !important; }
  </style>
  <script src="/kid-lock.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Burrow Peek</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../mix.js"></script>
  <style>
    html, body { background: #fde68a; }
    .home { z-index: 60; }
    .dock button { font-size: 22px; }
    .dock button i { display: block; width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px; border: 3px solid #1e1b4b; background: var(--c, #fff); }
    .hero svg { width: 96px; height: 96px; display: block; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fl">0 / 5</b></div>
  <div id="say">Tap the hill that peeks</div>
  <div class="dock" id="dock">
    <button id="L"><i style="--c:#b45309"></i>Left</button><button id="hop"><i style="--c:#fbbf24"></i>Mid</button><button id="R"><i style="--c:#92400e"></i>Right</button>
  </div>
  <div class="cover" id="title">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><ellipse cx="46" cy="64" rx="28" ry="14" fill="#92400e" stroke="#1e1b4b" stroke-width="4"/><circle cx="46" cy="40" r="16" fill="#b45309" stroke="#1e1b4b" stroke-width="4"/><circle cx="40" cy="38" r="3" fill="#1e1b4b"/><circle cx="52" cy="38" r="3" fill="#1e1b4b"/></svg></div>
    <h1>Burrow Peek</h1>
    <p>The mole pops up. Tap that hill.</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><ellipse cx="46" cy="64" rx="28" ry="14" fill="#92400e" stroke="#1e1b4b" stroke-width="4"/><circle cx="46" cy="40" r="16" fill="#b45309" stroke="#1e1b4b" stroke-width="4"/><circle cx="40" cy="38" r="3" fill="#1e1b4b"/><circle cx="52" cy="38" r="3" fill="#1e1b4b"/></svg></div>
    <h1>You found the mole!</h1>
    <p>Five peeks.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
(function () {
  var cv = document.getElementById("c");
  var ui = Mix.boot(cv);
  var ctx, W = 0, H = 0, raf = 0;
  function layout(force) {
    var r = cv.getBoundingClientRect();
    var rw = Math.round(r.width || 0), rh = Math.round(r.height || 0);
    if (!force && ctx && Math.round(W) === rw && Math.round(H) === rh && rw > 0) return;
    var f = ui.fit();
    ctx = f.ctx; W = f.W; H = f.H;
  }
  function loop() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  function frame() {
    if (!ui.on()) return;
    layout(false);
    if (W < 2 || H < 2) { raf = requestAnimationFrame(frame); return; }
    if (step() === "stop") return;
    draw();
    raf = requestAnimationFrame(frame);
  }
  function begin() { layout(true); reset(); loop(); }
  function hud(t) {
    var el = document.getElementById("fl");
    if (el) el.textContent = t;
    var m = String(t).match(/\d+/);
    if (m) cv.dataset.score = m[0];
  }
  function sky(a, b) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ui.begin(begin);
  ui.replay(begin);
  
  var who, up, timer, got, last;
  function mx(i) { return W * (0.2 + i * 0.3); }
  function my() { return H * 0.58; }
  function reset() { who = 0; up = 0; timer = 0; got = 0; last = -1; hud("0 / 5"); }
  function tap(i) {
    if (!ui.on()) return;
    if (up && i === who) {
      got++;
      up = 0; timer = 0; last = who;
      kidNote(500 + got * 28);
      kidPing("Peek " + got);
      hud(got + " / 5");
      if (got >= 5) { draw(); ui.finish(); }
    } else {
      kidNote(180);
      kidPing("Watch the hill");
    }
  }
  document.getElementById("L").addEventListener("click", function () { tap(0); });
  document.getElementById("hop").addEventListener("click", function () { tap(1); });
  document.getElementById("R").addEventListener("click", function () { tap(2); });
  cv.addEventListener("pointerdown", function (e) {
    var p = kidPt(e, cv), i, y = my();
    for (i = 0; i < 3; i++) {
      var dx = p.x - mx(i), dy = p.y - y;
      if (dx * dx + dy * dy < 78 * 78) { tap(i); return; }
    }
  });
  function step() {
    timer++;
    if (up) {
      if (timer > 110) { up = 0; timer = 0; }
    } else if (timer > 28) {
      var n = who;
      var guard = 0;
      while (n === last && guard < 6) { n = Math.floor(Math.random() * 3); guard++; }
      who = n; up = 1; timer = 0;
    }
    cv.dataset.up = up ? "1" : "0";
    cv.dataset.who = String(who);
    cv.dataset.y = String(Math.round(my()));
    cv.dataset.xs = [0, 1, 2].map(function (i) { return Math.round(mx(i)); }).join(",");
  }
  function draw() {
    sky("#fef3c7", "#86efac");
    var i, y = my();
    for (i = 0; i < 3; i++) {
      var x = mx(i);
      ctx.fillStyle = "#92400e";
      ctx.beginPath(); ctx.ellipse(x, y + 10, 58, 28, 0, 0, Math.PI * 2); ctx.fill(); Mix.ink(ctx);
      ctx.fillStyle = "#451a03";
      ctx.beginPath(); ctx.ellipse(x, y + 6, 22, 12, 0, 0, Math.PI * 2); ctx.fill();
      if (up && i === who) {
        ctx.fillStyle = "#b45309";
        ctx.beginPath(); ctx.arc(x, y - 36, 26, 0, Math.PI * 2); ctx.fill(); Mix.ink(ctx);
        ctx.fillStyle = "#1e1b4b";
        ctx.beginPath(); ctx.arc(x - 8, y - 40, 3.5, 0, 7); ctx.arc(x + 8, y - 40, 3.5, 0, 7); ctx.fill();
        ctx.fillStyle = "#fda4af";
        ctx.beginPath(); ctx.arc(x, y - 30, 5, 0, 7); ctx.fill();
      }
    }
  }

  layout(true);
  if (W > 2) { reset(); draw(); }
  addEventListener("resize", function () { layout(true); if (W > 2) draw(); });
})();
  </script>
</body>
</html>
