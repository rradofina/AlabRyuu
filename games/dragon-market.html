<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Dragon Market</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: "PingFang SC", "Noto Sans SC", "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      color: #7c2d12;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    button {
      background: transparent; border: 0; appearance: none; -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 18%, rgba(253, 224, 71, .55) 0 8%, transparent 9%),
        radial-gradient(circle at 88% 12%, rgba(252, 165, 165, .5) 0 7%, transparent 8%),
        linear-gradient(#7dd3fc 0 28%, #fde68a 28% 52%, #fb7185 52% 78%, #9a3412 78%);
      padding: 52px 10px 18px;
      text-align: center;
      overflow-x: hidden;
    }
    .home {
      position: fixed; top: 12px; left: 12px; z-index: 12;
      color: #fff; text-decoration: none; font-weight: 800; font-size: 18px;
      background: rgba(0,0,0,.28); padding: 8px 14px; border-radius: 999px;
    }
    .hud {
      position: fixed; top: 12px; right: 12px; z-index: 12;
      display: flex; gap: 4px; align-items: center;
      background: rgba(255,255,255,.82); padding: 6px 8px; border-radius: 999px;
      box-shadow: 0 4px 0 rgba(180, 83, 9, .35);
    }
    .hud i {
      width: 14px; height: 18px; border-radius: 40% 40% 45% 45%;
      background: #fecaca; display: block; box-shadow: inset 0 3px 0 #fff6;
      position: relative;
    }
    .hud i::after {
      content: ""; position: absolute; top: -4px; left: 5px;
      width: 3px; height: 6px; background: #16a34a; border-radius: 2px;
    }
    .hud i.on { background: #ef4444; animation: glow .6s; }
    @keyframes glow { 50% { transform: scale(1.25); filter: drop-shadow(0 0 6px #fbbf24); } }

    .lanterns { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .lantern {
      position: absolute; font-size: 28px; animation: float 4.6s ease-in-out infinite;
      filter: drop-shadow(0 6px 0 rgba(0,0,0,.12));
    }
    .lantern:nth-child(1) { left: 8%; top: 18%; animation-delay: 0s; }
    .lantern:nth-child(2) { left: 78%; top: 16%; animation-delay: .7s; font-size: 34px; }
    .lantern:nth-child(3) { left: 42%; top: 10%; animation-delay: 1.3s; font-size: 24px; }
    .lantern:nth-child(4) { left: 18%; top: 38%; animation-delay: 2s; font-size: 22px; opacity: .8; }
    .lantern:nth-child(5) { left: 86%; top: 36%; animation-delay: 1.1s; font-size: 22px; opacity: .8; }
    @keyframes float { 50% { transform: translateY(-10px) rotate(6deg); } }

    h1 {
      position: relative; z-index: 1;
      font-size: clamp(26px, 7vw, 38px);
      color: #7f1d1d;
      text-shadow: 0 3px 0 #fde68a;
      margin-bottom: 4px;
    }

    .stage { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; }

    .buddy-wrap {
      height: 132px; display: flex; align-items: flex-end; justify-content: center;
      gap: 10px; margin: 2px 0 6px;
    }
    .buddy {
      width: 118px; height: 118px; position: relative;
      animation: idle 1.4s ease-in-out infinite;
    }
    .buddy.yum { animation: chomp .55s ease; }
    .buddy.hmm { animation: tilt .45s ease; }
    .buddy.full { animation: dance .7s ease-in-out infinite; }
    @keyframes idle { 50% { transform: translateY(-7px); } }
    @keyframes chomp { 30% { transform: scale(1.18) rotate(-8deg); } 70% { transform: scale(1.08) rotate(8deg); } }
    @keyframes tilt { 40% { transform: rotate(-16deg) translateX(-8px); } }
    @keyframes dance { 25% { transform: rotate(-10deg) translateY(-8px); } 75% { transform: rotate(10deg) translateY(-4px); } }

    .wing {
      position: absolute; width: 38px; height: 28px; background: #4ade80;
      border: 3px solid #166534; border-radius: 60% 20% 50% 10%;
      top: 42px; z-index: 0;
    }
    .wing.l { left: -8px; transform: rotate(-18deg); }
    .wing.r { right: -8px; transform: scaleX(-1) rotate(-18deg); }
    .dbody {
      position: absolute; left: 22px; bottom: 6px; width: 74px; height: 58px;
      background: radial-gradient(circle at 40% 30%, #4ade80, #16a34a);
      border: 3px solid #166534; border-radius: 46% 46% 40% 40%;
      box-shadow: inset 0 -10px 0 #15803d, 0 6px 0 rgba(22,101,52,.25);
    }
    .belly {
      position: absolute; left: 18px; top: 16px; width: 38px; height: 30px;
      background: #bbf7d0; border-radius: 50%;
    }
    .dhead {
      position: absolute; left: 20px; top: 4px; width: 78px; height: 64px;
      background: radial-gradient(circle at 35% 30%, #86efac, #22c55e);
      border: 3px solid #166534; border-radius: 48% 48% 42% 42%;
      z-index: 2;
    }
    .horn {
      position: absolute; top: -12px; width: 12px; height: 20px;
      background: #fbbf24; border: 3px solid #b45309; border-radius: 8px 8px 4px 4px;
    }
    .horn.l { left: 16px; transform: rotate(-18deg); }
    .horn.r { right: 16px; transform: rotate(18deg); }
    .eye {
      position: absolute; top: 20px; width: 16px; height: 16px;
      background: #fff; border: 2px solid #14532d; border-radius: 50%;
      overflow: hidden;
    }
    .eye::after {
      content: ""; position: absolute; left: 4px; top: 4px;
      width: 7px; height: 7px; background: #14532d; border-radius: 50%;
    }
    .eye.l { left: 14px; }
    .eye.r { right: 14px; }
    .buddy.yum .eye, .buddy.full .eye { height: 8px; border-radius: 0 0 10px 10px; top: 24px; background: #14532d; }
    .buddy.yum .eye::after, .buddy.full .eye::after { display: none; }
    .blush {
      position: absolute; top: 36px; width: 12px; height: 8px;
      background: #fda4af; border-radius: 50%; opacity: .85;
    }
    .blush.l { left: 8px; }
    .blush.r { right: 8px; }
    .snout {
      position: absolute; left: 22px; top: 36px; width: 34px; height: 18px;
      background: #86efac; border: 3px solid #166534; border-radius: 40%;
    }
    .nostril {
      position: absolute; top: 6px; width: 4px; height: 4px;
      background: #166534; border-radius: 50%;
    }
    .nostril.l { left: 8px; }
    .nostril.r { right: 8px; }
    .mouth {
      position: absolute; left: 28px; top: 48px; width: 22px; height: 8px;
      border-bottom: 3px solid #14532d; border-radius: 0 0 12px 12px;
    }
    .buddy.yum .mouth, .buddy.full .mouth {
      height: 12px; background: #9f1239; border: 2px solid #14532d; border-radius: 0 0 14px 14px;
    }

    .basket {
      width: 86px; min-height: 78px; padding: 8px 6px 6px;
      background: linear-gradient(#fdba74, #c2410c);
      border: 3px solid #7c2d12; border-radius: 16px 16px 22px 22px;
      box-shadow: inset 0 10px 0 #fed7aa, 0 6px 0 rgba(127,29,29,.25);
      display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
      gap: 1px; font-size: 20px; line-height: 1;
    }
    .basket:empty::after { content: "🧺"; font-size: 32px; }

    .sign {
      display: block; width: 100%;
      background: #fff7ed;
      border: 4px solid #b45309;
      border-radius: 28px;
      padding: 10px 12px 12px;
      box-shadow: 0 8px 0 #9a3412;
      margin: 0 auto 10px;
      position: relative;
    }
    .sign.pop { animation: pop .35s ease; }
    @keyframes pop { 0% { transform: scale(.86); } 60% { transform: scale(1.05); } }
    .hanzi { font-size: clamp(44px, 12vw, 64px); font-weight: 900; color: #9f1239; line-height: 1.05; }
    .pinyin { font-size: 22px; font-weight: 800; color: #b45309; letter-spacing: .04em; }
    .hint { font-size: 42px; line-height: 1; margin-top: 2px; }
    .speak {
      position: absolute; right: 10px; top: 10px;
      width: 44px; height: 44px; border-radius: 50%;
      background: #ffd166; box-shadow: 0 4px 0 #e09f1f; font-size: 22px;
    }
    .speak:active { transform: translateY(3px); box-shadow: 0 1px 0 #e09f1f; }

    .stall {
      background: linear-gradient(#b45309, #7c2d12);
      border-radius: 24px 24px 28px 28px;
      padding: 0 10px 12px;
      box-shadow: 0 10px 0 #431407;
    }
    .awning {
      height: 28px; margin: 0 -10px 10px;
      border-radius: 24px 24px 0 0;
      background: repeating-linear-gradient(90deg, #dc2626 0 28px, #fde047 28px 56px);
      box-shadow: inset 0 -6px 0 rgba(0,0,0,.12);
    }
    .stalls {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .crate {
      min-height: 112px; border-radius: 22px;
      background: linear-gradient(#fff7ed, #fed7aa);
      box-shadow: 0 7px 0 #9a3412;
      font-size: 58px; line-height: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px 4px 10px;
    }
    .crate small { display: block; font-size: 20px; font-weight: 900; color: #7c2d12; margin-top: 2px; }
    .crate:active { transform: translateY(4px); box-shadow: 0 3px 0 #9a3412; }
    .crate.nope { animation: nope .4s ease; }
    .crate.yes { animation: yes .45s ease; background: linear-gradient(#fde047, #86efac); }
    @keyframes nope { 25% { transform: rotate(-8deg) translateX(-6px); } 75% { transform: rotate(8deg) translateX(6px); } }
    @keyframes yes { 40% { transform: scale(1.08); } }

    .fly {
      position: fixed; z-index: 20; font-size: 48px; pointer-events: none;
      transition: left .42s cubic-bezier(.2,.8,.2,1), top .42s cubic-bezier(.2,.8,.2,1), transform .42s, opacity .2s .35s;
    }
    .heart {
      position: fixed; z-index: 20; font-size: 22px; pointer-events: none;
      animation: up 700ms ease forwards;
    }
    @keyframes up { to { transform: translateY(-50px) scale(1.3); opacity: 0; } }

    .cover, .win {
      position: fixed; inset: 0; z-index: 15;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      gap: 10px; color: #fff; text-align: center; padding: 20px;
    }
    .cover { background: linear-gradient(180deg, #fb7185, #9f1239 70%); }
    .cover.off { display: none; }
    .win { display: none; background: rgba(80, 10, 20, .88); }
    .win.on { display: flex; }
    .cover h2, .win h2 { font-size: clamp(32px, 9vw, 46px); text-shadow: 0 4px 0 #7f1d1d; }
    .go, .play {
      background: #ffd166; color: #3b2100; font-weight: 800;
      font-size: 28px; padding: 16px 32px; border-radius: 999px;
      box-shadow: 0 8px 0 #e09f1f; min-width: 220px;
    }
    .go:active, .play:active { transform: translateY(4px); box-shadow: 0 4px 0 #e09f1f; }
    .loot { font-size: 36px; max-width: 280px; line-height: 1.15; }
    .burst { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .burst b { position: absolute; font-size: 28px; animation: burst 1.4s ease-out infinite; }
    @keyframes burst {
      0% { transform: translateY(20px) scale(.4); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-110px) scale(1.1); opacity: 0; }
    }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <div class="hud" id="hud" hidden></div>
  <div class="lanterns" aria-hidden="true">
    <div class="lantern">🏮</div>
    <div class="lantern">🏮</div>
    <div class="lantern">🏮</div>
    <div class="lantern">🏮</div>
    <div class="lantern">🏮</div>
  </div>

  <div class="cover" id="cover">
    <div class="burst" id="introBurst"></div>
    <div class="buddy" style="width:140px;height:140px;transform:scale(1.15)">
      <div class="wing l"></div><div class="wing r"></div>
      <div class="dbody"><div class="belly"></div></div>
      <div class="dhead">
        <div class="horn l"></div><div class="horn r"></div>
        <div class="eye l"></div><div class="eye r"></div>
        <div class="blush l"></div><div class="blush r"></div>
        <div class="snout"><i class="nostril l"></i><i class="nostril r"></i></div>
        <div class="mouth"></div>
      </div>
    </div>
    <h2>Dragon Market</h2>
    <p style="font-weight:800;font-size:22px;opacity:.92">🐲 🍎 🥟 🥛</p>
    <button class="go" id="go">🛒</button>
  </div>

  <div class="stage" id="stage" hidden>
    <h1>Dragon Market</h1>
    <div class="buddy-wrap">
      <div class="buddy idle" id="buddy">
        <div class="wing l"></div><div class="wing r"></div>
        <div class="dbody"><div class="belly"></div></div>
        <div class="dhead">
          <div class="horn l"></div><div class="horn r"></div>
          <div class="eye l"></div><div class="eye r"></div>
          <div class="blush l"></div><div class="blush r"></div>
          <div class="snout"><i class="nostril l"></i><i class="nostril r"></i></div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="basket" id="basket"></div>
    </div>
    <button class="sign" id="sign">
      <span class="speak" id="speak">🔊</span>
      <div class="hanzi" id="hanzi"></div>
      <div class="pinyin" id="pinyin"></div>
      <div class="hint" id="hint"></div>
    </button>
    <div class="stall">
      <div class="awning"></div>
      <div class="stalls" id="stalls"></div>
    </div>
  </div>

  <div class="win" id="win">
    <div class="burst" id="winBurst"></div>
    <div style="font-size:72px">🐲</div>
    <h2>饱啦!</h2>
    <p class="loot" id="loot"></p>
    <button class="play" id="again">🛒 再来</button>
  </div>

  <script>
    var FOOD = [
      { h: "苹果", p: "píngguǒ", e: "🍎" },
      { h: "牛奶", p: "niúnǎi", e: "🥛" },
      { h: "包子", p: "bāozi", e: "🥟" },
      { h: "水", p: "shuǐ", e: "💧" },
      { h: "米饭", p: "mǐfàn", e: "🍚" },
      { h: "鱼", p: "yú", e: "🐟" },
      { h: "鸡蛋", p: "jīdàn", e: "🥚" },
      { h: "香蕉", p: "xiāngjiāo", e: "🍌" },
      { h: "西瓜", p: "xīguā", e: "🍉" },
      { h: "茶", p: "chá", e: "🍵" },
      { h: "草莓", p: "cǎoméi", e: "🍓" },
      { h: "葡萄", p: "pútáo", e: "🍇" },
      { h: "面包", p: "miànbāo", e: "🍞" },
      { h: "橙子", p: "chéngzi", e: "🍊" }
    ];
    var TOTAL = 9, score = 0, need = null, locked = false, bag = [], deck = [];

    function beep(f, d) {
      try {
        var c = window._ac || (window._ac = new (window.AudioContext || window.webkitAudioContext)());
        if (c.state === "suspended") c.resume();
        var o = c.createOscillator(), g = c.createGain();
        o.frequency.value = f; g.gain.value = .11;
        o.connect(g); g.connect(c.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + d);
        o.stop(c.currentTime + d);
      } catch (e) {}
    }

    function speak(text) {
      try {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-CN";
        u.rate = .82;
        var voices = window.speechSynthesis.getVoices() || [];
        var zh = voices.filter(function (v) { return /zh|cmn|chinese/i.test(v.lang + " " + v.name); });
        if (zh[0]) u.voice = zh[0];
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = function () {};
    }

    function shuffle(a) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function drawHud() {
      var hud = document.getElementById("hud");
      hud.innerHTML = "";
      for (var i = 0; i < TOTAL; i++) {
        var d = document.createElement("i");
        if (i < score) d.className = "on";
        hud.appendChild(d);
      }
    }

    function mood(name) {
      var b = document.getElementById("buddy");
      b.className = "buddy " + name;
    }

    function hearts(x, y) {
      "💖✨💛".split("").forEach(function (ch, i) {
        var el = document.createElement("div");
        el.className = "heart"; el.textContent = ch;
        el.style.left = (x - 16 + i * 18) + "px";
        el.style.top = (y - 8) + "px";
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, 720);
      });
    }

    function flyToDragon(emoji, fromEl) {
      var r = fromEl.getBoundingClientRect();
      var dest = document.getElementById("buddy").getBoundingClientRect();
      var el = document.createElement("div");
      el.className = "fly"; el.textContent = emoji;
      el.style.left = r.left + r.width / 2 - 24 + "px";
      el.style.top = r.top + r.height / 2 - 24 + "px";
      document.body.appendChild(el);
      requestAnimationFrame(function () {
        el.style.left = dest.left + dest.width / 2 - 18 + "px";
        el.style.top = dest.top + 28 + "px";
        el.style.transform = "scale(.35)";
        el.style.opacity = "0";
      });
      setTimeout(function () { el.remove(); }, 520);
    }

    function pickNeed() {
      if (!deck.length) deck = shuffle(FOOD.slice());
      return deck.pop();
    }

    function choicesFor(target) {
      var pool = FOOD.filter(function (f) { return f.h !== target.h; });
      shuffle(pool);
      return shuffle([target].concat(pool.slice(0, 3)));
    }

    function round() {
      locked = false;
      need = pickNeed();
      var sign = document.getElementById("sign");
      sign.classList.remove("pop"); void sign.offsetWidth; sign.classList.add("pop");
      document.getElementById("hanzi").textContent = need.h;
      document.getElementById("pinyin").textContent = need.p;
      document.getElementById("hint").textContent = need.e;
      mood("idle");
      var box = document.getElementById("stalls");
      box.innerHTML = "";
      choicesFor(need).forEach(function (f) {
        var b = document.createElement("button");
        b.className = "crate";
        b.innerHTML = f.e + "<small>" + f.h + "</small>";
        b.onclick = function (ev) { pick(f, b, ev); };
        box.appendChild(b);
      });
      speak(need.h);
    }

    function pick(food, btn, ev) {
      if (locked) return;
      speak(food.h);
      if (food.h !== need.h) {
        btn.classList.remove("nope"); void btn.offsetWidth; btn.classList.add("nope");
        mood("hmm");
        beep(180, .1);
        var sign = document.getElementById("sign");
        sign.classList.remove("pop"); void sign.offsetWidth; sign.classList.add("pop");
        return;
      }
      locked = true;
      btn.classList.add("yes");
      mood("yum");
      beep(760, .1);
      setTimeout(function () { beep(920, .12); }, 90);
      flyToDragon(food.e, btn);
      var pt = ev && ev.changedTouches ? ev.changedTouches[0] : ev;
      hearts(pt && pt.clientX ? pt.clientX : innerWidth / 2, pt && pt.clientY ? pt.clientY : 220);
      score++;
      bag.push(food.e);
      document.getElementById("basket").textContent = bag.join("");
      drawHud();
      setTimeout(function () {
        if (score >= TOTAL) win();
        else round();
      }, 720);
    }

    function win() {
      mood("full");
      document.getElementById("loot").textContent = bag.join(" ");
      document.getElementById("win").classList.add("on");
      beep(960, .2);
      speak("好吃");
      sprinkle(document.getElementById("winBurst"));
    }

    function sprinkle(host) {
      host.innerHTML = "";
      var bits = ["🏮", "✨", "🍎", "🥟", "💛", "🐲", "🍉", "🍌"];
      for (var i = 0; i < 14; i++) {
        var b = document.createElement("b");
        b.textContent = bits[i % bits.length];
        b.style.left = (6 + Math.random() * 88) + "%";
        b.style.top = (50 + Math.random() * 40) + "%";
        b.style.animationDelay = (Math.random() * .8) + "s";
        host.appendChild(b);
      }
    }

    document.getElementById("sign").onclick = function () {
      if (need) speak(need.h);
      beep(520, .06);
    };
    document.getElementById("go").onclick = function () {
      try { if (window._ac) window._ac.resume(); } catch (e) {}
      document.getElementById("cover").classList.add("off");
      document.getElementById("stage").hidden = false;
      document.getElementById("hud").hidden = false;
      drawHud();
      round();
    };
    document.getElementById("again").onclick = function () { location.reload(); };
    sprinkle(document.getElementById("introBurst"));
  </script>
</body>
</html>
