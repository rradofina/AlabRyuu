<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Shape Sorter</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#1e3a5f}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="got">0/6</b></div>
  <div id="say">Drag each shape to its hole!</div>
  <div class="cover" id="title">
    <div class="hero">🔺</div>
    <h1>Shape Sorter</h1>
    <p>TAP a shape. It jumps home!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">⭐</div>
    <h1>Sorted!</h1>
    <p>Every shape found a home.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, drag = -1, n = 0;
    var holes = [], bits = [];
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function start() {
      play = true; n = 0; drag = -1;
      holes = [
        { e: "🔴", x: 0.22, y: 0.28 },
        { e: "🟦", x: 0.50, y: 0.28 },
        { e: "⭐", x: 0.78, y: 0.28 }
      ];
      bits = [
        { e: "🔴", x: 0.25, y: 0.68, done: 0 },
        { e: "⭐", x: 0.50, y: 0.72, done: 0 },
        { e: "🟦", x: 0.75, y: 0.66, done: 0 },
        { e: "🔴", x: 0.35, y: 0.80, done: 0 },
        { e: "🟦", x: 0.62, y: 0.82, done: 0 },
        { e: "⭐", x: 0.18, y: 0.82, done: 0 }
      ];
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("got").textContent = "0/6";
      document.getElementById("say").textContent = "TAP a shape!";
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    function place(b) {
      var h = null, i;
      for (i = 0; i < holes.length; i++) if (holes[i].e === b.e) h = holes[i];
      if (!h) return;
      b.done = 1; b.x = h.x; b.y = h.y; n++;
      document.getElementById("got").textContent = n + "/6";
      kidTap(b.e, "Yes! Home.", h.x * innerWidth, h.y * innerHeight, 520);
      if (n >= 6) { play = false; kidYay(); document.getElementById("win").classList.remove("off"); }
    }
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      var p = kidPt(e, cv), i, best = -1, bestD = 80 * 80;
      for (i = 0; i < bits.length; i++) {
        if (bits[i].done) continue;
        var dx = p.x - bits[i].x * W, dy = p.y - bits[i].y * H, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best < 0) {
        for (i = 0; i < bits.length; i++) if (!bits[i].done) { best = i; break; }
      }
      if (best < 0) return;
      place(bits[best]);
    });
    function loop() {
      x.fillStyle = "#1e3a5f"; x.fillRect(0, 0, W, H);
      holes.forEach(function (h) {
        x.beginPath(); x.arc(h.x * W, h.y * H, 42, 0, Math.PI * 2);
        x.fillStyle = "#0f172a"; x.fill();
        em(h.e, h.x * W, h.y * H, 40);
      });
      bits.forEach(function (b) { if (!b.done) em(b.e, b.x * W, b.y * H, 64); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
