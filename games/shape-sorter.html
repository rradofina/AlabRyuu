<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Shape Sorter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background: #1d4ed8; color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
    button { background: transparent; border: 0; appearance: none; -webkit-appearance: none; -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; cursor: pointer; }
    canvas { display: block; width: 100%; height: 100%; }
    .home { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; z-index: 8; color: #1e3a8a; text-decoration: none; font-weight: 800; font-size: 17px; background: #fde047; padding: 8px 14px; border-radius: 999px; box-shadow: 0 3px 0 #ca8a04; touch-action: manipulation; }
    #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 7; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; pointer-events: none; }
    #hud b { font-weight: 800; font-size: 13px; background: #fff; color: #1d4ed8; padding: 6px 10px; border-radius: 999px; }
    #say { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 7; font-weight: 800; font-size: 17px; color: #fff; text-shadow: 0 2px 0 #1e3a8a; pointer-events: none; text-align: center; width: 92%; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px; background: linear-gradient(#2563eb, #fde047); }
    .cover.off { display: none; }
    h1 { font-size: clamp(32px, 9vw, 48px); color: #fff; text-shadow: 0 4px 0 #1e3a8a; }
    .cover p { font-weight: 800; font-size: 18px; max-width: 340px; color: #1e3a8a; }
    .btn { background: #f97316; color: #fff; font-weight: 800; font-size: 22px; padding: 14px 24px; border-radius: 999px; box-shadow: 0 7px 0 #c2410c; }
    .btn.g { background: #86efac; box-shadow: 0 7px 0 #16a34a; color: #14532d; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="bx">Box 1</b><b id="in">0 in</b></div>
  <div id="say">Drag a shape. Wiggle it into the hole.</div>
  <div class="cover" id="title">
    <div style="font-size:76px">🔺</div>
    <h1>Shape Sorter</h1>
    <p>Shapes wiggle into 3D-ish holes. Later the board rotates. The lid opens.</p>
    <button class="btn" id="go">Sort</button>
  </div>
  <div class="cover off" id="win">
    <div style="font-size:76px">📦</div>
    <h1>Lid open!</h1>
    <p id="winP">Five boxes. Soft clicks.</p>
    <button class="btn g" id="again">Sort again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, last = 0, t = 0, play = false, box = 0;
    var shapes = [], holes = [], drag = null, offx = 0, offy = 0;
    var rot = 0, rotWant = 0, lid = 0, lidOpen = 0, conf = [], stars = [];
    var BOXES = [
      { n: "First box", kinds: ["circ", "sq", "tri"], rot: 0, night: 0 },
      { n: "Star box", kinds: ["circ", "sq", "tri", "star"], rot: 0, night: 0 },
      { n: "Spin board", kinds: ["circ", "sq", "tri"], rot: 0.25, night: 0 },
      { n: "Night box", kinds: ["circ", "sq", "tri", "star"], rot: 0.15, night: 1 },
      { n: "Lid surprise", kinds: ["circ", "sq", "tri", "star", "heart"], rot: 0.35, night: 0 }
    ];
    var COL = { circ: "#38bdf8", sq: "#facc15", tri: "#f97316", star: "#a855f7", heart: "#fb7185" };

    function beep(f, d, typ) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        if (ac.state === "suspended") ac.resume();
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = typ || "square"; o.frequency.value = f; g.gain.value = 0.08;
        o.connect(g); g.connect(ac.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function say(s) { document.getElementById("say").textContent = s; }
    function hud() {
      document.getElementById("bx").textContent = BOXES[box] ? BOXES[box].n : "Done";
      var n = shapes.filter(function (s) { return s.in; }).length;
      document.getElementById("in").textContent = n + " in";
    }
    function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
    addEventListener("resize", resize); resize();

    function makeBox() {
      var b = BOXES[box];
      shapes = []; holes = []; rot = 0; rotWant = 0; lid = 0; lidOpen = 0; conf = [];
      var i, k, n = b.kinds.length;
      for (i = 0; i < n; i++) {
        k = b.kinds[i];
        holes.push({ kind: k, a: (i / n) * Math.PI * 2 - Math.PI / 2, r: 0, got: 0 });
        shapes.push({
          kind: k, x: 50 + (i % 3) * (W * 0.28), y: H * 0.78 + (i % 2) * 10,
          homeX: 50 + (i % 3) * (W * 0.28), homeY: H * 0.78,
          in: 0, wiggle: i * 1.2, sc: 1, rot: 0
        });
      }
      stars = [];
      if (b.night) {
        for (i = 0; i < 28; i++) stars.push({ x: Math.random(), y: Math.random() * 0.4, tw: i });
      }
      say(b.rot ? "The board will turn. Match the holes!" : "Drag each shape into its hole.");
      hud();
    }

    function start() {
      play = true; box = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      makeBox(); beep(520, 0.1);
    }

    function holePos(h) {
      var cx = W * 0.5, cy = H * 0.42, rad = Math.min(W, H) * 0.22;
      var a = h.a + rot;
      return { x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad * 0.72 };
    }

    function hitShape(mx, my) {
      var i, s, best = null;
      for (i = shapes.length - 1; i >= 0; i--) {
        s = shapes[i];
        if (!s.in && Math.hypot(mx - s.x, my - s.y) < 36) { best = s; break; }
      }
      return best;
    }

    addEventListener("pointerdown", function (e) {
      if (e.target.closest && e.target.closest("a,button")) return;
      if (!play || lidOpen) return;
      var s = hitShape(e.clientX, e.clientY);
      if (s) { drag = s; offx = e.clientX - s.x; offy = e.clientY - s.y; s.sc = 1.15; beep(480, 0.05); }
    });
    addEventListener("pointermove", function (e) {
      if (!drag) return;
      drag.x = e.clientX - offx; drag.y = e.clientY - offy;
      drag.rot += (e.movementX || 0) * 0.01;
    });
    addEventListener("pointerup", function () {
      if (!drag) return;
      var i, h, p, ok = false;
      for (i = 0; i < holes.length; i++) {
        h = holes[i];
        if (h.got) continue;
        p = holePos(h);
        if (h.kind === drag.kind && Math.hypot(drag.x - p.x, drag.y - p.y) < 42) {
          drag.in = 1; h.got = 1; drag.x = p.x; drag.y = p.y; drag.sc = 0.55; drag.rot = rot;
          ok = true;
          var k;
          for (k = 0; k < 10; k++) conf.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 120, vy: -50 - Math.random() * 40, life: 0.7, col: COL[drag.kind] });
          beep(720, 0.09);
          say("In! Soft click.");
        }
      }
      if (!ok) {
        drag.x = drag.homeX; drag.y = drag.homeY; drag.sc = 1;
        say("Wrong hole. Try the matching one.");
        beep(200, 0.08);
      }
      drag = null;
      hud();
      if (shapes.every(function (s) { return s.in; })) openLid();
    });

    function openLid() {
      lidOpen = 1; lid = 0;
      say("Lid opening...");
      beep(880, 0.14);
    }

    function nextBox() {
      box++;
      if (box >= BOXES.length) {
        play = false;
        document.getElementById("winP").textContent = "Five boxes. The lid said hello.";
        document.getElementById("win").classList.remove("off");
        beep(990, 0.2);
        return;
      }
      makeBox();
    }

    function update(dt) {
      t += dt;
      var b = BOXES[box] || BOXES[0];
      var i, s;
      for (i = 0; i < shapes.length; i++) {
        s = shapes[i];
        s.wiggle += dt * 4;
        if (!s.in && s !== drag) {
          s.x = s.homeX + Math.sin(s.wiggle) * 4;
          s.y = s.homeY + Math.cos(s.wiggle * 1.3) * 3;
          s.rot = Math.sin(s.wiggle) * 0.12;
          s.sc = 1 + Math.sin(s.wiggle * 2) * 0.04;
        }
      }
      if (play && b.rot && !lidOpen) {
        rotWant += dt * b.rot;
        rot += (rotWant - rot) * Math.min(1, dt * 1.4);
      }
      if (lidOpen) {
        lid = Math.min(1, lid + dt * 0.85);
        if (lid >= 1) {
          lidOpen = 0;
          setTimeout(nextBox, 500);
        }
      }
      for (i = conf.length - 1; i >= 0; i--) {
        conf[i].life -= dt * 1.4; conf[i].x += conf[i].vx * dt; conf[i].y += conf[i].vy * dt;
        if (conf[i].life <= 0) conf.splice(i, 1);
      }
    }

    function pathKind(kind, r) {
      if (kind === "circ") { x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); }
      else if (kind === "sq") { x.beginPath(); x.rect(-r, -r, r * 2, r * 2); }
      else if (kind === "tri") { x.beginPath(); x.moveTo(0, -r); x.lineTo(r, r); x.lineTo(-r, r); x.closePath(); }
      else if (kind === "star") {
        x.beginPath();
        var i, a;
        for (i = 0; i < 5; i++) {
          a = -Math.PI / 2 + i * Math.PI * 2 / 5;
          if (i === 0) x.moveTo(Math.cos(a) * r, Math.sin(a) * r);
          else x.lineTo(Math.cos(a) * r, Math.sin(a) * r);
          a += Math.PI / 5;
          x.lineTo(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.45);
        }
        x.closePath();
      } else {
        x.beginPath();
        x.moveTo(0, r * 0.7);
        x.bezierCurveTo(-r * 1.2, 0, -r * 0.6, -r, 0, -r * 0.35);
        x.bezierCurveTo(r * 0.6, -r, r * 1.2, 0, 0, r * 0.7);
      }
    }

    function drawShape(s, hole) {
      x.save();
      x.translate(s.x, s.y);
      x.rotate(s.rot || 0);
      x.scale(s.sc || 1, s.sc || 1);
      if (hole) {
        x.fillStyle = "#0f172a";
        pathKind(s.kind, 22); x.fill();
        x.fillStyle = "rgba(255,255,255,.08)";
        pathKind(s.kind, 16); x.fill();
        x.strokeStyle = "rgba(0,0,0,.35)"; x.lineWidth = 3;
        pathKind(s.kind, 22); x.stroke();
        x.fillStyle = "rgba(255,255,255,.12)";
        x.beginPath(); x.moveTo(-18, -18); x.lineTo(-10, -24); x.lineTo(4, -16); x.fill();
      } else {
        x.fillStyle = COL[s.kind];
        pathKind(s.kind, 24); x.fill();
        x.strokeStyle = "rgba(255,255,255,.5)"; x.lineWidth = 3;
        pathKind(s.kind, 24); x.stroke();
        x.fillStyle = "rgba(255,255,255,.35)";
        x.beginPath(); x.ellipse(-6, -8, 8, 5, -0.4, 0, Math.PI * 2); x.fill();
      }
      x.restore();
    }

    function drawBox() {
      var b = BOXES[box] || BOXES[0];
      var g = x.createLinearGradient(0, 0, 0, H);
      if (b.night) { g.addColorStop(0, "#0f172a"); g.addColorStop(1, "#1e3a8a"); }
      else { g.addColorStop(0, "#7dd3fc"); g.addColorStop(1, "#2563eb"); }
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      if (b.night) {
        x.fillStyle = "#fff";
        var i, s;
        for (i = 0; i < stars.length; i++) {
          s = stars[i];
          x.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + s.tw));
          x.fillRect(s.x * W, 10 + s.y * H, 2, 2);
        }
        x.globalAlpha = 1;
      } else {
        x.fillStyle = "#fde047";
        x.beginPath(); x.arc(W * 0.16, 54, 18, 0, Math.PI * 2); x.fill();
      }
      var cx = W * 0.5, cy = H * 0.42, bw = Math.min(W * 0.78, 340), bh = bw * 0.72;
      x.save();
      x.translate(cx, cy);
      x.rotate(rot * 0.15);
      x.fillStyle = "#b45309";
      x.beginPath();
      if (x.roundRect) x.roundRect(-bw / 2, -bh / 2 + 18, bw, bh, 18);
      else x.rect(-bw / 2, -bh / 2 + 18, bw, bh);
      x.fill();
      x.fillStyle = "#f59e0b";
      x.beginPath();
      if (x.roundRect) x.roundRect(-bw / 2 + 10, -bh / 2 + 28, bw - 20, bh - 28, 14);
      else x.rect(-bw / 2 + 10, -bh / 2 + 28, bw - 20, bh - 28);
      x.fill();
      x.restore();
      var h, p;
      for (i = 0; i < holes.length; i++) {
        h = holes[i]; p = holePos(h);
        drawShape({ kind: h.kind, x: p.x, y: p.y, sc: 1, rot: rot * 0.2 }, true);
      }
      x.save();
      x.translate(cx, cy - bh / 2 + 10);
      x.rotate(-lid * 1.15);
      x.fillStyle = "#d97706";
      x.beginPath();
      if (x.roundRect) x.roundRect(-bw / 2, -16, bw, 36, 10);
      else x.rect(-bw / 2, -16, bw, 36);
      x.fill();
      x.fillStyle = "#fde047";
      x.fillRect(-18, -4, 36, 10);
      x.restore();
    }

    function draw() {
      drawBox();
      var i, s;
      for (i = 0; i < shapes.length; i++) {
        s = shapes[i];
        if (s.in) {
          s.x = holePos(holes.filter(function (h) { return h.kind === s.kind && h.got; })[0] || holes[0]).x;
          var hp = null, hi;
          for (hi = 0; hi < holes.length; hi++) if (holes[hi].kind === s.kind && holes[hi].got) hp = holePos(holes[hi]);
          if (hp) { s.x = hp.x; s.y = hp.y; }
        }
        drawShape(s, false);
      }
      for (i = 0; i < conf.length; i++) {
        x.globalAlpha = Math.max(0, conf[i].life);
        x.fillStyle = conf[i].col;
        x.fillRect(conf[i].x, conf[i].y, 6, 6);
      }
      x.globalAlpha = 1;
      x.fillStyle = "rgba(255,255,255,.2)";
      x.fillRect(16, 8, W - 32, 6);
      x.fillStyle = "#fde047";
      var inn = shapes.filter(function (z) { return z.in; }).length;
      x.fillRect(16, 8, Math.min(W - 32, ((box + inn / Math.max(1, shapes.length)) / 5) * (W - 32)), 6);
    }

    
    var toyBits=[], lidSpark=[], label=[];
    function flavorUpdate(dt){
      if(!toyBits.length){ var i; for(i=0;i<10;i++) toyBits.push({x:Math.random(),y:0.88,e:["🔷","🔶","🔻","⭐","💜"][i%5],ph:i}); }
      var i; for(i=0;i<toyBits.length;i++) toyBits[i].ph+=dt;
      if(typeof lidOpen!=="undefined" && lidOpen){
        lidSpark.push({x:W*0.5+(Math.random()-0.5)*80,y:H*0.3,life:0.6});
      }
      for(i=lidSpark.length-1;i>=0;i--){ lidSpark[i].life-=dt*2; if(lidSpark[i].life<=0) lidSpark.splice(i,1); }
    }
    function flavorDraw(){
      var i;
      for(i=0;i<toyBits.length;i++){
        x.font="14px serif";
        x.globalAlpha=0.5;
        x.fillText(toyBits[i].e, toyBits[i].x*W, H*0.9+Math.sin(toyBits[i].ph)*3);
      }
      x.globalAlpha=1;
      for(i=0;i<lidSpark.length;i++){
        x.globalAlpha=Math.max(0,lidSpark[i].life);
        x.fillStyle="#fde047"; x.beginPath(); x.arc(lidSpark[i].x,lidSpark[i].y,4,0,Math.PI*2); x.fill();
      }
      x.globalAlpha=1;
      if(typeof BOXES!=="undefined" && BOXES[box]){
        x.fillStyle="#fff"; x.font="bold 13px Trebuchet MS"; x.textAlign="center";
        x.fillText(BOXES[box].n+" · rotate "+(BOXES[box].rot?"yes":"no"), W*0.5, 78);
      }
    }

    var holeGlow = [], boxStamp = 0;
    function sorterJuice(dt) {
      boxStamp += dt;
      if (typeof holes !== "undefined") {
        var i, p;
        for (i = 0; i < holes.length; i++) {
          if (holes[i].got && Math.random() < dt * 3) {
            p = typeof holePos === "function" ? holePos(holes[i]) : { x: W * 0.5, y: H * 0.4 };
            holeGlow.push({ x: p.x, y: p.y, life: 0.5, col: COL[holes[i].kind] });
          }
        }
      }
      var j;
      for (j = holeGlow.length - 1; j >= 0; j--) { holeGlow[j].life -= dt * 2; if (holeGlow[j].life <= 0) holeGlow.splice(j, 1); }
    }
    var _oldSU = flavorUpdate;
    flavorUpdate = function (dt) { _oldSU(dt); sorterJuice(dt); };
    var _oldSD = flavorDraw;
    flavorDraw = function () {
      _oldSD();
      var i;
      for (i = 0; i < holeGlow.length; i++) {
        x.globalAlpha = Math.max(0, holeGlow[i].life);
        x.strokeStyle = holeGlow[i].col; x.lineWidth = 3;
        x.beginPath(); x.arc(holeGlow[i].x, holeGlow[i].y, 20 + (1 - holeGlow[i].life) * 12, 0, Math.PI * 2); x.stroke();
      }
      x.globalAlpha = 1;
      x.fillStyle = "rgba(253,224,71,.8)"; x.font = "bold 12px Trebuchet MS"; x.textAlign = "center";
      x.fillText("wiggle into the matching hole", W * 0.5, H - 48);
    };
    function extraWorld(){
      var _i,_a;
      _a=0.08+0.04*Math.sin(t+0); x.fillStyle='#38bdf8'; x.globalAlpha=_a;
      x.fillRect((0+t*8)%W, 20, 4, 3); /* circle hole 0 */
      _a=0.08+0.04*Math.sin(t+1); x.fillStyle='#facc15'; x.globalAlpha=_a;
      x.fillRect((47+t*8)%W, 51, 5, 4); /* square hole 1 */
      _a=0.08+0.04*Math.sin(t+2); x.fillStyle='#f97316'; x.globalAlpha=_a;
      x.fillRect((94+t*8)%W, 82, 6, 5); /* triangle 2 */
      _a=0.08+0.04*Math.sin(t+3); x.fillStyle='#a855f7'; x.globalAlpha=_a;
      x.fillRect((44+t*8)%W, 30, 7, 6); /* star 3 */
      _a=0.08+0.04*Math.sin(t+4); x.fillStyle='#fb7185'; x.globalAlpha=_a;
      x.fillRect((91+t*8)%W, 61, 8, 3); /* heart 4 */
      _a=0.08+0.04*Math.sin(t+5); x.fillStyle='#38bdf8'; x.globalAlpha=_a;
      x.fillRect((41+t*8)%W, 92, 4, 4); /* circle hole 5 */
      _a=0.08+0.04*Math.sin(t+6); x.fillStyle='#facc15'; x.globalAlpha=_a;
      x.fillRect((88+t*8)%W, 40, 5, 5); /* square hole 6 */
      _a=0.08+0.04*Math.sin(t+7); x.fillStyle='#f97316'; x.globalAlpha=_a;
      x.fillRect((38+t*8)%W, 71, 6, 6); /* triangle 7 */
      _a=0.08+0.04*Math.sin(t+8); x.fillStyle='#a855f7'; x.globalAlpha=_a;
      x.fillRect((85+t*8)%W, 102, 7, 3); /* star 8 */
      _a=0.08+0.04*Math.sin(t+9); x.fillStyle='#fb7185'; x.globalAlpha=_a;
      x.fillRect((35+t*8)%W, 50, 8, 4); /* heart 9 */
      _a=0.08+0.04*Math.sin(t+10); x.fillStyle='#38bdf8'; x.globalAlpha=_a;
      x.fillRect((82+t*8)%W, 81, 4, 5); /* circle hole 10 */
      _a=0.08+0.04*Math.sin(t+11); x.fillStyle='#facc15'; x.globalAlpha=_a;
      x.fillRect((32+t*8)%W, 29, 5, 6); /* square hole 11 */
      _a=0.08+0.04*Math.sin(t+12); x.fillStyle='#f97316'; x.globalAlpha=_a;
      x.fillRect((79+t*8)%W, 60, 6, 3); /* triangle 12 */
      _a=0.08+0.04*Math.sin(t+13); x.fillStyle='#a855f7'; x.globalAlpha=_a;
      x.fillRect((29+t*8)%W, 91, 7, 4); /* star 13 */
      _a=0.08+0.04*Math.sin(t+14); x.fillStyle='#fb7185'; x.globalAlpha=_a;
      x.fillRect((76+t*8)%W, 39, 8, 5); /* heart 14 */
      _a=0.08+0.04*Math.sin(t+15); x.fillStyle='#38bdf8'; x.globalAlpha=_a;
      x.fillRect((26+t*8)%W, 70, 4, 6); /* circle hole 15 */
      _a=0.08+0.04*Math.sin(t+16); x.fillStyle='#facc15'; x.globalAlpha=_a;
      x.fillRect((73+t*8)%W, 101, 5, 3); /* square hole 16 */
      _a=0.08+0.04*Math.sin(t+17); x.fillStyle='#f97316'; x.globalAlpha=_a;
      x.fillRect((23+t*8)%W, 49, 6, 4); /* triangle 17 */
      _a=0.08+0.04*Math.sin(t+18); x.fillStyle='#a855f7'; x.globalAlpha=_a;
      x.fillRect((70+t*8)%W, 80, 7, 5); /* star 18 */
      _a=0.08+0.04*Math.sin(t+19); x.fillStyle='#fb7185'; x.globalAlpha=_a;
