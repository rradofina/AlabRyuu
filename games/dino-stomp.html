<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Dino Stomp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: Verdana, system-ui, sans-serif; background: #14532d; color: #ecfccb; touch-action: none; user-select: none; }
    button { background: transparent; border: 0; appearance: none; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .home { position: fixed; top: 12px; left: 12px; z-index: 8; color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; background: rgba(0,0,0,.35); padding: 8px 14px; border-radius: 12px; touch-action: manipulation; }
    canvas { display: block; width: 100%; height: 100%; }
    #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: none; gap: 10px; padding: 10px 12px 16px; background: #3f2a14; border-top: 6px solid #854d0e; }
    #dock.on { display: flex; }
    #dock button { flex: 1; height: 88px; border-radius: 20px; font-weight: 800; font-size: 20px; }
    #dock button span { display: block; font-size: 32px; }
    #hop { background: #65a30d; color: #14532d; box-shadow: 0 7px 0 #3f6212; }
    #stomp { background: #f59e0b; color: #451a03; box-shadow: 0 7px 0 #b45309; }
    #hud { position: fixed; top: 12px; right: 12px; z-index: 7; font-weight: 800; text-align: right; pointer-events: none; }
    #hud b { display: inline-block; background: #78350f; color: #fef3c7; padding: 6px 10px; border-radius: 8px; margin-left: 6px; }
    #say { position: fixed; left: 50%; bottom: 118px; transform: translateX(-50%); z-index: 7; font-weight: 800; pointer-events: none; text-shadow: 0 2px 0 #14532d; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px; background: linear-gradient(#365314, #84cc16); }
    .cover.off { display: none; }
    h1 { font-size: clamp(34px, 9vw, 52px); color: #fff; text-shadow: 0 4px 0 #14532d; }
    .btn { background: #fde047; color: #422006; font-weight: 800; font-size: 24px; padding: 14px 26px; border-radius: 18px; box-shadow: 0 7px 0 #ca8a04; }
    .btn.g { background: #86efac; box-shadow: 0 7px 0 #16a34a; color: #14532d; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="val">Valley 1</b><b id="fl">🌼 0</b><b id="st">⭐ 0</b></div>
  <div id="say">Hop or STOMP!</div>
  <div id="dock">
    <button id="hop"><span>⬆️</span>Hop</button>
    <button id="stomp"><span>💥</span>Stomp</button>
  </div>
  <div class="cover" id="title">
    <div style="font-size:80px">🦕</div>
    <h1>Dino Stomp</h1>
    <p>Hop logs. Stomp to smash.<br>Save baby dinos!</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div style="font-size:80px">🌼</div>
    <h1>Dino did it!</h1>
    <p id="winP">Five valleys. Soft hops.</p>
    <div class="row"><button class="btn g" id="again">Play again</button></div>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, last = 0, t = 0, play = false, cam = 0, shake = 0, stars = 0, flowers = 0, valley = 0, rainN = 0;
    var ground, spd = 220;
    var dino = { y: 0, vy: 0, on: true, stomp: 0, face: 0 };
    var obs = [], flo = [], babies = [], dust = [], rain = [], fire = [];
    var carry = 0, boss = null, saved = 0;
    var VAL = [
      { n: "Sunny path", rain: 0, night: 0, boss: 0, need: 5 },
      { n: "Rolling logs", rain: 0, night: 0, boss: 0, need: 6 },
      { n: "Rain woods", rain: 1, night: 0, boss: 0, need: 6 },
      { n: "Firefly night", rain: 0, night: 1, boss: 0, need: 6 },
      { n: "Big pal", rain: 0, night: 0, boss: 1, need: 3 }
    ];

    function beep(f, d, typ) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = typ || "square"; o.frequency.value = f; g.gain.value = 0.09;
        o.connect(g); g.connect(ac.destination); o.start();
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; ground = H * 0.68; }
    addEventListener("resize", resize); resize();

    function start() {
      play = true; valley = 0; stars = 0; flowers = 0; saved = 0; carry = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      loadVal(); beep(500, 0.1);
    }
    function loadVal() {
      var v = VAL[valley];
      dino.y = ground - 70; dino.vy = 0; dino.on = true; dino.stomp = 0;
      obs = []; flo = []; babies = []; dust = []; rain = []; fire = []; boss = null; cam = 0; spd = 200 + valley * 20;
      flowers = 0; rainN = 0;
      document.getElementById("val").textContent = v.n;
      document.getElementById("fl").textContent = "🌼 " + flowers;
      document.getElementById("say").textContent = v.boss ? "Stomp the big pal!" : "Hop or STOMP!";
      if (v.boss) boss = { x: W + 200, hp: 3, bob: 0 };
    }
    function hop() {
      if (!play) return;
      if (dino.on) { dino.vy = -620; dino.on = false; beep(560, 0.07); }
    }
    function stomp() {
      if (!play) return;
      dino.stomp = 0.22; dino.vy = 900; shake = 14; beep(180, 0.1, "sawtooth");
      for (var i = 0; i < 10; i++) dust.push({ x: 110 + Math.random() * 40, y: ground, vx: (Math.random() - 0.5) * 80, vy: -40 - Math.random() * 60, life: 1 });
    }
    document.getElementById("hop").onclick = hop;
    document.getElementById("stomp").onclick = stomp;
    addEventListener("keydown", function (e) {
      if (e.code === "Space" || e.code === "ArrowUp") hop();
      if (e.code === "ArrowDown") stomp();
    });

    function spawn() {
      var v = VAL[valley];
      if (v.boss) return;
      var kind = Math.random() < 0.6 ? "log" : "rock";
      obs.push({ x: cam + W + 20, kind: kind, rot: 0, smashed: 0 });
      if (Math.random() < 0.45) flo.push({ x: cam + W + 140, y: ground - 90 - Math.random() * 50, got: 0 });
      if (Math.random() < 0.22) babies.push({ x: cam + W + 90, y: ground - 24, got: 0 });
    }

    function update(dt) {
      t += dt;
      if (shake > 0) shake *= 0.88;
      var v = VAL[valley];
      if (!play) return;
      if (!v.boss && t * 100 % 70 < dt * 100) spawn();
      if (v.rain && Math.random() < dt * 40) rain.push({ x: Math.random() * W, y: -10, vy: 400 });
      if (v.night && Math.random() < dt * 8) fire.push({ x: cam + Math.random() * W, y: 40 + Math.random() * 180, life: 1 });
      dino.vy += 1800 * dt;
      dino.y += dino.vy * dt;
      if (dino.y >= ground - 70) { dino.y = ground - 70; dino.vy = 0; dino.on = true; }
      if (dino.stomp > 0) dino.stomp -= dt;
      cam += spd * dt;
      dino.face += dt * 8;
      obs.forEach(function (o) {
        o.rot += dt * 4;
        var ox = o.x - cam;
        var hit = ox < 150 && ox > 50 && dino.y > ground - 110;
        if (hit && !o.smashed) {
          if (dino.stomp > 0 && o.kind === "log") {
            o.smashed = 1; flowers++; stars++; shake = 10;
            document.getElementById("fl").textContent = "🌼 " + flowers;
            document.getElementById("st").textContent = "⭐ " + stars;
            beep(720, 0.08);
            flo.push({ x: o.x, y: ground - 40, got: 0 });
          } else if (!dino.on && dino.vy > 0) {
            o.smashed = 1; stars++; beep(640, 0.06);
          } else {
            spd = Math.max(140, spd - 40); shake = 6; beep(140, 0.1);
            o.x = cam + W + 80;
          }
        }
      });
      obs = obs.filter(function (o) { return o.x > cam - 80 && !o.smashed; });
      flo.forEach(function (f) {
        if (!f.got && Math.hypot((f.x - cam) - 110, (dino.y + 20) - f.y) < 40) {
          f.got = 1; flowers++; stars++; document.getElementById("fl").textContent = "🌼 " + flowers;
          document.getElementById("st").textContent = "⭐ " + stars; beep(880, 0.07);
        }
      });
      babies.forEach(function (b) {
        if (!b.got && Math.hypot((b.x - cam) - 110, dino.y - b.y) < 46) {
          b.got = 1; carry++; saved++; stars += 2; document.getElementById("st").textContent = "⭐ " + stars;
          document.getElementById("say").textContent = "Baby ride!"; beep(990, 0.1);
        }
      });
      dust.forEach(function (d) { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 80 * dt; d.life -= dt * 2; });
      dust = dust.filter(function (d) { return d.life > 0; });
      rain.forEach(function (r) { r.y += r.vy * dt; });
      rain = rain.filter(function (r) { return r.y < H; });
      fire.forEach(function (f) { f.life -= dt * 0.4; });
      fire = fire.filter(function (f) { return f.life > 0; });
      if (boss) {
        boss.x -= 80 * dt; boss.bob += dt * 3;
        var bx = boss.x - cam;
        if (bx < 160 && bx > 40 && dino.stomp > 0) {
          boss.hp--; boss.x += 180; shake = 16; stars += 2; beep(200, 0.12, "sawtooth");
          document.getElementById("say").textContent = "Boop! " + boss.hp + " left";
          if (boss.hp <= 0) { flowers = VAL[valley].need; }
        }
      }
      if (flowers >= VAL[valley].need) {
        valley++;
        if (valley >= VAL.length) {
          play = false;
          document.getElementById("dock").classList.remove("on");
          document.getElementById("winP").textContent = "⭐ " + stars + "  Babies saved " + saved;
          document.getElementById("win").classList.remove("off");
        } else loadVal();
      }
    }

    function draw() {
      var v = VAL[valley] || VAL[0];
      var g = x.createLinearGradient(0, 0, 0, H);
      if (v.night) { g.addColorStop(0, "#0f172a"); g.addColorStop(1, "#14532d"); }
      else if (v.rain) { g.addColorStop(0, "#64748b"); g.addColorStop(1, "#166534"); }
      else { g.addColorStop(0, "#7dd3fc"); g.addColorStop(0.55, "#86efac"); g.addColorStop(1, "#166534"); }
      x.save();
      x.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      x.fillStyle = v.night ? "#1e3a2a" : "#22c55e";
      for (var i = 0; i < 8; i++) {
        var tx = ((i * 160 - cam * 0.3) % (W + 160));
        x.beginPath(); x.moveTo(tx, ground - 40); x.lineTo(tx + 50, ground - 140); x.lineTo(tx + 100, ground - 40); x.fill();
      }
      x.fillStyle = "#15803d"; x.fillRect(0, ground, W, H - ground);
      x.fillStyle = "#4ade80";
      for (var j = 0; j < 16; j++) x.fillRect(((j * 70 - cam) % (W + 70)), ground - 8, 18, 8);
      obs.forEach(function (o) {
        x.save(); x.translate(o.x - cam + 24, ground - 16); x.rotate(o.rot);
        x.font = "40px serif"; x.fillText(o.kind === "log" ? "🪵" : "🪨", -20, 10);
        x.restore();
      });
      flo.forEach(function (f) { if (!f.got) { x.font = "28px serif"; x.fillText("🌼", f.x - cam, f.y); } });
      babies.forEach(function (b) { if (!b.got) { x.font = "28px serif"; x.fillText("🦖", b.x - cam, b.y); } });
      if (boss) {
        x.font = "84px serif";
        x.fillText("🦕", boss.x - cam, ground - 20 + Math.sin(boss.bob) * 8);
      }
      rain.forEach(function (r) { x.strokeStyle = "rgba(200,230,255,.6)"; x.beginPath(); x.moveTo(r.x, r.y); x.lineTo(r.x - 4, r.y + 14); x.stroke(); });
      fire.forEach(function (f) { x.globalAlpha = f.life; x.font = "16px serif"; x.fillText("✨", f.x - cam, f.y); });
      x.globalAlpha = 1;
      dust.forEach(function (d) { x.globalAlpha = d.life; x.fillStyle = "#854d0e"; x.fillRect(d.x, d.y, 6, 6); });
      x.globalAlpha = 1;
      var squish = dino.stomp > 0 ? 0.75 : 1;
      x.save(); x.translate(100, dino.y + 70); x.scale(1, squish);
      x.font = "64px serif"; x.fillText("🦕", 0, 0);
      if (carry) { x.font = "28px serif"; x.fillText("🦖", 48, -20); }
      x.restore();
      x.restore();
    }

    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now;
      update(dt); draw(); requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
  })();
  </script>
</body>
</html>
