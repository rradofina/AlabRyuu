<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Dino Stomp</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../kid-sprites.js"></script>
  <style>html,body{background:#14532d}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fl">🌼 0</b><b id="st">⭐ 0</b></div>
  <div id="say">Hop for flowers. Stomp the rocks!</div>
  <div class="dock" id="dock">
    <button id="hop"><span>⬆️</span>Hop</button>
    <button id="stomp"><span>💥</span>Stomp</button>
  </div>
  <div class="cover" id="title">
    <div class="hero"><img src="../assets/sprites/dino-stomp/dino-idle.png" alt="" width="96" height="74" /></div>
    <h1>Dino Stomp</h1>
    <p>Hop flowers. Stomp rocks. Keep going!</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero"><img src="../assets/sprites/shared/star.png" alt="" width="72" height="70" /></div>
    <h1>Dino did it!</h1>
    <p id="winP">⭐ 0</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, flowers = 0, stars = 0;
    var dino = { y: 0, vy: 0, pose: "walk", poseT: 0 };
    var logs = [], blooms = [];
    var S = kidSprites([
      "dino-stomp/dino-idle.png",
      "dino-stomp/dino-jump.png",
      "dino-stomp/rock-lg.png",
      "dino-stomp/rock-md.png",
      "dino-stomp/rock-sm.png",
      "dino-stomp/flower.png",
      "dino-stomp/sun.png",
      "dino-stomp/cloud.png",
      "dino-stomp/tree.png",
      "dino-stomp/footprint.png",
      "shared/star.png"
    ]);
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-dino") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function save() { try { localStorage.setItem("alabryuu-dino", JSON.stringify({ stars: stars })); } catch (e) {} }
    function hud() {
      document.getElementById("fl").textContent = "🌼 " + flowers;
      document.getElementById("st").textContent = "⭐ " + stars;
    }
    function ground() { return H * 0.70; }
    function load() {
      logs = []; blooms = []; flowers = 0; dino.y = 0; dino.vy = 0; dino.pose = "walk";
      var i, sizes = ["lg", "md", "sm"];
      for (i = 0; i < 4; i++) logs.push({ x: W + 80 + i * 220, smash: 0, kind: sizes[i % 3] });
      for (i = 0; i < 5; i++) blooms.push({ x: 260 + i * 170, got: 0, bob: Math.random() * 6 });
      hud();
    }
    function hop() {
      if (!play) return;
      if (dino.pose !== "walk") { kidNote(260); return; }
      dino.pose = "crouch"; dino.poseT = 0;
      kidTap("⬆️", "Hop!", innerWidth * 0.28, innerHeight * 0.55, 480);
    }
    function stompNow() {
      if (!play) return;
      if (dino.pose !== "walk" && dino.pose !== "land") { kidNote(260); return; }
      dino.pose = "stomp"; dino.poseT = 0;
      kidTap("💥", "Stomp!", innerWidth * 0.28, innerHeight * 0.62, 360);
    }
    function start() {
      play = true;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      document.getElementById("say").textContent = "Hop flowers. Stomp rocks!";
      load();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("hop").onclick = hop;
    document.getElementById("stomp").onclick = stompNow;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      if (kidPt(e, cv).y > H - 120) return;
      if (kidPt(e, cv).x < W * 0.5) hop(); else stompNow();
    });
    function cheer() {
      if (flowers >= 12 && play) {
        play = false;
        document.getElementById("dock").classList.remove("on");
        document.getElementById("winP").textContent = "🌼 " + flowers + "  ⭐ " + stars;
        document.getElementById("win").classList.remove("off");
      } else if (flowers && flowers % 4 === 0) {
        document.getElementById("say").textContent = "Yes! Keep stomping!";
      }
    }
    function drawHill(gY) {
      x.fillStyle = "#86efac";
      x.beginPath();
      x.moveTo(0, gY + 8);
      x.quadraticCurveTo(W * 0.25, gY - 40, W * 0.5, gY + 4);
      x.quadraticCurveTo(W * 0.75, gY + 50, W, gY - 10);
      x.lineTo(W, H); x.lineTo(0, H); x.closePath(); x.fill();
      x.fillStyle = "#4ade80"; x.fillRect(0, gY, W, H - gY);
      x.fillStyle = "#a16207";
      x.beginPath();
      x.moveTo(0, gY + 18);
      x.quadraticCurveTo(W * 0.4, gY + 8, W, gY + 28);
      x.lineTo(W, gY + 48); x.lineTo(0, gY + 48); x.closePath(); x.fill();
    }
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      var gY = ground(), spd = 170;
      if (play) {
        dino.poseT += dt;
        if (dino.pose === "crouch") { dino.y = 8; if (dino.poseT > 0.14) { dino.pose = "air"; dino.vy = -460; dino.poseT = 0; } }
        else if (dino.pose === "air") { dino.vy += 1200 * dt; dino.y += dino.vy * dt; if (dino.y >= 0) { dino.y = 0; dino.pose = "land"; dino.poseT = 0; } }
        else if (dino.pose === "land") { if (dino.poseT > 0.14) dino.pose = "walk"; }
        else if (dino.pose === "stomp") { dino.y = 10; if (dino.poseT > 0.26) dino.pose = "walk"; }
        else dino.y = Math.sin(t * 8) * 3;
        logs.forEach(function (o) {
          if (o.smash) { o.x -= spd * dt; if (o.x < -80) { o.x = W + 140; o.smash = 0; } return; }
          o.x -= spd * dt;
          var hit = o.x > 60 && o.x < 180 && dino.y > -24;
          if (hit && dino.pose === "stomp") {
            o.smash = 1; flowers++; stars++; save(); hud(); cheer();
            document.getElementById("say").textContent = "Stomp!";
          } else if (hit && (dino.pose === "air" || dino.pose === "land")) {
            o.x = W + 60;
            document.getElementById("say").textContent = "Hop over! Stomp next time.";
          } else if (hit && dino.pose === "walk") {
            o.x = W + 40;
            document.getElementById("say").textContent = "Oops! Tap Stomp.";
          }
          if (o.x < -80) { o.x = W + 160; o.smash = 0; }
        });
        blooms.forEach(function (f) {
          f.x -= spd * dt;
          if (!f.got && f.x > 70 && f.x < 180 && (dino.pose === "air" || dino.pose === "land")) {
            f.got = 1; flowers++; stars++; save(); hud(); cheer();
            document.getElementById("say").textContent = "Flower!";
          }
          if (f.x < -40) { f.x = W + 100; f.got = 0; }
        });
      }
      var sky = x.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#7dd3fc"); sky.addColorStop(1, "#bae6fd");
      x.fillStyle = sky; x.fillRect(0, 0, W, H);
      kidDraw(x, S["dino-stomp/sun.png"], W * 0.84, 90, { fit: 70 });
      kidDraw(x, S["dino-stomp/cloud.png"], W * 0.22 + Math.sin(t * 0.3) * 12, 100, { fit: 110, alpha: 0.95 });
      kidDraw(x, S["dino-stomp/cloud.png"], W * 0.55, 70, { fit: 80, alpha: 0.85, flipX: true });
      drawHill(gY);
      kidDraw(x, S["dino-stomp/tree.png"], 48, gY - 50, { fit: 100 });
      kidDraw(x, S["dino-stomp/tree.png"], W - 50, gY - 58, { fit: 120 });
      kidDraw(x, S["dino-stomp/footprint.png"], 90, gY + 22, { fit: 36, alpha: 0.55, rot: -0.2 });
      kidDraw(x, S["dino-stomp/footprint.png"], 150, gY + 26, { fit: 32, alpha: 0.45, rot: 0.15 });
      blooms.forEach(function (f) {
        if (f.got) return;
        var bob = Math.sin(t * 4 + f.bob) * 4;
        kidDraw(x, S["dino-stomp/flower.png"], f.x, gY - 28 + bob, { fit: 44, squashY: 1 + Math.sin(t * 5 + f.bob) * 0.04 });
      });
      logs.forEach(function (o) {
        if (o.smash) return;
        var key = "dino-stomp/rock-" + o.kind + ".png";
        var fit = o.kind === "lg" ? 72 : (o.kind === "md" ? 56 : 42);
        kidDraw(x, S[key], o.x, gY - fit * 0.28, { fit: fit });
      });
      var air = dino.pose === "air" || dino.pose === "crouch";
      var spr = air || dino.pose === "stomp" ? S["dino-stomp/dino-jump.png"] : S["dino-stomp/dino-idle.png"];
      var dFit = dino.pose === "stomp" ? 108 : (dino.pose === "crouch" ? 78 : 92);
      var sq = { x: 1, y: 1 };
      if (dino.pose === "crouch") sq = { x: 1.18, y: 0.82 };
      else if (dino.pose === "land") sq = kidSquash(Math.min(1, dino.poseT / 0.14));
      else if (dino.pose === "stomp") sq = { x: 1.22, y: 0.78 };
      else if (dino.pose === "walk") {
        var wob = Math.sin(t * 8);
        sq = { x: 1 + wob * 0.03, y: 1 - wob * 0.03 };
      }
      kidDraw(x, spr, 120, gY - 36 + dino.y, { fit: dFit, squashX: sq.x, squashY: sq.y });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
