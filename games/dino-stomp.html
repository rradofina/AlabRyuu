<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Dino Stomp</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#14532d}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fl">🌼 0</b><b id="st">⭐ 0</b></div>
  <div id="say">Hop for flowers. Stomp the logs!</div>
  <div class="dock" id="dock">
    <button id="hop"><span>⬆️</span>Hop</button>
    <button id="stomp"><span>💥</span>Stomp</button>
  </div>
  <div class="cover" id="title">
    <div class="hero">🦕</div>
    <h1>Dino Stomp</h1>
    <p>Hop flowers. Stomp logs. Keep going!</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">🎉</div>
    <h1>Dino did it!</h1>
    <p id="winP">⭐ 0</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, t = 0, last = 0, play = false, flowers = 0, stars = 0;
    var dino = { y: 0, vy: 0, pose: "walk", poseT: 0 };
    var logs = [], blooms = [];
    try { var sv = JSON.parse(localStorage.getItem("alabryuu-dino") || "{}"); if (sv.stars) stars = sv.stars; } catch (e) {}
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function save() { try { localStorage.setItem("alabryuu-dino", JSON.stringify({ stars: stars })); } catch (e) {} }
    function hud() {
      document.getElementById("fl").textContent = "🌼 " + flowers;
      document.getElementById("st").textContent = "⭐ " + stars;
    }
    function ground() { return H * 0.70; }
    function load() {
      logs = []; blooms = []; flowers = 0; dino.y = 0; dino.vy = 0; dino.pose = "walk";
      var i;
      for (i = 0; i < 4; i++) logs.push({ x: W + 80 + i * 220, smash: 0 });
      for (i = 0; i < 5; i++) blooms.push({ x: 260 + i * 170, got: 0 });
      hud();
    }
    function hop() { if (!play || dino.pose !== "walk") return; dino.pose = "crouch"; dino.poseT = 0; }
    function stompNow() { if (!play || (dino.pose !== "walk" && dino.pose !== "land")) return; dino.pose = "stomp"; dino.poseT = 0; }
    function start() {
      play = true;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("dock").classList.add("on");
      document.getElementById("say").textContent = "Hop flowers. Stomp logs!";
      load();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    document.getElementById("hop").onclick = hop;
    document.getElementById("stomp").onclick = stompNow;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      if (kidPt(e, cv).y > H - 120) return;
      if (kidPt(e, cv).x < W * 0.5) hop(); else stompNow();
    });
    function cheer() {
      if (flowers >= 12 && play) {
        play = false;
        document.getElementById("dock").classList.remove("on");
        document.getElementById("winP").textContent = "🌼 " + flowers + "  ⭐ " + stars;
        document.getElementById("win").classList.remove("off");
      } else if (flowers && flowers % 4 === 0) {
        document.getElementById("say").textContent = "Yes! Keep stomping!";
      }
    }
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
      var gY = ground(), spd = 170;
      if (play) {
        dino.poseT += dt;
        if (dino.pose === "crouch") { dino.y = 8; if (dino.poseT > 0.14) { dino.pose = "air"; dino.vy = -460; dino.poseT = 0; } }
        else if (dino.pose === "air") { dino.vy += 1200 * dt; dino.y += dino.vy * dt; if (dino.y >= 0) { dino.y = 0; dino.pose = "land"; dino.poseT = 0; } }
        else if (dino.pose === "land") { if (dino.poseT > 0.14) dino.pose = "walk"; }
        else if (dino.pose === "stomp") { dino.y = 10; if (dino.poseT > 0.26) dino.pose = "walk"; }
        else dino.y = Math.sin(t * 8) * 3;
        logs.forEach(function (o) {
          if (o.smash) { o.x -= spd * dt; if (o.x < -80) { o.x = W + 140; o.smash = 0; } return; }
          o.x -= spd * dt;
          var hit = o.x > 60 && o.x < 180 && dino.y > -24;
          if (hit && dino.pose === "stomp") {
            o.smash = 1; flowers++; stars++; save(); hud(); cheer();
            document.getElementById("say").textContent = "Stomp!";
          } else if (hit && (dino.pose === "air" || dino.pose === "land")) {
            o.x = W + 60;
            document.getElementById("say").textContent = "Hop over! Stomp next time.";
          } else if (hit && dino.pose === "walk") {
            o.x = W + 40;
            document.getElementById("say").textContent = "Oops! Tap Stomp.";
          }
          if (o.x < -80) { o.x = W + 160; o.smash = 0; }
        });
        blooms.forEach(function (f) {
          f.x -= spd * dt;
          if (!f.got && f.x > 70 && f.x < 180 && (dino.pose === "air" || dino.pose === "land")) {
            f.got = 1; flowers++; stars++; save(); hud(); cheer();
            document.getElementById("say").textContent = "Flower!";
          }
          if (f.x < -40) { f.x = W + 100; f.got = 0; }
        });
      }
      x.fillStyle = "#7dd3fc"; x.fillRect(0, 0, W, H);
      em("☀️", W * 0.84, 90, 56);
      em("🌳", 40, gY - 40, 64); em("🌳", W - 40, gY - 50, 72);
      x.fillStyle = "#4ade80"; x.fillRect(0, gY, W, H - gY);
      blooms.forEach(function (f) { if (!f.got) em("🌼", f.x, gY - 28, 48); });
      logs.forEach(function (o) { if (!o.smash) em("🪵", o.x, gY - 24, 64); });
      var dsz = dino.pose === "stomp" ? 92 : (dino.pose === "crouch" ? 64 : 80);
      em("🦕", 120, gY - 28 + dino.y, dsz);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
