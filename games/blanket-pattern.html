<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var open = false;
      try { open = localStorage.getItem("alabryuu-open") === "1"; } catch (e) {}
      if (open) return;
      document.documentElement.classList.add("kid-locked");
      var path = location.pathname || "";
      document.documentElement.style.background = path.indexOf("/alonzorui") === 0 ? "#fff7ed" : "#1e1b4b";
    })();
  </script>
  <style id="kid-lock-hide">
    html.kid-locked, html.kid-locked body { overflow: hidden !important; height: 100% !important; }
    html.kid-locked body { visibility: hidden !important; }
    #kid-lock, #kid-lock * { visibility: visible !important; }
  </style>
  <script src="/kid-lock.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Blanket Pattern</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <script src="../kid-keys.js"></script>
  <script src="../mix.js"></script>
  <style>
    html, body { background: #fbcfe8; }
    .home { z-index: 60; }
    .dock button { font-size: 22px; }
    .dock button i { display: block; width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px; border: 3px solid #1e1b4b; background: var(--c, #fff); }
    .hero svg { width: 96px; height: 96px; display: block; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="fl">1 / 3</b></div>
  <div id="say">Copy the little squares</div>
  
  <div class="cover" id="title">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><rect x="18" y="18" width="26" height="26" fill="#ef4444" stroke="#1e1b4b" stroke-width="4"/><rect x="48" y="18" width="26" height="26" fill="#3b82f6" stroke="#1e1b4b" stroke-width="4"/><rect x="18" y="48" width="26" height="26" fill="#eab308" stroke="#1e1b4b" stroke-width="4"/><rect x="48" y="48" width="26" height="26" fill="#22c55e" stroke="#1e1b4b" stroke-width="4"/></svg></div>
    <h1>Blanket Pattern</h1>
    <p>Tap a square to change its color.</p>
    <button class="play" id="go" autofocus>Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero"><svg viewBox="0 0 92 92" aria-hidden="true"><rect x="18" y="18" width="26" height="26" fill="#ef4444" stroke="#1e1b4b" stroke-width="4"/><rect x="48" y="18" width="26" height="26" fill="#3b82f6" stroke="#1e1b4b" stroke-width="4"/><rect x="18" y="48" width="26" height="26" fill="#eab308" stroke="#1e1b4b" stroke-width="4"/><rect x="48" y="48" width="26" height="26" fill="#22c55e" stroke="#1e1b4b" stroke-width="4"/></svg></div>
    <h1>The blanket matches!</h1>
    <p>Three patterns copied.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
(function () {
  var cv = document.getElementById("c");
  var ui = Mix.boot(cv);
  var ctx, W = 0, H = 0, raf = 0;
  function layout(force) {
    var r = cv.getBoundingClientRect();
    var rw = Math.round(r.width || 0), rh = Math.round(r.height || 0);
    if (!force && ctx && Math.round(W) === rw && Math.round(H) === rh && rw > 0) return;
    var f = ui.fit();
    ctx = f.ctx; W = f.W; H = f.H;
  }
  function loop() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  function frame() {
    if (!ui.on()) return;
    layout(false);
    if (W < 2 || H < 2) { raf = requestAnimationFrame(frame); return; }
    if (step() === "stop") return;
    draw();
    raf = requestAnimationFrame(frame);
  }
  function begin() { layout(true); reset(); loop(); }
  function hud(t) {
    var el = document.getElementById("fl");
    if (el) el.textContent = t;
    var m = String(t).match(/\d+/);
    if (m) cv.dataset.score = m[0];
  }
  function sky(a, b) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ui.begin(begin);
  ui.replay(begin);
  
  var palette, target, guess, roundN;
  palette = ["#ef4444", "#3b82f6", "#eab308", "#22c55e"];
  function newPat() {
    target = [0, 1, 2, 3].map(function () { return Math.floor(Math.random() * 4); });
    guess = [-1, -1, -1, -1];
  }
  function reset() { roundN = 0; newPat(); hud("1 / 3"); }
  function big(i) {
    var size = Math.min(120, (W - 70) / 2), gap = 14;
    var ox = (W - size * 2 - gap) / 2, oy = H * 0.42;
    return { x: ox + (i % 2) * (size + gap), y: oy + Math.floor(i / 2) * (size + gap), s: size };
  }
  function mini(i) {
    var size = 34, gap = 8, ox = (W - size * 2 - gap) / 2, oy = 112;
    return { x: ox + (i % 2) * (size + gap), y: oy + Math.floor(i / 2) * (size + gap), s: size };
  }
  function check() {
    var i; for (i = 0; i < 4; i++) if (guess[i] !== target[i]) return;
    roundN++;
    kidNote(660);
    if (roundN >= 3) { draw(); ui.finish(); return; }
    kidPing("Next blanket");
    newPat();
    hud((roundN + 1) + " / 3");
  }
  cv.addEventListener("pointerdown", function (e) {
    if (!ui.on()) return;
    var p = kidPt(e, cv), i, b;
    for (i = 0; i < 4; i++) {
      b = big(i);
      if (p.x >= b.x && p.x <= b.x + b.s && p.y >= b.y && p.y <= b.y + b.s) {
        guess[i] = guess[i] < 0 ? 0 : (guess[i] + 1) % 4;
        kidNote(400 + guess[i] * 50);
        check();
        return;
      }
    }
  });
  function step() {
    cv.dataset.want = target.join("");
    cv.dataset.have = guess.map(function (n) { return n < 0 ? "x" : String(n); }).join("");
    cv.dataset.boxes = [0, 1, 2, 3].map(function (i) {
      var b = big(i); return Math.round(b.x + b.s / 2) + "," + Math.round(b.y + b.s / 2);
    }).join(";");
  }
  function sq(b, idx, on) {
    ctx.fillStyle = idx < 0 ? "#f8fafc" : palette[idx];
    Mix.box(ctx, b.x, b.y, b.s, b.s, on ? 16 : 8); ctx.fill(); Mix.ink(ctx);
  }
  function draw() {
    sky("#fce7f3", "#fbcfe8");
    ctx.fillStyle = "#1e1b4b"; ctx.font = "700 22px Trebuchet MS, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("Copy", W / 2, 100);
    var i; for (i = 0; i < 4; i++) sq(mini(i), target[i], false);
    for (i = 0; i < 4; i++) sq(big(i), guess[i], true);
  }

  layout(true);
  if (W > 2) { reset(); draw(); }
  addEventListener("resize", function () { layout(true); if (W > 2) draw(); });
})();
  </script>
</body>
</html>
