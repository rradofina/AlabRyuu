<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mail Round</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js?v=3"></script>
  <style>html,body{background:#dbeafe}</style>
</head>
<body>
<script>
kidChrome({
  title: "Mail Round",
  hero: "✉️",
  blurb: "Tap the house that matches the letter!",
  say: "Match the color!",
  hud: "✉️ 0/6",
  winHero: "📬",
  winTitle: "Delivered!",
  winText: "Six letters found a home.",
  again: "Deliver again",
  bg: "#dbeafe"
});
(function () {
  var S = kidStage();
  var COLORS = [
    { e: "🔴", name: "red" },
    { e: "🔵", name: "blue" },
    { e: "🟡", name: "yellow" }
  ];
  var play = false, n = 0, want = 0;
  function houseX(i) { return S.W * (0.2 + i * 0.3); }
  function next() { want = (Math.random() * 3) | 0; kidSay("Take it to " + COLORS[want].name + "!"); }
  function start() { play = true; n = 0; kidBegin("Match the color!", "✉️ 0/6"); next(); }
  kidBind(start);
  S.cv.addEventListener("pointerdown", function (e) {
    if (!play) return;
    var p = kidPt(e, S.cv);
    var i = kidNearest(p.x, p.y, COLORS, 100, function (_, k) { return { x: houseX(k), y: S.H * 0.68 }; });
    if (i < 0) { kidMiss("🏠", "Tap a house!", p.x, p.y); return; }
    if (i === want) {
      n++;
      kidTap("✉️", "Delivered!  " + n + "/6", houseX(i), S.H * 0.68, 540);
      if (kidMark(n, 6, "✉️")) { play = false; kidFinish("Six letters found a home."); }
      else next();
    } else kidMiss(COLORS[i].e, "Look for " + COLORS[want].name + "!", houseX(want), S.H * 0.68);
  });
  kidTick(function (t) {
    S.bg("#eff6ff");
    S.em("🚶", S.W * (0.16 + Math.min(n, 6) * 0.1), S.H * 0.38, 80);
    if (play) {
      S.em(COLORS[want].e, S.W * 0.62, S.H * 0.24, 88);
      S.em("✉️", S.W * 0.62, S.H * 0.38, 72);
    }
    for (var i = 0; i < 3; i++) {
      S.em("🏠", houseX(i), S.H * 0.7, 100);
      S.em(COLORS[i].e, houseX(i), S.H * 0.56, 48);
    }
  });
})();
</script>
</body>
</html>
