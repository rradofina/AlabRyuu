<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Shadow Match</title>
  <link rel="stylesheet" href="../kid.css" />
  <script src="../kid.js"></script>
  <style>html,body{background:#1e1b4b}</style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="rd">1/6</b></div>
  <div id="say">Which one makes this shadow?</div>
  <div class="cover" id="title">
    <div class="hero">🌙</div>
    <h1>Shadow Match</h1>
    <p>Tap the friend that matches the shadow.</p>
    <button class="play" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <div class="hero">⭐</div>
    <h1>Shadow star!</h1>
    <p>Six matches.</p>
    <button class="play g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), x = cv.getContext("2d");
    var W, H, play = false, round = 0;
    var ALL = ["🐘", "🦒", "🦆", "🍎", "⭐", "🦋"];
    var choices = [], want = "🐘";
    function em(ch, px, py, s) {
      x.font = s + "px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(ch, px, py);
    }
    function resize() {
      var d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener("resize", resize); resize();
    function deal() {
      want = ALL[round];
      var pool = [want];
      while (pool.length < 3) {
        var e = ALL[(Math.random() * ALL.length) | 0];
        if (pool.indexOf(e) < 0) pool.push(e);
      }
      pool.sort(function () { return Math.random() - 0.5; });
      choices = pool.map(function (e, i) { return { e: e, x: 0.22 + i * 0.28, y: 0.68 }; });
      document.getElementById("rd").textContent = (round + 1) + "/6";
      document.getElementById("say").textContent = "Which one matches?";
    }
    function start() {
      play = true; round = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      deal();
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = start;
    cv.addEventListener("pointerdown", function (e) {
      if (!play) return;
      choices.forEach(function (c) {
        var dx = kidPt(e, cv).x - c.x * W, dy = kidPt(e, cv).y - c.y * H;
        if (dx * dx + dy * dy < 55 * 55) {
          if (c.e === want) {
            round++;
            if (round >= 6) { play = false; document.getElementById("win").classList.remove("off"); }
            else deal();
          } else document.getElementById("say").textContent = "Not that shadow. Try again!";
        }
      });
    });
    function loop() {
      x.fillStyle = "#1e1b4b"; x.fillRect(0, 0, W, H);
      em("🌙", W * 0.84, 80, 56);
      x.save();
      x.filter = "grayscale(1) brightness(0)";
      em(want, W * 0.5, H * 0.34, 110);
      x.restore();
      choices.forEach(function (c) { em(c.e, c.x * W, c.y * H, 72); });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
