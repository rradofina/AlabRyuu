<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Shadow Match</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background: #0b1026; color: #e2e8f0; touch-action: none; user-select: none; }
    button { background: transparent; border: 0; appearance: none; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .home { position: fixed; top: 12px; left: 12px; z-index: 12; color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; background: rgba(0,0,0,.32); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 12px; right: 12px; z-index: 8; font-weight: 800; text-align: right; pointer-events: none; }
    #hud b { display: inline-block; background: rgba(255,255,255,.12); padding: 6px 12px; border-radius: 999px; margin-left: 6px; font-size: 14px; }
    #say { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 8; font-weight: 800; color: #fde68a; pointer-events: none; text-align: center; width: 92%; }
    #spin { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 8; display: none; gap: 10px; }
    #spin.on { display: flex; }
    #spin button { background: #fde68a; color: #3b2100; font-weight: 800; font-size: 20px; padding: 12px 20px; border-radius: 999px; box-shadow: 0 6px 0 #b45309; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; gap: 8px; padding: 20px 20px 48px; pointer-events: none; }
    .cover.off { display: none; }
    .cover h1 { font-size: clamp(30px, 8vw, 46px); color: #fde68a; }
    .cover p { font-weight: 800; color: #e2e8f0; }
    .btn { pointer-events: auto; background: #ffd166; color: #3b2100; font-weight: 800; font-size: 24px; padding: 14px 28px; border-radius: 999px; box-shadow: 0 7px 0 #e09f1f; }
    .btn.g { background: #c4b5fd; color: #2e1065; box-shadow: 0 7px 0 #7c3aed; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="sc">Park day</b><b id="st">Stars 0</b></div>
  <div id="say">Turn the toy. Match the shadow!</div>
  <div id="spin">
    <button id="ccw">↺</button>
    <button id="ok">That's it!</button>
    <button id="cw">↻</button>
  </div>
  <div class="cover" id="title">
    <h1>Shadow Match</h1>
    <p>The sun moves. Shadows stretch.<br>Rotate. Night moon last!</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <h1>Light hero!</h1>
    <p id="winP">Five scenes matched.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), g = cv.getContext("2d");
    var W, H, last = 0, t = 0, mode = "title", stars = 0, scene = 0, round = 0;
    var sun = { a: 0.3, ta: 0.3 }, obj = { kind: "giraffe", rot: 0, want: 0 };
    var stretch = 1, bits = [];

    var SCENES = [
      { n: "Park day", night: 0, items: ["giraffe", "tree", "bike"], rounds: 3 },
      { n: "Beach noon", night: 0, items: ["flamingo", "palm", "boat"], rounds: 3 },
      { n: "Farm dusk", night: 0, items: ["cow", "tractor", "sunflower"], rounds: 3 },
      { n: "City eve", night: 0, items: ["bus", "statue", "dog"], rounds: 3 },
      { n: "Moon garden", night: 1, items: ["owl", "cactus", "rocket"], rounds: 4 }
    ];

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), gn = ac.createGain();
        o.type = "sine"; o.frequency.value = f; gn.gain.value = 0.07;
        o.connect(gn); gn.connect(ac.destination); o.start();
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function lerp(a, b, p) { return a + (b - a) * p; }
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function ink(col, shadow) { return shadow ? "#0b1220" : col; }
    function oval(cx, cy, rx, ry, col) {
      g.fillStyle = col;
      g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, 6.28); g.fill();
    }
    function dot(cx, cy, r, col) {
      g.fillStyle = col;
      g.beginPath(); g.arc(cx, cy, r, 0, 6.28); g.fill();
    }

    function resize() {
      cv.width = innerWidth * (devicePixelRatio || 1);
      cv.height = innerHeight * (devicePixelRatio || 1);
      g.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0);
      W = innerWidth; H = innerHeight;
    }
    addEventListener("resize", resize); resize();

    function loadRound() {
      var S = SCENES[scene];
      obj.kind = S.items[round % S.items.length];
      obj.rot = 0;
      obj.want = (Math.floor(rnd(0, 4)) * Math.PI) / 2;
      sun.ta = S.night ? 1.2 : 0.25 + round * 0.18 + scene * 0.08;
      stretch = 1;
      document.getElementById("sc").textContent = S.n;
      document.getElementById("say").textContent = S.night ? "Moonlight stretch. Match the long shadow!" : "Turn the toy to the stretched shadow.";
    }

    function confirm() {
      if (mode !== "play") return;
      var diff = Math.abs(((obj.rot - obj.want + Math.PI * 8) % (Math.PI * 2)) - 0);
      diff = Math.min(diff, Math.PI * 2 - diff);
      if (diff < 0.45) {
        stars += 3; document.getElementById("st").textContent = "Stars " + stars;
        beep(700, 0.1);
        var i; for (i = 0; i < 10; i++) bits.push({ x: W / 2, y: H * 0.42, vx: rnd(-80, 80), vy: rnd(-100, -20), life: 1 });
        round++;
        if (round >= SCENES[scene].rounds) {
          if (scene < SCENES.length - 1) { scene++; round = 0; document.getElementById("say").textContent = "New light!"; setTimeout(loadRound, 600); }
          else {
            mode = "win"; document.getElementById("spin").classList.remove("on");
            document.getElementById("win").classList.remove("off");
            document.getElementById("winP").textContent = "Five scenes. " + stars + " stars.";
            beep(880, 0.16);
          }
        } else setTimeout(loadRound, 500);
      } else {
        document.getElementById("say").textContent = "Almost! Turn a little more.";
        beep(200, 0.08);
      }
    }

    function drawToy(kind, shadow, sc) {
      sc = sc || 1;
      g.save();
      g.scale(sc, sc);
      var c = function (col) { return ink(col, shadow); };
      var i;
      if (kind === "giraffe") {
        g.fillStyle = c("#b45309");
        g.fillRect(-14, 18, 5, 22); g.fillRect(-4, 18, 5, 22);
        g.fillRect(8, 18, 5, 22); g.fillRect(16, 18, 5, 22);
        oval(2, 10, 22, 12, c("#fbbf24"));
        g.fillStyle = c("#fbbf24");
        g.fillRect(12, -28, 8, 36);
        oval(20, -34, 10, 8, c("#fbbf24"));
        oval(16, -42, 3, 5, c("#b45309"));
        oval(22, -42, 3, 5, c("#b45309"));
        if (!shadow) {
          oval(-4, 6, 4, 3, "#b45309");
          oval(8, 12, 4, 3, "#b45309");
          oval(18, 4, 3, 2.5, "#b45309");
          oval(22, -36, 4, 3, "#fde68a");
          dot(24, -36, 1.4, "#1c1917");
        }
      } else if (kind === "tree") {
        g.fillStyle = c("#854d0e");
        g.fillRect(-8, 8, 16, 32);
        oval(0, -6, 28, 22, c("#16a34a"));
        oval(-14, 4, 16, 14, c("#15803d"));
        oval(14, 6, 15, 13, c("#22c55e"));
        if (!shadow) oval(-6, -10, 8, 6, "#4ade80");
      } else if (kind === "bike") {
        g.strokeStyle = c("#1d4ed8"); g.lineWidth = 4;
        g.beginPath(); g.arc(-18, 16, 14, 0, 6.28); g.stroke();
        g.beginPath(); g.arc(20, 16, 14, 0, 6.28); g.stroke();
        g.beginPath();
        g.moveTo(-18, 16); g.lineTo(4, 16); g.lineTo(16, 2); g.lineTo(-6, 2); g.closePath();
        g.moveTo(4, 16); g.lineTo(-6, 2);
        g.moveTo(16, 2); g.lineTo(22, -8);
        g.moveTo(-6, 2); g.lineTo(-12, -6);
        g.stroke();
        g.fillStyle = c("#ef4444");
        g.beginPath(); g.arc(22, -10, 5, 0, 6.28); g.fill();
      } else if (kind === "flamingo") {
        g.strokeStyle = c("#fb7185"); g.lineWidth = 4; g.lineCap = "round";
        g.beginPath(); g.moveTo(0, 38); g.lineTo(2, 10); g.stroke();
        oval(6, 2, 16, 8, c("#fb7185"));
        g.strokeStyle = c("#fb7185"); g.lineWidth = 5;
        g.beginPath(); g.moveTo(-8, 0); g.quadraticCurveTo(-22, -18, -6, -22); g.stroke();
        oval(-4, -24, 7, 5, c("#fb7185"));
        if (!shadow) {
          g.fillStyle = "#1c1917";
          g.beginPath(); g.moveTo(-10, -24); g.lineTo(-18, -22); g.lineTo(-10, -20); g.fill();
          dot(-2, -26, 1.3, "#1c1917");
        }
      } else if (kind === "palm") {
        g.fillStyle = c("#b45309");
        g.beginPath();
        g.moveTo(-6, 38); g.quadraticCurveTo(10, 10, 0, -8);
        g.lineTo(8, -8); g.quadraticCurveTo(18, 12, 6, 38); g.fill();
        g.strokeStyle = c("#16a34a"); g.lineWidth = 5; g.lineCap = "round";
        for (i = 0; i < 6; i++) {
          var a = -2.4 + i * 0.8;
          g.beginPath(); g.moveTo(4, -8); g.quadraticCurveTo(4 + Math.cos(a) * 16, -16, 4 + Math.cos(a) * 28, -8 + Math.sin(a) * 16); g.stroke();
        }
      } else if (kind === "boat") {
        g.fillStyle = c("#fff");
        g.beginPath(); g.moveTo(2, -28); g.lineTo(2, 8); g.lineTo(24, 8); g.closePath(); g.fill();
        g.fillStyle = c("#1d4ed8");
        g.beginPath(); g.moveTo(-28, 12); g.lineTo(28, 12); g.lineTo(18, 28); g.lineTo(-18, 28); g.closePath(); g.fill();
        g.strokeStyle = c("#854d0e"); g.lineWidth = 3;
        g.beginPath(); g.moveTo(2, -28); g.lineTo(2, 12); g.stroke();
      } else if (kind === "cow") {
        g.fillStyle = c("#3f2a14");
        g.fillRect(-16, 16, 5, 16); g.fillRect(-6, 16, 5, 16);
        g.fillRect(8, 16, 5, 16); g.fillRect(16, 16, 5, 16);
        oval(0, 8, 24, 14, c("#f5f0e6"));
        oval(22, -4, 10, 8, c("#f5f0e6"));
        if (!shadow) {
          oval(-8, 4, 6, 5, "#7c4a1e");
          oval(8, 10, 5, 4, "#7c4a1e");
          oval(28, -2, 5, 3.5, "#fda4af");
          g.fillStyle = "#f5f0e6";
          g.beginPath(); g.moveTo(16, -10); g.lineTo(18, -18); g.lineTo(22, -8); g.fill();
          g.beginPath(); g.moveTo(22, -10); g.lineTo(26, -18); g.lineTo(28, -8); g.fill();
          dot(26, -6, 1.4, "#1c1917");
        }
      } else if (kind === "tractor") {
        dot(-10, 22, 16, c("#1c1917"));
        if (!shadow) dot(-10, 22, 8, "#78716c");
        dot(20, 26, 10, c("#1c1917"));
        g.fillStyle = c("#16a34a");
        g.fillRect(-18, -4, 40, 22);
        g.fillRect(-4, -22, 22, 20);
        if (!shadow) {
          g.fillStyle = "#7dd3fc";
          g.fillRect(0, -18, 14, 10);
        }
      } else if (kind === "sunflower") {
        for (i = 0; i < 10; i++) {
          var p = i * 0.628;
          oval(Math.cos(p) * 16, Math.sin(p) * 16 - 8, 7, 10, c("#facc15"));
        }
        oval(0, -8, 12, 12, c("#854d0e"));
        g.fillStyle = c("#16a34a");
        g.fillRect(-3, 4, 6, 32);
        oval(10, 16, 8, 4, c("#22c55e"));
      } else if (kind === "bus") {
        g.fillStyle = c("#eab308");
        g.beginPath();
        g.moveTo(-34, -8); g.lineTo(30, -8); g.lineTo(34, 8); g.lineTo(30, 22); g.lineTo(-34, 22); g.closePath();
        g.fill();
        if (!shadow) {
          g.fillStyle = "#7dd3fc";
          g.fillRect(-26, -2, 12, 10); g.fillRect(-8, -2, 12, 10); g.fillRect(10, -2, 12, 10);
        }
        dot(-18, 26, 7, c("#1c1917"));
        dot(18, 26, 7, c("#1c1917"));
      } else if (kind === "statue") {
        oval(0, -22, 8, 8, c("#a8a29e"));
        g.fillStyle = c("#94a3b8");
        g.fillRect(-8, -14, 16, 22);
        g.fillRect(-18, -8, 12, 5);
        g.fillRect(8, -18, 5, 16);
        oval(12, -22, 5, 5, c("#fde047"));
        g.fillRect(-12, 8, 24, 28);
      } else if (kind === "dog") {
        g.fillStyle = c("#b45309");
        g.fillRect(-10, 16, 5, 16); g.fillRect(6, 16, 5, 16);
        oval(0, 8, 16, 10, c("#d97706"));
        oval(16, 2, 9, 7, c("#d97706"));
        oval(12, -6, 4, 6, c("#b45309"));
        oval(20, -4, 4, 6, c("#b45309"));
        if (!shadow) {
          oval(20, 4, 4, 2.6, "#fda4af");
          dot(18, 0, 1.3, "#1c1917");
        }
        g.strokeStyle = c("#b45309"); g.lineWidth = 4;
        g.beginPath(); g.moveTo(-14, 6); g.quadraticCurveTo(-22, -4, -16, 12); g.stroke();
      } else if (kind === "owl") {
        oval(0, 4, 16, 20, c("#b45309"));
        g.fillStyle = c("#92400e");
        g.beginPath(); g.moveTo(-10, -10); g.lineTo(-6, -22); g.lineTo(-2, -8); g.fill();
        g.beginPath(); g.moveTo(10, -10); g.lineTo(6, -22); g.lineTo(2, -8); g.fill();
        if (!shadow) {
          oval(-6, 0, 6, 6, "#fde68a");
          oval(6, 0, 6, 6, "#fde68a");
          dot(-6, 0, 2.4, "#1c1917");
          dot(6, 0, 2.4, "#1c1917");
          g.fillStyle = "#ea580c";
          g.beginPath(); g.moveTo(-3, 8); g.lineTo(0, 14); g.lineTo(3, 8); g.fill();
        }
      } else if (kind === "cactus") {
        g.fillStyle = c("#16a34a");
        g.beginPath();
        g.moveTo(-10, 36); g.lineTo(-10, -16); g.quadraticCurveTo(0, -28, 10, -16); g.lineTo(10, 36); g.fill();
        g.fillRect(-24, -4, 16, 8);
        g.fillRect(10, 4, 16, 8);
        g.beginPath(); g.arc(-24, 0, 6, 0, 6.28); g.fill();
        g.beginPath(); g.arc(26, 8, 6, 0, 6.28); g.fill();
        if (!shadow) {
          g.strokeStyle = "#14532d"; g.lineWidth = 1;
          g.beginPath(); g.moveTo(-4, -10); g.lineTo(-4, 20); g.moveTo(4, -8); g.lineTo(4, 22); g.stroke();
        }
      } else if (kind === "rocket") {
        g.fillStyle = c("#e2e8f0");
        g.beginPath(); g.moveTo(0, -34); g.lineTo(16, 8); g.lineTo(-16, 8); g.closePath(); g.fill();
        g.fillStyle = c("#ef4444");
        g.beginPath(); g.moveTo(-16, 8); g.lineTo(-22, 24); g.lineTo(-6, 12); g.fill();
        g.beginPath(); g.moveTo(16, 8); g.lineTo(22, 24); g.lineTo(6, 12); g.fill();
        if (!shadow) {
          oval(0, -4, 5, 5, "#38bdf8");
          g.fillStyle = "#fb923c";
          g.beginPath(); g.moveTo(-6, 10); g.lineTo(0, 22); g.lineTo(6, 10); g.fill();
        }
      } else if (kind === "apple") {
        oval(0, 4, 16, 14, c("#ef4444"));
        g.strokeStyle = c("#166534"); g.lineWidth = 3;
        g.beginPath(); g.moveTo(0, -8); g.lineTo(6, -18); g.stroke();
        oval(8, -14, 6, 3, c("#22c55e"));
      } else if (kind === "star") {
        g.fillStyle = c("#fde047");
        g.beginPath();
        for (i = 0; i < 5; i++) {
          var a1 = -Math.PI / 2 + i * 1.256, a2 = a1 + 0.628;
          var cmd = i ? "lineTo" : "moveTo";
          g[cmd](Math.cos(a1) * 22, Math.sin(a1) * 22);
          g.lineTo(Math.cos(a2) * 10, Math.sin(a2) * 10);
        }
        g.closePath(); g.fill();
      } else if (kind === "balloon") {
        oval(0, -8, 14, 18, c("#fb7185"));
        g.strokeStyle = c("#e2e8f0"); g.lineWidth = 2;
        g.beginPath(); g.moveTo(0, 10); g.quadraticCurveTo(-6, 22, 0, 32); g.stroke();
      } else {
        oval(0, 4, 16, 10, c("#facc15"));
        oval(12, -4, 8, 7, c("#facc15"));
        oval(20, -2, 6, 3, c("#ea580c"));
      }
      g.restore();
    }

    function drawSky() {
      var S = SCENES[scene] || SCENES[0];
      var grd = g.createLinearGradient(0, 0, 0, H);
      if (mode === "title") { grd.addColorStop(0, "#1e1b4b"); grd.addColorStop(1, "#312e81"); }
      else if (S.night) { grd.addColorStop(0, "#020617"); grd.addColorStop(0.5, "#1e1b4b"); grd.addColorStop(1, "#312e81"); }
      else { grd.addColorStop(0, "#7dd3fc"); grd.addColorStop(0.45, "#fdba74"); grd.addColorStop(1, "#78350f"); }
      g.fillStyle = grd; g.fillRect(0, 0, W, H);
      var ang = mode === "title" ? t * 0.2 : sun.a;
      var sx = W * 0.5 + Math.cos(ang) * W * 0.38;
      var sy = H * 0.18 + Math.sin(ang) * 40;
      g.fillStyle = (S && S.night && mode === "play") ? "#f8fafc" : "#fde047";
      g.beginPath(); g.arc(sx, sy, S && S.night && mode === "play" ? 18 : 26, 0, 6.28); g.fill();
      if (S && S.night && mode === "play") {
        g.fillStyle = "#020617"; g.beginPath(); g.arc(sx + 8, sy - 4, 14, 0, 6.28); g.fill();
        var i; g.fillStyle = "#fff";
        for (i = 0; i < 24; i++) { g.globalAlpha = 0.4 + 0.4 * Math.sin(t + i); g.fillRect((i * 53) % W, 16 + (i * 29) % 90, 2, 2); }
        g.globalAlpha = 1;
      }
    }

    function drawPlay() {
      var ground = H * 0.62;
      g.fillStyle = "#1e293b"; g.fillRect(0, ground, W, H - ground);
      var shAng = sun.a + Math.PI;
      g.save();
      g.translate(W / 2, ground);
      g.rotate(obj.want + shAng - Math.PI / 2);
      g.scale(1, 0.28 + Math.abs(Math.cos(sun.a)) * 0.5);
      g.globalAlpha = 0.72;
      drawToy(obj.kind, true, 1.15);
      g.globalAlpha = 1;
      g.restore();

      g.save();
      g.translate(W / 2, ground - 18);
      g.rotate(obj.rot);
      drawToy(obj.kind, false, 1.2);
      g.restore();

      g.fillStyle = "rgba(253,230,138,.12)";
      g.beginPath(); g.arc(W / 2, ground - 30, 70, 0, 6.28); g.fill();
    }

    function drawTitleSh() {
      drawSky();
      var kinds = ["giraffe", "bike", "owl", "boat", "rocket"];
      var i;
      for (i = 0; i < 5; i++) {
        g.save();
        g.translate(W * (0.15 + i * 0.17), H * 0.46);
        g.rotate(t * 0.4 + i);
        drawToy(kinds[i], false, 0.72);
        g.restore();
        g.save();
        g.translate(W * (0.15 + i * 0.17), H * 0.66);
        g.scale(1, 0.32 + 0.16 * Math.sin(t + i));
        g.globalAlpha = 0.55;
        drawToy(kinds[i], true, 0.72);
        g.restore();
        g.globalAlpha = 1;
      }
    }

    function update(dt) {
      t += dt;
      sun.a = lerp(sun.a, mode === "title" ? 0.4 + Math.sin(t * 0.4) * 0.3 : sun.ta, 1 - Math.pow(0.02, dt));
      stretch = 1 + Math.abs(Math.cos(sun.a)) * 0.8;
      bits.forEach(function (b) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; });
      bits = bits.filter(function (b) { return b.life > 0; });
    }

    function draw() {
      if (mode === "title" || mode === "win") { drawTitleSh(); return; }
      drawSky(); drawPlay();
      bits.forEach(function (b) {
        g.globalAlpha = b.life;
        dot(b.x, b.y, 4, "#fde047");
        g.globalAlpha = 1;
      });
    }

    function loop(now) {
      var dt = Math.min(0.033, (now - last) / 1000 || 0.016);
      last = now; update(dt); draw(); requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function start() {
      mode = "play"; scene = 0; round = 0; stars = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("spin").classList.add("on");
      document.getElementById("st").textContent = "Stars 0";
      loadRound(); beep(500, 0.1);
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = function () { document.getElementById("win").classList.add("off"); start(); };
    document.getElementById("cw").onclick = function () { obj.rot += Math.PI / 2; beep(440, 0.05); };
    document.getElementById("ccw").onclick = function () { obj.rot -= Math.PI / 2; beep(400, 0.05); };
    document.getElementById("ok").onclick = confirm;
  })();
  </script>
</body>
</html>
