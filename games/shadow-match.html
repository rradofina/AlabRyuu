<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Shadow Match</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background: #0b1026; color: #e2e8f0; touch-action: none; user-select: none; }
    button { background: transparent; border: 0; appearance: none; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .home { position: fixed; top: 12px; left: 12px; z-index: 12; color: #fff; text-decoration: none; font-weight: 800; font-size: 17px; background: rgba(0,0,0,.32); padding: 8px 14px; border-radius: 999px; touch-action: manipulation; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 12px; right: 12px; z-index: 8; font-weight: 800; text-align: right; pointer-events: none; }
    #hud b { display: inline-block; background: rgba(255,255,255,.12); padding: 6px 12px; border-radius: 999px; margin-left: 6px; font-size: 14px; }
    #say { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 8; font-weight: 800; color: #fde68a; pointer-events: none; text-align: center; width: 92%; }
    #spin { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 8; display: none; gap: 10px; }
    #spin.on { display: flex; }
    #spin button { background: #fde68a; color: #3b2100; font-weight: 800; font-size: 20px; padding: 12px 20px; border-radius: 999px; box-shadow: 0 6px 0 #b45309; }
    .cover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; gap: 8px; padding: 20px 20px 48px; pointer-events: none; }
    .cover.off { display: none; }
    .cover h1 { font-size: clamp(30px, 8vw, 46px); color: #fde68a; }
    .cover p { font-weight: 800; color: #e2e8f0; }
    .btn { pointer-events: auto; background: #ffd166; color: #3b2100; font-weight: 800; font-size: 24px; padding: 14px 28px; border-radius: 999px; box-shadow: 0 7px 0 #e09f1f; }
    .btn.g { background: #c4b5fd; color: #2e1065; box-shadow: 0 7px 0 #7c3aed; }
  </style>
</head>
<body>
  <a class="home" href="../index.html">← Home</a>
  <canvas id="c"></canvas>
  <div id="hud"><b id="sc">Park day</b><b id="st">⭐ 0</b></div>
  <div id="say">Turn the toy. Match the shadow!</div>
  <div id="spin">
    <button id="ccw">↺</button>
    <button id="ok">That's it!</button>
    <button id="cw">↻</button>
  </div>
  <div class="cover" id="title">
    <h1>Shadow Match</h1>
    <p>The sun moves. Shadows stretch.<br>Rotate. Night moon last!</p>
    <button class="btn" id="go">Play</button>
  </div>
  <div class="cover off" id="win">
    <h1>Light hero!</h1>
    <p id="winP">Five scenes matched.</p>
    <button class="btn g" id="again">Play again</button>
  </div>
  <script>
  (function () {
    var cv = document.getElementById("c"), g = cv.getContext("2d");
    var W, H, last = 0, t = 0, mode = "title", stars = 0, scene = 0, round = 0;
    var sun = { a: 0.3, ta: 0.3 }, obj = { e: "🦒", rot: 0, want: 0 }, choices = [];
    var stretch = 1, bits = [];

    var SCENES = [
      { n: "Park day", night: 0, items: ["🦒", "🌳", "🚲"], rounds: 3 },
      { n: "Beach noon", night: 0, items: ["🦩", "🌴", "⛵"], rounds: 3 },
      { n: "Farm dusk", night: 0, items: ["🐮", "🚜", "🌻"], rounds: 3 },
      { n: "City eve", night: 0, items: ["🚌", "🗽", "🐕"], rounds: 3 },
      { n: "Moon garden", night: 1, items: ["🦉", "🌵", "🚀"], rounds: 4 }
    ];

    function beep(f, d) {
      try {
        var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
        var o = ac.createOscillator(), gn = ac.createGain();
        o.type = "sine"; o.frequency.value = f; gn.gain.value = 0.07;
        o.connect(gn); gn.connect(ac.destination); o.start();
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.stop(ac.currentTime + d);
      } catch (e) {}
    }
    function lerp(a, b, p) { return a + (b - a) * p; }
    function rnd(a, b) { return a + Math.random() * (b - a); }

    function resize() {
      cv.width = innerWidth * (devicePixelRatio || 1);
      cv.height = innerHeight * (devicePixelRatio || 1);
      g.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0);
      W = innerWidth; H = innerHeight;
    }
    addEventListener("resize", resize); resize();

    function loadRound() {
      var S = SCENES[scene];
      obj.e = S.items[round % S.items.length];
      obj.rot = 0;
      obj.want = (Math.floor(rnd(0, 4)) * Math.PI) / 2;
      sun.ta = S.night ? 1.2 : 0.25 + round * 0.18 + scene * 0.08;
      stretch = 1;
      var pool = S.items.slice(), extra = ["🍎", "⭐", "🎈", "🦆"];
      extra.forEach(function (e) { if (pool.indexOf(e) < 0) pool.push(e); });
      choices = [obj.e];
      while (choices.length < 3) {
        var e = pool[Math.floor(rnd(0, pool.length))];
        if (choices.indexOf(e) < 0) choices.push(e);
      }
      choices.sort(function () { return Math.random() - 0.5; });
      document.getElementById("sc").textContent = S.n;
      document.getElementById("say").textContent = S.night ? "Moonlight stretch. Match the long shadow!" : "Turn the toy to the stretched shadow.";
    }

    function confirm() {
      if (mode !== "play") return;
      var diff = Math.abs(((obj.rot - obj.want + Math.PI * 8) % (Math.PI * 2)) - 0);
      diff = Math.min(diff, Math.PI * 2 - diff);
      if (diff < 0.45) {
        stars += 3; document.getElementById("st").textContent = "⭐ " + stars;
        beep(700, 0.1);
        var i; for (i = 0; i < 10; i++) bits.push({ x: W / 2, y: H * 0.42, vx: rnd(-80, 80), vy: rnd(-100, -20), life: 1, e: "✨" });
        round++;
        if (round >= SCENES[scene].rounds) {
          if (scene < SCENES.length - 1) { scene++; round = 0; document.getElementById("say").textContent = "New light!"; setTimeout(loadRound, 600); }
          else {
            mode = "win"; document.getElementById("spin").classList.remove("on");
            document.getElementById("win").classList.remove("off");
            document.getElementById("winP").textContent = "Five scenes. " + stars + " stars.";
            beep(880, 0.16);
          }
        } else setTimeout(loadRound, 500);
      } else {
        document.getElementById("say").textContent = "Almost! Turn a little more.";
        beep(200, 0.08);
      }
    }

    function drawSky() {
      var S = SCENES[scene] || SCENES[0];
      var grd = g.createLinearGradient(0, 0, 0, H);
      if (mode === "title") { grd.addColorStop(0, "#1e1b4b"); grd.addColorStop(1, "#312e81"); }
      else if (S.night) { grd.addColorStop(0, "#020617"); grd.addColorStop(0.5, "#1e1b4b"); grd.addColorStop(1, "#312e81"); }
      else { grd.addColorStop(0, "#7dd3fc"); grd.addColorStop(0.45, "#fdba74"); grd.addColorStop(1, "#78350f"); }
      g.fillStyle = grd; g.fillRect(0, 0, W, H);
      var ang = mode === "title" ? t * 0.2 : sun.a;
      var sx = W * 0.5 + Math.cos(ang) * W * 0.38;
      var sy = H * 0.18 + Math.sin(ang) * 40;
      g.fillStyle = (S && S.night && mode === "play") ? "#f8fafc" : "#fde047";
      g.beginPath(); g.arc(sx, sy, S && S.night && mode === "play" ? 18 : 26, 0, 6.28); g.fill();
      if (S && S.night && mode === "play") {
        g.fillStyle = "#020617"; g.beginPath(); g.arc(sx + 8, sy - 4, 14, 0, 6.28); g.fill();
        var i; g.fillStyle = "#fff";
        for (i = 0; i < 24; i++) { g.globalAlpha = 0.4 + 0.4 * Math.sin(t + i); g.fillRect((i * 53) % W, 16 + (i * 29) % 90, 2, 2); }
        g.globalAlpha = 1;
      }
    }

    function drawToy() {
      var ground = H * 0.62;
      g.fillStyle = "#1e293b"; g.fillRect(0, ground, W, H - ground);
      var sx = W * 0.5 + Math.cos(sun.a) * 80;
      var shLen = 40 + Math.abs(Math.cos(sun.a)) * 90 * stretch;
      var shAng = sun.a + Math.PI;
      g.save();
      g.translate(W / 2, ground);
      g.rotate(obj.want + shAng - Math.PI / 2);
      g.scale(1, 0.35 + Math.abs(Math.cos(sun.a)) * 0.55);
      g.globalAlpha = 0.45; g.filter = "grayscale(1) brightness(0.05)";
      g.font = "84px serif"; g.textAlign = "center"; g.textBaseline = "bottom";
      g.fillText(obj.e, 0, 0);
      g.filter = "none"; g.globalAlpha = 1; g.restore();

      g.save();
      g.translate(W / 2, ground - 10);
      g.rotate(obj.rot);
      g.font = "92px serif"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(obj.e, 0, -20);
      g.restore();

      g.fillStyle = "rgba(253,230,138,.15)";
      g.beginPath(); g.arc(W / 2, ground - 30, 70, 0, 6.28); g.fill();
    }

    function drawTitleSh() {
      drawSky();
      var i, es = ["🦒", "🚲", "🦉", "⛵", "🚀"];
      for (i = 0; i < 5; i++) {
        g.save();
        g.translate(W * (0.15 + i * 0.17), H * 0.5);
        g.rotate(t * 0.4 + i);
        g.font = "40px serif"; g.textAlign = "center"; g.fillText(es[i], 0, 0);
        g.restore();
        g.save();
        g.translate(W * (0.15 + i * 0.17), H * 0.62);
        g.scale(1, 0.35 + 0.2 * Math.sin(t + i));
        g.globalAlpha = 0.35; g.font = "40px serif"; g.textAlign = "center";
        g.fillText(es[i], 0, 0); g.restore(); g.globalAlpha = 1;
      }
    }

    
    var smAmb = { t: 0, bits: [], ok: 0, motes: [], walk: 0, sayI: 0 };
    var smAmbE = ["☀️", "🌙", "⭐", "🕯️", "🦒", "🚲", "🦉", "🚀"];
    var smAmbC = ["#fde68a", "#1e1b4b", "#312e81", "#fbbf24", "#c4b5fd"];
    var smAmbL = ["Sun angle stretches shadows.", "Quarter turns are kid-easy.", "Moon round is silver.", "Giraffe shadow is a tall joke.", "City eve makes long buses.", "Light likes matching shapes.", "Rotate, peek, smile.", "Confirm when it feels right."];
    function smAmbBoot() {
      var i;
      smAmb.bits = [];
      smAmb.motes = [];
      smAmb.ok = 1;
      for (i = 0; i < 28; i++) {
        smAmb.bits.push({
          e: smAmbE[i % smAmbE.length],
          x: Math.random() * (W || 360),
          y: 70 + Math.random() * ((H || 640) * 0.22),
          vx: -12 + Math.random() * 24,
          ph: Math.random() * 6.28,
          s: 0.7 + Math.random() * 0.7
        });
      }
      for (i = 0; i < 40; i++) {
        smAmb.motes.push({
          x: Math.random() * (W || 360),
          y: Math.random() * (H || 640),
          r: 1 + Math.random() * 2,
          ph: Math.random() * 6,
          c: smAmbC[i % smAmbC.length]
        });
      }
    }
    function smAmbStep(dt) {
      if (!smAmb.ok) smAmbBoot();
      smAmb.t += dt;
      smAmb.walk += dt;
      smAmb.bits.forEach(function (b) {
        b.x += b.vx * dt;
        b.ph += dt;
        if (b.x < -20) b.x = (W || 360) + 20;
        if (b.x > (W || 360) + 20) b.x = -20;
      });
      smAmb.motes.forEach(function (m) { m.ph += dt * 1.4; });
      if (Math.floor(smAmb.t * 0.35) !== smAmb.sayI) smAmb.sayI = Math.floor(smAmb.t * 0.35);
    }
    function smAmbFrame() {
      g.strokeStyle = smAmbC[2];
      g.lineWidth = 7;
      g.strokeRect(3, 3, (W || 360) - 6, (H || 640) - 6);
      g.strokeStyle = "rgba(255,255,255,.18)";
      g.lineWidth = 2;
      g.strokeRect(9, 9, (W || 360) - 18, (H || 640) - 18);
    }
    function smAmbMotes() {
      smAmb.motes.forEach(function (m) {
        g.globalAlpha = 0.12 + 0.1 * Math.sin(m.ph);
        g.fillStyle = m.c;
        g.beginPath();
        g.arc(m.x, m.y, m.r, 0, 6.28);
        g.fill();
        g.globalAlpha = 1;
      });
    }
    function smAmbFloaters() {
      smAmb.bits.forEach(function (b) {
        g.save();
        g.globalAlpha = 0.55;
        g.translate(b.x, b.y + Math.sin(b.ph * 2) * 4);
        g.rotate(Math.sin(b.ph) * 0.2);
        g.font = (15 * b.s) + "px serif";
        g.textAlign = "center";
        g.fillText(b.e, 0, 0);
        g.restore();
        g.globalAlpha = 1;
      });
    }
    function smAmbLanterns() {
      var i, x, y;
      for (i = 0; i < 7; i++) {
        x = 18 + i * (((W || 360) - 36) / 6);
        y = 22 + Math.sin(smAmb.t * 3 + i) * 3;
        g.fillStyle = smAmbC[i % smAmbC.length];
        g.beginPath();
        g.arc(x, y, 4.5, 0, 6.28);
        g.fill();
        g.strokeStyle = "rgba(255,255,255,.35)";
        g.beginPath();
        g.moveTo(x, y + 4);
        g.lineTo(x, y + 12);
        g.stroke();
      }
    }
    function smAmbWalkers() {
      var i, x;
      for (i = 0; i < 3; i++) {
        x = ((smAmb.walk * 28 + i * 150) % ((W || 360) + 50)) - 25;
        g.save();
        g.translate(x, (H || 640) * 0.92);
        g.scale(1, 1 + Math.sin(smAmb.walk * 8 + i) * 0.07);
        g.font = "18px serif";
        g.textAlign = "center";
        g.fillText(smAmbE[i % smAmbE.length], 0, 0);
        g.restore();
      }
    }
    function smAmbCaption() {
      var msg = smAmbL[smAmb.sayI % smAmbL.length];
      g.globalAlpha = 0.55;
      g.fillStyle = "#fff";
      g.font = "bold 11px Trebuchet MS";
      g.textAlign = "left";
      g.fillText(msg, 14, (H || 640) - 8);
      g.globalAlpha = 1;
    }
    function smAmbRibbon() {
      g.save();
      g.translate((W || 360) / 2, 34);
      g.rotate(Math.sin(smAmb.t * 2) * 0.03);
      g.fillStyle = smAmbC[2];
      g.beginPath();
      g.moveTo(-74, -7);
      g.lineTo(74, -7);
      g.lineTo(82, 11);
      g.lineTo(-82, 11);
      g.closePath();
      g.fill();
      g.fillStyle = "#fff";
      g.font = "bold 11px Trebuchet MS";
      g.textAlign = "center";
      g.fillText(smAmbL[(smAmb.sayI + 1) % smAmbL.length], 0, 6);
      g.restore();
    }
    function smAmbHorizon() {
      var x;
      g.strokeStyle = smAmbC[1];
      g.lineWidth = 2;
      g.globalAlpha = 0.2;
      g.beginPath();
      g.moveTo(0, (H || 640) * 0.8);
      for (x = 0; x <= (W || 360); x += 8) {
        g.lineTo(x, (H || 640) * 0.8 + Math.sin(x * 0.05 + smAmb.t) * 4);
      }
      g.stroke();
      g.globalAlpha = 1;
    }
    function smAmbVignette() {
      var grd = g.createRadialGradient((W||360)/2, (H||640)/2, (W||360)*0.35, (W||360)/2, (H||640)/2, (W||360)*0.75);
      grd.addColorStop(0, "rgba(0,0,0,0)");
      grd.addColorStop(1, "rgba(0,0,0,0.12)");
      g.fillStyle = grd;
      g.fillRect(0, 0, W || 360, H || 640);
    }
    function smAmbPaint() {
      if (!smAmb.ok) smAmbBoot();
      smAmbMotes();
      smAmbFloaters();
      smAmbLanterns();
      smAmbHorizon();
      smAmbWalkers();
      smAmbRibbon();
      smAmbCaption();
      smAmbFrame();
      smAmbVignette();
    }

    function smAmbExtra1() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + smAmb.t * 0.3 + 1;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 4);
        y = 46 + Math.sin(a * 2) * (6 + 1);
        g.globalAlpha = 0.22;
        g.fillStyle = smAmbC[i % smAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = smAmbC[1 % smAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 1) + Math.sin(i * 0.5 + smAmb.t + 1) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function smAmbExtra2() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + smAmb.t * 0.4 + 2;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 8);
        y = 46 + Math.sin(a * 2) * (6 + 2);
        g.globalAlpha = 0.22;
        g.fillStyle = smAmbC[i % smAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = smAmbC[2 % smAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 2) + Math.sin(i * 0.5 + smAmb.t + 2) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function smAmbExtra3() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + smAmb.t * 0.5 + 3;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 12);
        y = 46 + Math.sin(a * 2) * (6 + 3);
        g.globalAlpha = 0.22;
        g.fillStyle = smAmbC[i % smAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = smAmbC[3 % smAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 3) + Math.sin(i * 0.5 + smAmb.t + 3) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function smAmbExtra4() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + smAmb.t * 0.6 + 4;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 16);
        y = 46 + Math.sin(a * 2) * (6 + 4);
        g.globalAlpha = 0.22;
        g.fillStyle = smAmbC[i % smAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = smAmbC[4 % smAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 4) + Math.sin(i * 0.5 + smAmb.t + 4) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function smAmbExtra5() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + smAmb.t * 0.7 + 5;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 20);
        y = 46 + Math.sin(a * 2) * (6 + 5);
        g.globalAlpha = 0.22;
        g.fillStyle = smAmbC[i % smAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = smAmbC[5 % smAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 5) + Math.sin(i * 0.5 + smAmb.t + 5) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function smAmbExtra6() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + smAmb.t * 0.8 + 6;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 24);
        y = 46 + Math.sin(a * 2) * (6 + 6);
        g.globalAlpha = 0.22;
        g.fillStyle = smAmbC[i % smAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = smAmbC[6 % smAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 6) + Math.sin(i * 0.5 + smAmb.t + 6) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function smAmbExtra7() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + smAmb.t * 0.9 + 7;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 28);
        y = 46 + Math.sin(a * 2) * (6 + 7);
        g.globalAlpha = 0.22;
        g.fillStyle = smAmbC[i % smAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = smAmbC[7 % smAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 7) + Math.sin(i * 0.5 + smAmb.t + 7) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function smAmbExtra8() {
      var i, a, x, y;
      for (i = 0; i < 16; i++) {
        a = i / 16 * 6.28 + smAmb.t * 0.10 + 8;
        x = (W || 360) * 0.5 + Math.cos(a) * (30 + i * 3 + 32);
        y = 46 + Math.sin(a * 2) * (6 + 8);
        g.globalAlpha = 0.22;
        g.fillStyle = smAmbC[i % smAmbC.length];
        g.beginPath(); g.arc(x, y, 2 + (i % 3), 0, 6.28); g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = smAmbC[8 % smAmbC.length];
      g.globalAlpha = 0.15; g.lineWidth = 2; g.beginPath();
      for (i = 0; i <= 20; i++) {
        x = i / 20 * (W || 360);
        y = (H || 640) * (0.14 + 0.03 * 8) + Math.sin(i * 0.5 + smAmb.t + 8) * 8;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke(); g.globalAlpha = 1;
    }
    function update(dt) {
      smAmbStep(typeof dt === 'number' ? dt : 0.016);
      t += dt;
      sun.a = lerp(sun.a, mode === "title" ? 0.4 + Math.sin(t * 0.4) * 0.3 : sun.ta, 1 - Math.pow(0.02, dt));
      stretch = 1 + Math.abs(Math.cos(sun.a)) * 0.8;
      bits.forEach(function (b) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; });
      bits = bits.filter(function (b) { return b.life > 0; });
    }

    function draw() {
      if (mode === "title" || mode === "win") { drawTitleSh(); return; }
      drawSky(); drawToy();
      bits.forEach(function (b) {
        g.globalAlpha = b.life; g.font = "16px serif"; g.textAlign = "center";
        g.fillText(b.e, b.x, b.y); g.globalAlpha = 1;
      });
      smAmbPaint();
      smAmbExtra1();
      smAmbExtra2();
      smAmbExtra3();
      smAmbExtra4();
      smAmbExtra5();
      smAmbExtra6();
      smAmbExtra7();
      smAmbExtra8();

    }

    function loop(now) {
      var dt = Math.min(0.033, (now - last) / 1000 || 0.016);
      last = now; update(dt); draw(); requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function start() {
      mode = "play"; scene = 0; round = 0; stars = 0;
      document.getElementById("title").classList.add("off");
      document.getElementById("win").classList.add("off");
      document.getElementById("spin").classList.add("on");
      document.getElementById("st").textContent = "⭐ 0";
      loadRound(); beep(500, 0.1);
    }
    document.getElementById("go").onclick = start;
    document.getElementById("again").onclick = function () { document.getElementById("win").classList.add("off"); start(); };
    document.getElementById("cw").onclick = function () { obj.rot += Math.PI / 2; beep(440, 0.05); };
    document.getElementById("ccw").onclick = function () { obj.rot -= Math.PI / 2; beep(400, 0.05); };
    document.getElementById("ok").onclick = confirm;
  })();
