<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AlabRyuu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      background: #0b0830;
      color: #fff;
      touch-action: manipulation;
    }
    body {
      background:
        radial-gradient(circle at 20% 0%, #5b2cff 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, #ff4d8d 0%, transparent 35%),
        #0b0830;
      padding: 28px 18px 48px;
    }
    header { text-align: center; margin-bottom: 28px; }
    .logo { font-size: 42px; line-height: 1; }
    h1 {
      font-size: clamp(36px, 9vw, 52px);
      letter-spacing: -1px;
      text-shadow: 0 5px 0 #3b1d8f;
    }
    .sub { opacity: .85; font-size: 18px; margin-top: 6px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      max-width: 720px;
      margin: 0 auto;
    }
    .card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      background: #16124a;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 0 rgba(0,0,0,.28);
      transform: translateY(0);
    }
    .card:active { transform: translateY(4px); box-shadow: 0 6px 0 rgba(0,0,0,.28); }
    .card.soon { opacity: .72; pointer-events: none; }
    .art {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
    }
    .art.earth { background: linear-gradient(160deg, #1e3a8a, #22c55e 70%); }
    .art.dino { background: linear-gradient(160deg, #14532d, #84cc16); }
    .art.paint { background: linear-gradient(160deg, #7c3aed, #f472b6); }
    .art.star { background: linear-gradient(160deg, #1e293b, #fbbf24); }
    .art.fish { background: linear-gradient(160deg, #0e7490, #67e8f9); }
    .meta { padding: 12px 14px 16px; }
    .name { font-size: 20px; font-weight: 800; }
    .tag { font-size: 14px; opacity: .75; margin-top: 2px; }
    .pill {
      display: inline-block;
      margin-top: 10px;
      background: #ffd166;
      color: #3b2100;
      font-weight: 800;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 999px;
    }
    .pill.soon { background: #334155; color: #e2e8f0; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🦖✨</div>
    <h1>AlabRyuu</h1>
    <p class="sub">Alab's games. Tap a card to play.</p>
  </header>

  <main class="grid">
    <a class="card" href="earth.html">
      <div class="art earth">🌍</div>
      <div class="meta">
        <div class="name">Little Earth</div>
        <div class="tag">Grow the world</div>
        <span class="pill">Play</span>
      </div>
    </a>

    <div class="card soon">
      <div class="art dino">🦕</div>
      <div class="meta">
        <div class="name">Dino Stomp</div>
        <div class="tag">Coming soon</div>
        <span class="pill soon">Soon</span>
      </div>
    </div>

    <div class="card soon">
      <div class="art paint">🎨</div>
      <div class="meta">
        <div class="name">Color Mix</div>
        <div class="tag">Coming soon</div>
        <span class="pill soon">Soon</span>
      </div>
    </div>

    <div class="card soon">
      <div class="art star">⭐</div>
      <div class="meta">
        <div class="name">Star Catch</div>
        <div class="tag">Coming soon</div>
        <span class="pill soon">Soon</span>
      </div>
    </div>

    <div class="card soon">
      <div class="art fish">🐟</div>
      <div class="meta">
        <div class="name">Fish Friends</div>
        <div class="tag">Coming soon</div>
        <span class="pill soon">Soon</span>
      </div>
    </div>
  </main>
</body>
</html>
